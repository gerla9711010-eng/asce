築物公共安全檢查簽證及申報辦法 第1條】\n本辦法依建築法（以下簡稱本法）第七十七條第五項規定訂定之。", "note": "公共安全檢查簽證及申報辦法，依據建築法訂定。", "full": "【建築物公共安全檢查簽證及申報辦法 第1條】\n本辦法依建築法（以下簡稱本法）第七十七條第五項規定訂定之。\n\n【建築法 第77條】\n第三項之檢查簽證事項、檢查期間、申報方式及施行日期，由內政部定之。", "opts": ["不是消保法", "", "不是公寓大廈管理條例", "不是消防法"]}, "8-4-05": {"law": "【建築物公共安全檢查簽證及申報辦法 第3條】\n建築物公共安全檢查申報範圍如下：\n一、防火避難設施及設備安全標準檢查。", "note": "增加防空避難設備檢查，題庫答案是114年7月1日起。", "full": "【建築物公共安全檢查簽證及申報辦法 第3條】\n建築物公共安全檢查申報範圍如下：\n一、防火避難設施及設備安全標準檢查。\n二、耐震能力評估檢查。", "flag": "我抓到的現行辦法條文裡，沒有看到「防空避難設備檢查」這一項，無法對照 114 年 7 月 1 日的生效日。考試記題庫答案 B。", "opts": ["113年不對", "", "已生效", "不是各縣市公布"]}, "8-4-06": {"law": "【建築物公共安全檢查簽證及申報辦法 第4條】\n前項建築物為公寓大廈者，得由其管理委員會主任委員或管理負責人代為申報。建築物同屬一使用人使用者，該使用人得代為申報耐震能力評估檢查。", "note": "公寓大廈可由主委或管理負責人代為申報。", "full": "【建築物公共安全檢查簽證及申報辦法 第4條】\n建築物公共安全檢查申報人（以下簡稱申報人）規定如下：\n一、防火避難設施及設備安全標準檢查，為建築物所有權人或使用人。\n前項建築物為公寓大廈者，得由其管理委員會主任委員或管理負責人代為申報。建築物同屬一使用人使用者，該使用人得代為申報耐震能力評估檢查。", "opts": ["", "里長不能代", "檢查公司不能代", "消防公司不能代"]}, "8-4-07": {"law": "【建築物公共安全檢查簽證及申報辦法 第2條】\n本辦法用詞，定義如下：\n四、標準檢查：指就建築物之現況檢查是否符合其建造、變更使用、室內裝修時之建築相關法令規定。", "note": "防火避難設施標準檢查，依「實際現況用途」檢查。", "opts": ["", "不是使用執照", "不是建照", "不是權狀"]}, "8-4-08": {"law": "【公共安全檢查簽證及申報辦法 第5條】防火避難設施及設備安全標準檢查申報期間及施行日期，如附表一。（頻率與期間在附表一，條文本身沒有數字）", "note": "集合住宅16層以上，題庫答案是每2年1次。", "flag": "頻率寫在辦法的附表一（表格），我無法逐字貼上。內容依題庫。", "opts": ["不是看縣市公告", "不是每年1次", "", "不是每4年1次"]}, "8-4-09": {"law": "【公共安全檢查簽證及申報辦法 第5條】防火避難設施及設備安全標準檢查申報期間及施行日期，如附表一。（頻率與期間在附表一，條文本身沒有數字）", "note": "集合住宅辦理檢查簽證及申報，題庫答案是第1季。", "flag": "申報期間寫在辦法的附表一（表格），我無法逐字貼上。內容依題庫。", "opts": ["", "不是第2季", "不是第3季", "不是第4季"]}, "8-4-10": {"law": "（這題屬建築物設備維護實務教材，沒有對應的法條原文）", "note": "住宅大門更新，要選與原大門同等以上防火時效的產品。", "opts": ["外觀華麗不是考量", "價格不是防火考量", "多段鎖不是防火", ""]}, "8-4-11": {"law": "【消防法 第2條】\n本法所稱管理權人係指依法令或契約對各該場所有實際支配管理權者；其屬法人者，為其負責人。", "note": "對場所有實際支配管理權的人，叫「管理權人」。", "opts": ["防火管理人是另一個角色", "", "管理負責人不是", "管委會不是"]}, "8-4-12": {"law": "【消防法 第7條】\n依各類場所消防安全設備設置標準設置之消防安全設備，其設計、監造應由消防設備師為之；其測試、檢修應由消防設備師或消防設備士為之。", "note": "消防設備的檢修，要由消防設備師或消防設備士做。", "opts": ["防火管理人不能檢修", "管理服務人不能檢修", "技術類管理人不能檢修", ""]}, "8-4-13": {"law": "【消防法 第12條】\n經中央主管機關公告應實施認可之消防機具、器材及設備，非經中央主管機關所登錄機構之認可，並附加認可標示者，不得銷售、陳列或設置使用。", "note": "應認可的消防器材，沒登錄認可就不能銷售、陳列、設置使用。", "full": "【消防法 第12條】\n經中央主管機關公告應實施認可之消防機具、器材及設備，非經中央主管機關所登錄機構之認可，並附加認可標示者，不得銷售、陳列或設置使用。\n前項所定認可，應依序實施型式認可及個別認可。但因性質特殊，經中央主管機關認定者，得不依序實施。\n第一項所定經中央主管機關公告應實施認可之消防機具、器材及設備，其申請認可之資格、程序、應備文件、審核方式、認可有效期間、撤銷、廢止、標示之規格樣式、附加方式、註銷、除去及其他應遵行事項之辦法，由中央主管機關定之。\n第一項所定登錄機構辦理認可所需費用，由申請人負擔，其收費項目及費額，由該登錄機構報請中央主管機關核定。\n第一項所定消防機具、器材及設備之構造、材質、性能、認可試驗內容、批次之認定、試驗結果之判定、主要試驗設備及其他相關事項之標準，分別由中央主管機關定之。\n第一項所定登錄機構，其申請登錄之資格、程序、應備文件、審核方式、登錄證書之有效期間、核（換）發、撤銷、廢止、管理及其他應遵行事項之辦法，由中央主管機關定之。", "opts": ["不能銷售", "不能陳列", "", "不能陳列也不能銷售"]}, "8-4-14": {"law": "（這題屬建築物設備維護實務教材，沒有對應的法條原文）", "note": "防火避難設施自行檢查，每月至少1次。", "flag": "依據是消防防護計畫作業規定，我沒有抓到原文，內容依題庫。", "opts": ["", "不用2次", "不用3次", "不用4次"]}, "8-4-15": {"law": "【消防法 第13條】\n第一項建築物遇有增建、改建、修建、變更使用或室內裝修施工致影響原有系統式消防安全設備功能時，其管理權人應責由防火管理人另定施工中消防防護計畫。", "note": "室內裝修施工要另訂「施工中消防防護計畫」，監督施工單位用火用電。", "full": "【消防法 第13條】\n一定規模以上之建築物，應由管理權人遴用防火管理人，責其訂定消防防護計畫。\n第一項建築物遇有增建、改建、修建、變更使用或室內裝修施工致影響原有系統式消防安全設備功能時，其管理權人應責由防火管理人另定施工中消防防護計畫。", "opts": ["申請變更使用不是", "拆除不是", "", "換防焰窗簾不是"]}, "8-4-16": {"law": "【消防法 第14-1條】\n供公眾使用建築物及中央主管機關公告之場所，除其他法令另有規定外，非經場所之管理權人申請主管機關許可，不得使用以產生火焰、火花或火星等方式，進行表演性質之活動。", "note": "公眾使用場所要用明火表演，向消防機關申請許可。", "opts": ["不是看層數", "不是裝修許可", "", "不是環保機關"]}, "8-4-17": {"law": "【消防法 第9條】\n第六條第一項所定各類場所之管理權人，應依下列規定，定期檢修消…\n一、高層建築物、地下建築物或中央主管機關公告之場所：委託中央主管機關許可之消防安全設備檢修專業機構辦理。", "note": "集合住宅消防設備檢修申報，題庫答案是每年1次。", "full": "【消防法 第9條】\n第六條第一項所定各類場所之管理權人，應依下列規定，定期檢修消防安全設備；其檢修結果，應依規定期限報請場所所在地主管機關審核，主管機關得派員複查；場所有歇業或停業之情形者，亦同。但各類場所所在之建築物整棟已無使用之情形，該場所之管理權人報請場所所在地主管機關審核同意後至該建築物恢復使用前，得免定期辦理消防安全設備檢修及檢修結果申報：\n一、高層建築物、地下建築物或中央主管機關公告之場所：委託中央主管機關許可之消防安全設備檢修專業機構辦理。\n二、前款以外一定規模以上之場所：委託消防設備師或消防設備士辦理。\n三、前二款以外僅設有滅火器、標示設備或緊急照明燈等非系統式消防安全設備之場所：委託消防設備師、消防設備士或由管理權人自行辦理。", "flag": "消防法第 9 條把頻率授權給辦法訂定，條文本身沒有「每年」兩個字。內容依題庫。", "opts": ["", "不是每半年", "不是每季", "不是每2個月"]}, "8-4-18": {"law": "（這題屬建築物設備維護實務教材，沒有對應的法條原文）", "note": "沒有使用執照或違規使用的場所，檢修申報依「實際用途」。", "opts": ["不是甲類", "不是都計規定", "", "不是乙類"]}, "8-4-19": {"law": "（這題屬建築物設備維護實務教材，沒有對應的法條原文）", "note": "防火鐵捲門下面要保持淨空，放東西或停車會關不起來。", "opts": ["下方不能停車", "平常要能關閉", "下方不能放盆栽", ""]}, "8-4-20": {"law": "【公寓大廈管理條例 第16條】\n住戶不得於私設通路、防火間隔、防火巷弄、開放空間、退縮空地、樓梯間、共同走廊、防空避難設備等處所堆置雜物、設置柵欄、門扇或營業使用，或違規設置廣告物或私設路障及停車位侵占巷道妨礙出入。…", "note": "共同走廊不能堆東西，會妨礙逃生。", "full": "【公寓大廈管理條例 第16條】\n住戶不得任意棄置垃圾、排放各種污染物、惡臭物質或發生喧囂、振動及其他與此相類之行為。\n住戶不得於私設通路、防火間隔、防火巷弄、開放空間、退縮空地、樓梯間、共同走廊、防空避難設備等處所堆置雜物、設置柵欄、門扇或營業使用，或違規設置廣告物或私設路障及停車位侵占巷道妨礙出入。但開放空間及退縮空地，在直轄市、縣（市）政府核准範圍內，得依規約或區分所有權人會議決議供營業使用；防空避難設備，得為原核准範圍之使用；其兼作停車空間使用者，得依法供公共收費停車使用。", "opts": ["儲藏室可以放", "露臺不是共同避難", "陽臺不是共同走廊", ""]}, "8-4-21": {"law": "（這題屬建築物設備維護實務教材，沒有對應的法條原文）", "note": "發電機和蓄電池的處所要散熱，可在牆壁加通風開口，但還是要防火時效構造。", "opts": ["加通風扇不是題庫答案", "時控不是散熱", "開口不是60平方公分", ""]}, "8-4-22": {"law": "【建築技術規則建築設備編 第25條】\n一、避雷導線須與電力線、電話線、燃氣設備之供氣管路離開一公尺以上。", "note": "屋頂夜間照明電力線，要離避雷導線1公尺以上。", "opts": ["", "2公尺不對", "3公尺不對", "5公尺不對"]}, "8-4-23": {"law": "【各類場所消防安全設備設置標準 第177條】\n前項緊急電源應使用蓄電池設備，其容量應能使其持續動作三十分鐘以上。但採蓄電池設備與緊急發電機併設方式時，其容量應能使其持續動作分別為十分鐘及三十分鐘以上。", "note": "緊急照明燈的緊急電源，要能持續30分鐘以上。", "full": "【各類場所消防安全設備設置標準 第177條】\n緊急照明設備應連接緊急電源。\n前項緊急電源應使用蓄電池設備，其容量應能使其持續動作三十分鐘以上。但採蓄電池設備與緊急發電機併設方式時，其容量應能使其持續動作分別為十分鐘及三十分鐘以上。", "opts": ["5分鐘太短", "", "60分鐘太長", "90分鐘太長"]}, "8-4-24": {"law": "【建築技術規則建築設計施工編 第85條】\n貫穿防火區劃牆壁或樓地板之風管，應在貫穿部位任一側之風管內裝設防火閘門或閘板，其與貫穿部位合成之構造，並應具有一小時以上之防火時效。", "note": "換氣風管穿過防火區劃，要裝防火閘門，防火時效1小時以上。", "opts": ["30分鐘太短", "", "90分鐘不對", "120分鐘不對"]}, "8-4-25": {"law": "【建築技術規則建築設計施工編 第259條】\n四、高層建築物左列各種防災設備，其顯示裝置及控制應設於防災中心：……（六）燃氣設備及使用導管瓦斯者，應設置之瓦斯緊急遮斷設備。", "note": "高層建築的瓦斯緊急遮斷設備，設在防災中心。", "full": "【建築技術規則建築設計施工編 第243條】\n高層建築物地板面高度在五十公尺或樓層在十六層以上部分，除住宅、餐廳等係建築物機能之必要時外，不得使用燃氣設備。\n\n（這題屬建築物設備維護實務教材，沒有對應的法條原文）", "opts": ["不是進入端", "不是屋頂", "不是避難層", ""]}, "8-5-01": {"law": "【建築法 第97條】\n有關建築規劃、設計、施工、構造、設備之建築技術規則，由中央主管建築機關定之，並應落實建構兩性平權環境之政策。", "note": "建築技術規則由內政部訂定，全國適用。", "opts": ["不是立法院三讀", "", "不是各縣市", "不是目的事業機關"]}, "8-5-02": {"law": "【建築法 第4條】\n本法所稱建築物，為定著於土地上或地面下具有頂蓋、樑柱或牆壁，供個人或公眾使用之構造物或雜項工作物。", "note": "建築物要定著在土地上，有頂蓋、樑柱或牆壁。1層平房是；貨櫃、船、露營車不是。", "opts": ["貨櫃不是建築物", "船舶不是建築物", "", "露營車不是建築物"]}, "8-5-03": {"law": "【建築法 第73條】\n建築物非經領得使用執照，不准接水、接電及使用。但直轄市、縣（市）政府認有左列各款情事之一者，得另定建築物接用水、電相關規定：", "note": "沒領使用執照，不准接水接電使用。", "opts": ["建造執照是蓋之前", "雜項執照不是", "拆除執照不是", ""]}, "8-5-04": {"law": "【建築法 第77條】\n建築物所有權人、使用人應維護建築物合法使用與其構造及設備安全。", "note": "維護建築物合法使用和安全的是所有權人和使用人。", "opts": ["中央機關是主管", "地方機關是主管", "管理服務人員不是", ""]}, "8-5-05": {"law": "【建築法 第77條】\n供公眾使用之建築物，應由建築物所有權人、使用人定期委託中央主管建築機關認可之專業機構或人員檢查簽證，其檢查簽證結果應向當地主管建築機關申報。非供公眾使用之建築物，經內政部認有必要時亦同。", "note": "供公眾使用的建築物，要定期專業檢查簽證。", "opts": ["集合住宅不一定", "不是看戶數", "", "出租不是看這個"]}, "8-5-06": {"law": "【建築法 第77-2條】\n建築物室內裝修應遵守左列規定：\n一、供公眾使用建築物之室內裝修應申請審查許可，非供公眾使用建築物，經內政部認有必要時，亦同。但中央主管機關得授權建築師公會或其他相關專業技術團體審查。", "note": "供公眾使用的建築物，室內裝修要申請審查許可。", "opts": ["不是不受法令限制", "", "不能暫停消防設備", "不用跟房客磋商"]}, "8-5-07": {"law": "【建築法 第77-2條】\n建築物室內裝修應遵守左列規定：\n二、裝修材料應合於建築技術規則之規定。", "note": "裝修材料要合建築技術規則。防火門、灑水設備不能自己拆。", "full": "【建築法 第77-2條】\n建築物室內裝修應遵守左列規定：\n二、裝修材料應合於建築技術規則之規定。\n三、不得妨害或破壞防火避難設施、消防設備、防火區劃及主要構造。", "opts": ["", "美感不是規定", "防火門不能拆", "灑水設備不能拆"]}, "8-5-08": {"law": "【建築法 第77-2條】\n建築物室內裝修應遵守左列規定：\n四、不得妨害或破壞保護民眾隱私權設施。", "note": "室內裝修不能破壞保護隱私的設施。", "opts": ["", "沒有禁止工業風", "不用鄰居同意", "不用樓下同意"]}, "8-5-09": {"law": "【建築法 第8條】\n本法所稱建築物之主要構造，為基礎、主要樑柱、承重牆壁、樓地板及屋頂之構造。", "note": "主要構造包含承重牆。外牆、非承重牆、天花板不是。", "opts": ["外牆不是", "", "非承重牆不是", "天花板不是"]}, "8-5-10": {"law": "【公寓大廈管理條例 第6條】\n住戶應遵守下列事項：\n五、其他法令或規約規定事項。", "note": "住戶裝修除了法令，還要守「公寓大廈規約」。", "opts": ["房東規定不是法令", "代管業規定不是", "", "管理服務人員規定不是"]}, "8-5-11": {"law": "【建築法 第91條】\n有左列情形之一者，處建築物所有權人、使用人、機械遊樂設施之經…\n二、未依第七十七條第一項規定維護建築物合法使用與其構造及設備安全者。", "note": "沒維護建築物安全會被罰鍰、限期改善、補辦手續，沒有「解除租約」這種處分。", "full": "【建築法 第91條】\n有左列情形之一者，處建築物所有權人、使用人、機械遊樂設施之經營者新臺幣六萬元以上三十萬元以下罰鍰，並限期改善或補辦手續，屆期仍未改善或補辦手續而繼續使用者，得連續處罰，並限期停止其使用。必要時，並停止供水供電、封閉或命其於期限內自行拆除，恢復原狀或強制拆除：\n二、未依第七十七條第一項規定維護建築物合法使用與其構造及設備安全者。", "opts": ["會罰鍰", "會限期改善", "會補辦手續", ""]}, "8-5-12": {"law": "【建築法 第25條】\n建築物非經申請直轄市、縣（市）（局）主管建築機關之審查許可並發給執照，不得擅自建造或使用或拆除。但合於第七十八條及第九十八條規定者，不在此限。", "note": "沒領執照就擅自蓋的，叫違章建築。", "opts": ["違法使用是用途不對", "使用違規是用途不對", "越界建築是過界", ""]}, "8-5-13": {"law": "【建築法 第96-1條】\n依本法規定強制拆除之建築物均不予補償，其拆除費用由建築物所有人負擔。", "note": "依建築法強制拆除的違建，不補償，拆除費用由所有人付。", "opts": ["不是地方機關", "不是中央機關", "", "不是管委會"]}, "8-5-14": {"law": "【各類場所消防安全設備設置標準 第116條】\n下列處所得免設探測器：\n三、洗手間、廁所或浴室。", "note": "火警探測器原則上廁所、浴室不裝。", "opts": ["居室要裝", "小孩臥室要裝", "", "倉庫要裝"]}, "8-5-15": {"law": "【各類場所消防安全設備設置標準 第31條】\n四、固定放置於取用方便之明顯處所，並設有以紅底白字標明滅火器字樣之標識，其每字應在二十平方公分以上。但與室內消防栓箱等設備併設於箱體內並於箱面標明滅火器字樣者，其標識顏色不在此限。", "note": "滅火器要放在明顯處，用紅底白字標示。", "opts": ["", "不是白底綠字", "不是綠底白字", "不是白底黑字"]}, "8-5-16": {"law": "（這題屬建築物設備維護實務教材，沒有對應的法條原文）", "note": "消防栓箱面的顏色，法規沒有明文規定。", "opts": ["法規沒規定紅色", "法規沒規定紅底白字", "法規沒規定白底紅字", ""]}, "8-5-17": {"law": "【各類場所消防安全設備設置標準 第38條】\n室內消防栓設備之緊急電源，應使用發電機設備或蓄電池設備，其供電容量應供其有效動作三十分鐘以上。", "note": "室內消防栓的緊急電源，要能撐30分鐘以上。", "opts": ["10分鐘太短", "", "60分鐘太長", "90分鐘太長"]}, "8-5-18": {"law": "（這題屬建築物設備維護實務教材，沒有對應的法條原文）", "note": "緊急電源插座的表示燈是紅色。", "opts": ["不是白色", "不是綠色", "不是黃色", ""]}, "8-5-19": {"law": "（這題屬建築物設備維護實務教材，沒有對應的法條原文）", "note": "防災中心要設緊急廣播設備。", "opts": ["空調不是", "上網不是", "休息不是", ""]}, "8-5-20": {"law": "【建築技術規則建築設備編 第110條】\n供昇降機廂上下運轉之昇降機道，應依下列規定：\n五、昇降機出入口處之樓地板面，應與機廂地板面保持平整，其與機廂地板面邊緣之間隙，不得大於四公分。", "note": "電梯樓地板和機廂的間隙，不得大於4公分。", "opts": ["1公分太小", "2公分太小", "3公分太小", ""]}, "8-5-21": {"law": "【建築技術規則建築設備編 第14條】\n二、設置於屋外者，其電源回路之配線應採用電纜。", "note": "屋外的招牌廣告燈，電源配線用「電纜」。", "opts": ["膠皮線不耐候", "花線不適合戶外", "", "IV線不適合戶外"]}, "9-1-01": {"law": "【建築法 第77-2條】\n建築物室內裝修應遵守左列規定：\n一、供公眾使用建築物之室內裝修應申請審查許可，非供公眾使用建築物，經內政部認有必要時，亦同。但中央主管機關得授權建築師公會或其他相關專業技術團體審查。\n\n【建築物室內裝修管理辦法 第22條】\n供公眾使用建築物或經內政部認定之非供公眾使用建築物之室內裝修，建築物起造人、所有權人或使用人應向直轄市、縣（市）主管建築機關或審查機構申請審核圖說，審核合格並領得直轄市、縣（市）主管建築機關發給之許可文件後，始得施工。", "note": "公眾使用建築物的室內裝修，依「建築物室內裝修管理辦法」辦理。", "opts": ["建築法是母法", "", "設計施工編不是裝修辦法", "營造業法不是"]}, "9-1-02": {"law": "【建築物室內裝修管理辦法 第3條】\n本辦法所稱室內裝修，指除壁紙、壁布、窗簾、家具、活動隔屏、地…\n一、固著於建築物構造體之天花板裝修。", "note": "室內裝修行為：固著在構造體的天花板、內部牆面、分間牆變更。壁紙、窗簾、活動隔屏、地氈不算。", "full": "【建築物室內裝修管理辦法 第3條】\n本辦法所稱室內裝修，指除壁紙、壁布、窗簾、家具、活動隔屏、地氈等之黏貼及擺設外之下列行為：\n一、固著於建築物構造體之天花板裝修。\n二、內部牆面裝修。", "opts": ["壁紙地氈不算", "壁布窗簾不算", "活動隔屏、固定櫥櫃不算", ""]}, "9-1-03": {"law": "【建築物室內裝修管理辦法 第3條】\n本辦法所稱室內裝修，指除壁紙、壁布、窗簾、家具、活動隔屏、地…\n三、高度超過地板面以上一點二公尺固定之隔屏或兼作櫥櫃使用之隔屏裝修。", "note": "固定隔屏高度超過1.2公尺，算室內裝修。活動隔屏、壁紙壁布不算。", "full": "【建築物室內裝修管理辦法 第3條】\n本辦法所稱室內裝修，指除壁紙、壁布、窗簾、家具、活動隔屏、地氈等之黏貼及擺設外之下列行為：\n三、高度超過地板面以上一點二公尺固定之隔屏或兼作櫥櫃使用之隔屏裝修。", "opts": ["活動隔屏不算", "", "家具牆變更不算", "壁紙壁布不算"]}, "9-1-04": {"law": "【建築物室內裝修管理辦法 第5條】\n室內裝修從業者業務範圍如下：\n一、依法登記開業之建築師得從事室內裝修設計業務。", "note": "建築師可做室內裝修「設計」；營造業做「施工」；室內裝修業設計施工都可以。", "full": "【建築物室內裝修管理辦法 第5條】\n室內裝修從業者業務範圍如下：\n一、依法登記開業之建築師得從事室內裝修設計業務。\n二、依法登記開業之營造業得從事室內裝修施工業務。\n三、室內裝修業得從事室內裝修設計或施工之業務。", "opts": ["取得資格還要登記開業", "", "設計師不能做施工", "營造業做施工，不做設計"]}, "9-1-05": {"law": "【建築物室內裝修管理辦法 第5條】\n室內裝修從業者業務範圍如下：\n三、室內裝修業得從事室內裝修設計或施工之業務。", "note": "室內裝修業，設計和施工都能做。", "full": "【建築物室內裝修管理辦法 第5條】\n室內裝修從業者業務範圍如下：\n一、依法登記開業之建築師得從事室內裝修設計業務。\n二、依法登記開業之營造業得從事室內裝修施工業務。\n三、室內裝修業得從事室內裝修設計或施工之業務。", "opts": ["", "要「依法登記開業」的建築師才行，選項漏了這個條件；而且建築師只能做設計", "沒有「設計師」可做施工這種規定；施工是營造業或室內裝修業", "營造業只能做施工，不能做設計"]}, "9-1-06": {"law": "【建築物室內裝修管理辦法 第12條】\n專業技術人員離職或死亡時，室內裝修業應於一個月內報請內政部備查。", "note": "專業技術人員離職或死亡，業者要在1個月內報請內政部備查。", "opts": ["", "不是2個月", "不是3個月", "不是4個月"]}, "9-1-07": {"law": "【建築物室內裝修管理辦法 第15條】\n本辦法所稱專業技術人員，指向內政部辦理登記，從事室內裝修設計或施工之人員；依其執業範圍可分為專業設計技術人員及專業施工技術人員。", "note": "專業技術人員是登記從事室內裝修「設計或施工」技術的人。", "opts": ["不只設計", "不是營建", "不只施工", ""]}, "9-1-08": {"law": "【建築物室內裝修管理辦法 第15條】\n本辦法所稱專業技術人員，指向內政部辦理登記，從事室內裝修設計或施工之人員；依其執業範圍可分為專業設計技術人員及專業施工技術人員。", "note": "專業技術人員分兩種：專業設計技術人員、專業施工技術人員。", "opts": ["", "沒有專業規劃", "沒有專業營造", "沒有專業裝潢"]}, "9-1-09": {"law": "【建築物室內裝修管理辦法 第22條】\n供公眾使用建築物或經內政部認定之非供公眾使用建築物之室內裝修，建築物起造人、所有權人或使用人應向直轄市、縣（市）主管建築機關或審查機構申請審核圖說，審核合格並領得直轄市、縣（市）主管建築機關發給之許可文件後，始得施工。", "note": "供公眾使用的建築物要裝修：先申請審核圖說，領到許可文件才能施工，兩個都要。", "opts": ["不能視需求", "還要許可文件", "還要審核圖說", ""]}, "9-1-10": {"law": "【建築物室內裝修管理辦法 第22條】\n供公眾使用建築物或經內政部認定之非供公眾使用建築物之室內裝修，建築物起造人、所有權人或使用人應向直轄市、縣（市）主管建築機關或審查機構申請審核圖說，審核合格並領得直轄市、縣（市）主管建築機關發給之許可文件後，始得施工。", "note": "非供公眾使用的，只要內政部認定需要，也要申請審核圖說並取得許可文件才能施工。", "flag": "條文第 22 條寫的是「供公眾使用或經內政部認定之非供公眾使用建築物」。題庫答案 A 對應這個意思。", "opts": ["", "還要許可文件", "還要審核圖說", "不是視安全需求"]}, "9-1-11": {"law": "【建築物室內裝修管理辦法 第23條】\n申請室內裝修審核時，應檢附下列圖說文件：\n二、建築物權利證明文件。", "note": "申請審核要附：申請書、權利證明文件、使用執照或裝修平面圖、室內裝修圖說，四樣都要。", "full": "【建築物室內裝修管理辦法 第23條】\n申請室內裝修審核時，應檢附下列圖說文件：\n一、申請書。\n二、建築物權利證明文件。\n三、前次核准使用執照平面圖、室內裝修平面圖或申請建築執照之平面圖。但經直轄市、縣（市）主管建築機關查明檔案資料確無前次核准使用執照平面圖或室內裝修平面圖屬實者，得以經開業建築師簽證符合規定之現況圖替代之。\n四、室內裝修圖說。", "opts": ["缺申請書和圖說", "缺權利證明", "缺使用執照平面圖", ""]}, "9-1-12": {"law": "【建築物室內裝修管理辦法 第24條】\n室內裝修圖說包括下列各款：\n五、裝修詳細圖：各部分之尺寸構造及材料，其比例尺不得小於三十分之一。", "note": "室內裝修詳細圖比例尺不得小於1/30。", "opts": ["1/100是平面圖", "10/100不對", "", "1/300太小"]}, "9-1-13": {"law": "【建築物室內裝修管理辦法 第28條】\n室內裝修不得妨害或破壞消防安全設備，其申請審核之圖說涉及消防安全設備變更者，應依消防法規規定辦理，並應於施工前取得當地消防主管機關審核合格之文件。", "note": "室內裝修「不得妨害及破壞」消防安全設備。", "opts": ["不能遮掩", "不是不破壞就好", "", "也不能破壞"]}, "9-1-14": {"law": "【建築物室內裝修管理辦法 第28條】\n室內裝修不得妨害或破壞消防安全設備，其申請審核之圖說涉及消防安全設備變更者，應依消防法規規定辦理，並應於施工前取得當地消防主管機關審核合格之文件。", "note": "裝修圖說涉及消防安全設備變更，要依消防法規辦理。", "opts": ["不是建築法", "", "不是建築技術規則", "不是裝修辦法"]}, "9-1-15": {"law": "【建築物室內裝修管理辦法 第36條】\n室內裝修業有下列情事之一者，經當地主管建築機關查明屬實後，報…\n一、登記證供他人從事室內裝修業務。", "note": "裝修業把登記證借給別人：報請內政部廢止登記許可並註銷登記證。", "full": "【建築物室內裝修管理辦法 第36條】\n室內裝修業有下列情事之一者，經當地主管建築機關查明屬實後，報請內政部廢止室內裝修業登記許可並註銷登記證：\n一、登記證供他人從事室內裝修業務。", "opts": ["不是經濟部", "不是停止登記", "不是科技部", ""]}, "9-1-16": {"law": "【建築物室內裝修管理辦法 第36條】\n室內裝修業有下列情事之一者，經當地主管建築機關查明屬實後，報…\n三、受停止換發登記證處分累計三次。", "note": "裝修業停業累計滿3年，或停止換發登記證累計3次：報請內政部廢止登記許可並註銷登記證。", "full": "【建築物室內裝修管理辦法 第36條】\n室內裝修業有下列情事之一者，經當地主管建築機關查明屬實後，報請內政部廢止室內裝修業登記許可並註銷登記證：\n二、受停業處分累計滿三年。\n三、受停止換發登記證處分累計三次。", "opts": ["", "不是停止", "不是營利許可", "不是撤銷營利事業登記證"]}, "9-1-17": {"law": "【建築物室內裝修管理辦法 第33條】\n申請室內裝修之建築物，其申請範圍用途為住宅或申請樓層之樓地板…\n一、十層以下樓層及地下室各層，室內裝修之樓地板面積在三百平方公尺以下者。", "note": "10層以下、300平方公尺以下的裝修，要用1小時防火時效的牆和防火門窗隔開。", "full": "【建築物室內裝修管理辦法 第33條】\n申請室內裝修之建築物，其申請範圍用途為住宅或申請樓層之樓地板面積符合下列規定之一，且在裝修範圍內以一小時以上防火時效之防火牆、防火門窗區劃分隔，其未變更防火避難設施、消防安全設備、防火區劃及主要構造者，得檢附經依法登記開業之建築師或室內裝修業專業設計技術人員簽章負責之 證處分：\n\n【建築物室內裝修管理辦法 第38條】\n專業技術人員有下列情事之一者，當地主管建築機關應查明屬實後，報請內政部視其情節輕重，予以警告、六個月以上一年以下停止執行職務處分或一年以上三年以下停止換發登記證處分：", "opts": ["警告是最輕的", "沒有「小過」這種處分", "", "停止執行職務是「6個月以上1年以下」，不是3個月；而且比停止換發登記證輕"]}, "9-1-22": {"law": "【建築物室內裝修管理辦法 第39條】\n專業技術人員有下列情事之一者，當地主管建築機關應查明屬實後，…\n二、十年內受停止執行職務處分累計滿二年。", "note": "專業技術人員10年內停止執行職務累計滿2年：廢止登記許可並註銷登記證。", "full": "【建築物室內裝修管理辦法 第39條】\n專業技術人員有下列情事之一者，當地主管建築機關應查明屬實後，報請內政部廢止登記許可並註銷登記證：\n二、十年內受停止執行職務處分累計滿二年。", "opts": ["不只廢止登記許可", "不只註銷登記證", "不只停止換發", ""]}, "9-1-23": {"law": "【建築物室內裝修管理辦法 第39條】\n專業技術人員有下列情事之一者，當地主管建築機關應查明屬實後，…\n一、專業技術人員登記證供所受聘室內裝修業以外使用。", "note": "專業技術人員把登記證給所屬業者以外的人用：廢止登記許可並註銷登記證。", "full": "【建築物室內裝修管理辦法 第39條】\n專業技術人員有下列情事之一者，當地主管建築機關應查明屬實後，報請內政部廢止登記許可並註銷登記證：\n一、專業技術人員登記證供所受聘室內裝修業以外使用。", "opts": ["", "不只廢止登記許可證", "不只註銷登記證", "不只停止換發"]}, "9-2-01": {"law": "【建築技術規則建築設計施工編 第1條】\n本編建築技術用語，其他各編得適用，其定義如下：\n四、建蔽率：建築面積占基地面積之比率。", "note": "建築面積占基地面積的比率，叫建蔽率。", "opts": ["容積率是總樓地板面積比", "", "沒有空地比", "沒有建築基地比率"]}, "9-2-02": {"law": "【建築技術規則建築設計施工編 第1條】\n本編建築技術用語，其他各編得適用，其定義如下：\n五、樓地板面積：建築物各層樓地板或其一部分，在該區劃中心線以內之水平投影面積。但不包括第三款不計入建築面積之部分。", "note": "各層樓地板在區劃中心線以內的水平投影面積，叫樓地板面積。", "opts": ["建築面積是外牆中心線以內", "沒有建築開發面積", "", "總樓地板面積是全部加起來"]}, "9-2-03": {"law": "【建築技術規則建築設計施工編 第1條】\n本編建築技術用語，其他各編得適用，其定義如下：\n七、總樓地板面積：建築物各層包括地下層、屋頂突出物及夾層等樓地板面積之總和。", "note": "各層（含地下層、屋頂突出物、夾層）樓地板面積加起來，叫總樓地板面積。", "opts": ["建築面積是外牆中心線以內", "沒有建築開發面積", "樓地板面積是單層", ""]}, "9-2-04": {"law": "【建築技術規則建築設計施工編 第1條】\n本編建築技術用語，其他各編得適用，其定義如下：\n三、建築面積：建築物外牆中心線或其代替柱中心線以內之最大水平投影面積。…", "note": "外牆中心線以內的最大水平投影面積，叫建築面積。", "full": "【建築技術規則建築設計施工編 第1條】\n本編建築技術用語，其他各編得適用，其定義如下：\n三、建築面積：建築物外牆中心線或其代替柱中心線以內之最大水平投影面積。但電業單位規定之配電設備及其防護設施、地下層突出基地地面未超過一點二公尺或遮陽板有二分之一以上為透空，且其深度在二點零公尺以下者，不計入建築面積；陽臺、屋簷及建築物出入口雨遮突出建築物外牆中心線或其代替柱中心線超過二點零公尺，或雨遮、花臺突出超過一點零公尺者，應自其外緣分別扣除二點零公尺或一點零公尺作為中心線；每層陽臺面積之和，以不超過建築面積八分之一為限，其未達八平方公尺者，得建築八平方公尺。", "opts": ["", "沒有建築開發面積", "樓地板面積是各層", "總樓地板面積是全部加起來"]}, "9-2-05": {"law": "【建築技術規則建築設計施工編 第1條】\n本編建築技術用語，其他各編得適用，其定義如下：\n（二）水箱、水塔設於屋頂突出物上高度合計在六公尺以內或設於有昇降機設備通達屋頂之屋頂突出物高度在九公尺以內或設於屋頂面上高度在 .4公尺太矮", "1.6公尺太矮", ""]}, "9-3-16": {"law": "【建築物室內裝修管理辦法 第28條】\n室內裝修不得妨害或破壞消防安全設備，其申請審核之圖說涉及消防安全設備變更者，應依消防法規規定辦理，並應於施工前取得當地消防主管機關審核合格之文件。", "note": "消防設備不能加框遮住，違反室內裝修管理辦法。", "opts": ["不是建築法", "不是建築技術規則", "", "不是管理條例"]}, "9-3-17": {"law": "（這題屬室內裝修實務教材，沒有對應的法條原文）", "note": "把居室改成機械室做維修，違反使用管制，題庫答案是建築技術規則。", "flag": "條文上更直接的是建築法第 73 條第 2 項（未經核准變更使用），題庫選 C 建築技術規則。考試記題庫答案。", "opts": ["不是消防法", "不是土地法", "", "不是裝修管理辦法"]}, "9-3-18": {"law": "【建築技術規則建築設計施工編 第1條】\n本編建築技術用語，其他各編得適用，其定義如下：\n二十八、不燃材料：混凝土、磚或空心磚、瓦、石料、鋼鐵、鋁、玻璃、玻璃纖維、礦棉、陶瓷品、砂漿、石灰及其他經中央主管建築機關認定符合耐燃一級之不因火熱引起燃燒、熔化、破裂變形及產生有害氣體之材料。", "note": "不燃材料：混凝土、磚、石、鋼鐵、鋁、玻璃、玻璃纖維、礦棉、陶瓷、砂漿。", "opts": ["", "柏油是耐水", "木絲水泥板是耐火板", "石膏板是耐燃"]}, "9-3-19": {"law": "【建築技術規則建築設計施工編 第1條】\n本編建築技術用語，其他各編得適用，其定義如下：\n二十九、耐火板：木絲水泥板、耐燃石膏板及其他經中央主管建築機關認定符合耐燃二級之材料。", "note": "耐火板類：木絲水泥板、耐燃石膏板（耐燃二級）。", "opts": ["金屬材料是不燃", "", "塑膠板不是", "木料合板不是"]}, "9-3-20": {"law": "【建築技術規則建築設計施工編 第1條】\n本編建築技術用語，其他各編得適用，其定義如下：\n二十七、耐水材料：磚、石料、人造石、混凝土、柏油及其製品、陶瓷品、玻璃、金屬材料、塑膠製品及其他具有類似耐水性之材料。", "note": "耐水材料：磚、石、人造石、混凝土、陶瓷、玻璃、金屬、塑膠製品。", "opts": ["木絲水泥板不是", "石膏板不是", "耐燃合板不是", ""]}, "9-3-21": {"law": "【建築技術規則建築設計施工編 第1條】\n本編建築技術用語，其他各編得適用，其定義如下：\n三十、耐燃材料：耐燃合板、耐燃纖維板、耐燃塑膠板、石膏板及其他經中央主管建築機關認定符合耐燃三級之材料。", "note": "耐燃材料：耐燃合板、耐燃纖維板、耐燃塑膠板、石膏板（耐燃三級）。", "opts": ["", "塑膠板不是", "木料合板不是", "窗簾是防焰物品"]}, "9-3-22": {"law": "【建築物室內裝修管理辦法 第28條】\n室內裝修不得妨害或破壞消防安全設備，其申請審核之圖說涉及消防安全設備變更者，應依消防法規規定辦理，並應於施工前取得當地消防主管機關審核合格之文件。", "note": "消防設備加框架，妨害消防，違反室內裝修管理辦法。", "opts": ["不是建築法", "不是建築技術規則", "", "不是社區規約"]}, "9-3-23": {"law": "【公寓大廈管理條例 第49條】\n有下列行為之一者，由直轄市、縣（市）主管機關處新臺幣四萬元以上二十萬元以下罰鍰，並得令其限期改善或履行義務；屆期不改善或不履行者，得連續處罰：\n\n【公寓大廈管理條例 第16條】\n住戶不得於私設通路、防火間隔、防火巷弄、開放空間、退縮空地、樓梯間、共同走廊、防空避難設備等處所堆置雜物、設置柵欄、門扇或營業使用，或違規設置廣告物或私設路障及停車位侵占巷道妨礙出入。…", "note": "雜物放樓梯間，制止不聽：罰4萬～20萬。", "full": "【公寓大廈管理條例 第49條】\n有下列行為之一者，由直轄市、縣（市）主管機關處新臺幣四萬元以上二十萬元以下罰鍰，並得令其限期改善或履行義務；屆期不改善或不履行者，得連續處罰：\n四、住戶違反第十六條第二項或第三項規定者。\n\n【公寓大廈管理條例 第16條】\n住戶不得於私設通路、防火間隔、防火巷弄、開放空間、退縮空地、樓梯間、共同走廊、防空避難設備等處所堆置雜物、設置柵欄、門扇或營業使用，或違規設置廣告物或私設路障及停車位侵占巷道妨礙出入。但開放空間及退縮空地，在直轄市、縣（市）政府核准範圍內，得依規約或區分所有權人會議決議供營業使用；防空避難設備，得為原核准範圍之使用；其兼作停車空間使用者，得依法供公共收費停車使用。", "opts": ["1萬~3萬不對", "2萬~10萬不對", "", "3萬~30萬不對"]}, "9-3-24": {"law": "【公寓大廈管理條例 第49條】\n有供營業使用事實之住戶有前項第三款或第四款行為，因而致人於死者，處一年以上七年以下有期徒刑，得併科新臺幣一百萬元以上五百萬元以下罰金；致重傷者，處六個月以上五年以下有期徒刑，得併科新臺幣五十萬元以上二百五十萬元以下罰金。", "note": "有營業事實，亂放東西害人重傷：6個月～5年有期徒刑。", "opts": ["不是3個月~3年", "", "不是6個月~6年", "不是5個月~7年"]}, "9-3-25": {"law": "【公寓大廈管理條例 第16條】\n住戶為維護、修繕、裝修或其他類似之工作時，未經申請主管建築機關核准，不得破壞或變更建築物之主要構造。\n\n【公寓大廈管理條例 第49條】\n有下列行為之一者，由直轄市、縣（市）主管機關處新臺幣四萬元以上二十萬元以下罰鍰，並得令其限期改善或履行義務；屆期不改善或不履行者，得連續處罰：", "note": "擅自改浴室排水管，制止不聽：罰4萬～20萬。", "full": "【公寓大廈管理條例 第49條】\n有下列行為之一者，由直轄市、縣（市）主管機關處新臺幣四萬元以上二十萬元以下罰鍰，並得令其限期改善或履行義務；屆期不改善或不履行者，得連續處罰：\n四、住戶違反第十六條第二項或第三項規定者。\n\n【公寓大廈管理條例 第16條】\n住戶為維護、修繕、裝修或其他類似之工作時，未經申請主管建築機關核准，不得破壞或變更建築物之主要構造。", "opts": ["1萬~3萬不對", "2萬~10萬不對", "3萬~30萬不對", ""]}, "9-3-26": {"law": "【公寓大廈管理條例 第49條】\n有供營業使用事實之住戶有前項第三款或第四款行為，因而致人於死者，處一年以上七年以下有期徒刑，得併科新臺幣一百萬元以上五百萬元以下罰金；致重傷者，處六個月以上五年以下有期徒刑，得併科新臺幣五十萬元以上二百五十萬元以下罰金。", "note": "有營業事實，亂放廣告物害人重傷：6個月～5年徒刑，得併科50萬～250萬罰金。", "opts": ["罰金金額不對", "", "刑期不對", "罰金金額不對"]}};

<script>
const KEY='zlq_quiz_v1';
const Q=BANK.qs, QM=Object.fromEntries(Q.map(q=>[q.id,q])), CH=BANK.chaps, SEC=BANK.secs;
const LET='ABCD';
const $app=document.getElementById('app');

/* ---------- storage ---------- */
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let S=load(); S.stats=S.stats||{}; if(!Array.isArray(S.history))S.history=[];
let sess=S.sess||null;   // 進行中的測驗（重新整理不會掉）

/* ---------- helpers ---------- */
function h(tag,attrs,...kids){
  const e=document.createElement(tag);
  for(const k in (attrs||{})){
    const v=attrs[k];
    if(k==='class')e.className=v; else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);
    else if(v!==false&&v!=null)e.setAttribute(k,v===true?'':v);
  }
  for(const c of kids.flat())if(c!=null&&c!==false)e.append(c.nodeType?c:document.createTextNode(c));
  return e;
}
function render(...nodes){$app.replaceChildren(...nodes);window.scrollTo(0,0)}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const chIds=[...new Set(Q.map(q=>q.c))].sort((a,b)=>a-b);
const byCh=c=>Q.filter(q=>q.c===c);
function isMastered(st){return st&&st.last==='r'&&st.streak>=2}
function wrongIds(){return Object.keys(S.stats).filter(id=>QM[id]&&S.stats[id].w>0)}

/* 依各章題數比例分配（最大餘數法） */
function allocate(total){
  const N=Q.length, raw=chIds.map(c=>total*byCh(c).length/N);
  const base=raw.map(Math.floor); let left=total-base.reduce((a,b)=>a+b,0);
  raw.map((v,i)=>[v-Math.floor(v),i]).sort((a,b)=>b[0]-a[0]).slice(0,left).forEach(([,i])=>base[i]++);
  return Object.fromEntries(chIds.map((c,i)=>[c,base[i]]));
}
function buildExam(total=100){
  const al=allocate(total);
  return shuffle(chIds.flatMap(c=>shuffle(byCh(c)).slice(0,al[c]).map(q=>q.id)));
}


function ask(msg,yes,yesLabel){
  const bg=h('div',{style:'position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99;display:flex;align-items:center;justify-content:center;padding:16px'},
    h('div',{class:'card',style:'max-width:420px;width:100%'},h('div',{style:'margin-bottom:12px;white-space:pre-wrap'},msg),
      h('div',{class:'row'},h('button',{class:'pri grow',onclick:()=>{bg.remove();yes&&yes()}},yesLabel||'確定'),
        yes?h('button',{class:'grow',onclick:()=>bg.remove()},'取消'):null)));
  document.body.append(bg);
}
/* ---------- 首頁 ---------- */
function home(){
  const al=allocate(100), wr=wrongIds();
  const done=Object.keys(S.stats).length;
  const nodes=[
    h('h1',null,'🏠 租賃住宅管理人員 模擬測驗'),
    h('div',{class:'sub'},`題庫 ${Q.length} 題｜已練過 ${done} 題｜錯題本 ${wr.length} 題`),
  ];
  if(sess)nodes.push(h('div',{class:'card'},
    h('b',null,'有一份沒做完的測驗'),h('div',{class:'sub'},`${sess.title}｜已答 ${Object.keys(sess.ans).length}/${sess.ids.length}`),
    h('div',{class:'row',style:'margin-top:8px'},
      h('button',{class:'pri grow',onclick:()=>quiz()},'繼續作答'),
      h('button',{onclick:()=>ask('放棄這份測驗？',()=>{sess=null;S.sess=null;save();home()},'放棄')},'放棄'))));
  nodes.push(
    h('button',{class:'pri big',onclick:()=>startExam()},'▶ 開始模擬測驗（100 題）'),
    h('button',{class:'big',style:'margin-top:8px',onclick:()=>newSess(buildExam(10),'小測驗 10 題')},'⚡ 小測驗（10 題，約 5 分鐘）'),
    h('div',{class:'card'},
      h('b',null,'📕 錯題本'),h('div',{class:'sub'},wr.length?`${wr.length} 題｜其中 ${wr.filter(id=>isMastered(S.stats[id])).length} 題已掌握（最近連對 2 次）`:'還沒有錯題，先去考一場吧'),
      h('div',{class:'row',style:'margin-top:8px'},
        h('button',{class:'grow',disabled:!wr.length,onclick:()=>wrongMenu()},'單獨測驗'),
        h('button',{class:'grow',disabled:!wr.length,onclick:()=>review()},'審閱（含解說）'))),
    h('div',{class:'card'},h('b',null,'📊 歷史成績'),historyBox()),
    h('div',{class:'card'},h('b',null,'每次 100 題的章節配額'),
      h('table',null,...chIds.map(c=>h('tr',null,h('td',null,`${c}. ${CH[c]}`),h('td',null,`${al[c]} 題`)))),
      h('div',{class:'sub'},'依題庫各章題數比例分配，章內隨機抽題')),
    h('details',{class:'card'},h('summary',null,'💾 備份 / 換裝置'),
      h('div',{class:'sub'},'紀錄存在這個瀏覽器裡。換手機或清資料前先匯出。'),
      h('div',{class:'row',style:'margin-top:8px'},
        h('button',{onclick:exportData},'匯出紀錄'),
        h('label',{class:'row'},h('button',{onclick:e=>e.target.nextSibling.click()},'匯入紀錄'),h('input',{type:'file',accept:'.json',style:'display:none',onchange:importData})),
        h('button',{onclick:()=>ask('清空所有作答紀錄與錯題本？無法復原',()=>{S={stats:{},history:[]};sess=null;save();home()},'清空')},'清空'))));
  render(...nodes);
}
function historyBox(){
  if(!S.history.length)return h('div',{class:'sub'},'尚無紀錄');
  return h('table',null,h('tr',null,h('th',null,'日期'),h('th',null,'類型'),h('th',null,'分數')),
    ...S.history.slice(-8).reverse().map(r=>h('tr',null,h('td',null,r.d),h('td',null,r.title),h('td',null,`${r.score}/${r.total}`))));
}
function exportData(){
  const b=new Blob([JSON.stringify({stats:S.stats,history:S.history})],{type:'application/json'});
  const a=h('a',{href:URL.createObjectURL(b),download:'quiz-backup-'+new Date().toISOString().slice(0,10)+'.json'});a.click();
}
function importData(e){
  const f=e.target.files[0];if(!f)return;
  f.text().then(t=>{try{const d=JSON.parse(t);if(!d.stats)throw 0;S.stats=d.stats;S.history=d.history||[];save();home()}catch(x){ask('檔案格式不對')}});
}

/* ---------- 開考 ---------- */
function startExam(){newSess(buildExam(100),'模擬測驗 100 題')}
function newSess(ids,title){sess={ids,title,ans:{},i:0};S.sess=sess;save();quiz()}
function wrongMenu(){
  const wr=wrongIds(), un=wr.filter(id=>!isMastered(S.stats[id])), two=wr.filter(id=>S.stats[id].w>=2);
  const go=(ids,t)=>ids.length?newSess(shuffle(ids),t):ask('這個條件沒有題目');
  render(h('h1',null,'📕 錯題單獨測驗'),
    h('div',{class:'card'},
      h('button',{class:'big pri',onclick:()=>go(wr,`錯題全部 ${wr.length} 題`)},`全部錯題（${wr.length}）`),
      h('button',{class:'big opt',onclick:()=>go(un,`未掌握錯題 ${un.length} 題`)},`只考還沒掌握的（${un.length}）`),
      h('button',{class:'big opt',onclick:()=>go(two,`反覆錯題 ${two.length} 題`)},`錯 2 次以上的釘子戶（${two.length}）`)),
    h('button',{onclick:home},'← 回首頁'));
}

/* ---------- 作答 ---------- */
function quiz(){
  const id=sess.ids[sess.i], q=QM[id], n=sess.ids.length;
  const answered=Object.keys(sess.ans).length;
  const go=i=>{sess.i=Math.max(0,Math.min(n-1,i));save();quiz()};
  const nodes=[
    h('div',{class:'sticky'},
      h('div',{class:'row'},h('b',{class:'grow'},sess.title),h('span',{class:'sub'},`${answered}/${n}`)),
      h('div',{class:'bar'},h('i',{style:`width:${answered/n*100}%`}))),
    h('div',{class:'card'},
      h('div',{class:'sub'},`第 ${sess.i+1} 題`,' ',h('span',{class:'tag'},`${q.c}. ${CH[q.c]}`)),
      h('div',{class:'stem'},q.q),
      ...q.o.map((t,k)=>h('button',{class:'opt'+(sess.ans[id]===k?' sel':''),onclick:()=>{sess.ans[id]=k;save();quiz()}},`(${LET[k]}) ${t}`))),
    h('div',{class:'row'},
      h('button',{disabled:sess.i===0,onclick:()=>go(sess.i-1)},'← 上一題'),
      h('button',{class:'pri grow',disabled:sess.i===n-1,onclick:()=>go(sess.i+1)},'下一題 →')),
    h('details',{class:'card'},h('summary',null,'題號一覽（點選跳題）'),
      h('div',{class:'grid',style:'margin-top:8px'},...sess.ids.map((x,i)=>h('button',{class:(sess.ans[x]!=null?'done ':'')+(i===sess.i?'cur':''),onclick:()=>go(i)},i+1)))),
    h('div',{class:'row'},
      h('button',{class:'pri grow',onclick:()=>{
        const miss=n-answered;
        if(miss)ask(`還有 ${miss} 題沒作答（會算錯），確定交卷？`,finish,'交卷');
        else finish();}},'交卷'),
      h('button',{onclick:()=>{save();home()}},'先離開（可繼續）'))
  ];
  render(...nodes);
}

/* ---------- 交卷 / 結果 ---------- */
function finish(){
  const res=sess.ids.map(id=>({id,pick:sess.ans[id]==null?-1:sess.ans[id],ok:sess.ans[id]===QM[id].a}));
  const now=Date.now();
  res.forEach(r=>{
    const st=S.stats[r.id]||(S.stats[r.id]={r:0,w:0,last:null,streak:0,t:0});
    if(r.ok){st.r++;st.last='r';st.streak++}else{st.w++;st.last='w';st.streak=0}
    st.t=now;
  });
  const score=res.filter(r=>r.ok).length;
  const d=new Date().toLocaleString('zh-TW',{hour12:false,month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
  S.history.push({d,title:sess.title,score,total:res.length});
  const out={title:sess.title,res,score};
  sess=null;S.sess=null;S.last=out;save();showResult(out);
}
function showResult(out){
  const {res,score}=out,total=res.length;
  const rows=chIds.map(c=>{const rs=res.filter(r=>QM[r.id].c===c);return{c,n:rs.length,bad:rs.filter(r=>!r.ok).length}}).filter(x=>x.n);
  const wrong=res.filter(r=>!r.ok);
  render(
    h('h1',null,'📋 成績單'),h('div',{class:'sub'},out.title),
    h('div',{class:'card',style:'text-align:center'},
      h('div',{class:'score'},`${score}`,h('span',{class:'sub',style:'font-size:22px'},` / ${total}`)),
      h('div',{class:'sub'},`答對 ${score} 題｜答錯 ${wrong.length} 題（未作答也算錯）`)),
    h('div',{class:'card'},h('b',null,'各章節表現'),
      h('table',null,h('tr',null,h('th',null,'章節'),h('th',null,'題數'),h('th',null,'錯'),h('th',null,'對')),
        ...rows.map(x=>h('tr',null,h('td',null,`${x.c}. ${CH[x.c]}`),h('td',null,x.n),h('td',{style:x.bad?'color:var(--bad);font-weight:700':''},x.bad),h('td',null,x.n-x.bad))))),
    h('h2',null,`❌ 答錯的 ${wrong.length} 題`),
    ...wrong.map(r=>wrongCard(r.id,r.pick)),
    h('div',{class:'row'},h('button',{class:'pri grow',onclick:startExam},'再考一場'),h('button',{onclick:home},'回首頁')));
}

/* ---------- 解說卡 ---------- */
function stBadge(id){
  const st=S.stats[id];if(!st)return null;
  return h('span',null,h('span',{class:'tag bad'},`錯 ${st.w} 次 / 作答 ${st.r+st.w} 次`),isMastered(st)?h('span',{class:'tag ok'},'已掌握'):null);
}
function optRow(q,e,k,pick){
  const isR=k===q.a, isP=k===pick;
  const why=e&&e.opts?(isR?'':e.opts[k]):'';
  const cls='orow'+(isR?' r':'')+(isP&&!isR?' p':'');
  return h('div',{class:cls},
    h('div',{class:'otxt'},h('span',{class:'mk'},isR?'✅':(isP?'❌':'▫️')),`(${LET[k]}) ${q.o[k]}`,isP?h('span',{class:'tag bad',style:'margin-left:6px'},'你選的'):null),
    why?h('div',{class:'why'},why):null);
}
function wrongCard(id,pick){
  const q=QM[id],e=EXPL[id];
  return h('div',{class:'card'},
    h('div',{class:'sub'},h('span',{class:'tag'},`${q.c}. ${CH[q.c]}`),stBadge(id)),
    h('div',{class:'stem'},q.q),
    ...(pick===-1?[h('div',{class:'mine'},'你選：（未作答）')]:[]),
    ...[0,1,2,3].map(k=>optRow(q,e,k,pick)),
    e?h('div',null,
        e.flag?h('div',{class:'note',style:'border-left-color:var(--bad);background:var(--bad2)'},h('b',null,'⚠️ 注意　'),e.flag):null,
        e.law?h('div',{class:'law'},h('b',null,'📖 法條重點'),'\n',e.law):null,
        e.full?h('details',{style:'margin:4px 0'},h('summary',{class:'sub'},'看完整條文'),h('div',{class:'law',style:'font-size:14px'},e.full)):null,
        e.note?h('div',{class:'note'},h('b',null,'💡 白話　'),e.note):null)
      :h('div',{class:'sub'},'（這題的法條與白話解說還在製作中）'));
}

/* ---------- 錯題審閱 ---------- */
function review(filter={c:0,sort:'w',hide:false}){
  let ids=wrongIds();
  if(filter.c)ids=ids.filter(id=>QM[id].c===filter.c);
  if(filter.hide)ids=ids.filter(id=>!isMastered(S.stats[id]));
  ids.sort(filter.sort==='w'?(a,b)=>S.stats[b].w-S.stats[a].w||S.stats[b].t-S.stats[a].t:(a,b)=>S.stats[b].t-S.stats[a].t);
  const sel=(opts,val,fn)=>{const s=h('select',{onchange:e=>fn(e.target.value)},...opts.map(([v,t])=>h('option',{value:v,selected:String(v)===String(val)},t)));return s};
  render(
    h('h1',null,'📕 錯題審閱'),
    h('div',{class:'card row'},
      sel([[0,'全部章節'],...chIds.map(c=>[c,`${c}. ${CH[c]}`])],filter.c,v=>review({...filter,c:+v})),
      sel([['w','錯最多次'],['t','最近作答']],filter.sort,v=>review({...filter,sort:v})),
      h('label',{class:'row'},h('input',{type:'checkbox',checked:filter.hide,onchange:e=>review({...filter,hide:e.target.checked})}),'隱藏已掌握')),
    h('div',{class:'sub'},`共 ${ids.length} 題`),
    ...ids.map(id=>wrongCard(id,null)),
    h('div',{class:'row'},
      h('button',{class:'pri grow',disabled:!ids.length,onclick:()=>newSess(shuffle(ids),`錯題測驗 ${ids.length} 題`)},'考這些題'),
      h('button',{onclick:home},'回首頁')));
}

home();
</script>
</body>
</html>
