必要時，得請求閱覽或影印規約、公共基金餘額、會計憑證、會計帳簿、財務報表、欠繳公共基金與應分攤或其他應負擔費用情形、管理委員會會議紀錄及前條會議紀錄，管理負責人或管理委員會不得拒絕。", "note": "利害關係人可看：規約、公共基金餘額、會計憑證帳簿、財務報表、欠繳情形、管委會會議紀錄。「員工個資」不行。", "opts": ["公共基金餘額可閱覽", "欠繳情形可閱覽", "會計帳簿可閱覽", ""]}, "4-4-25": {"law": "（這題屬公寓大廈行政管理實務教材的內容，沒有對應法條原文）", "note": "文件別「暫放桌面」，會掉會被看到。電子檔要備份、文件要分類裝訂。", "opts": ["", "電子檔要備份", "永久與定期可分開放", "應分類裝訂成冊"]}, "4-4-26": {"law": "【公寓大廈管理條例施行細則 第2條】\n本條例所稱區分所有權比例，指區分所有權人之專有部分依本條例第五十六條第三項測繪之面積與公寓大廈專有部分全部面積總和之比。建築物已完成登記者，依登記機關之記載為準。", "note": "有「單位地址、專有部分面積、區分所有權比例」的名冊是「區分所有權人名冊」。", "full": "【公寓大廈管理條例施行細則 第2條】\n本條例所稱區分所有權比例，指區分所有權人之專有部分依本條例第五十六條第三項測繪之面積與公寓大廈專有部分全部面積總和之比。建築物已完成登記者，依登記機關之記載為準。\n\n（這題屬公寓大廈行政管理實務教材的內容，沒有對應法條原文）", "opts": ["", "住戶名冊欄位不同", "管委會名冊欄位不同", "車位使用人名冊欄位不同"]}, "4-4-27": {"law": "（這題屬公寓大廈行政管理實務教材的內容，沒有對應法條原文）", "note": "裝修前7天要完成：施工申請書和保證書、查驗責任險保單、繳保證金。題庫沒把「工班名冊」放進前置手續。", "opts": ["申請書及保證書要填", "要查驗責任險保單", "要繳保證金", ""]}, "4-4-28": {"law": "【公寓大廈管理條例 第37條】\n管理委員會會議決議之內容不得違反本條例、規約或區分所有權人會議決議。", "note": "管委會決議不能違反：條例、規約、區權會決議。「管委會會議」本身不是被遵守的對象。", "opts": ["規約不得違反", "", "區權會決議不得違反", "條例不得違反"]}, "4-5-01": {"law": "【公寓大廈管理條例 第29條】\n公寓大廈之住戶非該專有部分之區分所有權人者，除區分所有權人會議之決議或規約另有規定外，得被選任、推選為管理委員、主任委員或管理負責人。", "note": "承租人（不是區分所有權人）也可以當管委會委員、主委、管理負責人，除非規約或決議不准。", "opts": ["規約另有規定才例外，原則可擔任", "承租人可以當", "不看房東協議", ""]}, "4-5-02": {"law": "【公寓大廈管理條例 第29條】\n公寓大廈之住戶非該專有部分之區分所有權人者，除區分所有權人會議之決議或規約另有規定外，得被選任、推選為管理委員、主任委員或管理負責人。", "note": "大學生承租人也可以被選為管委會委員。", "opts": ["規約另有規定才例外", "不需房東同意書", "", "承租人可以當"]}, "4-5-03": {"law": "【公寓大廈管理條例 第15條】\n住戶違反前項規定，管理負責人或管理委員會應予制止，經制止而不遵從者，報請直轄市、縣（市）主管機關處理，並要求其回復原狀。", "note": "住戶擅自改用途，要由「管理負責人或管委會」出面制止；不聽再報主管機關。", "full": "【公寓大廈管理條例 第15條】\n住戶應依使用執照所載用途及規約使用專有部分、約定專用部分，不得擅自變更。\n住戶違反前項規定，管理負責人或管理委員會應予制止，經制止而不遵從者，報請直轄市、縣（市）主管機關處理，並要求其回復原狀。", "opts": ["", "清潔員無權制止", "保全員無權制止", "不看雙方協議，是法定職責"]}, "4-5-04": {"law": "【公寓大廈管理條例 第6條】\n住戶應遵守下列事項：\n二、他住戶因維護、修繕專有部分、約定專用部分或設置管線，必須進入或使用其專有部分或約定專用部分時，不得拒絕。", "note": "別人修繕必須進你的房間，你不能拒絕；但要挑傷害最小的方式，並修復或補償。", "opts": ["", "不需房東同意", "不需管委會同意", "不因嚴重性而異，一律不得拒絕"]}, "4-5-05": {"law": "【公寓大廈管理條例 第6條】\n住戶應遵守下列事項：\n四、於維護、修繕專有部分、約定專用部分或設置管線，必須使用共用部分時，應經管理負責人或管理委員會之同意後為之。", "note": "用共同弱電管道（共用部分）：要經「管理負責人或管委會」同意。", "opts": ["不是兩邊住戶", "不是管理公司", "", "不是廠商"]}, "4-5-06": {"law": "【公寓大廈管理條例 第6條】\n住戶應遵守下列事項：\n四、於維護、修繕專有部分、約定專用部分或設置管線，必須使用共用部分時，應經管理負責人或管理委員會之同意後為之。", "note": "頂樓裝監視器用到共同弱電管道：一樣經「管理負責人或管委會」同意。", "opts": ["", "不是管理公司", "不是同樓層住戶", "不是廠商"]}, "4-5-07": {"law": "【公寓大廈管理條例 第16條】\n住戶為維護、修繕、裝修或其他類似之工作時，未經申請主管建築機關核准，不得破壞或變更建築物之主要構造。", "note": "騎樓地板墊高屬於改動房子：房東同意＋向建管機關申請核准。只靠管委會同意不夠。", "full": "【公寓大廈管理條例 第16條】\n住戶不得任意棄置垃圾、排放各種污染物、惡臭物質或發生喧囂、振動及其他與此相類之行為。\n住戶為維護、修繕、裝修或其他類似之工作時，未經申請主管建築機關核准，不得破壞或變更建築物之主要構造。", "opts": ["", "還要申請建築機關核准，不能只靠管委會", "還要申請建築機關核准", "能恢復原狀不是條件"]}, "4-5-08": {"law": "【公寓大廈管理條例 第16條】\n住戶為維護、修繕、裝修或其他類似之工作時，未經申請主管建築機關核准，不得破壞或變更建築物之主要構造。", "note": "店面和樑柱外觀的裝修：房東同意，還要向建管機關申請核准。", "full": "【公寓大廈管理條例 第16條】\n住戶不得任意棄置垃圾、排放各種污染物、惡臭物質或發生喧囂、振動及其他與此相類之行為。\n住戶為維護、修繕、裝修或其他類似之工作時，未經申請主管建築機關核准，不得破壞或變更建築物之主要構造。", "opts": ["還要申請建築機關核准", "管委會同意不夠", "", "涉及構造要核准，不是不破壞就好"]}, "4-5-09": {"law": "【公寓大廈管理條例 第8條】\n公寓大廈周圍上下、外牆面、樓頂平臺及不屬專有部分之防空避難設備，其變更構造、顏色、設置廣告物、鐵鋁窗或其他類似之行為，除應依法令規定辦理外，該公寓大廈規約另有規定或區分所有權人會議已有決議，經向直轄市、縣（市）主管機關完成報備有案者，應受該規約或區分所有權人會議決議之限制。", "note": "外牆裝LED看板：要符合規約或區權會決議，並報備。", "opts": ["不是向主管機關請示", "", "不是管委會決議，是規約或區權會決議", "不能只靠自由使用收益"]}, "4-5-10": {"law": "【公寓大廈管理條例 第21條】\n區分所有權人或住戶積欠應繳納之公共基金或應分擔或其他應負擔之費用已逾二期或達相當金額，經定相當期間催告仍不給付者，管理負責人或管理委員會得訴請法院命其給付應繳之金額及遲延利息。", "note": "積欠管理費等費用「逾2期」或達相當金額，經定相當期間催告仍不付，管理負責人或管委會可以訴請法院命他付錢（公寓條例第21條）。口訣：欠2期→催告→告。", "opts": ["條文是逾2期", "1期還不到，條文是逾2期", "條文是逾2期，沒有1.5期", ""]}, "5-1-01": {"law": "【住宅包租契約應約定事項 第17點】\n包租業提前終止租約租賃期間有下列情形之一者，包租業得提前終止…\n（二）租賃住宅因不可歸責於包租業及次承租人之事由致一部滅失，且其存餘部分不能達租賃之目的。", "note": "包租業能提前終止的是：房東該修不修、房子毀損到不能住、有危害安全的瑕疵、被第三人主張權利。「氯離子超標」不是這裡的事由。", "full": "【住宅包租契約應約定事項 第17點】\n包租業提前終止租約租賃期間有下列情形之一者，包租業得提前終止租約之全部或一部：\n（一）租賃住宅或附屬設備損壞，應由出租人負擔修繕費用者，經包租業定相當期限催告，出租人仍不於期限內支付。\n（二）租賃住宅因不可歸責於包租業及次承租人之事由致一部滅失，且其存餘部分不能達租賃之目的。\n（三）租賃住宅有危及次承租人或其同居人之安全或健康之瑕疵。\n（四）因第三人就租賃住宅主張其權利，致次承租人不能為約定之居住使用。", "opts": ["房東該付修繕費卻不付，是終止事由", "房子一部滅失、剩下不能住，是終止事由", "", "被第三人主張權利、不能住，是終止事由"]}, "5-1-02": {"law": "【租賃住宅市場發展及管理條例 第5條】\n包租業與出租人間之住宅包租契約，其應約定及不得約定事項，由中央主管機關定之。", "note": "包租契約的法源是租賃條例第5條第2項，不是消保法。", "opts": ["消保法不是", "", "經紀業條例是買賣仲介", "公平交易法不是"]}, "5-1-03": {"law": "【住宅包租契約不得約定事項 第2點】\n不得約定次承租人不得遷入戶籍。\n\n【住宅包租契約不得約定事項 第4點】\n不得約定免除或限制民法上出租人故意不告知之瑕疵擔保責任。", "note": "不得約定的有：廣告僅供參考、轉嫁稅費、須繳回契約書…。「不得辦公司登記」不在裡面。", "full": "【住宅包租契約不得約定事項 第1點】\n不得約定廣告僅供參考。\n\n【住宅包租契約不得約定事項 第2點】\n不得約定次承租人不得遷入戶籍。\n\n【住宅包租契約不得約定事項 第3點】\n不得約定應由包租業負擔之稅費，轉嫁由出租人負擔。\n\n【住宅包租契約不得約定事項 第4點】\n不得約定免除或限制民法上出租人故意不告知之瑕疵擔保責任。\n\n【住宅包租契約不得約定事項 第5點】\n不得約定出租人須繳回契約書。\n\n【住宅包租契約不得約定事項 第6點】\n不得約定本契約之通知，僅以電話方式為之。\n\n【住宅包租契約不得約定事項 第7點】\n不得約定違反強制或禁止規定。", "opts": ["廣告僅供參考，不得約定", "", "轉嫁稅費給房東，不得約定", "要房東繳回契約書，不得約定"]}, "5-1-04": {"law": "【住宅包租契約應約定事項 第1點】\n租賃標的", "note": "建號只有兩種：專有部分、共有部分。沒有「公有部分」。", "full": "【住宅包租契約應約定事項 第1點】\n租賃標的\n1. 門牌 __ 縣（市）__ 鄉（鎮、市、區）__街（路）__ 段 __ 巷 __ 弄 __ 號 __ 樓之（基地坐落 __ 段 __ 小段 __ 地號）。無門牌者，其房屋稅籍編號：______ 或其位置略圖。\n2. 專有部分建號 ____，權利範圍 ____，面積共計 ______ 平方公尺。\n3. 共有部分建號 __，權利範圍 __，持分面積 __ 平方公尺。\n4. 車位：□有（汽車停車位 __ 個、機車停車位 __ 個）□無。\n（2）機車停車位：地上（下）第 __ 層編號第 __ 號或其位置示意圖。", "opts": ["", "共有部分建號要寫", "專有部分建號要寫", "車位要寫"]}, "5-1-05": {"law": "【住宅包租契約應約定事項 第1點】\n（2）附屬建物用途__，面積__平方公尺。", "note": "標的要寫門牌、建號、附屬建物用途、車位。「格局」是現況確認書的事。", "full": "【住宅包租契約應約定事項 第1點】\n租賃標的\n1. 門牌 __ 縣（市）__ 鄉（鎮、市、區）__街（路）__ 段 __ 巷 __ 弄 __ 號 __ 樓之（基地坐落 __ 段 __ 小段 __ 地號）。無門牌者，其房屋稅籍編號：______ 或其位置略圖。\n（2）附屬建物用途__，面積__平方公尺。\n4. 車位：□有（汽車停車位 __ 個、機車停車位 __ 個）□無。\n（2）機車停車位：地上（下）第 __ 層編號第 __ 號或其位置示意圖。", "opts": ["門牌要寫", "", "附屬建物用途要寫", "車位要寫"]}, "5-1-06": {"law": "【住宅包租契約應約定事項 第1點】\n租賃標的\n2. 專有部分建號 ____，權利範圍 ____，面積共計 ______ 平方公尺。", "note": "專有部分要寫建號、權利範圍、面積。「使用時間」是車位的項目。", "full": "【住宅包租契約應約定事項 第1點】\n租賃標的\n2. 專有部分建號 ____，權利範圍 ____，面積共計 ______ 平方公尺。\n（1）主建物面積：", "opts": ["建號要寫", "權利範圍要寫", "面積要寫", ""]}, "5-1-07": {"law": "【住宅包租契約應約定事項 第7點】\n使用租賃住宅之限制本租賃住宅係供轉租作居住使用，包租業不得變更用途。", "note": "包租的房子只能「轉租給人住」。分租當辦公室就違規了。", "opts": ["", "公證可以", "青銀共居還是居住用途，可以", "包租業願意付水電費，可以"]}, "5-1-08": {"law": "【住宅包租契約應約定事項 第2點】\n租賃期間租賃期間自民國 ____ 年 ____ 月 ____ 日起至民國 ____ 年 ____ 月 ____ 日止。（租賃期間不得少於三十日）", "note": "租期最少30天。", "opts": ["", "不是20日", "不是10日", "不是5日"]}, "5-1-09": {"law": "【住宅包租契約應約定事項 第6點】\n稅費負擔之約定本契約有關稅費，依下列約定辦理：\n（一）租賃住宅之房屋稅、地價稅，由出租人負擔。", "note": "房屋稅、地價稅是房東的，不能約定給包租業。管理費、水電、公證費可以約定。", "opts": ["管理費可約定", "", "水電費可約定", "公證費可約定"]}, "5-1-10": {"law": "【租賃住宅市場發展及管理條例 第13條】\n出租人提供之租賃住宅廣告內容應與事實相符。", "note": "租約到期前提醒房客要不要續約，是好服務。其他都是違規：照片要真、不能亂填資料、不能強行開門。", "full": "【租賃住宅市場發展及管理條例 第13條】\n出租人提供之租賃住宅廣告內容應與事實相符。\n\n（租約屆滿前提醒續約，屬於管理實務的良好做法，沒有條文）", "opts": ["照片要和房子一樣，不能拿別間的", "不能自己亂填別人的資料", "不能強行開門，要走法律程序", ""]}, "5-1-11": {"law": "【住宅包租契約應約定事項 第7點】\n使用租賃住宅之限制本租賃住宅係供轉租作居住使用，包租業不得變更用途。\n\n【住宅包租契約應約定事項 第10點】\n出租人之義務及責任本契約租賃期間，出租人之義務及責任如下：\n（二）應於簽訂本契約時，提供同意本租賃標的之全部或一部分轉租之同意書，並載明租賃標的範圍、租賃期間及得終止本契約之事由。", "note": "包租業不能自己改用途，只能轉租給人住。", "full": "【住宅包租契約應約定事項 第7點】\n使用租賃住宅之限制本租賃住宅係供轉租作居住使用，包租業不得變更用途。\n包租業轉租本租賃住宅或經出租人同意提供他人使用者，應督促次承租人或使用人遵守公寓大廈規約或其他住戶應遵行事項，不得違法使用、存放有爆炸性或易燃性物品，影響公共安全、公共衛生或居住安寧。\n\n【住宅包租契約應約定事項 第10點】\n出租人之義務及責任本契約租賃期間，出租人之義務及責任如下：\n（二）應於簽訂本契約時，提供同意本租賃標的之全部或一部分轉租之同意書，並載明租賃標的範圍、租賃期間及得終止本契約之事由。", "opts": ["包租業不得變更用途，這句對", "", "要督促次承租人守規約，這句對", "房東要給轉租同意書，這句對"]}, "5-1-12": {"law": "【住宅包租契約應約定事項 第8點】\n修繕租賃住宅或附屬設備損壞時，應由包租業負責修繕，其修繕費用，得由租賃雙方視損壞性質及責任歸屬，另行約定負擔方式。\n\n【租賃住宅市場發展及管理條例 第8條】\n出租人為修繕租賃住宅所為之必要行為，承租人不得拒絕。", "note": "壞了包租業要修，但「費用」可以約定誰出，不是一律包租業出。", "full": "【住宅包租契約應約定事項 第8點】\n修繕租賃住宅或附屬設備損壞時，應由包租業負責修繕，其修繕費用，得由租賃雙方視損壞性質及責任歸屬，另行約定負擔方式。\n前項約定由出租人負擔修繕費用者，包租業得請求出租人償還其費用或於第三點約定之租金中扣除。\n\n【租賃住宅市場發展及管理條例 第8條】\n出租人為修繕租賃住宅所為之必要行為，承租人不得拒絕。", "opts": ["", "房東為修繕進來，包租業不能拒絕", "房東該出卻不出，可以從租金扣", "費用可視情形約定誰出"]}, "5-1-13": {"law": "【住宅包租契約應約定事項 第10點】\n前項第二款、第四款之同意轉租及負擔修繕費用之項目、範圍，如附件二「出租人同意轉租範圍、租賃期間及終止租約事由確認書」及附件三「出租人負擔修繕費用之項目及範圍確認書」。\n\n【住宅包租契約應約定事項 第1點】\n□有□無附屬設備，若有，除另有附屬設備清單外，詳如後附租賃標的現況確認書（如附件一）。", "note": "三個附件：現況確認書、轉租範圍等確認書、房東負擔修繕項目確認書。沒有「委託管理書」。", "full": "【住宅包租契約應約定事項 第1點】\n租賃標的\n□有□無附屬設備，若有，除另有附屬設備清單外，詳如後附租賃標的現況確認書（如附件一）。\n\n【住宅包租契約應約定事項 第10點】\n出租人之義務及責任本契約租賃期間，出租人之義務及責任如下：\n前項第二款、第四款之同意轉租及負擔修繕費用之項目、範圍，如附件二「出租人同意轉租範圍、租賃期間及終止租約事由確認書」及附件三「出租人負擔修繕費用之項目及範圍確認書」。", "opts": ["現況確認書是附件", "同意轉租確認書是附件", "", "修繕項目確認書是附件"]}, "5-1-14": {"law": "【住宅包租契約應約定事項 第10點】\n出租人之義務及責任本契約租賃期間，出租人之義務及責任如下：\n（四）簽訂本契約，應先向包租業說明租賃住宅由出租人負擔修繕費用之項目及範圍，並提供有修繕必要時之聯絡方式。", "note": "房東義務：證明有權出租、給轉租同意書、交付可居住的房子。「要求包租業提供篩選房客標準」不是房東的事。", "full": "【住宅包租契約應約定事項 第10點】\n出租人之義務及責任本契約租賃期間，出租人之義務及責任如下：\n（一）應出示有權出租本租賃住宅之證明文件及國民身分證或其他足資證明身分之文件，供包租業核對。\n（二）應於簽訂本契約時，提供同意本租賃標的之全部或一部分轉租之同意書，並載明租賃標的範圍、租賃期間及得終止本契約之事由。\n（三）應以合於所約定居住使用之租賃住宅，交付包租業，並於租賃期間保持其合於居住使用之狀態。\n（四）簽訂本契約，應先向包租業說明租賃住宅由出租人負擔修繕費用之項目及範圍，並提供有修繕必要時之聯絡方式。\n前項第二款、第四款之同意轉租及負擔修繕費用之項目、範圍，如附件二「出租人同意轉租範圍、租賃期間及終止租約事由確認書」及附件三「出租人負擔修繕費用之項目及範圍確認書」。", "opts": ["房東要出示證明", "", "房東要給轉租同意書", "房東要交付能住的房子"]}, "5-1-15": {"law": "【住宅包租契約應約定事項 第11點】\n包租業之義務及責任本契約租賃期間，包租業之義務及責任如下：\n（四）應於簽訂轉租契約後三十日內，以書面將轉租標的範圍、租賃期間、次承租人之姓名及其通訊地址等相關資料通知出租人。", "note": "簽轉租後30天內要「書面」通知房東，不是口頭。", "opts": ["要出示登記證影本，對", "不能超過房東同意的範圍，對", "", "要做日常修繕並留紀錄，對"]}, "5-1-16": {"law": "【住宅包租契約應約定事項 第11點】\n包租業之義務及責任本契約租賃期間，包租業之義務及責任如下：\n（四）應於簽訂轉租契約後三十日內，以書面將轉租標的範圍、租賃期間、次承租人之姓名及其通訊地址等相關資料通知出租人。", "note": "簽轉租後30日內通知房東。", "opts": ["不是1日", "不是5日", "不是10日", ""]}, "5-1-17": {"law": "【住宅包租契約應約定事項 第6點】\n稅費負擔之約定本契約有關稅費，依下列約定辦理：\n（一）租賃住宅之房屋稅、地價稅，由出租人負擔。\n\n【住宅包租契約應約定事項 第11點】\n包租業之義務及責任本契約租賃期間，包租業之義務及責任如下：\n（七）不得轉讓出租人同意轉租權利及其管理業務。", "note": "房屋稅、地價稅是房東的，不是包租業的。", "full": "【住宅包租契約應約定事項 第11點】\n包租業之義務及責任本契約租賃期間，包租業之義務及責任如下：\n（二）應以善良管理人之注意，保管、使用、收益租賃住宅。\n（六）應於收受出租人之有關費用或文件時，開立統一發票或掣給收據。\n（七）不得轉讓出租人同意轉租權利及其管理業務。\n\n【住宅包租契約應約定事項 第6點】\n稅費負擔之約定本契約有關稅費，依下列約定辦理：\n（一）租賃住宅之房屋稅、地價稅，由出租人負擔。", "opts": ["要盡善良管理人責任，是包租業義務", "收錢要開發票或收據，是包租業義務", "", "不能轉讓轉租權利，是包租業義務"]}, "5-1-18": {"law": "【租賃標的現況確認書（住宅包租、轉租、租賃契約附件）第8項】\n本租賃住宅（專有部分）是否曾發生兇殺、自殺、一氧化碳中毒或其他非自然死亡之情事：\n（1）於產權持有期間□有□無曾發生上列情事。\n（2）於產權持有前，出租人：□確認無上列情事。□知道曾發生上列情事。□不知道曾發生上列情事。\n\n【租賃標的現況確認書 第6、7項】\n6　□有□無曾經做過輻射屋檢測？若有，請檢附檢測證明文件。檢測結果是否有輻射異常？\n7　□有□無曾經做過混凝土中水溶性氯離子含量檢測（例如海砂屋檢測事項）；若有，檢測結果：＿＿", "note": "現況確認書要確認：輻射屋、海砂屋、兇殺自殺一氧化碳中毒等非自然死亡。「生病死亡」不用。", "opts": ["海砂屋檢測要確認", "輻射屋檢測要確認", "兇殺案要確認", ""]}, "5-1-19": {"law": "【住宅包租契約應約定事項 第13點】\n依約定得終止租約者，租賃之一方應至少於終止前一個月通知他方。一方未為先期通知而逕行終止租約者，應賠償他方最高不得超過一個月租金額之違約金。", "note": "沒先通知就提前終止，違約金最多1個月租金。", "full": "【住宅包租契約應約定事項 第13點】\n提前終止租約之約定本契約於期限屆滿前，除第十六點及第十七點規定外，租賃雙方□得□不得就租賃住宅之全部或一部終止租約。\n依約定得終止租約者，租賃之一方應至少於終止前一個月通知他方。一方未為先期通知而逕行終止租約者，應賠償他方最高不得超過一個月租金額之違約金。", "opts": ["不是2個月", "", "不是3個月", "不是完全不能約定"]}, "5-1-20": {"law": "【住宅包租契約應約定事項 第10點】\n出租人之義務及責任本契約租賃期間，出租人之義務及責任如下：\n（二）應於簽訂本契約時，提供同意本租賃標的之全部或一部分轉租之同意書，並載明租賃標的範圍、租賃期間及得終止本契約之事由。\n\n【住宅包租契約應約定事項 第11點】\n包租業之義務及責任本契約租賃期間，包租業之義務及責任如下：\n（四）應於簽訂轉租契約後三十日內，以書面將轉租標的範圍、租賃期間、次承租人之姓名及其通訊地址等相關資料通知出租人。", "note": "提供「同意轉租同意書」是房東的義務，不是包租業的。", "full": "【住宅包租契約應約定事項 第11點】\n包租業之義務及責任本契約租賃期間，包租業之義務及責任如下：\n（一）應出示租賃住宅服務業登記證影本，供出租人核對。\n（二）應以善良管理人之注意，保管、使用、收益租賃住宅。\n（四）應於簽訂轉租契約後三十日內，以書面將轉租標的範圍、租賃期間、次承租人之姓名及其通訊地址等相關資料通知出租人。\n\n【住宅包租契約應約定事項 第10點】\n出租人之義務及責任本契約租賃期間，出租人之義務及責任如下：\n（二）應於簽訂本契約時，提供同意本租賃標的之全部或一部分轉租之同意書，並載明租賃標的範圍、租賃期間及得終止本契約之事由。", "opts": ["出示登記證影本是包租業義務", "善良管理人注意是包租業義務", "", "30天內書面通知房東是包租業義務"]}, "5-1-21": {"law": "【住宅包租契約應約定事項 第11點】\n包租業之義務及責任本契約租賃期間，包租業之義務及責任如下：\n（七）不得轉讓出租人同意轉租權利及其管理業務。", "note": "包租業不能把轉租權和管理業務轉讓給別人。", "full": "【住宅包租契約應約定事項 第11點】\n包租業之義務及責任本契約租賃期間，包租業之義務及責任如下：\n（六）應於收受出租人之有關費用或文件時，開立統一發票或掣給收據。\n（七）應配合出租人申請減徵稅捐需要，提供相關證明。\n（七）不得轉讓出租人同意轉租權利及其管理業務。", "opts": ["", "要開發票或收據，對", "要配合房東申請減稅，對", "房東要修繕時要通知次承租人，對"]}, "5-1-22": {"law": "【租賃住宅市場發展及管理條例 第3條】\n本條例用詞，定義如下：\n五、租賃住宅包租業（以下簡稱包租業）：指承租租賃住宅並轉租，及經營該租賃住宅管理業務（以下簡稱包租業務）之公司。", "note": "包租業＝跟房東租來再轉租，還要管理的公司。幫房東管理的是代管業。", "opts": ["", "這是代管業", "這是仲介", "這是代銷"]}, "5-1-23": {"law": "【住宅包租契約應約定事項 第16點】\n出租人提前終止租約租賃期間有下列情形之一者，出租人得提前終止…\n（六）包租業毀損租賃住宅或附屬設備，經出租人定相當期限催告修繕仍不為修繕或相當之賠償。", "note": "房東能提前終止的是「包租業」毀損房子、擅自出借、轉讓權利、擅自裝修。次承租人毀損不在此列。", "full": "【住宅包租契約應約定事項 第16點】\n出租人提前終止租約租賃期間有下列情形之一者，出租人得提前終止租約，包租業不得要求任何賠償：\n（五）包租業違反第七點第二項規定，未經出租人同意，擅自將本租賃住宅以出借或轉租以外之其他方式供他人使用，經出租人阻止仍繼續為之。\n（六）包租業毀損租賃住宅或附屬設備，經出租人定相當期限催告修繕仍不為修繕或相當之賠償。\n（八）包租業違反第九點第一項規定，未經出租人同意，擅自進行室內裝修，經出租人阻止仍繼續為之。\n（十二）包租業違反第十一點第一項第八款規定，將出租人同意轉租權利及其管理業務轉讓予第三人，經出租人阻止仍繼續為之。", "opts": ["擅自出借，房東可終止", "", "轉讓權利，房東可終止", "擅自裝修，房東可終止"]}, "5-1-24": {"law": "【住宅包租契約應約定事項 第23點】\n當事人及相關人員基本資料本契約應記載當事人、租賃住宅管理人員…\n（三）租賃住宅管理人員之姓名、證書字號、通訊地址、聯絡電話、電子郵件信箱。", "note": "契約記載房東、包租業、管理人員的資料。「房東同居人」不用寫。", "full": "【住宅包租契約應約定事項 第23點】\n當事人及相關人員基本資料本契約應記載當事人、租賃住宅管理人員及其基本資料如下：\n（一）出租人之姓名（名稱）、戶籍地址、通訊地址、聯絡電話。\n（二）包租業之公司名稱、代表人姓名、統一編號、登記證字號、營業地址、聯絡電話、電子郵件信箱。\n（三）租賃住宅管理人員之姓名、證書字號、通訊地址、聯絡電話、電子郵件信箱。", "opts": ["房東資料要寫", "包租業資料要寫", "管理人員資料要寫", ""]}, "5-1-25": {"law": "【住宅包租契約不得約定事項 第5點】\n不得約定出租人須繳回契約書。\n\n【住宅包租契約不得約定事項 第6點】\n不得約定本契約之通知，僅以電話方式為之。", "note": "包租契約沒有「不得拋棄審閱期」這項，那是租賃、轉租、委託管理才有。", "full": "【住宅包租契約不得約定事項 第1點】\n不得約定廣告僅供參考。\n\n【住宅包租契約不得約定事項 第2點】\n不得約定次承租人不得遷入戶籍。\n\n【住宅包租契約不得約定事項 第3點】\n不得約定應由包租業負擔之稅費，轉嫁由出租人負擔。\n\n【住宅包租契約不得約定事項 第4點】\n不得約定免除或限制民法上出租人故意不告知之瑕疵擔保責任。\n\n【住宅包租契約不得約定事項 第5點】\n不得約定出租人須繳回契約書。\n\n【住宅包租契約不得約定事項 第6點】\n不得約定本契約之通知，僅以電話方式為之。\n\n【住宅包租契約不得約定事項 第7點】\n不得約定違反強制或禁止規定。", "opts": ["通知僅用電話，不得約定", "違反強制禁止規定，不得約定", "須繳回契約書，不得約定", ""]}, "5-1-26": {"law": "【住宅包租契約應約定事項 第1點】\n□機械式停車位，編號第 __ 號。", "note": "車位要寫：種類、編號、位置、使用時間。「他項權利登記」是整個標的的項目。", "full": "【住宅包租契約應約定事項 第1點】\n租賃標的\n4. 車位：□有（汽車停車位 __ 個、機車停車位 __ 個）□無。\n2. 車位（如無則免填）：\n（1）汽車停車位種類及編號：\n地上（下）第 __ 層□平面式停車位\n□機械式停車位，編號第 __ 號。\n（2）機車停車位：地上（下）第 __ 層編號第 __ 號或其位置示意圖。\n（3）使用時間：", "opts": ["", "平面或機械式要寫", "使用時間要寫", "種類及編號要寫"]}, "5-1-27": {"law": "【租賃住宅市場發展及管理條例 第5條】\n包租業與出租人間之住宅包租契約，其應約定及不得約定事項，由中央主管機關定之。", "note": "包租契約是業者跟房東之間，不算消費關係，不能用消保法處罰。其他三種有消費關係。", "full": "【租賃住宅市場發展及管理條例 第5條】\n租賃契約出租人及承租人間視為具消費關係，適用消費者保護法相關規定。\n包租業與出租人間之住宅包租契約，其應約定及不得約定事項，由中央主管機關定之。", "opts": ["委託管理屬消費關係", "", "轉租屬消費關係", "租賃屬消費關係"]}, "5-1-28": {"law": "【住宅包租契約應約定事項 第1點】\n租賃標的", "note": "有無事項：他項權利、查封登記。「預告登記」不在裡面。", "full": "【住宅包租契約應約定事項 第1點】\n租賃標的\n5. □有□無設定他項權利，若有，權利種類：\n6. □有□無查封登記。", "opts": ["門牌要寫", "查封登記要寫", "他項權利要寫", ""]}, "5-1-29": {"law": "【住宅包租契約應約定事項 第4點】\n押金約定及返還押金由租賃雙方約定為 ___ 個月租金，金額為____ 元整（最高不得超過二個月租金之總額）。", "note": "押金最多2個月租金。", "opts": ["", "不是1個月", "不是3個月", "不是6個月"]}, "5-1-30": {"law": "【住宅包租契約應約定事項 第1點】\n□有□無附屬設備，若有，除另有附屬設備清單外，詳如後附租賃標的現況確認書（如附件一）。", "note": "標的現況以「現況確認書」為準。", "full": "【住宅包租契約應約定事項 第1點】\n租賃標的\n□有□無附屬設備，若有，除另有附屬設備清單外，詳如後附租賃標的現況確認書（如附件一）。", "opts": ["", "點交設備清單只是附屬設備", "廣告資料不是", "委託書不是"]}, "5-1-31": {"law": "【住宅租賃定型化契約不得記載事項 第1點】\n不得記載拋棄審閱期間。\n\n【住宅包租契約不得約定事項 第5點】\n不得約定出租人須繳回契約書。", "note": "包租契約沒有「不得拋棄審閱期」，另外三種有。", "full": "【住宅包租契約不得約定事項 第1點】\n不得約定廣告僅供參考。\n\n【住宅包租契約不得約定事項 第2點】\n不得約定次承租人不得遷入戶籍。\n\n【住宅包租契約不得約定事項 第3點】\n不得約定應由包租業負擔之稅費，轉嫁由出租人負擔。\n\n【住宅包租契約不得約定事項 第4點】\n不得約定免除或限制民法上出租人故意不告知之瑕疵擔保責任。\n\n【住宅包租契約不得約定事項 第5點】\n不得約定出租人須繳回契約書。\n\n【住宅包租契約不得約定事項 第6點】\n不得約定本契約之通知，僅以電話方式為之。\n\n【住宅包租契約不得約定事項 第7點】\n不得約定違反強制或禁止規定。\n\n【住宅租賃定型化契約不得記載事項 第1點】\n不得記載拋棄審閱期間。", "opts": ["委託管理有", "", "轉租有", "租賃有"]}, "5-2-01": {"law": "【住宅轉租定型化契約應記載事項 第2點】\n租賃標的\n2. 專有部分建號 ____，權利範圍 ____，面積共計 ____ 平方公尺。", "note": "建號只有專有部分、共有部分，沒有「公有部分」。", "full": "【住宅轉租定型化契約應記載事項 第2點】\n租賃標的\n2. 專有部分建號 ____，權利範圍 ____，面積共計 ____ 平方公尺。\n3. 共有部分建號 __，權利範圍 __，持分面積 __ 平方公尺。", "opts": ["專有部分建號要記載", "", "共有部分建號要記載", "車位要記載"]}, "5-2-02": {"law": "【租賃標的現況確認書（住宅包租、轉租、租賃契約附件）第8項】\n本租賃住宅（專有部分）是否曾發生兇殺、自殺、一氧化碳中毒或其他非自然死亡之情事：\n（1）於產權持有期間□有□無曾發生上列情事。\n（2）於產權持有前，出租人：□確認無上列情事。□知道曾發生上列情事。□不知道曾發生上列情事。\n\n【租賃標的現況確認書 第6、7項】\n6　□有□無曾經做過輻射屋檢測？若有，請檢附檢測證明文件。檢測結果是否有輻射異常？\n7　□有□無曾經做過混凝土中水溶性氯離子含量檢測（例如海砂屋檢測事項）；若有，檢測結果：＿＿", "note": "現況確認書確認輻射、海砂、兇殺等。「宮廟、焚化廠、變電所」不在內。", "opts": ["海砂屋要確認", "輻射屋要確認", "", "兇殺要確認"]}, "5-2-03": {"law": "【住宅轉租定型化契約應記載事項 第2點】\n□機械式停車位，編號第 __ 號。", "note": "車位記載種類、編號、機械或平面、使用時間。「他項權利」不在內。", "full": "【住宅轉租定型化契約應記載事項 第2點】\n租賃標的\n4. 車位：□有（汽車停車位 ____ 個、機車停車位 ____ 個）□無。\n2. 車位（如無則免填）：\n（1）汽車停車位種類及編號：\n地上（下）第 __ 層□平面式停車位\n□機械式停車位，編號第 __ 號。\n（2）機車停車位：地上（下）第 __ 層編號第 __ 號或其位置示意圖。\n（3）使用時間：", "opts": ["種類編號要記載", "", "使用時間要記載", "機械或平面式要記載"]}, "5-2-04": {"law": "【租賃標的現況確認書（住宅包租、轉租、租賃契約附件）第8項】\n本租賃住宅（專有部分）是否曾發生兇殺、自殺、一氧化碳中毒或其他非自然死亡之情事：\n（1）於產權持有期間□有□無曾發生上列情事。\n（2）於產權持有前，出租人：□確認無上列情事。□知道曾發生上列情事。□不知道曾發生上列情事。", "note": "凶宅要在「房子裡面」發生。上吊自殺在租屋處內，符合。樓梯間、中庭、經過不算。", "opts": ["樓梯間是公共空間", "中庭是公共空間", "", "只是經過，沒死在房裡"]}, "5-2-05": {"law": "【住宅轉租定型化契約不得記載事項 第10點】\n不得約定承租人不得申請租金補貼。", "note": "條文說「不得禁止房客申請租金補貼」。口頭說「申請就要加租」，等於變相禁止。", "opts": ["", "評估租金要納入稅費，妥當", "用公證，妥當", "誠實報稅，妥當"]}, "5-2-06": {"law": "【住宅轉租定型化契約應記載事項 第2點】\n租賃標的", "note": "標的記載他項權利、查封登記、主建物，沒有「預告登記」。", "full": "【住宅轉租定型化契約應記載事項 第2點】\n租賃標的\n（1）主建物面積：\n5. □有□無設定他項權利，若有，權利種類：\n6. □有□無查封登記。", "opts": ["主建物要記載", "查封登記要記載", "", "他項權利要記載"]}, "5-2-07": {"law": "【住宅轉租定型化契約應記載事項 第5點】\n押金約定及返還押金由租賃雙方約定為 ___ 個月租金，金額為______ 元整（最高不得超過二個月租金之總額）。", "note": "押金最多2個月租金。", "opts": ["不是3個月", "不是1個月", "", "不是6個月"]}, "5-2-08": {"law": "【租賃住宅市場發展及管理條例 第29條】\n包租業與次承租人簽訂租賃契約書時，應提供住宅租賃標的現況確認書及前項經出租人同意轉租之書面文件，並於該契約書載明包租業與出租人之住宅租賃標的範圍、租賃期間及得終止租賃契約之事由。\n\n【住宅轉租定型化契約應記載事項 第2點】\n□有□無附屬設備，若有，除另有附屬設備清單外，詳如後附租賃標的現況確認書（如附件一）。", "note": "標的現況看「現況確認書」。", "full": "【住宅轉租定型化契約應記載事項 第2點】\n租賃標的\n□有□無附屬設備，若有，除另有附屬設備清單外，詳如後附租賃標的現況確認書（如附件一）。\n\n【租賃住宅市場發展及管理條例 第29條】\n包租業與次承租人簽訂租賃契約書時，應提供住宅租賃標的現況確認書及前項經出租人同意轉租之書面文件，並於該契約書載明包租業與出租人之住宅租賃標的範圍、租賃期間及得終止租賃契約之事由。", "opts": ["點交清單只是設備", "", "廣告資料不是", "委託書不是"]}, "5-2-09": {"law": "【住宅轉租定型化契約應記載事項 第9點】\n修繕租賃住宅或附屬設備損壞時，應由包租業負責修繕。但其損壞係可歸責於承租人之事由者，不在此限。", "note": "包租業要修，但如果是房客弄壞的就不用，不是「不論如何」。", "full": "【住宅轉租定型化契約應記載事項 第9點】\n修繕租賃住宅或附屬設備損壞時，應由包租業負責修繕。但其損壞係可歸責於承租人之事由者，不在此限。\n前項由包租業負責修繕者，承租人得定相當期限催告修繕，如包租業未於承租人所定相當期限內修繕時，承租人得自行修繕，並請求包租業償還其費用或於第四點約定之租金中扣除。\n包租業為修繕租賃住宅所為之必要行為，應於相當期間先期通知，承租人無正當理由不得拒絕。\n前項包租業於修繕期間，致租賃住宅全部或一部不能居住使用者，承租人得請求包租業扣除該期間全部或一部之租金。", "opts": ["", "修繕必要行為，房客不得拒絕", "包租業不修，房客可自修並扣租金", "修繕期間不能住，可減租金"]}, "5-2-10": {"law": "【住宅轉租定型化契約應記載事項 第14點】\n依約定得終止租約者，租賃之一方應至少於終止前一個月通知他方。一方未為先期通知而逕行終止租約者，應賠償他方最高不得超過一個月租金額之違約金。", "note": "沒先通知就終止，違約金最多1個月租金。", "full": "【住宅轉租定型化契約應記載事項 第14點】\n提前終止租約之約定本契約於期限屆滿前，除第十七點及第十八點規定外，租賃雙方□得□不得終止租約。\n依約定得終止租約者，租賃之一方應至少於終止前一個月通知他方。一方未為先期通知而逕行終止租約者，應賠償他方最高不得超過一個月租金額之違約金。", "opts": ["不是2個月", "", "不是3個月", "不是完全不能約定"]}, "5-2-11": {"law": "【住宅轉租定型化契約應記載事項 第2點】\n（2）附屬建物用途__，面積__平方公尺。", "note": "標的記載門牌、車位、附屬建物用途。「格局」是現況確認書的事。", "full": "【住宅轉租定型化契約應記載事項 第2點】\n租賃標的\n1. 門牌 __ 縣（市）__ 鄉（鎮、市、 區）__街（路）__ 段 __ 巷 __ 弄 __ 號 __ 樓之（基地坐落 __ 段 __ 小段 __ 地號）。無門牌者，其房屋稅籍編號：____ 或其位置略圖。\n（2）附屬建物用途__，面積__平方公尺。\n4. 車位：□有（汽車停車位 ____ 個、機車停車位 ____ 個）□無。\n2. 車位（如無則免填）：\n（1）汽車停車位種類及編號：\n地上（下）第 __ 層□平面式停車位\n□機械式停車位，編號第 __ 號。\n（2）機車停車位：地上（下）第 __ 層編號第 __ 號或其位置示意圖。", "opts": ["門牌要記載", "車位要記載", "附屬建物用途要記載", ""]}, "5-2-12": {"law": "【住宅轉租定型化契約應記載事項 第10點】\n室內裝修承租人有室內裝修之需要，應經包租業同意並依相關法令規定辦理，且不得損害原有建築結構之安全。", "note": "裝修費沒有規定「一定」包租業出，雙方可以約定。", "opts": ["經同意才能裝修，且不能傷結構，對", "", "裝修增設的東西壞了，房客修，對", "返還時可約定回復原狀或現況返還，對"]}, "5-2-13": {"law": "【住宅轉租定型化契約應記載事項 第2點】\n租賃標的\n2. 專有部分建號 ____，權利範圍 ____，面積共計 ____ 平方公尺。", "note": "專有部分記載建號、權利範圍、面積。「使用時間」是車位的。", "opts": ["", "權利範圍要記載", "面積要記載", "建號要記載"]}, "5-2-14": {"law": "【住宅轉租定型化契約應記載事項 第2點】\n租賃標的\n3. 共有部分建號 __，權利範圍 __，持分面積 __ 平方公尺。", "note": "要記載主建物用途、附屬建物用途、共有部分持分面積。「共有部分用途」不在內。", "full": "【住宅轉租定型化契約應記載事項 第2點】\n租賃標的\n（1）主建物面積：\n（2）附屬建物用途__，面積__平方公尺。\n3. 共有部分建號 __，權利範圍 __，持分面積 __ 平方公尺。", "opts": ["", "主建物用途要記載", "附屬建物用途要記載", "共有部分持分面積要記載"]}, "5-2-15": {"law": "【住宅轉租定型化契約不得記載事項 第7點】\n不得約定承租人須繳回契約書。\n\n【住宅轉租定型化契約不得記載事項 第2點】\n不得約定廣告僅供參考。", "note": "不得記載：廣告僅供參考、轉嫁稅費、須繳回契約書。「不得辦公司登記」不在其中。", "full": "【住宅轉租定型化契約不得記載事項 第1點】\n不得約定拋棄審閱期間。\n\n【住宅轉租定型化契約不得記載事項 第2點】\n不得約定廣告僅供參考。\n\n【住宅轉租定型化契約不得記載事項 第3點】\n不得約定承租人不得申報租賃費用支出。\n\n【住宅轉租定型化契約不得記載事項 第4點】\n不得約定承租人不得遷入戶籍。\n\n【住宅轉租定型化契約不得記載事項 第5點】\n不得約定應由包租業或租賃住宅所有權人負擔之稅賦，若較出租前增加時，其增加部分由承租人負擔。\n\n【住宅轉租定型化契約不得記載事項 第6點】\n不得約定免除或限制民法上包租業故意不告知之瑕疵擔保責任。\n\n【住宅轉租定型化契約不得記載事項 第7點】\n不得約定承租人須繳回契約書。\n\n【住宅轉租定型化契約不得記載事項 第8點】\n不得約定本契約之通知僅以電話方式為之。\n\n【住宅轉租定型化契約不得記載事項 第9點】\n不得約定違反強制或禁止規定。\n\n【住宅轉租定型化契約不得記載事項 第10點】\n不得約定承租人不得申請租金補貼。", "opts": ["廣告僅供參考，不得記載", "", "稅費轉嫁房客，不得記載", "須繳回契約書，不得記載"]}, "5-2-16": {"law": "【住宅轉租定型化契約應記載事項 第7點】\n稅費負擔之約定本契約有關稅費，依下列約定辦理：\n（二）依營業稅法規定應開立發票報繳之營業稅，由包租業負擔。\n\n【住宅轉租定型化契約應記載事項 第6點】\n租賃期間因不可歸責於雙方當事人之事由，致本費用增加者，承租人就增加部分之金額，以負擔百分之十為限；如本費用減少者，承租人負擔減少後之金額。", "note": "管理費可以雙方約定誰出。房屋稅、地價稅、營業稅不能轉嫁給房客。", "full": "【住宅轉租定型化契約應記載事項 第6點】\n租賃期間相關費用之支付租賃期間，使用租賃住宅所生之相關費用：\n（一）管理費：\n租賃期間因不可歸責於雙方當事人之事由，致本費用增加者，承租人就增加部分之金額，以負擔百分之十為限；如本費用減少者，承租人負擔減少後之金額。\n\n【住宅轉租定型化契約應記載事項 第7點】\n稅費負擔之約定本契約有關稅費，依下列約定辦理：\n（一）包租業收取現金者，其銀錢收據應貼用之印花稅票，由包租業負擔。\n（二）依營業稅法規定應開立發票報繳之營業稅，由包租業負擔。", "opts": ["", "房屋稅是房東的", "地價稅是房東的", "營業稅是包租業的"]}, "5-2-17": {"law": "【住宅轉租定型化契約應記載事項 第11點】\n包租業之義務及責任本契約租賃期間，包租業之義務及責任如下：\n（五）應製作租賃標的現況確認書（如附件一），並於簽訂本契約時，以該確認書及本契約向承租人解說。", "note": "包租業一定要自己做現況確認書，不是房東自己講。", "full": "【住宅轉租定型化契約應記載事項 第11點】\n包租業之義務及責任本契約租賃期間，包租業之義務及責任如下：\n（一）應出示租賃住宅服務業登記證影本，供承租人核對。\n（二）應向承租人提供包租契約之出租人（以下簡稱原出租人）同意轉租之書面文件，並載明其與原出租人之租賃標的範圍、租賃期間及得終止住宅包租契約之事由。\n（五）應製作租賃標的現況確認書（如附件一），並於簽訂本契約時，以該確認書及本契約向承租人解說。", "opts": ["要出示登記證影本，對", "要提供轉租同意書，對", "交付能住的房子，對", ""]}, "5-2-18": {"law": "【住宅轉租定型化契約應記載事項 第9點】\n修繕租賃住宅或附屬設備損壞時，應由包租業負責修繕。但其損壞係可歸責於承租人之事由者，不在此限。\n\n【住宅轉租定型化契約應記載事項 第11點】\n包租業之義務及責任本契約租賃期間，包租業之義務及責任如下：\n（六）應於收受承租人之有關費用或文件時，開立統一發票或掣給收據。", "note": "修繕有例外，房客弄壞的不用包租業負責，不是「不論如何」。", "full": "【住宅轉租定型化契約應記載事項 第9點】\n修繕租賃住宅或附屬設備損壞時，應由包租業負責修繕。但其損壞係可歸責於承租人之事由者，不在此限。\n前項由包租業負責修繕者，承租人得定相當期限催告修繕，如包租業未於承租人所定相當期限內修繕時，承租人得自行修繕，並請求包租業償還其費用或於第四點約定之租金中扣除。\n包租業為修繕租賃住宅所為之必要行為，應於相當期間先期通知，承租人無正當理由不得拒絕。\n前項包租業於修繕期間，致租賃住宅全部或一部不能居住使用者，承租人得請求包租業扣除該期間全部或一部之租金。\n\n【住宅轉租定型化契約應記載事項 第11點】\n包租業之義務及責任本契約租賃期間，包租業之義務及責任如下：\n（六）應於收受承租人之有關費用或文件時，開立統一發票或掣給收據。", "opts": ["", "收錢要開發票，對", "要配合房東減稅，對", "房東要修繕時要通知次承租人，對"]}, "5-2-19": {"law": "【租賃住宅市場發展及管理條例 第3條】\n本條例用詞，定義如下：\n九、轉租：指承租租賃住宅，以其全部或一部租與他人居住使用，他人支付租金之租賃行為。\n\n【住宅轉租定型化契約應記載事項 第1點】\n契約審閱期住宅轉租契約（以下簡稱本契約）於民國 __年 __ 月 __ 日經承租人攜回審閱 __ 日（契約審閱期間至少三日）。", "note": "只有「包租業轉租給人住」才適用。辦公室、店面、同學分租都不適用。", "full": "【租賃住宅市場發展及管理條例 第3條】\n本條例用詞，定義如下：\n五、租賃住宅包租業（以下簡稱包租業）：指承租租賃住宅並轉租，及經營該租賃住宅管理業務（以下簡稱包租業務）之公司。\n八、租賃住宅管理人員：指租賃住宅服務業依本條例規定所置從事代管業務或包租業務之人員。\n九、轉租：指承租租賃住宅，以其全部或一部租與他人居住使用，他人支付租金之租賃行為。\n\n【住宅轉租定型化契約應記載事項 第1點】\n契約審閱期住宅轉租契約（以下簡稱本契約）於民國 __年 __ 月 __ 日經承租人攜回審閱 __ 日（契約審閱期間至少三日）。\n包租業簽章：\n承租人簽章：", "opts": ["辦公室不是居住", "", "同學分租不是包租業轉租", "店面騎樓不是居住"]}, "5-2-20": {"law": "【住宅轉租定型化契約應記載事項 第6點】\n□以用電度數計費者，每度電費不得超過該租賃標的電費單「當期每度平均電價」；如公共設施電費未向台灣電力股份有限公司申辦分攤併入租賃標的電費內者，包租業不得額外收取。\n\n【住宅轉租定型化契約應記載事項 第11點】\n包租業之義務及責任本契約租賃期間，包租業之義務及責任如下：\n（十）依第六點規定約定電費由承租人負擔者，包租業應提供承租人租賃標的之電費資訊。承租人亦得逕向台灣電力股份有限公司申辦查詢租賃期間之有關電費資訊。", "note": "電費每度不得超過電費單的「當期每度平均電價」，不是固定十元。", "full": "【住宅轉租定型化契約應記載事項 第6點】\n租賃期間相關費用之支付租賃期間，使用租賃住宅所生之相關費用：\n□以用電度數計費者，每度電費不得超過該租賃標的電費單「當期每度平均電價」；如公共設施電費未向台灣電力股份有限公司申辦分攤併入租賃標的電費內者，包租業不得額外收取。\n□非以用電度數計費者，包租業所收取之每期電費總金額，不得超過該租賃標的電費單之每期電費總額。\n\n【住宅轉租定型化契約應記載事項 第11點】\n包租業之義務及責任本契約租賃期間，包租業之義務及責任如下：\n（十）依第六點規定約定電費由承租人負擔者，包租業應提供承租人租賃標的之電費資訊。承租人亦得逕向台灣電力股份有限公司申辦查詢租賃期間之有關電費資訊。", "opts": ["每度不得超過當期平均電價，對", "非按度數收，總額不得超過電費單，對", "房客可向台電查電費資訊，對", ""]}, "5-3-01": {"law": "【租賃住宅市場發展及管理條例 第3條】\n本條例用詞，定義如下：\n六、租賃住宅管理業務：指租賃住宅之屋況與設備點交、收租與押金管理、日常修繕維護、糾紛協調處理及其他與租賃住宅管理有關之事項。", "note": "代管服務有：點交、收租押金、修繕、糾紛處理。「搬家」不在內。", "opts": ["屋況設備點交是代管項目", "", "管理押金是代管項目", "遺留物處理是代管項目"]}, "5-3-02": {"law": "【租賃住宅委託管理定型化契約應記載事項 第9點】\n受託人之義務及責任委託管理期間，受託人之義務如下：\n（十一）不得委託他代管業執行租賃住宅管理業務。\n\n【租賃住宅委託管理定型化契約應記載事項 第7點】\n委託管理標的經租賃契約約定由承租人負責修繕及負擔費用者，得由受託人代為督促之；承租人對於應負責修繕之項目或費用有爭執時，受託人應代為協調。", "note": "代收押金租金，要在30天內交給委託人。", "full": "【租賃住宅委託管理定型化契約應記載事項 第9點】\n受託人之義務及責任委託管理期間，受託人之義務如下：\n（七）依第五點第八款第一目或第二目規定，代為收取租金或押金者，應按約定交付方式，於代為收取之日起＿日（不得超過三十日）內交付委託人。但委任雙方另訂有保管約定者，依其約定。\n（十一）不得委託他代管業執行租賃住宅管理業務。\n\n【租賃住宅委託管理定型化契約應記載事項 第7點】\n修繕之處理委託管理標的經租賃契約約定由委託人負責修繕者，得委由受託人修繕；其費用，由委託人負擔。\n委託管理標的經租賃契約約定由承租人負責修繕及負擔費用者，得由受託人代為督促之；承租人對於應負責修繕之項目或費用有爭執時，受託人應代為協調。", "opts": ["不得再委託別家代管業", "已簽租約也能委託", "", "租約約定房客修的，受託人可以代為督促"]}, "5-3-03": {"law": "【租賃住宅委託管理定型化契約應記載事項 第10點】\n租賃住宅返還之處理委託管理標的之租賃關係消滅時，受託人應即結算相關費用，督促承租人將租賃住宅返還委託人，並遷出戶籍或其他登記。", "note": "租期結束受託人要：結算費用、督促房客搬走並遷出戶籍。「清潔房子」不在內。", "opts": ["協助結清費用是義務", "督促遷出戶籍是義務", "督促返還房子是義務", ""]}, "5-3-04": {"law": "【租賃住宅委託管理定型化契約應記載事項 第2點】\n委託管理標的", "note": "委託標的記載門牌、建號、車位、附屬建物用途。「格局」不在內。", "full": "【租賃住宅委託管理定型化契約應記載事項 第2點】\n委託管理標的\n1. 門牌 __ 縣（市）__ 鄉（鎮、市、區）__街（路）__ 段 __ 巷 __ 弄 __ 號 __ 樓之__（基地坐落 __ 段 __ 小段 __ 地號）。\n無門牌者，其房屋稅籍編號：_____ 或其位置略圖。\n（2）附屬建物用途 ____，面積 ____ 平方公尺。\n4. 車位：□有（汽車停車位 __ 個、機車停車位 __ 個）□無。\n2. 車位：（如無則免填）（1）汽車停車位種類及編號：\n地上（下）第 __ 層□平面式停車位\n□機械式停車位，編號第 __ 號。\n（2）機車停車位：", "opts": ["", "門牌要記載", "車位要記載", "附屬建物用途要記載"]}, "5-3-05": {"law": "【租賃住宅委託管理定型化契約應記載事項 第10點】\n租賃住宅返還之處理委託管理標的之租賃關係消滅時，受託人應即結算相關費用，督促承租人將租賃住宅返還委託人，並遷出戶籍或其他登記。\n\n【租賃住宅市場發展及管理條例 第16條】\n住宅租賃爭議，出租人或承租人得向直轄市或縣（市）政府申請調處，並免繳調處費用。", "note": "房客不搬，要建議房東走調解或調處。半夜敲門、斷水電、半夜打電話都不行。", "opts": ["", "半夜大聲敲門，不當", "斷水電是私力救濟，不行", "半夜連續打電話，不當"]}, "5-3-06": {"law": "【租賃住宅委託管理定型化契約應記載事項 第2點】\n委託管理標的\n3. 共有部分建號 __，權利範圍 __，持分面積 __ 平方公尺。", "note": "標的記載主建物用途、附屬建物用途、共有部分持分面積。「共有部分用途」不用。", "full": "【租賃住宅委託管理定型化契約應記載事項 第2點】\n委託管理標的\n（1）主建物面積：__ 層 __ 平方公尺，__層 __ 平方公尺，__ 層 __ 平方公尺共計 __ 平方公尺，用途 ___。\n（2）附屬建物用途 ____，面積 ____ 平方公尺。\n3. 共有部分建號 __，權利範圍 __，持分面積 __ 平方公尺。", "opts": ["主建物用途要記載", "", "附屬建物用途要記載", "共有部分持分面積要記載"]}, "5-3-07": {"law": "【民法 第528條】\n稱委任者，謂當事人約定，一方委託他方處理事務，他方允為處理之契約。", "note": "房東跟代管公司是「委任」關係。", "opts": ["不是承攬", "不是僱傭", "", "不是租賃"]}, "5-3-08": {"law": "【租賃住宅委託管理定型化契約應記載事項 第2點】\n委託管理標的", "note": "標的記載他項權利、查封登記、主建物，沒有「預告登記」。", "full": "【租賃住宅委託管理定型化契約應記載事項 第2點】\n委託管理標的\n（1）主建物面積：__ 層 __ 平方公尺，__層 __ 平方公尺，__ 層 __ 平方公尺共計 __ 平方公尺，用途 ___。\n5.□有□無設定他項權利，若有，權利種類：\n6. □有□無查封登記。", "opts": ["查封登記要記載", "", "主建物要記載", "他項權利要記載"]}, "5-3-09": {"law": "【租賃住宅委託管理定型化契約應記載事項 第11點】\n委託人提前終止契約委託管理期間有下列情形之一者，委託人得提前…\n（三）受託人違反第九點第一項第十一款規定，委託他代管業執行租賃住宅管理業務。", "note": "房東可終止的：受託人不處理糾紛、不交代收款、擅自轉委託。「房客遭通緝失聯」不是受託人的錯。", "full": "【租賃住宅委託管理定型化契約應記載事項 第11點】\n委託人提前終止契約委託管理期間有下列情形之一者，委託人得提前終止本契約：\n（一）受託人違反第九點第一項第六款代為協調處理租賃糾紛之規定，經委託人定相當期間催告，仍不於期限內處理。\n（二）受託人違反第九點第一項第七款依期限交付代為收取之租金或押金之規定，經委託人定相當期間催告，仍不於期限內交付。\n（三）受託人違反第九點第一項第十一款規定，委託他代管業執行租賃住宅管理業務。", "opts": ["不處理糾紛，可終止", "不交代收款，可終止", "擅自轉委託，可終止", ""]}, "5-3-10": {"law": "【租賃住宅委託管理定型化契約應記載事項 第7點】\n修繕之處理委託管理標的經租賃契約約定由委託人負責修繕者，得委由受託人修繕；其費用，由委託人負擔。\n\n【租賃住宅委託管理定型化契約應記載事項 第9點】\n受託人之義務及責任委託管理期間，受託人之義務如下：\n（六）依第五點第五款規定，代為協調處理租賃糾紛者，應包括承租人使用委託管理標的之糾紛。", "note": "修繕費是委託人（房東）出，不是受託人。", "full": "【租賃住宅委託管理定型化契約應記載事項 第7點】\n修繕之處理委託管理標的經租賃契約約定由委託人負責修繕者，得委由受託人修繕；其費用，由委託人負擔。\n委託管理標的經租賃契約約定由承租人負責修繕及負擔費用者，得由受託人代為督促之；承租人對於應負責修繕之項目或費用有爭執時，受託人應代為協調。\n\n【租賃住宅委託管理定型化契約應記載事項 第9點】\n受託人之義務及責任委託管理期間，受託人之義務如下：\n（五）依第五點第四款或第八款第五目規定，代為辦理日常修繕維護或清潔事務者，應製作執行紀錄，提供委託人查詢或取閱。\n（六）依第五點第五款規定，代為協調處理租賃糾紛者，應包括承租人使用委託管理標的之糾紛。", "opts": ["", "代為點交，對", "日常修繕要有紀錄，對", "協調糾紛，對"]}, "5-3-11": {"law": "【租賃住宅委託管理定型化契約應記載事項 第9點】\n受託人之義務及責任委託管理期間，受託人之義務如下：\n（七）依第五點第八款第一目或第二目規定，代為收取租金或押金者，應按約定交付方式，於代為收取之日起＿日（不得超過三十日）內交付委託人。但委任雙方另訂有保管約定者，依其約定。", "note": "代收押金租金，30天內交給委託人。", "opts": ["不是當日", "", "不是7日", "不是5日"]}, "5-3-12": {"law": "【租賃住宅委託管理定型化契約應記載事項 第9點】\n受託人之義務及責任委託管理期間，受託人之義務如下：\n（十一）不得委託他代管業執行租賃住宅管理業務。", "note": "「轉委託給別家代管業」是不能做的事，不是義務。", "opts": ["協調糾紛是義務", "依期限交付代收款是義務", "", "配合房東減稅是義務"]}, "5-3-13": {"law": "【租賃住宅委託管理定型化契約應記載事項 第2點】\n委託管理標的", "note": "建號只有專有部分、共有部分，沒有「公有部分」。", "full": "【租賃住宅委託管理定型化契約應記載事項 第2點】\n委託管理標的\n2. 專有部分建號 ___，權利範圍 ___，面積共計 ___ 平方公尺。\n3. 共有部分建號 __，權利範圍 __，持分面積 __ 平方公尺。", "opts": ["專有部分建號要記載", "共有部分建號要記載", "", "車位要記載"]}, "5-3-14": {"law": "【租賃住宅委託管理定型化契約應記載事項 第2點】\n□機械式停車位，編號第 __ 號。", "note": "車位記載種類編號、機械或平面、使用時間。「他項權利」不在內。", "full": "【租賃住宅委託管理定型化契約應記載事項 第2點】\n委託管理標的\n4. 車位：□有（汽車停車位 __ 個、機車停車位 __ 個）□無。\n2. 車位：（如無則免填）（1）汽車停車位種類及編號：\n地上（下）第 __ 層□平面式停車位\n□機械式停車位，編號第 __ 號。\n（2）機車停車位：\n（3）使用時間：", "opts": ["種類編號要記載", "機械或平面式要記載", "", "使用時間要記載"]}, "5-3-15": {"law": "【租賃住宅市場發展及管理條例 第3條】\n本條例用詞，定義如下：\n一、租賃住宅：指以出租供居住使用之建築物。", "note": "租賃住宅是「給人住」的。店面是營業用。", "opts": ["套房是住宅", "雅房是住宅", "公寓是住宅", ""]}, "5-3-16": {"law": "【租賃住宅委託管理定型化契約應記載事項 第4點】\n報酬約定及給付委託人應按□月□期（__ 個月）給付報酬予受託人；其報酬為□委託管理標的月租金額百分之____ □新臺幣（下同）__ 元，委託人應於每□月", "note": "報酬可約定月租金的幾%或固定金額，條文沒訂上限。", "full": "【租賃住宅委託管理定型化契約應記載事項 第4點】\n報酬約定及給付委託人應按□月□期（__ 個月）給付報酬予受託人；其報酬為□委託管理標的月租金額百分之____ □新臺幣（下同）__ 元，委託人應於每□月\n□期__日前給付，非有正當理由不得拖延或拒絕，受託人於委託管理期間非有正當理由亦不得要求調漲報酬。\n前項報酬給付方式：□現金繳付□於代為收取之租金內扣付□轉帳繳付：金融機構：____，戶名：", "opts": ["沒有6%的上限", "沒有5%的上限", "沒有10%的上限", ""]}, "5-3-17": {"law": "【租賃住宅委託管理定型化契約應記載事項 第5點】\n委託管理項目委託管理期間，受託人代為管理項目如下：\n（二）居住者身分之確認。", "note": "委託項目有點交、確認住戶身分、催收租金。「以業者名義聲請支付命令」不是。", "full": "【租賃住宅委託管理定型化契約應記載事項 第5點】\n委託管理項目委託管理期間，受託人代為管理項目如下：\n（一）屋況與設備點交。\n（二）居住者身分之確認。\n（三）向承租人催收（繳）租金及相關費用。\n（四）日常修繕維護事項：\n（五）糾紛協調處理。", "opts": ["點交是委託項目", "確認居住者身分是委託項目", "", "催收租金是委託項目"]}, "5-3-18": {"law": "【租賃住宅委託管理定型化契約應記載事項 第7點】\n修繕之處理委託管理標的經租賃契約約定由委託人負責修繕者，得委由受託人修繕；其費用，由委託人負擔。\n\n【租賃住宅委託管理定型化契約應記載事項 第8點】\n委託人之義務及責任委託人應據實提供附件之委託管理標的現況確認書相關資訊，並確保合於租賃契約所約定居住使用之狀態。", "note": "房東負責修繕的，可以請受託人處理，費用「房東出」。", "full": "【租賃住宅委託管理定型化契約應記載事項 第7點】\n修繕之處理委託管理標的經租賃契約約定由委託人負責修繕者，得委由受託人修繕；其費用，由委託人負擔。\n委託管理標的經租賃契約約定由承租人負責修繕及負擔費用者，得由受託人代為督促之；承租人對於應負責修繕之項目或費用有爭執時，受託人應代為協調。\n\n【租賃住宅委託管理定型化契約應記載事項 第8點】\n委託人之義務及責任委託人應據實提供附件之委託管理標的現況確認書相關資訊，並確保合於租賃契約所約定居住使用之狀態。\n簽訂本契約時，委託人應出示有權委託管理本租賃住宅之證明文件、國民身分證或其他足資證明身分之文件，供受託人核對；如有同意受託人代為收取租金、押金者，並應提供交付之方式。", "opts": ["", "房東要據實提供現況，對", "房東要出示權利證明，對", "同意代收的要說明交付方式，對"]}, "5-3-19": {"law": "【租賃住宅委託管理定型化契約應記載事項 第10點】\n租賃住宅返還之處理委託管理標的之租賃關係消滅時，受託人應即結算相關費用，督促承租人將租賃住宅返還委託人，並遷出戶籍或其他登記。\n\n【租賃住宅委託管理定型化契約應記載事項 第9點】\n受託人之義務及責任委託管理期間，受託人之義務如下：\n（四）依第五點第三款規定，代為向承租人催收（繳）租金及相關費用者，應於繳款期限屆滿後＿日內催收（繳）。", "note": "督促房客搬走要依法來，斷水斷電是私力救濟，不行。", "opts": ["", "要依法律規定，對", "督促返還並結算費用，對", "催收租金，對"]}, "5-4-01": {"law": "【住宅租賃定型化契約應記載事項 第7點】\n稅費負擔之約定本契約有關稅費，依下列約定辦理：\n(一)租賃住宅之房屋稅、地價稅由出租人負擔。", "note": "房屋稅、地價稅是房東的，不能約定給房客。管理費、水電、公證費可以自由約定。", "opts": ["管理費可自由約定", "", "水電費可自由約定", "公證費可自由約定"]}, "5-4-02": {"law": "【住宅租賃定型化契約應記載事項 第2點】\n租賃標的", "note": "標的記載他項權利、查封登記、主建物，沒有「預告登記」。", "full": "【住宅租賃定型化契約應記載事項 第2點】\n租賃標的\n(1)主建物面積：\n5、□有□無設定他項權利，若有，權利種類：_______。\n6、□有□無查封登記。", "opts": ["", "查封登記要記載", "主建物要記載", "他項權利要記載"]}, "5-4-03": {"law": "【住宅租賃定型化契約應記載事項 第21點】\n□二、承租人未依約給付之欠繳租金、費用及出租人或租賃住宅所有權人代繳之管理費，或違約時應支付之金額。", "note": "公證後可強制執行的三件事：房客屆滿不搬、房客欠租或違約金、房東屆滿該還押金。房東提前終止後房客不搬，不在內。", "full": "【住宅租賃定型化契約應記載事項 第21點】\n其他約定本契約租賃雙方□同意□不同意辦理公證。\n本契約經辦理公證者，租賃雙方□不同意；□同意公證書載明下列事項應逕受強制執行：\n□一、承租人如於租期屆滿後不返還租賃住宅。\n□二、承租人未依約給付之欠繳租金、費用及出租人或租賃住宅所有權人代繳之管理費，或違約時應支付之金額。\n□三、出租人如於租期屆滿或本契約終止時，應返還承租人之全部或一部押金。\n公證書載明金錢債務逕受強制執行時，如有保證人者，前項後段第 款之效力及於保證人。", "opts": ["屆滿不返還，可強執", "欠租費用違約金，可強執", "房東該還押金，可強執", ""]}, "5-4-04": {"law": "【住宅租賃定型化契約應記載事項 第8點】\n使用租賃住宅之限制本租賃住宅係供居住使用，承租人不得變更用途。", "note": "使用限制沒有「不得養寵物」。", "full": "【住宅租賃定型化契約應記載事項 第8點】\n使用租賃住宅之限制本租賃住宅係供居住使用，承租人不得變更用途。\n承租人同意遵守公寓大廈規約或其他住戶應遵行事項，不得違法使用、存放有爆炸性或易燃性物品。\n承租人應經出租人同意始得將本租賃住宅之全部或一部分轉租、出借或以其他方式供他人使用，或將租賃權轉讓於他人。", "opts": ["", "不得變更用途，是限制", "不得存放易燃爆炸物，是限制", "轉租要提示同意書，是限制"]}, "5-4-05": {"law": "【住宅租賃定型化契約應記載事項 第7點】\n稅費負擔之約定本契約有關稅費，依下列約定辦理：\n(二)本契約租賃雙方同意辦理公證者，其公證費 元整。", "note": "公證費可以自由約定誰出。房屋稅、地價稅是房東的。", "opts": ["房屋稅是房東的", "地價稅是房東的", "所得稅各付各的", ""]}, "5-4-06": {"law": "【住宅租賃定型化契約應記載事項 第2點】\n地上(下）第__層□平面式停車位□機械式停車位，編號第__號車位個。(如無則免填)(2)機車停車位：地上(下）第__層編號第__號或其位置示意圖。", "note": "車位記載種類編號、機械或平面、使用時間。「他項權利」不在內。", "full": "【住宅租賃定型化契約應記載事項 第2點】\n租賃標的\n4、車位：□有（汽車停車位__個、機車停車位__個）□無。\n2、車位(如無則免填)：\n(1)汽車停車位種類及編號：\n地上(下）第__層□平面式停車位□機械式停車位，編號第__號車位個。(如無則免填)(2)機車停車位：地上(下）第__層編號第__號或其位置示意圖。\n(3)使用時間：", "opts": ["種類編號要記載", "機械或平面式要記載", "使用時間要記載", ""]}, "5-4-07": {"law": "【住宅租賃定型化契約應記載事項 第2點】\n(2)附屬建物用途__，面積__平方公尺。", "note": "標的記載門牌、附屬建物用途、車位。「格局」是現況確認書的事。", "full": "【住宅租賃定型化契約應記載事項 第2點】\n租賃標的\n1、門牌__縣(市)__鄉（鎮、市、區）__街(路)__段__巷__弄__號__樓之 (基地坐落__段__小段__地號。)。無門牌者，其房屋稅籍編號： 或其位置略圖。\n(2)附屬建物用途__，面積__平方公尺。\n4、車位：□有（汽車停車位__個、機車停車位__個）□無。\n2、車位(如無則免填)：\n(1)汽車停車位種類及編號：\n地上(下）第__層□平面式停車位□機械式停車位，編號第__號車位個。(如無則免填)(2)機車停車位：地上(下）第__層編號第__號或其位置示意圖。", "opts": ["門牌要記載", "附屬建物用途要記載", "", "車位要記載"]}, "5-4-08": {"law": "【住宅租賃定型化契約應記載事項 第15點】\n承租人未依第一項規定返還租賃住宅時，出租人應即明示不以不定期限繼續契約，並得向承租人請求未返還租賃住宅期間之相當月租金額，及相當月租金額計算之違約金(未足一個月者，以日租金折算)至返還為止。", "note": "房客逾期不還房子的違約金，可以從押金扣。", "full": "【住宅租賃定型化契約應記載事項 第15點】\n租賃住宅之返還租賃關係消滅時，出租人應即結算租金及第六點約定之相關費用，並會同承租人共同完成屋況及附屬設備之點交手續，承租人應將租賃住宅返還出租人並遷出戶籍或其他登記。\n前項租賃之一方未會同點交，經他方定相當期限催告仍不會同者，視為完成點交。\n承租人未依第一項規定返還租賃住宅時，出租人應即明示不以不定期限繼續契約，並得向承租人請求未返還租賃住宅期間之相當月租金額，及相當月租金額計算之違約金(未足一個月者，以日租金折算)至返還為止。\n前項金額與承租人未繳清之租金及第六點約定之相關費用，出租人得由第五點第一項規定之押金中抵充，如有不足，並得向承租人請求給付不足之金額或費用。", "opts": ["屆滿要結算並遷出戶籍，對", "一方不點交，催告後視為完成，對", "逾期可請求相當月租的違約金，對", ""]}, "5-4-09": {"law": "【住宅租賃定型化契約應記載事項 第14點】\n一方未為先期通知而逕行終止租約者，應賠償他方最高不得超過一個月租金額之違約金。", "note": "沒先通知就終止，違約金最多1個月租金，不是2個月。", "full": "【住宅租賃定型化契約應記載事項 第14點】\n任意終止租約之約定本契約於期限屆滿前，除依第十七點及第十八點規定得提前終止租約外，租賃雙方□得□不得任意終止租約。\n依前項約定得終止租約者，租賃之一方應至少於終止前一個月通知他方。\  "note": "電費每度不能超過電費單的平均電價，不能因為方便就超收。", "full": "【住宅租賃定型化契約應記載事項 第6點】\n租賃期間相關費用之約定租賃期間，使用租賃住宅所生之相關費用，依下列約定辦理：\n□以用電度數計費者，每度電費不得超過該租賃標的電費單「當期每度平均電價」；如公共設施電費未向台灣電力股份有限公司申辦分攤併入租賃標的電費內者，出租人不得額外收取。\n□非以用電度數計費者，出租人所收取之每期電費總金額，不得超過該租賃標的電費單之每期電費總額。", "opts": ["每度不得超過平均電價，對", "", "房客可向台電查詢，對", "非按度數收，總額不得超過電費單，對"]}, "5-4-21": {"law": "【租賃住宅市場發展及管理條例 第3條】\n本條例用詞，定義如下：\n一、租賃住宅：指以出租供居住使用之建築物。", "note": "住宅租賃契約是給人居住用的。辦公室不適用。", "opts": ["", "社會住宅是居住，適用", "租給學生住，適用", "租給未成年人住，適用"]}, "5-4-22": {"law": "【租賃住宅市場發展及管理條例 第3條】\n十三、押金：指承租人為擔保租賃住宅之損害賠償行為及處理遺留物責任，預為支付之金錢。", "note": "押金擔保的是：損害賠償責任和處理遺留物。", "opts": ["", "租金不是押金的擔保範圍", "水電費不是條文列舉", "管理費不是條文列舉"]}, "5-4-23": {"law": "【住宅租賃定型化契約應記載事項 第15點】\n承租人未依第一項規定返還租賃住宅時，出租人應即明示不以不定期限繼續契約，並得向承租人請求未返還租賃住宅期間之相當月租金額，及相當月租金額計算之違約金(未足一個月者，以日租金折算)至返還為止。\n\n【民法 第179條】\n無法律上之原因而受利益，致他人受損害者，應返還其利益。雖有法律上之原因，而其後已不存在者，亦同。", "note": "房客欠租不搬，房東可請求違約金、不當得利、訴請返還房屋。精神賠償不行。", "full": "【住宅租賃定型化契約應記載事項 第15點】\n租賃住宅之返還租賃關係消滅時，出租人應即結算租金及第六點約定之相關費用，並會同承租人共同完成屋況及附屬設備之點交手續，承租人應將租賃住宅返還出租人並遷出戶籍或其他登記。\n承租人未依第一項規定返還租賃住宅時，出租人應即明示不以不定期限繼續契約，並得向承租人請求未返還租賃住宅期間之相當月租金額，及相當月租金額計算之違約金(未足一個月者，以日租金折算)至返還為止。\n\n【民法 第179條】\n無法律上之原因而受利益，致他人受損害者，應返還其利益。雖有法律上之原因，而其後已不存在者，亦同。\n\n【民法 第767條】\n所有人對於無權占有或侵奪其所有物者，得請求返還之。對於妨害其所有權者，得請求除去之。有妨害其所有權之虞者，得請求防止之。", "opts": ["相當月租的違約金，可以", "相當月租的不當得利，可以", "訴請返還房屋，可以", ""]}, "5-4-24": {"law": "【租賃住宅市場發展及管理條例 第4條】\n租賃住宅有下列情形之一者，不適用本條例規定：\n一、供休閒或旅遊為目的。", "note": "民宿是旅遊休閒，不適用。", "full": "【租賃住宅市場發展及管理條例 第4條】\n租賃住宅有下列情形之一者，不適用本條例規定：\n一、供休閒或旅遊為目的。\n四、租賃期間未達三十日。", "opts": ["", "社會住宅，適用", "租給學生，適用", "租給未成年人，適用"]}, "5-4-25": {"law": "【租賃住宅市場發展及管理條例 第3條】\n本條例用詞，定義如下：\n一、租賃住宅：指以出租供居住使用之建築物。", "note": "租給未成年人居住是居住用途，適用。民宿、Airbnb、飯店是旅遊休閒。", "opts": ["民宿是旅遊休閒", "Airbnb是旅遊休閒", "飯店是旅遊休閒", ""]}, "5-4-26": {"law": "【租賃住宅市場發展及管理條例 第3條】\n本條例用詞，定義如下：\n一、租賃住宅：指以出租供居住使用之建築物。", "note": "大學宿舍是居住用途，適用。工廠、香客中心、飯店不是。", "opts": ["工廠不是居住", "香客中心不是居住", "飯店不是居住", ""]}, "5-4-27": {"law": "【消費者保護法 第16條】\n定型化契約中之定型化契約條款，全部或一部無效或不構成契約內容之一部者，除去該部分，契約亦可成立者，該契約之其他部分，仍為有效。但對當事人之一方顯失公平者，該契約全部無效。\n\n【消費者保護法 第17條】\n違反第一項公告之定型化契約，其定型化契約條款無效。該定型化契約之效力，依前條規定定之。", "note": "違反不得記載事項，是「那一條」無效，不是整份租約無效。", "full": "【消費者保護法 第17條】\n違反第一項公告之定型化契約，其定型化契約條款無效。該定型化契約之效力，依前條規定定之。\n中央主管機關公告應記載之事項，雖未記載於定型化契約，仍構成契約之內容。\n\n【消費者保護法 第16條】\n定型化契約中之定型化契約條款，全部或一部無效或不構成契約內容之一部者，除去該部分，契約亦可成立者，該契約之其他部分，仍為有效。但對當事人之一方顯失公平者，該契約全部無效。", "opts": ["違反的條款無效，對", "應記載事項沒寫也算契約內容，對", "", "去掉該條契約還能成立，其他部分有效，對"]}, "5-4-28": {"law": "【住宅租賃定型化契約應記載事項 第16點】\n本契約如未經公證，其期限逾五年者，不適用前二項之規定。\n\n【民法 第425條】\n前項規定，於未經公證之不動產租賃契約，其期限逾五年或未定期限者，不適用之。", "note": "租約沒公證又超過5年，房客不能對新房東主張租約。", "full": "【住宅租賃定型化契約應記載事項 第16點】\n租賃住宅所有權之讓與出租人於租賃住宅交付後，承租人占有中，縱將其所有權讓與第三人，本契約對於受讓人仍繼續存在。\n本契約如未經公證，其期限逾五年者，不適用前二項之規定。\n\n【民法 第425條】\n出租人於租賃物交付後，承租人占有中，縱將其所有權讓與第三人，其租賃契約，對於受讓人仍繼續存在。\n前項規定，於未經公證之不動產租賃契約，其期限逾五年或未定期限者，不適用之。", "opts": ["未滿5年，租約仍有效", "有公證，租約仍有效", "", "有公證，租約仍有效"]}, "5-4-29": {"law": "【住宅租賃定型化契約不得記載事項 第10點】（112年6月14日增訂）\n不得記載承租人不得申請租金補貼。\n\n【住宅租賃定型化契約應記載事項 第17點】\n出租人提前終止租約：重新建築而必要收回、遲付租金達二個月、積欠管理費等達二個月、擅自變更用途……", "note": "房客申請租金補貼不是終止事由，還是不得約定禁止的事項。", "full": "【住宅租賃定型化契約應記載事項 第17點】\n出租人提前終止租約租賃期間有下列情形之一者，出租人得提前終止租約，且承租人不得要求任何賠償：\n(一)出租人為重新建築而必要收回。\n(三)承租人積欠管理費或其他應負擔之費用達二個月之租金額，經出租人定相當期限催告，仍不為支付。\n(四)承租人違反第八點第一項規定，擅自變更用途，經出租人阻止仍繼續為之。", "opts": ["", "重建而必要收回，可終止", "欠管理費達2個月，可終止", "擅自變更用途，可終止"]}, "5-4-30": {"law": "【住宅租賃定型化契約應記載事項 第17點】\n出租人提前終止租約租賃期間有下列情形之一者，出租人得提前終止…\n(一)出租人為重新建築而必要收回。", "note": "房東「為重建而必要收回」要提前3個月通知，其他事由是30天。", "full": "【住宅租賃定型化契約應記載事項 第17點】\n出租人提前終止租約租賃期間有下列情形之一者，出租人得提前終止租約，且承租人不得要求任何賠償：\n(一)出租人為重新建築而必要收回。\n出租人依前項規定提前終止租約者，應依下列規定期限，檢附相關事證，以書面通知承租人。但依前項第五款及第十款規定終止者，得不先期通知：\n(一)依前項第一款規定終止者，於終止前三個月。\n(二)依前項第二款至第四款、第六款至第九款規定終止者，於終止前三十日。", "opts": ["擅自轉租是30日前", "", "積欠費用是30日前", "擅自變更用途是30日前"]}, "5-4-31": {"law": "【租賃住宅市場發展及管理條例施行細則 第3條】\n承租人依本條例第十一條第一項第一款規定提前終止租賃契約者，其應檢附之相關事證，為設立有案醫療機構出具療養時程需六個月以上之診斷證明。\n\n【租賃住宅市場發展及管理條例 第11條】\n一、因疾病、意外產生有長期療養之需要。", "note": "房客因疾病、意外要長期療養，要附醫師診斷證明（需療養6個月以上）。", "opts": ["請假證明不夠", "", "車禍照片不是", "切結書不是"]}, "5-4-32": {"law": "【住宅租賃定型化契約應記載事項 第20點】\n第一項之通知得經租賃雙方約定以□電子郵件信箱： □手機簡訊□即時通訊軟體以文字顯示方式為之。", "note": "通知方式：郵寄、電子郵件、手機簡訊、通訊軟體文字。口頭不行。", "full": "【住宅租賃定型化契約應記載事項 第20點】\n履行本契約之通知除本契約另有約定外，租賃雙方相互間之通知，以郵寄為之者，應以本契約所記載之地址為準。\n第一項之通知得經租賃雙方約定以□電子郵件信箱： □手機簡訊□即時通訊軟體以文字顯示方式為之。", "opts": ["郵寄可以", "", "電子郵件可以", "通訊軟體文字可以"]}, "5-4-33": {"law": "【租賃標的現況確認書（住宅包租、轉租、租賃契約附件）第8項】\n本租賃住宅（專有部分）是否曾發生兇殺、自殺、一氧化碳中毒或其他非自然死亡之情事：\n（1）於產權持有期間□有□無曾發生上列情事。\n（2）於產權持有前，出租人：□確認無上列情事。□知道曾發生上列情事。□不知道曾發生上列情事。", "note": "要告知兇殺、自殺、一氧化碳中毒等非自然死亡。病死是自然死亡，不用告知。", "opts": ["上吊自殺要告知", "燒炭自殺要告知", "跳樓自殺屬自殺類，依題意仍須告知", ""]}, "5-4-34": {"law": "【租賃標的現況確認書（住宅包租、轉租、租賃契約附件）第8項】\n本租賃住宅（專有部分）是否曾發生兇殺、自殺、一氧化碳中毒或其他非自然死亡之情事：\n（1）於產權持有期間□有□無曾發生上列情事。\n（2）於產權持有前，出租人：□確認無上列情事。□知道曾發生上列情事。□不知道曾發生上列情事。", "note": "一氧化碳中毒死亡在房內，要告知。觸電、病死、對面兇殺都不用。", "flag": "「其他非自然死亡」字面上可能包含觸電意外，但題庫只把一氧化碳中毒（條文明列）當答案。考試選 A。", "opts": ["", "題庫認為觸電意外不是這裡要選的答案；考試選 A（一氧化碳中毒是條文明列）", "兇殺發生在對面，不在本租賃住宅（專有部分）內", "病死是自然死亡，不用告知"]}, "5-4-35": {"law": "【民法 第92條】\n因被詐欺或被脅迫而為意思表示者，表意人得撤銷其意思表示。但詐欺係由第三人所為者，以相對人明知其事實或可得而知者為限，始得撤銷之。", "note": "房東故意隱瞞，房客可主張詐欺、撤銷租約。祭改費、被資遣損失因果關係太遠。", "full": "【民法 第92條】\n因被詐欺或被脅迫而為意思表示者，表意人得撤銷其意思表示。但詐欺係由第三人所為者，以相對人明知其事實或可得而知者為限，始得撤銷之。\n\n【租賃標的現況確認書（住宅包租、轉租、租賃契約附件）第8項】\n本租賃住宅（專有部分）是否曾發生兇殺、自殺、一氧化碳中毒或其他非自然死亡之情事：\n（1）於產權持有期間□有□無曾發生上列情事。\n（2）於產權持有前，出租人：□確認無上列情事。□知道曾發生上列情事。□不知道曾發生上列情事。", "opts": ["", "不能主張租金全免", "祭改法事費用不在範圍", "被資遣的工資損失關聯太遠"]}, "6-1-01": {"law": "【消費者保護法 第42條】\n直轄市、縣（市）政府應設消費者服務中心，辦理消費者之諮詢服務、教育宣導、申訴等事項。\n\n【消費者保護法 第43條】\n消費者與企業經營者因商品或服務發生消費爭議時，消費者得向企業經營者、消費者保護團體或消費者服務中心或其分中心申訴。", "note": "企業經營者出租房子的糾紛，除了公所調解，還能找縣市政府「消費者服務中心」申訴。", "opts": ["公平會不管租屋糾紛", "", "勞資調解是處理勞資糾紛", "警察局不處理民事消費糾紛"]}, "6-1-02": {"law": "【租賃住宅市場發展及管理條例 第12條】\n前項點交後尚有遺留物，除租賃當事人另有約定外，經出租人定相當期限催告仍不取回時，視為拋棄其所有權，其所需處理費用，得由押金扣除，不足者，出租人得請求承租人給付。", "note": "點交後房客留東西：房東先定期限催告，他還不拿，就視為拋棄所有權，處理費從押金扣。不能直接當垃圾丟。", "opts": ["不能直接當自己的", "一定要先催告", "", "一樣要先催告，不能直接當廢棄物"]}, "6-1-03": {"law": "【租賃住宅市場發展及管理條例 第2條】\n本條例所稱主管機關：在中央為內政部；在直轄市為直轄市政府；在縣（市）為縣（市）政府。", "note": "租賃條例的中央主管機關是內政部。", "opts": ["不是經濟部", "", "不是教育部", "不是衛福部"]}, "6-1-04": {"law": "【強制執行法 第4條】\n強制執行，依左列執行名義為之：\n四、依公證法規定得為強制執行之公證書。\n\n【公證法 第13條】\n當事人請求公證人就下列各款法律行為作成之公證書，載明應逕受強…\n三、租用或借用建築物或其他工作物，定有期限並應於期限屆滿時交還者。", "note": "想「直接強制執行」，租約要去法院或民間公證人公證，並載明逕受強制執行。律師見證、地政士認證都沒用。", "full": "【公證法 第13條】\n當事人請求公證人就下列各款法律行為作成之公證書，載明應逕受強制執行者，得依該證書執行之：\n三、租用或借用建築物或其他工作物，定有期限並應於期限屆滿時交還者。\n\n【強制執行法 第4條】\n強制執行，依左列執行名義為之：\n四、依公證法規定得為強制執行之公證書。", "opts": ["律師見證沒有強制執行力", "地政士認證沒有強制執行力", "", "律師認證沒有強制執行力"]}, "6-1-05": {"law": "【租賃住宅市場發展及管理條例 第16條】\n住宅租賃爭議，出租人或承租人得向直轄市或縣（市）政府申請調處，並免繳調處費用。", "note": "租屋糾紛找縣市政府調處不用錢。但調處不等於法院確定判決。", "opts": ["調處不等於確定判決", "", "申請調處不用手續費", "申請調處不用作業費"]}, "6-1-06": {"law": "【租賃住宅市場發展及管理條例 第31條】\n租賃住宅服務業因其受僱人執行業務之故意或過失致租賃住宅服務當事人受損害者，該租賃住宅服務業應與其受僱人負連帶賠償責任。\n\n【租賃住宅市場發展及管理條例 第22條】\n第十九條第二項及第三項營業保證金，由中華民國租賃住宅服務商業同業公會全國聯合會（以下簡稱全國聯合會）於金融機構設置營業保證基金專戶儲存，並組成管理委員會負責保管；基金之孳息部分，僅得運用於健全租賃住宅服務業經營管理制度。", "note": "營業保證金是拿來賠被害人的：業者不能履行契約，或員工故意過失害到人，就從這裡賠。不是會費，也不是代付租金。", "full": "【租賃住宅市場發展及管理條例 第31條】\n因可歸責於租賃住宅服務業之事由不能履行契約，致租賃住宅服務當事人受損害時，由該租賃住宅服務業負賠償責任。\n租賃住宅服務業因其受僱人執行業務之故意或過失致租賃住宅服務當事人受損害者，該租賃住宅服務業應與其受僱人負連帶賠償責任。\n前二項被害人向全國聯合會請求代為賠償時，其所設基金管理委員會應即進行調處。\n被害人取得對租賃住宅服務業或其受僱人之執行名義或經基金管理委員會調處決議支付者，得於該租賃住宅服務業繳存營業保證金及提供擔保總額內，向全國聯合會請求代為賠償；經代為賠償後，即應依第二十二條第五項規定，通知租賃住宅服務業限期補繳。\n\n【租賃住宅市場發展及管理條例 第22條】\n第十九條第二項及第三項營業保證金，由中華民國租賃住宅服務商業同業公會全國聯合會（以下簡稱全國聯合會）於金融機構設置營業保證基金專戶儲存，並組成管理委員會負責保管；基金之孳息部分，僅得運用於健全租賃住宅服務業經營管理制度。", "opts": ["不是會費", "不是代付房客欠租", "", "不是代付租賃費用"]}, "6-1-07": {"law": "【租賃住宅市場發展及管理條例 第6條】\n租賃住宅之租金，由出租人與承租人約定，不適用土地法第九十七條規定。", "note": "租賃住宅租金雙方自己談，不受土地法年息10%限制。", "opts": ["不受年息10%限制", "不受年息5%限制", "不受年息15%限制", ""]}, "6-1-08": {"law": "【租賃住宅市場發展及管理條例 第28條】\n代管業應與委託人簽訂委託管理租賃住宅契約書後，始得執行租賃住宅管理業務。\n\n【租賃住宅市場發展及管理條例 第3條】\n本條例用詞，定義如下：\n四、租賃住宅代管業（以下簡稱代管業）：指受出租人之委託，經營租賃住宅管理業務（以下簡稱代管業務）之公司。", "note": "代管業＝受房東委託、先簽委託管理契約，再幫忙管理租賃住宅的公司。", "full": "【租賃住宅市場發展及管理條例 第3條】\n本條例用詞，定義如下：\n四、租賃住宅代管業（以下簡稱代管業）：指受出租人之委託，經營租賃住宅管理業務（以下簡稱代管業務）之公司。\n\n【租賃住宅市場發展及管理條例 第28條】\n代管業應與委託人簽訂委託管理租賃住宅契約書後，始得執行租賃住宅管理業務。", "opts": ["", "代管是管理，不是幫忙出租", "是受房東委託，不是房客", "不是政府核定的租賃業務"]}, "6-1-09": {"law": "【租賃住宅市場發展及管理條例 第31條】\n被害人取得對租賃住宅服務業或其受僱人之執行名義或經基金管理委員會調處決議支付者，得於該租賃住宅服務業繳存營業保證金及提供擔保總額內，向全國聯合會請求代為賠償；…", "note": "被害人向全聯會申請調處、責任確定後，從業者繳的「營業保證金」代償。", "full": "【租賃住宅市場發展及管理條例 第31條】\n前二項被害人向全國聯合會請求代為賠償時，其所設基金管理委員會應即進行調處。\n被害人取得對租賃住宅服務業或其受僱人之執行名義或經基金管理委員會調處決議支付者，得於該租賃住宅服務業繳存營業保證金及提供擔保總額內，向全國聯合會請求代為賠償；經代為賠償後，即應依第二十二條第五項規定，通知租賃住宅服務業限期補繳。", "opts": ["全聯會不幫忙打官司", "", "不是業者直接賠，是從保證金出", "不是再次協商"]}, "6-1-10": {"law": "【租賃住宅市場發展及管理條例 第16條】\n住宅租賃爭議，出租人或承租人得向直轄市或縣（市）政府申請調處，並免繳調處費用。", "note": "調處不是判決，不服就去法院（司法機關）告。", "full": "【租賃住宅市場發展及管理條例 第16條】\n住宅租賃爭議，出租人或承租人得向直轄市或縣（市）政府申請調處，並免繳調處費用。\n\n（調處不是終局的，不服仍可循司法途徑，法源為民事訴訟法的起訴權，非租賃條例明文）", "opts": ["立法機關不處理個案", "監察機關不處理民事糾紛", "地政機關不是司法機關", ""]}, "6-1-11": {"law": "【租賃住宅市場發展及管理條例 第16條】\n住宅租賃爭議，出租人或承租人得向直轄市或縣（市）政府申請調處，並免繳調處費用。", "note": "題庫答案是「不動產糾紛調處委員會」。注意是調處，不是調解或仲裁。", "flag": "條例第 16 條只寫「向直轄市或縣（市）政府申請調處」，沒有明文委員會名稱。題庫答案是 A「不動產糾紛調處委員會」。", "opts": ["", "不是仲裁委員會", "調解是公所的", "沒有調查委員會"]}, "6-1-12": {"law": "【鄉鎮市調解條例 第1條】\n鄉、鎮、市公所應設調解委員會，辦理下列調解事件：\n一、民事事件。", "note": "房東房客的民事履約爭議，可以去鄉鎮市區公所的「調解委員會」聲請調解。", "opts": ["", "報警不是處理民事爭議的方式", "不能直接強制執行，要有執行名義", "耕地租佃委員會管耕地，不管房屋"]}, "6-1-13": {"law": "【租賃住宅市場發展及管理條例 第30條】\n前項出租人提前終止租賃契約之情形，於包租業因故停業、解散或他遷不明時，得由出租人通知次承租人。出租人或次承租人得請求所在地同業公會或其全國聯合會協調返還租賃住宅或續租事宜，該同業公會或其全國聯合會不得拒絕。\n\n【租賃住宅市場發展及管理條例 第31條】\n前二項被害人向全國聯合會請求代為賠償時，其所設基金管理委員會應即進行調處。", "note": "跟代管業、包租業吵架，除了縣市政府，也可以向「租賃住宅服務業全聯會」申訴。", "opts": ["律師公會不受理", "金融評議是金融糾紛", "勞資調解是勞資糾紛", ""]}, "6-2-01": {"law": "【鄉鎮市調解條例 第27條】\n經法院核定之民事調解，與民事確定判決有同一之效力；經法院核定之刑事調解，以給付金錢或其他代替物或有價證券之一定數量為標的者，其調解書得為執行名義。\n\n【民事訴訟法 第416條】\n調解經當事人合意而成立；調解成立者，與訴訟上和解有同一之效力。", "note": "調解成立，經法院核定，才等同確定判決。沒核定前沒那麼大效力。", "full": "【鄉鎮市調解條例 第27條】\n調解經法院核定後，當事人就該事件不得再行起訴、告訴或自訴。\n經法院核定之民事調解，與民事確定判決有同一之效力；經法院核定之刑事調解，以給付金錢或其他代替物或有價證券之一定數量為標的者，其調解書得為執行名義。\n\n【民事訴訟法 第416條】\n調解經當事人合意而成立；調解成立者，與訴訟上和解有同一之效力。", "opts": ["效力沒有跟裁判一樣", "要經法院核定才等同確定判決", "調處沒有這麼強的效力", ""]}, "6-2-02": {"law": "【民事訴訟法 第416條】\n調解經當事人合意而成立；調解成立者，與訴訟上和解有同一之效力。\n\n【民事訴訟法 第377條】\n法院不問訴訟程度如何，得隨時試行和解。受命法官或受託法官亦得為之。", "note": "調解和和解都要雙方都同意才成立。", "opts": ["兩者都沒有和裁判一樣的效力", "", "非告訴乃論的刑案不能和解或調解", "不是都由法官主導"]}, "6-2-03": {"law": "【鄉鎮市調解條例 第1條】\n鄉、鎮、市公所應設調解委員會，辦理下列調解事件：\n一、民事事件。", "note": "租屋爭議找鄉鎮市區公所調解委員會「調解」。他們不做仲裁。", "opts": ["不能直接強制執行", "調解委員會做調解，不是仲裁", "", "耕地租佃委員會管耕地"]}, "6-2-04": {"law": "【租賃住宅市場發展及管理條例 第16條】\n住宅租賃爭議，出租人或承租人得向直轄市或縣（市）政府申請調處，並免繳調處費用。\n\n【租賃住宅市場發展及管理條例 第31條】\n前二項被害人向全國聯合會請求代為賠償時，其所設基金管理委員會應即進行調處。", "note": "房東跟代管業吵架：房東可向縣市政府主管機關或全聯會申請調處。勞工局是管勞資的。", "opts": ["這是房東的問題，不是業者向消保中心申訴", "", "勞工局管勞資", "勞工局管勞資"]}, "6-2-05": {"law": "【鄉鎮市調解條例 第1條】\n鄉、鎮、市公所應設調解委員會，辦理下列調解事件：", "note": "調解委員會設在鄉、鎮、市（區）公所，不是議會或里長辦公室。", "opts": ["", "議會不設調解委員會", "代表會不設", "里長辦公室不設"]}, "6-2-06": {"law": "【鄉鎮市調解條例 第27條】\n調解經法院核定後，當事人就該事件不得再行起訴、告訴或自訴。\n\n【鄉鎮市調解條例 第13條】\n聲請調解事件之管轄如下：\n一、兩造均在同一鄉、鎮、市居住者，由該鄉、鎮、市調解委員會調解。", "note": "前一個案子調解過，不代表新案子不能調。這是新的撞傷事件，可以受理，向對方戶籍地或事件發生地的公所聲請。", "full": "【鄉鎮市調解條例 第13條】\n聲請調解事件之管轄如下：\n一、兩造均在同一鄉、鎮、市居住者，由該鄉、鎮、市調解委員會調解。\n二、兩造不在同一鄉、鎮、市居住者，民事事件由他造住、居所、營業所、事務所所在地，刑事事件由他造住、居所所在地或犯罪地之鄉、鎮、市調解委員會調解。\n三、經兩造同意，並經接受聲請之鄉、鎮、市調解委員會同意者，得由該鄉、鎮、市調解委員會調解，不受前二款之限制。\n\n【鄉鎮市調解條例 第27條】\n調解經法院核定後，當事人就該事件不得再行起訴、告訴或自訴。", "opts": ["", "要向對方戶籍地或事件發生地的公所", "新案件可以受理", "不用隔半年"]}, "6-2-07": {"law": "【鄉鎮市調解條例 第3條】\n調解委員會委員（以下簡稱調解委員），由鄉、鎮、市長遴選鄉、鎮、市內具有法律或其他專業知識及信望素孚之公正人士，提出加倍人數後，並將其姓名、學歷及經歷等資料，分別函請管轄地方法院或其分院及地方檢察署或其檢察分署共同審查，遴選符合資格之規定名額，報縣政府備查後聘任之，任期四年。…", "note": "調解委員是地方公正人士，不是法官，不能判決。", "full": "【鄉鎮市調解條例 第3條】\n調解委員會委員（以下簡稱調解委員），由鄉、鎮、市長遴選鄉、鎮、市內具有法律或其他專業知識及信望素孚之公正人士，提出加倍人數後，並將其姓名、學歷及經歷等資料，分別函請管轄地方法院或其分院及地方檢察署或其檢察分署共同審查，遴選符合資格之規定名額，報縣政府備查後聘任之，任期四年。連任續聘時亦同。", "opts": ["不是檢察官", "調解委員不能判決", "不是法官", ""]}, "6-2-08": {"law": "【鄉鎮市調解條例 第20條】\n當事人無正當理由，於調解期日不到場者，視為調解不成立。但調解委員會認為有成立調解之望者，得另定調解期日。\n\n【租賃住宅市場發展及管理條例 第16條】\n住宅租賃爭議，出租人或承租人得向直轄市或縣（市）政府申請調處，並免繳調處費用。", "note": "一方沒到：調解視為不成立；調處則可以依專業或法令做成決議。", "opts": ["調解不行，一方不來會視為不成立", "", "調解一方不來視為不成立", "和解要雙方同意"]}, "6-2-09": {"law": "【消費者保護法 第44條】\n消費者依前條申訴未能獲得妥適處理時，得向直轄市或縣（市）消費爭議調解委員會申請調解。\n\n【鄉鎮市調解條例 第1條】\n鄉、鎮、市公所應設調解委員會，辦理下列調解事件：", "note": "能調解的：法院、鄉鎮市區公所調解委員會、消費爭議調解委員會。商業仲裁是仲裁，不是調解。", "full": "【鄉鎮市調解條例 第1條】\n鄉、鎮、市公所應設調解委員會，辦理下列調解事件：\n\n【消費者保護法 第44條】\n消費者依前條申訴未能獲得妥適處理時，得向直轄市或縣（市）消費爭議調解委員會申請調解。\n\n（法院也可進行調解：民事訴訟法第 403 條以下）", "opts": ["商業仲裁不是調解", "商業仲裁不是調解", "", "漏了法院和公所"]}, "6-2-10": {"law": "【租賃住宅市場發展及管理條例 第16條】\n住宅租賃爭議，出租人或承租人得向直轄市或縣（市）政府申請調處，並免繳調處費用。\n\n【租賃住宅市場發展及管理條例 第31條】\n前二項被害人向全國聯合會請求代為賠償時，其所設基金管理委員會應即進行調處。", "note": "包租業和次承租人吵架，次承租人可向縣市政府主管機關或全聯會申請調處。", "opts": ["勞工局管勞資", "包租業不是向消保中心申訴", "", "勞工局管勞資"]}, "6-2-11": {"law": "【鄉鎮市調解條例 第27條】\n經法院核定之民事調解，與民事確定判決有同一之效力；經法院核定之刑事調解，以給付金錢或其他代替物或有價證券之一定數量為標的者，其調解書得為執行名義。\n\n【強制執行法 第4條】\n強制執行，依左列執行名義為之：\n三、依民事訴訟法成立之和解或調解。", "note": "調解成立並經法院核定，等於確定判決，可以直接聲請強制執行，不用重新打官司。", "full": "【鄉鎮市調解條例 第27條】\n調解經法院核定後，當事人就該事件不得再行起訴、告訴或自訴。\n經法院核定之民事調解，與民事確定判決有同一之效力；經法院核定之刑事調解，以給付金錢或其他代替物或有價證券之一定數量為標的者，其調解書得為執行名義。\n\n【強制執行法 第4條】\n強制執行，依左列執行名義為之：\n三、依民事訴訟法成立之和解或調解。", "opts": ["不用重新訴訟", "不是直接去房東家強制執行，要向法院聲請", "不用重新訴訟", ""]}, "6-2-12": {"law": "【鄉鎮市調解條例 第27條】\n調解經法院核定後，當事人就該事件不得再行起訴、告訴或自訴。", "note": "調解經法院核定後，同一件事不能再告、也不能再調。", "opts": ["同一事件不能再調", "換地方也不行", "隔多久都不行", ""]}, "6-2-13": {"law": "【鄉鎮市調解條例 第30條】\n調解不成立者，當事人得聲請調解委員會給與調解不成立之證明書。\n\n【鄉鎮市調解條例 第20條】\n當事人無正當理由，於調解期日不到場者，視為調解不成立。但調解委員會認為有成立調解之望者，得另定調解期日。", "note": "房客沒到場，調解視為不成立，房東拿「調解不成立證明」，要另外去法院告。", "full": "【鄉鎮市調解條例 第20條】\n當事人無正當理由，於調解期日不到場者，視為調解不成立。但調解委員會認為有成立調解之望者，得另定調解期日。\n\n【鄉鎮市調解條例 第30條】\n調解不成立者，當事人得聲請調解委員會給與調解不成立之證明書。\n前項證明書，應於聲請後七日內發給之。", "opts": ["", "不成立證明不能直接強制執行", "不成立沒有法院核定函", "沒有調解成立"]}, "6-2-14": {"law": "【消費者保護法 第45-3條】\n當事人對於前條所定之方案，得於送達後十日之不變期間內，提出異議。", "note": "不服消保官的調解方案，10天內提出異議。", "opts": ["", "不是7天", "不是15天", "不是30天"]}, "6-2-15": {"law": "【消費者保護法 第44-1條】\n前條消費爭議調解事件之受理、程序進行及其他相關事項之辦法，由行政院定之。", "note": "消費爭議調解的受理、程序，由行政院訂辦法。", "opts": ["不是調解委員會訂", "不是消保團體", "不是公平會", ""]}, "6-2-16": {"law": "【民事訴訟法 第416條】\n調解不成立者，法院應付與當事人證明書。", "note": "調解破局，下一步就是向法院提起訴訟。", "opts": ["報警不能解決民事糾紛", "監察機關不處理", "立法機關不處理", ""]}, "6-2-17": {"law": "【消費者保護法 第11條】\n定型化契約條款如有疑義時，應為有利於消費者之解釋。", "note": "定型化契約有疑義，要作「有利消費者」的解釋。", "opts": ["不是有利企業經營者", "", "不用雙方協議", "不是提起調解"]}, "6-2-18": {"law": "【鄉鎮市調解條例 第27條】\n經法院核定之民事調解，與民事確定判決有同一之效力；經法院核定之刑事調解，以給付金錢或其他代替物或有價證券之一定數量為標的者，其調解書得為執行名義。\n\n【鄉鎮市調解條例 第26條】\n鄉、鎮、市公所應於調解成立之日起十日內，將調解書及卷證送請移付或管轄之法院審核。", "note": "鄉鎮市調解成立，10日內送法院核定，核定後的民事調解有確定判決的效力，可以強制執行。", "full": "【鄉鎮市調解條例 第26條】\n鄉、鎮、市公所應於調解成立之日起十日內，將調解書及卷證送請移付或管轄之法院審核。\n\n【鄉鎮市調解條例 第27條】\n調解經法院核定後，當事人就該事件不得再行起訴、告訴或自訴。\n經法院核定之民事調解，與民事確定判決有同一之效力；經法院核定之刑事調解，以給付金錢或其他代替物或有價證券之一定數量為標的者，其調解書得為執行名義。", "opts": ["同一事件不能再起訴", "", "刑事調解有給付也可聲請執行", "同一事件不能再告訴或自訴"]}, "6-2-19": {"law": "【消費者保護法 第17條】\n違反第一項公告之定型化契約，其定型化契約條款無效。該定型化契約之效力，依前條規定定之。\n\n【消費者保護法 第11-1條】\n企業經營者與消費者訂立定型化契約前，應有三十日以內之合理期間，供消費者審閱全部條款內容。", "note": "簽定型化契約要有審閱期，租賃至少3天。公告的不得記載事項，違反的是「那一條」無效，不是整份。", "full": "【消費者保護法 第11-1條】\n企業經營者與消費者訂立定型化契約前，應有三十日以內之合理期間，供消費者審閱全部條款內容。\n\n【消費者保護法 第17條】\n違反第一項公告之定型化契約，其定型化契約條款無效。該定型化契約之效力，依前條規定定之。\n中央主管機關公告應記載之事項，雖未記載於定型化契約，仍構成契約之內容。", "opts": ["", "公告範本不是法律強制拘束", "不得免除或限制賠償責任", "是該條款無效，不是全部無效"]}, "6-2-20": {"law": "【民事訴訟法 第416條】\n調解經當事人合意而成立；調解成立者，與訴訟上和解有同一之效力。", "note": "民事訴訟法的調解成立，與訴訟上和解有同一效力，題庫答案是「等同確定判決」。", "opts": ["不是一般和解的效力", "沒達成協議不成立", "可以聲請強制執行", ""]}, "6-2-21": {"law": "【強制執行法 第4條】\n強制執行，依左列執行名義為之：\n六、其他依法律之規定，得為強制執行名義者。", "note": "有強制執行力：確定判決、法庭上和解、法院核定的調解、公證書。私下和解沒有。", "full": "【強制執行法 第4條】\n強制執行，依左列執行名義為之：\n一、確定之終局判決。\n二、假扣押、假處分、假執行之裁判及其他依民事訴訟法得為強制執行之裁判。\n三、依民事訴訟法成立之和解或調解。\n四、依公證法規定得為強制執行之公證書。\n五、抵押權人或質權人，為拍賣抵押物或質物之聲請，經法院為許可強制執行之裁定者。\n六、其他依法律之規定，得為強制執行名義者。", "opts": ["訴訟外和解沒有", "訴訟外和解沒有", "", "訴訟外和解沒有"]}, "6-3-01": {"law": "（這題屬實務教材或常識判斷，沒有對應的法條原文）", "note": "文件要分類、裝訂成冊，才好找。", "opts": ["", "不分類找不到", "不分類容易亂", "集中保管也要分類"]}, "6-3-02": {"law": "（這題屬實務教材或常識判斷，沒有對應的法條原文）", "note": "車輛進出地下室，要造冊登錄列管。", "opts": ["自由停放無法管制", "只顧不影響進出，沒管制", "", "視狀況太隨便"]}, "6-3-03": {"law": "（這題屬實務教材或常識判斷，沒有對應的法條原文）", "note": "住戶意見要填意見反應單、彙整後呈報處理。", "opts": ["", "沒填單也要處理", "不能只當說說", "附帶提起沒紀錄"]}, "6-3-04": {"law": "【建築物昇降設備設置及檢查管理辦法 第5條】\n昇降設備安全檢查頻率，規定如下：\n四、前三款以外之昇降設備每年一次。但建築物經竣工檢查合格達十五年者，每半年一次。", "note": "答 A 每半年1次。電梯檢查：一般每年1次，建築物竣工滿15年→每半年1次。口訣：15年→半年。", "f  "note": "假處分的規定，準用於「定暫時狀態的處分」。借款要保全用假扣押，不是假處分。", "full": "【民事訴訟法 第522條】\n債權人就金錢請求或得易為金錢請求之請求，欲保全強制執行者，得聲請假扣押。\n\n【民事訴訟法 第532條】\n債權人就金錢請求以外之請求，欲保全強制執行者，得聲請假處分。\n\n【民事訴訟法 第538條】\n於爭執之法律關係，為防止發生重大之損害或避免急迫之危險或有其他相類之情形而有必要時，得聲請為定暫時狀態之處分。", "opts": ["假處分屬保全程序", "金錢請求用假扣押", "", "本案還沒起訴也可聲請假扣押"]}, "6-6-03": {"law": "【民法 第434條】\n租賃物因承租人之重大過失，致失火而毀損、滅失者，承租人對於出租人負損害賠償責任。", "note": "租屋失火，房客只在「重大過失」時才賠。", "opts": ["不是無過失責任", "輕過失不賠", "通常事變不賠", ""]}, "6-6-04": {"law": "【民法 第422條】\n不動產之租賃契約，其期限逾一年者，應以字據訂立之，未以字據訂立者，視為不定期限之租賃。", "note": "不動產租賃超過1年卻沒寫字據，視為「不定期租賃」。", "opts": ["不是不成立", "不是無效", "", "不是1年期限"]}, "6-6-05": {"law": "【民事訴訟法 第516條】\n債務人對於支付命令之全部或一部，得於送達後二十日之不變期間內，不附理由向發命令之法院提出異議。", "note": "支付命令送達後，20天內要異議。", "opts": ["不是10日", "", "不是30日", "不是5日"]}, "6-6-06": {"law": "【民法 第3條】\n如有用印章代簽名者，其蓋章與簽名生同等之效力。\n\n【民法 第422條】\n不動產之租賃契約，其期限逾一年者，應以字據訂立之，未以字據訂立者，視為不定期限之租賃。", "note": "書面契約簽名可以用蓋章代替。", "full": "【民法 第422條】\n不動產之租賃契約，其期限逾一年者，應以字據訂立之，未以字據訂立者，視為不定期限之租賃。\n\n【民法 第3條】\n依法律之規定，有使用文字之必要者，得不由本人自寫，但必須親自簽名。\n如有用印章代簽名者，其蓋章與簽名生同等之效力。", "opts": ["不用公證", "不用親筆", "", "不用按指印"]}, "6-6-07": {"law": "【民法 第440條】\n承租人租金支付有遲延者，出租人得定相當期限，催告承租人支付租金，如承租人於其期限內不為支付，出租人得終止契約。", "note": "租基地蓋房子：欠租達2年的租額，還要催告不付，才能終止。口訣：基地2年、房屋2個月。", "full": "【民法 第440條】\n租用建築房屋之基地，遲付租金之總額，達二年之租額時，適用前項之規定。\n租賃物為房屋者，遲付租金之總額，非達二個月之租額，不得依前項之規定，終止契約。其租金約定於每期開始時支付者，並應於遲延給付逾二個月時，始得終止契約。\n承租人租金支付有遲延者，出租人得定相當期限，催告承租人支付租金，如承租人於其期限內不為支付，出租人得終止契約。", "opts": ["基地是2年，不是2期", "基地是2年", "還要催告", ""]}, "6-6-08": {"law": "【民法 第126條】\n利息、紅利、租金、贍養費、退職金及其他一年或不及一年之定期給付債權，其各期給付請求權，因五年間不行使而消滅。", "note": "租金請求權時效5年。", "opts": ["不是2年", "", "不是10年", "不是15年"]}, "6-6-09": {"law": "【民事訴訟法 第508條】\n債權人之請求，以給付金錢或其他代替物或有價證券之一定數量為標的者，得聲請法院依督促程序發支付命令。", "note": "支付命令只能請求「給付金錢」。要房客搬走、交契約、修房子都不行，請求賠償30萬可以。", "opts": ["請求返還房屋不能用", "", "交付契約不能用", "修繕房屋不能用"]}, "6-6-10": {"law": "【民法 第187條】\n前項情形，法定代理人如其監督並未疏懈，或縱加以相當之監督，而仍不免發生損害者，不負賠償責任。\n\n【民法 第184條】\n因故意或過失，不法侵害他人之權利者，負損害賠償責任。故意以背於善良風俗之方法，加損害於他人者亦同。", "note": "「證明監督沒鬆懈」是被告（法定代理人）用來免責的，房東不用證明這個。", "full": "【民法 第184條】\n因故意或過失，不法侵害他人之權利者，負損害賠償責任。故意以背於善良風俗之方法，加損害於他人者亦同。\n\n【民法 第187條】\n無行為能力人或限制行為能力人，不法侵害他人之權利者，以行為時有識別能力為限，與其法定代理人連帶負損害賠償責任。行為時無識別能力者，由其法定代理人負損害賠償責任。\n前項情形，法定代理人如其監督並未疏懈，或縱加以相當之監督，而仍不免發生損害者，不負賠償責任。", "opts": ["這是房東要證明的", "這是房東要證明的", "這是房東要證明的", ""]}, "6-7-01": {"law": "【民事訴訟法 第522條】\n債權人就金錢請求或得易為金錢請求之請求，欲保全強制執行者，得聲請假扣押。", "note": "金錢請求要保全，聲請「假扣押」。", "opts": ["假執行是判決後", "", "假處分是金錢以外", "支付命令不是保全"]}, "6-7-02": {"law": "【民事訴訟法 第532條】\n債權人就金錢請求以外之請求，欲保全強制執行者，得聲請假處分。", "note": "金錢以外的請求要保全，聲請「假處分」。", "opts": ["", "假執行是判決後", "假扣押是金錢請求", "訴訟救助是繳費用"]}, "6-7-03": {"law": "【民事訴訟法 第521條】\n債務人對於支付命令未於法定期間合法提出異議者，支付命令得為執行名義。", "note": "支付命令沒異議只能當執行名義，不等於確定判決，房客還可以提確認債權不存在之訴。", "full": "【民事訴訟法 第521條】\n債務人對於支付命令未於法定期間合法提出異議者，支付命令得為執行名義。\n前項情形，為裁定之法院應付與裁定確定證明書。\n債務人主張支付命令上所載債權不存在而提起確認之訴者，法院依債務人聲請，得許其提供相當並確實之擔保，停止強制執行。", "opts": ["不是只有再審", "支付命令未異議可為執行名義", "", "執行中可提確認債權不存在之訴"]}, "6-7-04": {"law": "【民事訴訟法 第538條】\n於爭執之法律關係，為防止發生重大之損害或避免急迫之危險或有其他相類之情形而有必要時，得聲請為定暫時狀態之處分。", "note": "房東想強行換鎖、搬東西，房客要馬上保住居住權：向法院聲請假處分（定暫時狀態）。", "full": "【民事訴訟法 第538條】\n於爭執之法律關係，為防止發生重大之損害或避免急迫之危險或有其他相類之情形而有必要時，得聲請為定暫時狀態之處分。\n前項裁定，以其本案訴訟能確定該爭執之法律關係者為限。\n第一項處分，得命先為一定之給付。", "opts": ["", "假扣押是金錢請求", "調處不是即時保全", "調解不能馬上阻止房東"]}, "6-8-01": {"law": "【民法 第126條】\n利息、紅利、租金、贍養費、退職金及其他一年或不及一年之定期給付債權，其各期給付請求權，因五年間不行使而消滅。\n\n【民法 第179條】\n無法律上之原因而受利益，致他人受損害者，應返還其利益。雖有法律上之原因，而其後已不存在者，亦同。", "note": "不當得利返還「相當於租金」的利益，時效5年。", "full": "【民法 第179條】\n無法律上之原因而受利益，致他人受損害者，應返還其利益。雖有法律上之原因，而其後已不存在者，亦同。\n\n【民法 第126條】\n利息、紅利、租金、贍養費、退職金及其他一年或不及一年之定期給付債權，其各期給付請求權，因五年間不行使而消滅。", "flag": "一般不當得利時效是 15 年；題庫選 5 年是依照「相當於租金之利益」按租金時效。", "opts": ["不是15年", "", "不是2年", "不是1年"]}, "6-8-02": {"law": "【民法 第440條】\n承租人租金支付有遲延者，出租人得定相當期限，催告承租人支付租金，如承租人於其期限內不為支付，出租人得終止契約。", "note": "房客欠租達2個月，還要「定期限催告」，他不付，才可以終止。", "full": "【民法 第440條】\n承租人租金支付有遲延者，出租人得定相當期限，催告承租人支付租金，如承租人於其期限內不為支付，出租人得終止契約。\n租賃物為房屋者，遲付租金之總額，非達二個月之租額，不得依前項之規定，終止契約。其租金約定於每期開始時支付者，並應於遲延給付逾二個月時，始得終止契約。", "opts": ["還要催告", "要定期限催告", "", "沒有執行名義不能強執"]}, "6-8-03": {"law": "【民法 第451條】\n租賃期限屆滿後，承租人仍為租賃物之使用收益，而出租人不即表示反對之意思者，視為以不定期限繼續契約。", "note": "租期到了房客沒搬、房東又照收租金沒反對，變成「不定期租約」。", "opts": ["不是自動失效", "不是3月1日失效", "", "不是自動延長1年"]}, "6-8-04": {"law": "【民事訴訟法 第440條】\n提起上訴，應於第一審判決送達後二十日之不變期間內為之。但宣示或公告後送達前之上訴，亦有效力。", "note": "上訴要在第一審判決送達後20天內。", "opts": ["不是5日", "不是10日", "", "不是30日"]}, "6-8-05": {"law": "【鄉鎮市調解條例 第1條】\n鄉、鎮、市公所應設調解委員會，辦理下列調解事件：\n一、民事事件。", "note": "追租要走合法管道：調解、存證信函、訴訟。鎖門、消磁、監視都是私力救濟。", "full": "【鄉鎮市調解條例 第1條】\n鄉、鎮、市公所應設調解委員會，辦理下列調解事件：\n一、民事事件。\n\n（鎖門、消磁、裝監視鏡頭對準房客，都可能構成妨害自由等刑事責任，屬私力救濟）", "opts": ["鎖門是私力救濟", "消磁是私力救濟", "", "監視可能違法"]}, "6-8-06": {"law": "【鄉鎮市調解條例 第27條】\n經法院核定之民事調解，與民事確定判決有同一之效力；經法院核定之刑事調解，以給付金錢或其他代替物或有價證券之一定數量為標的者，其調解書得為執行名義。\n\n【鄉鎮市調解條例 第29條】\n因當事人聲請而成立之民事調解，經法院核定後有無效或得撤銷之原因者，當事人得向原核定法院提起宣告調解無效或撤銷調解之訴。", "note": "法院核定的民事調解＝確定判決，可聲請強制執行，同一事件不能再告。", "full": "【鄉鎮市調解條例 第27條】\n調解經法院核定後，當事人就該事件不得再行起訴、告訴或自訴。\n經法院核定之民事調解，與民事確定判決有同一之效力；經法院核定之刑事調解，以給付金錢或其他代替物或有價證券之一定數量為標的者，其調解書得為執行名義。\n\n【鄉鎮市調解條例 第29條】\n因當事人聲請而成立之民事調解，經法院核定後有無效或得撤銷之原因者，當事人得向原核定法院提起宣告調解無效或撤銷調解之訴。\n前二項規定，當事人應於法院核定之調解書送達後三十日內為之。", "opts": ["", "同一事件不能再起訴", "可以聲請強制執行", "撤銷要在法定期間"]}, "6-8-07": {"law": "【民法 第456條】\n前項期間，於出租人，自受租賃物返還時起算。於承租人，自租賃關係終止時起算。", "note": "房東對房客的損害賠償請求權，2年（從拿回房子起算）。", "full": "【民法 第456條】\n出租人就租賃物所受損害對於承租人之賠償請求權，承租人之償還費用請求權及工作物取回權，均因二年間不行使而消滅。\n前項期間，於出租人，自受租賃物返還時起算。於承租人，自租賃關係終止時起算。", "opts": ["不是6個月", "不是1年", "", "不是5年"]}, "6-8-08": {"law": "【民事訴訟法 第10條】\n因不動產之物權或其分割或經界涉訟者，專屬不動產所在地之法院管轄。\n\n【民事訴訟法 第27條】\n定法院之管轄，以起訴時為準。", "note": "不動產物權、分割、經界訴訟，專屬「不動產所在地」法院管轄，不能用合意排除。", "full": "【民事訴訟法 第10條】\n因不動產之物權或其分割或經界涉訟者，專屬不動產所在地之法院管轄。\n其他因不動產涉訟者，得由不動產所在地之法院管轄。\n\n【民事訴訟法 第1條】\n訴訟，由被告住所地之法院管轄。被告住所地之法院不能行使職權者，由其居所地之法院管轄。訴之原因事實發生於被告居所地者，亦得由其居所地之法院管轄。\n\n【民事訴訟法 第24條】\n當事人得以合意定第一審管轄法院。但以關於由一定法律關係而生之訴訟為限。\n\n【民事訴訟法 第27條】\n定法院之管轄，以起訴時為準。", "opts": ["原則是被告住所地", "", "專屬管轄不能合意排除", "以起訴時為準"]}, "6-8-09": {"law": "【民法 第13條】\n未滿七歲之未成年人，無行為能力。\n\n【民法 第12條】\n滿十八歲為成年。", "note": "21歲是成年人，被退學不影響租約，租約有效。", "full": "【民法 第12條】\n滿十八歲為成年。\n\n【民法 第13條】\n未滿七歲之未成年人，無行為能力。\n滿七歲以上之未成年人，有限制行為能力。", "opts": ["", "成年人契約有效", "不能撤銷", "不是效力未定"]}, "6-8-10": {"law": "【民事訴訟法 第68條】\n訴訟代理人應委任律師為之。但經審判長許可者，亦得委任非律師為訴訟代理人。\n\n【民事訴訟法 第70條】\n訴訟代理人就其受委任之事件有為一切訴訟行為之權。但捨棄、認諾、撤回、和解、提起反訴、上訴或再審之訴及選任代理人，非受特別委任不得為之。", "note": "找非律師當訴訟代理人，要經審判長許可。", "full": "【民事訴訟法 第68條】\n訴訟代理人應委任律師為之。但經審判長許可者，亦得委任非律師為訴訟代理人。\n前項之許可，審判長得隨時以裁定撤銷之，並應送達於為訴訟委任之人。\n\n【民事訴訟法 第70條】\n訴訟代理人就其受委任之事件有為一切訴訟行為之權。但捨棄、認諾、撤回、和解、提起反訴、上訴或再審之訴及選任代理人，非受特別委任不得為之。", "opts": ["", "不能直接去", "不能坐旁聽發言", "代理權不及於每個審級"]}, "6-8-11": {"law": "【民法 第440條】\n承租人租金支付有遲延者，出租人得定相當期限，催告承租人支付租金，如承租人於其期限內不為支付，出租人得終止契約。\n\n【民事訴訟法 第149條】\n對於當事人之送達，有下列各款情形之一者，受訴法院得依聲請，准…\n一、應為送達之處所不明者。", "note": "不能確定房客搬走，就不能自己開鎖。正確：存證信函催繳→再發函終止→向法院告遷讓房屋。", "full": "【民事訴訟法 第149條】\n對於當事人之送達，有下列各款情形之一者，受訴法院得依聲請，准為公示送達：\n一、應為送達之處所不明者。\n\n【民法 第440條】\n承租人租金支付有遲延者，出租人得定相當期限，催告承租人支付租金，如承租人於其期限內不為支付，出租人得終止契約。\n租賃物為房屋者，遲付租金之總額，非達二個月之租額，不得依前項之規定，終止契約。其租金約定於每期開始時支付者，並應於遲延給付逾二個月時，始得終止契約。", "opts": ["不能自己進去清掃", "不能強制開鎖", "不能強行開鎖", ""]}, "6-8-12": {"law": "【民法 第438條】\n承租人違反前項之規定為租賃物之使用、收益，經出租人阻止而仍繼續為之者，出租人得終止契約。\n\n【民法 第443條】\n承租人違反前項規定，將租賃物轉租於他人者，出租人得終止契約。", "note": "房客未經同意把房子「全部」轉租，房東可以終止。", "full": "【民法 第443條】\n承租人非經出租人承諾，不得將租賃物轉租於他人。但租賃物為房屋者，除有反對之約定外，承租人得將其一部分轉租於他人。\n承租人違反前項規定，將租賃物轉租於他人者，出租人得終止契約。\n\n【民法 第440條】\n承租人租金支付有遲延者，出租人得定相當期限，催告承租人支付租金，如承租人於其期限內不為支付，出租人得終止契約。\n租賃物為房屋者，遲付租金之總額，非達二個月之租額，不得依前項之規定，終止契約。其租金約定於每期開始時支付者，並應於遲延給付逾二個月時，始得終止契約。\n\n【民法 第438條】\n承租人違反前項之規定為租賃物之使用、收益，經出租人阻止而仍繼續為之者，出租人得終止契約。", "opts": ["有反對轉租的約定就不能轉租", "房屋遲付租金要達2個月、還要定期限催告，才能終止", "", "違反約定使用方法，要先經房東阻止、還繼續用，才能終止"]}, "6-8-13": {"law": "【民事訴訟法 第466條】\n對於財產權訴訟之第二審判決，如因上訴所得受之利益，不逾新臺幣一百萬元者，不得上訴。\n\n【民事訴訟法 第77-13條】\n因財產權而起訴，其訴訟標的之金額或價額在新臺幣十萬元以下部分，徵收裁判費一千元；…", "note": "不是所有民事案件都能上第三審：財產權案件的上訴利益要超過門檻才行。條文寫100萬，司法院已提高為150萬（91年起）。答 D。", "full": "【民事訴訟法 第466條】\n對於財產權訴訟之第二審判決，如因上訴所得受之利益，不逾新臺幣一百萬元者，不得上訴。\n\n【民事訴訟法 第77-13條】\n因財產權而起訴，其訴訟標的之金額或價額在新臺幣十萬元以下部分，徵收裁判費一千元；逾十萬元至一百萬元部分，每萬元徵收一百元；逾一百萬元至一千萬元部分，每萬元徵收九十元；逾一千萬元至一億元部分，每萬元徵收八十元；逾一億元至十億元部分，每萬元徵收七十元；逾十億元部分，每萬元徵收六十元；其畸零之數不滿萬元者，以萬元計算。", "flag": "第 466 條的金額門檻會隨司法院命令調整，這題只要記得「有上訴利益門檻，不是每個案件都能上訴第三審」。", "opts": ["要繳裁判費", "裁判費由原告先繳", "不一定要律師", ""]}, "6-8-14": {"law": "【民事訴訟法 第68條】\n訴訟代理人應委任律師為之。但經審判長許可者，亦得委任非律師為訴訟代理人。", "note": "當事人到不了庭，可以委任代理人，法院允許就能代理。", "opts": ["不一定要親自到庭", "不會拘提", "可以公示送達", ""]}, "6-8-15": {"law": "【強制執行法 第4條】\n強制執行，依左列執行名義為之：\n三、依民事訴訟法成立之和解或調解。\n\n【民事訴訟法 第521條】\n債務人對於支付命令未於法定期間合法提出異議者，支付命令得為執行名義。", "note": "律師見證的和解書不是執行名義。其他三種都可以。", "full": "【強制執行法 第4條】\n強制執行，依左列執行名義為之：\n一、確定之終局判決。\n二、假扣押、假處分、假執行之裁判及其他依民事訴訟法得為強制執行之裁判。\n三、依民事訴訟法成立之和解或調解。\n四、依公證法規定得為強制執行之公證書。\n五、抵押權人或質權人，為拍賣抵押物或質物之聲請，經法院為許可強制執行之裁定者。\n六、其他依法律之規定，得為強制執行名義者。\n\n【民事訴訟法 第521條】\n債務人對於支付命令未於法定期間合法提出異議者，支付命令得為執行名義。", "opts": ["訴訟上和解是執行名義", "調解成立是執行名義", "", "未異議的支付命令是執行名義"]}, "6-8-16": {"law": "【民法 第449條】\n租用基地建築房屋者，不適用第一項之規定。", "note": "租期上限20年，但「租基地蓋房子」例外，30年有效；租房子25年要縮短成20年。", "full": "【民法 第449條】\n租賃契約之期限，不得逾二十年。逾二十年者，縮短為二十年。\n租用基地建築房屋者，不適用第一項之規定。", "opts": ["基地租賃30年不受限", "房屋租25年要縮短", "", "不是縮短後可更新"]}, "6-9-01": {"law": "【租賃住宅市場發展及管理條例 第11條】\n租賃期間發生下列情形之一者，承租人得提前終止租賃契約，且出租…\n三、因不可歸責於承租人之事由，致租賃住宅之一部滅失，且其存餘部分難以繼續居住。\n\n【住宅租賃定型化契約應記載事項 第18點】\n承租人提前終止租約租賃期間有下列情形之一者，承租人得提前終止…\n(二)租賃住宅因不可歸責承租人之事由致一部滅失，且其存餘部分不能達租賃之目的。", "note": "地震害房子不能住，不是房客的錯，就算約定不能提前終止，房客還是可以終止。", "full": "【租賃住宅市場發展及管理條例 第11條】\n租賃期間發生下列情形之一者，承租人得提前終止租賃契約，且出租人不得要求任何賠償：\n三、因不可歸責於承租人之事由，致租賃住宅之一部滅失，且其存餘部分難以繼續居住。\n\n【住宅租賃定型化契約應記載事項 第18點】\n承租人提前終止租約租賃期間有下列情形之一者，承租人得提前終止租約，出租人不得要求任何賠償：\n(二)租賃住宅因不可歸責承租人之事由致一部滅失，且其存餘部分不能達租賃之目的。", "opts": ["", "鄰居吵不算", "煙味不算", "對面墓園不算"]}, "6-9-02": {"law": "【住宅租賃定型化契約應記載事項 第9點】\n前項出租人於修繕期間，致租賃住宅全部或一部不能居住使用者，承租人得請求出租人扣除該期間全部或一部之租金。\n\n【租賃住宅市場發展及管理條例 第8條】\n出租人為修繕租賃住宅所為之必要行為，承租人不得拒絕。", "note": "房東修繕房客不能拒絕，但修繕期間不能住的部分，要折抵租金。", "full": "【租賃住宅市場發展及管理條例 第8條】\n出租人為修繕租賃住宅所為之必要行為，承租人不得拒絕。\n\n【住宅租賃定型化契約應記載事項 第9點】\n修繕租賃住宅或附屬設備損壞時，應由出租人負責修繕。但租賃雙方另有約定、習慣或其損壞係可歸責於承租人之事由者，不在此限。\n前項出租人於修繕期間，致租賃住宅全部或一部不能居住使用者，承租人得請求出租人扣除該期間全部或一部之租金。", "opts": ["房客可主張扣租金", "", "修繕必要行為不能拒絕", "房東可進入修繕"]}, "6-9-03": {"law": "【民法 第425條】\n出租人於租賃物交付後，承租人占有中，縱將其所有權讓與第三人，其租賃契約，對於受讓人仍繼續存在。\n\n【住宅租賃定型化契約應記載事項 第16點】\n租賃住宅所有權之讓與出租人於租賃住宅交付後，承租人占有中，縱將其所有權讓與第三人，本契約對於受讓人仍繼續存在。", "note": "買賣不破租賃：租約對新屋主繼續有效，新屋主變成出租人。", "full": "【民法 第425條】\n出租人於租賃物交付後，承租人占有中，縱將其所有權讓與第三人，其租賃契約，對於受讓人仍繼續存在。\n前項規定，於未經公證之不動產租賃契約，其期限逾五年或未定期限者，不適用之。\n\n【住宅租賃定型化契約應記載事項 第16點】\n租賃住宅所有權之讓與出租人於租賃住宅交付後，承租人占有中，縱將其所有權讓與第三人，本契約對於受讓人仍繼續存在。", "opts": ["移轉有效", "不是無權占有", "", "不定期租約若公證也適用"]}, "6-9-04": {"law": "【民法 第103條】\n代理人於代理權限內，以本人名義所為之意思表示，直接對本人發生效力。", "note": "不是所有權人要出租，要出示屋主同意書和代理文件。", "full": "【民法 第103條】\n代理人於代理權限內，以本人名義所為之意思表示，直接對本人發生效力。\n\n（非所有人出租，要有授權，授權應出示授權文件）", "opts": ["親人也不能任意出租", "非所有權人要有授權", "", "不一定要透過業者"]}, "6-9-05": {"law": "【民法 第440條】\n租賃物為房屋者，遲付租金之總額，非達二個月之租額，不得依前項之規定，終止契約。其租金約定於每期開始時支付者，並應於遲延給付逾二個月時，始得終止契約。\n\n【租賃住宅市場發展及管理條例 第10條】\n租賃期間發生下列情形之一者，出租人得提前終止租賃契約，且承租人不得要求任何賠償：", "note": "押金沒付，不是租約不成立，房東不能任意終止。要走法定事由。", "full": "【民法 第440條】\n承租人租金支付有遲延者，出租人得定相當期限，催告承租人支付租金，如承租人於其期限內不為支付，出租人得終止契約。\n租賃物為房屋者，遲付租金之總額，非達二個月之租額，不得依前項之規定，終止契約。其租金約定於每期開始時支付者，並應於遲延給付逾二個月時，始得終止契約。\n\n【租賃住宅市場發展及管理條例 第10條】\n租賃期間發生下列情形之一者，出租人得提前終止租賃契約，且承租人不得要求任何賠償：", "opts": ["不能任意終止", "押金不是契約生效條件", "不能直接終止", ""]}, "6-9-06": {"law": "【民法 第429條】\n出租人為保存租賃物所為之必要行為，承租人不得拒絕。", "note": "房客有使用權，房東不能隨便進出，帶看要先通知、徵得同意。", "full": "【民法 第429條】\n出租人為保存租賃物所為之必要行為，承租人不得拒絕。\n\n（出租人帶看，要尊重承租人的使用權，需先通知並徵得同意）", "opts": ["", "房東不能任意進入", "不是為了避免房東刁難", "不是為了好聚好散"]}, "6-9-07": {"law": "【民法 第432條】\n承租人違反前項義務，致租賃物毀損、滅失者，負損害賠償責任。但依約定之方法或依物之性質而定之方法為使用、收益，致有變更或毀損者，不在此限。", "note": "牆壁自然褪色、斑駁是自然耗損，房客不用負責清潔粉刷。", "full": "【民法 第432條】\n承租人應以善良管理人之注意，保管租賃物，租賃物有生產力者，並應保持其生產力。\n承租人違反前項義務，致租賃物毀損、滅失者，負損害賠償責任。但依約定之方法或依物之性質而定之方法為使用、收益，致有變更或毀損者，不在此限。", "opts": ["自然耗損不用負責", "", "不能要求房客負擔", "不用全室粉刷"]}, "6-10-01": {"law": "【民法 第429條】\n租賃物之修繕，除契約另有訂定或另有習慣外，由出租人負擔。\n\n【租賃住宅市場發展及管理條例 第8條】\n出租人應以合於所約定居住使用之租賃住宅，交付承租人，並應於租賃期間保持其合於居住使用之狀態。", "note": "契約沒寫修繕責任，就是房東負責。", "opts": ["不是房客", "", "保證人不負責", "不是各半"]}, "6-10-02": {"law": "【住宅租賃定型化契約應記載事項 第17點】\n出租人提前終止租約租賃期間有下列情形之一者，出租人得提前終止…\n(二)承租人遲付租金之總額達二個月之租金額，經出租人定相當期限催告，仍不為支付。\n\n【民法 第440條】\n承租人租金支付有遲延者，出租人得定相當期限，催告承租人支付租金，如承租人於其期限內不為支付，出租人得終止契約。", "note": "房東能終止的：欠租達2個月且催告。「遲繳1星期」不算。", "full": "【民法 第440條】\n承租人租金支付有遲延者，出租人得定相當期限，催告承租人支付租金，如承租人於其期限內不為支付，出租人得終止契約。\n租賃物為房屋者，遲付租金之總額，非達二個月之租額，不得依前項之規定，終止契約。其租金約定於每期開始時支付者，並應於遲延給付逾二個月時，始得終止契約。\n\n【住宅租賃定型化契約應記載事項 第17點】\n出租人提前終止租約租賃期間有下列情形之一者，出租人得提前終止租約，且承租人不得要求任何賠償：\n(二)承租人遲付租金之總額達二個月之租金額，經出租人定相當期限催告，仍不為支付。\n(三)承租人積欠管理費或其他應負擔之費用達二個月之租金額，經出租人定相當期限催告，仍不為支付。\n(五)承租人違反第八點第二項規定，違法使用、存放有爆炸性或易燃性物品，經出租人阻止仍繼續為之。\n(八)承租人違反第十點第一項規定，未經出租人同意，擅自進行室內裝修，經出租人阻止仍繼續為之。\n(九)承租人違反第十點第一項規定，未依相關法令規定進行室內裝修，經出租人阻止仍繼續為之。\n(十)承租人違反第十點第一項規定，進行室內裝修，損害原有建築結構之安全。", "opts": ["", "未經同意裝修是終止事由", "違法使用是終止事由", "積欠管理費達2個月是終止事由"]}, "6-10-03": {"law": "【民法 第77條】\n限制行為能力人為意思表示及受意思表示，應得法定代理人之允許。但純獲法律上利益，或依其年齡及身分、日常生活所必需者，不在此限。\n\n【民法 第79條】\n限制行為能力人未得法定代理人之允許，所訂立之契約，須經法定代理人之承認，始生效力。", "note": "未成年人租房，要法定代理人同意。", "opts": ["未成年也可租", "", "不需陪同簽約", "不是誰都可以簽"]}, "6-10-04": {"law": "【民法 第451條】\n租賃期限屆滿後，承租人仍為租賃物之使用收益，而出租人不即表示反對之意思者，視為以不定期限繼續契約。\n\n【民法 第450條】\n前項終止契約，應依習慣先期通知。但不動產之租金，以星期、半個月或一個月定其支付之期限者，出租人應以曆定星期、半個月或一個月之末日為契約終止期，並應至少於一星期、半個月或一個月前通知之。", "note": "租約到期後繼續住，變成不定期租約，房客可依習慣先通知後終止，房東不能扣違約金。", "full": "【民法 第450條】\n未定期限者，各當事人得隨時終止契約。但有利於承租人之習慣者，從其習慣。\n前項終止契約，應依習慣先期通知。但不動產之租金，以星期、半個月或一個月定其支付之期限者，出租人應以曆定星期、半個月或一個月之末日為契約終止期，並應至少於一星期、半個月或一個月前通知之。\n\n【民法 第451條】\n租賃期限屆滿後，承租人仍為租賃物之使用收益，而出租人不即表示反對之意思者，視為以不定期限繼續契約。", "opts": ["不定期租約押金還是要退", "", "不定期租約沒有違約金", "不需房東同意"]}, "6-10-05": {"law": "【住宅租賃定型化契約應記載事項 第9點】\n前項出租人於修繕期間，致租賃住宅全部或一部不能居住使用者，承租人得請求出租人扣除該期間全部或一部之租金。\n\n【租賃住宅市場發展及管理條例 第8條】\n出租人為修繕租賃住宅所為之必要行為，承租人不得拒絕。", "note": "房客要配合修繕，但修繕期間不能住，可跟房東談扣租或賠償。", "full": "【租賃住宅市場發展及管理條例 第8條】\n出租人為修繕租賃住宅所為之必要行為，承租人不得拒絕。\n\n【住宅租賃定型化契約應記載事項 第9點】\n修繕租賃住宅或附屬設備損壞時，應由出租人負責修繕。但租賃雙方另有約定、習慣或其損壞係可歸責於承租人之事由者，不在此限。\n前項出租人於修繕期間，致租賃住宅全部或一部不能居住使用者，承租人得請求出租人扣除該期間全部或一部之租金。", "opts": ["", "可以協商賠償", "不用單純忍耐", "損壞可以求償"]}, "6-10-06": {"law": "【民法 第450條】\n未定期限者，各當事人得隨時終止契約。但有利於承租人之習慣者，從其習慣。\n\n【民法 第453條】\n定有期限之租賃契約，如約定當事人之一方於期限屆滿前，得終止契約者，其終止契約，應依第四百五十條第三項之規定，先期通知。", "note": "定期租約沒寫提前終止，要雙方同意，或協商賠償金額。", "full": "【民法 第450條】\n租賃定有期限者，其租賃關係，於期限屆滿時消滅。\n未定期限者，各當事人得隨時終止契約。但有利於承租人之習慣者，從其習慣。\n\n【民法 第453條】\n定有期限之租賃契約，如約定當事人之一方於期限屆滿前，得終止契約者，其終止契約，應依第四百五十條第三項之規定，先期通知。", "opts": ["不能隨時終止", "", "不是提前1個月就行", "不是提前1個月加賠即可"]}, "6-10-07": {"law": "【民法 第438條】\n承租人應依約定方法，為租賃物之使用、收益；無約定方法者，應以依租賃物之性質而定之方法為之。\n\n【住宅租賃定型化契約應記載事項 第8點】\n使用租賃住宅之限制本租賃住宅係供居住使用，承租人不得變更用途。", "note": "契約沒禁止養寵物，房東事後不能禁止或以此終止。但不能妨礙公共安寧衛生，退租要回復原狀。", "opts": ["", "不需承諾書", "房客不用容忍房東事後禁止", "契約沒禁止就可以"]}, "6-10-08": {"law": "【民法 第435條】\n前項情形，承租人就其存餘部分不能達租賃之目的者，得終止契約。\n\n【民法 第436條】\n前條規定，於承租人因第三人就租賃物主張權利，致不能為約定之使用、收益者準用之。", "note": "真正所有人出現，房客先向房東確認他有沒有出租權利，沒有的話可以終止並求償。", "full": "【民法 第436條】\n前條規定，於承租人因第三人就租賃物主張權利，致不能為約定之使用、收益者準用之。\n\n【民法 第435條】\n租賃關係存續中，因不可歸責於承租人之事由，致租賃物之一部滅失者，承租人得按滅失之部分，請求減少租金。\n前項情形，承租人就其存餘部分不能達租賃之目的者，得終止契約。\n\n【民法 第349條】\n出賣人應擔保第三人就買賣之標的物，對於買受人不得主張任何權利。", "opts": ["", "租約無法對抗所有人", "不用3日搬離", "不是請丙處理"]}, "6-10-09": {"law": "【民法 第443條】\n承租人違反前項規定，將租賃物轉租於他人者，出租人得終止契約。\n\n【租賃住宅市場發展及管理條例 第9條】\n轉租人應經出租人書面同意，始得轉租其租用之住宅全部或一部。", "note": "房客未經同意把房間分租（帶人住並收租金），房東可以終止。", "full": "【民法 第443條】\n承租人非經出租人承諾，不得將租賃物轉租於他人。但租賃物為房屋者，除有反對之約定外，承租人得將其一部分轉租於他人。\n承租人違反前項規定，將租賃物轉租於他人者，出租人得終止契約。\n\n【租賃住宅市場發展及管理條例 第9條】\n轉租人應經出租人書面同意，始得轉租其租用之住宅全部或一部。", "flag": "題庫選 C，說明這屬於違反租賃條例的行為（未經書面同意）。民法第 443 條對房屋「一部轉租」另有規定，兩者看起來有出入，考試記題庫答案。", "opts": ["沒同意轉租房東可終止", "房東不能干涉不是正確", "", "房東可終止不只是漲租"]}, "6-10-10": {"law": "【住宅租賃定型化契約應記載事項 第15點】\n前項租賃之一方未會同點交，經他方定相當期限催告仍不會同者，視為完成點交。\n\n【租賃住宅市場發展及管理條例 第12條】\n租賃契約消滅時，租賃住宅之返還，應由租賃當事人共同完成屋況及附屬設備之點交。一方未會同點交，經他方定相當期限催告仍不會同者，視為完成點交。", "note": "房東不來點交：房客定期限催告，他還是不來，視為完成點交。不能自己把鑰匙丟信箱。", "full": "【租賃住宅市場發展及管理條例 第12條】\n租賃契約消滅時，租賃住宅之返還，應由租賃當事人共同完成屋況及附屬設備之點交。一方未會同點交，經他方定相當期限催告仍不會同者，視為完成點交。\n\n【住宅租賃定型化契約應記載事項 第15點】\n租賃住宅之返還租賃關係消滅時，出租人應即結算租金及第六點約定之相關費用，並會同承租人共同完成屋況及附屬設備之點交手續，承租人應將租賃住宅返還出租人並遷出戶籍或其他登記。\n前項租賃之一方未會同點交，經他方定相當期限催告仍不會同者，視為完成點交。", "opts": ["不能自己丟鑰匙", "", "不能扣著鑰匙不還", "存證信函不能代替點交"]}, "6-10-11": {"law": "【租賃住宅市場發展及管理條例 第7條】\n出租人應於租賃契約消滅，承租人返還租賃住宅及清償租賃契約所生之債務時，返還押金或抵充債務後之賸餘押金。\n\n【住宅租賃定型化契約應記載事項 第5點】\n前項押金除有第十二點第四項、第十四點第三項、第十五點第四項及第十九點第二項得抵充之情形外，出租人應於租期屆滿或租賃契約終止，承租人返還租賃住宅時，返還押金或抵充本契約所生債務後之賸餘押金。", "note": "房客可先請水電瓦斯公司結算，結清後要求退剩下的押金。", "full": "【租賃住宅市場發展及管理條例 第7條】\n出租人應於租賃契約消滅，承租人返還租賃住宅及清償租賃契約所生之債務時，返還押金或抵充債務後之賸餘押金。\n\n【住宅租賃定型化契約應記載事項 第5點】\n押金約定及返還押金由租賃雙方約定為 個月租金，金額為 元整(最高不得超過二個月租金之總額)。承租人應於簽訂本契約之同時給付出租人。\n前項押金除有第十二點第四項、第十四點第三項、第十五點第四項及第十九點第二項得抵充之情形外，出租人應於租期屆滿或租賃契約終止，承租人返還租賃住宅時，返還押金或抵充本契約所生債務後之賸餘押金。", "opts": ["不能無限期扣押金", "不能先全扣", "不用先還1個月", ""]}, "6-10-12": {"law": "【住宅租賃定型化契約應記載事項 第9點】\n修繕租賃住宅或附屬設備損壞時，應由出租人負責修繕。但租賃雙方另有約定、習慣或其損壞係可歸責於承租人之事由者，不在此限。", "note": "「消耗品」法律沒有定義，雙方要協商，並把修繕責任講清楚。", "full": "【住宅租賃定型化契約應記載事項 第9點】\n修繕租賃住宅或附屬設備損壞時，應由出租人負責修繕。但租賃雙方另有約定、習慣或其損壞係可歸責於承租人之事由者，不在此限。\n前項由出租人負責修繕者，承租人得定相當期限催告修繕，如出租人未於承租人所定相當期限內修繕時，承租人得自行修繕，並請求出租人償還其費用或於第四點約定之租金中扣除。\n出租人為修繕租賃住宅所為之必要行為，應於相當期間先期通知，承租人無正當理由不得拒絕。\n前項出租人於修繕期間，致租賃住宅全部或一部不能居住使用者，承租人得請求出租人扣除該期間全部或一部之租金。\n\n（消耗品範圍沒有法律明文，要靠雙方協商釐清）", "opts": ["不能自行認定消耗品", "不是都不能修", "", "不能自行扣租金"]}, "6-10-13": {"law": "【民法 第438條】\n承租人應依約定方法，為租賃物之使用、收益；無約定方法者，應以依租賃物之性質而定之方法為之。", "note": "房客為了安全和隱私，可以換鎖，最好保留原本的鎖。", "full": "【民法 第438條】\n承租人應依約定方法，為租賃物之使用、收益；無約定方法者，應以依租賃物之性質而定之方法為之。\n\n（換鎖屬使用收益的方式，原則可為，最好保留原鎖具；實務見解）", "opts": ["", "可以換鎖", "不必留備份鑰匙", "不是不可以"]}, "6-10-14": {"law": "（戶籍法規定，房屋所有權人得舉證申請遷出，戶政事務所依戶籍法辦理）", "note": "房客退租不遷戶籍：房東可到戶政事務所，證明他沒住了，簽切結書，辦遷出。", "flag": "這題的依據是戶籍法與內政部函釋，我沒有抓到對應條文原文，內容依題庫。", "opts": ["不能等", "", "調解委員會不辦理", "不是只能請房客自己辦"]}, "6-10-15": {"law": "【住宅租賃定型化契約應記載事項 第17點】\n出租人提前終止租約租賃期間有下列情形之一者，出租人得提前終止…\n(二)承租人遲付租金之總額達二個月之租金額，經出租人定相當期限催告，仍不為支付。\n\n【民法 第440條】\n租賃物為房屋者，遲付租金之總額，非達二個月之租額，不得依前項之規定，終止契約。其租金約定於每期開始時支付者，並應於遲延給付逾二個月時，始得終止契約。", "note": "契約寫「遲付3日自動失效」不行。要欠租達2個月，還要催告。", "full": "【民法 第440條】\n承租人租金支付有遲延者，出租人得定相當期限，催告承租人支付租金，如承租人於其期限內不為支付，出租人得終止契約。\n租賃物為房屋者，遲付租金之總額，非達二個月之租額，不得依前項之規定，終止契約。其租金約定於每期開始時支付者，並應於遲延給付逾二個月時，始得終止契約。\n\n【住宅租賃定型化契約應記載事項 第17點】\n出租人提前終止租約租賃期間有下列情形之一者，出租人得提前終止租約，且承租人不得要求任何賠償：\n(二)承租人遲付租金之總額達二個月之租金額，經出租人定相當期限催告，仍不為支付。", "opts": ["契約自由不能違反強制規定", "", "要達2個月", "不是收不到就免提供"]}, "6-10-16": {"law": "【租賃住宅市場發展及管理條例 第3條】\n十三、押金：指承租人為擔保租賃住宅之損害賠償行為及處理遺留物責任，預 之身分。測量完竣後，應發給申請人建物測量成果圖。測量結果應由申請人當場認定，並在建物測量圖上簽名或蓋章。申請人不簽名或蓋章時，測量人員應在建物測量圖及建物測量成果圖載明其事由；其涉及原建物標示變更者，發給之建物測量成果圖並加註僅供參考，其所附土地登記申請書件予以退還。", "opts": ["建照執照不是測量發的", "使用執照不是測量發的", "", "房屋權狀不是測量發的"]}, "7-2-04": {"law": "（這題屬屋況設備實務教材，沒有對應的法條原文）", "note": "建物測量成果圖的面積單位是平方公尺，不是坪。", "opts": ["", "公分不是面積單位", "公尺不是面積單位", "坪是習慣，成果圖用平方公尺"]}, "7-2-05": {"law": "【地籍測量實施規則 第273條】\n建物平面圖測繪邊界依下列規定辦理：\n三、使用執照竣工圖說載有依建築技術規則檢討設置之陽臺者，其突出部分以外緣為界，並以附屬建物辦理測量。", "note": "陽臺要保持「立面透空」，不能封窗或加鐵窗，否則是違規增建。", "full": "【地籍測量實施規則 第273條】\n建物平面圖測繪邊界依下列規定辦理：\n三、使用執照竣工圖說載有依建築技術規則檢討設置之陽臺者，其突出部分以外緣為界，並以附屬建物辦理測量。\n\n（這題屬屋況設備實務教材，沒有對應的法條原文）", "opts": ["陽臺是附屬建物", "", "不能任意加鐵窗", "不能加立窗"]}, "7-2-06": {"law": "【地籍測量實施規則 第273條】\n中華民國一百零七年一月一日前已申請建造執照者，或都市更新事業計畫已報核，並依都市更新條例一百零八年一月三十日修正施行前第六十一條之一第一項及第二項規定期限申請建造執照之建物，其屋簷、雨遮及地下層之測繪，依本條一百零六年一月九日修正施行前規定辦理。", "note": "屋簷、雨遮：107年起申請建照的建物不能登記。", "full": "【地籍測量實施規則 第273條】\n建物平面圖測繪邊界依下列規定辦理：\n中華民國一百零七年一月一日前已申請建造執照者，或都市更新事業計畫已報核，並依都市更新條例一百零八年一月三十日修正施行前第六十一條之一第一項及第二項規定期限申請建造執照之建物，其屋簷、雨遮及地下層之測繪，依本條一百零六年一月九日修正施行前規定辦理。", "opts": ["有規定", "", "不是106年", "不是起造人決定"]}, "7-2-07": {"law": "【地籍測量實施規則 第273條】\n建物平面圖測繪邊界依下列規定辦理：\n一、建物以其外牆之外緣為界。", "note": "建物測量成果圖：以牆壁「外緣」為界。", "opts": ["有規定", "", "牆壁中心是共用牆", "不是內緣"]}, "7-2-08": {"law": "【建築法 第70條】\n…其主要構造、室內隔間及建築物主要設備等與設計圖樣相符者，發給使用執照，並得核發謄本；…", "note": "使用執照會登載構造種類（例如RC造）、層數、用途。不會寫租金或各戶產權面積。", "full": "【建築法 第70條】\n建築工程完竣後，應由起造人會同承造人及監造人申請使用執照。直轄市、縣（市）（局）主管建築機關應自接到申請之日起，十日內派員查驗完竣。其主要構造、室內隔間及建築物主要設備等與設計圖樣相符者，發給使用執照，並得核發謄本；不相符者，一次通知其修改後，再報請查驗。但供公眾使用建築物之查驗期限，得展延為二十日。\n\n（這題屬屋況設備實務教材，沒有對應的法條原文）", "opts": ["不登載租金", "不登載活載重", "", "不登載各戶產權面積"]}, "7-2-09": {"law": "（這題屬屋況設備實務教材，沒有對應的法條原文）", "note": "電氣盤內要有「單線圖說」，跳電時查迴路用。", "opts": ["不用屋主電話", "不用業者電話", "", "不是系統昇位圖"]}, "7-2-10": {"law": "【建築技術規則建築設備編 第79條】\n（六）燃氣器具連接供氣管路之連接管，得為金屬管或橡皮管。橡皮管長度不得超過一點八公尺，並不得隱蔽在構造體內或貫穿樓地板或牆壁。", "note": "瓦斯橡皮管長度不能超過1.8公尺，也不能藏在牆裡。", "opts": ["可以用橡皮管", "", "不能藏在構造體內", "不能超過1.8公尺"]}, "7-2-11": {"law": "（這題屬屋況設備實務教材，沒有對應的法條原文）", "note": "浴室衛浴這種潮濕地方的用電，要裝漏電斷路器。", "opts": ["電燈不一定", "電腦不一定", "", "電扇不一定"]}, "7-2-12": {"law": "（這題屬屋況設備實務教材，沒有對應的法條原文）", "note": "住宅給水壓力上限，題庫答案3.5 kg/cm²。", "flag": "這個數字我沒有在建築技術規則找到明文。考試記題庫答案 3.5。", "opts": ["", "5kg太大", "1太小", "0.5太小"]}, "7-2-13": {"law": "【消防法 第15-1條】\n第一項熱水器應裝設於建築物外牆，或裝設於有開口且與戶外空氣流通之位置；其無法符合者，應裝設熱水器排氣管將廢氣排至戶外。", "note": "瓦斯熱水器要裝在通風良好的陽臺。通風不好會一氧化碳中毒。", "opts": ["不能在門口", "不能在走廊", "通風不良會中毒", ""]}, "7-2-14": {"law": "【各類場所消防安全設備設置標準 第17條】\n下列場所或樓層應設置自動撒水設備：\n二、建築物在十一層以上之樓層，樓地板面積在一百平方公尺以上者。", "note": "高層建築物（50公尺或16層以上）一定在11層以上；消防設置標準規定11層以上的樓層都要設自動撒水設備，所以每個住宅空間都要有撒水設備，答 C。", "full": "【各類場所消防安全設備設置標準 第17條】\n下列場所或樓層應設置自動撒水設備：\n二、建築物在十一層以上之樓層，樓地板面積在一百平方公尺以上者。\n\n（這題屬屋況設備實務教材，沒有對應的法條原文）", "opts": ["避難器具不是每戶", "室內消防栓不是每戶", "", "排煙設備不是每戶"]}, "7-2-15": {"law": "【各類場所消防安全設備設置標準 第25條】\n建築物除十一層以上樓層及避難層外，各樓層應選設滑臺、避難梯、避難橋、救助袋、緩降機、避難繩索、滑杆或經中央主管機關認可具同等性能之避難器具。但建築物在構造及設施上，並無避難逃生障礙，經中央主管機關認可者，不在此限。", "note": "緩降機這類避難器具，11樓以上不設。所以11F不可能有。", "opts": ["2樓可能有", "6樓可能有", "10樓可能有", ""]}, "7-2-16": {"law": "【建築技術規則建築設計施工編 第45條】\n五、建築物使用用途為 H-2、D-3、F-3  組者，外牆設置開啟式窗戶之窗臺高度不得小於一‧一○公尺；…\n\n【建築技術規則建築設計施工編 第38條】\n設置於露臺、陽臺、室外走廊、室外樓梯、平屋頂及室內天井部分等之欄桿扶手高度，不得小於一‧一○公尺；十層以上者，不得小於一‧二○公尺。", "note": "10層以上，外牆窗臺高度要120公分以上，防小孩墜樓。", "full": "【建築技術規則建築設計施工編 第45條】\n五、建築物使用用途為 H-2、D-3、F-3  組者，外牆設置開啟式窗戶之窗臺高度不得小於一‧一○公尺；十層以上不得小於一‧二○公尺。但其鄰接露臺、陽臺、室外走廊、室外樓梯、室內天井，或設有符合本編第三十八條規定之欄杆、依本編第一百零八條規定設置之緊急進口者，不在此限。\n\n【建築技術規則建築設計施工編 第38條】\n設置於露臺、陽臺、室外走廊、室外樓梯、平屋頂及室內天井部分等之欄桿扶手高度，不得小於一‧一○公尺；十層以上者，不得小於一‧二○公尺。", "opts": ["200公分太高", "180公分太高", "", "150公分太高"]}, "7-2-17": {"law": "【消防法 第11條】\n地面樓層達十一層以上建築物、地下建築物及中央主管機關指定之場所，其管理權人應使用附有防焰標示之地毯、窗簾、布幕、展示用廣告板及其他指定之防焰物品。", "note": "11樓以上的窗簾、地毯要用防焰的。", "opts": ["6樓以上不用", "沒消防設備不是依據", "10樓以上不用", ""]}, "7-2-18": {"law": "（這題屬屋況設備實務教材，沒有對應的法條原文）", "note": "浴室潮濕、易觸電，用電要經過漏電斷路器。", "opts": ["", "主臥房不是潮濕場所", "客廳不是", "書房不是"]}, "7-2-19": {"law": "（這題屬屋況設備實務教材，沒有對應的法條原文）", "note": "電氣接地線是綠色。", "opts": ["白色不是接地線", "黑色不是接地線", "黃色不是接地線", ""]}, "7-3-01": {"law": "（這題屬屋況設備實務教材，沒有對應的法條原文）", "note": "廚房跳電，先查是不是用電過多或電器短路。不要硬把開關推回去。", "opts": ["", ]}, "7-5-04": {"law": "【建築技術規則建築設計施工編 第38條】\n建築物使用用途為 A-1、A-2、B-2、D-2、D-3、F-3、G-2、H-2 組者，前項欄桿不得設有可供直徑十公分物體穿越之鏤空或可供攀爬之水平橫條。", "note": "欄桿間隙大於10公分，小孩就可能穿過去。", "full": "【建築技術規則建築設計施工編 第38條】\n設置於露臺、陽臺、室外走廊、室外樓梯、平屋頂及室內天井部分等之欄桿扶手高度，不得小於一‧一○公尺；十層以上者，不得小於一‧二○公尺。\n建築物使用用途為 A-1、A-2、B-2、D-2、D-3、F-3、G-2、H-2 組者，前項欄桿不得設有可供直徑十公分物體穿越之鏤空或可供攀爬之水平橫條。", "opts": ["1公分太小", "5公分太小", "", "15公分"]}, "7-5-05": {"law": "【建築技術規則建築設計施工編 第38條】\n設置於露臺、陽臺、室外走廊、室外樓梯、平屋頂及室內天井部分等之欄桿扶手高度，不得小於一‧一○公尺；十層以上者，不得小於一‧二○公尺。", "note": "9樓以下陽臺欄桿高度要110公分以上。", "opts": ["", "115公分", "100公分", "105公分"]}, "7-5-06": {"law": "【建築技術規則建築設計施工編 第38條】\n設置於露臺、陽臺、室外走廊、室外樓梯、平屋頂及室內天井部分等之欄桿扶手高度，不得小於一‧一○公尺；十層以上者，不得小於一‧二○公尺。", "note": "10樓以上陽臺欄桿高度要120公分以上。", "opts": ["110公分是9層以下", "", "100公分", "105公分"]}, "7-5-07": {"law": "（這題屬屋況設備實務教材，沒有對應的法條原文）", "note": "花錢少又能防小孩攀爬：牆內擺花架或吊盆，讓小孩不容易靠近欄杆。", "opts": ["", "貼貼紙沒用", "全改建太貴", "安全鎖不是欄杆，花費較高"]}, "7-5-08": {"law": "【建築物室內裝修管理辦法 第3條】\n本辦法所稱室內裝修，指除壁紙、壁布、窗簾、家具、活動隔屏、地…\n四、分間牆變更。", "note": "新增衛浴或隔間屬於室內裝修，要先申請。", "full": "【建築物室內裝修管理辦法 第3條】\n本辦法所稱室內裝修，指除壁紙、壁布、窗簾、家具、活動隔屏、地氈等之黏貼及擺設外之下列行為：\n四、分間牆變更。", "opts": ["跟房租無關", "不是請房東出資", "", "不是各出一半"]}, "7-5-09": {"law": "（這題屬屋況設備實務教材，沒有對應的法條原文）", "note": "銀髮族衛浴，加裝扶手。", "opts": ["WIFI沒幫助", "電視沒幫助", "", "音響沒幫助"]}, "7-5-10": {"law": "（這題屬屋況設備實務教材，沒有對應的法條原文）", "note": "銀髮族臥室走廊，裝小夜燈。地毯容易絆倒。", "opts": ["", "地毯會絆倒", "家庭劇院沒幫助", "WIFI沒幫助"]}, "7-5-11": {"law": "（這題屬屋況設備實務教材，沒有對應的法條原文）", "note": "有輪椅使用者，衛浴要以無障礙空間為優先。", "opts": ["美觀不是優先", "豪華不是優先", "", "通風不是優先"]}, "7-5-12": {"law": "（這題屬屋況設備實務教材，沒有對應的法條原文）", "note": "輪椅迴轉空間，預留150公分。", "opts": ["", "120太小", "100太小", "90太小"]}, "7-5-13": {"law": "【各類場所消防安全設備設置標準 第115條】\n探測器之裝置位置，依下列規定：\n一、天花板上設有出風口時，除火焰式、差動式分布型及光電式分離型探測器外，應距離該出風口一點五公尺以上。", "note": "冷氣出風口要離偵煙式探測器1.5公尺以上。", "full": "【各類場所消防安全設備設置標準 第115條】\n探測器之裝置位置，依下列規定：\n一、天花板上設有出風口時，除火焰式、差動式分布型及光電式分離型探測器外，應距離該出風口一點五公尺以上。\n二、牆上設有出風口時，應距離該出風口一點五公尺以上。但該出風口距天花板在一公尺以上時，不在此限。", "opts": ["0.5公尺太近", "1公尺太近", "", "0.1公尺太近"]}, "7-5-14": {"law": "【各類場所消防安全設備設置標準 第115條】\n探測器之裝置位置，依下列規定：\n三、天花板設排氣口或回風口時，偵煙式探測器應裝置於排氣口或回風口周圍一公尺範圍內。", "note": "天花板有排氣口或回風口，偵煙式探測器要裝在周圍1公尺內。", "opts": ["2公尺不對", "", "3公尺不對", "5公尺不對"]}, "8-1-01": {"law": "【建築法 第1條】\n為實施建築管理，以維護公共安全、公共交通、公共衛生及增進市容觀瞻，特制定本法；本法未規定者，適用其他法律之規定。", "note": "建築法立法目的：公共安全、公共交通、公共衛生、市容。選項裡只有「公共交通」。", "opts": ["公平不是立法意旨", "善良社會不是", "健全租屋市場不是", ""]}, "8-1-02": {"law": "【建築法 第2條】\n主管建築機關，在中央為內政部；在直轄市為直轄市政府；在縣（市）為縣（市）政府。", "note": "板橋區的地方主管建築機關是新北市政府，不是區公所。", "opts": ["內政部是中央", "營建署不是主管機關", "", "區公所不是"]}, "8-1-03": {"law": "【建築法 第2條】\n主管建築機關，在中央為內政部；在直轄市為直轄市政府；在縣（市）為縣（市）政府。", "note": "中央主管建築機關是內政部。", "opts": ["", "營建署是內政部下的單位", "新北市政府是地方", "區公所不是"]}, "8-1-04": {"law": "【建築法 第10條】\n本法所稱建築物設備，為敷設於建築物之電力、電信、煤氣、給水、污水、排水、空氣調節、昇降、消防、消雷、防空避難、污物處理及保護民眾隱私權等設備。", "note": "建築物設備包含電力、給水、排水、空調、昇降、「消防」等。", "opts": ["安全梯是建築設計", "招牌廣告不是設備", "", "圍牆不是設備"]}, "8-1-05": {"law": "【建築法 第28條】\n建築執照分左列四種：\n三、使用執照：建築物建造完成後之使用或變更使用，應請領使用執照。", "note": "蓋好之後要「變更使用」，要請領使用執照。", "opts": ["建造執照是蓋之前", "雜項執照是雜項工作物", "", "拆除執照是拆房子"]}, "8-1-06": {"law": "【建築法 第73條】\n建築物非經領得使用執照，不准接水、接電及使用。但直轄市、縣（市）政府認有左列各款情事之一者，得另定建築物接用水、電相關規定：", "note": "沒領「使用執照」，不准接水、接電、使用。", "opts": ["建造執照是蓋之前", "雜項執照不是", "拆除執照不是", ""]}, "8-1-07": {"law": "【建築法 第77條】\n建築物所有權人、使用人應維護建築物合法使用與其構造及設備安全。", "note": "維護建築物合法使用和安全，是所有權人和使用人的責任。", "opts": ["中央機關是主管", "地方機關是主管", "管理服務人員不是所有權人", ""]}, "8-1-08": {"law": "【建築法 第77條】\n供公眾使用之建築物，應由建築物所有權人、使用人定期委託中央主管建築機關認可之專業機構或人員檢查簽證，其檢查簽證結果應向當地主管建築機關申報。非供公眾使用之建築物，經內政部認有必要時亦同。", "note": "「供公眾使用」的建築物，要定期請專業機構檢查簽證並申報。", "opts": ["集合住宅不一定", "不是看幾戶", "", "出租不是看這個"]}, "8-1-09": {"law": "【建築法 第77-2條】\n建築物室內裝修應遵守左列規定：\n二、裝修材料應合於建築技術規則之規定。", "note": "裝修材料要符合建築技術規則，也不能破壞防火避難設施或消防設備。", "opts": ["", "美感不是規定", "不得妨害防火避難", "不得破壞消防設備"]}, "8-1-10": {"law": "【建築法 第8條】\n本法所稱建築物之主要構造，為基礎、主要樑柱、承重牆壁、樓地板及屋頂之構造。", "note": "主要構造有：基礎、主要樑柱、承重牆、樓地板、屋頂。「承重牆」是，非承重牆和天花板不是。", "opts": ["浴缸不是", "", "非承重牆不是", "天花板不是"]}, "8-1-11": {"law": "【住宅租賃定型化契約應記載事項 第10點】\n室內裝修承租人有室內裝修之需要，應經出租人同意並依相關法令規定辦理，且不得損害原有建築結構之安全。\n\n【建築物室內裝修管理辦法 第3條】\n本辦法所稱室內裝修，指除壁紙、壁布、窗簾、家具、活動隔屏、地氈等之黏貼及擺設外之下列行為：", "note": "承租人要裝修，要經房東同意。窗簾、活動隔屏不算室內裝修。", "opts": ["", "一定要房東同意", "窗簾不用申請", "活動隔屏不用申請"]}, "8-1-12": {"law": "【建築法 第91條】\n有左列情形之一者，處建築物所有權人、使用人、機械遊樂設施之經…\n二、未依第七十七條第一項規定維護建築物合法使用與其構造及設備安全者。", "note": "沒維護建築物安全，會被罰鍰、限期改善、補辦手續，不會被強制出讓產權。", "full": "【建築法 第91條】\n有左列情形之一者，處建築物所有權人、使用人、機械遊樂設施之經營者新臺幣六萬元以上三十萬元以下罰鍰，並限期改善或補辦手續，屆期仍未改善或補辦手續而繼續使用者，得連續處罰，並限期停止其使用。必要時，並停止供水供電、封閉或命其於期限內自行拆除，恢復原狀或強制拆除：\n二、未依第七十七條第一項規定維護建築物合法使用與其構造及設備安全者。", "opts": ["會罰鍰", "會限期改善", "會補辦手續", ""]}, "8-1-13": {"law": "（這題屬建築物設備維護實務教材，沒有對應的法條原文）", "note": "違建影響公共安全的標準：樓層達2層以上。", "flag": "依據是內政部的違章建築處理辦法，我沒有抓到原文，內容依題庫。", "opts": ["占用法定空地是一般違建", "露臺雨遮是一般違建", "", "1層以上不夠"]}, "8-1-14": {"law": "【建築法 第97-3條】\n一定規模以下之招牌廣告及樹立廣告，得免申請雜項執照。其管理並得簡化，不適用本法全部或一部之規定。", "note": "一定規模以下的招牌廣告，免申請「雜項執照」。", "opts": ["建照執照不是", "", "使用執照不是", "拆除執照不是"]}, "8-1-15": {"law": "【建築法 第73條】\n建築物應依核定之使用類組使用，其有變更使用類組或有第九條建造行為以外主要構造、防火區劃、防火避難設施、消防設備、停車空間及其他與原核定使用不合之變更者，應申請變更使用執照。但建築物在一定規模以下之使用變更，不在此限。\n前項一定規模以下之免辦理變更使用執照相關規定，由直轄市、縣（市）主管建築機關定之。", "note": "一定規模以下的使用變更，由縣市主管建築機關訂定，免辦變更使用執照。", "full": "【建築法 第73條】\n一、偏遠地區且非屬都市計畫地區之建築物。\n二、因興辦公共設施所需而拆遷具整建需要且無礙都市計畫發展之建築物。", "opts": ["內政部不是", "", "管委會不是", "規約不是"]}, "8-2-01": {"law": "【公寓大廈管理條例施行細則 第5條】\n前項工程造價，指經直轄市、縣（市）主管建築機關核發建造執照載明之工程造價。", "note": "公共基金依「工程造價」提列，造價看建造執照上載明的工程造價。", "full": "【公寓大廈管理條例施行細則 第5條】\n本條例第十八條第一項第一款所定按工程造價一定比例或金額提列公共基金，依下列標準計算之：\n前項工程造價，指經直轄市、縣（市）主管建築機關核發建造執照載明之工程造價。", "opts": ["不是實際承攬價", "不是房屋總銷售金額", "", "不是扣土地價金"]}, "8-2-02": {"law": "【公寓大廈管理條例 第18條】\n公寓大廈應設置公共基金，其來源如下：\n二、區分所有權人依區分所有權人會議決議繳納。", "note": "公共基金依「區分所有權人會議決議」繳納。", "opts": ["", "住戶大會不是法定名稱", "不是管委會決議", "不是管理負責人訂定"]}, "8-2-03": {"law": "【建築物昇降設備設置及檢查管理辦法 第3條】\n申請竣工檢查時，應檢附昇降設備組件耐用基準參考表。", "note": "電梯組件的耐用年限，由昇降設備專業廠商訂。", "full": "【建築物昇降設備設置及檢查管理辦法 第3條】\n申請竣工檢查時，應檢附昇降設備組件耐用基準參考表。\n\n（這題屬建築物設備維護實務教材，沒有對應的法條原文）", "opts": ["不是起造人", "不是承造人", "不是區權會", ""]}, "8-2-04": {"law": "【公寓大廈管理條例 第16條】\n住戶為維護、修繕、裝修或其他類似之工作時，未經申請主管建築機關核准，不得破壞或變更建築物之主要構造。", "note": "一樓店鋪不能任意敲掉結構柱，要申請核准，否則危及公共安全。", "full": "【公寓大廈管理條例 第16條】\n住戶不得任意棄置垃圾、排放各種污染物、惡臭物質或發生喧囂、振動及其他與此相類之行為。\n住戶為維護、修繕、裝修或其他類似之工作時，未經申請主管建築機關核准，不得破壞或變更建築物之主要構造。", "opts": ["不看規約，結構都不能敲", "專有部分也不能敲", "不能排除他人干涉", ""]}, "8-2-05": {"law": "（這題屬建築物設備維護實務教材，沒有對應的法條原文）", "note": "一戶任一樓層分隔成6個以上使用單元，或10個以上床位，就當作「宿舍」。", "flag": "依據是建築物使用類組及變更使用辦法，我沒有抓到對應條文原文，內容依題庫。", "opts": ["不是旅館", "不是不變", "不是辦公室", ""]}, "8-2-06": {"law": "【公寓大廈管理條例 第56條】\n前項規約草約經承受人簽署同意後，於區分所有權人會議訂定規約前，視為規約。", "note": "規約草約由起造人申請建照時附上，承受人簽同意後，在區權會訂規約前視為規約。", "full": "【公寓大廈管理條例 第56條】\n公寓大廈之起造人於申請建造執照時，應檢附專有部分、共用部分、約定專用部分、約定共用部分標示之詳細圖說及規約草約。於設計變更時亦同。\n前項規約草約經承受人簽署同意後，於區分所有權人會議訂定規約前，視為規約。", "opts": ["", "不是中央訂", "不是無法訂定", "不是管理服務人訂"]}, "8-2-07": {"law": "（這題屬建築物設備維護實務教材，沒有對應的法條原文）", "note": "舊公寓增設電梯不計入面積，條件之一：100年2月27日以前領得使用執照。", "flag": "這題依據的是內政部老舊公寓增設電梯的規定，我沒有抓到原文，內容依題庫。", "opts": ["107年太晚", "105年太晚", "104年太晚", ""]}, "8-2-08": {"law": "（這題屬建築物設備維護實務教材，沒有對應的法條原文）", "note": "屋頂太陽能熱水系統，高度2公尺以下免申請雜項執照。", "flag": "這題依據的是內政部的免辦雜項執照規定，我沒有抓到原文，內容依題庫。", "opts": ["10公尺太高", "6公尺太高", "3公尺太高", ""]}, "8-2-09": {"law": "【建築法 第97-3條】\n前二項招牌廣告及樹立廣告之一定規模、申請審查許可程序、施工及使用等事項之管理辦法，由中央主管建築機關定之。", "note": "招牌廣告許可有效期限5年，到了要重新申請或恢復原狀。", "full": "【建築法 第97-3條】\n招牌廣告及樹立廣告之設置，應向直轄市、縣（市）主管建築機關申請審查許可，直轄市、縣（市）主管建築機關得委託相關專業團體審查，其審查費用由申請人負擔。\n前二項招牌廣告及樹立廣告之一定規模、申請審查許可程序、施工及使用等事項之管理辦法，由中央主管建築機關定之。\n\n（這題屬建築物設備維護實務教材，沒有對應的法條原文）", "flag": "這題依據的是招牌廣告及樹立廣告管理辦法，我沒有抓到原文，內容依題庫。", "opts": ["不是1年", "不是3年", "", "不是10年"]}, "8-2-10": {"law": "【公寓大廈管理條例 第33條】\n區分所有權人會議之決議，未經依下列各款事項辦理者，不生效力：\n二、公寓大廈外牆面、樓頂平臺，設置廣告物、無線電台基地台等類似強波發射設備或其他類似之行為，設置於屋頂者，應經頂層區分所有權人同意；設置其他樓層者，應經該樓層區分所有權人同意。該層住戶，並得參加區分所有權人會議陳述意見。", "note": "屋頂平台掛廣告，要經「頂層區分所有權人」同意。", "opts": ["管委會同意不夠", "是區分所有權人，不是住戶", "", "承租人不是"]}, "8-2-11": {"law": "【建築技術規則建築設備編 第14條】\n四、應在明顯處所附有永久之標示，註明廣告燈製造廠名稱、電源電壓及輸入電流，以備日後檢查之用。", "note": "招牌廣告燈要附永久標示（廠名、電壓、電流），是為了日後檢查。", "opts": ["", "不是驗收計價", "不是環保檢查", "不是消防檢查"]}, "8-2-12": {"law": "【建築技術規則建築設計施工編 第32條】\n天花板之淨高度應依左列規定：\n二、其他居室及浴廁不得小於二．一公尺，但高低不同之天花板高度至少應有一半以上大於二．一公尺，其最低處不得小於一．七公尺。", "note": "浴廁天花板淨高不得小於2.1公尺。", "opts": ["3公尺太高", "2.5公尺太高", "", "1.6公尺太矮"]}, "8-3-01": {"law": "（這題屬建築物設備維護實務教材，沒有對應的法條原文）", "note": "防火間隔（防火巷弄）是為了阻隔火災延燒。", "opts": ["", "不是為了採光通風", "不是為了停車", "不是為了綠覆率"]}, "8-3-02": {"law": "【公寓大廈管理條例 第7條】\n公寓大廈共用部分不得獨立使用供做專有部分。其為下列各款者，並…\n二、連通數個專有部分之走廊或樓梯，及其通往室外之通路或門廳；社區內各巷道、防火巷弄。", "note": "防火巷弄不能約定專用，不能給一樓住戶獨占。", "full": "【公寓大廈管理條例 第7條】\n公寓大廈共用部分不得獨立使用供做專有部分。其為下列各款者，並不得為約定專用部分：\n二、連通數個專有部分之走廊或樓梯，及其通往室外之通路或門廳；社區內各巷道、防火巷弄。", "opts": ["不得約定專用", "", "區權會同意也不行", "規約約定也不行"]}, "8-3-03": {"law": "（這題屬建築物設備維護實務教材，沒有對應的法條原文）", "note": "火災和地震都不能搭電梯，可能停電受困，要走安全梯。", "opts": ["", "不可以搭電梯", "緊急用昇降機也不能", "行動不便電梯也不能"]}, "8-3-04": {"law": "（這題屬建築物設備維護實務教材，沒有對應的法條原文）", "note": "緊急發電機不能自動啟動，先檢查開關是不是撥在「手動」而不是「自動」。", "opts": ["ATS是切換單元", "機油是啟動後", "", "冷卻水是啟動後"]}, "8-3-05": {"law": "（這題屬建築物設備維護實務教材，沒有對應的法條原文）", "note": "不銹鋼水龍頭用牙膏擦就會亮。粗糙菜瓜布會刮傷。", "opts": ["沐浴乳效果差", "粗糙菜瓜布會刮傷", "", "針車油會髒"]}, "8-3-06": {"law": "（這題屬建築物設備維護實務教材，沒有對應的法條原文）", "note": "陶瓷馬桶不能沖滾燙熱水，熱脹冷縮會裂。", "opts": ["", "刷子可以", "海綿可以", "中性清潔劑可以"]}, "8-3-07": {"law": "（這題屬建築物設備維護實務教材，沒有對應的法條原文）", "note": "檢查瓦斯漏氣：塗肥皂水，冒泡就是漏。不能用打火機或火柴。", "opts": ["打火機會引爆", "火柴會引爆", "水溫變化不是漏氣檢查", ""]}, "8-3-08": {"law": "（這題屬建築物設備維護實務教材，沒有對應的法條原文）", "note": "浴室電熱水器裝漏電斷路器，是為了防止感電。", "opts": ["不是節能", "", "不是防竊電", "不是恆溫"]}, "8-3-09": {"law": "（這題屬建築物設備維護實務教材，沒有對應的法條原文）", "note": "插座較長的孔是中性極，較短的是火線極。", "opts": ["", "沒有長邊極", "較短的是火線極", "沒有導電極"]}, "8-3-10": {"law": "（這題屬建築物設備維護實務教材，沒有對應的法條原文）", "note": "插座接地極是為了用電安全，漏電時把電導入大地。", "opts": ["", "不是用電平衡", "不是防相序錯亂", "不是防竊電"]}, "8-3-11": {"law": "（這題屬建築物設備維護實務教材，沒有對應的法條原文）", "note": "疑似瓦斯漏氣：開窗通風。不要開關電器、不要點火。", "opts": ["開燈會有火花", "電風扇會有火花", "打火機會引爆", ""]}, "8-3-12": {"law": "（這題屬建築物設備維護實務教材，沒有對應的法條原文）", "note": "瓦斯爐火焰頂端出現淡黃色，表示燃燒不完全，可能有一氧化碳。", "opts": ["內焰淡青色是正常", "外焰藍紫色是正常", "", "頂端藍紫色是正常"]}, "8-3-13": {"law": "【建築技術規則建築設備編 第80條】\n二、設置燃氣器具之室內裝修材料，應達耐燃二級以上。", "note": "燃氣器具室內裝修材料，要耐燃2級以上。", "opts": ["4級太低", "3級太低", "", "有規定"]}, "8-3-14": {"law": "（這題屬建築物設備維護實務教材，沒有對應的法條原文）", "note": "裝修用防火材料，是為了減少「可燃物」。"
