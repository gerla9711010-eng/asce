因企業經營者之過失所致之損害，消費者得請求損害額2倍以下之懲罰性賠償金"], "a": 2}, {"id": "3-1-64", "c": 3, "s": 1, "n": "64", "p": 73, "q": "消費者保護法有關消費者保護團體之任務，下列何者正確?", "o": ["接受消費者申訴，調解消費爭議", "消費者保護計畫之研擬、修訂及執行成果檢討", "消費者保護方案之審議及其執行之推動、聯繫與考核", "國內外消費者保護趨勢及其與經濟社會建設有關問題之研究"], "a": 0}, {"id": "3-1-65", "c": 3, "s": 1, "n": "65", "p": 73, "q": "關於商品或服務價格之調查、比較、研究、發表，依據消費者保護法規定，係屬下列何者的任務?", "o": ["消費者保護團體", "消費保護官", "直轄市、縣(市)政府", "行政院消費者保護會"], "a": 0}, {"id": "3-1-66", "c": 3, "s": 1, "n": "66", "p": 73, "q": "定期公告消費者保護之執行結果，依據消費者保護法規定，係屬下列何者的任務?", "o": ["行政院", "消費者保護團體", "消費者保護官", "直轄市、縣(市)政府"], "a": 0}, {"id": "3-1-67", "c": 3, "s": 1, "n": "67", "p": 73, "q": "關於消費資訊之諮詢，依據消費者保護法規定，係屬下列何者的任務?", "o": ["消費者保護團體", "消費保護官", "直轄市、縣(市)政府", "行政院消費者保護會"], "a": 0}, {"id": "3-1-68", "c": 3, "s": 1, "n": "68", "p": 73, "q": "關於消費者保護之教育宣導、消費資訊之蒐集及提供，依據消費者保護法規定，係屬下列何者的任務?", "o": ["直轄市、縣(市)政府", "行政院", "消費者保護官", "消費者保護團體"], "a": 1}, {"id": "3-1-69", "c": 3, "s": 1, "n": "69", "p": 74, "q": "消費者保護刊物之編印，依據消費者保護法規定，係屬下列何者的任務?", "o": ["消費者保護團體", "消費保護官", "企業經營者", "各產業公會"], "a": 0}, {"id": "3-1-70", "c": 3, "s": 1, "n": "70", "p": 74, "q": "國內外消費者保護趨勢及其與經濟社會建設有關問題之研究，依據消費者保護法規定，係屬下列何者的任務?", "o": ["直轄市、縣(市)政府", "消費者保護團體", "行政院", "各產業公會"], "a": 2}, {"id": "3-1-71", "c": 3, "s": 1, "n": "71", "p": 74, "q": "有關消費者意見之調查、分析、歸納之任務，依據消費者保護法規定，係屬下列何者的任務?", "o": ["消費者保護團體", "消費者保護官", "各產業公會", "中央目的事業主管機關"], "a": 0}, {"id": "3-1-72", "c": 3, "s": 1, "n": "72", "p": 74, "q": "依據消費者保護法規定，下列何者敘述正確?", "o": ["企業經營者主張其服務於提供時，符合當時科技或專業水準可合理期待之安全性者，應由學術機構負舉證責任", "企業經營者主張其服務於提供時，符合當時科技或專業水準可合理期待之安全性者，應負舉證責任", "企業經營者主張其服務於提供時，符合當時科技或專業水準可合理期待之安全性者，應由目的事業主管機關負舉證責任", "企業經營者主張其服務於提供時，符合當時科技或專業水準可合理期待之安全性者，應由消保官負舉證責任"], "a": 1}, {"id": "3-1-73", "c": 3, "s": 1, "n": "73", "p": 74, "q": "建議政府採取適當之消費者保護立法或行政措施，依據消費者保護法規定，係屬下列何者的任務?", "o": ["消費者保護團體", "行政院", "各產業公會", "中央目的事業主管機關"], "a": 0}, {"id": "3-1-74", "c": 3, "s": 1, "n": "74", "p": 74, "q": "企業經營者提供服務時，商品或服務具有危害消費者生命、身體、健康、財產之可能者，依據消費者保護法規定，應如何處置?", "o": ["應於明顯處為警告標示及緊急處理危險之方法", "應為消費者投保意外險", "應成立消費者保護基金", "應和消費者簽訂意外責任除外切結書"], "a": 0}, {"id": "3-1-75", "c": 3, "s": 1, "n": "75", "p": 75, "q": "依據消費者保護法規定，企業經營者提供服務時，應如何確保該商品或服務?", "o": ["符合當時科技或專業水準可合理期待之安全性", "符合大眾客觀通常認定之安全性", "符合當時科技或專業水準可期待之價值感", "符合國內外最新科技標準之品質保證"], "a": 0}, {"id": "4-1-01", "c": 4, "s": 1, "n": "01", "p": 76, "q": "依據公寓大廈管理條例之規定，專有部分是指公寓大廈之一部分為區分所有之標的，且具有何種功能之獨立性？", "o": ["管理上之獨立性", "維護上之獨立性", "使用上之獨立性", "外觀上之獨立性"], "a": 2}, {"id": "4-1-02", "c": 4, "s": 1, "n": "02", "p": 76, "q": "依據公寓大廈管理條例對「住戶」之定義，包括下列何者？", "o": ["區分所有權人、承租人及取得停車空間建築物之所有權人", "經區分所有權人同意執行租賃事務之承辦人", "無合法占有權之占有人", "取得停車空間建築物之承租人"], "a": 0}, {"id": "4-1-03", "c": 4, "s": 1, "n": "03", "p": 76, "q": "公寓大廈之住戶基於維護及修繕專有部分及約定專用部分，必須進入使用共用部分，下列敘述何者正確?", "o": ["得經管理服務人同意後進入使用", "得經專業技師鑑定同意後進入使用", "得經由維護修繕負責人認定後進入使用", "得經管理負責人或管委會同意後進入使用"], "a": 3}, {"id": "4-1-04", "c": 4, "s": 1, "n": "04", "p": 76, "q": "包租公司基於經營之需要，預計在公寓大廈社區之外牆設置廣告招牌，除應依法令規定辦理之外，下列敘述何者正確?", "o": ["應依該社區規約或區分所有權人會議決議及向縣市政府主管機關完成報備後辦理", "應向社區管委會主委報備後辦理", "應向社區管委會完成報備後辦理", "應向社區管委會或管理負責人完成報備後辦理"], "a": 0}, {"id": "4-1-05", "c": 4, "s": 1, "n": "05", "p": 76, "q": "依據公寓大廈管理條例之規定，該公寓大廈設專有部分之共同壁及樓地板或其內之管線，進行維修之費用應如何負擔?", "o": ["由管委會協議後認定", "由共同壁雙方或樓地板上下方之區分所有權人負擔", "由需要維修之住戶負擔", "由社區公共基金支付"], "a": 1}, {"id": "4-1-06", "c": 4, "s": 1, "n": "06", "p": 77, "q": "包租公司承租一樓店面且出租營業，依據公寓大廈管理條例之規定，於公寓大廈內依法經營何種行業，應投保公共意外責任保險?", "o": ["寢具生活用品業", "鐘錶眼鏡業", "服飾生活用品業", "日式料理餐飲業"], "a": 3}, {"id": "4-1-07", "c": 4, "s": 1, "n": "07", "p": 77, "q": "依據公寓大廈管理條例之規定，公寓大廈社區之區分所有權人請求召開臨時會議，應符合何種要求?", "o": ["全體區分所有權人之請求", "區分所有權人1/5以上之請求", "區分所有權人提出請求及理由後召開", "區分所有權人依據必要性請求召開"], "a": 1}, {"id": "4-1-08", "c": 4, "s": 1, "n": "08", "p": 77, "q": "依據公寓大廈管理條例之規定，區分所有權人因故無法出席區分所有權人會議時，得以書面委託代理人出席，下列何者不符合代理人資格?", "o": ["配偶", "代管業者", "承租人", "包租業"], "a": 1}, {"id": "4-1-09", "c": 4, "s": 1, "n": "09", "p": 77, "q": "依據公寓大廈管理條例之規定，區分所有權人會議之決議方式，除規約另有規定外，原則上應有出席人數多少比例以上及其區分所有權比例占出席人數區分所有權多少比例以上同意行之?", "o": ["2/3，2/3", "3/4，3/4", "2/3，3/4", "3/4，2/3"], "a": 2}, {"id": "4-1-10", "c": 4, "s": 1, "n": "10", "p": 77, "q": "依據公寓大廈管理條例之規定，社區管理委員會主任委員之選任，下列敘述何者正確?", "o": ["任期一任3年", "任期兩年", "連選得繼續連任", "連選得連任1次"], "a": 3}, {"id": "4-1-11", "c": 4, "s": 1, "n": "11", "p": 77, "q": "包租公司欲在公寓大廈社區之樓頂平台，設置廣告物，除應依法令規定辦理外，尚應受何種限制?", "o": ["經頂層區分所有權人同意", "經頂層住戶同意", "經社區管委會同意", "經社區管理負責人同意"], "a": 0}, {"id": "4-1-12", "c": 4, "s": 1, "n": "12", "p": 78, "q": "包租公司欲在公寓大廈社區第三樓層外牆面設置廣告招牌，除應依法令規定辦理外，尚應受何種限制?", "o": ["經該樓層區分所有權人同意", "經該樓層住戶同意", "經社區管委會同意", "經社區管理負責人同意"], "a": 0}, {"id": "4-1-13", "c": 4, "s": 1, "n": "13", "p": 78, "q": "公寓大廈社區召開區分所有權人會議，應作成會議紀錄，載明開會經過及決議事項，由誰簽名後，於會後幾日內送達各區分所有權人並公告之?", "o": ["主委簽名，20日內", "主席簽名，20日內", "主委簽名，15日內", "主席簽名，15日內"], "a": 3}, {"id": "4-1-14", "c": 4, "s": 1, "n": "14", "p": 78, "q": "依據公寓大廈管理條例之規定，管理委員會之職務，下列何者正確?", "o": ["約定私有部分之維修維護", "住戶共同事務應興革事項之權利", "共有及共用部分之經營及增加收益", "管理服務人之委任、僱傭及監督"], "a": 3}, {"id": "4-1-15", "c": 4, "s": 1, "n": "15", "p": 78, "q": "依據公寓大廈管理條例之規定，社區管理委員會應向何者負責，並向其報告會務?", "o": ["管委會主委", "縣市主管機關及管委會", "區分所有權人會議及管委會", "區分所有權人會議"], "a": 3}, {"id": "4-1-16", "c": 4, "s": 1, "n": "16", "p": 78, "q": "依據公寓大廈管理條例之規定，公寓大廈管理維護公司應依規定執行業務，下列何者正確？", "o": ["聘僱一定人數領有地方主管機關核發認可之繼續性從業之管理服務人員", "對管理服務人員，負監督考核處份之責", "指派管理服務人員積極參與包租及代管事務", "應依業務執行規範執行業務"], "a": 3}, {"id": "4-1-17", "c": 4, "s": 1, "n": "17", "p": 78, "q": "受僱於公寓大廈管理維護公司之管理服務人員，應依規定執行業務，下列何者正確?", "o": ["得將管理服務人員認可證提供他人使用", "得同時受聘於二家以上管理維護公司", "應參加中央主管機關舉辦或委託相關機構團體舉辦之訓練", "應依核准業務類別之外，增加包租業務或代管業務"], "a": 2}, {"id": "4-1-18", "c": 4, "s": 1, "n": "18", "p": 79, "q": "區分所有權人或住戶違反公寓大廈管理條例第6條規定之住戶應遵守事項，主管機關受理住戶、管理負責人或管委會之請求，經通知限期改善，屆期不改善者，縣市主管機關得處多少罰鍰?", "o": ["1000元~5000元", "1500元~3000元", "1500元~10000元", "3000元~15000元"], "a": 3}, {"id": "4-1-19", "c": 4, "s": 1, "n": "19", "p": 79, "q": "公寓大廈社區一樓住戶，基於增加營業使用面積，違反公寓大廈管理條例第16條規定，自行私設路障妨礙出入，主管機關得令其限期改善，屆期不改善者，縣市主管機關得處多少罰鍰?", "o": ["3萬元~30萬元", "4萬元~20萬元", "20萬元~50萬元", "50萬元~250萬元"], "a": 1}, {"id": "4-1-20", "c": 4, "s": 1, "n": "20", "p": 79, "q": "公寓大廈社區住戶於防火巷弄、樓梯間及共同走廊等處所堆置雜物且有營業使用事實，妨礙逃生，因而致人重傷者，得處多久有期徒刑?", "o": ["3個月以上6年以下", "6個月以上5年以下", "1年以上5年以下", "1年以上7年以下"], "a": 1}, {"id": "4-1-21", "c": 4, "s": 1, "n": "21", "p": 79, "q": "某甲的公寓大廈住宅中有12歲以下兒童及65歲以上老人，他自行在外牆開口或陽台加設防墜設施，下列敘述何者正確?", "o": ["管委會應予勸導及制止", "管理負責人應予勸導及制止", "住戶的設置理由合乎規定", "依據社區規約規範"], "a": 2}, {"id": "4-1-22", "c": 4, "s": 1, "n": "22", "p": 79, "q": "公寓大廈管理出現爭議事件時，直轄市、縣(市)政府得組設公寓大廈爭議事件調處委員會，得聘請相關組成人員為何?", "o": ["中央民意代表及社區發展協會主席", "建築師及熱心人士", "公寓大廈管理公司主管。", "資深專家、學者、建築師、律師、公寓大廈及建築管理主管人員"], "a": 3}, {"id": "4-1-23", "c": 4, "s": 1, "n": "23", "p": 80, "q": "透天型住宅社區中有多數各自獨立使用之建築物，也有共同使用之設施(例如車道、中庭花園或保全室)，在使用管理及組織管委會的規範，下列何者正確?", "o": ["準用公寓大廈管理條例之規定", "準用公寓大廈社區規約之規定", "未在公寓大廈管理條例中規範", "準用區分所有權人會議之規範"], "a": 0}, {"id": "4-1-24", "c": 4, "s": 1, "n": "24", "p": 80, "q": "依據公寓大廈管理條例施行細則，區分所有權人人數之計算，若數人共有一專有部分者，以多少人計?", "o": ["每一專有部分以1人計", "以1人計", "以實際共有人數計", "按登記人數計"], "a": 1}, {"id": "4-1-25", "c": 4, "s": 1, "n": "25", "p": 80, "q": "公寓大廈不得約定專用之共用部分，包括公寓大廈本身所占之地面，其意涵指建築物外牆中心線或其代替中心線以內之?", "o": ["最大水平範圍", "水平投影範圍", "最大水平投影範圍", "最大水平投影容許範圍"], "a": 2}, {"id": "4-1-26", "c": 4, "s": 1, "n": "26", "p": 80, "q": "承租人向房東承租公寓大廈社區1、2樓店面及住宅，基於擴增室內空間感而拆除分間牆，管理負責人得促請其在幾個月內改善?", "o": ["3個月", "3.5個月", "4個月", "5個月"], "a": 0}, {"id": "4-1-27", "c": 4, "s": 1, "n": "27", "p": 80, "q": "依據公寓大廈管理條例，當社區之區分所有權人出現推諉或消極以對，以致無法成立管理委員會及推選管理負責人並辦理報備，則主管機關的規範，下列何者正確?", "o": ["按每一約定專有部分處區分所有權人新臺幣4-20萬元罰鍰", "按每一專有部分處區分所有權人新臺幣4-20萬元罰鍰", "按每一住戶處分新臺幣4-20萬元罰鍰", "按每一期住戶處分使用權人新臺幣4-20萬元罰鍰"], "a": 1}, {"id": "4-2-01", "c": 4, "s": 2, "n": "01", "p": 81, "q": "政府為改善居民生活環境，並促進市、鎮、鄉街有計畫之均衡發展，特制定何種法律?", "o": ["公寓大廈管理條例", "租賃住宅市場發展及管理條例", "都市計畫法", "非都市土地使用管制規則"], "a": 2}, {"id": "4-2-02", "c": 4, "s": 2, "n": "02", "p": 81, "q": "關於都市計畫法之立法宗旨，下列何者正確?", "o": ["改善都市居民之不動產交易秩序", "促進都市產業結構升級", "促進市鎮鄉街有計畫之均衡發展", "促進市鎮鄉街之繁榮發展"], "a": 2}, {"id": "4-2-03", "c": 4, "s": 2, "n": "03", "p": 81, "q": "市鎮計畫應先擬定主要計畫書及主要計畫圖，作為擬定何種計畫之準則?", "o": ["市(鎮)計畫", "鄉街計畫", "特定區計畫", "細部計畫"], "a": 3}, {"id": "4-2-04", "c": 4, "s": 2, "n": "04", "p": 81, "q": "依據都市計畫法規定所舉辦之公共設施、新市區建設、舊市區更新等實質建設之事業，稱之何種事業?", "o": ["都市創新事業", "都市計畫事業", "都市發展事業", "新市區建設事業。"], "a": 1}, {"id": "4-2-05", "c": 4, "s": 2, "n": "05", "p": 81, "q": "依據都市計畫法規定，都市計畫分為下列哪三種?", "o": ["市鎮計畫、鄉街計畫、特定事業計畫", "市鎮計畫、鄉街計畫、特定區計畫", "市鎮計畫、鄉街計畫、更新區計畫", "市鎮計畫、鄉街計畫、新市區計畫"], "a": 1}, {"id": "4-2-06", "c": 4, "s": 2, "n": "06", "p": 81, "q": "依據都市計畫法規定，應擬定市(鎮)計畫，包括下列何者?", "o": ["鄉街及社區", "優先更新地區", "縣政府所在地", "鄉公所所在地"], "a": 2}, {"id": "4-2-07", "c": 4, "s": 2, "n": "07", "p": 82, "q": "依據都市計畫法規定，市鎮計畫應先擬定主要計畫，就下列事項分別表明，下列何者正確?", "o": ["當地工商發展環境分析", "行政區域及周邊計畫地區範圍", "人口之成長、分布及組成之推計", "未來將變更土地使用地區及區位配置"], "a": 2}, {"id": "4-2-08", "c": 4, "s": 2, "n": "08", "p": 82, "q": "依據都市計畫法規定，細部計畫應以細部計畫書圖就下列事項表明，包括下列何者?", "o": ["計畫地區產業結構", "居住密度及潛在移居人口", "重大專案開發", "土地使用分區管制"], "a": 3}, {"id": "4-2-09", "c": 4, "s": 2, "n": "09", "p": 82, "q": "依據都市計畫法規定，都市計畫經發布實施後，不得隨時任意變更。但擬定計畫之機關每多少年內至少應通盤檢討一次?", "o": ["2年內", "2~3年內", "3年內或5年內", "依據人民建議"], "a": 2}, {"id": "4-2-10", "c": 4, "s": 2, "n": "10", "p": 82, "q": "都市計畫經發布實施後，遇有特殊情事，地方政府應視實際情況迅行變更，但不包括下列何者?", "o": ["因地震遭受損壞時", "因水災風災遭受損壞時", "因火災遭受損壞時", "因跨國公司直接投資設廠時"], "a": 3}, {"id": "4-2-11", "c": 4, "s": 2, "n": "11", "p": 82, "q": "依據都市計畫法規定，為保護居住環境，土地及建築物之使用，不得有礙居住之寧靜、安全及衛生，應劃定何種使用區?", "o": ["保護區", "農業區", "住宅區", "文教區"], "a": 2}, {"id": "4-2-12", "c": 4, "s": 2, "n": "12", "p": 82, "q": "依據都市計畫法規定，都市計畫應依據現在及既往情況，並預計幾年內之發展情形訂定之?", "o": ["15年", "20年", "25年", "30年"], "a": 2}, {"id": "4-2-13", "c": 4, "s": 2, "n": "13", "p": 83, "q": "依據都市計畫法規定，優先發展區係指係指預計在多少年內必須優先規劃建設發展之都市計畫地區?", "o": ["3年", "5年", "10年", "15年"], "a": 2}, {"id": "4-2-14", "c": 4, "s": 2, "n": "14", "p": 83, "q": "都市計畫地區範圍內，應視實際情況設置公共設施用地，下列何者不屬於公共設施用地項目?", "o": ["學校", "社會住宅", "社教機構", "社會福利設施"], "a": 1}, {"id": "4-2-15", "c": 4, "s": 2, "n": "15", "p": 83, "q": "都市計畫地區範圍內，應視實際情況設置公共設施用地，下列何者不屬於公共設施用地項目?", "o": ["購物中心", "公園", "綠地", "兒童遊樂場"], "a": 0}, {"id": "4-2-16", "c": 4, "s": 2, "n": "16", "p": 83, "q": "依據都市計畫法規定，有關都市更新之處理方式，下列何者正確?", "o": ["重建、整建、修護", "重建、整建、維護", "重建、增建、維護", "重建、修建、維護"], "a": 1}, {"id": "4-2-17", "c": 4, "s": 2, "n": "17", "p": 83, "q": "依據都市計畫法規定，鄉鎮縣轄市公所取得公共設施保留地之方式，下列何者正確?", "o": ["協議價購", "公私部門聯合開發", "市地重劃", "都市更新"], "a": 2}, {"id": "4-2-18", "c": 4, "s": 2, "n": "18", "p": 83, "q": "依據都市計畫法規定，鄉鎮縣轄市公所為審議及研究都市計畫，應分別設置何種委員會辦理?", "o": ["都市發展委員會", "都市計畫委員會", "區域發展委員會", "區域計畫委員會"], "a": 1}, {"id": "4-2-19", "c": 4, "s": 2, "n": "19", "p": 84, "q": "在都市計畫範圍之農業區，違法採取土石及變更地形，地方政府可對何者處以罰鍰?", "o": ["周邊土地所有權人", "設備租用人", "企業管理人", "土地、建物所有權人、使用人及管理人"], "a": 3}, {"id": "4-2-20", "c": 4, "s": 2, "n": "20", "p": 84, "q": "在都市計畫範圍之農業區，違法任意傾倒營建廢棄物，地方政府可對土地所有權人，處以多少罰鍰?", "o": ["2萬以上10萬以下", "3萬以上10萬以下", "6萬以上30萬以下", "6萬以上50萬以下"], "a": 2}, {"id": "4-2-21", "c": 4, "s": 2, "n": "21", "p": 84, "q": "依據非都市土地使用管制規則，非都市土地得依使用性質劃定之土地使用分區，下列何者正確?", "o": ["城鄉發展區", "工商綜合區", "風景區、國家公園區", "國土保安區、特定事業區"], "a": 2}, {"id": "4-2-22", "c": 4, "s": 2, "n": "22", "p": 84, "q": "依據非都市土地使用管制規則，非都市土地得依其使用分區之性質編定用地類別，下列何者正確?", "o": ["觀光工廠用地", "光電廠用地", "遊憩、古蹟保存用地", "國家公園用地"], "a": 2}, {"id": "4-2-23", "c": 4, "s": 2, "n": "23", "p": 84, "q": "依據非都市土地使用管制規則，丙種建築用地之建蔽率及容積率，分別為何?", "o": ["40％；120％", "40％；240％", "60％；120％", "60％；240％"], "a": 0}, {"id": "4-2-24", "c": 4, "s": 2, "n": "24", "p": 84, "q": "辦理非都市土地變更編定時，申請人應擬具興辦事業計畫，計畫範圍內有夾雜第一級環境敏感地區之零星土地，下列何種情況不得納入申請範圍?", "o": ["基於整體開發規劃之需要", "夾雜地同意變更編定為國土保安用地", "面積已超過基地開發面積之10%。", "夾雜地維持原使用分區及原使用地類別"], "a": 2}, {"id": "4-2-25", "c": 4, "s": 2, "n": "25", "p": 85, "q": "辦理非都市土地變更編定時，申請人應擬具興辦事業計畫，計畫範圍內有夾雜第1級環境敏感地區之零星土地，其面積未超基地開發面積之多少始得納入申請範圍?", "o": ["20%", "15%", "10%", "12%"], "a": 2}, {"id": "4-3-01", "c": 4, "s": 3, "n": "01", "p": 86, "q": "公寓大廈社區，若要將共用部分及約定共用部分劃設機車停車位，供住戶之機車停放，其相關管理規範應依何種規範?", "o": ["依區分所有權人會議決議", "依起造人之買賣契約", "依起造人之買賣契約及分管契約", "依管委會決議"], "a": 0}, {"id": "4-3-02", "c": 4, "s": 3, "n": "02", "p": 86, "q": "依據內政部之公寓大廈社區規約範本，下列何者事項應經由區分所有權人會議決議為之?", "o": ["公寓大廈之門禁安全維護", "公寓大廈之重大修繕或改良", "公寓大廈之機電設備維護", "公寓大廈之安寧整潔"], "a": 1}, {"id": "4-3-03", "c": 4, "s": 3, "n": "03", "p": 86, "q": "依據內政部之公寓大廈社區規約範本，若約定專用或約定共用事項的使用變更，應有何種規範?", "o": ["依管理負責人之意見", "依該區分所有權人之意見", "依區分所有權人會議決議", "依管委會決議"], "a": 2}, {"id": "4-3-04", "c": 4, "s": 3, "n": "04", "p": 86, "q": "依據內政部之公寓大廈社區規約範本，社區管委會組成人數，最多為幾人?", "o": ["15人", "19人", "21人", "22人"], "a": 2}, {"id": "4-3-05", "c": 4, "s": 3, "n": "05", "p": 86, "q": "依據內政部之公寓大廈社區規約範本，有關規約、區分所有權人會議記錄、管理委員會會議紀錄、簽名簿、代理出席之委託書等文件，應由何人負責保管?", "o": ["管理負責人", "管理維護公司", "管理委員會", "管委會主委"], "a": 2}, {"id": "4-3-06", "c": 4, "s": 3, "n": "06", "p": 87, "q": "依據內政部之公寓大廈社區規約範本，有關該社區使用執照謄本、竣工圖說、水電消防機械設施之管線圖說等文件，應由何人負責保管?", "o": ["管理負責人", "管理維護公司", "管理委員會", "管委會主委"], "a": 2}, {"id": "4-3-07", "c": 4, "s": 3, "n": "07", "p": 87, "q": "依據內政部之公寓大廈社區規約範本，公寓大廈共用部分不得獨立使用且供做專有部分。其中不得為約定專用部分，下列何者有錯？", "o": ["公寓大廈本身所占之地面", "連通數個專有部分之走廊", "通往室外之通路或門廳", "社區周邊之巷道或防火巷弄"], "a": 3}, {"id": "4-3-08", "c": 4, "s": 3, "n": "08", "p": 87, "q": "依據公寓大廈條例規定，公寓大廈之起造人於申請建造執照時檢附之規約草約，於區分所有權人會議訂定規約前，前項規約草約之效力為何?", "o": ["視為規約", "僅供參考", "經承受人簽署同意後視為規約", "核發執照時視為規約"], "a": 2}, {"id": "4-4-01", "c": 4, "s": 4, "n": "01", "p": 88, "q": "下列何者非公寓大廈行政管理實務，行政事務職能？", "o": ["住戶創意發想", "集體意思表達", "事實記錄", "訊息傳遞與文件整備"], "a": 0}, {"id": "4-4-02", "c": 4, "s": 4, "n": "02", "p": 88, "q": "為發揮公寓大廈行政事務的功能，下列何種作業順序較為妥適？", "o": ["應用技巧、執行方法、處理程序、觀念認知", "觀念認知、處理程序、執行方法、應用技巧", "處理程序、執行方法、觀念認知、應用技巧", "觀念認知、處理程序、應用技巧、執行方法"], "a": 1}, {"id": "4-4-03", "c": 4, "s": 4, "n": "03", "p": 88, "q": "會議紀錄、違規存證、財務報表等係屬於公寓大廈管理實務，行政事務的哪種功能？", "o": ["文件整備", "意思表達", "事實記錄", "訊息傳遞"], "a": 2}, {"id": "4-4-04", "c": 4, "s": 4, "n": "04", "p": 88, "q": "租賃管理人員研擬公共住宅管理辦法時，依中央法規標準法規定，法規條文應分條書寫，並於條次下，得再依序細分為哪些項目？", "o": ["項、款、目", "款、項、目", "目、款、項", "目、項、款"], "a": 0}, {"id": "4-4-05", "c": 4, "s": 4, "n": "05", "p": 88, "q": "下列何者，非為區分所有權人名冊應包含之欄位？", "o": ["身分證字號", "姓名或名稱", "通訊地址", "專有部分面積"], "a": 0}, {"id": "4-4-06", "c": 4, "s": 4, "n": "06", "p": 88, "q": "公寓大廈行政管理實務，對於「催告」的要件，下列何者正確？", "o": ["以簡訊為之", "以口頭為之", "以書面為之", "以通訊軟體為之"], "a": 2}, {"id": "4-4-07", "c": 4, "s": 4, "n": "07", "p": 89, "q": "下列何者，非屬公寓大廈行政管理實務，對於文件保管方式？", "o": ["裝訂", "分置", "存放", "閱覽"], "a": 3}, {"id": "4-4-08", "c": 4, "s": 4, "n": "08", "p": 89, "q": "某社區使用執照編訂100戶門牌，甲先生自有25戶所有權，又接受丁小姐所有之25戶委託書，出席區分所有權人會議，如此關於表決權人數計算方式，下列何者正確？", "o": ["甲先生的表決權為40戶，區權會總表決人數(分母)為90戶。", "甲先生的表決權為40戶，區權會總表決人數(分母)為100戶。", "甲先生的表決權為50戶，區權會總表決人數(分母)為90戶。", "甲先生的表決權為50戶，區權會總表決人數(分母)為100戶。"], "a": 0}, {"id": "4-4-09", "c": 4, "s": 4, "n": "09", "p": 89, "q": "下列何者，非為公共住宅社區規約所應規定事項？", "o": ["禁止住戶飼養動物之特別規定", "違反義務之處理方式", "財務運作之監督規定", "承租戶職業和性別"], "a": 3}, {"id": "4-4-10", "c": 4, "s": 4, "n": "10", "p": 89, "q": "下列何者，雖載明於公共住宅社區規約，然亦不生效力之事項？", "o": ["違反義務之處理方式", "約定專用有違法令使用限制之規定者", "財務運作之監督規定", "禁止住戶飼養動物之特別規定"], "a": 1}, {"id": "4-4-11", "c": 4, "s": 4, "n": "11", "p": 89, "q": "公寓大廈行政管理實務，文件保管的分類計有10類，其中合約書是屬於哪一類？", "o": ["文書類", "規約類", "業務類", "設備類。"], "a": 2}, {"id": "4-4-12", "c": 4, "s": 4, "n": "12", "p": 89, "q": "公寓大廈行政管理實務，文件保管第9類規約類的規約，其保存年限為何？", "o": ["3年", "5年", "10年", "永久"], "a": 3}, {"id": "4-4-13", "c": 4, "s": 4, "n": "13", "p": 89, "q": "下列何者，非為公寓大廈行政管理實務，常用之管理辦法？", "o": ["裝潢管理辦法", "公共設施使用管理辦法", "財務收支管理辦法", "下水道使用管理收費辦法"], "a": 3}, {"id": "4-4-14", "c": 4, "s": 4, "n": "14", "p": 90, "q": "下列何者，非為公寓大廈行政管理實務，裝潢管理的規範內容？", "o": ["繳交區分所有權人權狀影本", "繳交裝潢施工保證金", "圖測審核", "違建管制"], "a": 0}, {"id": "4-4-15", "c": 4, "s": 4, "n": "15", "p": 90, "q": "下列何者，非為社區管理委員會會議記錄，應包括內容？", "o": ["開會時間", "列席人員之介紹", "出席人員及列席人員名單", "討論事項之經過概要"], "a": 1}, {"id": "4-4-16", "c": 4, "s": 4, "n": "16", "p": 90, "q": "公寓大廈行政管理實務，文件之保存期限，若為應定期限保存者，下列何者非所訂保存年限?", "o": ["10年", "8年", "5年", "3年"], "a": 1}, {"id": "4-4-17", "c": 4, "s": 4, "n": "17", "p": 90, "q": "下列何者，非為公寓大廈行政管理文件擬稿人員應具備的基本能力？", "o": ["文字組織能力", "文書處理能力", "擬稿要點能力", "廣告行銷能力"], "a": 3}, {"id": "4-4-18", "c": 4, "s": 4, "n": "18", "p": 90, "q": "依據公寓大廈管理條例相關規定，區分所有權人會議應作成會議紀錄，載明開會經過及決議事項，並須由何人簽名？", "o": ["主席", "管理委員", "總幹事", "租賃管理人員"], "a": 0}, {"id": "4-4-19", "c": 4, "s": 4, "n": "19", "p": 90, "q": "下列何者非屬公寓大廈行政管理實務，研擬管理辦法草案之主要內容？", "o": ["管理事項主題", "廠商名單", "管理事項的構成項目", "管理作業程序及應用表單"], "a": 1}, {"id": "4-4-20", "c": 4, "s": 4, "n": "20", "p": 91, "q": "下列何者為公寓大廈行政管理實務，郵件處理作業規範中可代收之郵件？", "o": ["掛號信件", "拆封郵件", "兵役通知", "信用卡函"], "a": 0}, {"id": "4-4-21", "c": 4, "s": 4, "n": "21", "p": 91, "q": "依據公寓大廈管理條例相關規定，管理委員會之職務，對於該社區管理服務人之執業規範，下列何者正確？", "o": ["監督", "升職", "進薪", "兼任"], "a": 0}, {"id": "4-4-22", "c": 4, "s": 4, "n": "22", "p": 91, "q": "下列何者，非屬公寓大廈行政管理實務，安全防災管理維護類之規範？", "o": ["安全管理作業流程", "公共設施清潔維護", "安全維護作業流程", "緊急事件處理作業流程"], "a": 1}, {"id": "4-4-23", "c": 4, "s": 4, "n": "23", "p": 91, "q": "下列何者，非屬公寓大廈行政管理實務，保管文件類別之第1類圖冊？", "o": ["建物竣工圖", "水電圖說", "消防安全設備檢修單", "管線圖說"], "a": 2}, {"id": "4-4-24", "c": 4, "s": 4, "n": "24", "p": 91, "q": "下列何者非屬公寓大廈管理條例規定，利害關係人於必要時，得請求閱覽或影印之文件？", "o": ["公共基金餘額", "欠繳公共基金與應分攤或其他應負擔費用情形", "會計帳簿", "管理人員所屬公司員工個資"], "a": 3}, {"id": "4-4-25", "c": 4, "s": 4, "n": "25", "p": 91, "q": "公寓大廈行政管理實務之文件保管方式，下列何者處理方式較為不妥？", "o": ["為方便閱覽及作業暫放桌面", "電子文件應予備份，並定期重製，以防資料遺失", "永久保存與定期保存文件檔案得分置存放", "文件檔案應分類定期裝訂成冊"], "a": 0}, {"id": "4-4-26", "c": 4, "s": 4, "n": "26", "p": 92, "q": "包含姓名或名稱、區分所有單位地址、通訊地址、電話、傳真、專有部分面積、區分所有權比例等欄位之名冊，其名稱為何？", "o": ["區分所有權人名冊", "住戶名冊", "管理委員會名冊", "車位使用人名冊"], "a": 0}, {"id": "4-4-27", "c": 4, "s": 4, "n": "27", "p": 92, "q": "下列何者，非屬室內裝修施工戶裝修施工七日前，所須完成手續？", "o": ["填寫裝潢修工申請書及保證書", "查驗工程責任險保單正本", "繳交裝潢修施工保證金", "繳交裝潢修施工工班名冊"], "a": 3}, {"id": "4-4-28", "c": 4, "s": 4, "n": "28", "p": 92, "q": "下列何者，非為公寓大廈管理條例規定社區管理委員會會議決議內容，不得違反之事項？", "o": ["社區規約", "管理委員會會議", "區分所有權人會議決議", "公寓大廈管理條例"], "a": 1}, {"id": "4-5-01", "c": 4, "s": 5, "n": "01", "p": 93, "q": "朱小姐向房東承租公寓大廈社區住宅，熱心主動擔任管理委員會委員，試問她是否具備合法資格嗎?", "o": ["視社區規約而定", "不具備資格", "視房東與承租人協議", "具備合法資格"], "a": 3}, {"id": "4-5-02", "c": 4, "s": 5, "n": "02", "p": 93, "q": "洪先生等4位大學生，向房東承租公寓大廈社區住宅，其中2人想擔任管理委員會委員，試問他們具備合法資格嗎?", "o": ["視社區規約而定", "取得房東同意書才具備資格", "具備合法資格", "不具備合法資格"], "a": 2}, {"id": "4-5-03", "c": 4, "s": 5, "n": "03", "p": 93, "q": "承租人向房東承租公寓大廈社區3樓住宅，自行經營銷售寵物食品及寵物美容，未依建築物使用執照核准用途使用，何者應給予制止?", "o": ["管理負責人或管理委員會", "社區清潔員", "社區保全員", "視雙方協議而定"], "a": 0}, {"id": "4-5-04", "c": 4, "s": 5, "n": "04", "p": 93, "q": "樓上住戶因維護修繕陽台漏水問題，必須進入樓下承租戶室內勘驗，承租戶是否可拒絕?", "o": ["不得拒絕", "無房東同意則可拒絕", "無管委會同意則可拒絕", "依漏水嚴重性而定"], "a": 0}, {"id": "4-5-05", "c": 4, "s": 5, "n": "05", "p": 93, "q": "承租人向房東承租公寓大廈社區一樓店面住宅，經營3C商品銷售與維修，需要加裝監視設備及用到社區共同弱電管道，須經由何者同意?", "o": ["兩邊住戶同意", "社區管理公司同意", "管理負責人或管理委員會之同意", "弱電系統廠商同意"], "a": 2}, {"id": "4-5-06", "c": 4, "s": 5, "n": "06", "p": 94, "q": "承租人向房東承租公寓大廈社區頂樓住宅，基於居家防竊需要加裝監視設備及用到社區共同弱電管道，須經由何者同意?", "o": ["管理負責人或管理委員會之同意", "社區管理公司同意", "同樓層住戶同意", "弱電系統廠商同意"], "a": 0}, {"id": "4-5-07", "c": 4, "s": 5, "n": "07", "p": 94, "q": "承租人向房東承租公寓大廈社區1樓店面，對於店面騎樓地板墊高美化，此舉的規範，下列敘述何者正確?", "o": ["經房東同意及申請主管建築機關核准就可裝修", "經管委會同意就可裝修", "經房東同意就可裝修", "只要未來能恢復原狀就可裝修"], "a": 0}, {"id": "4-5-08", "c": 4, "s": 5, "n": "08", "p": 94, "q": "承租人向房東承租公寓大廈社區1樓店面，對於店面及樑柱外觀及進行裝修美化，此舉的規範，下列敘述何者正確?", "o": ["經房東同意就可裝修", "經管委會同意就可裝修", "經房東同意及申請主管建築機關核准就可裝修", "只要未破壞或變更建築物之構造就可裝修"], "a": 2}, {"id": "4-5-09", "c": 4, "s": 5, "n": "09", "p": 94, "q": "承租人向房東承租公寓大廈社區1、2樓店面及住宅，預計在2樓裝上LED廣告看板，此舉應受到規範，下列敘述何者正確?", "o": ["應向直轄市、縣（市）主管機關請示", "應符合該公寓大廈規約另有規定或區分所有權人會議已有決議", "應符合公寓大廈管委會之決議", "應符合承租人自由使用收益"], "a": 1}, {"id": "4-5-10", "c": 4, "s": 5, "n": "10", "p": 94, "q": "承租人向房東承租公寓大廈社區住宅，積欠應繳納之管理費用，若超過幾期管理負責人得催告其給付應繳金額?", "o": ["0.5期", "1期", "1.5期", "2期"], "a": 3}, {"id": "5-1-01", "c": 5, "s": 1, "n": "01", "p": 95, "q": "下列有關住宅包租契約應約定及不得約定事項包租業提前終止租約事由的敘述，何者有誤？", "o": ["租賃住宅或附屬設備損壞，應由出租人負擔修繕費用者，經包租業訂相當期限催告，出租人仍不為支付", "租賃住宅因不可歸責於包租業及次承租人之事由致一部滅失，且其存餘部分不能達租賃之目的", "租賃住宅含有氯離子0.01kg/m2", "因第三人就租賃住宅主張其權利，致次承租人不能為約定之居住使用"], "a": 2}, {"id": "5-1-02", "c": 5, "s": 1, "n": "02", "p": 95, "q": "住宅包租契約應約定及不得約定事項之法源為下列何者？", "o": ["消費者保護法", "租賃住宅市場發展及管理條例", "不動產經紀業管理條例", "公平交易法"], "a": 1}, {"id": "5-1-03", "c": 5, "s": 1, "n": "03", "p": 95, "q": "下列何者不是住宅包租契約中的不得約定事項內容？", "o": ["不得約定廣告僅供參考", "不得約定包租業於租屋處不得辦理公司登記", "不得約定應由包租業負擔之稅費，轉嫁由出租人負擔", "不得約定出租人須繳回契約書"], "a": 1}, {"id": "5-1-04", "c": 5, "s": 1, "n": "04", "p": 95, "q": "下列何者非住宅包租契約應約定事項中之租賃住宅標的約定事項？", "o": ["公有部分建號", "共有部分建號", "專有部分建號", "車位"], "a": 0}, {"id": "5-1-05", "c": 5, "s": 1, "n": "05", "p": 95, "q": "下列何者非屬住宅包租契約應約定及不得約定事項租賃住宅標的應約定事項？", "o": ["門牌", "格局", "附屬建物用途", "車位"], "a": 1}, {"id": "5-1-06", "c": 5, "s": 1, "n": "06", "p": 96, "q": "下列何者非屬住宅包租契約應約定事項中，租賃標的之應約定事項？", "o": ["專有部分之建號", "專有部分之權利範圍", "專有部分之面積", "專有部分之使用時間"], "a": 3}, {"id": "5-1-07", "c": 5, "s": 1, "n": "07", "p": 96, "q": "包租業者為何種行為，會違反住宅包租契約應約定及不得約定事項？", "o": ["向出租人包租後，轉租一部分房屋給次承租人作為辦公室使用", "簽訂包租契約後以公證之方式為之", "響應青銀共居，將房屋分租給年輕人與老年人", "向房東表示願意負擔租賃期間之水電費，並記載於租約中"], "a": 0}, {"id": "5-1-08", "c": 5, "s": 1, "n": "08", "p": 96, "q": "住宅包租契約應約定及不得約定事項中，關於「租賃期間」規定至少需幾日以上？", "o": ["30日", "20日", "10日", "5日"], "a": 0}, {"id": "5-1-09", "c": 5, "s": 1, "n": "09", "p": 96, "q": "住宅包租契約應約定事項規定中，下列哪一項費用是不得約定由包租業負擔？", "o": ["租賃期間之社區管理費", "租賃期間之房屋稅", "租賃期間之水電費", "公證費"], "a": 1}, {"id": "5-1-10", "c": 5, "s": 1, "n": "10", "p": 96, "q": "下列何種屬包租業租賃住宅管理人員的正確行為？", "o": ["要出租的房子還沒裝潢好，可以先用其他間的照片作為廣告使用", "租賃契約沒有連帶保證人可以自行填載房客法定代理人的姓名年籍上去", "租約到期後，房客一直不搬走，可以會同里長和警察強行開門", "租約屆滿30天前，提早提醒房客是否要續約"], "a": 3}, {"id": "5-1-11", "c": 5, "s": 1, "n": "11", "p": 97, "q": "住宅包租契約應約定及不得約定事項中，關於「使用租賃住宅之限制」，下列敘述何者有誤？", "o": ["租賃標的僅供轉租作居住使用，包租業不得變更用途", "包租業向出租人承租房屋之後，得改變使用用途", "包租業轉租租賃標的或經出租人同意提供他人使用者，應督促承租人或使用人應遵循公寓大廈規約", "出租人將房屋出租給包租業進行轉租行為，須提供轉租同意書給包租業"], "a": 1}, {"id": "5-1-12", "c": 5, "s": 1, "n": "12", "p": 97, "q": "住宅包租契約應約定及不得約定事項中，關於「修繕」的敘述下列何者有誤？", "o": ["租賃住宅或附屬設備損壞時，應由包租業負責修繕及費用", "出租人為修繕租賃住宅所為之必要行為，包租業不得拒絕", "租賃住宅之修繕費用，經約定由出租人負擔者，當出租人未履行義務，包租業得於租金中扣除", "租賃住宅或附屬設備損壞時，修繕費用得視情形由出租人與包租業約定負擔方式"], "a": 0}, {"id": "5-1-13", "c": 5, "s": 1, "n": "13", "p": 97, "q": "住宅包租應約定及不得約定事項中，下列何者不是簽署契約書時之必要附件？", "o": ["租賃標的現況確認書", "出租人同意轉租範圍、租賃期間及終止租約事由確認書", "包租契約委託管理書", "出租人負擔修繕費用之項目及範圍確認書"], "a": 2}, {"id": "5-1-14", "c": 5, "s": 1, "n": "14", "p": 97, "q": "下列何者非屬住宅包租應約定及不得約定事項之「出租人之義務及責任」？", "o": ["出租人出示有權出租該租賃標的之身分證明文件", "出租人得要求包租業提供篩選承租人入住標準", "出租人應於簽約時提供同意本租賃標的轉租之同意書", "出租人應於將合於居住狀態之租賃標的交付包租業，並於租賃期間保持其合於居住狀態"], "a": 1}, {"id": "5-1-15", "c": 5, "s": 1, "n": "15", "p": 97, "q": "下列就住宅包租契約應約定及不得約定事項「包租業之義務及責任」之敘述，何者有誤？", "o": ["包租業應提供租賃住宅服務業登記證影本，供出租人核對", "包租業與次承租人簽訂轉租契約時，不得逾出租人同意轉租之範圍與租賃期間", "包租業應於簽訂轉租契約後30日內，將相關資料口頭告知出租人", "包租業應執行日常修繕維護並製作紀錄，供出租人查詢或調閱"], "a": 2}, {"id": "5-1-16", "c": 5, "s": 1, "n": "16", "p": 98, "q": "住宅包租契約應約定及不得約定事項規定，包租業簽訂轉租契約後，應於幾日內通知出租人？", "o": ["1日", "5日", "10日", "30日"], "a": 3}, {"id": "5-1-17", "c": 5, "s": 1, "n": "17", "p": 98, "q": "住宅包租契約應約定及不得約定事項，下列何者非屬「包租業之義務及責任」？", "o": ["包租業應盡善良管理人責任", "包租業應於收受出租人有關費用或文件時，開立統一發票或收據", "包租業應負擔出租人房屋稅及地價稅", "不得轉讓出租人同意轉租之權利及其管理業務"], "a": 2}, {"id": "5-1-18", "c": 5, "s": 1, "n": "18", "p": 98, "q": "下列何者不是住宅包租契約應約定及不得約定事項中，關於租賃標的現況確認書應該確認的範圍？", "o": ["有無做過海砂屋檢測", "有無做過輻射屋檢測", "有無發生過兇殺案", "有無他人在租屋處生病死亡"], "a": 3}, {"id": "5-1-19", "c": 5, "s": 1, "n": "19", "p": 98, "q": "依住宅包租契約應約定及不得約定事項，租賃之一方得提前終止租約，但違約金數額不得超過相當於幾個月的月租金？", "o": ["2個月", "1個月", "3個月", "不得約定違約金"], "a": 1}, {"id": "5-1-20", "c": 5, "s": 1, "n": "20", "p": 98, "q": "下列有關住宅包租契約應約定及不得約定事項中，對於包租業義務的敘述，何者有誤？", "o": ["應出示租賃住宅服務業登記證影本，供出租人核對", "應以善良管理人之注意，保管、使用、收益租賃住宅", "應於簽訂本契約時，提供同意本租賃標的之全部或一部分轉租之同意書，並載明租賃標的範圍、租賃期間及得終止本契約之事由", "應於簽訂轉租契約後30日內，以書面將轉租標的範圍、租賃期間、次承租人之姓名及其通訊住址等相關資料通知出租人"], "a": 2}, {"id": "5-1-21", "c": 5, "s": 1, "n": "21", "p": 99, "q": "下列有關住宅包租契約應約定及不得約定事項中，對於包租業義務的敘述，何者有誤？", "o": ["得轉讓出租人同意轉租權利及其管理業務", "應於收受出租人之有關費用或文件時，開立統一發票或掣給收據", "應配合出租人申請減徵稅捐需要，提供相關證明", "應於出租人有因修繕之必要行為時，通知次承租人配合辦理"], "a": 0}, {"id": "5-1-22", "c": 5, "s": 1, "n": "22", "p": 99, "q": "請問下列何者為租賃住宅包租業之定義？", "o": ["承租租賃住宅並轉租及經營該租賃住宅管理業務之公司", "委託經營租賃管理業務之公司", "從事不動產買賣、互易之居間業務之公司", "受起造人或建築業之委託，負責企劃並代理銷售不動產之業務之公司"], "a": 0}, {"id": "5-1-23", "c": 5, "s": 1, "n": "23", "p": 99, "q": "下列有關住宅包租契約應約定及不得約定事項中出租人提前終止租約事由的敘述，何者有誤？", "o": ["包租業擅自將本租賃標的出借或以其他轉租以外之方式供他人使用，經出租人阻止仍繼續為之", "次承租人毀損租賃住宅或附屬設備，經包租業催告修繕仍不為修繕或相當之賠償", "包租業把出租人同意轉租權利及其管理業務轉讓予第三人，經出租人阻止仍繼續為之。", "包租業擅自進行室內裝修。"], "a": 1}, {"id": "5-1-24", "c": 5, "s": 1, "n": "24", "p": 99, "q": "下列何者不是住宅包租契約應約定事項中，契約應記載的當事人及相關人員基本資料？", "o": ["出租人之姓名(名稱)、統一編號或身分證明文件編號、戶籍地址、通訊地址、聯絡電話。", "包租業之公司名稱、代表人姓名、統一編號、登記證字號、營業地址、聯絡電話、電子郵件信箱。", "租賃住宅管理人員之姓名、證書字號、通訊地址、聯絡電話、電子郵件信箱。", "出租人同居人之姓名(名稱)、統一編號或身分證明文件編號、戶籍地址、通訊地址、聯絡電話、電子郵件信箱。"], "a": 3}, {"id": "5-1-25", "c": 5, "s": 1, "n": "25", "p": 99, "q": "下列何者不是住宅包租契約中的不得約定事項內容？", "o": ["不得約定本契約之通知，僅以電話方式為之。", "不得約定違反強制或禁止規定。", "不得約定出租人須繳回契約書。", "不得約定拋棄審閱期"], "a": 3}, {"id": "5-1-26", "c": 5, "s": 1, "n": "26", "p": 100, "q": "下列何者非屬住宅包租契約應約定及不得約定事項中，停車位約定情形？", "o": ["他項權利之登記", "平面式或機械式", "使用時間", "停車位種類及編號"], "a": 0}, {"id": "5-1-27", "c": 5, "s": 1, "n": "27", "p": 100, "q": "出租人違反下列何種規定時，不得以消費者保護法處罰？", "o": ["租賃住宅委託管理定型化契約應記載及不得記載事項", "住宅包租契約應約定及不得約定事項", "住宅轉租定型化契約應記載及不得記載事項", "住宅租賃定型化契約應記載及不得記載事項」"], "a": 1}, {"id": "5-1-28", "c": 5, "s": 1, "n": "28", "p": 100, "q": "住宅包租契約應約定及不得約定事項中，下列何者非屬租賃標的約定情形？", "o": ["租賃住宅門牌", "有無查封登記", "有無設定他項權利", "有無預告登記"], "a": 3}, {"id": "5-1-29", "c": 5, "s": 1, "n": "29", "p": 100, "q": "住宅包租契約應約定及不得約定事項中，關於「押金約定」的數額不得超過相當於幾個月租金？", "o": ["2個月", "1個月", "3個月", "6個月"], "a": 0}, {"id": "5-1-30", "c": 5, "s": 1, "n": "30", "p": 100, "q": "住宅包租契約應約定及不得約定事項中，有關租賃標的之標示應詳如下列哪一個選項？", "o": ["租賃標的現況確認書", "點交設備清單", "廣告資料", "委託書"], "a": 0}, {"id": "5-1-31", "c": 5, "s": 1, "n": "31", "p": 100, "q": "下列何項並無「不得拋棄審閱期間」之規定？", "o": ["租賃住宅委託管理定型化契約應記載及不得記載事項", "住宅包租契約應約定及不得約定事項", "住宅轉租定型化契約應記載及不得記載事項", "住宅租賃定型化契約應記載及不得記載事項"], "a": 1}, {"id": "5-2-01", "c": 5, "s": 2, "n": "01", "p": 101, "q": "下列何者非住宅轉租定型化契約應記載事項中租賃住宅標的應記載事項？", "o": ["專有部分建號", "公有部分建號", "共有部分建號", "車位"], "a": 1}, {"id": "5-2-02", "c": 5, "s": 2, "n": "02", "p": 101, "q": "下列何者不是住宅轉租定型化契約應記載及不得記載事項中，關於租賃標的現況確認書中應該確認的範圍？", "o": ["有無做過海砂屋檢測", "有無做過輻射屋檢測", "有無宮廟、焚化廠、變電所", "有無發生過兇殺"], "a": 2}, {"id": "5-2-03", "c": 5, "s": 2, "n": "03", "p": 101, "q": "下列何者非屬住宅轉租定型化契約應記載及不得記載事項中，關於停車位記載情形？", "o": ["停車位種類及編號", "他項權利之登記", "使用時間", "平面式或機械式"], "a": 1}, {"id": "5-2-04", "c": 5, "s": 2, "n": "04", "p": 101, "q": "下列何者是住宅轉租定型化契約應記載及不得記載事項附件租賃標的現況確認書中，所謂的凶宅？", "o": ["在屋主產權持有期間，租屋處發生兇殺案，被害者死於租屋處大樓的樓梯間", "租屋處所處公寓大廈鄰居跳樓身亡，死於社區中庭", "在屋主產權持有期間，租屋處有人上吊自殺", "在屋主產權持有期間，租屋處樓上有人死亡，為運送屍體而經過出租處內"], "a": 2}, {"id": "5-2-05", "c": 5, "s": 2, "n": "05", "p": 101, "q": "有關住宅轉租定型化契約應記載及不得記載事項之規定，下列何種行為較不妥適？", "o": ["租約雖然沒有記載不得禁止房客不得申請租金補貼，但是包租業口頭說明租約記載之租金是房客未聲請租金補貼的價錢，將來如果房客申請租金補貼，要再多繳租金", "包租業評估租金時，應該要將相關的稅費及支出與附近租賃市場租金行情一併納入考量", "為了避免兩造糾紛，租約採公證方式為之", "為了避免房客日後檢舉，包租業應誠實申報稅捐"], "a": 0}, {"id": "5-2-06", "c": 5, "s": 2, "n": "06", "p": 102, "q": "住宅轉租定型化契約應記載及不得記載事項中，下列何者非屬租賃標的應記載事項？", "o": ["主建物", "有無查封登記", "有無預告登記", "有無設定他項權利"], "a": 2}, {"id": "5-2-07", "c": 5, "s": 2, "n": "07", "p": 102, "q": "住宅轉租定型化契約應記載及不得記載事項中，關於「押金約定」的數額不得超過相當於幾個月租金？", "o": ["3個月", "1個月", "2個月", "6個月"], "a": 2}, {"id": "5-2-08", "c": 5, "s": 2, "n": "08", "p": 102, "q": "住宅轉租定型化契約應記載及不得記載事項中，有關租賃標的之標示應參詳下列哪一個選項？", "o": ["點交設備清單", "租賃標的現況確認書", "廣告資料", "委託書"], "a": 1}, {"id": "5-2-09", "c": 5, "s": 2, "n": "09", "p": 102, "q": "住宅轉租定型化契約應記載及不得記載事項中，下列關於「修繕」之敘述何者有誤？", "o": ["租賃住宅或租賃附屬設備損壞時，不論任何情況應由包租業負責修繕及費用", "包租業為修繕租賃住宅所為之必要行為，承租人不得拒絕", "包租業若未期限內修繕應修繕之設備，承租人得自行修繕，並自租金扣除修繕費用", "包租業於修繕期間，致租賃標的全部或一部不能居住使用者，承租人得請求包租業扣除該期間全部或一部之租金"], "a": 0}, {"id": "5-2-10", "c": 5, "s": 2, "n": "10", "p": 103, "q": "依照住宅轉租定型化契約應約定及不得約定事項規定，雙方得提前終止租約。但其違約金數額不得超過相當於幾個月的月租金？", "o": ["2個月", "1個月", "3個月", "不得約定違約金"], "a": 1}, {"id": "5-2-11", "c": 5, "s": 2, "n": "11", "p": 103, "q": "下列何者非屬住宅轉租定型化契約的應記載事項？", "o": ["門牌", "車位", "附屬建物用途", "格局"], "a": 3}, {"id": "5-2-12", "c": 5, "s": 2, "n": "12", "p": 103, "q": "下列有關住宅轉租定型化契約應記載及不得記載事項中，關於室內裝修的敘述何者有誤？", "o": ["經包租業同意室內裝修者，承租人應依相關法令規定辦理，且不得損害原有建築之結構安全", "室內裝修所需費用，一定要由包租業負擔", "承租人經包租業同意裝修者，其裝修增設部分若有損壞，由承租人修繕並負擔費用", "承租人返還租賃住宅時，雙方可以約定應負責回復原狀或現況返還"], "a": 1}, {"id": "5-2-13", "c": 5, "s": 2, "n": "13", "p": 103, "q": "下列何者非屬住宅轉租定型化契約應記載中，租賃標的之應記載事項？", "o": ["專有部分之使用時間", "專有部分之權利範圍", "專有部分之面積", "專有部分之建號"], "a": 0}, {"id": "5-2-14", "c": 5, "s": 2, "n": "14", "p": 103, "q": "下列何者非屬住宅轉租定型化契約應記載及不得記載事項中，租賃標的之應記載事項？", "o": ["共有部分用途", "主建物用途", "附屬建物用途", "共有部分持分面積"], "a": 0}, {"id": "5-2-15", "c": 5, "s": 2, "n": "15", "p": 103, "q": "下列何者不是住宅轉租定型化契約之不得記載事項？", "o": ["不得約定廣告僅供參考", "不得約定承租人於租屋處不得辦理公司登記", "不得約定應由包租業負擔之稅費，轉嫁由承租人負擔", "不得約定承租人須繳回契約書"], "a": 1}, {"id": "5-2-16", "c": 5, "s": 2, "n": "16", "p": 104, "q": "住宅轉租定型化契約應記載事項中，下列哪一項費用可讓包租業及承租人自由約定由其中一方負擔？", "o": ["租賃期間之社區管理費", "租賃期間之房屋稅", "租賃期間之地價稅", "包租業於租賃期間之營業稅"], "a": 0}, {"id": "5-2-17", "c": 5, "s": 2, "n": "17", "p": 104, "q": "下列有關住宅轉租定型化契約應記載及不得記載事項中，對包租業義務的敘述何者有誤？", "o": ["應出示租賃住宅服務業登記證影本，供承租人核對", "應於簽訂本契約時，提供同意本租賃標的之全部或一部分轉租之同意書，並載明租賃標的範圍、租賃期間及得終止本契約之事由", "應以合於所約定居住使用之租賃住宅，交付承租人，並於租賃期間保持其合於居住使用之狀態", "無須製作租賃標的現況確認書，而是由出租人自行向承租人解說"], "a": 3}, {"id": "5-2-18", "c": 5, "s": 2, "n": "18", "p": 104, "q": "下列有關住宅轉租定型化契約應記載及不得記載事項包租業義務的敘述，何者有誤？", "o": ["不論如何，都應該負擔房屋的修繕責任", "應於收受出租人之有關費用或文件時，開立統一發票或掣給收據", "應配合出租人申請減徵稅捐需要，提供相關證明", "應於出租人有因修繕之必要行為時，通知次承租人配合辦理"], "a": 0}, {"id": "5-2-19", "c": 5, "s": 2, "n": "19", "p": 104, "q": "下列何種行為應適用住宅轉租定型化契約應記載及不得記載事項？", "o": ["商務中心出租獨立辦公室予公司行號使用", "包租業經出租人同意轉租其租賃住宅後，轉租予次承租人居住使用時", "大學生在校外租了一層公寓，將使用不到的房間出組給同學使用", "為了有效利用店面，將店面騎樓出租予他們營業使用"], "a": 1}, {"id": "5-2-20", "c": 5, "s": 2, "n": "20", "p": 105, "q": "下列有關住宅轉租定型化契約應記載及不得記載事項之電費約定，何者錯誤？", "o": ["以用電度數計費者，每度電費不得超過該租賃標的電費單「當期每度平均電價」；如公共設施電費未向台灣電力股份有限公司申辦分攤併入租賃標的電費內者，包租業不得額外收取", "非以用電度數計費者，包租業所收取之每期電費總金額，不得超過該租賃標的電費單之每期電費總額", "約定電費由承租人負擔者，包租業應提供承租人租賃標的之電費資訊。承租人亦得逕向台灣電力股份有限公司申辦查詢租賃期間之有關電費資訊", "一度就是十元，無法協商"], "a": 3}, {"id": "5-3-01", "c": 5, "s": 3, "n": "01", "p": 106, "q": "下列何者非屬租賃住宅代管業服務項目？", "o": ["屋況與設備點交", "搬家服務", "管理押金", "遺留物之處理"], "a": 1}, {"id": "5-3-02", "c": 5, "s": 3, "n": "02", "p": 106, "q": "關於租賃住宅委託管理定型化契約應記載及不得記載事項，下列敘述何者正確？", "o": ["管理期間，受託人為提升服務品質，得委託他代管業執行租賃住宅代管事務", "為避免租賃糾紛，出租人與承租人已成立租賃契約者，此一情形，不得委託租賃代管服務業進行租賃住宅代管事務", "管理期間，受託人得向承租人代收押金或租金，並於代收日起30日內交付委託人", "委託管理標的經租賃契約約定由承租人負責修繕者，不得由受託人代為督促承租人修繕並負修繕費用"], "a": 2}, {"id": "5-3-03", "c": 5, "s": 3, "n": "03", "p": 106, "q": "依據租賃住宅委託管理定型化契約應記載及不得記載事項規定，當租期屆滿或租賃契約提前終止時，下列何者非屬受託人之責任與義務？", "o": ["協助結清相關費用", "督促承租人遷出戶籍及其他登記", "督促承租人將租賃住宅返還委託人", "清潔該租賃住宅"], "a": 3}, {"id": "5-3-04", "c": 5, "s": 3, "n": "04", "p": 106, "q": "依據租賃住宅委託管理定型化契約應記載及不得記載事項，關於委託管理標的，下列何者非屬委託管理標的中應記載事項？", "o": ["格局", "門牌", "車位", "附屬建物用途"], "a": 0}, {"id": "5-3-05", "c": 5, "s": 3, "n": "05", "p": 106, "q": "下列有關租賃住宅委託管理定型化契約應記載及不得記載事項，受託人於租賃關係消滅時，督促承租人返還租賃住宅的行為，何者較妥適？", "o": ["建議出租人聲請調解或調處", "房客不理不睬，就在夜間到租屋處大聲敲門叫他出來面對", "直接去台電及自來水公司聲請停用租屋處之水、電", "房客不接電話，就半夜連續打電話"], "a": 0}, {"id": "5-3-06", "c": 5, "s": 3, "n": "06", "p": 107, "q": "下列何者非屬租賃住宅委託管理定型化契約應記載及不得記載事項中，委託管理標的之應記載事項？", "o": ["主建物用途", "共有部分用途", "附屬建物用途", "共有部分持分面積"], "a": 1}, {"id": "5-3-07", "c": 5, "s": 3, "n": "07", "p": 107, "q": "租賃住宅委託管理定型化契約應記載及不得記載事項中出租人與代管公司的法律關係為何？", "o": ["承攬", "雇傭", "委任", "租賃"], "a": 2}, {"id": "5-3-08", "c": 5, "s": 3, "n": "08", "p": 107, "q": "租賃委託管理定型化契約應記載及不得記載事項中，下列何者非屬租賃標的記載情形？", "o": ["有無查封登記", "有無預告登記", "主建物", "有無設定他項權利"], "a": 1}, {"id": "5-3-09", "c": 5, "s": 3, "n": "09", "p": 107, "q": "下列何者非租賃住宅委託管理定型化契約應記載及不得記載事項委託人終止契約事由？", "o": ["受託人依約應代為糾紛協調處理，經委託人定相當期間催告，屆期仍不處理", "受託人違反交付代收租金或押金之約定，經委託人定相當期間催告，屆期仍未交付", "受託人委託他代管業執行租賃住宅管理業務", "房客因刑案遭通緝失聯"], "a": 3}, {"id": "5-3-10", "c": 5, "s": 3, "n": "10", "p": 107, "q": "關於租賃住宅委託管理定型化契約應記載及不得記載事項，下列敘述何者有誤？", "o": ["管理期間，受託人不論任何情形都須負擔設備修繕費用。", "管理期間，受託人於租期屆滿或租約提前終止時，代為執行屋況及設備點交", "管理期間，受託人代為辦理日常修繕維護事務，應製作紀錄提供委託人查詢或取閱", "管理期間，受託人代為協調處理租賃糾紛"], "a": 0}, {"id": "5-3-11", "c": 5, "s": 3, "n": "11", "p": 108, "q": "受託人代收押金或租金者，應於代收幾日內，交付委託人？", "o": ["當日", "30日", "7日", "5日"], "a": 1}, {"id": "5-3-12", "c": 5, "s": 3, "n": "12", "p": 108, "q": "依據租賃住宅委託管理定型化契約應記載及不得記載事項規定，下列何者非屬受託人之責任與義務？", "o": ["代為糾紛協調處理", "依期限交付代收之押金與租金", "委託他代管業執行租賃住宅管理業務", "應配合委託人申請減徵稅捐需要，提供相關證明。"], "a": 2}, {"id": "5-3-13", "c": 5, "s": 3, "n": "13", "p": 108, "q": "下列何者非租賃住宅委託管理定型化契約應記載事項中委託管理標的應記載事項？", "o": ["專有部分建號", "共有部分建號", "公有部分建號", "車位"], "a": 2}, {"id": "5-3-14", "c": 5, "s": 3, "n": "14", "p": 108, "q": "下列何者非屬租賃住宅委託管理定型化契約應記載及不得記載事項中，停車位記載情形？", "o": ["停車位種類及編號", "平面式或機械式", "他項權利之登記", "使用時間"], "a": 2}, {"id": "5-3-15", "c": 5, "s": 3, "n": "15", "p": 108, "q": "下列何者非為租賃住宅委託管理定型化契約應記載及不得記載事項中的租賃標的？", "o": ["套房", "雅房", "公寓", "店面"], "a": 3}, {"id": "5-3-16", "c": 5, "s": 3, "n": "16", "p": 109, "q": "下列就租賃住宅委託管理定型化契約應記載及不得記載事項委託管理期間的報酬的記載何者正確？", "o": ["受託人的報酬最高上限為月租金的6%", "受託人的報酬最高上限為月租金的5%", "受託人的報酬最高上限為月租金的10%", "沒有上限的規範"], "a": 3}, {"id": "5-3-17", "c": 5, "s": 3, "n": "17", "p": 109, "q": "下列何者不是租賃住宅委託管理定型化契約應記載及不得記載事項的委託管理項目？", "o": ["屋況與設備點交", "居住者身分之確認", "房客欠租時，以業者名義向法院聲請對房客發支付命令", "向承租人催收(繳)租金及相關費用"], "a": 2}, {"id": "5-3-18", "c": 5, "s": 3, "n": "18", "p": 109, "q": "下列有關租賃住宅委託管理定型化契約應記載及不得記載事項委託人義務的敘述，何者有誤？", "o": ["委託人負責修繕者，得委由受託人修繕;其費用不得約定由委託人負擔", "據實提供附件之委託管理標的現況確認書相關資訊，並確保合於租賃契約所約定居住使用之狀態", "應出示有權委託管理本租賃住宅之證明文件、國民身分證或其他足資證明身分之文件供核對", "同意受託人代收租金、押金者，並應提供交付之方式"], "a": 0}, {"id": "5-3-19", "c": 5, "s": 3, "n": "19", "p": 109, "q": "下列有關租賃住宅委託管理定型化契約應記載及不得記載事項受託人義務的敘述，何者有誤？", "o": ["租賃關係消滅，督促承租人返還租賃住宅，但承租人置之不理，得逕行斷水斷電", "租賃關係消滅，督促承租人返還租賃住宅時，仍應依照法律規定為之", "租賃關係消滅，督促承租人返還租賃住宅，並結算相關費用", "向承租人催收(繳)租金及相關費用"], "a": 0}, {"id": "5-4-01", "c": 5, "s": 4, "n": "01", "p": 110, "q": "住宅租賃定型化契約應記載及不得記載事項中，下列哪一項費用，出租人及承租人不得自由約定由其中一方負擔？", "o": ["租賃期間之社區管理費", "租賃期間之房屋稅", "租賃期間之水電費", "公證費"], "a": 1}, {"id": "5-4-02", "c": 5, "s": 4, "n": "02", "p": 110, "q": "住宅租賃定型化契約應記載及不得記載事項中，下列何者非屬房屋租賃標的應記載事項？", "o": ["有無預告登記", "有無查封登記", "主建物", "有無設定他項權利"], "a": 0}, {"id": "5-4-03", "c": 5, "s": 4, "n": "03", "p": 110, "q": "依據住宅租賃定型化契約應記載及不得記載事項中契約如經公證者，下列何事項不是得逕為強制執行事項？", "o": ["承租人如於租期屆滿後不返還租賃住宅", "承租人未依約給付之欠繳租金、費用及出租人或租賃標的所有權人代繳之管理費，或違約時應支付之金額", "出租人如於租期屆滿或本契約終止時，應返還之全部或一部押金", "出租人提前終止租約後，承租人不願搬離者"], "a": 3}, {"id": "5-4-04", "c": 5, "s": 4, "n": "04", "p": 110, "q": "住宅租賃定型化契約應記載及不得記載事項中，下列非屬事項規定之「使用房屋之限制」？", "o": ["承租人不得於屋內飼養寵物", "房屋係供住宅使用，非經出租人同意，不得變更用途", "承租人不得違法使用或存放有爆炸性或易燃性物品，影響公共安全", "出租人同意轉租者，承租人應提示出租人同意轉租之證明文件。"], "a": 0}, {"id": "5-4-05", "c": 5, "s": 4, "n": "05", "p": 110, "q": "住宅租賃定型化契約應記載及不得記載事項中，下列哪一項費用，出租人及承租人得自由約定由其中一方負擔？", "o": ["房屋稅", "地價稅", "所得稅", "公證費"], "a": 3}, {"id": "5-4-06", "c": 5, "s": 4, "n": "06", "p": 111, "q": "下列何者非屬住宅租賃定型化契約應記載及不得記載事項中車位記載情形？", "o": ["停車位種類及編號", "平面式或機械式", "使用時間", "他項權利之登記"], "a": 3}, {"id": "5-4-07", "c": 5, "s": 4, "n": "07", "p": 111, "q": "下列何者非屬住宅租賃定型化契約應記載及不得記載事項中租賃住宅標的應記載事項？", "o": ["門牌", "附屬建物用途", "格局", "車位"], "a": 2}, {"id": "5-4-08", "c": 5, "s": 4, "n": "08", "p": 111, "q": "住宅租賃定型化契約應記載及不得記載事項中租賃住宅返還之規定，下列何者有誤？", "o": ["租期屆滿或租賃契約終止時，出租人應結算相關費用，承租人應即將租賃住宅返還出租人並遷出戶籍或其他登記", "租賃住宅之返還，應由租賃雙方共同完成屋況及附屬設備之點交手續。租賃之一方未會同點交，經他方定相當期限催告仍不會同者，視為完成點交", "承租人未依第一項規定返還租賃住宅時，出租人除按日向承租人請求未返還房屋期間之相當月租金額外，並得請求相當月租金額計算之違約金(未足1個月者，以日租金折算)至返還為止", "承租人未如期返還租賃住宅所應賠償的違約金，不得由押金中抵扣"], "a": 3}, {"id": "5-4-09", "c": 5, "s": 4, "n": "09", "p": 111, "q": "住宅租賃定型化契約應記載及不得記載事項中，關於「任意終止租約之約定」之規定，下列何者有誤？", "o": ["契約於期限屆滿前，租賃雙方得協議是否得提前終止租約", "依約定得終止租約者，租賃之一方應於期限內通知他方。一方未先期通知而逕自終止租約者，應賠償他方最高2個月租金額之違約金", "承租人應賠償之違約金得由押金扣抵", "租期屆滿前，依第2項終止租約者，出租人已預收之租金應返還予承租人"], "a": 1}, {"id": "5-4-10", "c": 5, "s": 4, "n": "10", "p": 112, "q": "住宅租賃定型化契約應記載及不得記載事項中，關於「任意終止租約」之規定，下列何者有誤？", "o": ["契約於期限屆滿前，租賃雙方得協議是否得提前終止租約", "依約定得終止租約者，租賃之一方應於期限內通知他方。一方未先期通知而逕自終止租約者，應賠償他方最高1個月租金額之違約金", "承租人應賠償之違約金不得由押金扣抵", "租期屆滿前，依第2項終止租約者，出租人已預收之租金應返還予承租人"], "a": 2}, {"id": "5-4-11", "c": 5, "s": 4, "n": "11", "p": 112, "q": "依據住宅租賃定型化契約應記載及不得記載事項，關於「押金」的數額不得超過相當於幾個月租金？", "o": ["1個月", "2個月", "3個月", "6個月"], "a": 1}, {"id": "5-4-12", "c": 5, "s": 4, "n": "12", "p": 112, "q": "住宅租賃定型化契約應記載及不得記載事項中，下列哪一項費用，可以由出租人及承租人自由約定由其中一方負擔？", "o": ["租賃期間之社區管理費", "租賃期間之房屋稅", "租賃期間之地價稅", "出租人於租賃期間所衍生之所得稅"], "a": 0}, {"id": "5-4-13", "c": 5, "s": 4, "n": "13", "p": 112, "q": "依據住宅租賃定型化契約應記載及不得記載事項中，出租人於房屋交付後，承租人占有中，縱將其所有權讓與第三人，本契約對於受讓人仍繼續存在，但如本契約未經公證，其期限逾幾年即不適用？", "o": ["2年", "3年", "4年", "5年"], "a": 3}, {"id": "5-4-14", "c": 5, "s": 4, "n": "14", "p": 112, "q": "依據住宅租賃定型化契約應記載及不得記載事項中，出租人得因承租人遲付租金之總額達幾個月之金額，且經出租人催告仍不為支付之情形，出租人得終止租約？", "o": ["1個月", "2個月", "3個月", "4個月"], "a": 1}, {"id": "5-4-15", "c": 5, "s": 4, "n": "15", "p": 113, "q": "依據住宅租賃定型化契約應記載及不得記載事項中，有關提前終止之規定，如果雙方勾選於租約屆滿前不得任意終止租約，下列敘述何者有誤？", "o": ["房客要提前終止時，房東可以拒絕", "房東要提前終止時，房客可以拒絕", "房客可以主張抵扣兩個月押金後逕行終止租約", "雖然不得單方面任意終止，但是租賃雙方可以另外協議違約金後合意終止"], "a": 2}, {"id": "5-4-16", "c": 5, "s": 4, "n": "16", "p": 113, "q": "依據住宅租賃定型化契約應記載及不得記載事項中，有關提前終止之規定，如果雙方勾選於租約屆滿前得任意終止租約，下列敘述何者有誤？", "o": ["房客要提前終止時，只要在終止前一個月告知，就不用給付違約金", "房客要提前終止時，如果沒在終止前一個月告知，就需要給付最高一個月的違約金", "既然約定可以提前終止，房客要終止的話，房東不能拒絕", "既然約定可以提前終止，就不需要給付違約金"], "a": 3}, {"id": "5-4-17", "c": 5, "s": 4, "n": "17", "p": 113, "q": "依據住宅租賃定型化契約應記載及不得記載事項中，有關提前終止之規定，如果雙方勾選於租約屆滿前得任意終止租約，下列敘述何者有誤？", "o": ["只有房客終止才需要給付違約金，房東提前終止的話，不需要給付違約金", "房客要提前終止時，如果沒在終止前一個月告知，就需要給付最高一個月的違約金", "既然約定可以提前終止，房東要終止的話，房客不能拒絕", "房東要提前終止時，只要在終止前一個月告知，就不用給付違約金"], "a": 0}, {"id": "5-4-18", "c": 5, "s": 4, "n": "18", "p": 113, "q": "依據住宅租賃定型化契約應記載及不得記載事項中，有關提前終止之規定，如果雙方勾選於租約屆滿前得任意終止租約，下列敘述何者有誤？", "o": ["既然約定得提前終止租約，就代表任一方可以不附任何理由的終止，只是會因為通知的時期而有違約金之處罰", "房東可以約定，不管何時通知，只要提前終止租約，就要給付最高一個月之違約金", "既然約定可以提前終止，房東要終止的話，房客不能拒絕", "房東要提前終止時，只要在終止前一個月告知，就不用給付違約金"], "a": 1}, {"id": "5-4-19", "c": 5, "s": 4, "n": "19", "p": 114, "q": "下列有關住宅租賃定型化契約應記載及不得記載事項之電費約定，何種錯誤？", "o": ["以用電度數計費者，每度電費不得超過該租賃標的電費單「當期每度平均電價」；如公共設施電費未向台灣電力股份有限公司申辦分攤併入租賃標的電費內者，包租業不得額外收取", "非以用電度數計費者，包租業所收取之每期電費總金額，不得超過該租賃標的電費單之每期電費總額", "約定電費由承租人負擔者，包租業應提供承租人租賃標的之電費資訊。承租人亦得逕向台灣電力股份有限公司申辦查詢租賃期間之有關電費資訊", "一度就是十元，無法協商"], "a": 3}, {"id": "5-4-20", "c": 5, "s": 4, "n": "20", "p": 114, "q": "下列有關住宅租賃定型化契約應記載及不得記載事項之電費約定，何種錯誤？", "o": ["以用電度數計費者，每度電費不得超過該租賃標的電費單「當期每度平均電價」；如公共設施電費未向台灣電力股份有限公司申辦分攤併入租賃標的電費內者，包租業不得額外收取", "為了計算方便，獨立套房裝設各自的電表，每度收取8元，就算超過當期每度平均電價也沒關係", "約定電費由承租人負擔者，包租業應提供承租人租賃標的之電費資訊。承租人亦得逕向台灣電力股份有限公司申辦查詢租賃期間之有關電費資訊", "非以用電度數計費者，包租業所收取之每期電費總金額，不得超過該租賃標的電費單之每期電費總額"], "a": 1}, {"id": "5-4-21", "c": 5, "s": 4, "n": "21", "p": 114, "q": "下列哪些租賃關係不適用住宅租賃定型化契約應記載及不得記載事項？", "o": ["房東出租辦公室", "社會住宅", "房東出租給學生居住", "房東出租給未成年人居住"], "a": 0}, {"id": "5-4-22", "c": 5, "s": 4, "n": "22", "p": 114, "q": "下列哪些項目是租賃住宅市場發展及管理條例明文規定押金擔保之範圍？", "o": ["處理遺留物責任", "租金之給付", "水、電費", "管理費"], "a": 0}, {"id": "5-4-23", "c": 5, "s": 4, "n": "23", "p": 115, "q": "下列有關住宅租賃定型化契約應記載及不得記載事項中，如果房客欠租且終止租約後仍拒絕搬遷，通常情況中，哪一項不是房東可以主張的權利？", "o": ["請求相當月租金額之違約金", "請求相當月租金額之不當得利", "訴請房客返還房屋", "請求精神賠償"], "a": 3}, {"id": "5-4-24", "c": 5, "s": 4, "n": "24", "p": 115, "q": "下列哪些租賃關係不適用住宅租賃定型化契約應記載及不得記載事項？", "o": ["民宿", "社會住宅", "房東出租給學生居住", "房東出租給未成年人居住"], "a": 0}, {"id": "5-4-25", "c": 5, "s": 4, "n": "25", "p": 115, "q": "下列哪些租賃關係適用住宅租賃定型化契約應記載及不得記載事項？", "o": ["民宿", "AIRBNB", "飯店", "房東出租給未成年人居住"], "a": 3}, {"id": "5-4-26", "c": 5, "s": 4, "n": "26", "p": 115, "q": "下列哪些租賃關係適用住宅租賃定型化契約應記載及不得記載事項？", "o": ["工廠租賃", "寺廟香客中心", "飯店", "大學宿舍"], "a": 3}, {"id": "5-4-27", "c": 5, "s": 4, "n": "27", "p": 115, "q": "下列關於住宅租賃定型化契約應記載及不得記載事項之效力，下列敘述何者錯誤？", "o": ["租約條款違反公告之定型化契約，其違反之條款無效", "中央主管機關公告應記載之事項，雖未記載於定型化契約，仍構成契約之內容", "租約一旦違反不得記載事項，整部租約都是無效。", "租約雖然違反不得記載事項，但除去該部分，契約亦可成立者，該契約之其他部分，仍為有效。"], "a": 2}, {"id": "5-4-28", "c": 5, "s": 4, "n": "28", "p": 115, "q": "住宅租賃定型化契約應記載及不得記載事項中，如果出租人移轉租屋處之所有權予受讓人，何種情形下，房客不得對該受讓人主張租約之效力？", "o": ["租約期限未滿五年", "租約經公證", "租約未經公證，且租期逾五年", "租期10年但租約經公證"], "a": 2}, {"id": "5-4-29", "c": 5, "s": 4, "n": "29", "p": 116, "q": "住宅租賃定型化契約應記載及不得記載事項中，下列何者不是出租人提前終止事由？", "o": ["房客申請租金補貼", "出租人為重新建築而必要收回", "承租人積欠管理費或其他應負擔之費用達二個月之租金額，經出租人定相當期限催告，仍不為支付", "承租人擅自變更用途，經出租人阻止仍繼續為之"], "a": 0}, {"id": "5-4-30", "c": 5, "s": 4, "n": "30", "p": 116, "q": "住宅租賃定型化契約應記載及不得記載事項中，下列出租人提前終止事由何項需要在終止前三個月通知？", "o": ["承租人擅自將租賃住宅轉租或轉讓租賃權予他人", "出租人為重新建築而必要收回", "承租人積欠管理費或其他應負擔之費用達二個月之租金額，經出租人定相當期限催告，仍不為支付", "承租人擅自變更用途，經出租人阻止仍繼續為之"], "a": 1}, {"id": "5-4-31", "c": 5, "s": 4, "n": "31", "p": 116, "q": "住宅租賃定型化契約應記載及不得記載事項中，承租人提前終止事由中，因疾病、意外產生有長期療養之需要而需終止時，需檢附何項書面證明？", "o": ["學校或工作單位請假證明", "醫師診斷證明", "因為是發生車禍，所以要提供車禍發生之現場照片", "三等親之切結書"], "a": 1}, {"id": "5-4-32", "c": 5, "s": 4, "n": "32", "p": 116, "q": "下列何項不是住宅租賃定型化契約應記載及不得記載事項可採之履行契約通知方式？", "o": ["郵寄", "口頭", "電子郵件", "即時通訊軟體以文字顯示方式"], "a": 1}, {"id": "5-4-33", "c": 5, "s": 4, "n": "33", "p": 116, "q": "下列何項租屋標的之情況，不是住宅租賃定型化契約應記載及不得記載事項租賃標的現況確認書之房東應告知事項？", "o": ["前房客在租屋處上吊自殺", "前房客在租屋處內燒炭自殺", "前房客在陽台跳樓自殺，死亡於社區中庭", "租屋處有人病死身亡"], "a": 3}, {"id": "5-4-34", "c": 5, "s": 4, "n": "34", "p": 117, "q": "下列何項租屋標的之情況，是住宅租賃定型化契約應記載及不得記載事項租賃標的現況確認書之房東應告知事項？", "o": ["因為天氣寒冷，所以前房客在租屋處緊閉門窗開熱水器洗澡，又沒有安裝強制排氣設施，因而一氧化碳中毒死亡", "前房客在租屋處因電線走火漏電而不幸觸電身亡", "租屋處對面發生過兇殺案，兇手曾經拖著裝有屍體的行李箱經過租屋處前之走廊", "租屋處有人病死身亡"], "a": 0}, {"id": "5-4-35", "c": 5, "s": 4, "n": "35", "p": 117, "q": "租屋處如之前曾發生前房客在租屋處內燒炭自殺，但是房東知情卻故意隱匿而不告知，房客知道可以主張何種權利？", "o": ["主張民事詐欺，撤銷租賃之意思表示", "主張租金全免", "主張去祭改之法事費用", "主張是因為住到凶宅才會被公司資遣，並進一步主張工資的損失"], "a": 0}, {"id": "6-1-01", "c": 6, "s": 1, "n": "01", "p": 118, "q": "除當地鄉鎮市區公所調解委員會可協助承租人進行租賃糾紛調解外，下列哪一單位也可協助企業經營者為出租人之租賃糾紛?", "o": ["公平交易委員會", "消費者服務中心", "勞資爭議調解委員會", "警察局"], "a": 1}, {"id": "6-1-02", "c": 6, "s": 1, "n": "02", "p": 118, "q": "租賃契約消滅之返還，需雙方共同完成點交，依租賃住宅市場發展及管理條例規定，點交後尚有遺留物，出租人該如何處理?", "o": ["出租人可以直接視為自己的物品處理", "出租人無須催告，視為廢棄物", "經出租人定相當期限催告仍不取回，視為拋棄其所有權，處理費用從押金扣", "出租人無須催告，依契約直接視為廢棄物，處理費用從押金扣"], "a": 2}, {"id": "6-1-03", "c": 6, "s": 1, "n": "03", "p": 118, "q": "租賃住宅市場發展及管理條例的中央主管機關為下列何者?", "o": ["經濟部", "內政部", "教育部", "衛福部"], "a": 1}, {"id": "6-1-04", "c": 6, "s": 1, "n": "04", "p": 118, "q": "為避免發生租約到期，承租人不搬走或出租人無理由扣留押金等糾紛爭議，下列敘述何者正確?", "o": ["可請律師當見證人，一同完成簽約，若未履行契約，直接聲請強制執行", "可請地政士協助認證，一同完成簽約，若未履行契約，直接聲請強制執行", "可至法院或民間公證人公證租約，若未履行契約，直接聲請強制執行", "可至律師進行租約認證，若未履行契約，直接聲請強制執行"], "a": 2}, {"id": "6-1-05", "c": 6, "s": 1, "n": "05", "p": 119, "q": "根據租賃住宅市場發展及管理條例中規定，當出租人與承租人發生租屋糾紛爭議時，關於調處機制下列敘述何者正確?", "o": ["調處成立，等同法院確定判決", "出租人與承租人申請調處免繳納費用", "承租人申請需要手續費", "出租人申請需要作業費用"], "a": 1}, {"id": "6-1-06", "c": 6, "s": 1, "n": "06", "p": 119, "q": "租賃住宅服務業經營所繳交的營業保證金，主要是做為何項擔保之用?", "o": ["營業保證金是加入租賃住宅服務業全聯會的會費", "營業保證金是協助承租人支付欠繳之租金", "營業保證金是業者不能履行契約或因其受僱人執行業務之故意或過失致租賃住宅服務當事人受損害人的損害賠償擔保", "營業保證金主要是協助租賃雙方支付租賃衍生之費用"], "a": 2}, {"id": "6-1-07", "c": 6, "s": 1, "n": "07", "p": 119, "q": "依租賃住宅市場發展及管理條例內容，關於租賃住宅之租金約定規定，下列何者正確?", "o": ["城市地方房屋之租金，不超過土地及其建築物申報總價年息10%", "城市地方房屋之租金，不超過土地及其建築物申報總價年息5%", "城市地方房屋之租金，不超過土地及其建築物申報總價年息15%", "租金自行約定不受限"], "a": 3}, {"id": "6-1-08", "c": 6, "s": 1, "n": "08", "p": 119, "q": "何謂租賃住宅市場發展及管理條例所稱之租賃住宅代管業?", "o": ["與出租人簽訂委託管理租賃住宅契約書後，執行租賃住宅管理業務之業者", "與委託人簽訂租賃住宅契約書後，協助委託人將住宅出租之業者", "接受承租人之委託，協助出租人進行租賃住宅管理業務之業者", "接受政府核定可執行租賃住宅租賃業務的業者"], "a": 0}, {"id": "6-1-09", "c": 6, "s": 1, "n": "09", "p": 119, "q": "租賃住宅市場發展及管理的租賃住宅服務業，若經被害人向租賃住宅服務業全聯會申請調處並確定責任之歸屬後，下列程序何者正確?", "o": ["由租賃住宅服務業全聯會協助被服務人進行訴訟", "由租賃住宅服務業繳存的營業保證金支付代償", "由業者直接支付賠償金", "由租賃住宅服務業全聯會進行再次協商"], "a": 1}, {"id": "6-1-10", "c": 6, "s": 1, "n": "10", "p": 120, "q": "因房屋租賃發生爭議，不服調處者，依法得向何機關訴請處理?", "o": ["立法機關", "監察機關", "地政機關", "司法機關"], "a": 3}, {"id": "6-1-11", "c": 6, "s": 1, "n": "11", "p": 120, "q": "依租賃住宅市場發展及管理條例法規定，直轄市、縣(市)地政機關為處理租屋相關之糾紛，應設何種委員會?", "o": ["不動產糾紛調處委員會", "不動產糾紛仲裁委員會", "不動產糾紛調解委員會", "不動產糾紛調查委員會"], "a": 0}, {"id": "6-1-12", "c": 6, "s": 1, "n": "12", "p": 120, "q": "出租人與承租人間因租屋發生民事履約爭議時，可依下列何項方式處理?", "o": ["由當地鄉鎮市區公所調解委員會進行調解", "直接報警處理", "直接至訴請法院強制執行", "由當地鄉鎮市區公所耕地租佃委員會調解"], "a": 0}, {"id": "6-1-13", "c": 6, "s": 1, "n": "13", "p": 120, "q": "與代管業及包租業者發生糾紛爭議時，除了直轄市、縣(市)政府主管機關外，下列何者亦為可接受申訴的單位?", "o": ["全國律師公會", "金融評議委員會", "勞資爭議調解委員會", "租賃住宅服務業全聯會"], "a": 3}, {"id": "6-2-01", "c": 6, "s": 2, "n": "01", "p": 121, "q": "「調解」與「調處」為訴訟以外解決紛爭的機制，下列敘述何者正確?", "o": ["調解與調處與法院之裁判效力相同", "調解與調處雙方達成協議後，等同確定判決", "調處委員做成的決議，雙方皆不能再異議", "調解雙方達成協議，做成之筆錄，送法院核定等同確定判決"], "a": 3}, {"id": "6-2-02", "c": 6, "s": 2, "n": "02", "p": 121, "q": "「調解」與「和解」都是訴訟以外解決紛爭的機制，下列敘述何者正確?", "o": ["調解與和解與法院之裁判效力相同", "調解與和解均須雙方當事人同意", "非告訴乃論的刑事事件不可和解，但可調解", "法庭上的任意調解皆由地方法院法官主導"], "a": 1}, {"id": "6-2-03", "c": 6, "s": 2, "n": "03", "p": 121, "q": "出租人與承租人間因租屋發生爭議時，可依下列何種方式處理?", "o": ["直接訴請法院強制執行", "由當地鄉鎮市區公所調解委員會進行仲裁", "由當地鄉鎮市區公所調解委員會進行調解", "由當地鄉鎮市區公所耕地租佃委員會調解"], "a": 2}, {"id": "6-2-04", "c": 6, "s": 2, "n": "04", "p": 121, "q": "出租人因租賃住宅委託管理業者之員工服務不佳，及未處理好委任事項而發生糾紛爭議，應依下列何種方式解決?", "o": ["業者得向直轄市、縣(市)政府消費者服務中心申訴", "出租人得向直轄市、縣(市)政府主管機關或全聯會申請調處", "出租人得向直轄市、縣(市)政府勞工局申請調處", "業者可向直轄市、縣(市)政府勞工局申請調處"], "a": 1}, {"id": "6-2-05", "c": 6, "s": 2, "n": "05", "p": 121, "q": "哪個地方單位設有調解委員會?", "o": ["鄉鎮市區公所", "直轄市(縣)政府市(縣)議會", "鄉鎮市區民代表會", "里長的服務中心"], "a": 0}, {"id": "6-2-06", "c": 6, "s": 2, "n": "06", "p": 121, "q": "房東甲因在土城的租屋賠償與房客乙已有調解成立案件，現又因戶籍在基隆的乙在板橋不小心撞傷了甲，其損害賠償調解，下列敘述何者正確?", "o": ["屬不同之案件可受理，須在板橋或基隆區公所申請", "屬不同之案件可受理，須在土城區公所申請", "有調解過，不論案件皆不得受理", "需隔半年方能申請"], "a": 0}, {"id": "6-2-07", "c": 6, "s": 2, "n": "07", "p": 122, "q": "調解委員是由哪些人組合擔任的且可以作成判決嗎?", "o": ["調解委員是由檢察官來擔任，但調解委員並不是法官，不能作成判決", "調解委員是由當地具有法律或其他專業知識及具備信用與聲望的公正人士來擔任，調解委員立場卓越超然，當然可以作成判決", "調解委員是由各地法官來擔任，調解委員是法官，故可以作成判決", "調解委員是由當地具有法律或其他專業知識及具備信用與聲望的公正人士來擔任，調解委員並不是法官，不能作成判決"], "a": 3}, {"id": "6-2-08", "c": 6, "s": 2, "n": "08", "p": 122, "q": "「調解」、「和解」與「調處」為訴訟以外解決紛爭的機制，若一方未出席，哪一種可依專業或法令規定做成決議?", "o": ["調解與調處", "調處", "調解", "和解與調處"], "a": 1}, {"id": "6-2-09", "c": 6, "s": 2, "n": "09", "p": 122, "q": "下列何項單位可以進行調解?(甲)商業仲裁委員(乙)法院(丙)當地鄉鎮市區公所(丁)屬消費爭議者，可至直轄市或縣（市）消費爭議調解委員會", "o": ["甲丙", "甲乙丙", "乙丙丁", "甲丁"], "a": 2}, {"id": "6-2-10", "c": 6, "s": 2, "n": "10", "p": 122, "q": "租賃住宅包租業者與次承租人因服務不佳，未處理好出租事項而發生糾紛爭議，關於爭議的解決方式下列敘述何者正確?", "o": ["委管業者可向直轄市、縣(市)政府勞工局申請調處", "包租業得向直轄市、縣(市)政府消費者服務中心申訴", "次承租人得向直轄市、縣(市)政府主管機關或全聯會申請調處", "承租人可向直轄市、縣(市)政府勞工局申請調處"], "a": 2}, {"id": "6-2-11", "c": 6, "s": 2, "n": "11", "p": 123, "q": "房客乙在台北市萬華區承租房屋，租約到期返還後，房東甲遲遲不退還押金，乙至萬華區公所申請調解，調解成立後甲應於10日內返還押金給乙。但1個月過去，甲仍未返還，乙該如何處理?", "o": ["甲仍未給付，乙只能重新提出返還押金之訴訟", "乙可依調解成立後的法院核定函，直接找房東甲家中強制執行甲的財產", "乙可依調解成立後的法院核定函，重新提出返還押金之訴訟", "乙可依經法院核定之調解書，至法院聲請強制執行，無須再重新訴訟"], "a": 3}, {"id": "6-2-12", "c": 6, "s": 2, "n": "12", "p": 123, "q": "戶籍基隆的房客甲於106年4月1日對房東乙因修繕不履行，造成甲之物品毀損爭議，至租屋處土城區公所申請調解，當日達成和解且法院核定確定，雙方同意賠償金額一萬元。106年5月1日乙深感不服賠償金額，再次至土城區公所再提調解，土城區公所的處理方式為何?", "o": ["仍可受理，再開一次調解會議", "因土城區已經受理過，要去基隆申請就可以受理", "已隔一個月，土城區可受理", "調解成立，且法院核定，不得再以同事件申請"], "a": 3}, {"id": "6-2-13", "c": 6, "s": 2, "n": "13", "p": 123, "q": "甲君於萬華區承租房屋，因工作不順欠繳租金5個月，房東乙君履催未果，只好至萬華區公所申請調解，甲君心生理虧，不敢出席。請問調解會議應如何處理?", "o": ["調解委員開立不成立證明，乙君僅能至法院另提返還房屋及給付租金訴訟", "乙君可依調解不成立證明送法院核定，直接至甲君家中強制執行財產", "乙君可依調解不成立後的法院核定函，重新提出返還房屋之訴訟", "乙君可依調解成立後的法院核定函，至法院請強制執行，無須再重新訴訟"], "a": 0}, {"id": "6-2-14", "c": 6, "s": 2, "n": "14", "p": 123, "q": "若不服消保官依職權提出的消費爭議調解方案，應於幾天內提出異議?", "o": ["10天", "7天", "15天", "30天"], "a": 0}, {"id": "6-2-15", "c": 6, "s": 2, "n": "15", "p": 124, "q": "消費者與企業經營者因租屋問題發生消費爭議，申請調解時其受理及程序進行等事項，由下列何者定之?", "o": ["消費爭議調解委員會", "消費保護團體", "公平交易委員會", "行政院"], "a": 3}, {"id": "6-2-16", "c": 6, "s": 2, "n": "16", "p": 124, "q": "因房屋租賃發生民事履約爭議，而調解破局時，接下來得如何處理?", "o": ["報警處理", "監察機關", "立法機關", "法院聲請訴訟"], "a": 3}, {"id": "6-2-17", "c": 6, "s": 2, "n": "17", "p": 124, "q": "定型化契約條款如有疑義時，應如何處理?", "o": ["應為有利於企業經營者之解釋", "應為有利於消費者之解釋", "應由當事人雙方自行協議", "應提起消費者爭議調解"], "a": 1}, {"id": "6-2-18", "c": 6, "s": 2, "n": "18", "p": 124, "q": "依鄉鎮市調解條例規定調解成立後，作成調解書並於10日內，將調解書送請法院審核，在經法院核定後，其調解具有下列的效力?", "o": ["民事部分，可以再行起訴", "經法院核定之「民」事調解，與民事確定判決有同一之效力，所以可以作為執行名義，如債務人不履行時，可以聲請強制執行", "經法院核定之「刑」事調解，如果是給付金錢或有價證券時，該調解書具有執行名義，如債務人不履行時，不可以聲請強制執行", "刑事部分，就可以再行告訴或自訴"], "a": 1}, {"id": "6-2-19", "c": 6, "s": 2, "n": "19", "p": 124, "q": "依消費者保護法之規定，下列關於租屋定型化契約之敘述，何者正確?", "o": ["簽訂租屋定型化契約，應有3日以上審閱期", "主管機關所公告的定型化契約範本，具備法律強制拘束力", "企業經營者於定型化契約中約定免除或限制賠償責任", "違反中央主管機關所公告之定型化約不得記載事項，其定型化契約全部無效"], "a": 0}, {"id": "6-2-20", "c": 6, "s": 2, "n": "20", "p": 124, "q": "民事訴訟法所定調解，當事人雙方達成協議調解成立，調解筆錄送法院核定，其效力為何?", "o": ["一般民法的和解效力", "未達成協議也會等同確定判決", "不能聲請強制執行，還是得重新提告", "等同法院確定判決"], "a": 3}, {"id": "6-2-21", "c": 6, "s": 2, "n": "21", "p": 125, "q": "下列何者具有法律的強制執行力?(甲)訴訟外和解(乙)調解委員會的調解書經法院核定後(丙)法庭上和解(丁)法院的確定判決(戊)私下和解", "o": ["乙丁戊", "乙丙戊", "乙丙丁", "甲丁戊"], "a": 2}, {"id": "6-3-01", "c": 6, "s": 3, "n": "01", "p": 126, "q": "租賃關係管理文件之保管方式中，下列對於文件檔案應如何處理之敘述何者較為妥適？", "o": ["應分類裝訂成冊", "不分類裝訂成冊", "不分類方便使用", "不分類集中保管"], "a": 0}, {"id": "6-3-02", "c": 6, "s": 3, "n": "02", "p": 126, "q": "在租賃關係管理中，對於汽機車車輛進出大樓地下室停車場，應做何管制措施較佳？", "o": ["採取自由停放", "以不影響其他車輛進出為原則", "造冊登錄列管以利管制", "視狀況而定"], "a": 2}, {"id": "6-3-03", "c": 6, "s": 3, "n": "03", "p": 126, "q": "在租賃關係管理中，對於住戶之反應意見，需如何處置較佳？", "o": ["填寫意見反應單並彙整呈報處理", "無填寫意見單者，不予理會", "住戶只說說罷了", "來電附帶提起"], "a": 0}, {"id": "6-3-04", "c": 6, "s": 3, "n": "04", "p": 126, "q": "對於5樓以上公寓大廈且已使用15年以上，所附屬昇降(電梯)設備安全檢查頻率敘述，下列何者是正確的?", "o": ["每半年1次", "每年1次", "每年2次", "每年3次"], "a": 0}, {"id": "6-3-05", "c": 6, "s": 3, "n": "05", "p": 126, "q": "社區大廈污水管的顏色是何種顏色？", "o": ["橘紅色", "藍色", "綠色", "白色"], "a": 0}, {"id": "6-3-06", "c": 6, "s": 3, "n": "06", "p": 126, "q": "對於高樓層住戶，為減少給水管路壓力，下列何種裝置為最佳選擇?", "o": ["閘閥", "減壓閥", "逆止閥", "陽極鎖"], "a": 1}, {"id": "6-4-01", "c": 6, "s": 4, "n": "01", "p": 127, "q": "承租戶若負擔家計者入獄服刑，請問租賃住宅管理人員採取下列何種措施較為妥適？", "o": ["終止契約避免後續無法收取租金", "建立關懷名冊必要時協請社會局介入", "公告周知請大家小心", "通知警方"], "a": 1}, {"id": "6-4-02", "c": 6, "s": 4, "n": "02", "p": 127, "q": "下列租賃住宅管理人員的管理手法，疑有租屋歧視之虞？", "o": ["提高有精神障礙成員承租戶押金", "通報社會局介入承租戶家暴行為", "以承租戶於其租賃住宅從事吸毒行為為由終止契約", "高風險承租戶列冊管理"], "a": 0}, {"id": "6-4-03", "c": 6, "s": 4, "n": "03", "p": 127, "q": "下列何者行為，租賃住宅管理人員不需要提高警覺或會同警方查訪租屋處？", "o": ["獨居老人多日未出家門", "學齡兒童長時間未上學", "年輕夫妻餐飲皆叫外送", "承租戶爆發激烈爭吵後數週未出入"], "a": 2}, {"id": "6-5-01", "c": 6, "s": 5, "n": "01", "p": 128, "q": "颱風來臨前，住戶飲用水管理的注意事項，下列何者做法較佳?", "o": ["委託清洗業清洗消毒水池和水塔", "於蓄水池投入消毒劑", "公告提醒住戶儲水，並先將水塔手動補滿水", "將蓄水池抽乾"], "a": 2}, {"id": "6-5-02", "c": 6, "s": 5, "n": "02", "p": 128, "q": "颱風季節遇豪大雨時，除了防洪閘門及擋水鋁板外，最有效且能阻擋大量雨水入侵或滲入，下列何者也是較佳的材料?", "o": ["沙包", "地毯", "鐵塊", "木板"], "a": 0}, {"id": "6-5-03", "c": 6, "s": 5, "n": "03", "p": 128, "q": "關於地震防範措施，在地震發生後，為了避免造成二次災害如火災等，在安全無虞的情況下，下列何種作法較佳？", "o": ["以軟墊保護頭部，尋找堅固的庇護所", "把門扇打開，以免門扇被震歪卡緊影響逃生", "檢查水電、瓦斯等管線，如有損壊馬上關掉開關暫停使用", "勿湧向安全門、出口樓梯以免造成擁擠傷害"], "a": 2}, {"id": "6-5-04", "c": 6, "s": 5, "n": "04", "p": 128, "q": "下列何者是防火門的主要目的?", "o": ["逃生用", "防小偷", "裝飾用", "阻隔火煙"], "a": 3}, {"id": "6-5-05", "c": 6, "s": 5, "n": "05", "p": 128, "q": "為了防止強風吹落傷人，應於何時將社區屋外各種懸掛物、招牌、工程鷹架或棚架立即取下或釘牢，並且修剪大型樹木及樹枝?", "o": ["颱風來臨前", "颱風時", "颱風過後", "平時作為"], "a": 0}, {"id": "6-5-06", "c": 6, "s": 5, "n": "06", "p": 128, "q": "房屋外、庭院內各種懸掛物件，應於何時間點取下(如廣告招牌應釘牢)避免掉落傷人?", "o": ["颱風前", "颱風時", "颱風後", "平時作為"], "a": 0}, {"id": "6-6-01", "c": 6, "s": 6, "n": "01", "p": 129, "q": "下列關於證據保全之敘述，何者正確?", "o": ["向法院聲請保全證據時，不得聲請為鑑定", "保全證據之聲請，必須在起訴後，向受訴法院為之", "保全證據之聲請，釋明應保全證據之理由", "保全證據應由當事人聲請，法院不得依職權為之"], "a": 2}, {"id": "6-6-02", "c": 6, "s": 6, "n": "02", "p": 129, "q": "下列關於保全程序之敘述，何者正確?", "o": ["假處分不屬保全程序", "債權人就清償借款事件，欲保全強制執行時，得聲請假處分", "關於假處分之規定，原則上於定暫時狀態之處分準用之", "本案尚未繫屬者，債權人絕不得聲請假扣押"], "a": 2}, {"id": "6-6-03", "c": 6, "s": 6, "n": "03", "p": 129, "q": "就民法而言租賃標的物之失火，承租人應負下列何種責任?", "o": ["無過失", "具體輕過失", "通常事變", "重大過失"], "a": 3}, {"id": "6-6-04", "c": 6, "s": 6, "n": "04", "p": 129, "q": "不動產之租賃契約期限逾1年者，應以字據訂立之。若未以字據訂立者，其租賃契約將視為?", "o": ["租賃契約不成立", "租賃契約無效", "不定期限之租賃", "1年期限之租賃"], "a": 2}, {"id": "6-6-05", "c": 6, "s": 6, "n": "05", "p": 129, "q": "債權人向法院聲請發出支付命令後，債務人應於支付命令送達後幾日之不變期間內向法院提出異議，否則法院對於債務人逾期提出之異議，即應裁定予以駁回?", "o": ["10日", "20日", "30日", "5日"], "a": 1}, {"id": "6-6-06", "c": 6, "s": 6, "n": "06", "p": 129, "q": "甲與乙簽訂2年期間之不動產租賃書面契約時，須依下列何種方式始生效力?", "o": ["須經公證", "須親筆書寫書面契約", "各自得以蓋章代替簽名", "雙方皆須按捺指印"], "a": 2}, {"id": "6-6-07", "c": 6, "s": 6, "n": "07", "p": 130, "q": "出租人將土地出租予承租人興建房屋，如承租人遲付租金時，出租人於何種情形下得主張終止租賃契約？", "o": ["承租人積欠租金達2期之租額時", "承租人積欠租金達2期之租額時，並經出租人定一定期限之催告承租人給付租金，而承租人不於期限內繳納者", "承租人積欠租金達2年之租額時", "承租人積欠租金達2年之租額時，並經出租人定一定期限之催告承租人給付租金，而承租人不於期限內繳納者"], "a": 3}, {"id": "6-6-08", "c": 6, "s": 6, "n": "08", "p": 130, "q": "請問租金的請求權時效為幾年？", "o": ["2年", "5年", "10年", "15年"], "a": 1}, {"id": "6-6-09", "c": 6, "s": 6, "n": "09", "p": 130, "q": "下列何種請求得透過督促程序之支付命令為之？", "o": ["房東請求房客返還房屋", "房東請求房客因房客之侵權行為致房東之損害，請求房客支付損害賠償金額新臺幣30萬元", "房客請求房東交付租賃契約正本", "房客請求房東修繕房屋。"], "a": 1}, {"id": "6-6-10", "c": 6, "s": 6, "n": "10", "p": 130, "q": "房東甲出租房屋予房客未成年人乙，嗣房客乙於屋中自殺，如房東欲對房客乙之法定代理人丙進行民事侵權行為訴訟，請求房價減損之損害，請問下列何者不是房東甲應盡的舉證責任？", "o": ["乙明知或可得而之在他人家中自殺，會造成他人房價減損", "房屋因房客乙的自殺導致房價減損", "房價減損的金額", "證明丙的監督並未鬆懈，或縱加以相當之監督仍不免發生損害"], "a": 3}, {"id": "6-7-01", "c": 6, "s": 7, "n": "01", "p": 131, "q": "債權人就金錢請求或得易為金錢之請求，欲保全強制執行者，得向管轄法院為下列何種聲請?", "o": ["假執行", "假扣押", "假處分", "核發支付命令"], "a": 1}, {"id": "6-7-02", "c": 6, "s": 7, "n": "02", "p": 131, "q": "債權人就金錢請求以外之請求，欲保全強制執行者得進行何種聲請?", "o": ["假處分", "假執行", "假扣押", "訴訟救助"], "a": 0}, {"id": "6-7-03", "c": 6, "s": 7, "n": "03", "p": 131, "q": "出租人甲主張承租人乙積欠半年之租金及修繕費用，但是乙否認積欠租金，認為是甲任意調漲租金並虛報修繕費用。甲聲請依督促程序對乙發支付命令，乙因為不懂法律，在支付命令送達後20日之不變期間內並未向發命令之法院提出異議，甲即對乙聲請強制執行。下列敘述，何者與現行民事訴訟法規定相符？", "o": ["支付命令之救濟僅適用再審程序。所以乙只能提再審救濟程序", "支付命令不得為執行名義。故甲不可以拿執行命令聲請法院對乙強制執行", "支付命令與確定判決無同一之效力，所以乙得提起確認債權不存在之訴", "在執行程序中債務人乙不得提起確認債權不存在之訴"], "a": 2}, {"id": "6-7-04", "c": 6, "s": 7, "n": "04", "p": 131, "q": "出租人甲與承租人乙簽訂租賃契約後，覺得房租太低因而心生後悔，因而向乙請求調漲租金，被乙拒絕後，甲片面終止租賃契約，並已找好鎖匠欲換鎖並聯絡搬家公司，欲逕自將乙之物品搬走，請問乙應為何種主張，才能「即時」獲得司法救濟，確保居住之權利？", "o": ["向法院聲請甲不得為妨礙其使用租賃物（即房屋）之假處分請求", "向法院聲請假扣押甲之財產", "向市政府聲請不動產糾紛調處", "向鄉鎮市公所聲請調解"], "a": 0}, {"id": "6-8-01", "c": 6, "s": 8, "n": "01", "p": 132, "q": "甲無權占用乙所有土地，乙擬依不當得利之法則，向甲請求返還相當於租金之不當利益。該返還利益請求權之消滅時效期間為何?", "o": ["15年", "5年", "2年", "1年"], "a": 1}, {"id": "6-8-02", "c": 6, "s": 8, "n": "02", "p": 132, "q": "房東出租房屋予房客後，房客遲繳租金，房東因而欲終止契約並提起給付租金之訴訟，下列何者正確?", "o": ["房客遲繳租金達2個月可以直接終止", "房客遲繳租金達2個月還需要催告才可以終止", "房客遲繳租金達2個月還需要定期限催告，房客不繳後，才可以終止", "房東無須催告，可以直接拿租賃契約書前往強制執行"], "a": 2}, {"id": "6-8-03", "c": 6, "s": 8, "n": "03", "p": 132, "q": "房東出租房屋予房客，租約為1年，約定租約於民國106年12月31日屆期，屆期後房客沒有搬出去仍然按期交房租，房東收到租金後也沒表示反對的意思，此時租賃契約之效力為何？", "o": ["租約於107年1月1日起即失效", "租約於107年3月1日起即失效", "原租約視為以不定期限之租約繼續", "租賃契約自動延長效力1年"], "a": 2}, {"id": "6-8-04", "c": 6, "s": 8, "n": "04", "p": 132, "q": "依民事訴訟法規定，提起上訴，應於第一審判決送達後幾日之不變期間內為之?", "o": ["5日", "10日", "20日", "30日"], "a": 2}, {"id": "6-8-05", "c": 6, "s": 8, "n": "05", "p": 132, "q": "房客欠繳租金逾半年，平常上班又遇不到，為了催討租金，下列何者方式正確?", "o": ["直接拿鐵鍊鎖住大門不讓房客進出", "如果租賃標的是大樓社區，可以請管委會把房客進出的磁卡消磁，拒絕讓房客進出", "可以向鄉鎮市、區公所調解委員會聲請調解", "可以裝設攝影機，把鏡頭對準房客門口，以確認房客何時回家"], "a": 2}, {"id": "6-8-06", "c": 6, "s": 8, "n": "06", "p": 133, "q": "下列關於調解之敘述，何者正確?", "o": ["鄉鎮市區公所調解委員會所做成之民事調解經法院核定後，與民事確定判決有同一之效力", "在區公所調解委員會所做成之民事調解經法院核定後，覺得不合理，可以直接再向法院提告", "在區公所調解委員會所做成之民事調解經法院核定後，還是不得拿去聲請強制執行", "在區公所調解委員會所做成之民事調解經法院核定後，覺得要賠的錢太多，可以主張被詐欺而撤銷調解筆錄"], "a": 0}, {"id": "6-8-07", "c": 6, "s": 8, "n": "07", "p": 133, "q": "房東就房客於租賃期間使用房屋導致房屋所受損害之損害賠償，在房東知悉後，請求權時效為幾年？", "o": ["6個月", "1年", "2年", "5年"], "a": 2}, {"id": "6-8-08", "c": 6, "s": 8, "n": "08", "p": 133, "q": "關於法院管轄之規定，下列敘述何者正確?", "o": ["訴訟原則上由原告住所地之法院管轄", "不動產之物權或其分割或經界涉訟者，專屬不動產所在地之法院管轄", "兩造得以合意排除專屬管轄法院", "定法院之管轄，以判決時為準"], "a": 1}, {"id": "6-8-09", "c": 6, "s": 8, "n": "09", "p": 133, "q": "21歲之在學生甲向乙續租房屋半年，不料開學前接獲被退學通知。甲、乙之租賃契約效力如何?", "o": ["有效", "無效", "得撤銷", "效力未定"], "a": 0}, {"id": "6-8-10", "c": 6, "s": 8, "n": "10", "p": 134, "q": "房客積欠房東租金，房東如欲委由租賃住宅管理人員代行訴訟程序，下列何者正確？", "o": ["由房東出具委任狀予租賃住宅管理人員，經審判長許可後，可由租賃住宅管理人員為該訴訟之房東代理人", "直接去開庭即可", "直接去開庭即可，如果審判長制止，再坐到旁聽席發言即可", "房東委任的效力及於每個審級，租賃住宅管理人員一、二、三審都有代理權限"], "a": 0}, {"id": "6-8-11", "c": 6, "s": 8, "n": "11", "p": 134, "q": "房東甲將房屋出租予房客乙，租約二年，然乙承租半年後即拒絕給付租金達3個月，房東多次前往租屋處均未遇到乙，詢問鄰居丙，丙告知很久沒看到乙了，大概是搬走了吧等語，但房東並無證據確認房客乙已搬離，請問您如果為租賃住宅管理人員，應為如何之建議？", "o": ["房客乙已經搬走，而且租金已超過2個月沒繳，可以直接進入屋內清掃租給下一個房客", "房客乙已經搬走，而且租金已超過2個月沒繳，為求周全應該尋求管區員警及里長協助，強制開鎖進入", "發存證信函定期限催繳，逾期限仍未繳者，再發存證信函終止租約後，強行開鎖進入", "發存證信函定期限催繳，逾期限仍未繳者，再發存證信函終止租約後，向乙提出遷讓房屋之民事訴訟"], "a": 3}, {"id": "6-8-12", "c": 6, "s": 8, "n": "12", "p": 134, "q": "甲有A屋，出租且交付於乙。依民法之規定下列敘述何者正確？", "o": ["甲、乙間雖有反對轉租之約定，乙仍得將A屋一部出租於丙", "乙租金支付遲延，甲即得終止契約", "乙未經甲之承諾，將A屋全部轉租他人時，甲得終止契約", "乙違反租賃物之約定使用方法者，甲即得終止契約"], "a": 2}, {"id": "6-8-13", "c": 6, "s": 8, "n": "13", "p": 134, "q": "關於民事訴訟制度，下列敘述，何者正確？", "o": ["民事訴訟原則上不需繳交裁判費", "裁判費由被告先繳交", "訴訟代理人一定要委任律師為之", "並非所有民事訴訟均得提起第三審上訴"], "a": 3}, {"id": "6-8-14", "c": 6, "s": 8, "n": "14", "p": 134, "q": "關於民事訴訟制度，下列敘述，何者正確？", "o": ["民事訴訟當事人一定要親自到庭", "當事人如不到庭，法院得拘提之", "民事訴訟不得為公示送達", "民事訴訟當事人如果無法到庭，可以委託代理人到庭，經法院允許後就可以代理當事人為訴訟行為"], "a": 3}, {"id": "6-8-15", "c": 6, "s": 8, "n": "15", "p": 135, "q": "依民事訴訟法，下列何者不能作為執行名義聲請強制執行？", "o": ["訴訟上和解成立者", "法院之調解成立者", "到律師事務所簽訂並由律師見證的和解契約", "支付命令，債務人未於法定期間對之合法提出異議者"], "a": 2}, {"id": "6-8-16", "c": 6, "s": 8, "n": "16", "p": 135, "q": "甲向乙承租房屋，供經營餐廳之用，租期為25年，另向丙承租土地一筆，於該土地上建造房屋一棟，租期為30年。下列敘述，何者正確？", "o": ["兩個租賃契約期限均超過20年，應縮短為20年，並不得更新之", "甲乙間之租賃契約期限不受20年之限制，租期25年不受影響", "甲丙間之租賃契約期限不受20年之限制，租期30年不受影響", "兩個租賃契約期限均超過20年，應縮短為20年，但得更新之"], "a": 2}, {"id": "6-9-01", "c": 6, "s": 9, "n": "01", "p": 136, "q": "租賃契約已約定契約雙方不得提前終止契約，租賃期間若有發生下列何種情形，承租人仍得提前終止契約，出租人不得要求任何賠償？", "o": ["租賃住宅因地震而毀損致無法居住", "租賃處附近的鄰居麻將聲太大聲", "租賃處廁所管道間飄出煙味", "承租後才發現對面是墓園"], "a": 0}, {"id": "6-9-02", "c": 6, "s": 9, "n": "02", "p": 136, "q": "甲向乙承租A屋，但樓下鄰居丙反映A屋浴室漏水至鄰居B屋。乙欲進行浴室漏水的修繕，但修繕期間甲將會無法使用廁所。請問下列敘述何者正確?", "o": ["甲有配合乙的義務，故無法做任何主張", "甲必須配合修繕，乙應將不能使用的期間及部分換算金額折抵租金", "是丙的B屋漏水，甲可以選擇不配合處理", "甲不願配合處理，則乙不應該透過調解或訴訟而堅持進入"], "a": 1}, {"id": "6-9-03", "c": 6, "s": 9, "n": "03", "p": 136, "q": "甲出租其房屋於乙，契約並經公證，租賃物交付後，甲將房屋所有權移轉於丙，則下列敘述何者正確？", "o": ["因甲已出租於乙，故所有權之移轉無效", "因乙丙間無契約關係，故乙對丙而言為無權占有", "此時發生法定契約承擔，丙成為出租人", "甲乙間之租賃契約若為不定期，無買賣不破租賃之適用"], "a": 2}, {"id": "6-9-04", "c": 6, "s": 9, "n": "04", "p": 136, "q": "非房屋所有權人是否有出租房子的權利?", "o": ["雖非房屋所有權人，但只要是親人就可以任意出租給他人", "非房屋所有權人無權將房屋出租給他人", "非房屋所有權人若要將房屋出租給他人，需出示屋主同意書及代理文件", "非房屋所有權人若要出租房屋給他人，需透過租賃管理服務業才可"], "a": 2}, {"id": "6-9-05", "c": 6, "s": 9, "n": "05", "p": 136, "q": "簽約時，房客與房東約定好，應支付的押金3萬元將分3個月支付，並於合約中載明。但房客卻未依承諾繳付，請問房東能否依此終止租約?", "o": ["可以，因為是房客未依承諾履行，房東可以終止租約要求房客遷出", "可以，押金是房屋出租之必要項目，未全額支付押金，契約即無法生效", "可以，押金對房東是很重要的保障，若未照承諾支付當然可以終止租約", "不可以，因押金與租金性質不同，未支付並非是契約不成立，不可以任意終止"], "a": 3}, {"id": "6-9-06", "c": 6, "s": 9, "n": "06", "p": 137, "q": "租約1個月後即將到期，承租人已告知出租人期滿不再續約，但出租人就開始帶新房客來看屋，且未事前通知承租人。請問承租人能否拒絕出租人的帶看要求?", "o": ["可以，承租後使用權是在承租人，出租人不可以任意進出", "不可，房子為出租人所有，出租人當然可以帶人進入看屋", "不可以，因為拒絕會讓出租人不高興，所以最好還是配合，否則押金返還會被房東刁難", "不可以，因為要好聚好散，不要因為這件事吵架"], "a": 0}, {"id": "6-9-07", "c": 6, "s": 9, "n": "07", "p": 137, "q": "租約期滿雙方會同點交時，出租人認為承租人沒有愛護房子讓牆壁有斑駁褪色，所以要從押金中扣除清潔及粉刷費，但承租人認為並未刻意破壞並已做好清潔工作，故出租人不得自押金中扣除清潔與粉刷費用。下列敘述何者正確?", "o": ["除非契約另有約定，否則承租人有返還原狀的義務，故油漆剥落都應該由承租人負責", "承租人無刻意破壞房屋，且已回復原狀但牆面斑駁褪色是自然耗損，出租人不得要求承租人負擔清潔與粉刷費", "這是出租要負擔的成本，當然是出租人要自己處理，但也可以要求承租人要回復原狀", "承租人返還房屋時應以原狀返還，所以承租人應要先做好清潔及全室粉刷後才能退租"], "a": 1}, {"id": "6-10-01", "c": 6, "s": 10, "n": "01", "p": 138, "q": "住宅租賃契約之修繕責任，若契約中無特別明訂，修繕責任是歸屬於哪一方?", "o": ["承租人", "出租人", "保證人", "出租人及承租人一人一半"], "a": 1}, {"id": "6-10-02", "c": 6, "s": 10, "n": "02", "p": 138, "q": "租賃期間下列何種情形，非出租人法定終止權?", "o": ["承租人遲繳租金1星期", "承租人未經出租人同意，進行室內裝修", "承租人未依租賃住宅使用規定，違法使用租賃物", "承租人積欠管理費已達2個月租金，定相當期限催告仍不為給付"], "a": 0}, {"id": "6-10-03", "c": 6, "s": 10, "n": "03", "p": 138, "q": "請問房東是否可將房子出租給未成年的大學生？", "o": ["不可以，一定要成年才能承租", "可以，但須取得法定代理人之同意", "可以，但除了法定代理人同意外，還要陪同簽約才可以", "契約自由原則，誰都可以簽名"], "a": 1}, {"id": "6-10-04", "c": 6, "s": 10, "n": "04", "p": 138, "q": "甲向乙承租A屋，承租的第2年租約到期後並無重新訂契，至今已承租了10年。甲想要回鄉下生活，臨時向乙表示一個月後要搬走，但乙卻說提前終止須沒收2個月押金。下列敘述何者正確？", "o": ["租約到期後沒簽新約，乙當然不能扣除甲的押金", "此租約已是不定期租約，甲可以依習慣終止合約，乙不能扣除違約金", "依定型化契約規定，可以扣違約金一個月", "甲提出租約終止需經乙的同意，所以押金乙可以沒收"], "a": 1}, {"id": "6-10-05", "c": 6, "s": 10, "n": "05", "p": 138, "q": "房東經房客反映進行浴室漏水的修繕處理，但施工多日影響到房客的居住品質。下列敘述何者正確？", "o": ["房客有配合及容忍的義務，但可與房東協商不能居住得損失賠償", "房客有配合及容忍的義務，不須做任何處理", "工程期間難免造成這樣結果，忍耐幾天即可", "房客要進行蒐證，但就算房東在修繕過程中導致自己的物品受損，也不能提出損壞賠償要求"], "a": 0}, {"id": "6-10-06", "c": 6, "s": 10, "n": "06", "p": 139, "q": "承租人因個人因素想要提前終止租約，但出租人表示要扣下2個月押金做為違約金。雙方查看當初簽訂的租約內容，並未約定有提前終止事項。下列敘述何者正確？", "o": ["未約定提前終止條文，代表雙方可隨時終止租約，且無任何罰則", "未約定提前終止條文，需經雙方同意方能終止，或協商賠償金額", "未約定提前終止，若想提前終止只要提前1個月告知，就可終止租約", "未約定提前終止，但只要有提前1個月告知及賠償月的違約金，即可提前終止"], "a": 1}, {"id": "6-10-07", "c": 6, "s": 10, "n": "07", "p": 139, "q": "簽約時，房東並未表示不可飼養寵物，但承租後卻向房客表示因為房客飼養寵物，故要終止租約。下列敘述何者正確？", "o": ["房客承租已有使用權利，且在簽約時未做聲明，因此房客當然可以養寵物，房東不得事後再禁止。（到期時房客要將房屋回復原狀返還）", "除非房客出具承諾書會把寵物管好、弄乾淨，不然房東還是可以終止租約", "房東要求雖然沒有不法，但契約沒有約定，房客應該容忍配合一下", "契約簽定前房東雖未表明，但養寵物非普遍性可接受的範圍，在房客未先詢問下，不可因既成事實而要求房東配合容忍"], "a": 0}, {"id": "6-10-08", "c": 6, "s": 10, "n": "08", "p": 139, "q": "甲向乙承租A屋，但丙向甲出示相關證明表示自己才是A屋的所有權人，且無同意任何人出租A屋，並要求甲應於3日內遷出。下列敘述何者正確？", "o": ["甲須先向乙協商並確認乙有無出租之權利，如果乙真的沒有出租的權利，甲只能終止與乙的契約，再向乙求償", "雖然丙出現，但乙已將權利轉租給甲，甲仍有權利住到租約期滿", "甲必須於3日內立刻搬離，但丙應返還給甲當初所支付之押金", "甲不用搬離，請丙找到乙再來談後續收回房屋之事，否則請丙支付給甲搬遷費用及返還押金"], "a": 0}, {"id": "6-10-09", "c": 6, "s": 10, "n": "09", "p": 140, "q": "甲向乙承租一間雅房居住使用，雙方在契約中並未對轉租與否等內容做約定。乙後來發現甲帶朋友丙進來一起居住並收取租金，故乙向甲表示這算轉租，所以要求終止租約。請問下列敘述何者正確？", "o": ["法律規定，若沒有特別載明不能轉租，則乙無法依此終止租約", "甲承租已有使用權利，乙不能干涉", "甲承租後再與丙合住，並向丙收取租金，已為收益行為，在未告知房東下，已違反租賃住宅市場發展及管理條例規定，乙當然可以終止租約", "乙可以要求漲租，但不能要求終止租約"], "a": 2}, {"id": "6-10-10", "c": 6, "s": 10, "n": "10", "p": 140, "q": "租約到期承租人欲點交返還住宅，但出租人一直說太忙沒空處理，依租賃住宅市場發展及管理條例規定，請問承租人可以下列何者方式處理？", "o": ["先通知出租人約定點交，屆期不出現就將鑰匙投入信箱或交管理員，請出租人自己去拿取，並請出租人返還押金", "向出租人表示點交時間，如出租人點交時未到，經承租人定相當期限催告後，等期限到了，出租人仍藉故拒不點交，就直接視同完成點交", "出租人不出面點交，什麼都不用作，而且鑰匙可先不必返還，等出租人退還押金後再返還鑰匙", "發存證信函告知出租人已返還房屋，不必將鑰匙寄回，其他費用請出租人結算後限期返還押金"], "a": 1}, {"id": "6-10-11", "c": 6, "s": 10, "n": "11", "p": 140, "q": "點交完成後，房東表示因水電、瓦斯、管理費尚未結清，也擔心事後發現有任何問題無法找到房客負責，故要先扣下全部押金，待1個月後再做返還。但房客執意當下要拿回押金，請問雙方可以如何處理？", "o": ["一般出租都是這樣在處理租屋押金的，房客必須配合", "若房屋點交後才發現問題，很難再找到房客負責，惟有先扣下押金才能掌握後續扣款", "房東應該先還1個月押金給房客，等帳單來了結清後再做返還", "房客可與房東以先請台水、台電及瓦斯公司進行水電瓦斯費的結算並結清，即可要求返還剩餘押金"], "a": 3}, {"id": "6-10-12", "c": 6, "s": 10, "n": "12", "p": 141, "q": "出租人原則同意屋內設備等均由出租人負責修繕，但簽約時出租人另外加註若為消耗品則是由承租人自行負責。承租人入住1個月後發現馬桶止水軟墊磨損漏水，承租人告知出租人應進行修繕，但出租人表示這是消耗品，依約定應為承租人自行負責。請問下列敘述何者正確？", "o": ["止水軟墊並沒有寫在契約的設備清單中，當然算消耗品", "是否為消耗品因無法認定，所以誰都不能進行修繕", "消耗品認定無法律明文規定，雙方只能協商方式處理，並在協商時對物品修繕再做清楚責任釐清", "承租人自行修繕後再從租金中直接扣除即可"], "a": 2}, {"id": "6-10-13", "c": 6, "s": 10, "n": "13", "p": 141, "q": "承租人承租房屋後，能否未經出租人同意即自行更換鎖具？", "o": ["可以，承租人有使用權，為保障個人生命財產安全及隱私，有權利更換鎖具，但最好把原本的鎖具保留", "不可以，房子非承租人所有，雖有使用權，但更換鎖具仍經由出租人同意", "可以，但承租人換鎖後須將備份鑰匙留存一套給出租人", "不可以，換鎖後出租人就無法隨時進入做維修，所以承租人不可任意換鎖"], "a": 0}, {"id": "6-10-14", "c": 6, "s": 10, "n": "14", "p": 141, "q": "承租人在租約到期點退返還房屋後，一直未將戶籍自租賃地中遷出。請問房屋所有權人該如何處理？", "o": ["不用處理，等承租人自己找到房子後自然會遷走", "房屋所有權人可親自到戶政事務所，舉證該承租人已無居住事實及簽切結書即可辦理承租人之戶籍遷出", "房屋所有權人可親自到調解委員會，舉證該承租人已無居住事實及簽切結書即可辦理承租人之戶籍遷出", "想辦法請承租人自己出面去戶政事務所辦理遷出"], "a": 1}, {"id": "6-10-15", "c": 6, "s": 10, "n": "15", "p": 141, "q": "甲向乙承租住家一間，於繳租日時延遲多日未繳，乙告知甲契約當中已簽下：「租金延遲繳交3日者，本租約自動失效，房客所有物品視為廢棄物處理。」甲已欠租超過3天，乙要求甲立刻搬離，否則將丟棄甲屋內物品，試問乙的處理方式是正確的嗎？", "o": ["可以，契約自由原則，甲承諾不延遲繳交，乙當可依契約執行", "不可以，依民法規定，欠租須累計至2個月的租金額度，甲才能終止契約", "不可以，房東應有容忍的義務，延遲付租非不付租金，要先通知房客繳租，房客若仍不付租金，才可終止租約。", "可以，付租是應該的，房東收不到租金，自然無須再提供租賃物"], "a": 1}, {"id": "6-10-16", "c": 6, "s": 10, "n": "16", "p": 142, "q": "甲向乙承租房屋居住使用，契約尚餘2個月到期，甲告知乙，直接自押金扣抵即可，日後就無須再返還押租金，請問甲的做法是正確的嗎？", "o": ["押金是可清償租賃契約所產生的債務，甲為押金支付者，當然有權決定扣抵", "押金為承租人擔保承租期間損害賠償行為和處理遺留物責任，預先支付之金錢，房客不可任意主張扣抵", "為避免甲在返還房屋時被乙隨意扣抵押金，甲為自保當然可以主張扣抵", "甲若不支付租金，自然刑成債務，押金可做清償租賃期間所生之債務，因此，甲根本不用告知房東，直接扣抵即可"], "a": 1}, {"id": "6-10-17", "c": 6, "s": 10, "n": "17", "p": 142, "q": "房東甲賣屋後，新屋主乙接手後告知現有承租戶丙，舊有租約雖然租期未達五年但已不適用，要重新簽定新約，若不簽約，丙將無權在此居住，請問下列敍述何者正確？", "o": ["依民法規定房屋轉讓，原有房客雖有居住權利，但租約仍應重新簽定", "乙已成為新屋主，可自行決定是否要重新簽定租約", "依民法規定，房屋經轉讓他人，原有契約對房客仍然有效", "依土地法規定，房屋經轉讓他人，原有契約對房客仍然有效"], "a": 2}, {"id": "7-1-01", "c": 7, "s": 1, "n": "01", "p": 143, "q": "住戶大門口若有懸掛張貼白底黑字之「避難器具」標示，則此住戶內部應有哪一種消防設備？", "o": ["自動撒水", "火警自動警報", "廣播喇叭", "避難逃生設備如緩降機"], "a": 3}, {"id": "7-1-02", "c": 7, "s": 1, "n": "02", "p": 143, "q": "某具有撒水設備的住宅，若大門口任一側撒水管路有制水閥開關之設計，則該開關應保持何種狀態？", "o": ["該樓層所有住戶應共同協議開啟與否", "應依照公寓大廈規約規定開啟與否", "應保持關閉以防止漏水", "應保持開啟狀態"], "a": 3}, {"id": "7-1-03", "c": 7, "s": 1, "n": "03", "p": 143, "q": "RC表示為哪一種建築物之結構代號？", "o": ["磚造", "加強磚造", "鋼筋混凝土造", "木構造"], "a": 2}, {"id": "7-1-04", "c": 7, "s": 1, "n": "04", "p": 143, "q": "SRC表示為哪一種建築物之結構代號？", "o": ["磚造", "加強磚造", "鋼骨鋼筋混凝土造", "鋼筋混凝土造"], "a": 2}, {"id": "7-1-05", "c": 7, "s": 1, "n": "05", "p": 143, "q": "B表示為哪一種建築物之結構代號？", "o": ["磚造", "加強磚造", "鋼骨鋼筋混凝土造", "鋼筋混凝土造"], "a": 0}, {"id": "7-1-06", "c": 7, "s": 1, "n": "06", "p": 143, "q": "RB表示為哪一種建築物之結構代號？", "o": ["磚造", "加強磚造", "鋼骨鋼筋混凝土造", "鋼筋混凝土造"], "a": 1}, {"id": "7-1-07", "c": 7, "s": 1, "n": "07", "p": 144, "q": "結構圖說中，C表示哪一種結構構件代號？", "o": ["柱", "承重牆", "板", "牆"], "a": 0}, {"id": "7-1-08", "c": 7, "s": 1, "n": "08", "p": 144, "q": "結構圖說中，W表示哪一種結構構件代號？", "o": ["柱", "承重牆", "板", "牆"], "a": 3}, {"id": "7-1-09", "c": 7, "s": 1, "n": "09", "p": 144, "q": "結構圖說中，BW表示哪一種結構構件代號？", "o": ["柱", "承重牆", "板", "牆"], "a": 1}, {"id": "7-1-10", "c": 7, "s": 1, "n": "10", "p": 144, "q": "結構圖說中，SW表示哪一種結構構件代號？", "o": ["柱", "剪力牆", "板", "牆"], "a": 1}, {"id": "7-1-11", "c": 7, "s": 1, "n": "11", "p": 144, "q": "結構圖說中，S表示哪一種結構構件代 "], "a": 3}, {"id": "7-4-07", "c": 7, "s": 4, "n": "07", "p": 154, "q": "住宅用火災警報器，為了避免警報器本體劣化而影響功能，建議設置超過多久時，最好更換新品？", "o": ["1年", "2年", "10年", "5年"], "a": 2}, {"id": "7-4-08", "c": 7, "s": 4, "n": "08", "p": 154, "q": "住宅總電源斷路器忽然跳脫，下列何種為可能之原因？", "o": ["台電停電", "用電負載超過額定容量", "附近打雷", "大樓正在測試發電機"], "a": 1}, {"id": "7-4-09", "c": 7, "s": 4, "n": "09", "p": 154, "q": "廚房多為大功率電器產品，且容易為潮濕區域，下列何種作為可強化用電安全？", "o": ["加裝小夜燈", "插座上加裝漏電斷路器", "使用110V電壓代替220V電壓", "使用具備USB充電功能之插座"], "a": 1}, {"id": "7-4-10", "c": 7, "s": 4, "n": "10", "p": 154, "q": "住宅內火警探測器亮起紅燈時，表示下列哪一種狀況？", "o": ["瓦斯外洩警報", "一氧化碳警報", "該火警分區線路斷線", "該探測器動作中"], "a": 3}, {"id": "7-4-11", "c": 7, "s": 4, "n": "11", "p": 154, "q": "有關室內裝修是否可以使用公共的消防緊急用電，下列何者正確？", "o": ["應經管理委員會同意即可使用", "可使用，但不得作為溶劑噴漆使用", "可任意使用", "禁止使用"], "a": 3}, {"id": "7-4-12", "c": 7, "s": 4, "n": "12", "p": 154, "q": "購買延長線應認明有哪一種安全標章以維護安全？", "o": ["節能標章", "商品安全標章", "環保標章", "綠色標章"], "a": 1}, {"id": "7-4-13", "c": 7, "s": 4, "n": "13", "p": 154, "q": "住戶內部客廳之消防撒水頭滲漏水，應做下列哪一種維修處置？", "o": ["關閉火警自動警報設備", "關閉火警自動廣播設備", "關閉瓦斯開關", "關閉當戶或當樓層制水閥並進行檢修"], "a": 3}, {"id": "7-4-14", "c": 7, "s": 4, "n": "14", "p": 155, "q": "陶瓷臉盆就安全性而言，下列哪一種樣式安全係數較高？", "o": ["檯面式", "壁掛式", "支架式", "不附檯面壁掛式"], "a": 0}, {"id": "7-4-15", "c": 7, "s": 4, "n": "15", "p": 155, "q": "衛浴設備應選用有下列哪一種標示的產品，以維護使用安全？", "o": ["出廠證明", "正字標記或商品檢驗標識的產品", "工地主任驗收合格證明", "環保節能標章"], "a": 1}, {"id": "7-4-16", "c": 7, "s": 4, "n": "16", "p": 155, "q": "一般而言，大樓住戶廚房內壁面插座為紅色，下列何者為此插座之用途？", "o": ["供火警發生時緊急用電", "台電停電時，此插座由大樓發電機供電，可供冰箱使用", "屬於消防火警自動警報設備", "屬於消防自動廣播設備"], "a": 1}, {"id": "7-4-17", "c": 7, "s": 4, "n": "17", "p": 155, "q": "若發生浴缸排水堵塞或水流很慢之情形，一般而言，浴缸排水清潔維修口都位於下列哪一位置？", "o": ["浴缸側邊立面有清潔維修口", "需要拆除浴缸", "需要至樓下拆除排水管", "清潔口與馬桶清潔口共用"], "a": 0}, {"id": "7-4-18", "c": 7, "s": 4, "n": "18", "p": 155, "q": "臉盆排水堵塞或水流很慢，一般而言，臉盆排水清潔口都位於哪裡？", "o": ["臉盆下方存水彎旁有清潔維修口", "需要拆除浴缸", "需要至樓下拆除排水管", "清潔口與馬桶清潔口共用"], "a": 0}, {"id": "7-4-19", "c": 7, "s": 4, "n": "19", "p": 155, "q": "大樓屋頂平台偶有聞到臭味，且臭味來自頂樓平台排氣墩，則此排氣墩屬於哪
