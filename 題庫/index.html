？", "o": ["0.5公尺", "1公尺", "1.5公尺", "0.1公尺"], "a": 2}, {"id": "7-5-14", "c": 7, "s": 5, "n": "14", "p": 158, "q": "天花板設排氣口或回風口時，偵煙式探測器應裝置於排氣口或回風口周圍多少公尺內？", "o": ["2公尺", "1公尺", "3公尺", "5公尺"], "a": 1}, {"id": "8-1-01", "c": 8, "s": 1, "n": "01", "p": 159, "q": "下列何者為建築法建築管理的法定立法意旨？", "o": ["公平", "善良社會", "健全租屋市場", "維護公共交通"], "a": 3}, {"id": "8-1-02", "c": 8, "s": 1, "n": "02", "p": 159, "q": "位於新北市板橋區的建築物，地方主管建築機關是哪個政府單位？", "o": ["內政部", "營建署", "新北市政府", "板橋區公所"], "a": 2}, {"id": "8-1-03", "c": 8, "s": 1, "n": "03", "p": 159, "q": "位於新北市板橋區的建築物，中央主管建築機關是哪個政府單位？", "o": ["內政部", "營建署", "新北市政府", "板橋區公所"], "a": 0}, {"id": "8-1-04", "c": 8, "s": 1, "n": "04", "p": 159, "q": "下列何為建築技術規則設備編中所定義之建築物設備？", "o": ["安全梯", "招牌廣告", "消防", "圍牆"], "a": 2}, {"id": "8-1-05", "c": 8, "s": 1, "n": "05", "p": 159, "q": "建築物建造完成後之變更使用，應請領哪一種建築執照？", "o": ["建造執照", "雜項執照", "使用執照", "拆除執照"], "a": 2}, {"id": "8-1-06", "c": 8, "s": 1, "n": "06", "p": 159, "q": "建築物除經過地方主管建築機關許可外，非經領得哪一種建築執照，不准接水、接電及使用？", "o": ["建造執照", "雜項執照", "拆除執照", "使用執照"], "a": 3}, {"id": "8-1-07", "c": 8, "s": 1, "n": "07", "p": 160, "q": "依建築法規定那些人應維護建築物合法使用與其構造及設備安全？", "o": ["中央主管機關", "地方主管機關", "公寓大廈管理服務人員", "所有權人"], "a": 3}, {"id": "8-1-08", "c": 8, "s": 1, "n": "08", "p": 160, "q": "哪一種建築物，應由建築物所有權人、使用人定期委託中央主管建築機關認可之專業機構或人員檢查簽證？", "o": ["集合住宅", "超過3戶以上之集合住宅", "供公眾使用之建築物", "出租之建築物"], "a": 2}, {"id": "8-1-09", "c": 8, "s": 1, "n": "09", "p": 160, "q": "6層以上集合住宅之地面1層室內裝修應符合哪些規定？", "o": ["裝修材料應合於建築技術規則之規定", "需留意美感", "得妨害或破壞防火避難設施", "得妨害或破壞消防設備"], "a": 0}, {"id": "8-1-10", "c": 8, "s": 1, "n": "10", "p": 160, "q": "下列何種為建築法所定義之主要構造？", "o": ["浴缸", "承重牆壁", "非承重牆壁", "天花板"], "a": 1}, {"id": "8-1-11", "c": 8, "s": 1, "n": "11", "p": 160, "q": "公寓大廈承租人如需要進行室內裝修，需要遵守之下列何種規定？", "o": ["應經出租人同意之規定", "無須經出租人同意之規定", "增加窗簾應申請法定室內裝修施工許可。", "增加活動隔屏應申請法定室內裝修施工許可"], "a": 0}, {"id": "8-1-12", "c": 8, "s": 1, "n": "12", "p": 160, "q": "未依建築法第77條第1項規定維護建築物合法使用與其構造及設備安全者，地方主管建築機關不會對所有權人做何種處分？", "o": ["罰鍰", "限期改善", "補辦手續", "強制出讓產權"], "a": 3}, {"id": "8-1-13", "c": 8, "s": 1, "n": "13", "p": 161, "q": "既存違章建築影響公共安全者，當地主管建築機關應訂定拆除計畫限期拆除；所謂影響公共安全者為下列何種行為？", "o": ["違章建築住宅用途占用法定空地", "露臺增建雨遮", "違章建築樓層達2層以上", "違章建築樓層達1層以上"], "a": 2}, {"id": "8-1-14", "c": 8, "s": 1, "n": "14", "p": 161, "q": "一定規模以下之招牌廣告及樹立廣告，得免申請哪一種建築執照？", "o": ["建照執照", "雜項執照", "使用執照", "拆除執照"], "a": 1}, {"id": "8-1-15", "c": 8, "s": 1, "n": "15", "p": 161, "q": "建築物變更防火區劃，與原核定使用不合之變更者，應申請變更使用執照。但建築物在一定規模以下之使用變更，不在此限。前項一定規模以下之免辦理變更使用執照相關規定，由誰制定之？", "o": ["內政部", "縣市政府", "管理委員會", "公寓大廈規約"], "a": 1}, {"id": "8-2-01", "c": 8, "s": 2, "n": "01", "p": 162, "q": "公寓大廈長期管理維護經費來源之一為起造人依造價提撥一定比例或金額，下列何者為造價的定義？", "o": ["承造人實際承攬總價為造價", "房屋總銷售金額為造價", "建照執照載明之工程造價", "房屋銷售金額扣除土地價金為造價"], "a": 2}, {"id": "8-2-02", "c": 8, "s": 2, "n": "02", "p": 162, "q": "為了對公寓大廈進行長期性維護，應設置公共基金，而區分所有權人應依照何種決議繳納之？", "o": ["區分所有權人會議決議", "住戶大會決議", "管理委員會決議", "管理負責人訂定之"], "a": 0}, {"id": "8-2-03", "c": 8, "s": 2, "n": "03", "p": 162, "q": "建築物電梯設備各種組件應檢討耐用基準年限及定期維護更換，耐用基準年限由下列何者制定之？", "o": ["起造人", "承造人", "區分所有權人會議", "昇降設備專業廠商"], "a": 3}, {"id": "8-2-04", "c": 8, "s": 2, "n": "04", "p": 162, "q": "公寓大廈建築物一樓店鋪為方便營業使用，下列有關是否可敲除結構立柱之敘述，何者正確？", "o": ["應視公寓大廈規約是否禁止", "專有部分可以敲除結構", "依照公寓大廈管理條例得排除他人干涉", "不得任意敲除結構"], "a": 3}, {"id": "8-2-05", "c": 8, "s": 2, "n": "05", "p": 162, "q": "為強化高密度使用集合住宅及住宅安全管理，集合住宅、住宅任一住宅單位（戶）之任一樓層分間為6個以上使用單元（不含客廳及餐廳）或設置10個以上床位之居室者，其使用類組歸屬認定為下列哪一類組？", "o": ["旅館", "不變", "辦公室", "宿舍"], "a": 3}, {"id": "8-2-06", "c": 8, "s": 2, "n": "06", "p": 163, "q": "為增進公寓大廈區分所有權人共同利益，規約可經由區分所有權人制定，在尚未制定之前，規約草約是由下列何者訂定？", "o": ["起造人於申請建照執照時訂定", "由中央主管機關訂定", "在區分所有權人會議決議前無法訂定規約草約", "由管理服務人訂定"], "a": 0}, {"id": "8-2-07", "c": 8, "s": 2, "n": "07", "p": 163, "q": "舊有5層以下公寓可以依照法令鬆綁下合法增設昇降機，該公寓應以何時前領得使用執照才符合法令不計入建築面積與樓地板面積之規定？", "o": ["中華民國107年2月27日以前", "中華民國105年2月27日以前", "中華民國104年2月27日以前", "中華民國100年2月27日以前"], "a": 3}, {"id": "8-2-08", "c": 8, "s": 2, "n": "08", "p": 163, "q": "為節約能源，於屋頂設置太陽能熱水系統，其高度應以多少公尺以下者，得免依建築法規定申請雜項執照？", "o": ["10公尺", "6公尺", "3公尺", "2公尺"], "a": 3}, {"id": "8-2-09", "c": 8, "s": 2, "n": "09", "p": 163, "q": "招牌廣告及樹立廣告許可期限屆滿後，原雜項使用執照及許可失其效力，應重新申請審查許可或恢復原狀，則有關招牌廣告及樹立廣告許可之有效期限為幾年？", "o": ["1年", "3年", "5年", "10年"], "a": 2}, {"id": "8-2-10", "c": 8, "s": 2, "n": "10", "p": 163, "q": "公寓大廈屋頂平台設立廣告除應經循法令申請外，還應得下列何者之同意？", "o": ["管理委員會", "頂樓住戶", "頂樓區分所有權人", "頂樓承租人"], "a": 2}, {"id": "8-2-11", "c": 8, "s": 2, "n": "11", "p": 163, "q": "招牌廣告應在明顯處附永久標示，註明廣告燈製造廠名稱、電源電壓及輸入電流，請問下列何者為標示這些資訊之目的？", "o": ["以備日後檢查之用", "驗收計價使用", "環保檢查之用", "消防檢查之用"], "a": 0}, {"id": "8-2-12", "c": 8, "s": 2, "n": "12", "p": 164, "q": "有關浴廁天花板淨高原則，不得小於多少公尺？", "o": ["3公尺", "2.5公尺", "2.1公尺", "1.6公尺"], "a": 2}, {"id": "8-3-01", "c": 8, "s": 3, "n": "01", "p": 165, "q": "建築物與鄰房規劃設計留設防火間隔(防火巷弄)，規劃設計之目的為何？", "o": ["阻隔火災延燒", "增加採光通風", "增加停車空間", "增加綠覆率"], "a": 0}, {"id": "8-3-02", "c": 8, "s": 3, "n": "02", "p": 165, "q": "公寓大廈與鄰房規劃設計留設防火間隔(防火巷弄)，是否可以約定給鄰近一樓之區分所有權人專用？", "o": ["可約定專用，但不得違章建築", "不可約定專用", "應經區分所有權人會議同意方能約定專用", "應經規約約定方能約定專用"], "a": 1}, {"id": "8-3-03", "c": 8, "s": 3, "n": "03", "p": 165, "q": "火災及地震發生時，是否可以搭乘電梯以利快速疏散？", "o": ["不可以", "可以", "僅能搭乘緊急用昇降機", "僅能搭乘行動不便電梯"], "a": 0}, {"id": "8-3-04", "c": 8, "s": 3, "n": "04", "p": 165, "q": "緊急發電機如果無法自動啟動，首先應檢查哪一個單元？", "o": ["ATS單元", "檢查機油", "檢查操作開關是否置於手動而非自動", "檢查冷卻水"], "a": 2}, {"id": "8-3-05", "c": 8, "s": 3, "n": "05", "p": 165, "q": "不銹鋼水龍頭可以用哪一種家庭隨手可得物品，簡單又安全的擦拭，恢復光亮？", "o": ["沐浴乳", "粗糙菜瓜布", "牙膏", "針車油"], "a": 2}, {"id": "8-3-06", "c": 8, "s": 3, "n": "06", "p": 165, "q": "陶瓷馬桶不適合使用哪一種清潔方式？", "o": ["滾燙的熱水", "刷子", "海綿", "中性清潔劑"], "a": 0}, {"id": "8-3-07", "c": 8, "s": 3, "n": "07", "p": 166, "q": "熱水器與瓦斯管連接處，可以用何種簡單安全方式檢查是否有瓦斯漏氣？", "o": ["使用打火機觀察火焰是否變大", "使用火柴觀察火焰是否變大", "觀察熱水溫度是否有變化", "使用肥皂水泡沫檢查"], "a": 3}, {"id": "8-3-08", "c": 8, "s": 3, "n": "08", "p": 166, "q": "浴室用電能熱水器，裝設漏電斷路器的目的為？", "o": ["節能減碳", "防止感電", "防止竊電", "保持恆溫"], "a": 1}, {"id": "8-3-09", "c": 8, "s": 3, "n": "09", "p": 166, "q": "插座中有較長與較短的孔，較長的孔稱為？", "o": ["中性極", "長邊極", "火線極", "導電極"], "a": 0}, {"id": "8-3-10", "c": 8, "s": 3, "n": "10", "p": 166, "q": "附有接地極的插座，接地極的功能為何？", "o": ["用電安全", "用電平衡", "防止相序錯亂", "防止竊電"], "a": 0}, {"id": "8-3-11", "c": 8, "s": 3, "n": "11", "p": 166, "q": "疑似瓦斯漏氣時，應如何處置？", "o": ["開燈檢查", "開啟電風扇加強換氣", "用打火機加強局部照明", "開啟窗戶"], "a": 3}, {"id": "8-3-12", "c": 8, "s": 3, "n": "12", "p": 166, "q": "瓦斯爐火焰呈現哪一種顏色，表示燃燒不完全，有一氧化碳產生疑慮？", "o": ["內焰淡青色", "外焰藍紫色", "火焰頂端淡黃色", "火焰頂端藍紫色"], "a": 2}, {"id": "8-3-13", "c": 8, "s": 3, "n": "13", "p": 166, "q": "設置燃氣器具之室內裝修材料，應達耐燃幾級以上？", "o": ["4級", "3級", "2級", "目前並無規定"], "a": 2}, {"id": "8-3-14", "c": 8, "s": 3, "n": "14", "p": 167, "q": "火災的形成有三個要素，可燃性物質、氧氣及熱源。室內裝修採用防火材料是為了減少哪一種物質？", "o": ["可燃性物質及氧氣混合物", "可燃性物質", "氧氣", "熱源"], "a": 1}, {"id": "8-3-15", "c": 8, "s": 3, "n": "15", "p": 167, "q": "下列哪一種物品能使初期火災的微小火源沒有擴大延燒的機會，也就是消防法中的主要立法意旨？", "o": ["防焰物品", "耐燃裝修材料", "火警自動警報", "滅火器"], "a": 0}, {"id": "8-3-16", "c": 8, "s": 3, "n": "16", "p": 167, "q": "下列何種物品並非消防法中所規範之防焰物品？", "o": ["窗簾", "布幕", "地毯", "壁紙"], "a": 3}, {"id": "8-3-17", "c": 8, "s": 3, "n": "17", "p": 167, "q": "下列何種物品為消防法中所規範之防焰物品？", "o": ["展示用廣告板", "傢飾布", "高層建築物使用之床單", "被套"], "a": 0}, {"id": "8-3-18", "c": 8, "s": 3, "n": "18", "p": 167, "q": "防焰物品不得以哪一種方式表示防焰標章？", "o": ["防焰證明附於租賃契約中", "張貼於防焰物品", "縫製於防焰物品", "鑲釘於防焰物品"], "a": 0}, {"id": "8-3-19", "c": 8, "s": 3, "n": "19", "p": 167, "q": "老人族群在建築物火災避難逃生中可說是高危險的族群。盡量讓年紀較大或行動不便之長者，居住在哪種房間以強化安全？", "o": ["選擇居住越高樓層越安全", "選擇居住低樓層且靠近逃生出口的房間。", "選擇遠離安全梯的房間", "選擇鄰近電梯的房間"], "a": 1}, {"id": "8-4-01", "c": 8, "s": 4, "n": "01", "p": 168, "q": "下列何種並非高層建築物防災中心設置目的？", "o": ["提供建築物中央空調", "顯示各種防災設備", "控制各種防災設備", "災難發生時之指揮中心"], "a": 0}, {"id": "8-4-02", "c": 8, "s": 4, "n": "02", "p": 168, "q": "為維護建築物使用安全，集合住宅中，樓梯高度超過多少公分就應設置扶手？", "o": ["30公分", "60公分", "90公分", "100公分"], "a": 3}, {"id": "8-4-03", "c": 8, "s": 4, "n": "03", "p": 168, "q": "下列何種為消防設備？", "o": ["滅火器", "緊急進口", "緊急用昇降機", "太陽能發電"], "a": 0}, {"id": "8-4-04", "c": 8, "s": 4, "n": "04", "p": 168, "q": "建築物公共安全檢查簽證及申報辦法是依據哪一種法律由內政部訂定發布？", "o": ["消費者保護法", "建築法", "公寓大廈管理條例", "消防法"], "a": 1}, {"id": "8-4-05", "c": 8, "s": 4, "n": "05", "p": 168, "q": "建築物公共安全檢查簽證申報自民國85年實施至今，最新相關內容修正為增加建築物附設防空避難設備檢查，自何時開始生效?", "o": ["民國113年1月1日", "民國114年7月1日", "尚未生效，仍待討論", "內政部授權各縣市政府公布生效時間"], "a": 1}, {"id": "8-4-06", "c": 8, "s": 4, "n": "06", "p": 168, "q": "建築物為公寓大廈者，建築物公共安全檢查申報得由誰代為申報？", "o": ["其管理委員會主任委員或管理負責人", "村里長", "建築物公共安全檢查公司", "消防公司"], "a": 0}, {"id": "8-4-07", "c": 8, "s": 4, "n": "07", "p": 169, "q": "辦理建築物防火避難設施及設備安全標準檢查之各檢查項目，應按哪一種用途檢查簽證及申報？", "o": ["實際現況用途", "使用執照登載用途", "建照執照登載用途", "建物所有權狀登載用途"], "a": 0}, {"id": "8-4-08", "c": 8, "s": 4, "n": "08", "p": 169, "q": "依據「建築物公共安全檢查簽證及申報辦法」之規定，集合住宅建築物樓層達16層，辦理檢查簽證及申報之頻率為何？", "o": ["依照當地主管建築機關公告", "每年1次", "每2年1次", "每4年1次"], "a": 2}, {"id": "8-4-09", "c": 8, "s": 4, "n": "09", "p": 169, "q": "依據「建築物公共安全檢查簽證及申報辦法」之規定，集合住宅建築物，辦理檢查簽證及申報之時間為第幾季？", "o": ["第1季", "第2季", "第3季", "第4季"], "a": 0}, {"id": "8-4-10", "c": 8, "s": 4, "n": "10", "p": 169, "q": "住宅大門老舊更新，基於防火安全考量，應注意何種事項？", "o": ["外觀華麗", "價格實惠", "多段鎖匙", "應選用與原大門同等以上防火時效產品"], "a": 3}, {"id": "8-4-11", "c": 8, "s": 4, "n": "11", "p": 169, "q": "消防法中對於依法令或契約對各該場所有實際支配管理權者，稱為？", "o": ["防火管理人", "管理權人", "管理負責人", "管理委員會"], "a": 1}, {"id": "8-4-12", "c": 8, "s": 4, "n": "12", "p": 169, "q": "依各類場所消防安全設備設置標準設置之消防安全設備，其裝置、檢修應由具下列哪一種資格證照為之？", "o": ["防火管理人", "公寓大廈管理服務人", "公寓大廈管理服務人技術類", "消防設備師或消防設備士"], "a": 3}, {"id": "8-4-13", "c": 8, "s": 4, "n": "13", "p": 170, "q": "經中央主管機關公告應實施認可之消防機具、器材及設備，非經登錄認可及附加認可標示，可以設置使用限制，下列敘述何者較為適宜？", "o": ["不得使用，但可以銷售", "不可以使用，但可以陳列", "不得銷售、陳列或設置使用", "僅能陳列，不得銷售以及設置使用"], "a": 2}, {"id": "8-4-14", "c": 8, "s": 4, "n": "14", "p": 170, "q": "依據消防法所制定之消防防護計畫，防火避難設施之自行檢查:每月至少檢查幾次？", "o": ["1次", "2次", "3次", "4次"], "a": 0}, {"id": "8-4-15", "c": 8, "s": 4, "n": "15", "p": 170, "q": "依據消防法所制定之消防防護計畫中，何種行為應另定消防防護計畫，以監督施工單位用火、用電情形？", "o": ["申請變更使用執照", "申請拆除執照", "室內裝修施工", "更換防焰窗簾"], "a": 2}, {"id": "8-4-16", "c": 8, "s": 4, "n": "16", "p": 170, "q": "6層樓之公寓大厦年底舉辦跨年晚會，擬舉辦晚會並且邀請火舞舞者以明火表演，應向何機關申請許可？", "o": ["因未達10層之建築物，免申請", "應向建築管理機關申請是內裝修許可", "應向主管消防機關申請許可", "應向主管環境保護機關申請許可"], "a": 2}, {"id": "8-4-17", "c": 8, "s": 4, "n": "17", "p": 170, "q": "集合住宅建築物依法設置之消防設備，應多久辦理一次消防安全設備檢修及申報作業？", "o": ["每年", "每半年", "每季", "每2個月"], "a": 0}, {"id": "8-4-18", "c": 8, "s": 4, "n": "18", "p": 170, "q": "未申領使用執照或未依使用執照用途之違規使用場所，應以何用途依據，辦理檢修申報？", "o": ["依照甲類場所標準", "依照當地都市計畫之規定", "依照實際用途標準", "依照乙類場所標準"], "a": 2}, {"id": "8-4-19", "c": 8, "s": 4, "n": "19", "p": 171, "q": "建築物依法設置之防火鐵捲門，平常使用應注意何種事項，以維安全？", "o": ["下方可以停車", "永遠常開，不得關閉", "下方得放置盆栽", "下方保持淨空"], "a": 3}, {"id": "8-4-20", "c": 8, "s": 4, "n": "20", "p": 171, "q": "下列何處不得堆積物品，以致妨防火避難行為？", "o": ["儲藏室", "露臺", "陽臺", "共同走廊"], "a": 3}, {"id": "8-4-21", "c": 8, "s": 4, "n": "21", "p": 171, "q": "裝設發電機及蓄電池之處所，因散熱不佳，可透過下列何種方式以求改善散熱？", "o": ["應加裝通風扇", "應加裝自動時控", "開口不得小於60平方公分", "牆壁可增加通風開口，但仍應考慮須為防火時效構造"], "a": 3}, {"id": "8-4-22", "c": 8, "s": 4, "n": "22", "p": 171, "q": "屋頂增設夜間照明，照明電力線應距離屋頂避雷導線多少距離以上，以維安全？", "o": ["1公尺", "2公尺", "3公尺", "5公尺"], "a": 0}, {"id": "8-4-23", "c": 8, "s": 4, "n": "23", "p": 171, "q": "消防緊急照明燈應連結緊急電源，容量應可持續動作多久時間以上？", "o": ["5分鐘", "30分鐘", "60分鐘", "90分鐘"], "a": 1}, {"id": "8-4-24", "c": 8, "s": 4, "n": "24", "p": 171, "q": "裝設換氣設備，換氣風管如果貫穿防火區劃，應在貫穿部位任一側之風管內裝設防火閘門或閘板，應具有多久以上之防火時效？", "o": ["30分鐘", "60分鐘", "90分鐘", "120分鐘"], "a": 1}, {"id": "8-4-25", "c": 8, "s": 4, "n": "25", "p": 172, "q": "高層建築物使用燃氣設備及使用導管瓦斯者，應於哪個地方設置瓦斯緊急遮斷設備？", "o": ["瓦斯進入端", "屋頂", "避難層", "防災中心"], "a": 3}, {"id": "8-5-01", "c": 8, "s": 5, "n": "01", "p": 173, "q": "建築技術規則法源基礎與適用範圍為何？", "o": ["由立法院三讀通過，總統公告施行，全國適用", "由內政部訂定，全國適用", "由各縣市政府訂定，該縣市適用", "由各設備目的事業主管機關訂定發布"], "a": 1}, {"id": "8-5-02", "c": 8, "s": 5, "n": "02", "p": 173, "q": "下列哪一項為建築法中對於建築物的定義？", "o": ["貨櫃", "船舶", "1層平房", "露營車"], "a": 2}, {"id": "8-5-03", "c": 8, "s": 5, "n": "03", "p": 173, "q": "建築物除經過地方主管建築機關許可外，非經領得下列哪一種執照，不准接水、接電及使用？", "o": ["建造執照", "雜項執照", "拆除執照", "使用執照"], "a": 3}, {"id": "8-5-04", "c": 8, "s": 5, "n": "04", "p": 173, "q": "下列何人應維護建築物合法使用與其構造及設備安全？", "o": ["中央主管機關", "地方主管機關", "公寓大廈管理服務人員", "所有權人及使用人"], "a": 3}, {"id": "8-5-05", "c": 8, "s": 5, "n": "05", "p": 173, "q": "下列哪一種建築物，應由建築物所有權人、使用人定期委託中央主管建築機關認可之專業機構或人員檢查簽證？", "o": ["集合住宅", "超過3戶以上之集合住宅", "供公眾使用之建築物", "出租之建築物"], "a": 2}, {"id": "8-5-06", "c": 8, "s": 5, "n": "06", "p": 173, "q": "6層以上集合住宅之地面1層，若需室內裝修應符合下列何種規定？", "o": ["6層集合住宅之地面1層不受法令限制", "公共眾使用建築物之室內裝修應申請審查許可", "室內裝修施工可暫時關閉原有系統式消防安全設備，免訂定消防防護計畫", "需與房客磋商"], "a": 1}, {"id": "8-5-07", "c": 8, "s": 5, "n": "07", "p": 174, "q": "6層以上集合住宅之地面1層，若進行室內裝修，應符合下列哪一種規定？", "o": ["裝修材料應合於建築技術規則之規定", "需留意美感", "防火門可自行拆除", "已有消防警報設備，原有之灑水設備可自行拆除"], "a": 0}, {"id": "8-5-08", "c": 8, "s": 5, "n": "08", "p": 174, "q": "十六層之集合住宅進行室內裝修，應符合下列何者規定？", "o": ["不得破壞保護民眾隱私權設施", "不得使用工業風裝修", "裝修應經過鄰居同意", "浴缸改變為乾溼分離應經直下層住戶同意"], "a": 0}, {"id": "8-5-09", "c": 8, "s": 5, "n": "09", "p": 174, "q": "下列何種為建築法所定義之主要構造？", "o": ["外牆", "承重牆壁", "非承重牆壁", "天花板"], "a": 1}, {"id": "8-5-10", "c": 8, "s": 5, "n": "10", "p": 174, "q": "公寓大廈住戶進行室內裝修，除應遵守現行法令外，亦應遵守下列何種規定？", "o": ["房東的規定", "代管業者的規定", "公寓大廈規約的規定", "公寓大廈管理服務人員的規定"], "a": 2}, {"id": "8-5-11", "c": 8, "s": 5, "n": "11", "p": 174, "q": "未依建築法第77條第1項規定維護建築物合法使用與其構造及設備安全者，下列何者並非地方主管建築機關可對所有權人之處分？", "o": ["罰鍰", "限期改善", "補辦手續", "解除租賃契約"], "a": 3}, {"id": "8-5-12", "c": 8, "s": 5, "n": "12", "p": 174, "q": "建築法適用地區內，依法應申請當地主管建築機關之審查許可並發給執照方能建築，而擅自建築之建築物稱為？", "o": ["違法使用", "使用違規", "越界建築", "違章建築"], "a": 3}, {"id": "8-5-13", "c": 8, "s": 5, "n": "13", "p": 175, "q": "依建築法規定，強制拆除之建築物均不予補償，其拆除費用由下列何者負擔？", "o": ["地方主管建築機關", "中央主管建築機關", "建築物所有人", "管理委員會"], "a": 2}, {"id": "8-5-14", "c": 8, "s": 5, "n": "14", "p": 175, "q": "下列何種場所得原則上免設火警探測器？", "o": ["居室", "小孩臥室", "廁所", "倉庫"], "a": 2}, {"id": "8-5-15", "c": 8, "s": 5, "n": "15", "p": 175, "q": "滅火器固定放置於取用方便之明顯處所，並設有下列哪一種顏色標明滅火器字樣之標識？", "o": ["紅底白字", "白底綠字", "綠底白字", "白底黑字"], "a": 0}, {"id": "8-5-16", "c": 8, "s": 5, "n": "16", "p": 175, "q": "消防室內之消防栓箱面顏色應為下列哪一種顏色？", "o": ["紅色", "紅底白字", "白底紅字", "法無明文規定"], "a": 3}, {"id": "8-5-17", "c": 8, "s": 5, "n": "17", "p": 175, "q": "室內消防栓設備之緊急電源，應使用發電機設備或蓄電池設備，其供電容量應供其有效動作多久時間以上？", "o": ["10分鐘", "30分鐘", "60分鐘", "90分鐘"], "a": 1}, {"id": "8-5-18", "c": 8, "s": 5, "n": "18", "p": 175, "q": "緊急電源插座在保護箱上方，應設置哪一種顏色之表示燈？", "o": ["白色", "綠色", "黃色", "紅色"], "a": 3}, {"id": "8-5-19", "c": 8, "s": 5, "n": "19", "p": 175, "q": "下列何種設備為防災中心法定應設置之設備？", "o": ["空調", "上網", "休息", "緊急廣播"], "a": 3}, {"id": "8-5-20", "c": 8, "s": 5, "n": "20", "p": 176, "q": "昇降機出入口處之樓地板面，應與機廂地板面保持平整，其與機廂地板面邊緣之間隙，不得大於幾公分？", "o": ["1公分", "2公分", "3公分", "4公分"], "a": 3}, {"id": "8-5-21", "c": 8, "s": 5, "n": "21", "p": 176, "q": "招牌廣告燈設置於屋外者，其電源回路之配線應採用哪一種材質？", "o": ["膠皮絕緣線", "花線", "電纜", "IV線"], "a": 2}, {"id": "9-1-01", "c": 9, "s": 1, "n": "01", "p": 177, "q": "供公眾使用的建築物，其室內裝修應依下列何種法規辦理？", "o": ["建築法", "建築物室內裝修管理辦法", "建築技術規則建築設計施工編", "營造業法"], "a": 1}, {"id": "9-1-02", "c": 9, "s": 1, "n": "02", "p": 177, "q": "依據建築物室內裝修管理辦法規定，所稱室內裝修行為，下列何者正確？", "o": ["壁紙及地氈", "壁布及窗簾", "活動隔屏及固定櫥櫃", "內部牆面及固著於建物之天花板"], "a": 3}, {"id": "9-1-03", "c": 9, "s": 1, "n": "03", "p": 177, "q": "依據建築物室內裝修管理辦法規定，所稱室內裝修行為，下列何者正確？", "o": ["活動隔屏裝修", "高度超過地板面以上1.2公尺固定之隔屏裝修", "家具牆變更", "壁紙壁布裝修"], "a": 1}, {"id": "9-1-04", "c": 9, "s": 1, "n": "04", "p": 177, "q": "依據建築物室內裝修管理辦法規定，室內裝修從業者之業務範圍，下列何者正確？", "o": ["取得建築師資格得從事室內裝修設計", "依法登記開業之建築師得從事室內裝修設計", "依法登記開業之設計師得從事室內裝修施工", "營造業得從事室內裝修設計"], "a": 1}, {"id": "9-1-05", "c": 9, "s": 1, "n": "05", "p": 177, "q": "依據建築物室內裝修管理辦法規定，室內裝修從業者之業務範圍，下列何者正確？", "o": ["室內裝修業得從事室內裝修設計或施工", "建築師得從事室內裝修設計", "設計師得從事室內裝修施工", "營造業得從事室內裝修施工設計"], "a": 0}, {"id": "9-1-06", "c": 9, "s": 1, "n": "06", "p": 178, "q": "室內裝修業之專業技術人員離職或死亡時，依規定業者應在多久內報請內政部備查？", "o": ["1個月", "2個月", "3個月", "4個月"], "a": 0}, {"id": "9-1-07", "c": 9, "s": 1, "n": "07", "p": 178, "q": "依據建築物室內裝修管理辦法所稱專業技術人員，是指向內政部辦理登記，從事室內裝修何種技術的人員？", "o": ["設計技術", "營建技術", "施工技術", "設計或施工技術"], "a": 3}, {"id": "9-1-08", "c": 9, "s": 1, "n": "08", "p": 178, "q": "依據建築物室內裝修管理辦法所稱專業技術人員，依其執業範圍可分為哪兩種專業？", "o": ["專業設計及施工", "專業規劃及設計", "專業設計及營造", "專業設計及裝潢"], "a": 0}, {"id": "9-1-09", "c": 9, "s": 1, "n": "09", "p": 178, "q": "公寓大廈社區內供公眾使用之建築物，起造人需要從事建築物室內裝修之施工，有關其限制之敘述，下列何者正確？", "o": ["得視住戶需求而施工", "應申請審核圖說，始得施工", "應取得許可文件，始得施工", "應申請審核圖說及取得許可文件，始得施工"], "a": 3}, {"id": "9-1-10", "c": 9, "s": 1, "n": "10", "p": 178, "q": "公寓大廈社區內非供公眾使用之建築物，所有權人需要從事建築物室內裝修之施工，有何限制？", "o": ["應申請審核圖說及取得許可文件，始得施工", "應申請審核圖說，始得施工。", "應取得許可文件，始得施工", "得視安全需求，始得施工"], "a": 0}, {"id": "9-1-11", "c": 9, "s": 1, "n": "11", "p": 178, "q": "公寓大廈社區內供公眾使用之建築物，起造人申請建築物室內裝修審核時，應檢附下列何者圖說文件？", "o": ["建築物權利證明文件、使用執造及室內裝修平面圖", "申請書、使用執造及室內裝修平面圖、室內裝修圖說", "申請書、建築物權利證明文件、室內裝修圖說", "申請書、建築物權利證明文件、使用執造及室內裝修平面圖、室內裝修圖說"], "a": 3}, {"id": "9-1-12", "c": 9, "s": 1, "n": "12", "p": 179, "q": "依據建築物室內裝修管理辦法規定，室內裝修詳細圖，各部分之尺寸構造及材料的比例尺為多少？", "o": ["不得小於1/100", "不得小於10/100", "不得小於1/30", "不得小於1/300"], "a": 2}, {"id": "9-1-13", "c": 9, "s": 1, "n": "13", "p": 179, "q": "公寓大廈社區內供公眾使用之通道及樓梯，其室內裝修設計遇消防安全設備，下列何者處置最正確？", "o": ["得適當修飾遮掩", "不破壞就好", "不得妨害及破壞", "不得妨害"], "a": 2}, {"id": "9-1-14", "c": 9, "s": 1, "n": "14", "p": 179, "q": "公寓大廈社區內供公眾使用之建築物，其室內裝修申請審核之圖說涉及消防安全設備變更者，應依下列何種法規進行辦理？", "o": ["建築法", "消防法", "建築技術規則", "建築物室內裝修管理辦法"], "a": 1}, {"id": "9-1-15", "c": 9, "s": 1, "n": "15", "p": 179, "q": "下列有關室內裝修公司若將登記證供他人從事室內裝修業務，經當地主管建築機關查明屬實後，可能受到之處罰之敘述，何者正確？", "o": ["報請經濟部廢止室內裝修業登記許可並註銷登記證", "報請內政部停止室內裝修業登記許可並撤銷登記證", "報請科技部停止室內裝修業登記許可並註銷登記證", "報請內政部廢止室內裝修業登記許可並註銷登記證"], "a": 3}, {"id": "9-1-16", "c": 9, "s": 1, "n": "16", "p": 179, "q": "室內裝修公司受停業處分累計滿三年或受停止換發登記證處分累計3次，經當地主管建築機關查明屬實後，可能受到之處罰，下列何者正確？", "o": ["報請內政部廢止室內裝修業登記許可並註銷登記證。", "報請內政部停止室內裝潢業登記許可並撤銷登記證", "報請內政部停止室內裝修業營利許可", "報請內政部撤銷室內裝修營利事業登記證"], "a": 0}, {"id": "9-1-17", "c": 9, "s": 1, "n": "17", "p": 179, "q": "公寓大廈社區在10層以下樓層及地下室各層，室內裝修之樓地板面積在300平方公尺以下者，其防火牆在防火時效之區劃分隔，應具多少小時以上？", "o": ["1小時", "1.5小時", "2小時", "2.5小時"], "a": 0}, {"id": "9-1-18", "c": 9, "s": 1, "n": "18", "p": 180, "q": "公寓大廈社區在11層以上樓層，室內裝修之樓地板面積在100平方公尺以下者，其防火牆在防火時效之區劃分隔，應具多少小時以上？", "o": ["1小時", "1.5小時", "2小時", "2.5小時"], "a": 0}, {"id": "9-1-19", "c": 9, "s": 1, "n": "19", "p": 180, "q": "依據建築物室內裝修管理辦法規定，公寓大廈住宅社之防火牆在防火時效之區劃分隔，應具多少小時以上？", "o": ["0.5小時", "1小時", "1.5小時", "2小時"], "a": 1}, {"id": "9-1-20", "c": 9, "s": 1, "n": "20", "p": 180, "q": "依據建築物室內裝修管理辦法規定，室內裝修圖說應由下列何者署名負責？", "o": ["開業建築師", "開業之專業設計技術人員", "開業之專業施工技術人員", "開業建築師或專業設計技術人員"], "a": 3}, {"id": "9-1-21", "c": 9, "s": 1, "n": "21", "p": 180, "q": "依據建築物室內裝修管理辦法規定，專業技術人員受委託設計之竣工圖說及書件，經抽查結果與相關法令規定不符，經當地主管建築機關查明屬實後，情節最重之處分為下列何者？", "o": ["警告", "小過", "1年以上3年以下停止換發登記證處分", "3個月以上1年以下停止執行職務處分"], "a": 2}, {"id": "9-1-22", "c": 9, "s": 1, "n": "22", "p": 180, "q": "依據建築物室內裝修管理辦法規定，專業技術人員在10年內受停止執行職務處分累計滿2年，經當地主管建築機關查明屬實後，可報請內政部予以何種處分？", "o": ["廢止登記許可證", "註銷登記證", "停止換發登記許可證", "廢止登記許可並註銷登記證"], "a": 3}, {"id": "9-1-23", "c": 9, "s": 1, "n": "23", "p": 181, "q": "依據建築物室內裝修管理辦法規定，專業技術人員登記證供所受聘之室內裝修業以外使用，經當地主管建築機關查明屬實後，可報請內政部予以何種處分？", "o": ["廢止登記許可並註銷登記證", "廢止登記許可證", "註銷登記證", "停止換發登記許可證"], "a": 0}, {"id": "9-2-01", "c": 9, "s": 2, "n": "01", "p": 182, "q": "依據建築技術規則，建築面積占基地面積之比率，稱之為？", "o": ["容積率", "建蔽率", "空地比", "建築基地比率"], "a": 1}, {"id": "9-2-02", "c": 9, "s": 2, "n": "02", "p": 182, "q": "依據建築技術規則，建築物各層樓地板或其一部分，在該區劃中心線以內之水平投影面積，稱之為？", "o": ["建築面積", "建築開發面積", "樓地板面積", "總樓地板面積"], "a": 2}, {"id": "9-2-03", "c": 9, "s": 2, "n": "03", "p": 182, "q": "依據建築技術規則規定，建築物各層包括地下層、屋頂突出物及夾層等樓地板面積之總和，稱之為下列何者？", "o": ["建築面積", "建築開發面積", "樓地板面積", "總樓地板面積"], "a": 3}, {"id": "9-2-04", "c": 9, "s": 2, "n": "04", "p": 182, "q": "依據建築技術規則規定，建築面積：建築物外牆中心線或其代替柱中心線以內之最大水平投影面積，稱之為下列何者？", "o": ["建築面積", "建築開發面積", "樓地板面積", "總樓地板面積"], "a": 0}, {"id": "9-2-05", "c": 9, "s": 2, "n": "05", "p": 182, "q": "依據建築技術規則，關於建築物高度之規定，水箱、水塔設於屋頂突出物上高度合計在多少公尺以內，不計入建築面積？", "o": ["3公尺", "5公尺", "6公尺", "9公尺"], "a": 2}, {"id": "9-2-06", "c": 9, "s": 2, "n": "06", "p": 183, "q": "依據建築技術規則關於夾層之規定，夾於樓地板與天花板間之樓層，且同一樓層內夾層面積之和，未超過該層樓地板面積1/3或100平方公尺者，則視為下列何者？", "o": ["另一樓層", "夾層", "居室", "夾層居室"], "a": 1}, {"id": "9-2-07", "c": 9, "s": 2, "n": "07", "p": 183, "q": "依據建築技術規則關於夾層之規定，夾於樓地板與天花板間之樓層；同一樓層內夾層面積之和，已超過該層樓地板面積1/3或100平方公尺者，則視為下列何者？", "o": ["另一樓層", "夾層", "居室", "夾層居室"], "a": 0}, {"id": "9-2-08", "c": 9, "s": 2, "n": "08", "p": 183, "q": "依據建築技術規則規定，下列何者為建築物各樓層的直上方無任何頂遮蓋物之平臺？", "o": ["平臺", "露臺", "陽臺", "景觀平臺"], "a": 1}, {"id": "9-2-09", "c": 9, "s": 2, "n": "09", "p": 183, "q": "依據建築技術規則規定，下列何者為建築物各樓層的直上方有遮蓋物者？", "o": ["平臺", "露臺", "陽臺", "雨遮"], "a": 2}, {"id": "9-2-10", "c": 9, "s": 2, "n": "10", "p": 183, "q": "依據建築技術規則規定，用於分隔住宅單位與住宅單位或住戶與住戶或不同用途區劃間之牆壁，稱之？", "o": ["隔間牆", "分間牆", "分戶牆", "承重牆"], "a": 2}, {"id": "9-2-11", "c": 9, "s": 2, "n": "11", "p": 183, "q": "依據建築技術規則規定，下列何者為用於承受本身重量及本身所受地震、風力外並承載及傳導其他外壓力及載重之牆壁？", "o": ["承重牆", "帷幕牆", "分戶牆", "耐重牆"], "a": 0}, {"id": "9-2-12", "c": 9, "s": 2, "n": "12", "p": 184, "q": "依據建築技術規則規定，一般車位之寬度及長度為多少公尺？", "o": ["寬3公尺、長6公尺", "寬3公尺、長5.5公尺", "寬2.5公尺、長6.5公尺", "寬2.5公尺、長5.5公尺"], "a": 3}, {"id": "9-2-13", "c": 9, "s": 2, "n": "13", "p": 184, "q": "依據建築技術規則規定，建築物在幾層以上之樓層及各層之樓地板面積在幾平方公尺以上，應設置自動撒水設備？", "o": ["6樓，90平方公尺", "10樓，100平方公尺", "11樓，100平方公尺", "14樓，150平方公尺"], "a": 2}, {"id": "9-2-14", "c": 9, "s": 2, "n": "14", "p": 184, "q": "一般情況，幾層以上之建築物，應至少設置一座以上之昇降機通達避難層？", "o": ["5層", "6層", "11層", "12層"], "a": 1}, {"id": "9-2-15", "c": 9, "s": 2, "n": "15", "p": 184, "q": "建築物有防空避難設備之設計及構造，天花板高度或地板至樑底之高度不得小於幾公尺？", "o": ["3.1公尺", "3公尺", "2.8公尺", "2.1公尺"], "a": 3}, {"id": "9-3-01", "c": 9, "s": 3, "n": "01", "p": 185, "q": "某甲向房東承租公寓大廈社區住宅，基於美化視覺想更新室內牆面壁紙，則某甲應如何正確辦理？", "o": ["這屬室內設計僅須與房東協議好辦理", "這屬室內裝修應向主管機關申請辦理", "這會影響社區環境需經管委會同意後辦理", "這會影響社區環境需經管理負責人同意後辦理"], "a": 0}, {"id": "9-3-02", "c": 9, "s": 3, "n": "02", "p": 185, "q": "承租人向房東承租公寓大廈社區住宅，基於區隔室內活動想製作一座活動隔屏，他應如何正確辦理？", "o": ["這會影響社區環境需經管理負責人同意後辦理", "這屬室內裝修應向主管機關申請辦理", "這會影響社區環境需經管委會同意後辦理", "這屬室內設計僅須與房東協議好辦理"], "a": 3}, {"id": "9-3-03", "c": 9, "s": 3, "n": "03", "p": 185, "q": "承租人取得房東同意，在客廳製作一個高度1.4公尺之固定隔屏且兼作櫥櫃使用，他應如何正確辦理？", "o": ["這屬室內設計應請專業公司辦理", "這屬室內設計僅須與房東協議好辦理", "這屬室內裝修應向主管機關申請辦理", "這屬室內裝修應向管理負責人報備"], "a": 2}, {"id": "9-3-04", "c": 9, "s": 3, "n": "04", "p": 185, "q": "公寓大廈社區9樓住戶，為了增加該樓層走道照明裝置，應經由何者同意後為之？", "o": ["管理負責人", "管理委員會", "該樓層住戶", "管理負責人或管理委員會"], "a": 3}, {"id": "9-3-05", "c": 9, "s": 3, "n": "05", "p": 185, "q": "公寓大廈社區承租人，對於居室天花板進行設計與整修，應依何種法規申請辦理？", "o": ["建築物室內裝修管理辦法", "建築技術規則", "社區規約", "公寓大廈管理條例"], "a": 0}, {"id": "9-3-06", "c": 9, "s": 3, "n": "06", "p": 186, "q": "公寓大廈社區1樓承租人經營美容美髮業，基於調整室內動線，對於原本固著於建築物構造體之分間牆變更裝修，應依何種法規辦理？", "o": ["建築技術規則", "建築物室內裝修管理辦法", "公寓大廈管理條例", "社區規約"], "a": 1}, {"id": "9-3-07", "c": 9, "s": 3, "n": "07", "p": 186, "q": "某甲向房東承租8樓住宅，她父母年齡已達70歲，經洽房東同意，希望在住家陽台及窗戶設置防墜設施，下列敘述何者正確？", "o": ["須經管委會同意之後施做", "須經區分所有權人會議決議之後施做", "符合公寓大廈管理條例相關規定可施做", "符合建築技術規則相關規定可施做"], "a": 2}, {"id": "9-3-08", "c": 9, "s": 3, "n": "08", "p": 186, "q": "住戶基於家中有12歲以下兒童及高齡老人，在住家陽台設置防墜設施，主要依何種法令規範？", "o": ["建築法", "建築技術規則", "公寓大廈管理條例", "建築物室內裝修管理辦法"], "a": 2}, {"id": "9-3-09", "c": 9, "s": 3, "n": "09", "p": 186, "q": "住戶基於家中有12歲以下兒童，在住家陽台設置鐵鋁窗，除應依法令規定辦理外，仍應受何種規定之約束？", "o": ["應符合該公寓大廈規約規定或區分所有權人會議之決議", "應符合社區管委會之決議", "應符合建築法規範", "應符合住戶生活公約之規範"], "a": 0}, {"id": "9-3-10", "c": 9, "s": 3, "n": "10", "p": 186, "q": "住戶為避免家中寵物跑出屋外，自行在門廳前走廊設置柵欄，應由下列何者制止？", "o": ["同樓層受影響住戶", "管理維護公司", "管理負責人或管理委員會", "社區保全員"], "a": 2}, {"id": "9-3-11", "c": 9, "s": 3, "n": "11", "p": 186, "q": "住戶為避免家中1歲幼兒跑出屋外，自行在門廳前走廊設置柵欄，應由下列何者制止？", "o": ["同樓層受影響住戶", "管理維護公司", "社區保全員", "管理負責人或管理委員會"], "a": 3}, {"id": "9-3-12", "c": 9, "s": 3, "n": "12", "p": 187, "q": "住戶進行室內浴室裝修選用之給水管，應以何種材料製成？", "o": ["不燃材料", "耐燃材料", "耐水材料", "耐用材料"], "a": 0}, {"id": "9-3-13", "c": 9, "s": 3, "n": "13", "p": 187, "q": "住戶進行室內配電管及通風管裝修，應選用何種材料製成？", "o": ["耐燃材料", "不燃材料", "耐水材料", "耐用材料"], "a": 1}, {"id": "9-3-14", "c": 9, "s": 3, "n": "14", "p": 187, "q": "社區管委會進行室內裝修，經地下通道之通風管路及標示設施更新，應選用何種材料製成？", "o": ["耐燃材料", "不燃材料", "耐熱材料", "耐用材料"], "a": 1}, {"id": "9-3-15", "c": 9, "s": 3, "n": "15", "p": 187, "q": "承租人經得房東同意，將二樓住宅鋁窗進行修建，基於施工安全，工作人員利用鐵板設置圍籬，其高度應在幾公尺以上？", "o": ["1.2公尺", "1.4公尺", "1.6公尺", "1.8公尺"], "a": 3}, {"id": "9-3-16", "c": 9, "s": 3, "n": "16", "p": 187, "q": "承租人基於店面日式風格，室內裝修時也將1樓門邊之消防安全設備加上木質外框，這行為違反下列何種法令？", "o": ["建築法", "建築技術規則", "建築物室內裝修管理辦法", "公寓大廈管理條例"], "a": 2}, {"id": "9-3-17", "c": 9, "s": 3, "n": "17", "p": 187, "q": "住戶將1樓住宅中的居室，改做機械室及從事簡易維修工作，這行為違反下列何種法令？", "o": ["消防法", "土地法", "建築技術規則", "建築物室內裝修管理辦法"], "a": 2}, {"id": "9-3-18", "c": 9, "s": 3, "n": "18", "p": 187, "q": "依據建築技術規則之定義，下列何種材料屬於不燃材料？", "o": ["玻璃纖維、礦棉", "柏油、金屬材料", "木絲水泥板", "石膏板"], "a": 0}, {"id": "9-3-19", "c": 9, "s": 3, "n": "19", "p": 188, "q": "依據建築技術規則之定義，下列何種材料屬於耐火材料？", "o": ["金屬材料", "耐燃石膏板", "塑膠板", "木料合板"], "a": 1}, {"id": "9-3-20", "c": 9, "s": 3, "n": "20", "p": 188, "q": "依據建築技術規則之定義，下列何種材料屬於耐水材料？", "o": ["木絲水泥板", "石膏板", "耐燃合板", "磚、石料"], "a": 3}, {"id": "9-3-21", "c": 9, "s": 3, "n": "21", "p": 188, "q": "依據建築技術規則之定義，下列何種材料屬於耐燃材料？", "o": ["石膏板", "塑膠板", "木料合板", "窗簾"], "a": 0}, {"id": "9-3-22", "c": 9, "s": 3, "n": "22", "p": 188, "q": "住戶基於建立店面風格，室內裝修時將1樓門柱邊之消防安全設備加上美麗玻璃纖維框架，這行為違反下列何種法令？", "o": ["建築法", "建築技術規則", "建築物室內裝修管理辦法", "公寓大廈社區規約"], "a": 2}, {"id": "9-3-23", "c": 9, "s": 3, "n": "23", "p": 188, "q": "住戶將鞋櫃、腳踏車或金爐等雜物放置於樓梯間，管理負責人經制止而不遵從者，縣(市)政府主管機關得處多少罰鍰？", "o": ["10,000以上30,000以下", "20,000以上100,000以下", "40,000以上200,000以下", "30,000以上300,000以下"], "a": 2}, {"id": "9-3-24", "c": 9, "s": 3, "n": "24", "p": 188, "q": "承租人基於自身營業使用，將置物櫃或雜物放置於一樓共同走廊，造成住戶碰撞絆倒受重傷，縣(市)政府主管機關得處多久刑期？", "o": ["3個月以上3年以下有期徒刑", "6個月以上5年以下有期徒刑", "6個月以上6年以下有期徒刑", "5個月以上7年以下有期徒刑"], "a": 1}, {"id": "9-3-25", "c": 9, "s": 3, "n": "25", "p": 189, "q": "住戶擅自更改家中浴室排水管路，造成樓下住戶天花板滲水，管理負責人經制止而不遵從，也不願改善，縣(市)政府主管機關得處多少金額罰鍰？", "o": ["10,000以上30,000以下", "20,000以上100,000以下", "30,000以上300,000以下", "40,000以上200,000以下"], "a": 3}, {"id": "9-3-26", "c": 9, "s": 3, "n": "26", "p": 189, "q": "承租人於1樓的退縮空地設置路邊廣告物，造成住戶碰撞絆倒受重傷，縣(市)政府主管機關得處予罰則，下列何者正確？", "o": ["處3個月以上3年以下有期徒刑，得併科新臺幣30萬元以上100萬元以下罰金。", "處6個月以上5年以下有期徒刑，得併科新臺幣50萬元以上250萬元以下罰金。", "處6個月以上7年以下有期徒刑，得併科新臺幣30萬元以上150萬元以下罰金。", "處6個月以上5年以下有期徒刑，得併科新臺幣40萬元以上200萬元以下罰金。"], "a": 1}, {"id": "10-1-01", "c": 10, "s": 1, "n": "01", "p": 190, "q": "下列哪一項為租賃住宅服務業提供的服務？", "o": ["售屋資訊", "代收包裹服務", "住宅修繕保險服務", "協助租屋契約公證"], "a": 3}, {"id": "10-1-02", "c": 10, "s": 1, "n": "02", "p": 190, "q": "關於不動產仲介經紀業、代管業及包租業的敘述，下列何者正確？", "o": ["仲介業為一次性服務，代管業與包租業屬於連續性服務", "代管業與包租業均為受託管理性質", "包租業僅負責管理，並不涉及承租及轉租行為", "仲介業務與代管業務的法律責任完全相同"], "a": 0}, {"id": "10-1-03", "c": 10, "s": 1, "n": "03", "p": 190, "q": "依照《租賃住宅市場發展及管理條例》，租賃住宅管理人員的積極資格包括以下哪一項？", "o": ["需具備不動產經紀人資格", "必須經過全國聯合會舉辦的資格訓練並測驗合格", "需通過專業倫理考核，由內政部直接核發證書", "需在政府機關登記滿一年後才可執業"], "a": 1}, {"id": "10-1-04", "c": 10, "s": 1, "n": "04", "p": 190, "q": "依據《租賃住宅市場發展及管理條例》，租賃住宅管理人員不適宜從事以下哪種行為？", "o": ["提供租客完整的租賃契約資訊，並協助解釋條款", "依據市場行情，協助業主訂定合理租金", "以不當手段引導租客轉換租賃服務業者", "為確保交易安全，協助租客進行租金補助申請"], "a": 2}, {"id": "10-1-05", "c": 10, "s": 1, "n": "05", "p": 190, "q": "王先生是一名租賃住宅管理人員，某天一位房東李太太請他幫忙，要求他在租屋廣告上標示「全新裝潢」，但實際上房屋已有10年以上的使用歷史，部分天花板甚至有滲水問題。李太太表示：「這些問題租客來看時可能不會特別注意，先租出去比較重要。」請問王先生若依照李太太的要求，可能違反哪項政府規範？", "o": ["違反不動產估價師法", "違反租賃住宅市場發展及管理條例", "違反消費者保護法", "違反公平交易法"], "a": 1}, {"id": "10-1-06", "c": 10, "s": 1, "n": "06", "p": 191, "q": "李先生是某租賃公司的業務主管，他發現競爭對手公司提供的租屋代管費率較低，為了吸引更多業主合作，李先生在社交媒體上發表一則貼文，稱競爭對手公司「服務品質低劣，管理不善」，但他並無實際證據支持這項說法。請問他的行為可能違反哪一項專業倫理原則？", "o": ["市場公平競爭原則", "服務收費透明原則", "住宅租賃管理責任", "確保租賃標的品質"], "a": 0}, {"id": "10-1-07", "c": 10, "s": 1, "n": "07", "p": 191, "q": "黃先生是一名房屋仲介，近日他協助一位視障租客陳先生租房。簽約時，房東要求在租賃契約中加註「租客需自行負責所有室內修繕費用」，但未清楚解釋該條款的內容。陳先生以為這只是一般租約內容，便簽署了契約。入住後，他發現冷氣無法運作，向房東反應卻被告知需自費修繕。請問黃先生在這個過程中，可能涉及以下哪種不當行為？", "o": ["隱瞞重要租賃條款，違反資訊揭露義務", "違反不動產經紀業管理條例，提供不實價格資訊", "違反政府租金補助法規，未協助租客申請補助", "違反房東的所有權責，未提醒房東負擔維修責任"], "a": 0}, {"id": "10-1-08", "c": 10, "s": 1, "n": "08", "p": 191, "q": "李小姐是一名租客，她在入住一間租賃住宅三個月後，發現房屋內的電線老舊，經常發生跳電問題，影響日常生活。她多次向房東反映，但房東遲遲未處理。請問租賃業者應該如何協助？", "o": ["告知自行聘請電工修繕，然後向房東索取修繕費", "停止繳納租金，直到房東修理電線為止", "良好溝通即時回應問題", "告知接受現狀，並自費購買穩壓設備解決問題"], "a": 2}, {"id": "10-1-09", "c": 10, "s": 1, "n": "09", "p": 191, "q": "張小姐是一名租賃住宅管理人員，最近一位租客因個人因素想提前解約，但房東要求收取剩餘租期的所有租金作為違約金。張小姐應如何處理？", "o": ["告知租客只能依房東要求支付全額違約金", "協助雙方協商合理的違約金金額，符合公平原則", "建議租客直接向房東申請減免，但無需簽署書面協議", "要求租客自行找下一位租客接手，否則無法解除租約"], "a": 1}, {"id": "10-1-10", "c": 10, "s": 1, "n": "10", "p": 192, "q": "王先生是某租賃公司負責人，他為了提高業績，要求旗下員工優先推薦某些房東支付較高佣金的物件給租客，而非最適合租客需求的房源。這樣的行為是否符合倫理規範？", "o": ["符合，租賃公司可自行決定房源推薦策略", "不符合，應以租客的最佳利益為優先考量", "符合，房東願意支付較高佣金是市場行為", "不符合，但只要租客不發現，就不會有問題"], "a": 1}, {"id": "10-1-11", "c": 10, "s": 1, "n": "11", "p": 192, "q": "陳小姐計畫租房，但租賃公司要求她提供身分證影本及存摺明細，且未說明用途。這樣的行為是否合理？", "o": ["合理，租賃公司有權要求任何資訊", "不合理，應依個資法規範取得租客同意", "合理，租客應該信任租賃公司", "不合理，但租客無權拒絕提供"], "a": 1}, {"id": "10-1-12", "c": 10, "s": 1, "n": "12", "p": 192, "q": "王先生是一名租賃住宅管理人員，在管理某社區時，房東要求他幫忙篩選租客，不接受年長者與外籍人士。請問王先生應該如何處理？", "o": ["接受房東要求，按照需求篩選租客", "與房東協商，並說明這樣的做法不符合規範", "與房東協商，適當篩選部分族群，以減少爭議", "完全不回應房東的要求，避免影響合作關係"], "a": 1}, {"id": "10-1-13", "c": 10, "s": 1, "n": "13", "p": 192, "q": "林先生發現租賃住宅市場競爭激烈，為了吸引客戶，他決定提供租金補助申請服務，並誘導租客與房東簽訂虛假租約，以獲取政府補助。這樣的行為是否合法？", "o": ["合法，只要租客與房東同意即可", "不合法，屬於誘導虛假契約申請補助", "合法，政府租金補助本來就該讓更多人受益", "不合法，但只要沒被查到就沒問題"], "a": 1}, {"id": "10-1-14", "c": 10, "s": 1, "n": "14", "p": 192, "q": "某租賃公司在廣告中標榜：「選擇我們的服務，租金保證最低，不滿意可隨時退款。」然而，實際上該公司無法確保所有租金皆為最低，且未提供退款機制。這樣的廣告是否符合規範？", "o": ["符合，廣告內容屬於行銷手法，無需完全履行", "符合，只要沒有客戶投訴，就不算違規", "不符合，這屬於虛偽或誇大不實的廣告宣傳", "不符合，但只要能吸引客戶，就沒有問題"], "a": 2}, {"id": "10-1-15", "c": 10, "s": 1, "n": "15", "p": 193, "q": "王先生是一名租賃住宅管理人員，他的公司為了提高業績，要求他向租客收取額外的「合約管理費」，但未向租客提供正式收據。這樣的行為是否符合倫理規範？", "o": ["符合，只要租客同意支付即可", "不符合，租服業不得隨意收取額外費用", "符合，租服業可以自行決定收費項目", "不符合，但只要租客未提出異議，就無問題"], "a": 1}, {"id": "10-1-16", "c": 10, "s": 1, "n": "16", "p": 193, "q": "王先生透過某租賃住宅服務業的包租業務承租一間公寓。根據規定，該租賃住宅服務業應在簽訂轉租契約後多久內向主管機關申報登錄該案件的實際資訊？", "o": ["10日內", "15日內", "30日內", "60日內"], "a": 2}, {"id": "10-1-17", "c": 10, "s": 1, "n": "17", "p": 193, "q": "李小姐是某租賃住宅服務業的管理人員，今天有房客來要求索取押金退還證明。根據法規，該文件應由誰簽章？", "o": ["任何租賃住宅服務業人員", "房東", "租賃住宅服務業的專任租賃住宅管理人員", "房客本人"], "a": 2}, {"id": "10-1-18", "c": 10, "s": 1, "n": "18", "p": 193, "q": "張先生經營的租賃住宅服務業，為了符合規定，他應在營業處所的明顯處張貼哪些文件？", "o": ["登記證、會員證書、租賃住宅管理人員證書、代管費用收取基準及方式", "代管費用收取基準及方式、租賃住宅標的現況確認書、租賃契約書、登記證", "租賃住宅管理人員證書、租賃住宅標的現況確認書、租金收據、退還租金證明", "登記證、租賃契約書、屋況點交證明文件、租金收據"], "a": 0}, {"id": "10-1-19", "c": 10, "s": 1, "n": "19", "p": 193, "q": "某租賃住宅服務業被主管機關要求提供受託管理的租賃住宅資訊，該業者可以怎麼做？", "o": ["拒絕提供，因為涉及公司商業機密", "只提供部分資訊，隱藏租金數據", "提供相關資訊，並不得規避、妨礙或拒絕", "拒絕提供，並向法院申請停止調查"], "a": 2}, {"id": "10-1-20", "c": 10, "s": 1, "n": "20", "p": 194, "q": "租賃住宅服務業者若要開始營業，應在完成公司登記後多久內繳存營業保證金並申請租賃住宅服務業登記？", "o": ["3個月內", "6個月內", "9個月內", "12個月內"], "a": 1}, {"id": "10-1-21", "c": 10, "s": 1, "n": "21", "p": 194, "q": "關於租賃住宅管理人員的僱用規定，下列何者正確？", "o": ["租賃住宅服務業應至少僱用一名專任租賃住宅管理人員", "同一名租賃住宅管理人員可以同時受僱於兩家以上租賃住宅服務業", "只有包租業才需要僱用租賃住宅管理人員，代管業則不需要", "取得租賃住宅管理人員資格後，即可永久擔任該職位，無須換證"], "a": 0}, {"id": "10-1-22", "c": 10, "s": 1, "n": "22", "p": 194, "q": "代管業在執行租賃住宅管理業務時，應符合下列哪項規定？", "o": ["可在未與委託人簽訂契約的情況下開始管理租賃住宅", "可將管理業務轉委託給其他代管業執行", "須與委託人簽訂委託管理租賃住宅契約後，才可執行業務", "可在未與委託人簽訂契約的情況下開始刊登出租資訊"], "a": 2}, {"id": "10-1-23", "c": 10, "s": 1, "n": "23", "p": 194, "q": "包租業與次承租人簽訂租賃契約書時，應提供下列文件？", "o": ["住宅租賃標的現況確認書", "房屋稅單", "出租人同意出租之書面文件", "出租人收入證明"], "a": 0}, {"id": "10-1-24", "c": 10, "s": 1, "n": "24", "p": 194, "q": "承租人與出租人發生租賃爭議時，應如何處理？", "o": ["必須先提起民事訴訟", "可向直轄市或縣（市）政府申請調處，且免繳調處費用", "只能透過仲裁程序解決，無法向政府單位申請調處", "承租人只能自行解決，不得尋求第三方協助"], "a": 1}, {"id": "10-1-25", "c": 10, "s": 1, "n": "25", "p": 194, "q": "小李想要經營租賃住宅服務業，但他曾因經濟困難而被法院依《消費者債務清理條例》裁定開始清算程序，目前尚未復權。根據《租賃住宅市場發展及管理條例》第20條，小李是否可以擔任租賃住宅服務業的負責人？", "o": ["可以，因為清算程序不影響負責人資格", "可以，只要經主管機關特別許可", "不可以，因為尚未復權", "不可以，除非已經開始執行租賃業務"], "a": 2}, {"id": "10-1-26", "c": 10, "s": 1, "n": "26", "p": 195, "q": "租賃住宅服務業應指派專任租賃住宅管理人員簽章的文件，包括以下哪一項？", "o": ["屋況與附屬設備點交證明文件", "租金補貼申請文件", "房屋稅完稅證明", "租金之實價登錄分析文件"], "a": 0}, {"id": "10-1-27", "c": 10, "s": 1, "n": "27", "p": 195, "q": "小張是一名租賃住宅管理人員，負責協助房東與房客簽訂租賃契約。在處理租賃糾紛時，小張發現房東希望透過合約中的某些條款來規避法律責任，而房客則因缺乏法律知識未察覺其中問題。此時，小張應如何處理，才能符合《租賃住宅服務業倫理規範》的要求？", "o": ["直接順從房東的要求，因為房東是主要委託人", "主動協助房客修改不合理條款，完全站在房客立場處理", "公正處理，確保租賃雙方的權益，並提供專業建議", "讓房東與房客自行協商，不介入糾紛"], "a": 2}, {"id": "10-1-28", "c": 10, "s": 1, "n": "28", "p": 195, "q": "某租賃服務公司A的業務員小王發現競爭對手B公司近期業績很好，為了打擊對手，他故意散播B公司的負面消息，並在社群媒體上匿名發布指控B公司涉嫌違規的訊息。請問小王的行為違反了哪項規範？", "o": ["合理競爭，因為市場競爭本來就很激烈", "違反公平競爭原則，因為故意散播不實訊息損害他人商譽", "只要沒有直接誹謗，就不算違規", "屬於正常的商業行為，沒有違反相關規範"], "a": 1}, {"id": "10-1-29", "c": 10, "s": 1, "n": "29", "p": 195, "q": "租賃住宅管理人員小張受雇於X公司，近日在與客戶洽談時，為了增加成交機會，他謊稱自己是來自知名租賃公司Y，並展示一張非正式的識別證明。這樣的行為是否符合《租賃住宅服務業倫理規範》的規範？", "o": ["不符合規定，從業人員應明確出示所屬公司之證明，不得冒用他人名義", "只要客戶不追究，這樣的行為沒有問題", "為了促成交易，這樣的做法是可接受的", "這只是銷售手法的一種，不影響實際服務品質"], "a": 0}, {"id": "10-1-30", "c": 10, "s": 1, "n": "30", "p": 195, "q": "小美是一名租賃業務員，負責管理房東與房客的個人資料。某天，她接到一家裝修公司的請求，希望獲取租客的聯絡方式，以便提供裝修優惠方案。小美應如何處理，才符合租賃住宅服務業的倫理規範？", "o": ["只要裝修公司提供合作計畫，小美就可以分享資料", "事先徵求租客同意後，才能提供其個人資料給第三方", "只提供部分資料，例如租客的姓名與聯絡方式，不算違規", "直接提供租客資料，因為這對租客有潛在好處"], "a": 1}, {"id": "10-1-31", "c": 10, "s": 1, "n": "31", "p": 196, "q": "王先生是一名租賃住宅管理人員，負責管理房東與房客的租賃契約。某日，房東希望將原先租金從18,000元提高到20,000元，並請王先生修改合約內容。但房客不同意，王先生卻仍私自修改租賃契約，並要求房客依照新的租金支付。請問，王先生的行為是否適當？", "o": ["不適當，租賃契約內容須雙方同意，不可私自更改", "適當，租賃管理人員可根據市場變動調整租金", "視情況而定，若市場價格上漲，租金應跟著調整", "只要房東要求，租賃管理人員有權修改契約內容"], "a": 0}, {"id": "10-1-32", "c": 10, "s": 1, "n": "32", "p": 196, "q": "某甲開設房屋仲介行銷公司，對於租賃事宜有多年經驗，今受大樓社區住戶鄰居委託，代為管理其出租住宅及收取租賃之租金、押金、相關費用，此種行為樣態係屬？", "o": ["代表房東管理之性質", "代理房東管理之性質", "二房東包租管理之性質", "房仲管理之性質"], "a": 1}, {"id": "10-1-33", "c": 10, "s": 1, "n": "33", "p": 196, "q": "阿翰是一位資深的租賃住宅管理人員，在「A公司」服務多年，與許多房東和房客都建立了不錯的關係。最近，他的朋友開設了一家新的租賃住宅服務公司「B公司」，並承諾給予更高的獎金。阿翰為了賺取更高的佣金，便開始向他管理的房客和房東暗示：「A公司最近的服務品質下滑了，我有很多朋友都轉到『B公司』，那邊的服務比較到位，要不要我幫你們介紹過去？現在轉換還有優惠喔！」上述阿翰的行為，可能違反了下列哪一項從業人員的規定？", "o": ["未依規定揭露租賃住宅的相關資訊。", "未在規定時限內提供租賃契約給當事人審閱。", "惡意驅使當事人轉換至其他租賃住宅服務業，損害當事人權益。", "未經當事人同意，洩露其個人資料。"], "a": 2}, {"id": "10-1-34", "c": 10, "s": 1, "n": "34", "p": 197, "q": "林小姐想成立租賃住宅服務公司，她在準備申請文件時需要確定自己的經營模式。諮詢政府單位後，她了解到租賃住宅服務業專業職能可以分為哪兩種類型？", "o": ["代管業與仲介業", "包租業與代銷業", "代管業與包租業", "經紀業與租賃業"], "a": 2}, {"id": "10-1-35", "c": 10, "s": 1, "n": "35", "p": 197, "q": "小明是一位新進的租賃住宅管理人員，第一次與房東洽談代管業務。根據規定，他應該採取什麼行動？", "o": ["先與房東建立信任關係，之後再找機會出示證明。", "口頭告知房東自己的姓名及公司名稱。", "主動向房東出示所屬公司的相關證明文件。", "只提供名片給房東，名片上印有公司名稱。"], "a": 2}, {"id": "10-1-36", "c": 10, "s": 1, "n": "36", "p": 197, "q": "張先生是一名租賃住宅管理人員，他去年取得專業證書後開始執業。當他在整理公司文件時，注意到自己的證書有效期限及換證規定，請問下列敘述何者正確？", "o": ["有效期限為2年，期滿前3個月內應辦理換證", "有效期限為3年，期滿前6個月內應辦理換證", "有效期限為4年，期滿前3個月內應辦理換證", "有效期限為4年，期滿前6個月內應辦理換證"], "a": 3}, {"id": "10-1-37", "c": 10, "s": 1, "n": "37", "p": 197, "q": "趙先生擁有5戶出租住宅，自「租賃住宅市場發展及管理條例」實施後，他擔心自己需要額外申請證照或成立公司才能繼續出租。關於實施後的個人房東，下列敘述何者正確？", "o": ["個人房東自行經營自有房屋出租管理，違反租賃住宅市場發展及管理條例規範", "個人房東自行經營自有房屋出租管理，並無違反租賃住宅市場發展及管理條例規範", "個人房東必須取得租賃住宅管理人員證書才能出租自有房屋", "個人房東必須成立租賃住宅服務業才能出租自有房屋"], "a": 1}, {"id": "10-1-38", "c": 10, "s": 1, "n": "38", "p": 197, "q": "小李是租賃住宅服務業者的一員，最近接到一位承租人的投訴，表示自己在網路上看到的租屋廣告與實際狀況不符，包含屋齡、樓層與面積的資訊都有誤。他詢問主管，這樣的情況是否有法律責任？", "o": ["若承租人因信賴該廣告受損，出租人應獨自承擔賠償責任，與刊登媒體無關。", "若媒體業者明知廣告內容不實，則須與出租人共同承擔連帶賠償責任。", "廣告主若為租賃住宅服務業者，則無需在廣告中註明業者名稱。", "只要出租人與承租人達成協議，出租人可以事先約定免除損害賠償責任。"], "a": 1}, {"id": "10-1-39", "c": 10, "s": 1, "n": "39", "p": 198, "q": "阿明未申請租賃住宅服務業登記，私下經營代管與包租業務，結果遭租客檢舉。主管機關調查後，確認阿明違法經營，準備開罰並要求停業。依《租賃住宅市場發展及管理條例》主管機關可如何處罰？", "o": ["禁止營業，處4萬至20萬元罰鍰，限期改正，否則按次處罰，情節重大可勒令歇業。", "直接沒收所有租賃所得，並追溯五年內的交易紀錄。", "若已簽約，契約仍有效，主管機關不得介入。", "願意補辦登記者，可免除罰鍰並繼續經營。"], "a": 0}, {"id": "10-1-40", "c": 10, "s": 1, "n": "40", "p": 198, "q": "根據《租賃住宅服務業倫理規範》，租服業應當協助政府健全租賃住宅管理制度，下列何者為佳？", "o": ["僱用具備租賃住宅管理人員資格或具備一定專業知識者", "透過媒體批評政府租賃政策的不完善之處", "只需在官方網站上公告相關政策及時令，不必實際執行", "主要由政府單位負責管理，租服業無須參與"], "a": 0}, {"id": "10-1-41", "c": 10, "s": 1, "n": "41", "p": 198, "q": "依據租服業倫理規範，租服業在提供服務時應秉持何種精神？", "o": ["以最高價格獲取最大利潤為目標", "以誠信為基礎並注重服務品質", "盡量降低成本，即使可能影響租賃管理品質", "以降低市場競爭為核心，以便提高服務費"], "a": 1}, {"id": "10-1-42", "c": 10, "s": 1, "n": "42", "p": 198, "q": "租服業在市場競爭中的秩序，下列何者為是？", "o": ["只要不涉及法律問題，即可使用他人商業機密", "尊重同業之智慧財產與營業秘密", "透過降低價格吸引客戶，即使可能造成惡性競爭", "收購其他租服業以壟斷市場"], "a": 1}, {"id": "10-1-43", "c": 10, "s": 1, "n": "43", "p": 198, "q": "租服業在處理當事人個人資料時，應如何確保合法與安全？", "o": ["只要當事人未提出異議，就可以持續使用其個人資料", "遵守個人資料保護法，並確保個資處理方式符合法令規範", "將所有當事人資料存放於雲端，無須任何額外安全措施", "只需在簽約時告知當事人個資使用方式，不需後續管理"], "a": 1}, {"id": "10-1-44", "c": 10, "s": 1, "n": "44", "p": 199, "q": "租服業應如何處理相關的利益衝突事件？", "o": ["允許從業人員接受供應商或委託人提供的獎勵，以維繫合作關係", "只需在發生利益衝突時才採取行動", "任何時候均應以當事人最佳利益為優先考量", "主要考量公司利益，當事人利益可視情況而定"], "a": 2}, {"id": "10-1-45", "c": 10, "s": 1, "n": "45", "p": 199, "q": "租服業在業務運營中應如何兼顧社會及環境因素？", "o": ["確保公司發展優先，環境與社會責任可由政府管理", "只需考量企業獲利，不必考慮環境與社會責任", "以最低成本經營，即使對環境可能產生負面影響", "採取永續經營之做法，為社區和環境做出積極貢獻"], "a": 3}, {"id": "10-1-46", "c": 10, "s": 1, "n": "46", "p": 199, "q": "租服業在聘任租賃住宅管理人員及從業人員時，應特別注意哪些事項？", "o": ["允許從業人員在未經公司同意的情況下私自接案", "只要具備相關經驗，即可不考慮誠信問題", "以最低薪資聘僱人員，降低營運成本", "應重視品行及誠信，並避免聘用有不良紀錄者"], "a": 3}, {"id": "10-1-47", "c": 10, "s": 1, "n": "47", "p": 199, "q": "租服業在管理租賃住宅時，應如何履行善良管理人責任？", "o": ["妥善管理當事人之租賃住宅標的", "只需確保房東的利益，租客的需求可視情況而定", "只要不違法，即可自由決定如何管理", "主要關注租賃合約，其他問題不屬於租服業責任"], "a": 0}, {"id": "10-1-48", "c": 10, "s": 1, "n": "48", "p": 199, "q": "下列何種行為屬於惡性競爭，不符合租服業倫理規範？", "o": ["以不正當方式影響委託人終止其他租服業的管理服務", "透過提供優質服務來提升市場競爭力", "合法使用廣告來提升品牌影響力", "在遵守法規的前提下，提供客戶更具吸引力的租賃方案"], "a": 0}, {"id": "10-1-49", "c": 10, "s": 1, "n": "49", "p": 199, "q": "租服業在對當事人說明業務服務內容時，應避免何種行為？", "o": ["提供完整且清楚的業務說明", "蓄意隱瞞或誤導當事人，以獲取更高的服務費", "依據法令要求，誠實告知所有費用與服務條件", "讓當事人充分了解租賃流程，以確保其權益"], "a": 1}, {"id": "10-1-50", "c": 10, "s": 1, "n": "50", "p": 199, "q": "租賃住宅管理人員在執行業務時，應秉持何種態度確保住宅安全與維護？", "o": ["盡力而為，若時間允許才處理", "善良管理人責任，並提供準確、完整的資訊及管理服務", "主要負責租賃契約的簽訂，不需特別關注住宅安全", "可視個人專業背景決定是否負責安全維護"], "a": 1}, {"id": "10-1-51", "c": 10, "s": 1, "n": "51", "p": 200, "q": "租賃住宅管理人員在提供租賃服務時，下列何者屬於不當行為？", "o": ["在租賃契約中詳細載明租賃條款及管理費用", "恪守誠信原則，不得收取額外費用或不正當利益", "於執行業務時，提供透明資訊並確保雙方權益", "以不實廣告誇大物件條件，吸引租客簽約"], "a": 3}, {"id": "10-1-52", "c": 10, "s": 1, "n": "52", "p": 200, "q": "根據租賃住宅服務業倫理規範，租賃住宅管理人員應如何確保租賃契約的合法性？", "o": ["參考市場行情自行調整租賃條款", "依據租賃法規訂立契約，並確保符合中華民國法律標準", "只需獲得租客口頭同意，即可變更契約內容", "在雙方合意的情況下，可不經法律規範修改契約條款"], "a": 1}, {"id": "10-1-53", "c": 10, "s": 1, "n": "53", "p": 200, "q": "下列關於租賃住宅管理人員及從業人員之敘述，何者正確？", "o": ["可利用業務機會，向租客收取額外費用以提高服務品質", "應遵守個人資料保護法，確保當事人資訊不被濫用", "可在未經租客同意的情況下，將租賃資訊提供給第三方", "只需負責租賃契約的訂立，不需確保租賃標的的維護"], "a": 1}, {"id": "10-1-54", "c": 10, "s": 1, "n": "54", "p": 200, "q": "當租賃住宅管理人員與租客溝通時，應如何確保資訊透明？", "o": ["及時提供租賃標的狀態與問題處理進度", "只有在租客提出疑問時，才提供必要資訊", "由租客自行查詢相關租賃資訊，不需額外通知", "只需提供租賃標的的基本資訊，其他細節可省略"], "a": 0}, {"id": "10-1-55", "c": 10, "s": 1, "n": "55", "p": 200, "q": "下列何種行為可能違反租賃住宅管理人員之誠信原則？", "o": ["依法合規地簽訂租賃契約並依約履行", "未經租客同意，即向政府申請租賃補助", "定期參與專業訓練，以提升管理能力", "遵循租賃契約條款，確保服務品質"], "a": 1}, {"id": "10-1-56", "c": 10, "s": 1, "n": "56", "p": 200, "q": "若租賃住宅管理人員於業務執行時，涉及以下何種行為，將被認為是不當競爭？", "o": ["依法提供租賃住宅市場資訊，協助租客決策", "依規定於網頁公告登記證與服務內", "鼓勵租客終止與其他租服業者的合約，轉而與自己合作", "於租賃契約中載明費用計算方式，確保透明度"], "a": 2}, {"id": "10-1-57", "c": 10, "s": 1, "n": "57", "p": 200, "q": "租賃住宅管理人員於執行業務時，應如何處理個人資料？", "o": ["只要當事人未反對，即可自由使用個人資料", "僅能在合法範圍內使用，並於當事人要求時立即停止使用", "可將當事人資料提供給合作廠商，以利業務推廣", "為促成交易，得向第三方公開租客資訊"], "a": 1}, {"id": "10-1-58", "c": 10, "s": 1, "n": "58", "p": 201, "q": "當租賃住宅管理人員與租客簽訂契約後，下列何者為應遵守的原則？", "o": ["僅需履行契約條款中對自身有利的部分", "不得隨意更改契約條款，並應依約履行責任", "若市場行情變動，可隨時要求租客調整租金", "只需口頭通知租客契約異動內容，不需書面確認"], "a": 1}, {"id": "10-1-59", "c": 10, "s": 1, "n": "59", "p": 201, "q": "租賃住宅管理人員下列何種行為不當誘導當事人訂立契約？", "o": ["提供合法租賃資訊，幫助租客做決策", "以透明條款與合理費用吸引客戶簽約", "以虛假委託代管方式，讓當事人申請政府補助", "依法說明契約內容，確保租客知情權"], "a": 2}, {"id": "10-1-60", "c": 10, "s": 1, "n": "60", "p": 201, "q": "當租服業或租賃住宅管理人員違反倫理規範時，應由哪個機構負責審議與處理？", "o": ["內政部直接負責處理，不需經公會審議", "租賃住宅服務商業同業公會負責審議，如涉及處罰事項，報請主管機關處理", "由個別租服業自行決定處理方式，不需外部機構介入", "只有在租客或房東檢舉時，主管機關才會處理"], "a": 1}, {"id": "10-1-61", "c": 10, "s": 1, "n": "61", "p": 201, "q": "若所在地租賃住宅服務商業同業公會未能在規定期限內審議違規案件，應由哪個機構接手處理？", "o": ["內政部不動產管理司", "當地法院", "中華民國租賃住宅服務商業同業公會全國聯合會", "當地警察局"], "a": 2}, {"id": "10-1-62", "c": 10, "s": 1, "n": "62", "p": 201, "q": "租服業違反倫理規範時，應如何處理？", "o": ["直接停業，並取消租賃業資格", "視情節輕重，由所在地租賃住宅服務商業同業公會予以警告或停權", "罰款固定為100萬元，以維護市場秩序", "由主管機關決定，但不需經過公會審議"], "a": 1}, {"id": "10-1-63", "c": 10, "s": 1, "n": "63", "p": 201, "q": "租賃住宅管理人員或從業人員違反倫理規範時，公會可以如何處理？", "o": ["直接開除，並禁止再從事相關行業", "通知所屬租服業，並建議對該人員進行適當議處", "只需內部警告，不會影響該人員的執業資格", "由當事人自行解釋，不需任何懲處"], "a": 1}, {"id": "10-1-64", "c": 10, "s": 1, "n": "64", "p": 202, "q": "當租服業的業務同時涉及不動產經紀業時，應適用哪部法規？", "o": ["只有《租賃住宅服務業倫理規範》適用，不適用其他法規", "《不動產經紀業管理條例》及《不動產仲介經紀業倫理規範》", "由租服業自行決定是否遵循不動產經紀業的規範", "只適用地方政府的租賃相關條例，不適用全國性規範"], "a": 1}]};
const EXPL={"1-1-01": {"law": "【租賃住宅市場發展及管理條例 第3條】\n本條例用詞，定義如下：\n一、租賃住宅：指以出租供居住使用之建築物。", "note": "租賃住宅就是「租來住」的房子。拿去辦公、開餐廳、開店都不算。", "opts": ["", "辦公不是住", "餐廳是做生意", "店鋪是做生意"]}, "1-1-02": {"law": "【租賃住宅市場發展及管理條例 第3條】\n本條例用詞，定義如下：\n三、租賃住宅服務業：指租賃住宅代管業及租賃住宅包租業。", "note": "租賃住宅服務業只有兩種：代管業、包租業。名字長得像的（仲介、代銷、大樓管理公司）都不是。", "full": "【租賃住宅市場發展及管理條例 第3條】\n本條例用詞，定義如下：\n三、租賃住宅服務業：指租賃住宅代管業及租賃住宅包租業。\n四、租賃住宅代管業（以下簡稱代管業）：指受出租人之委託，經營租賃住宅管理業務（以下簡稱代管業務）之公司。", "opts": ["大樓管理公司是管大樓，不是管出租", "", "經紀業是賣房子、幫忙找房", "代銷業是賣預售屋"]}, "1-1-03": {"law": "【租賃住宅市場發展及管理條例 第3條】\n本條例用詞，定義如下：\n三、租賃住宅服務業：指租賃住宅代管業及租賃住宅包租業。", "note": "只有「代管」跟「包租」兩種算租服業。其他像仲介、代銷、大樓管理公司，都是另一掛。", "full": "【租賃住宅市場發展及管理條例 第3條】\n本條例用詞，定義如下：\n三、租賃住宅服務業：指租賃住宅代管業及租賃住宅包租業。\n四、租賃住宅代管業（以下簡稱代管業）：指受出租人之委託，經營租賃住宅管理業務（以下簡稱代管業務）之公司。", "opts": ["經紀業是仲介", "代銷業賣預售屋", "", "大樓管理公司管大樓"]}, "1-1-04": {"law": "【租賃住宅市場發展及管理條例 第3條】\n四、租賃住宅代管業（以下簡稱代管業）：指受出租人之委託，經營租賃住宅管理業務（以下簡稱代管業務）之公司。", "note": "「代管」＝房東請你幫忙管，房子還是房東的。自己先租再轉租的是包租。", "opts": ["經紀業是仲介", "代銷業賣預售屋", "包租是自己承租再轉租，不是受託管理", ""]}, "1-1-05": {"law": "【租賃住宅市場發展及管理條例 第3條】\n五、租賃住宅包租業（以下簡稱包租業）：指承租租賃住宅並轉租，及經營該租賃住宅管理業務（以下簡稱包租業務）之公司。", "note": "「包租」＝先跟房東租下來，再轉租出去，順便管理。就是當二房東。", "opts": ["", "代管只是受託管理，沒有自己租下來", "經紀業是仲介", "代銷業賣預售屋"]}, "1-1-06": {"law": "【租賃住宅市場發展及管理條例 第3條】\n八、租賃住宅管理人員：指租賃住宅服務業依本條例規定所置從事代管業務或包租業務之人員。", "note": "做代管、包租的人，統稱「租賃住宅管理人員」。別選經紀、仲介，那是賣房子那一掛。", "opts": ["經紀人是賣房子那一掛", "條文沒有「仲介人員」", "", "公司不是「人」"]}, "1-1-07": {"law": "【租賃住宅市場發展及管理條例 第3條】\n九、轉租：指承租租賃住宅，以其全部或一部租與他人居住使用，他人支付租金之租賃行為。", "note": "自己是房客，再把房子租給別人住，叫「轉租」。", "opts": ["包租是一種業者，不是這個動作", "沒有「代租」這個詞", "承租只是租進來，沒再租出去", ""]}, "1-1-08": {"law": "【租賃住宅市場發展及管理條例 第3條】\n十、轉租人：指以其租用之住宅全部或一部租與他人居住者。", "note": "把自己租來的房子再租出去的人，叫「轉租人」，也就是二房東。", "opts": ["", "「包租人」不是條文的詞", "沒有「代租人」", "承租人是租進來的那個"]}, "1-1-09": {"law": "【租賃住宅市場發展及管理條例 第3條】\n十一、次承租人：指支付租金租用他人承租之租賃住宅供居住使用者。", "note": "「次」＝第二手。租二房東房子的人，叫「次承租人」。", "opts": ["沒有「次代租人」", "", "沒有「次轉租人」", "沒有「次包租人」"]}, "1-1-10": {"law": "【租賃住宅市場發展及管理條例 第3條】\n十三、押金：指承租人為擔保租賃住宅之損害賠償行為及處理遺留物責任，預為支付之金錢。", "note": "押金是房客先付的錢，拿來擔保：弄壞東西要賠、留下的東西要處理。租金是住的錢，不是押金。", "opts": ["「保證金」不是條文的詞", "訂金是為了訂約先付的", "租金是住的費用", ""]}, "1-1-11": {"law": "【租賃住宅市場發展及管理條例 第4條】\n租賃住宅有下列情形之一者，不適用本條例規定：\n一、供休閒或旅遊為目的。", "note": "這些不適用：旅遊休閒（像民宿）、政府經營、合作社經營、租不到30天。拿來住、租超過30天的就適用。", "opts": ["", "房東自己管的還是適用", "拿來住的就是適用", "超過30天才適用，所以是適用的"]}, "1-1-12": {"law": "【租賃住宅市場發展及管理條例 第4條】\n租賃住宅有下列情形之一者，不適用本條例規定：\n四、租賃期間未達三十日。", "note": "租期要滿30天才適用這條例。租不到30天（短租）不管。", "opts": ["不用60天", "", "20天不夠", "10天不夠"]}, "1-1-13": {"law": "【租賃住宅市場發展及管理條例 第5條】\n第二項之住宅包租契約條款，違反該項應約定及不得約定事項者，無效；該應約定事項未記載於契約者，仍構成契約之內容；其為口頭約定者，亦同。", "note": "違反「應記載／不得記載」的條款，直接無效。不是可以撤銷，也不是等一等再說。", "opts": ["", "不是可撤銷，是直接無效", "契約還是成立，只是那條無效", "沒有效力未定，直接無效"]}, "1-1-14": {"law": "【租賃住宅市場發展及管理條例 第5條】\n第二項之住宅包租契約條款，違反該項應約定及不得約定事項者，無效；該應約定事項未記載於契約者，仍構成契約之內容；其為口頭約定者，亦同。", "note": "應該寫進契約的事，沒寫也照樣算契約內容。法律會幫你補上，漏寫躲不掉。", "opts": ["沒寫也算內容", "", "沒寫不是不生效力", "沒寫不是無效"]}, "1-1-15": {"law": "【租賃住宅市場發展及管理條例 第5條】\n第二項之住宅包租契約條款，違反該項應約定及不得約定事項者，無效；該應約定事項未記載於契約者，仍構成契約之內容；其為口頭約定者，亦同。", "note": "應該寫的事，只用嘴巴講、沒寫在紙上，還是算契約內容。口頭也算數。", "opts": ["口頭約定還是有效", "不是無效", "", "口頭也算契約內容"]}, "1-1-16": {"law": "【租賃住宅市場發展及管理條例 第5條】\n住宅包租契約條款，一部無效或不構成契約內容之一部，除去該部分，契約亦可成立者，該契約之其他部分，仍為有效。但對當事人之一方顯失公平者，該契約全部無效。", "note": "一條壞掉不連累整份契約：把無效那條拿掉，契約還能成立，其他就繼續有效。", "opts": ["只有壞掉那部分無效", "除非對一方太不公平，才全部無效", "選項不精確，條文是「仍為有效」", ""]}, "1-1-17": {"law": "【租賃住宅市場發展及管理條例 第7條】\n押金之金額，不得逾二個月之租金總額。", "note": "押金最多收2個月租金。月租1萬，押金最多2萬。", "opts": ["上限是2個月，1個月太少", "", "3個月超過上限", "4個月超過上限"]}, "1-1-18": {"law": "【租賃住宅市場發展及管理條例 第8條】\n出租人應以合於所約定居住使用之租賃住宅，交付承租人，並應於租賃期間保持其合於居住使用之狀態。", "note": "房東要「整個租期」都讓房子保持可以住的狀態，不是只管交屋那天。", "opts": ["條文沒管空氣", "條文沒管濕度", "條文沒管溫度", ""]}, "1-1-19": {"law": "【租賃住宅市場發展及管理條例 第8條】\n前項由出租人負責修繕者，如出租人未於承租人所定適當期限內修繕，承租人得自行修繕並請求出租人償還其費用或於約定之租金中扣除。", "note": "該房東修的東西，房東拖著不修：房客可以自己修，再叫房東還錢（或直接從租金扣）。", "opts": ["不只能自費請人，還能要房東還錢", "", "本來是房東的責任", "房客可以自己修"]}, "1-1-20": {"law": "【租賃住宅市場發展及管理條例 第8條】\n出租人為修繕租賃住宅所為之必要行為，承租人不得拒絕。", "note": "房東為了修房子要進來，房客不能拒絕。", "opts": ["不能有條件拒絕", "不是有條件接受，是不能拒絕", "", "不可以拒絕"]}, "1-1-21": {"law": "【租賃住宅市場發展及管理條例 第9條】\n轉租人簽訂轉租契約時，應向次承租人提供前項同意轉租之書面文件，並於轉租契約載明其與出租人之租賃標的範圍、期間及得終止租賃契約之事由。", "note": "轉租時，二房東要拿「房東同意轉租的書面」給次承租人看。口說沒用。", "full": "【租賃住宅市場發展及管理條例 第9條】\n轉租人應經出租人書面同意，始得轉租其租用之住宅全部或一部。\n轉租人簽訂轉租契約時，應向次承租人提供前項同意轉租之書面文件，並於轉租契約載明其與出租人之租賃標的範圍、期間及得終止租賃契約之事由。", "opts": ["", "所有權狀不是條文要的", "使用執照不是條文要的", "測量成果圖不是條文要的"]}, "1-1-22": {"law": "【租賃住宅市場發展及管理條例 第9條】\n轉租人應於簽訂轉租契約後三十日內，以書面通知出租人。", "note": "轉租契約簽完，30天內要用書面通知房東。", "opts": ["不是10天", "不是20天", "", "不是60天"]}, "1-1-23": {"law": "【租賃住宅市場發展及管理條例 第10條】\n出租人依前項規定提前終止租賃契約者，應依下列規定期限，檢附相…\n三、承租人未經出租人書面同意，將租賃住宅轉租於他人。", "note": "房客偷偷轉租，房東要解約：提前30天寫信通知。只有「房東要拆掉重建」才給3個月。", "full": "【租賃住宅市場發展及管理條例 第10條】\n三、承租人未經出租人書面同意，將租賃住宅轉租於他人。\n出租人依前項規定提前終止租賃契約者，應依下列規定期限，檢附相關事證，以書面通知承租人：\n一、依前項第一款至第三款及第五款規定終止者，於終止前三十日。", "opts": ["", "7天太短，要30天", "半個月太短，要30天", "沒有2個月這個數字（重建才是3個月）"]}, "1-1-24": {"law": "【租賃住宅市場發展及管理條例 第11條】\n承租人依第一項各款或其繼承人依前項提前終止租賃契約者，應於終止前三十日，檢附相關事證，以書面通知出租人。", "note": "房客過世，繼承人可以解約，要提前30天書面通知房東。", "full": "【租賃住宅市場發展及管理條例 第11條】\n承租人死亡，繼承人得主張終止租賃契約。\n承租人依第一項各款或其繼承人依前項提前終止租賃契約者，應於終止前三十日，檢附相關事證，以書面通知出租人。", "opts": ["7天改30天", "20天改30天", "", "2個月改30天"]}, "1-1-25": {"law": "【租賃住宅市場發展及管理條例施行細則 第3條】\n承租人依本條例第十一條第一項第一款規定提前終止租賃契約者，其應檢附之相關事證，為設立有案醫療機構出具療養時程需六個月以上之診斷證明。\n\n【租賃住宅市場發展及管理條例 第11條】\n一、因疾病、意外產生有長期療養之需要。", "note": "生病要長期療養想解約：診斷證明要寫療養時間「6個月以上」。", "full": "【租賃住宅市場發展及管理條例 第11條】\n一、因疾病、意外產生有長期療養之需要。\n\n【租賃住宅市場發展及管理條例施行細則 第3條】\n承租人依本條例第十一條第一項第一款規定提前終止租賃契約者，其應檢附之相關事證，為設立有案醫療機構出具療養時程需六個月以上之診斷證明。", "opts": ["1個月不夠，要6個月以上", "2個月不夠，要6個月以上", "3個月不夠，要6個月以上", ""]}, "1-1-26": {"law": "【租賃住宅市場發展及管理條例 第12條】\n前項點交後尚有遺留物，除租賃當事人另有約定外，經出租人定相當期限催告仍不取回時，視為拋棄其所有權，其所需處理費用，得由押金扣除，不足者，出租人得請求承租人給付。", "note": "東西留在房子裡，房東定期限催你來拿，你還是不拿，就當你不要了（視為拋棄所有權）。", "opts": ["不拿就不再是你的", "", "不是歸屬不明，是視為拋棄", "不是壞掉，是視為拋棄"]}, "1-1-27": {"law": "【租賃住宅市場發展及管理條例 第12條】\n前項點交後尚有遺留物，除租賃當事人另有約定外，經出租人定相當期限催告仍不取回時，視為拋棄其所有權，其所需處理費用，得由押金扣除，不足者，出租人得請求承租人給付。", "note": "處理遺留物的錢，可以直接從押金扣，不夠再跟房客要。", "opts": ["房東不用自己吞", "可以從押金扣", "", "不夠還可以向房客請求"]}, "1-1-28": {"law": "【租賃住宅市場發展及管理條例 第13條】\n出租人提供之租賃住宅廣告內容應與事實相符。", "note": "房東登廣告，內容要跟真實情況一樣。不能寫「僅供參考」就想甩鍋。", "opts": ["房東要負責，不是媒體", "媒體明知不實也要負責", "不能約定僅供參考", ""]}, "1-1-29": {"law": "【租賃住宅市場發展及管理條例 第13條】\n受託刊登租賃住宅廣告之媒體經營者明知或可得而知廣告之租賃住宅面積、屋齡、樓層別及法定用途與事實不符者，就承租人因信賴該廣告所受之損害與出租人負連帶賠償責任；其損害賠償責任，不得預先約定限制或拋棄。", "note": "刊登廣告的媒體明知（或該知道）不實，要跟房東「連帶賠」。連帶＝房客可以找任何一方賠全額。", "opts": ["", "不是各付一半，是連帶", "媒體明知不實要負責", "不是只有房東賠"]}, "1-1-30": {"law": "【租賃住宅市場發展及管理條例 第13條】\n受託刊登租賃住宅廣告之媒體經營者明知或可得而知廣告之租賃住宅面積、屋齡、樓層別及法定用途與事實不符者，就承租人因信賴該廣告所受之損害與出租人負連帶賠償責任；其損害賠償責任，不得預先約定限制或拋棄。", "note": "這種連帶賠償，不能事先約定免除或限制。寫了也沒用。", "opts": ["契約自由也不行", "", "不能約定只由房東賠", "不能約定只由刊登者賠"]}, "1-1-31": {"law": "【租賃住宅市場發展及管理條例 第16條】\n住宅租賃爭議，出租人或承租人得向直轄市或縣（市）政府申請調處，並免繳調處費用。", "note": "申請租賃糾紛調處，免費。", "opts": ["不用付3成", "", "不用付全額", "不用付一半"]}, "1-1-32": {"law": "【租賃住宅市場發展及管理條例 第17條】\n個人住宅所有權人將住宅委託代管業或出租予包租業轉租，契約約定供居住使用一年以上者，得依下列規定減徵租金所得稅：", "note": "想拿租稅優惠，房東要把房子交給代管業或出租給包租業，而且契約要寫「住1年以上」。", "opts": ["3年太久，1年就夠", "2年太久，1年就夠", "", "半年不夠，要1年"]}, "1-1-33": {"law": "【租賃住宅市場發展及管理條例 第17條】\n個人住宅所有權人將住宅委託代管業或出租予包租業轉租，契約約定…\n一、出租期間每屋每月租金收入不超過新臺幣六千元部分，免納綜合所得稅。", "note": "每月租金不超過6,000元的部分，免繳綜合所得稅。", "full": "【租賃住宅市場發展及管理條例 第17條】\n個人住宅所有權人將住宅委託代管業或出租予包租業轉租，契約約定供居住使用一年以上者，得依下列規定減徵租金所得稅：\n一、出租期間每屋每月租金收入不超過新臺幣六千元部分，免納綜合所得稅。", "opts": ["免稅額是6,000不是2,000", "免稅額是6,000不是3,000", "免稅額是6,000不是5,000", ""]}, "1-1-34": {"law": "【租賃住宅市場發展及管理條例 第17條】\n個人住宅所有權人將住宅委託代管業或出租予包租業轉租，契約約定…\n（一）每屋每月租金收入超過新臺幣六千元至二萬元部分，依該部分租金收入百分之五十三計算。", "note": "租金6,000～20,000這一段，費用直接當作53%。剩下47%才算所得。", "full": "【租賃住宅市場發展及管理條例 第17條】\n個人住宅所有權人將住宅委託代管業或出租予包租業轉租，契約約定供居住使用一年以上者，得依下列規定減徵租金所得稅：\n二、出租期間每屋每月租金收入超過新臺幣六千元部分，其租金所得必要損耗及費用之減除，住宅所有權人未能提具確實證據者，依下列方式認列：\n（一）每屋每月租金收入超過新臺幣六千元至二萬元部分，依該部分租金收入百分之五十三計算。", "opts": ["", "47%是要列的所得，費用是53%", "沒有43%", "沒有57%"]}, "1-1-35": {"law": "【租賃住宅市場發展及管理條例 第17條】\n個人住宅所有權人將住宅委託代管業或出租予包租業轉租，契約約定…\n一、出租期間每屋每月租金收入不超過新臺幣六千元部分，免納綜合所得稅。\n\n【租賃住宅市場發展及管理條例施行細則 第4條】\n本條例第十七條第一項序文所定契約約定供居住使用一年以上之認定…\n一、個人住宅所有權人委託租賃住宅代管業管理者：簽訂委託管理租賃住宅契約書與租賃契約書約定之委託管理及租賃期間均達一年以上。", "note": 9條】\n租賃住宅服務業應於完成公司登記後六個月內繳存營業保證金、置租賃住宅管理人員及加入登記所在地之同業公會，檢附有關證明文件向直轄市、縣（市）主管機關申請租賃住宅服務業登記並領得登記證後，始得營業；…", "note": "公司登記完成後6個月內，要繳保證金、請好管理人員、加入公會，再去登記領證，領到才能營業。", "full": "【租賃住宅市場發展及管理條例 第19條】\n租賃住宅服務業應於完成公司登記後六個月內繳存營業保證金、置租賃住宅管理人員及加入登記所在地之同業公會，檢附有關證明文件向直轄市、縣（市）主管機關申請租賃住宅服務業登記並領得登記證後，始得營業；屆期未辦妥登記者，由直轄市、縣（市）主管機關廢止其許可，並通知公司登記主管機關廢止其登記。", "opts": ["1個月太短", "2個月太短", "3個月是辦公司登記那一步", ""]}, "1-1-41": {"law": "【租賃住宅市場發展及管理條例 第19條】\n租賃住宅服務業或其分設營業處所於領得登記證後逾六個月未開始營業或自行停止營業連續六個月以上者，由直轄市、縣（市）主管機關廢止其登記並註銷其登記證。但依法辦理停業登記者，不在此限。", "note": "領了登記證卻超過6個月沒開始營業，登記證會被註銷。", "opts": ["1個月太短", "3個月太短", "", "9個月太久"]}, "1-1-42": {"law": "【租賃住宅市場發展及管理條例 第19條】\n代管業及包租業組織商業團體，應以租賃住宅服務商業之業別為之，不得依其業務性質分別組織。", "note": "代管業和包租業合組團體，要用「租賃住宅服務商業」這個名字，不能各組各的。", "opts": ["不能只用代管", "不能只用包租", "名稱不是「租賃房屋服務商業」", ""]}, "1-1-43": {"law": "【租賃住宅市場發展及管理條例 第21條】\n租賃住宅服務業及其分設營業處所營業後，所置租賃住宅管理人員異動者，應於異動之日起三十日內，造具名冊報請直轄市、縣（市）主管機關備查。", "note": "管理人員有人到職或離職，30天內要造名冊報備查。", "opts": ["不是60天", "", "不是20天", "不是10天"]}, "1-1-44": {"law": "【租賃住宅市場發展及管理條例施行細則 第16條】\n租賃住宅服務業或其分設營業處所經依前項規定准予停業登記者，於登記停業期間內，非經辦妥復業登記，不得有營業行為。", "note": "停業中不能營業，要先辦好「復業登記」才能營業。", "opts": ["要的是復業登記，不是商業登記", "不是註銷停業登記", "不能邊營業邊補辦", ""]}, "1-1-45": {"law": "【租賃住宅市場發展及管理條例 第22條】\n前項基金管理委員會委員，由租賃住宅服務業擔任者，其人數不得超過委員總數之五分之二。基金管理委員會之組織、基金管理及運用辦法，由中央主管機關定之。", "note": "保證基金管委會裡，租服業出身的委員最多2/5。", "opts": ["", "不是1/5，是2/5", "不是1/4，是2/5", "不是1/3，是2/5"]}, "1-1-46": {"law": "【租賃住宅市場發展及管理條例 第22條】\n租賃住宅服務業繳存之營業保證金低於第二十四條第三項辦法規定之額度時，全國聯合會應通知租賃住宅服務業者於一個月內補足；屆期未補足者，全國聯合會應通知直轄市、縣（市）主管機關依第三十七條第三款規定處罰。", "note": "保證金不夠，全聯會通知你1個月內補足。", "opts": ["不是半個月，是1個月", "", "不是2個月，是1個月", "不是3個月，是1個月"]}, "1-1-47": {"law": "【租賃住宅市場發展及管理條例 第23條】\n租賃住宅服務業因合併或變更組織型態時，其所繳存之營業保證金應隨之移轉。", "note": "公司合併或改組，保證金跟著走（隨之移轉），不用退也不用重繳。", "opts": ["不用重新申請", "不用退回", "", "不用取回"]}, "1-1-48": {"law": "【租賃住宅市場發展及管理條例 第25條】\n租賃住宅服務業應僱用具備租賃住宅管理人員資格者從事代管業務及包租業務。", "note": "代管、包租的業務，只能請有「租賃住宅管理人員」資格的人做。", "opts": ["", "沒有「仲介人員」這種資格", "沒有「代銷人員」這種資格", "經紀人屬於不動產經紀業"]}, "1-1-49": {"law": "【租賃住宅市場發展及管理條例 第25條】\n租賃住宅服務業應置專任租賃住宅管理人員至少一人；其分設營業處所者，每一營業處所，應置專任租賃住宅管理人員至少一人。", "note": "一家公司至少要有1個專任管理人員。", "opts": ["不用4人，至少1人", "", "不用2人，至少1人", "不用3人，至少1人"]}, "1-1-50": {"law": "【租賃住宅市場發展及管理條例 第25條】\n租賃住宅服務業應置專任租賃住宅管理人員至少一人；其分設營業處所者，每一營業處所，應置專任租賃住宅管理人員至少一人。", "note": "每個營業處所（含分店）都至少要有1個專任管理人員。", "opts": ["至少1人，不是3人", "至少1人，不是2人", "", "至少1人，不是4人"]}, "1-1-51": {"law": "【租賃住宅市場發展及管理條例 第25條】\n前項專任租賃住宅管理人員，不得同時受僱於二家以上租賃住宅服務業。", "note": "專任就是專任，不能同時掛在2家公司，最多1家。", "opts": ["專任不能兼4家", "專任不能兼3家", "專任不能兼2家", ""]}, "1-1-52": {"law": "【租賃住宅市場發展及管理條例 第26條】\n前項證書有效期限為四年，期滿前六個月內，租賃住宅管理人員應檢附其於最近二年內參加全國聯合會舉辦換證訓練並測驗合格之證明文件，向中央主管機關或其指定之機關（構）、團體、學校重新辦理登錄及換證。", "note": "管理人員證書有效4年。", "opts": ["不是5年，是4年", "", "不是3年，是4年", "不是2年，是4年"]}, "1-1-53": {"law": "【租賃住宅市場發展及管理條例 第26條】\n前項證書有效期限為四年，期滿前六個月內，租賃住宅管理人員應檢附其於最近二年內參加全國聯合會舉辦換證訓練並測驗合格之證明文件，向中央主管機關或其指定之機關（構）、團體、學校重新辦理登錄及換證。", "note": "證書到期前6個月內要辦換證，還要附最近2年內的換證訓練合格證明。", "opts": ["不是2個月", "不是3個月", "", "不是9個月"]}, "1-1-54": {"law": "【租賃住宅市場發展及管理條例 第29條】\n包租業應於前項契約書簽訂後三十日內，將該契約轉租標的範圍、租賃期間及次承租人資訊以書面通知出租人。", "note": "包租業跟次承租人簽完約，30天內要用書面通知房東。", "opts": ["不是21天", "", "不是14天", "不是7天"]}, "1-1-55": {"law": "【租賃住宅市場發展及管理條例 第30條】\n包租業轉租租賃住宅後，出租人提前終止租賃契約者，包租業除應於知悉終止租賃契約之次日起五日內通知次承租人終止轉租契約，協調返還租賃住宅、執行屋況及附屬設備點交事務、退還預收租金及全部或一部押金外，並應協助次承租人優先承租其他租賃住宅。", "note": "房東提前結束包租約，包租業在知道後隔天起5天內要通知次承租人終止轉租。還要幫忙：協調返還、點交、退預收租金與押金，並協助次承租人優先租別間。", "opts": ["不是10天，是5天", "不是7天，是5天", "", "不是3天，是5天"]}, "1-1-56": {"law": "【租賃住宅市場發展及管理條例 第31條】\n租賃住宅服務業因其受僱人執行業務之故意或過失致租賃住宅服務當事人受損害者，該租賃住宅服務業應與其受僱人負連帶賠償責任。", "note": "員工執行業務出包害到人，公司要跟員工一起賠（連帶），不能說是員工個人的事。", "opts": ["不只是賠償，是跟員工連帶賠", "", "公司不能免責", "是法定連帶責任，不是道義責任"]}, "1-1-57": {"law": "【租賃住宅市場發展及管理條例 第31條】\n被害人取得對租賃住宅服務業或其受僱人之執行名義或經基金管理委員會調處決議支付者，得於該租賃住宅服務業繳存營業保證金及提供擔保總額內，向全國聯合會請求代為賠償；…", "note": "要請「代為賠償」，是找全國聯合會，不是找政府或地方公會。", "full": "【租賃住宅市場發展及管理條例 第31條】\n前二項被害人向全國聯合會請求代為賠償時，其所設基金管理委員會應即進行調處。\n被害人取得對租賃住宅服務業或其受僱人之執行名義或經基金管理委員會調處決議支付者，得於該租賃住宅服務業繳存營業保證金及提供擔保總額內，向全國聯合會請求代為賠償；經代為賠償後，即應依第二十二條第五項規定，通知租賃住宅服務業限期補繳。", "opts": ["不是找地方主管機關", "不是找中央主管機關", "", "不是找地方公會，是全聯會"]}, "1-1-58": {"law": "【租賃住宅市場發展及管理條例施行細則 第27條】\n租賃住宅服務業收受租賃住宅服務當事人之有關費用或文件者，應掣給收據。", "note": "收到客戶的錢或文件，要開收據。", "opts": ["不是通知主管機關", "不是書面登記", "", "不是上網登錄"]}, "1-1-59": {"law": "【租賃住宅市場發展及管理條例 第34條】\n租賃住宅服務業應於訂定契約之日起三十日內，將其受託管理、承租或轉租租賃住宅之相關資訊，提供直轄市、縣（市）主管機關。", "note": "簽約後30天內，要把受託管理、承租或轉租的資料交給主管機關。", "opts": ["不是3天", "不是7天", "不是10天", ""]}, "1-1-60": {"law": "【租賃住宅市場發展及管理條例 第35條】\n主管機關檢查租賃住宅服務業之業務，租賃住宅服務業不得規避、妨礙或拒絕。", "note": "主管機關來檢查，業者不能躲、不能擋、不能拒絕。四個選項只有「同意」是對的。", "opts": ["", "規避是不行的", "妨礙是不行的", "拒絕是不行的"]}, "1-1-61": {"law": "【租賃住宅市場發展及管理條例施行細則 第28條】\n主管機關依本條例第三十五條規定檢查租賃住宅服務業之業務時，得查詢或取閱其執行業務有關紀錄及文件……\n前項有關紀錄及文件，應至少保存五年。", "note": "執行業務的紀錄文件，至少保存5年。", "full": "【租賃住宅市場發展及管理條例施行細則 第28條】\n主管機關依本條例第三十五條規定檢查租賃住宅服務業之業務時，得查詢或取閱其執行業務有關紀錄及文件，並得要求其陳述辦理業務情形，租賃住宅服務業不得規避、妨礙或拒絕。\n前項有關紀錄及文件，應至少保存五年，並得以電子檔案保存之。", "opts": ["不用7年，5年就夠", "", "3年不夠，要5年", "1年不夠，要5年"]}, "1-1-62": {"law": "【租賃住宅市場發展及管理條例 第36條】\n非租賃住宅服務業而經營代管業務或包租業務者，由直轄市、縣（市）主管機關禁止其營業，並處公司負責人、商業負責人、有限合夥負責人或行為人新臺幣四萬元以上二十萬元以下罰鍰，並限期改正；…", "note": "沒領照就做代管：罰 40,000～200,000 元。口訣：無照最重4～20萬、重大違規1～5萬、一般違規6千～3萬。", "full": "【租賃住宅市場發展及管理條例 第36條】\n非租賃住宅服務業而經營代管業務或包租業務者，由直轄市、縣（市）主管機關禁止其營業，並處公司負責人、商業負責人、有限合夥負責人或行為人新臺幣四萬元以上二十萬元以下罰鍰，並限期改正；屆期未改正者，按次處罰；情節重大者並得勒令歇業。", "opts": ["條例沒有這種金額", "條例沒有這種金額", "", "條例沒有這種金額"]}, "1-1-63": {"law": "【租賃住宅市場發展及管理條例 第37條】\n租賃住宅服務業有下列情事之一者，由直轄市、縣（市）主管機關處…\n一、違反第十三條第一項、第四項規定，廣告內容與事實不符或廣告未註明租賃住宅服務業名稱。", "note": "廣告內容不實：罰 10,000～50,000 元。口訣：無照最重4～20萬、重大違規1～5萬、一般違規6千～3萬。", "full": "【租賃住宅市場發展及管理條例 第37條】\n租賃住宅服務業有下列情事之一者，由直轄市、縣（市）主管機關處新臺幣一萬元以上五萬元以下罰鍰，並限期改正；屆期未改正者，按次處罰：\n一、違反第十三條第一項、第四項規定，廣告內容與事實不符或廣告未註明租賃住宅服務業名稱。", "opts": ["條例沒有這種金額", "條例沒有這種金額", "條例沒有這種金額", ""]}, "1-1-64": {"law": "【租賃住宅市場發展及管理條例 第37條】\n租賃住宅服務業有下列情事之一者，由直轄市、縣（市）主管機關處…\n一、違反第十三條第一項、第四項規定，廣告內容與事實不符或廣告未註明租賃住宅服務業名稱。", "note": "廣告沒寫業者名稱：罰 10,000～50,000 元。口訣：無照最重4～20萬、重大違規1～5萬、一般違規6千～3萬。", "full": "【租賃住宅市場發展及管理條例 第37條】\n租賃住宅服務業有下列情事之一者，由直轄市、縣（市）主管機關處新臺幣一萬元以上五萬元以下罰鍰，並限期改正；屆期未改正者，按次處罰：\n一、違反第十三條第一項、第四項規定，廣告內容與事實不符或廣告未註明租賃住宅服務業名稱。", "opts": ["" ]}, "1-1-91": {"law": "【租賃住宅市場發展及管理條例 第10條】\n租賃期間發生下列情形之一者，出租人得提前終止租賃契約，且承租…\n一、承租人毀損租賃住宅或附屬設備，不為修繕或相當之賠償。", "note": "房客弄壞房子又不修不賠：房東解約，提前30天書面通知。", "full": "【租賃住宅市場發展及管理條例 第10條】\n租賃期間發生下列情形之一者，出租人得提前終止租賃契約，且承租人不得要求任何賠償：\n一、承租人毀損租賃住宅或附屬設備，不為修繕或相當之賠償。\n出租人依前項規定提前終止租賃契約者，應依下列規定期限，檢附相關事證，以書面通知承租人：\n一、依前項第一款至第三款及第五款規定終止者，於終止前三十日。", "opts": ["不是7天，是30天", "", "不是半個月，是30天", "不是2個月，是30天"]}, "1-1-92": {"law": "【租賃住宅市場發展及管理條例 第10條】\n租賃期間發生下列情形之一者，出租人得提前終止租賃契約，且承租…\n二、承租人遲付租金或費用，達二個月之租額，經定相當期限催告仍拒繳。", "note": "房客欠租滿2個月、催告了還是不付：房東解約，提前30天書面通知。", "full": "【租賃住宅市場發展及管理條例 第10條】\n租賃期間發生下列情形之一者，出租人得提前終止租賃契約，且承租人不得要求任何賠償：\n二、承租人遲付租金或費用，達二個月之租額，經定相當期限催告仍拒繳。\n出租人依前項規定提前終止租賃契約者，應依下列規定期限，檢附相關事證，以書面通知承租人：\n一、依前項第一款至第三款及第五款規定終止者，於終止前三十日。", "opts": ["不是半個月，是30天", "不是7天，是30天", "", "不是2個月，是30天"]}, "1-1-93": {"law": "【租賃住宅市場發展及管理條例 第10條】\n租賃期間發生下列情形之一者，出租人得提前終止租賃契約，且承租…\n四、出租人為重新建築而必要收回。", "note": "房東要拆掉重建而收回：要提前3個月通知（比其他事由長）。", "full": "【租賃住宅市場發展及管理條例 第10條】\n租賃期間發生下列情形之一者，出租人得提前終止租賃契約，且承租人不得要求任何賠償：\n四、出租人為重新建築而必要收回。\n出租人依前項規定提前終止租賃契約者，應依下列規定期限，檢附相關事證，以書面通知承租人：\n二、依前項第四款規定終止者，於終止前三個月。", "opts": ["30天是其他事由，重建是3個月", "7天太短", "2個月不是條文數字", ""]}, "1-1-94": {"law": "【租賃住宅市場發展及管理條例 第11條】\n承租人依第一項各款或其繼承人依前項提前終止租賃契約者，應於終止前三十日，檢附相關事證，以書面通知出租人。", "note": "房客生病要長期療養想解約：提前30天書面通知房東。", "full": "【租賃住宅市場發展及管理條例 第11條】\n租賃期間發生下列情形之一者，承租人得提前終止租賃契約，且出租人不得要求任何賠償：\n一、因疾病、意外產生有長期療養之需要。\n承租人依第一項各款或其繼承人依前項提前終止租賃契約者，應於終止前三十日，檢附相關事證，以書面通知出租人。", "opts": ["", "不是20天，是30天", "不是7天，是30天", "不是2個月，是30天"]}, "1-1-95": {"law": "【租賃住宅市場發展及管理條例 第11條】\n租賃期間發生下列情形之一者，承租人得提前終止租賃契約，且出租…\n二、租賃住宅未合於居住使用，並有修繕之必要，經承租人定相當期限催告，而不於期限內修繕。", "note": "房子不能住、房東催了還不修：房客解約，提前30天書面通知。", "full": "【租賃住宅市場發展及管理條例 第11條】\n租賃期間發生下列情形之一者，承租人得提前終止租賃契約，且出租人不得要求任何賠償：\n二、租賃住宅未合於居住使用，並有修繕之必要，經承租人定相當期限催告，而不於期限內修繕。\n承租人依第一項各款或其繼承人依前項提前終止租賃契約者，應於終止前三十日，檢附相關事證，以書面通知出租人。", "opts": ["不是20天，是30天", "", "不是7天，是30天", "不是2個月，是30天"]}, "1-1-96": {"law": "【租賃住宅市場發展及管理條例 第11條】\n租賃期間發生下列情形之一者，承租人得提前終止租賃契約，且出租…\n三、因不可歸責於承租人之事由，致租賃住宅之一部滅失，且其存餘部分難以繼續居住。", "note": "房子壞掉一部分，剩下的難住人：房客 。", "full": "【租賃住宅市場發展及管理條例 第32條】\n下列文件應由租賃住宅服務業指派專任租賃住宅管理人員簽章：\n三、住宅租賃標的現況確認書。\n前項第一款規定，於經營包租業務者不適用之；前項第二款及第三款規定，於經營代管業務者不適用之。", "opts": ["代管業免簽", "代管業免簽", "", "代管業不適用，免簽"]}, "1-1-105": {"law": "【租賃住宅市場發展及管理條例 第36條】\n非租賃住宅服務業而經營代管業務或包租業務者，由直轄市、縣（市）主管機關禁止其營業，並處公司負責人、商業負責人、有限合夥負責人或行為人新臺幣四萬元以上二十萬元以下罰鍰，並限期改正；…", "note": "保全業沒領照就做代管＝無照營業，罰公司負責人 4萬～20萬。口訣：無照最重4～20萬。", "full": "【租賃住宅市場發展及管理條例 第36條】\n非租賃住宅服務業而經營代管業務或包租業務者，由直轄市、縣（市）主管機關禁止其營業，並處公司負責人、商業負責人、有限合夥負責人或行為人新臺幣四萬元以上二十萬元以下罰鍰，並限期改正；屆期未改正者，按次處罰；情節重大者並得勒令歇業。", "opts": ["條例沒有這種金額", "條例沒有這種金額", "條例沒有這種金額", ""]}, "1-1-106": {"law": "【租賃住宅市場發展及管理條例 第36條】\n非租賃住宅服務業而經營代管業務或包租業務者，由直轄市、縣（市）主管機關禁止其營業，並處公司負責人、商業負責人、有限合夥負責人或行為人新臺幣四萬元以上二十萬元以下罰鍰，並限期改正；…", "note": "經紀業沒有代管業資格就做代管＝無照營業，罰公司負責人 4萬～20萬。口訣：無照最重4～20萬。", "full": "【租賃住宅市場發展及管理條例 第36條】\n非租賃住宅服務業而經營代管業務或包租業務者，由直轄市、縣（市）主管機關禁止其營業，並處公司負責人、商業負責人、有限合夥負責人或行為人新臺幣四萬元以上二十萬元以下罰鍰，並限期改正；屆期未改正者，按次處罰；情節重大者並得勒令歇業。", "opts": ["", "條例沒有這種金額", "條例沒有這種金額", "條例沒有這種金額"]}, "1-1-107": {"law": "【租賃住宅市場發展及管理條例 第40條】\n本條例施行前已經營代管業務或包租業務者，自施行之日起，得繼續營業二年；二年屆滿後未依第十九條規定領有租賃住宅服務業登記證者，不得繼續營業。", "note": "條例實施前就在做代管或包租的公司，可以繼續做2年，之後沒領到登記證就不能做。", "opts": ["不是半年，是2年", "不是1年，是2年", "", "不是3年，是2年"]}, "1-2-01": {"law": "【租賃住宅服務業資訊提供辦法 第2條】\n前項第二款之契約提前終止時，代管業應提供提前終止之日期及原因。", "note": "代管業提前結束委託管理契約，要提供給主管機關的是「終止日期和原因」。", "full": "【租賃住宅服務業資訊提供辦法 第2條】\n租賃住宅代管業（以下簡稱代管業）應提供之租賃住宅相關資訊類別及內容如下：\n前項第二款之契約提前終止時，代管業應提供提前終止之日期及原因。", "opts": ["要的是日期和原因，不是違約金", "不用交契約書", "", "不用交關係人"]}, "1-2-02": {"law": "【租賃住宅服務業資訊提供辦法 第3條】\n前項第二款及第三款之契約提前終止時，包租業應提供提前終止之日期及原因。", "note": "包租契約提前結束，同樣是提供「終止日期和原因」。", "opts": ["要的是日期和原因，不是違約金", "", "不用交契約書", "不用交關係人"]}, "1-2-03": {"law": "【租賃住宅服務業資訊提供辦法 第2條】\n租賃住宅代管業（以下簡稱代管業）應提供之租賃住宅相關資訊類別…\n一、受託管理標的租約資訊：承租人、租賃筆棟數、建物門牌、建物型態、出租型態、租賃建物之建號及面積、租賃建物現況格局、總樓層數、租賃層次、租賃契約訂約日期、租賃期間、租金總額、車位個數、車位租金總額、車位類別、車位面積、車位所在樓層、有無電梯、有無管理員、有無管理組織、附屬設備及是否為社會住宅。", "note": "代管業要交的資料有：承租人、門牌、樓層、租金、車位等等。清單裡沒有「土地地號」，所以它就是錯的那個。", "full": "【租賃住宅服務業資訊提供辦法 第2條】\n租賃住宅代管業（以下簡稱代管業）應提供之租賃住宅相關資訊類別及內容如下：\n一、受託管理標的租約資訊：承租人、租賃筆棟數、建物門牌、建物型態、出租型態、租賃建物之建號及面積、租賃建物現況格局、總樓層數、租賃層次、租賃契約訂約日期、租賃期間、租金總額、車位個數、車位租金總額、車位類別、車位面積、車位所在樓層、有無電梯、有無管理員、有無管理組織、附屬設備及是否為社會住宅。", "opts": ["承租人在清單內", "租賃層次在清單內", "租金總額在清單內", ""]}, "1-2-04": {"law": "【租賃住宅服務業資訊提供辦法 第4條】\n租賃住宅服務業應於訂定契約之日起三十日內，將前二條規定應提供之租賃住宅相關資訊，使用電子憑證以網際網路方式提供直轄市、縣（市）主管機關。", "note": "簽約後30天內，用電子憑證上網提供資料給主管機關。", "opts": ["", "不是5天", "不是3天", "不是7天"]}, "1-2-05": {"law": "【租賃住宅服務業資訊提供辦法 第4條】\n租賃住宅服務業未於期限內提供相關資訊或提供不實資訊，應依本條例第三十八條第五款規定，於接獲裁處書及限期改正通知書後十五日內改正；屆期未改正，直轄市、縣（市）主管機關應按次處罰並限期於十五日內改正，至完成改正為止。", "note": "沒按時提供或亂提供，收到裁處書和限期改正通知書後，15天內要改。", "opts": ["不是5天", "不是10天", "", "不是20天"]}, "1-2-06": {"law": "【租賃住宅服務業資訊提供辦法 第4條】\n租賃住宅服務業未於期限內提供相關資訊或提供不實資訊，應依本條例第三十八條第五款規定，於接獲裁處書及限期改正通知書後十五日內改正；屆期未改正，直轄市、縣（市）主管機關應按次處罰並限期於十五日內改正，至完成改正為止。", "note": "15天內沒改，會按次再罰，並再給15天，一直到改完為止。", "opts": ["不是5天", "不是10天", "", "不是20天"]}, "10-1-01": {"law": "【租賃住宅市場發展及管理條例 第3條】\n本條例用詞，定義如下：\n六、租賃住宅管理業務：指租賃住宅之屋況與設備點交、收租與押金管理、日常修繕維護、糾紛協調處理及其他與租賃住宅管理有關之事項。", "note": "題庫認為租服業提供的服務包含「協助租屋契約公證」。售屋資訊是仲介，代收包裹、修繕保險不是它的業務。", "full": "【租賃住宅市場發展及管理條例 第3條】\n本條例用詞，定義如下：\n六、租賃住宅管理業務：指租賃住宅之屋況與設備點交、收租與押金管理、日常修繕維護、糾紛協調處理及其他與租賃住宅管理有關之事項。\n\n（《租賃住宅服務業倫理規範》是全國聯合會訂定的自律規範，不在全國法規資料庫，我沒有抓到原文）", "opts": ["售屋是仲介業務", "代收包裹不是", "修繕保險不是", ""]}, "10-1-02": {"law": "【租賃住宅市場發展及管理條例 第3條】\n本條例用詞，定義如下：\n五、租賃住宅包租業（以下簡稱包租業）：指承租租賃住宅並轉租，及經營該租賃住宅管理業務（以下簡稱包租業務）之公司。\n\n【不動產經紀業管理條例 第24條】\n雙方當事人簽訂租賃或買賣契約書時，經紀人應將不動產說明書交付與委託人交易之相對人，並由相對人在不動產說明書上簽章。", "note": "仲介是促成交易就結束（一次性）；代管和包租是持續管理（連續性）。", "full": "【租賃住宅市場發展及管理條例 第3條】\n本條例用詞，定義如下：\n四、租賃住宅代管業（以下簡稱代管業）：指受出租人之委託，經營租賃住宅管理業務（以下簡稱代管業務）之公司。\n五、租賃住宅包租業（以下簡稱包租業）：指承租租賃住宅並轉租，及經營該租賃住宅管理業務（以下簡稱包租業務）之公司。\n\n【不動產經紀業管理條例 第24條】\n雙方當事人簽訂租賃或買賣契約書時，經紀人應將不動產說明書交付與委託人交易之相對人，並由相對人在不動產說明書上簽章。", "opts": ["", "代管是受託，包租是承租再轉租", "包租有承租和轉租", "法律責任不同"]}, "10-1-03": {"law": "【租賃住宅市場發展及管理條例 第26條】\n經參加全國聯合會舉辦租賃住宅管理人員資格訓練並測驗合格者，應於取得合格證明之日起一年內向中央主管機關或其指定之機關（構）、團體、學校登錄及領有租賃住宅管理人員證書，始得充任租賃住宅管理人員。", "note": "管理人員要參加全聯會的資格訓練並測驗合格，才能登錄領證。不用有經紀人資格。", "opts": ["不需經紀人資格", "", "不是內政部直接核發", "不用先登記滿一年"]}, "10-1-04": {"law": "（《租賃住宅服務業倫理規範》是全國聯合會訂定的自律規範，不在全國法規資料庫，我沒有抓到原文）", "note": "用不當手段引導租客轉換業者是不行的。提供契約資訊、協助訂租金、協助申請補助都是正當服務。", "opts": ["這是正當服務", "這是正當服務", "", "這是正當服務"]}, "10-1-05": {"law": "【租賃住宅市場發展及管理條例 第13條】\n出租人提供之租賃住宅廣告內容應與事實相符。\n\n【租賃住宅市場發展及管理條例 第37條】\n租賃住宅服務業有下列情事之一者，由直轄市、縣（市）主管機關處…\n一、違反第十三條第一項、第四項規定，廣告內容與事實不符或廣告未註明租賃住宅服務業名稱。", "note": "廣告要跟事實相符。標「全新裝潢」卻是舊屋滲水，違反租賃條例，罰1萬～5萬。房東要求也不能照做。", "full": "【租賃住宅市場發展及管理條例 第13條】\n出租人提供之租賃住宅廣告內容應與事實相符。\n第一項及第二項廣告主為租賃住宅服務業者，應註明租賃住宅服務業者名稱。\n\n【租賃住宅市場發展及管理條例 第37條】\n租賃住宅服務業有下列情事之一者，由直轄市、縣（市）主管機關處新臺幣一萬元以上五萬元以下罰鍰，並限期改正；屆期未改正者，按次處罰：\n一、違反第十三條第一項、第四項規定，廣告內容與事實不符或廣告未註明租賃住宅服務業名稱。", "opts": ["跟估價師法無關", "", "這是租賃條例，不是消保法", "跟公平交易法無關"]}, "10-1-06": {"law": "（《租賃住宅服務業倫理規範》是全國聯合會訂定的自律規範，不在全國法規資料庫，我沒有抓到原文）", "note": "沒證據就在社群罵同業，違反「市場公平競爭原則」。", "opts": ["", "跟收費透明無關", "跟管理責任無關", "跟標的品質無關"]}, "10-1-07": {"law": "【租賃住宅市場發展及管理條例 第8條】\n出租人應於簽訂租賃契約前，向承租人說明由出租人負責修繕項目及範圍，並提供有修繕必要時之聯絡方式。\n\n【消費者保護法 第11-1條】\n企業經營者與消費者訂立定型化契約前，應有三十日以內之合理期間，供消費者審閱全部條款內容。", "note": "房東加註條款，仲介沒說明就是隱瞞重要條款，違反資訊揭露義務。", "full": "【租賃住宅市場發展及管理條例 第8條】\n出租人應於簽訂租賃契約前，向承租人說明由出租人負責修繕項目及範圍，並提供有修繕必要時之聯絡方式。\n\n【消費者保護法 第11-1條】\n企業經營者與消費者訂立定型化契約前，應有三十日以內之合理期間，供消費者審閱全部條款內容。\n\n（《租賃住宅服務業倫理規範》是全國聯合會訂定的自律規範，不在全國法規資料庫，我沒有抓到原文）", "opts": ["", "不是不實價格", "不是補助法規", "不是房東維修"]}, "10-1-08": {"law": "【租賃住宅市場發展及管理條例 第8條】\n出租人應以合於所約定居住使用之租賃住宅，交付承租人，並應於租賃期間保持其合於居住使用之狀態。", "note": "房客反映電線老舊，業者要良好溝通、即時回應。別叫房客停繳租金或自己認倒楣。", "full": "【租賃住宅市場發展及管理條例 第8條】\n出租人應以合於所約定居住使用之租賃住宅，交付承租人，並應於租賃期間保持其合於居住使用之狀態。\n前項由出租人負責修繕者，如出租人未於承租人所定適當期限內修繕，承租人得自行修繕並請求出租人償還其費用或於約定之租金中扣除。\n\n（《租賃住宅服務業倫理規範》是全國聯合會訂定的自律規範，不在全國法規資料庫，我沒有抓到原文）", "opts": ["不能叫房客自修", "不能叫房客停租", "", "不能叫房客認命"]}, "10-1-09": {"law": "【民法 第252條】\n約定之違約金額過高者，法院得減至相當之數額。", "note": "違約金太高，要協助雙方協商合理金額，符合公平原則。", "full": "【民法 第252條】\n約定之違約金額過高者，法院得減至相當之數額。\n\n（《租賃住宅服務業倫理規範》是全國聯合會訂定的自律規範，不在全國法規資料庫，我沒有抓到原文）", "opts": ["不能只依房東", "", "要有書面協議", "不能要求房客找人接手"]}, "10-1-10": {"law": "（《租賃住宅服務業倫理規範》是全國聯合會訂定的自律規範，不在全國法規資料庫，我沒有抓到原文）", "note": "為了賺佣金優先推高佣金物件，不行。要以租客最佳利益為優先。", "opts": ["不能自行決定推薦", "", "不能因佣金推薦", "不被發現也不行"]}, "10-1-11": {"law": "【個人資料保護法 第5條】\n個人資料之蒐集、處理或利用，應尊重當事人之權益，依誠實及信用方法為之，不得逾越特定目的之必要範圍，並應與蒐集之目的具有正當合理之關聯。\n\n【個人資料保護法 第19條】\n非公務機關對個人資料之蒐集或處理，除第六條第一項所規定資料外…\n二、與當事人有契約或類似契約之關係，且已採取適當之安全措施。", "note": "蒐集個資要說明用途並取得同意。要身分證影本和存摺卻不說明用途，不合理。", "full": "【個人資料保護法 第5條】\n個人資料之蒐集、處理或利用，應尊重當事人之權益，依誠實及信用方法為之，不得逾越特定目的之必要範圍，並應與蒐集之目的具有正當合理之關聯。\n\n【個人資料保護法 第19條】\n非公務機關對個人資料之蒐集或處理，除第六條第一項所規定資料外，應有特定目的，並符合下列情形之一者：\n二、與當事人有契約或類似契約之關係，且已採取適當之安全措施。", "opts": ["不能要求任何資訊", "", "不是信任", "房客可以拒絕"]}, "10-1-12": {"law": "（《租賃住宅服務業倫理規範》是全國聯合會訂定的自律規範，不在全國法規資料庫，我沒有抓到原文）", "note": "房東要求不租給年長者和外籍人士，是歧視。管理人員要跟房東說明這樣不符規範。", "opts": ["不能接受歧視", "", "不能篩選族群", "不能不回應"]}, "10-1-13": {"law": "（《租賃住宅服務業倫理規範》是全國聯合會訂定的自律規範，不在全國法規資料庫，我沒有抓到原文）", "note": "誘導租客和房東簽假租約領補助，不合法。", "opts": ["雙方同意也不行", "", "不是補助本意", "沒被查到也違法"]}, "10-1-14": {"law": "【消費者保護法 第22條】\n企業經營者應確保廣告內容之真實，其對消費者所負之義務不得低於廣告之內容。", "note": "廣告承諾「最低價、不滿意退款」卻做不到，就是虛偽誇大不實廣告。", "full": "【消費者保護法 第22條】\n企業經營者應確保廣告內容之真實，其對消費者所負之義務不得低於廣告之內容。\n企業經營者之商品或服務廣告內容，於契約成立後，應確實履行。\n\n（《租賃住宅服務業倫理規範》是全國聯合會訂定的自律規範，不在全國法規資料庫，我沒有抓到原文）", "opts": ["廣告要履行", "沒投訴也違規", "", "吸引客戶也不能不實"]}, "10-1-15": {"law": "【租賃住宅市場發展及管理條例 第32條】\n下列文件應由租賃住宅服務業指派專任租賃住宅管理人員簽章：\n五、租金、押金及相關費用收據。", "note": "亂收「合約管理費」又不給正式收據，不符倫理規範。收錢要給收據。", "full": "【租賃住宅市場發展及管理條例 第32條】\n下列文件應由租賃住宅服務業指派專任租賃住宅管理人員簽章：\n五、租金、押金及相關費用收據。\n\n（《租賃住宅服務業倫理規範》是全國聯合會訂定的自律規範，不在全國法規資料庫，我沒有抓到原文）", "opts": ["租客同意也不行", "", "不能自行決定收費", "沒異議也不行"]}, "10-1-16": {"law": "【租賃住宅市場發展及管理條例 第34條】\n包租業之租賃住宅轉租案件，應於簽訂轉租契約之日起三十日內，向直轄市、縣（市）主管機關申報登錄成交案件實際資訊（以下簡稱申報登錄資訊）。", "note": "包租業簽轉租契約後，30天內要申報登錄成交案件實際資訊。", "opts": ["不是10日", "不是15日", "", "不是60日"]}, "10-1-17": {"law": "【租賃住宅市場發展及管理條例 第32條】\n下列文件應由租賃住宅服務業指派專任租賃住宅管理人員簽章：\n六、退還租金、押金證明。", "note": "退還租金押金的證明，要由專任租賃住宅管理人員簽章。", "opts": ["不是任何人員", "不是房東", "", "不是房客"]}, "10-1-18": {"law": "【租賃住宅市場發展及管理條例 第33條】\n租賃住宅服務業應於營業處所明顯之處及其網站，揭示下列文件資訊…\n四、代管費用收取基準及方式。", "note": "營業處所要貼：登記證、公會會員證書、管理人員證書、代管費用收取基準及方式。", "full": "【租賃住宅市場發展及管理條例 第33條】\n租賃住宅服務業應於營業處所明顯之處及其網站，揭示下列文件資訊：\n一、登記證。\n二、同業公會會員證書。\n三、租賃住宅管理人員證書。\n四、代管費用收取基準及方式。", "opts": ["", "契約書不用貼", "收據不用貼", "契約書不用貼"]}, "10-1-19": {"law": "【租賃住宅市場發展及管理條例 第35條】\n主管機關檢查租賃住宅服務業之業務，租賃住宅服務業不得規避、妨礙或拒絕。\n\n【租賃住宅市場發展及管理條例 第34條】\n租賃住宅服務業應於訂定契約之日起三十日內，將其受託管理、承租或轉租租賃住宅之相關資訊，提供直轄市、縣（市）主管機關。", "note": "主管機關要資料，業者要提供，不得規避、妨礙或拒絕。", "full": "【租賃住宅市場發展及管理條例 第34條】\n租賃住宅服務業應於訂定契約之日起三十日內，將其受託管理、承租或轉租租賃住宅之相關資訊，提供直轄市、縣（市）主管機關。\n\n【租賃住宅市場發展及管理條例 第35條】\n主管機關檢查租賃住宅服務業之業務，租賃住宅服務業不得規避、妨礙或拒絕。", "opts": ["不能拒絕", "不能隱藏數據", "", "不能拒絕"]}, "10-1-20": {"law": "【租賃住宅市場發展及管理條例 第19條】\n租賃住宅服務業應於完成公司登記後六個月內繳存營業保證金、置租賃住宅管理人員及加入登記所在地之同業公會，檢附有關證明文件向直轄市、縣（市）主管機關申請租賃住宅服務業登記並領得登記證後，始得營業；…", "note": "完成公司登記後6個月內，要繳營業保證金、申請服務業登記。", "full": "【租賃住宅市場發展及管理條例 第19條】\n租賃住宅服務業應於完成公司登記後六個月內繳存營業保證金、置租賃住宅管理人員及加入登記所在地之同業公會，檢附有關證明文件向直轄市、縣（市）主管機關申請租賃住宅服務業登記並領得登記證後，始得營業；屆期未辦妥登記者，由直轄市、縣（市）主管機關廢止其許可，並通知公司登記主管機關廢止其登記。", "opts": ["不是3個月", "", "不是9個月", "不是12個月"]}, "10-1-21": {"law": "【租賃住宅市場發展及管理條例 第25條】\n前項專任租賃住宅管理人員，不得同時受僱於二家以上租賃住宅服務業。\n\n【租賃住宅市場發展及管理條例 第26條】\n前項證書有效期限為四年，期滿前六個月內，租賃住宅管理人員應檢附其於最近二年內參加全國聯合會舉辦換證訓練並測驗合格之證明文件，向中央主管機關或其指定之機關（構）、團體、學校重新辦理登錄及換證。", "note": "服務業至少要僱用1名專任管理人員，不能同時受僱2家以上，證書4年要換證。", "full": "【租賃住宅市場發展及管理條例 第25條】\n租賃住宅服務業應僱用具備租賃住宅管理人員資格者從事代管業務及包租業務。\n租賃住宅服務業應置專任租賃住宅管理人員至少一人；其分設營業處所者，每一營業處所，應置專任租賃住宅管理人員至少一人。\n前項專任租賃住宅管理人員，不得同時受僱於二家以上租賃住宅服務業。\n\n【租賃住宅市場發展及管理條例 第26條】\n前項證書有效期限為四年，期滿前六個月內，租賃住宅管理人員應檢附其於最近二年內參加全國聯合會舉辦換證訓練並測驗合格之證明文件，向中央主管機關或其指定之機關（構）、團體、學校重新辦理登錄及換證。", "opts": ["", "不能同時受僱兩家", "代管業也要僱用", "證書要換"]}, "10-1-22": {"law": "【租賃住宅市場發展及管理條例 第28條】\n代管業應與委託人簽訂委託管理租賃住宅契約書後，始得執行租賃住宅管理業務。", "note": "代管業要先簽委託管理契約才能執行業務，也不能轉委託給別家。", "full": "【租賃住宅市場發展及管理條例 第28條】\n代管業應與委託人簽訂委託管理租賃住宅契約書後，始得執行租賃住宅管理業務。\n前項代管業不得委託他代管業執行租賃住宅管理業務。", "opts": ["要先簽約", "不能轉委託", "", "要先簽約才能刊登"]}, "10-1-23": {"law": "【租賃住宅市場發展及管理條例 第29條】\n包租業與次承租人簽訂租賃契約書時，應提供住宅租賃標的現況確認書及前項經出租人同意轉租之書面文件，並於該契約書載明包租業與出租人之住宅租賃標的範圍、租賃期間及得終止租賃契約之事由。", "note": "包租業與次承租人簽約時，要提供「住宅租賃標的現況確認書」。", "opts": ["", "房屋稅單不是", "同意書是出租人提供", "收入證明不是"]}, "10-1-24": {"law": "【租賃住宅市場發展及管理條例 第16條】\n住宅租賃爭議，出租人或承租人得向直轄市或縣（市）政府申請調處，並免繳調處費用。", "note": "租賃爭議可向縣市政府申請調處，免繳費用。不用先打官司。", "opts": ["不用先訴訟", "", "不只仲裁", "可以找第三方"]}, "10-1-25": {"law": "【租賃住宅市場發展及管理條例 第20條】\n有下列情形之一者，不得充任租賃住宅服務業之負責人；已充任者，…\n三、經法院依消費者債務清理條例裁定開始清算程序，尚未復權。", "note": "被法院裁定清算、還沒復權的人，不能當租服業負責人。", "full": "【租賃住宅市場發展及管理條例 第20條】\n有下列情形之一者，不得充任租賃住宅服務業之負責人；已充任者，經直轄市、縣（市）主管機關令租賃住宅服務業限期改正；屆期未改正者，廢止其許可及註銷其登記證，並通知公司登記主管機關廢止其登記：\n三、經法院依消費者債務清理條例裁定開始清算程序，尚未復權。", "opts": ["清算會影響", "不能特別許可", "", "不是看開始營業"]}, "10-1-26": {"law": "【租賃住宅市場發展及管理條例 第32條】\n下列文件應由租賃住宅服務業指派專任租賃住宅管理人員簽章：\n四、屋況與附屬設備點交證明文件。", "note": "專任管理人員要簽章的文件包含屋況與附屬設備點交證明文件。", "opts": ["", "補貼申請不在其中", "完稅證明不在其中", "實價分析不在其中"]}, "10-1-27": {"law": "【消費者保護法 第12條】\n定型化契約中之條款違反誠信原則，對消費者顯失公平者，無效。", "note": "處理糾紛要公正，保護雙方權益並提供專業建議。不要只順從房東或只站房客。", "full": "【消費者保護法 第12條】\n定型化契約中之條款違反誠信原則，對消費者顯失公平者，無效。\n\n（《租賃住宅服務業倫理規範》是全國聯合會訂定的自律規範，不在全國法規資料庫，我沒有抓到原文）", "opts": ["不能順從房東", "不能偏袒房客", "", "不能不介入"]}, "10-1-28": {"law": "（《租賃住宅服務業倫理規範》是全國聯合會訂定的自律規範，不在全國法規資料庫，我沒有抓到原文）", "note": "故意散播不實消息打擊同業，違反公平競爭原則。", "opts": ["不實消息不是合理競爭", "", "不實訊息也是違規", "不是正常商業行為"]}, "10-1-29": {"law": "（《租賃住宅服務業倫理規範》是全國聯合會訂定的自律規範，不在全國法規資料庫，我沒有抓到原文）", "note": "謊稱來自知名公司就是冒用名義，要明確出示所屬公司證明。", "opts": ["", "不追究也違規", "不能接受", "影響信任"]}, "10-1-30": {"law": "【個人資料保護法 第5條】\n個人資料之蒐集、處理或利用，應尊重當事人之權益，依誠實及信用方法為之，不得逾越特定目的之必要範圍，並應與蒐集之目的具有正當合理之關聯。\n\n【個人資料保護法 第20條】\n非公務機關對個人資料之利用，除第六條第一項所規定資料外，應於蒐集之特定目的必要範圍內為之。但有下列情形之一者，得為特定目的外之利用：", "note": "個資要提供給第三方，必須事先徵得當事人同意。", "opts": ["不能因合作計畫分享", "", "部分資料也不行", "不能直接提供"]}, "10-1-31": {"law": "【民法 第153條】\n當事人互相表示意思一致者，無論其為明示或默示，契約即為成立。", "note": "契約要雙方同意才能變更，管理人員不能私自改租金。", "full": "【民法 第153條】\n當事人互相表示意思一致者，無論其為明示或默示，契約即為成立。\n\n（《租賃住宅服務業倫理規範》是全國聯合會訂定的自律規範，不在全國法規資料庫，我沒有抓到原文）", "opts": ["", "不能私改", "不能依市場自行調整", "不能私改契約"]}, "10-1-32": {"law": "【租賃住宅市場發展及管理條例 第36條】\n非租賃住宅服務業而經營代管業務或包租業務者，由直轄市、縣（市）主管機關禁止其營業，並處公司負責人、商業負責人、有限合夥負責人或行為人新臺幣四萬元以上二十萬元以下罰鍰，並限期改正；…\n\n【民法 第528條】\n稱委任者，謂當事人約定，一方委託他方處理事務，他方允為處理之契約。", "note": "受鄰居委託代管、收租金押金，題庫認為是「代理房東管理」的性質。", "full": "【民法 第103條】\n代理人於代理權限內，以本人名義所為之意思表示，直接對本人發生 , "不用證書", "不用成立公司"]}, "10-1-38": {"law": "【租賃住宅市場發展及管理條例 第13條】\n受託刊登租賃住宅廣告之媒體經營者明知或可得而知廣告之租賃住宅面積、屋齡、樓層別及法定用途與事實不符者，就承租人因信賴該廣告所受之損害與出租人負連帶賠償責任；其損害賠償責任，不得預先約定限制或拋棄。", "note": "媒體明知廣告不實，要與出租人負連帶賠償責任。", "full": "【租賃住宅市場發展及管理條例 第13條】\n受託刊登租賃住宅廣告之媒體經營者明知或可得而知廣告之租賃住宅面積、屋齡、樓層別及法定用途與事實不符者，就承租人因信賴該廣告所受之損害與出租人負連帶賠償責任；其損害賠償責任，不得預先約定限制或拋棄。\n第一項及第二項廣告主為租賃住宅服務業者，應註明租賃住宅服務業者名稱。", "opts": ["媒體明知也要連帶", "", "要註明業者名稱", "不能事先免責"]}, "10-1-39": {"law": "【租賃住宅市場發展及管理條例 第36條】\n非租賃住宅服務業而經營代管業務或包租業務者，由直轄市、縣（市）主管機關禁止其營業，並處公司負責人、商業負責人、有限合夥負責人或行為人新臺幣四萬元以上二十萬元以下罰鍰，並限期改正；…", "note": "沒登記就經營代管包租：禁止營業，罰4萬～20萬，限期改正，重大者可勒令歇業。", "full": "【租賃住宅市場發展及管理條例 第36條】\n非租賃住宅服務業而經營代管業務或包租業務者，由直轄市、縣（市）主管機關禁止其營業，並處公司負責人、商業負責人、有限合夥負責人或行為人新臺幣四萬元以上二十萬元以下罰鍰，並限期改正；屆期未改正者，按次處罰；情節重大者並得勒令歇業。", "opts": ["", "不是沒收", "契約不是一律有效", "補辦也不能免罰"]}, "10-1-40": {"law": "（《租賃住宅服務業倫理規範》是全國聯合會訂定的自律規範，不在全國法規資料庫，我沒有抓到原文）", "note": "協助政府健全制度，要僱用有管理人員資格或專業知識的人，而不是只在媒體上批評。", "opts": ["", "不是批評", "要實際執行", "不是置身事外"]}, "10-1-41": {"law": "（《租賃住宅服務業倫理規範》是全國聯合會訂定的自律規範，不在全國法規資料庫，我沒有抓到原文）", "note": "租服業要以誠信為基礎、重視服務品質。", "opts": ["不是追求最高價", "", "不能降低品質", "不是降低競爭"]}, "10-1-42": {"law": "（《租賃住宅服務業倫理規範》是全國聯合會訂定的自律規範，不在全國法規資料庫，我沒有抓到原文）", "note": "市場秩序：尊重同業的智慧財產和營業秘密。", "opts": ["不能用他人商業機密", "", "不能惡性削價", "不能壟斷"]}, "10-1-43": {"law": "【個人資料保護法 第11條】\n違反本法規定蒐集、處理或利用個人資料者，應主動或依當事人之請求，刪除、停止蒐集、處理或利用該個人資料。\n\n【個人資料保護法 第5條】\n個人資料之蒐集、處理或利用，應尊重當事人之權益，依誠實及信用方法為之，不得逾越特定目的之必要範圍，並應與蒐集之目的具有正當合理之關聯。", "note": "處理個資要遵守個資法，不是當事人沒反對就能一直用。", "full": "【個人資料保護法 第5條】\n個人資料之蒐集、處理或利用，應尊重當事人之權益，依誠實及信用方法為之，不得逾越特定目的之必要範圍，並應與蒐集之目的具有正當合理之關聯。\n\n【個人資料保護法 第11條】\n個人資料蒐集之特定目的消失或期限屆滿時，應主動或依當事人之請求，刪除、停止處理或利用該個人資料。但因執行職務或業務所必須或經當事人書面同意者，不在此限。\n違反本法規定蒐集、處理或利用個人資料者，應主動或依當事人之請求，刪除、停止蒐集、處理或利用該個人資料。\n\n（《租賃住宅服務業倫理規範》是全國聯合會訂定的自律規範，不在全國法規資料庫，我沒有抓到原文）", "opts": ["沒異議也要遵守個資法", "", "要有安全措施", "要持續管理"]}, "10-1-44": {"law": "（《租賃住宅服務業倫理規範》是全國聯合會訂定的自律規範，不在全國法規資料庫，我沒有抓到原文）", "note": "利益衝突時，永遠以當事人最佳利益為優先。", "opts": ["不能收獎勵", "要事前預防", "", "不能只考慮公司"]}, "10-1-45": {"law": "（《租賃住宅服務業倫理規範》是全國聯合會訂定的自律規範，不在全國法規資 頭講好就成立也生效。沒付錢只是違約，不是契約沒成立。", "opts": ["", "口頭合意就生效", "合意了就成立", "沒付錢只是違約"]}, "2-1-5": {"law": "【民法 第162條】\n撤回要約之通知，其到達在要約到達之後，而按其傳達方法，通常在相當時期內應先時或同時到達，其情形為相對人可得而知者，相對人應向要約人即發遲到之通知。", "note": "甲還沒發出承諾，乙的「不租」通知就先到了→乙的要約失效，甲無從承諾，契約沒成立。答 C。", "full": "【民法 第162條】\n撤回要約之通知，其到達在要約到達之後，而按其傳達方法，通常在相當時期內應先時或同時到達，其情形為相對人可得而知者，相對人應向要約人即發遲到之通知。\n相對人怠於為前項通知者，其要約撤回之通知，視為未遲到。", "opts": ["反悔先到，沒成立", "是沒成立，不是未生效", "", "不是效力未定，是失效"]}, "2-1-6": {"law": "【民法 第14條】\n對於因精神障礙或其他心智缺陷，致不能為意思表示或受意思表示，或不能辨識其意思表示之效果者，法院得因本人、配偶、四親等內之親屬、最近一年有同居事實之其他親屬、檢察官、主管機關、社會福利機構、輔助人、意定監護受任人或其他利害關係人之聲請，為監護之宣告。\n\n【民法 第15條】\n受監護宣告之人，無行為能力。", "note": "受監護宣告的人完全不能自己簽，要監護人代簽。輔助宣告才是「自己簽＋輔助人同意」。", "opts": ["", "這是輔助宣告才有的做法", "監護宣告的人自己簽無效", "配偶不是法定代理人"]}, "2-1-7": {"law": "【民法 第15-1條】\n對於因精神障礙或其他心智缺陷，致其為意思表示或受意思表示，或辨識其意思表示效果之能力，顯有不足者，法院得因本人、配偶、四親等內之親屬、最近一年有同居事實之其他親屬、檢察官、主管機關或社會福利機構之聲請，為輔助之宣告。\n\n【民法 第15-2條】\n受輔助宣告之人為下列行為時，應經輔助人同意。但純獲法律上利益…\n五、為不動產、船舶、航空器、汽車或其他重要財產之處分、設定負擔、買賣、租賃或借貸。", "note": "輔助宣告的人：自己簽，但要輔助人同意（出租不動產屬於要同意的項目）。", "full": "【民法 第15-1條】\n對於因精神障礙或其他心智缺陷，致其為意思表示或受意思表示，或辨識其意思表示效果之能力，顯有不足者，法院得因本人、配偶、四親等內之親屬、最近一年有同居事實之其他親屬、檢察官、主管機關或社會福利機構之聲請，為輔助之宣告。\n\n【民法 第15-2條】\n受輔助宣告之人為下列行為時，應經輔助人同意。但純獲法律上利益，或依其年齡及身分、日常生活所必需者，不在此限：\n五、為不動產、船舶、航空器、汽車或其他重要財產之處分、設定負擔、買賣、租賃或借貸。", "opts": ["父母不能代簽", "", "不經輔助人同意不行", "配偶不能代簽"]}, "2-1-8": {"law": "【民法 第15條】\n受監護宣告之人，無行為能力。\n\n【民法 第15-2條】\n受輔助宣告之人為下列行為時，應經輔助人同意。但純獲法律上利益…\n五、為不動產、船舶、航空器、汽車或其他重要財產之處分、設定負擔、買賣、租賃或借貸。", "note": "對方被宣告監護或輔助，簽約要看「裁定書」，才知道誰有權簽。印鑑證明和公證都替代不了。", "full": "【民法 第15條】\n受監護宣告之人，無行為能力。\n\n【民法 第15-2條】\n受輔助宣告之人為下列行為時，應經輔助人同意。但純獲法律上利益，或依其年齡及身分、日常生活所必需者，不在此限：\n五、為不動產、船舶、航空器、汽車或其他重要財產之處分、設定負擔、買賣、租賃或借貸。", "opts": ["", "不是看判決確定證明", "印鑑證明看不出行為能力", "公證不能取代裁定書"]}, "2-1-9": {"law": "【民法 第103條】\n代理人於代理權限內，以本人名義所為之意思表示，直接對本人發生效力。", "note": "代理人用「本人名義」簽，效果歸本人。所以出租人是房東甲，不是代理人也不是仲介。", "opts": ["", "代理人只是代簽", "仲介只是居間", "代理的效力直接歸本人"]}, "2-1-10": {"law": "【民法 第103條】\n代理人於代理權限內，以本人名義所為之意思表示，直接對本人發生效力。", "note": "對方說他是代理人？最保險看「授權書」，還要公證，才證明得了真假。", "opts": ["口頭說了不算", "一般授權書真偽難辨", "", "印鑑證明不能證明有授權"]}, "2-1-11": {"law": "【民法 第174條】\n管理人違反本人明示或可得推知之意思，而為事務之管理者，對於因其管理所生之損害，雖無過失，亦應負賠償之責。", "note": "無因管理違反本人意思，就算你沒過失，造成的損害也要賠（無過失責任）。", "opts": ["不用有過失就要賠", "不用重大過失就要賠", "不用故意就要賠", ""]}, "2-1-12": {"law": "【民法 第248條】\n訂約當事人之一方，由他方受有定金時，推定其契約成立。", "note": "收了定金，「推定」契約成立。是推定，對方有反證還是可以推翻。", "opts": ["", "是推定，不是視為", "是推定，不是確定", "推定的是「成立」，不是「生效」"]}, "2-1-13": {"law": "【民法 第245-1條】\n契約未成立時，當事人為準備或商議訂立契約而有左列情形之一者，…\n一、就訂約有重要關係之事項，對他方之詢問，惡意隱匿或為不實之說明者。", "note": "契約沒成立，但房東故意隱瞞重要事情（像凶宅），害對方白忙，要賠。這叫締約過失。", "full": "【民法 第245-1條】\n契約未成立時，當事人為準備或商議訂立契約而有左列情形之一者，對於非因過失而信契約能成立致受損害之他方當事人，負賠償責任：\n一、就訂約有重要關係之事項，對他方之詢問，惡意隱匿或為不實之說明者。", "opts": ["沒成立也可以請求賠償", "", "締約過失不看是不是消費關係", "房東隱瞞，他要負責"]}, "2-1-14": {"law": "【民法 第245-1條】\n契約未成立時，當事人為準備或商議訂立契約而有左列情形之一者，…\n二、知悉或持有他方之秘密，經他方明示應予保密，而因故意或重大過失洩漏之者。", "note": "對方明說要保密，你卻因故意或重大過失洩漏，要賠對方準備訂約的損失。", "full": "【民法 第245-1條】\n契約未成立時，當事人為準備或商議訂立契約而有左列情形之一者，對於非因過失而信契約能成立致受損害之他方當事人，負賠償責任：\n二、知悉或持有他方之秘密，經他方明示應予保密，而因故意或重大過失洩漏之者。", "opts": ["沒簽成也可以請求", "", "不看是不是消費關係", "不用先判了妨害秘密罪"]}, "2-1-15": {"law": "【民法 第247-1條】\n依照當事人一方預定用於同類契約之條款而訂定之契約，為左列各款…\n一、免除或減輕預定契約條款之當事人之責任者。", "note": "定型化條款有四種「太不公平就無效」。「租期內不得任意終止」不在這四種，所以有效。", "full": "【民法 第247-1條】\n依照當事人一方預定用於同類契約之條款而訂定之契約，為左列各款之約定，按其情形顯失公平者，該部分約定無效：\n一、免除或減輕預定契約條款之當事人之責任者。\n二、加重他方當事人之責任者。\n三、使他方當事人拋棄權利或限制其行使權利者。", "opts": ["免除自己責任，太不公平會無效", "逼對方放棄權利，太不公平會無效", "加重對方責任，太不公平會無效", ""]}, "2-1-16": {"law": "【民法 第259條】\n契約解除時，當事人雙方回復原狀之義務，除法律另有規定或契約另…\n一、由他方所受領之給付物，應返還之。", "note": "「解除」是整份契約當作沒發生過（溯及既往）。「終止」只往後、「撤銷」是意思有瑕疵才用。", "full": "【民法 第259條】\n契約解除時，當事人雙方回復原狀之義務，除法律另有規定或契約另有訂定外，依左列之規定：\n一、由他方所受領之給付物，應返還之。", "opts": ["終止只管以後，不會當作沒發生過", "撤銷是意思表示有瑕疵才用", "", "撤回是還沒生效前收回"]}, "2-1-17": {"law": "【民法 第314條】\n清償地，除法律另有規定或契約另有訂定，或另有習慣，或得依債之…\n二、其他之債，於債權人之住所地為之。", "note": "題庫答案：A 租賃房屋所在地。考試照題庫選 A。", "full": "【民法 第314條】\n清償地，除法律另有規定或契約另有訂定，或另有習慣，或得依債之性質或其他情形決定者外，應依左列各款之規定：\n一、以給付特定物為標的者，於訂約時，其物所在地為之。\n二、其他之債，於債權人之住所地為之。", "flag": "民法第314條字面是「其他之債，於債權人（房東）住所地清償」，看起來是 D；但題庫答案是 A，考試選 A。", "opts": ["", "不是房客原本的住所地", "不是房東的營業處所", "條文字面像是這個，但題庫答案是 A，考試別選"]}, "2-1-18": {"law": "【民法 第422條】\n不動產之租賃契約，其期限逾一年者，應以字據訂立之，未以字據訂立者，視為不定期限之租賃。", "note": "不動產租賃超過1年，要寫字據；沒寫，就當作不定期租賃。", "opts": ["不用10年，超過1年就算", "不用5年，超過1年就算", "不用3年，超過1年就算", ""]}, "2-1-19": {"law": "【民法 第71條】\n法律行為，違反強制或禁止之規定者，無效。但其規定並不以之為無效者，不在此限。\n\n【民法 第421條】\n稱租賃者，謂當事人約定，一方以物租與他方使用收益，他方支付租金之契約。", "note": "違建出租，租賃契約本身還是有效。違建是行政處罰問題，不影響私人契約。", "opts": ["契約仍有效", "不用主管機關許可才有效", "", "不要求適居性才有效"]}, "2-1-20": {"law": "【民法 第424條】\n租賃物為房屋或其他供居住之處所者，如有瑕疵，危及承租人或其同居人之安全或健康時，承租人雖於訂約時已知其瑕疵，或已拋棄其終止契約之權利，仍得終止契約。", "note": "房子有害健康或安全（輻射屋），就算你簽約時知道，事後還是可以終止租約。", "opts": ["這種情形給的是終止權，不是降租", "解除是回到沒簽約，這裡給的是終止", "這裡給的是終止權，不是賠償", ""]}, "2-1-21": {"law": "【民法 第425條】\n出租人於租賃物交付後，承租人占有中，縱將其所有權讓與第三人，其租賃契約，對於受讓人仍繼續存在。", "note": "買賣不破租賃：房子已交給房客，房東賣掉，新房東要繼續承受租約。", "opts": ["租約不會因賣房而終止", "房客沒有優先購買權", "", "不用新屋主同意，租約就繼續"]}, "2-1-22": {"law": "【民法 第425條】\n前項規定，於未經公證之不動產租賃契約，其期限逾五年或未定期限者，不適用之。", "note": "租超過5年或沒定期限，要「公證」才適用買賣不破租賃。", "opts": ["", "認證不夠", "律師見證不夠", "地政士簽證不夠"]}, "2-1-23": {"law": "【民法 第425條】\n出租人於租賃物交付後，承租人占有中，縱將其所有權讓與第三人，其租賃契約，對於受讓人仍繼續存在。", "note": "買賣不破租賃的前提是「已經交屋」。還沒交屋就賣掉，房客不能主張。", "full": "【民法 第425條】\n出租人於租賃物交付後，承租人占有中，縱將其所有權讓與第三人，其租賃契約，對於受讓人仍繼續存在。\n前項規定，於未經公證之不動產租賃契約，其期限逾五年或未定期限者，不適用之。", "opts": ["", "未公證逾5年也不適用，但題庫選未交付", "不定期未公證也不適用，但題庫選未交付", "已交屋，可以主張"]}, "2-1-24": {"law": "【公證法 第13條】\n當事人請求公證人就下列各款法律行為作成之公證書，載明應逕受強…\n三、租用或借用建築物或其他工作物，定有期限並應於期限屆滿時交還者。\n\n【民法 第425條】\n前項規定，於未經公證之不動產租賃契約，其期限逾五年或未定期限者，不適用之。", "note": "最實惠的是「公證並載明逕受強制執行」，租期到了房客不還，直接聲請強制執行。", "full": "【民法 第425條】\n前項規定，於未經公證之不動產租賃契約，其期限逾五年或未定期限者，不適用之。\n\n【公證法 第13條】\n當事人請求公證人就下列各款法律行為作成之公證書，載明應逕受強制執行者，得依該證書執行之：\n三、租用或借用建築物或其他工作物，定有期限並應於期限屆滿時交還者。", "opts": ["履約保證不能強制執行", "履約保險不能強制執行", "", "多一個保證人不能直接強制執行"]}, "2-1-25": {"law": "【民法 第427條】\n就租賃物應納之一切稅捐，由出租人負擔。", "note": "租賃物的房屋稅、地價稅，法律預設是房東付。要換成房客付，要另外講好。", "opts": ["", "不是全部稅捐都歸房客", "修繕原則歸房東", "保存行為費用歸房東"]}, "2-1-26": {"law": "【民法 第429條】\n租賃物之修繕，除契約另有訂定或另有習慣外，由出租人負擔。", "note": "修繕原則上是房東的事，除非契約另有約定或習慣。", "opts": ["原則上不是房客", "", "不是各付一半", "自然耗損是房東沒錯，但題目問的是整體原則：房東"]}, "2-1-27": {"law": "【民法 第431條】\n承租人就租賃物支出有益費用，因而增加該物之價值者，如出租人知其情事而不為反對之表示，於租賃關係終止時，應償還其費用。但以其現存之增價額為限。", "note": "房客花錢增加房子價值，房東知道又沒反對，退租時要補償，但只算「現在還剩的價值」。", "full": "【民法 第431條】\n承租人就租賃物支出有益費用，因而增加該物之價值者，如出租人知其情事而不為反對之表示，於租賃關係終止時，應償還其費用。但以其現存之增價額為限。\n承租人就租賃物所增設之工作物，得取回之。但應回復租賃物之原狀。", "opts": ["房東知情沒反對，要補償", "不是當初花的錢", "", "要補償，不能只叫房客復原"]}, "2-1-28": {"law": "【民法 第432條】\n承租人應以善良管理人之注意，保管租賃物，租賃物有生產力者，並應保持其生產力。", "note": "房客保管房子要用「善良管理人」的注意，比照顧自己的東西還嚴一點。", "opts": ["比普通人的注意更高", "這是處理自己事務的標準，比較鬆", "", "沒有企業經營者之注意這種標準"]}, "2-1-29": {"law": "【民法 第433條】\n因承租人之同居人或因承租人允許為租賃物之使用、收益之第三人應負責之事由，致租賃物毀損、滅失者，承租人負損害賠償責任。", "note": "同住的人或房客允許用的人弄壞東西，房客自己要對房東負責，再去找肇事的人要。", "opts": ["房東不用賠", "兄不是賠償對象", "", "房客要負責，不是小孩"]}, "2-1-30": {"law": "【民法 第434條】\n租賃物因承租人之重大過失，致失火而毀損、滅失者，承租人對於出租人負損害賠償責任。", "note": "失火燒壞房子，房客要賠的門檻是「重大過失」。輕過失不用賠。", "opts": ["輕過失不用賠", "不用到故意", "不是無過失責任", ""]}, "2-1-31": {"law": "【民法 第440條】\n租賃物為房屋者，遲付租金之總額，非達二個月之租額，不得依前項之規定，終止契約。其租金約定於每期開始時支付者，並應於遲延給付逾二個月時，始得終止契約。", "note": "房屋遲付租金要「欠滿2個月」，還要催告過才能終止。若約定每期開頭付，則要遲延超過2個月。", "full": "【民法 第440條】\n承租人租金支付有遲延者，出租人得定相當期限，催告承租人支付租金，如承租人於其期限內不為支付，出租人得終止契約。\n租賃物為房屋者，遲付租金之總額，非達二個月之租額，不得依前項之規定，終止契約。其租金約定於每期開始時支付者，並應於遲延給付逾二個月時，始得終止契約。", "opts": ["房屋要欠滿2個月才行", "未滿2個月不能終止", "", "還是要催告"]}, "2-1-32": {"law": "【民法 第442條】\n租賃物為不動產者，因其價值之昇降，當事人得聲請法院增減其租金。但其租賃定有期限者，不在此限。", "note": "房租能請法院增減，只限「不定期租賃」。定期租約講好就不能調。", "opts": ["定期租約約定好，不能請求調整", "", "5年以上不是條件", "租地建屋不是這條"]}, "2-1-33": {"law": "【民法 第443條】\n承租人非經出租人承諾，不得將租賃物轉租於他人。但租賃物為房屋者，除有反對之約定外，承租人得將其一部分轉租於他人。", "note": "房屋原則上可以轉租「一部分」，除非契約禁止。", "opts": ["房屋除了反對約定，可轉租一部分", "", "禁止轉租的約定有效", "不是向次承租人請求返還"]}, "2-1-34": {"law": "【民法 第444條】\n因次承租人應負責之事由所生之損害，承租人負賠償責任。", "note": "轉租後次承租人弄壞東西，房東找「承租人」賠，不是直接找次承租人。", "opts": ["不是連帶，房東找承租人", "房東與次承租人沒有契約", "不用法院判定", ""]}, "2-1-35": {"law": "【民法 第767條】\n所有人對於無權占有或侵奪其所有物者，得請求返還之。對於妨害其所有權者，得請求除去之。有妨害其所有權之虞者，得請求防止之。\n\n【民法 第440條】\n承租人租金支付有遲延者，出租人得定相當期限，催告承租人支付租金，如承租人於其期限內不為支付，出租人得終止契約。", "note": "乙的租約被甲「終止」後，丙的轉租權
