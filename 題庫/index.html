源跟著沒了，丙繼續住就是「無權占有」，甲可依民法第767條請丙返還房屋。", "full": "【民法 第440條】\n承租人租金支付有遲延者，出租人得定相當期限，催告承租人支付租金，如承租人於其期限內不為支付，出租人得終止契約。\n\n【民法 第767條】\n所有人對於無權占有或侵奪其所有物者，得請求返還之。對於妨害其所有權者，得請求除去之。有妨害其所有權之虞者，得請求防止之。", "opts": ["", "不是轉租自動終止，是房東能請求返還", "竊占是刑法用語", "侵權行為不是主要依據"]}, "2-1-36": {"law": "【民法 第445條】\n不動產之出租人，就租賃契約所生之債權，對於承租人之物置於該不動產者，有留置權。但禁止扣押之物，不在此限。\n\n【民法 第447條】\n出租人有提出異議權者，得不聲請法院，逕行阻止承租人取去其留置物；如承租人離去租賃之不動產者，並得占有其物。", "note": "房客想搬走東西，房東有異議權，可以不用聲請法院，直接阻止搬走。", "opts": ["不用聲請法院", "不用報警", "地政機關無關", ""]}, "2-1-37": {"law": "【民法 第449條】\n租賃契約之期限，不得逾二十年。逾二十年者，縮短為二十年。", "note": "租期最長20年，超過就縮成20年；到期可以續。", "opts": ["最長不是10年", "最長不是15年", "", "30年超過上限"]}, "2-1-38": {"law": "【民法 第450條】\n租賃定有期限者，其租賃關係，於期限屆滿時消滅。", "note": "定期租賃，期限一到就結束。不用等交屋、搬家或退押金。", "opts": ["點交不影響結束", "", "搬家不影響結束", "退押金不影響結束"]}, "2-1-39": {"law": "【民法 第450條】\n未定期限者，各當事人得隨時終止契約。但有利於承租人之習慣者，從其習慣。", "note": "沒定期限的租約，隨時可以終止（有利房客的習慣除外）。", "opts": ["不是房客搬家才能終止", "不是房客有別的房子才能終止", "", "欠租是另一種終止事由"]}, "2-1-40": {"law": "【民法 第450條】\n未定期限者，各當事人得隨時終止契約。但有利於承租人之習慣者，從其習慣。\n\n【土地法 第100條】\n出租人非因左列情形之一，不得收回房屋。", "note": "民法說隨時可終止，但房屋租賃還要看土地法：房東要符合土地法第100條的情形才能收回房屋。", "full": "【民法 第450條】\n未定期限者，各當事人得隨時終止契約。但有利於承租人之習慣者，從其習慣。\n\n【土地法 第100條】\n出租人非因左列情形之一，不得收回房屋。\n一、出租人收回自住或重新建築時。\n二、承租人違反民法第四百四十三條第一項之規定轉租於他人時。\n三、承租人積欠租金額，除擔保金抵償外，達二個月以上時。\n四、承租人以房屋供違反法令之使用時。\n五、承租人違反租賃契約時。\n六、承租人損壞出租人之房屋或附著財物，而不為相當之賠償時。", "opts": ["房客搬家不是條件", "", "房屋租賃受土地法限制，不是隨時", "欠租是另一種終止原因"]}, "2-1-41": {"law": "【民法 第450條】\n前項終止契約，應依習慣先期通知。但不動產之租金，以星期、半個月或一個月定其支付之期限者，出租人應以曆定星期、半個月或一個月之末日為契約終止期，並應至少於一星期、半個月或一個月前通知之。", "note": "條文只寫了星期、半個月、一個月三種。3個月付一次的，依習慣提前通知，題庫選3個月前。", "flag": "題庫給 C（3 個月前），條文沒有寫「3 個月」這一種，是對照「每期為單位」的出題邏輯，考試記題庫答案。", "opts": ["1個月是月付的情形", "2個月不是條文", "", "6個月不是條文"]}, "2-1-42": {"law": "【民法 第422條】\n不動產之租賃契約，其期限逾一年者，應以字據訂立之，未以字據訂立者，視為不定期限之租賃。\n\n【民法 第425條】\n前項規定，於未經公證之不動產租賃契約，其期限逾五年或未定期限者，不適用之。", "note": "超過5年但沒公證，還是「定期」租約，只是不適用買賣不破租賃。不定期有三種：沒寫字據逾1年、沒定期限、期滿繼續住。", "opts": ["", "期滿繼續住，視為不定期", "沒寫字據逾1年，視為不定期", "沒定期限，本來就是不定期"]}, "2-1-43": {"law": "【民法 第451條】\n租賃期限屆滿後，承租人仍為租賃物之使用收益，而出租人不即表示反對之意思者，視為以不定期限繼續契約。", "note": "期滿房客繼續住、房東沒反對，視為不定期繼續。但雙方重新簽一份新約，就是新約，不是不定期。", "opts": ["這會變不定期", "這會變不定期", "這會變不定期", ""]}, "2-1-44": {"law": "【民法 第326條】\n債權人受領遲延，或不能確知孰為債權人而難為給付者，清償人得將其給付物，為債權人提存之。", "note": "房東不肯收租金，房客可以把錢「提存到法院」，等於付清。", "opts": ["房東拒收，房客仍要付", "不是寄存警察局", "", "不是信託"]}, "2-1-45": {"law": "【民法 第326條】\n債權人受領遲延，或不能確知孰為債權人而難為給付者，清償人得將其給付物，為債權人提存之。", "note": "房客搬走找不到人要退押金，房東可以提存到「法院提存所」。", "opts": ["不能沒收", "警察局不辦提存", "", "公證處不辦提存"]}, "2-1-46": {"law": "【民法 第453條】\n定有期限之租賃契約，如約定當事人之一方於期限屆滿前，得終止契約者，其終止契約，應依第四百五十條第三項之規定，先期通知。\n\n【民法 第450條】\n前項終止契約，應依習慣先期通知。但不動產之租金，以星期、半個月或一個月定其支付之期限者，出租人應以曆定星期、半個月或一個月之末日為契約終止期，並應至少於一星期、半個月或一個月前通知之。", "note": "約定可提前終止的，要先期通知。按月付租的，至少提前1個月。", "full": "【民法 第450條】\n前項終止契約，應依習慣先期通知。但不動產之租金，以星期、半個月或一個月定其支付之期限者，出租人應以曆定星期、半個月或一個月之末日為契約終止期，並應至少於一星期、半個月或一個月前通知之。\n\n【民法 第453條】\n定有期限之租賃契約，如約定當事人之一方於期限屆滿前，得終止契約者，其終止契約，應依第四百五十條第三項之規定，先期通知。", "opts": ["1星期是週付的", "半個月是半月付的", "不能自己決定", ""]}, "2-1-47": {"law": "【民法 第452條】\n承租人死亡者，租賃契約雖定有期限，其繼承人仍得終止契約。但應依第四百五十條第三項之規定，先期通知。", "note": "房客「過世」，繼承人可以終止租約，即使是定期租約。還是要先期通知。", "opts": ["", "長期住院不是法定事由", "調職不是法定事由", "家中變故不是法定事由"]}, "2-1-48": {"law": "【民法 第454條】\n租賃契約，依前二條之規定終止時，如終止後始到期之租金，出租人已預先受領者，應返還之。", "note": "依法終止，房東已經預收、屬於終止後才到期的租金，要退還。", "opts": ["不能抵違約金", "不能沒收", "", "退還就好，不用加倍"]}, "2-1-49": {"law": "【民法 第456條】\n出租人就租賃物所受損害對於承租人之賠償請求權，承租人之償還費用請求權及工作物取回權，均因二年間不行使而消滅。", "note": "房東對房客的損害賠償請求權，時效2年。", "full": "【民法 第456條】\n出租人就租賃物所受損害對於承租人之賠償請求權，承租人之償還費用請求權及工作物取回權，均因二年間不行使而消滅。\n前項期間，於出租人，自受租賃物返還時起算。於承租人，自租賃關係終止時起算。", "opts": ["不是1年", "", "不是5年", "不是15年"]}, "2-1-50": {"law": "【民法 第456條】\n出租人就租賃物所受損害對於承租人之賠償請求權，承租人之償還費用請求權及工作物取回權，均因二年間不行使而消滅。", "note": "房客請求償還費用、取回工作物，時效也是2年。", "full": "【民法 第456條】\n出租人就租賃物所受損害對於承租人之賠償請求權，承租人之償還費用請求權及工作物取回權，均因二年間不行使而消滅。\n前項期間，於出租人，自受租賃物返還時起算。於承租人，自租賃關係終止時起算。", "opts": ["不是1年", "", "不是5年", "不是15年"]}, "2-1-51": {"law": "【民法 第456條】\n前項期間，於出租人，自受租賃物返還時起算。於承租人，自租賃關係終止時起算。", "note": "房東請求賠償的2年，從「房子還回來」那天開始算。", "opts": ["租賃終止是房客的起算點", "不是受損害時", "", "沒有30日起算"]}, "2-1-52": {"law": "【民法 第456條】\n前項期間，於出租人，自受租賃物返還時起算。於承租人，自租賃關係終止時起算。", "note": "房客請求償還費用的2年，從「租約終止」那天算。口訣：房東看還房，房客看終止。", "opts": ["", "不是請求日", "返還時是房東的起算點", "沒有30日起算"]}, "2-1-53": {"law": "【民法 第436條】\n前條規定，於承租人因第三人就租賃物主張權利，致不能為約定之使用、收益者準用之。\n\n【民法 第435條】\n前項情形，承租人就其存餘部分不能達租賃之目的者，得終止契約。", "note": "房客可終止的：危害安全健康、房東逾期不修、房子毀損部分致無法達租賃目的、第三人主張權利致「不能用」。第三人主張權利但「不影響使用」就不行。", "full": "【民法 第424條】\n租賃物為房屋或其他供居住之處所者，如有瑕疵，危及承租人或其同居人之安全或健康時，承租人雖於訂約時已知其瑕疵，或已拋棄其終止契約之權利，仍得終止契約。\n\n【民法 第430條】\n租賃關係存續中，租賃物如有修繕之必要，應由出租人負擔者，承租人得定相當期限，催告出租人修繕，如出租人於其期限內不為修繕者，承租人得終止契約或自行修繕而請求出租人償還其費用或於租金中扣除之。\n\n【民法 第435條】\n租賃關係存續中，因不可歸責於承租人之事由，致租賃物之一部滅失者，承租人得按滅失之部分，請求減少租金。\n前項情形，承租人就其存餘部分不能達租賃之目的者，得終止契約。\n\n【民法 第436條】\n前條規定，於承租人因第三人就租賃物主張權利，致不能為約定之使用、收益者準用之。", "opts": ["危害安全健康可終止", "房東逾期不修可終止", "", "存餘部分不能達目的可終止"]}, "2-1-54": {"law": "【民法 第438條】\n承租人違反前項之規定為租賃物之使用、收益，經出租人阻止而仍繼續為之者，出租人得終止契約。\n\n【民法 第443條】\n承租人違反前項規定，將租賃物轉租於他人者，出租人得終止契約。", "note": "房東可終止：亂用房子（被阻止還繼續）、遲付租金、違規轉租。「酗酒鬧事」不在法定事由。", "full": "【民法 第438條】\n承租人違反前項之規定為租賃物之使用、收益，經出租人阻止而仍繼續為之者，出租人得終止契約。\n\n【民法 第440條】\n承租人租金支付有遲延者，出租人得定相當期限，催告承租人支付租金，如承租人於其期限內不為支付，出租人得終止契約。\n租賃物為房屋者，遲付租金之總額，非達二個月之租額，不得依前項之規定，終止契約。其租金約定於每期開始時支付者，並應於遲延給付逾二個月時，始得終止契約。\n\n【民法 第443條】\n承租人違反前項規定，將租賃物轉租於他人者，出租人得終止契約。", "opts": ["違反使用方式可終止", "", "遲付租金可終止", "違規轉租可終止"]}, "2-1-55": {"law": "【民法 第425-1條】\n土地及其土地上之房屋同屬一人所有，而僅將土地或僅將房屋所有權讓與他人，或將土地及房屋同時或先後讓與相異之人時，土地受讓人或房屋受讓人與讓與人間或房屋受讓人與土地受讓人間，推定在房屋得使用期限內，有租賃關係。…\n\n【民法 第449條】\n租用基地建築房屋者，不適用第一項之規定。", "note": "20年上限的例外：租地蓋房。另外房地原本同一人、後來只賣土地或房屋，推定的租賃也不受20年限制。", "full": "【民法 第449條】\n租賃契約之期限，不得逾二十年。逾二十年者，縮短為二十年。\n租用基地建築房屋者，不適用第一項之規定。\n\n【民法 第425-1條】\n土地及其土地上之房屋同屬一人所有，而僅將土地或僅將房屋所有權讓與他人，或將土地及房屋同時或先後讓與相異之人時，土地受讓人或房屋受讓人與讓與人間或房屋受讓人與土地受讓人間，推定在房屋得使用期限內，有租賃關係。其期限不受第四百四十九條第一項規定之限制。", "opts": ["押租金不影響期限", "包租契約仍受20年上限", "判決不影響期限限制", ""]}, "2-1-56": {"law": "【民法 第422-1條】\n租用基地建築房屋者，承租人於契約成立後，得請求出租人為地上權之登記。", "note": "租地蓋房，房客可以請房東辦「地上權」登記，權利更穩。", "opts": ["是地上權，不是租賃權", "", "不是典權", "不是抵押權"]}, "2-1-57": {"law": "【民法 第422-1條】\n租用基地建築房屋者，承租人於契約成立後，得請求出租人為地上權之登記。", "note": "可以請求登記的是「地上權」。", "opts": ["不是典權", "不是租賃權", "不是不動產役權", ""]}, "2-1-58": {"law": "【民法 第426-1條】\n租用基地建築房屋，承租人房屋所有權移轉時，其基地租賃契約，對於房屋受讓人，仍繼續存在。", "note": "房屋賣掉，基地租約對買房的人繼續有效，所以他有基地租賃的權利。", "opts": ["不是無權占有", "不是地上權，是基地租賃", "", "不是使用借貸"]}, "2-1-59": {"law": "【民法 第426-2條】\n租用基地建築房屋，出租人出賣基地時，承租人有依同樣條件優先承買之權。承租人出賣房屋時，基地所有人有依同樣條件優先承買之權。", "note": "租地蓋房：房東賣「基地」，房客有優先承買權。", "opts": ["", "設定抵押不觸發優先承買", "設定役權不觸發", "合併毗鄰土地不觸發"]}, "2-1-60": {"law": "【民法 第426-2條】\n租用基地建築房屋，出租人出賣基地時，承租人有依同樣條件優先承買之權。承租人出賣房屋時，基地所有人有依同樣條件優先承買之權。", "note": "租地蓋房：房客賣「房屋」，地主有優先承買權。", "opts": ["出租不觸發", "設定抵押不觸發", "", "增建不觸發"]}, "2-1-61": {"law": "【民法 第426-2條】\n租用基地建築房屋，出租人出賣基地時，承租人有依同樣條件優先承買之權。承租人出賣房屋時，基地所有人有依同樣條件優先承買之權。", "note": "房屋要賣，有優先承買權的是「地主」。", "opts": ["典權人沒有", "抵押權人沒有", "房屋承租人沒有", ""]}, "2-1-62": {"law": "【民法 第426-2條】\n租用基地建築房屋，出租人出賣基地時，承租人有依同樣條件優先承買之權。承租人出賣房屋時，基地所有人有依同樣條件優先承買之權。", "note": "基地要賣，有優先承買權的是「基地承租人」（蓋房子的人）。", "opts": ["典權人沒有", "抵押權人沒有", "", "地上權人不是這條的對象"]}, "2-1-63": {"law": "【民法 第426-2條】\n前項情形，出賣人應將出賣條件以書面通知優先承買權人。優先承買權人於通知達到後十日內未以書面表示承買者，視為放棄。", "note": "賣方要書面通知優先承買權人，到達後10天內沒回，視為放棄。", "opts": ["5天太短", "7天太短", "15天太長", ""]}, "2-1-64": {"law": "【民法 第426-2條】\n出賣人未以書面通知優先承買權人而為所有權之移轉登記者，不得對抗優先承買權人。", "note": "沒通知就辦完登記，優先承買權人可以對抗。實務上要打官司，請求塗銷登記。", "opts": ["", "主要救濟是對抗，不是只求賠償", "同上", "登記完了仍可對抗"]}, "2-2-01": {"law": "【所得稅法 第14條】\n第五類：租賃所得及權利金所得：凡以財產出租之租金所得，財產出典典價經運用之所得或專利權、商標權、著作權、秘密方法及各種特許權利，供他人使用而取得之權利金所得：", "note": "租金收入歸「綜合所得稅」，屬第五類：租賃所得及權利金所得。", "full": "【所得稅法 第14條】\n個人之綜合所得總額，以其全年下列各類所得合併計算之：\n第五類：租賃所得及權利金所得：凡以財產出租之租金所得，財產出典典價經運用之所得或專利權、商標權、著作權、秘密方法及各種特許權利，供他人使用而取得之權利金所得：", "opts": ["營利事業所得稅是公司的", "", "房地合一稅是賣房的", "沒有「租金所得稅」"]}, "2-2-02": {"law": "【所得稅法 第7條】\n本法稱中華民國境內居住之個人，指左列兩種：\n二、在中華民國境內無住所，而於一課稅年度內在中華民國境內居留合計滿一百八十三天者。", "note": "境內沒住所，一年內在台灣待滿183天，就算境內居住者。", "full": "【所得稅法 第7條】\n本法稱中華民國境內居住之個人，指左列兩種：\n一、在中華民國境內有住所，並經常居住中華民國境內者。\n二、在中華民國境內無住所，而於一課稅年度內在中華民國境內居留合計滿一百八十三天者。", "opts": ["不是200天", "不是163天", "", "不是240天"]}, "2-2-03": {"law": "【所得稅法 第8條】\n本法稱中華民國來源所得，係指左列各項所得：\n五、在中華民國境內之財產因租賃而取得之租金。", "note": "台灣房屋出租的租金，屬「中華民國來源所得」。", "opts": ["", "營利所得是股利等", "就源所得不是條文用語", "扣繳所得不是所得類型"]}, "2-2-04": {"law": "【租賃住宅市場發展及管理條例 第17條】\n個人住宅所有權人將住宅委託代管業或出租予包租業轉租，契約約定…\n一、出租期間每屋每月租金收入不超過新臺幣六千元部分，免納綜合所得稅。", "note": "房東把房子交給代管或包租業，租滿1年：每屋每月6,000元以下免稅。", "full": "【租賃住宅市場發展及管理條例 第17條】\n個人住宅所有權人將住宅委託代管業或出租予包租業轉租，契約約定供居住使用一年以上者，得依下列規定減徵租金所得稅：\n一、出租期間每屋每月租金收入不超過新臺幣六千元部分，免納綜合所得稅。", "opts": ["免稅額是6千，不是1萬", "", "6千以下免稅，不用依所得稅法", "不是全部免稅"]}, "2-2-05": {"law": "【租賃住宅市場發展及管理條例 第17條】\n個人住宅所有權人將住宅委託代管業或出租予包租業轉租，契約約定…\n（一）每屋每月租金收入超過新臺幣六千元至二萬元部分，依該部分租金收入百分之五十三計算。", "note": "每月6,000～20,000這一段，費用直接當53%（沒有確實證據時）。", "full": "【租賃住宅市場發展及管理條例 第17條】\n個人住宅所有權人將住宅委託代管業或出租予包租業轉租，契約約定供居住使用一年以上者，得依下列規定減徵租金所得稅：\n二、出租期間每屋每月租金收入超過新臺幣六千元部分，其租金所得必要損耗及費用之減除，住宅所有權人未能提具確實證據者，依下列方式認列：\n（一）每屋每月租金收入超過新臺幣六千元至二萬元部分，依該部分租金收入百分之五十三計算。", "opts": ["費用是53%，不是43%", "", "不是減半", "2萬以上是依所得稅法規定"]}, "2-2-06": {"law": "【所得稅法 第14條】\n第五類：租賃所得及權利金所得：凡以財產出租之租金所得，財產出典典價經運用之所得或專利權、商標權、著作權、秘密方法及各種特許權利，供他人使用而取得之權利金所得：", "note": "著作權的版權收入是「權利金」，不是租房子的租賃所得。租金、典價運用、地上權權利金才算租賃所得。", "full": "【所得稅法 第14條】\n第五類：租賃所得及權利金所得：凡以財產出租之租金所得，財產出典典價經運用之所得或專利權、商標權、著作權、秘密方法及各種特許權利，供他人使用而取得之權利金所得：\n二、設定定期之永佃權及地上權取得之各種所得，視為租賃所得。", "flag": "題庫選 D（著作權版權收入）。第五類名稱是「租賃所得及權利金所得」，D 屬權利金所得；考試以題庫為準。", "opts": ["租金是租賃所得", "典價運用所得是租賃所得", "地上權權利金視為租賃所得", ""]}, "2-2-07": {"law": "【所得稅法 第14條】\n一、財產租賃所得及權利金所得之計算，以全年租賃收入或權利金收入，減除必要損耗及費用後之餘額為所得額。", "note": "租賃所得＝全年租賃收入 − 必要損耗及費用。不是固定扣幾成。", "opts": ["不是固定40%", "不是固定50%", "", "不是固定60%"]}, "2-2-08": {"law": "【所得稅法 第14條】\n二、設定定期之永佃權及地上權取得之各種所得，視為租賃所得。", "note": "設定定期地上權的所得，當作「租賃所得」。", "opts": ["不是利息所得", "不是財產交易所得", "", "不是營利所得"]}, "2-2-09": {"law": "【所得稅法施行細則 第88條】\n將財產無償借與他人使用者，應由雙方當事人訂立無償借用契約，經雙方當事人以外之二人證明確係無償借用，並依公證法之規定辦竣公證。\n\n【所得稅法 第14條】\n四、將財產借與他人使用，除經查明確係無償且非供營業或執行業務者使用外，應參照當地一般租金情況，計算租賃收入，繳納所得稅。", "note": "無償借人要有證明才能不被設算租金：借用契約、2位當事人以外證人、再公證。有法院公證書又是住宅用，就不能設算。", "full": "【所得稅法 第14條】\n四、將財產借與他人使用，除經查明確係無償且非供營業或執行業務者使用外，應參照當地一般租金情況，計算租賃收入，繳納所得稅。\n\n【所得稅法施行細則 第88條】\n將財產無償借與他人使用者，應由雙方當事人訂立無償借用契約，經雙方當事人以外之二人證明確係無償借用，並依公證法之規定辦竣公證。", "opts": ["沒申報典價，可以設算", "租金偏低，可以調整", "借給二親等營業用，要設算", ""]}, "2-2-10": {"law": "【所得稅法 第14條】\n四、將財產借與他人使用，除經查明確係無償且非供營業或執行業務者使用外，應參照當地一般租金情況，計算租賃收入，繳納所得稅。", "note": "無償借給朋友「做生意」，還是要照一般租金算租賃收入課稅。", "opts": ["", "無償借營業用，仍然要課稅", "不是依營業狀況", "無償供營業用不免稅"]}, "2-2-11": {"law": "【所得稅法 第14條】\n三、財產出租，收有押金或任何款項類似押金者，或以財產出典而取得典價者，均應就各該款項按當地銀行業通行之一年期存款利率，計算租賃收入。", "note": "收押金（或類似款項），要按「當地銀行一年期存款利率」去算租金收入。", "opts": ["不是郵政儲金利率", "", "不是2年期", "不是法定利率"]}, "2-2-12": {"law": "【所得稅法 第14條】\n三、財產出租，收有押金或任何款項類似押金者，或以財產出典而取得典價者，均應就各該款項按當地銀行業通行之一年期存款利率，計算租賃收入。", "note": "押金設算的租賃收入，由「房東自己」報稅時算。", "opts": ["代管業不代扣", "銀行不扣繳", "房客不負責申報", ""]}, "2-2-13": {"law": "【所得稅法 第17條】\n8.房屋租金支出特別扣除：自中華民國一百十三年一月一日起，納稅義務人、配偶及受扶養直系親屬在中華民國境內租屋供自住且非供營業或執行業務使用者，其所支付之租金減除接受政府補助部分，每一申報戶每年扣除數額以十八萬元為限。…", "note": "租屋自住的租金，每戶每年最多扣18萬元。", "full": "【所得稅法 第17條】\n8.房屋租金支出特別扣除：自中華民國一百十三年一月一日起，納稅義務人、配偶及受扶養直系親屬在中華民國境內租屋供自住且非供營業或執行業務使用者，其所支付之租金減除接受政府補助部分，每一申報戶每年扣除數額以十八萬元為限。但納稅義務人、配偶或受扶養直系親屬在中華民國境內有房屋者，不得扣除。", "opts": ["上限是18萬，不是12萬", "", "上限是18萬，不是24萬", "上限是18萬，不是36萬"]}, "2-2-14": {"law": "【所得稅法 第17條】\n8.房屋租金支出特別扣除：自中華民國一百十三年一月一日起，納稅義務人、配偶及受扶養直系親屬在中華民國境內租屋供自住且非供營業或執行業務使用者，其所支付之租金減除接受政府補助部分，每一申報戶每年扣除數額以十八萬元為限。…", "note": "租金特別扣除的條件：租屋「自住」，而且「不是營業或執行業務用」。", "full": "【所得稅法 第17條】\n8.房屋租金支出特別扣除：自中華民國一百十三年一月一日起，納稅義務人、配偶及受扶養直系親屬在中華民國境內租屋供自住且非供營業或執行業務使用者，其所支付之租金減除接受政府補助部分，每一申報戶每年扣除數額以十八萬元為限。但納稅義務人、配偶或受扶養直系親屬在中華民國境內有房屋者，不得扣除。", "opts": ["執行業務用不行", "兼營業不行", "", "營業或執行業務用不行"]}, "2-3-01": {"law": "【房屋稅條例 第1條】\n房屋稅之徵收，依本條例之規定；本條例未規定者，依其他有關法律之規定。", "note": "房屋稅依「房屋稅條例」。", "opts": ["不是土地法", "", "土地稅法管地價稅", "平均地權條例管土地增值稅等"]}, "2-3-02": {"law": "【房屋稅條例 第6條】\n直轄市及縣（市）政府在前條規定稅率範圍內訂定之房屋稅徵收率，應提經當地民意機關通過，報財政部備查。", "note": "房屋稅是地方稅，是縣市（直轄市）政府的錢。", "opts": ["不是中央", "省市不是稅收主體", "", "不是公所"]}, "2-3-03": {"law": "【房屋稅條例 第3條】\n房屋稅，以附著於土地之各種房屋，及有關增加該房屋使用價值之建築物，為課徵對象。", "note": "房屋稅課在「房屋」和「增加房屋使用價值的建築物」上。", "opts": ["", "「建築改良物」不是條文用語", "不是條文用語", "還包括增加使用價值的建築物"]}, "2-3-04": {"law": "【房屋稅條例 第4條】\n第一項所有人、使用權人或典權人住址不明，或非居住房屋所在地者，應由管理人或現住人繳納之。如屬出租，應由承租人負責代繳，抵扣房租。", "note": "題庫答案：C 現住人代繳，可向所有人求償。考試照題庫選 C。條文：所有人住址不明或不住當地→由管理人或現住人繳；出租的→由承租人代繳、抵扣房租。", "full": "【房屋稅條例 第4條】\n房屋稅向房屋所有人徵收之；以土地設定地上權之使用權房屋，向該使用權人徵收之；設有典權者，向典權人徵收之。共有房屋向共有人徵收之，由共有人推定一人繳納，其不為推定者，由現住人或使用人代繳。\n前項代繳之房屋稅，在其應負擔部分以外之稅款，對於其他共有人有求償權。\n第一項所有人、使用權人或典權人住址不明，或非居住房屋所在地者，應由管理人或現住人繳納之。如屬出租，應由承租人負責代繳，抵扣房租。", "flag": "條文的「求償」寫在共有人（第 2 項）；現住人、承租人代繳是「抵扣房租」。題庫選 C，考試記題庫答案。", "opts": ["管理人代繳沒有求償規定", "共有人求償是另一款", "", "房客代繳是從房租扣抵"]}, "2-3-05": {"law": "【房屋稅條例 第4條】\n房屋為信託財產者，於信託關係存續中，以受託人為房屋稅之納稅義務人。受託人為二人以上者，準用第一項有關共有房屋之規定。", "note": "房子是信託財產，信託期間房屋稅的納稅人是「受託人」。", "opts": ["信託期間是受託人", "", "不是受益人", "受託人才是納稅人"]}, "2-3-06": {"law": "【房屋稅條例 第5條】\n房屋稅依房屋現值，按下列稅率課徵之：\n（一）供自住、公益出租人出租使用或以土地設定地上權之使用權房屋並供該使用權人自住使用者，為其房屋現值百分之一點二。但本人、配偶及未成年子女於全國僅持有一戶房屋，供自住且房屋現值在一定金額以下者，為其房屋現值百分之一。", "note": "自住或公益出租人的住家用房屋：1.2%。全國只有一戶自住、現值不高：1%。", "full": "【房屋稅條例 第5條】\n房屋稅依房屋現值，按下列稅率課徵之：\n一、住家用房屋：\n（一）供自住、公益出租人出租使用或以土地設定地上權之使用權房屋並供該使用權人自住使用者，為其房屋現值百分之一點二。但本人、配偶及未成年子女於全國僅持有一戶房屋，供自住且房屋現值在一定金額以下者，為其房屋現值百分之一。", "opts": ["1%是單一自住", "", "1.5%是出租的下限", "3%是營業用"]}, "2-3-07": {"law": "【房屋稅條例 第5條】\n房屋稅依房屋現值，按下列稅率課徵之：\n（四）其他住家用房屋，最低不得少於其房屋現值百分之二，最高不得超過百分之四點八。", "note": "題庫答案：D 最低1.5%、最高4.8%。考試照題庫選 D。", "full": "【房屋稅條例 第5條】\n房屋稅依房屋現值，按下列稅率課徵之：\n（二）前目以外，出租申報租賃所得達所得稅法第十四條第一項第五類規定之當地一般租金標準者或繼承取得之共有房屋，最低不得少於其房屋現值百分之一點五，最高不得超過百分之二點四。\n（四）其他住家用房屋，最低不得少於其房屋現值百分之二，最高不得超過百分之四點八。", "flag": "113年修正後的房屋稅條例第5條，「其他住家用房屋」（囤房）是最低 2%、最高 4.8%（就是選項 C）。題庫還是舊答案 D，考試照題庫選 D。", "opts": ["1.5%～2.4%是「出租且租金達標準」那一檔", "2%～3.6%是「起造人待銷售」那一檔", "這是現行條文的數字，但題庫答案是 D，考試別選", ""]}, "2-3-08": {"law": "【房屋稅條例 第5條】\n直轄市及縣（市）政府應依前項第一款第二目至第四目規定，按各該目納稅義務人全國總持有應稅房屋戶數或其他合理需要，分別訂定差別稅率；…", "note": "囤房稅按「全國總持有幾戶」來算。不看棟數、面積或樓層。", "full": "【房屋稅條例 第5條】\n房屋稅依房屋現值，按下列稅率課徵之：\n直轄市及縣（市）政府應依前項第一款第二目至第四目規定，按各該目納稅義務人全國總持有應稅房屋戶數或其他合理需要，分別訂定差別稅率；納稅義務人持有坐落於直轄市及縣（市）之各該目應稅房屋，應分別按其全國總持有戶數，依房屋所在地直轄市、縣（市）政府訂定之相應稅率課徵房屋稅。", "opts": ["不是棟數", "不是面積", "", "不是樓層數"]}, "2-3-09": {"law": "【房屋稅條例 第5條】\n房屋稅依房屋現值，按下列稅率課徵之：\n（二）前目以外，出租申報租賃所得達所得稅法第十四條第一項第五類規定之當地一般租金標準者或繼承取得之共有房屋，最低不得少於其房屋現值百分之一點五，最高不得超過百分之二點四。", "note": "錯的是C：出租房屋要1.5%～2.4%，前提是「租金申報達當地一般租金標準」，不是只要出租就適用。", "full": "【房屋稅條例 第5條】\n房屋稅依房屋現值，按下列稅率課徵之：\n（一）供自住、公益出租人出租使用或以土地設定地上權之使用權房屋並供該使用權人自住使用者，為其房屋現值百分之一點二。但本人、配偶及未成年子女於全國僅持有一戶房屋，供自住且房屋現值在一定金額以下者，為其房屋現值百分之一。\n（二）前目以外，出租申報租賃所得達所得稅法第十四條第一項第五類規定之當地一般租金標準者或繼承取得之共有房屋，最低不得少於其房屋現值百分之一點五，最高不得超過百分之二點四。\n（四）其他住家用房屋，最低不得少於其房屋現值百分之二，最高不得超過百分之四點八。\n二、非住家用房屋：供營業、私人醫院、診所或自由職業事務所使用者，最低不得少於其房屋現值百分之三，最高不得超過百分之五；供人民團體等非營業使用者，最低不得少於其房屋現值百分之一點五，最高不得超過百分之二點五。", "opts": ["1%正確", "1.2%正確", "", "3%～5%正確"]}, "2-3-10": {"law": "【房屋稅條例 第5條】\n第一項第一款第一目供自住使用之住家用房屋，房屋所有人或使用權…\n（一）供自住、公益出租人出租使用或以土地設定地上權之使用權房屋並供該使用權人自住使用者，為其房屋現值百分之一點二。但本人、配偶及未成年子女於全國僅持有一戶房屋，供自住且房屋現值在一定金額以下者，為其房屋現值百分之一。", "note": "題庫答案：C。考試照題庫選 C。自住 1.2% 的基本要件：本人／配偶／直系親屬設籍、實際居住、沒出租沒營業（A、B、D 都是）。", "full": "【房屋稅條例 第5條】\n（一）供自住、公益出租人出租使用或以土地設定地上權之使用權房屋並供該使用權人自住使用者，為其房屋現值百分之一點二。但本人、配偶及未成年子女於全國僅持有一戶房屋，供自住且房屋現值在一定金額以下者，為其房屋現值百分之一。\n第一項第一款第一目供自住使用之住家用房屋，房屋所有人或使用權人之本人、配偶或直系親屬應於該屋辦竣戶籍登記，且無出租或供營業情形；其他供自住及公益出租人出租使用之要件及認定之標準，與前三項房屋戶數之計算、第二項合理需要之認定及其他相關事項之辦法，由財政部定之。", "flag": "依房屋稅條例第5條但書，「本人、配偶及未成年子女全國只有一戶、現值在一定金額以下」其實正是 1% 的條件。題目寫「1%」，但出題者是把它當成自住要件以外的東西；考試照題庫選 C。", "opts": ["沒出租、沒營業是自住要件", "本人、配偶或直系親屬設籍是自住要件", "", "實際居住是自住要件"]}, "2-3-11": {"law": "【房屋稅條例 第5條】\n房屋稅依房屋現值，按下列稅率課徵之：\n（三）起造人持有使用執照所載用途為住家用之待銷售房屋，於起課房屋稅二年內，最低不得少於其房屋現值百分之二，最高不得超過百分之三點六。", "note": "起造人手上待銷售的住家房屋，起課2年內：2%～3.6%。", "opts": ["1.2%～2.4%不是待售屋", "", "最高4.8%是其他住家用", "3%～5%是營業用"]}, "2-3-12": {"law": "【房屋稅條例 第5條】\n三、房屋同時作住家及非住家用者，應以實際使用面積，分別按住家用或非住家用稅率，課徵房屋稅。但非住家用者，課稅面積最低不得少於全部面積六分之一。", "note": "住家與非住家混用：分開算。但非住家用的面積最少是全部的1/6。300÷6＝50。", "opts": ["30不是1/6", "", "60不是1/6", "150是1/2"]}, "2-3-13": {"law": "【房屋稅條例 第9條】\n本條例所定不動產評價委員會，由直轄市或縣（市）政府組織之；其組織及運作辦法，由財政部定之。", "note": "房屋標準價格由「不動產評價委員會」評定。", "opts": ["地價評議委員會管土地", "", "沒有仲裁委員會", "沒有調處委員會"]}, "2-3-14": {"law": "【房屋稅條例 第9條】\n前項委員會委員，由相關行政機關代表、具有不動產估價、土木或結構工程、建築、都市計畫專長之專家學者或屬該等領域之民間團體代表組成，其中專家學者及民間團體代表，不得少於委員總數二分之一；…", "note": "評價委員會：專家學者和民間團體至少1/2，任一性別至少1/3。", "full": "【房屋稅條例 第9條】\n前項委員會委員，由相關行政機關代表、具有不動產估價、土木或結構工程、建築、都市計畫專長之專家學者或屬該等領域之民間團體代表組成，其中專家學者及民間團體代表，不得少於委員總數二分之一；任一性別委員，不得少於委員總數三分之一。", "opts": ["要1/2和1/3", "", "任一性別是1/3", "不是2/3和2/5"]}, "2-3-15": {"law": "【房屋稅條例 第7條】\n納稅義務人應於房屋建造完成之日起算三十日內檢附有關文件，向當地主管稽徵機關申報房屋稅籍有關事項及使用情形；其有增建、改建或移轉、承典時，亦同。", "note": "房屋完工、增建、改建、移轉或承典，30天內要申報稅籍。", "opts": ["不是10天", "不是15天", "", "不是60天"]}, "2-3-16": {"law": "【房屋稅條例 第7條】\n…房屋使用情形變更致稅額減少，逾期申報者，自申報之次期開始適用；…", "note": "使用變更導致稅額增加：從變更的「次期」開始，要在次期開徵前40天申報。「30天內申報、當期適用」不存在。", "full": "【房屋稅條例 第7條】\n房屋使用情形變更，除致稅額增加，納稅義務人應於變更之次期房屋稅開徵四十日以前向當地主管稽徵機關申報外，應於每期開徵四十日以前申報；經核定後使用情形未再變更者，以後免再申報。房屋使用情形變更致稅額減少，逾期申報者，自申報之次期開始適用；致稅額增加者，自變更之次期開始適用，逾期申報或未申報者，亦同。", "opts": ["正確：增加者次期開徵前40天申報", "正確：減少者每期開徵前40天申報", "正確：增加者自次期適用", ""]}, "2-3-17": {"law": "【房屋稅條例 第11條】\n房屋標準價格，由不動產評價委員會依據下列事項分別評定，並由直…\n二、各類房屋之耐用年數及折舊標準。", "note": "標準價格評定看：建材、耐用年數折舊、地段商業交通供需。「使用面積」不是。", "full": "【房屋稅條例 第11條】\n房屋標準價格，由不動產評價委員會依據下列事項分別評定，並由直轄市、縣（市）政府公告之：\n一、按各種建造材料所建房屋，區分種類及等級。\n二、各類房屋之耐用年數及折舊標準。\n三、按房屋所處街道村里之商業交通情形及房屋之供求概況，並比較各該不同地段實價登錄之不動產交易價格減除土地價格部分，訂定標準。", "opts": ["建造材料是評定事項", "耐用年數是評定事項", "", "供需概況是評定事項"]}, "2-3-18": {"law": "【房屋稅條例 第11條】\n前項房屋標準價格，每三年重行評定一次，並應依其耐用年數予以折舊，按年遞減其價格。", "note": "房屋標準價格每3年重評一次。", "opts": ["不是1年", "不是2年", "", "不是隨申報地價"]}, "2-3-19": {"law": "【房屋稅條例 第10條】\n依前項規定核計之房屋現值，主管稽徵機關應通知納稅義務人。納稅義務人如有異議，得於接到通知書之日起三十日內，檢附證件，申請重行核計。", "note": "不服房屋現值：收到通知後30天內申請重新核計。", "opts": ["不是10天", "不是15天", "", "不是60天"]}, "2-3-20": {"law": "【房屋稅條例 第6-1條】\n房屋稅以每年二月之末日為納稅義務基準日，由當地主管稽徵機關按房屋稅籍資料核定，於每年五月一日起至五月三十一日止一次徵收，其課稅所屬期間為上一年七月一日起至當年六月三十日止。", "note": "房屋稅的基準日：每年2月最後一天。", "opts": ["8/31是地價稅", "", "4/30不是", "7/1是課稅期間起日"]}, "2-3-21": {"law": "【房屋稅條例 第6-1條】\n房屋稅以每年二月之末日為納稅義務基準日，由當地主管稽徵機關按房屋稅籍資料核定，於每年五月一日起至五月三十一日止一次徵收，其課稅所屬期間為上一年七月一日起至當年六月三十日止。", "note": "房屋稅5/1～5/31徵收，課稅期間是「上年7/1到當年6/30」，不是1到12月。", "opts": ["正確，5/1～5/31徵收", "正確，課稅期間是上年7/1～當年6/30", "", "正確，基準日是2月底"]}, "2-3-22": {"law": "【房屋稅條例 第6-1條】\n每年三月一日起至六月三十日止新建、增建或改建完成之房屋，該期間之房屋稅併入次期課徵；上一年七月一日起至當年二月末日止拆除之房屋，其尚未拆除期間之當期房屋稅仍應課徵。", "note": "3/1～6/30完成的新增改建，併入「下一期」課稅。當期完成按月算，未滿1個月不算（不是6個月）。", "full": "【房屋稅條例 第6-1條】\n新建、增建或改建房屋，於當期建造完成者，按月比例計課，未滿一個月者不計；當期拆除者，亦同。\n每年三月一日起至六月三十日止新建、增建或改建完成之房屋，該期間之房屋稅併入次期課徵；上一年七月一日起至當年二月末日止拆除之房屋，其尚未拆除期間之當期房屋稅仍應課徵。", "opts": ["", "錯在「免予課徵」：上年7/1～當年2月底拆除的，還沒拆的那段期間當期房屋稅「仍要課」", "是未滿1個月不計，不是6個月", "異議期間是30天，不是10天"]}, "2-3-23": {"law": "【房屋稅條例 第15條】\n私有房屋有下列情形之一者，免徵房屋稅：\n七、受重大災害，毀損面積占整棟面積五成以上，必須修復始能使用之房屋。", "note": "受重大災害，毀損「5成以上」且要修復才能用：免稅。3成以上不到5成：減半。", "full": "【房屋稅條例 第15條】\n私有房屋有下列情形之一者，免徵房屋稅：\n七、受重大災害，毀損面積占整棟面積五成以上，必須修復始能使用之房屋。\n九、住家用房屋現值在新臺幣十萬元以下屬自然人持有者，全國合計以三戶為限。但房屋標準價格如依第十一條第二項規定重行評定時，按該重行評定時之標準價格增減程度調整之。調整金額以千元為單位，未達千元者，按千元計算。", "opts": ["要自然人且全國3戶為限", "是自然人、十萬元以下", "", "3成以上不及5成是減半，不是7成"]}, "2-3-24": {"law": "【房屋稅條例 第14條】\n公有房屋供左列各款使用者，免徵房屋稅：\n四、公立學校、醫院、社會教育學術研究機構及救濟機構之校舍、院舍、辦公房屋及其員工宿舍。", "note": "公有房屋是否免稅看「用途」。被別人占用的房子不在免稅清單，所以還是要課稅。", "full": "【房屋稅條例 第14條】\n公有房屋供左列各款使用者，免徵房屋稅：\n一、各級政府機關及地方自治機關之辦公房屋及其員工宿舍。\n二、軍事機關部隊之辦公房屋及其官兵宿舍。\n三、監獄看守所及其辦公房屋暨員工宿舍。\n四、公立學校、醫院、社會教育學術研究機構及救濟機構之校舍、院舍、辦公房屋及其員工宿舍。\n五、工礦、農林、水利、漁牧事業機關之研究或試驗所所用之房屋。\n六、糧政機關之糧倉、鹽務機關之鹽倉、公賣事業及政府經營之自來水廠（場）所使用之廠房及辦公房屋。\n七、郵政、電信、鐵路、公路、航空、氣象、港務事業，供本身業務所使用之房屋及其員工宿舍。\n八、名勝古蹟及紀念先賢先烈之祠廟。\n九、政府配供貧民居住之房屋。\n十、政府機關為輔導退除役官兵就業所舉辦事業使用之房屋。", "opts": ["辦公房屋及宿舍免稅", "", "研究試驗所用房屋免稅", "救濟機構房屋免稅"]}, "2-3-25": {"law": "【房屋稅條例 第15條】\n私有房屋有下列情形之一者，免徵房屋稅：\n七、受重大災害，毀損面積占整棟面積五成以上，必須修復始能使用之房屋。", "note": "受重大災害毀損5成以上，免稅。平民住宅、合法工廠自有房屋、3成以上不到5成，是減半。", "opts": ["平民住宅是減半", "合法工廠自有房屋是減半", "", "3成以上不及5成是減半"]}, "2-3-26": {"law": "【房屋稅條例 第15條】\n私有房屋有下列情形之一者，免徵房屋稅：\n八、司法保護事業所有之房屋。", "note": "司法保護事業所有的房屋免稅。", "opts": ["", "農會自用倉庫是減半", "合法工廠是減半", "3成以上不及5成是減半"]}, "2-3-27": {"law": "【房屋稅條例 第15條】\n私有房屋有下列情形之一者，其房屋稅減半徵收：\n一、政府平價配售之平民住宅。", "note": "政府平價配售的平民住宅，房屋稅減半。", "opts": ["國民住宅不在條文", "合宜住宅不在條文", "配供貧民居住是公有免稅", ""]}, "2-3-28": {"law": "【房屋稅條例 第15條】\n私有房屋有下列情形之一者，其房屋稅減半徵收：\n四、受重大災害，毀損面積占整棟面積三成以上不及五成之房屋。", "note": "受重大災害，毀損3成以上不到5成：減半。", "opts": ["私立學校校舍是免稅", "無償供政府公用是免稅", "", "農會糧政倉庫是免稅"]}, "2-3-29": {"law": "【房屋稅條例 第16條】\n納稅義務人未依第七條規定之期限申報，因而發生漏稅者，除責令補繳應納稅額外，並按所漏稅額處以二倍以下罰鍰。", "note": "沒按期申報漏稅：補繳，再罰「2倍以下」罰鍰。", "opts": ["不是3倍，是2倍以下", "", "還要責令補繳", "是2倍以下，不是1倍"]}, "2-3-30": {"law": "【房屋稅條例 第24條】\n房屋稅徵收細則，由各直轄市及縣（市）政府依本條例分別訂定，報財政部備查。", "note": "房屋稅徵收細則由縣市政府訂，報財政部備查。", "opts": ["不是報議會", "", "不是財政部訂", "不是報內政部"]}, "2-4-01": {"law": "【土地稅法 第3-1條】\n土地為信託財產者，於信託關係存續中，以受託人為地價稅或田賦之納稅義務人。", "note": "土地是信託財產，信託期間地價稅納稅人是「受託人」。", "opts": ["", "信託存續中是受託人", "不是受益人", "不用推派"]}, "2-4-02": {"law": "【土地稅法 第3-1條】\n…但信託利益之受益人為非委託人且符合左列各款規定者，前項土地應與受益人在同一直轄市或縣（市）轄區內所有之土地合併計算地價總額：", "note": "信託土地算地價稅時，原則上併到「委託人」自己的土地一起算。", "full": "【土地稅法 第3-1條】\n土地為信託財產者，於信託關係存續中，以受託人為地價稅或田賦之納稅義務人。\n前項土地應與委託人在同一直轄市或縣（市）轄區內所有之土地合併計算地價總額，依第十六條規定稅率課徵地價稅，分別就各該土地地價占地價總額之比例，計算其應納之地價稅。但信託利益之受益人為非委託人且符合左列各款規定者，前項土地應與受益人在同一直轄市或縣（市）轄區內所有之土地合併計算地價總額：", "opts": ["是併委託人的土地", "", "受益人是例外情形", "不用推派"]}, "2-4-03": {"law": "【土地稅法 第3-1條】\n…但信託利益之受益人為非委託人且符合左列各款規定者，前項土地應與受益人在同一直轄市或縣（市）轄區內所有之土地合併計算地價總額：", "note": "例外：受益人是別人、已確定享有全部利益、委託人沒保留換受益人的權利，就併到「受益人」的土地算。", "full": "【土地稅法 第3-1條】\n前項土地應與委託人在同一直轄市或縣（市）轄區內所有之土地合併計算地價總額，依第十六條規定稅率課徵地價稅，分別就各該土地地價占地價總額之比例，計算其應納之地價稅。但信託利益之受益人為非委託人且符合左列各款規定者，前項土地應與受益人在同一直轄市或縣（市）轄區內所有之土地合併計算地價總額：\n一、受益人已確定並享有全部信託利益者。\n二、委託人未保留變更受益人之權利者。", "opts": ["受託人是納稅人，但併算對象是受益人", "委託人是一般情形", "", "不用推派"]}, "2-4-04": {"law": "【土地稅法 第4條】\n土地有左列情形之一者，主管稽徵機關得指定土地使用人負責代繳其…\n四、土地所有權人申請由占有人代繳者。", "note": "可指定使用人代繳：納稅人行蹤不明、權屬不明、無人管理、所有人申請由占有人代繳。「戶籍不在當地」不算。", "full": "【土地稅法 第4條】\n土地有左列情形之一者，主管稽徵機關得指定土地使用人負責代繳其使用部分之地價稅或田賦：\n一、納稅義務人行蹤不明者。\n二、權屬不明者。\n三、無人管理者。\n四、土地所有權人申請由占有人代繳者。", "opts": ["", "權屬不明可指定", "無人管理可指定", "所有人申請可指定"]}, "2-4-05": {"law": "【土地稅法 第9條】\n本法所稱自用住宅用地，指土地所有權人或其配偶、直系親屬於該地辦竣戶籍登記，且無出租或供營業用之住宅用地。", "note": "自用住宅要所有人、配偶或「直系親屬」設籍。兄弟是旁系，不算。", "opts": ["配偶是", "岳父是直系姻親，題庫視為符合", "所有權人是", ""]}, "2-4-06": {"law": "【土地稅法 第9條】\n本法所稱自用住宅用地，指土地所有權人或其配偶、直系親屬於該地辦竣戶籍登記，且無出租或供營業用之住宅用地。", "note": "自用住宅用地要「有住宅」。還沒蓋房子的空地，不算。", "opts": ["違建供住宅可以", "工業區違規住宅可以", "", "商業區供住宅可以"]}, "2-4-07": {"law": "【土地稅法 第9條】\n本法所稱自用住宅用地，指土地所有權人或其配偶、直系親屬於該地辦竣戶籍登記，且無出租或供營業用之住宅用地。", "note": "自用住宅用地要「沒出租、沒營業」。外牆出租廣告在題庫被當作符合（屬財政部函釋）。", "flag": "外牆出租作廣告使用在題庫被當作符合，這屬於財政部行政函釋的見解，法條本身沒寫。考試記題庫答案。", "opts": ["有收租金就是出租", "禁止設籍不影響出租認定", "收使用償金就是出租", ""]}, "2-4-08": {"law": "【土地稅法 第9條】\n本法所稱自用住宅用地，指土地所有權人或其配偶、直系親屬於該地辦竣戶籍登記，且無出租或供營業用之住宅用地。", "note": "除本人、配偶、直系親屬外還有人設籍，可能被推定出租。朋友免費借住又沒證明，就容易被推定出租。", "flag": "「推定出租」的細節出自行政函釋，土地稅法條文只規定「無出租或供營業」。", "opts": ["因學區設籍不當然推定", "戶籍未遷離不等於出租", "", "二親等旁系無償居住不推定"]}, "2-4-09": {"law": "【土地稅法 第14條】\n已規定地價之土地，除依第二十二條規定課徵田賦者外，應課徵地價稅。\n\n【土地稅法 第22條】\n非都市土地依法編定之農業用地或未規定地價者，徵收田賦。但都市土地合於左列規定者亦同：", "note": "農舍用地是農業用地，課「田賦」，不是地價稅。", "opts": ["", "建築用地要課地價稅", "丙種建築用地要課", "住宅區要課"]}, "2-4-10": {"law": "【平均地權條例 第16條】\n舉辦規定地價或重新規定地價時，土地所有權人未於公告期間申報地價者，以公告地價百分之八十為其申報地價。…", "note": "「規定地價」是平均地權條例的制度，土地稅法只是照這個來課稅。", "full": "【平均地權條例 第16條】\n舉辦規定地價或重新規定地價時，土地所有權人未於公告期間申報地價者，以公告地價百分之八十為其申報地價。土地所有權人於公告期間申報地價者，其申報之地價超過公告地價百分之一百二十時，以公告地價百分之一百二十為其申報地價；申報之地價未滿公告地價百分之八十時，得照價收買或以公告地價百分之八十為其申報地價。", "opts": ["不是土地法", "", "土地稅法是依規定地價課稅", "不動產估價師法無關"]}, "2-4-11": {"law": "【土地稅法 第15條】\n前項所稱地價總額，指每一土地所有權人依法定程序辦理規定地價或重新規定地價，經核列歸戶冊之地價總額。", "note": "地價稅按「歸戶後的申報地價總額」來算，不是市價、也不是公告現值。", "full": "【土地稅法 第15條】\n地價稅按每一土地所有權人在每一直轄市或縣（市）轄區內之地價總額計徵之。\n前項所稱地價總額，指每一土地所有權人依法定程序辦理規定地價或重新規定地價，經核列歸戶冊之地價總額。", "opts": ["不是市價", "不是公告現值", "", "不是市價比例"]}, "2-4-12": {"law": "【土地稅法 第11條】\n本法所稱空地，指已完成道路、排水及電力設施，於有自來水地區並已完成自來水系統，而仍未依法建築使用；…", "note": "空地要看有沒有道路、排水、電力（有自來水地區還要自來水）。瓦斯不在其中。", "full": "【土地稅法 第11條】\n本法所稱空地，指已完成道路、排水及電力設施，於有自來水地區並已完成自來水系統，而仍未依法建築使用；或雖建築使用，而其建築改良物價值不及所占基地申報地價百分之十，且經直轄市或縣（市）政府認定應予增建、改建或重建之私有及公有非公用建築用地。", "opts": ["道路是要素", "電力是要素", "排水是要素", ""]}, "2-4-13": {"law": "【土地稅法 第11條】\n…或雖建築使用，而其建築改良物價值不及所占基地申報地價百分之十，且經直轄市或縣（市）政府認定應予增建、改建或重建之私有及公有非公用建築用地。", "note": "雖然有蓋房子，但房子價值不到所在土地「申報地價的10%」，又被認定該改建，仍當空地。", "full": "【土地稅法 第11條】\n本法所稱空地，指已完成道路、排水及電力設施，於有自來水地區並已完成自來水系統，而仍未依法建築使用；或雖建築使用，而其建築改良物價值不及所占基地申報地價百分之十，且經直轄市或縣（市）政府認定應予增建、改建或重建之私有及公有非公用建築用地。", "opts": ["", "是申報地價，不是公告現值", "完工未滿1年不是", "危險建築不是這條"]}, "2-4-14": {"law": "【土地稅法 第21條】\n凡經直轄市或縣（市）政府核定應徵空地稅之土地，按該宗土地應納地價稅基本稅額加徵二至五倍之空地稅。", "note": "空地稅：在基本地價稅上加徵2～5倍。", "opts": ["3至5倍不對", "", "5至15倍不對", "5至10倍不對"]}, "2-4-15": {"law": "【土地稅法 第21條】\n凡經直轄市或縣（市）政府核定應徵空地稅之土地，按該宗土地應納地價稅基本稅額加徵二至五倍之空地稅。", "note": "加徵空地稅的倍數：縣市擬訂後，要報行政院核定。", "flag": "條文第 21 條只寫「加徵二至五倍」；加徵倍數須報行政院核定屬細則／實務規定。題庫答案 D。", "opts": ["不能自己決定", "不是報議會", "不是報財政部", ""]}, "2-4-16": {"law": "【土地稅法 第15條】\n地價稅按每一土地所有權人在每一直轄市或縣（市）轄區內之地價總額計徵之。", "note": "地價稅按「每個縣市」分別歸戶。台北、台中、台南＝3張稅單。", "opts": ["不是按筆數", "不是5張", "不是4張，是3個縣市", ""]}, "2-4-17": {"law": "【土地稅法 第16條】\n地價稅基本稅率為千分之十。土地所有權人之地價總額未超過土地所在地直轄市或縣（市）累進起點地價者，其地價稅按基本稅率徵收；超過累進起點地價者，依左列規定累進課徵：", "note": "地價稅基本稅率：千分之10。", "opts": ["千分之2是自用住宅", "千分之5不對", "萬分之10等於千分之1，不對", ""]}, "2-4-18": {"law": "【土地稅法 第16條】\n前項所稱累進起點地價，以各該直轄市或縣（市）土地七公畝之平均地價為準。但不包括工業用地、礦業用地、農業用地及免稅土地在內。", "note": "累進起點地價：看該縣市「7公畝」土地的平均地價。", "opts": ["不是3公畝", "不是5公畝", "", "不是10公畝"]}, "2-4-19": {"law": "【土地稅法 第16條】\n前項所稱累進起點地價，以各該直轄市或縣（市）土地七公畝之平均地價為準。但不包括工業用地、礦業用地、農業用地及免稅土地在內。", "note": "累進起點地價不算工業、礦業、農業用地、免稅地。蓋違建的農業用地已不是農業用地，要算進去。", "opts": ["工業用地不計入", "礦業用地不計入", "未使用的公設保留地免稅，不計入", ""]}, "2-4-20": {"law": "【土地稅法 第16條】\n地價稅基本稅率為千分之十。土地所有權人之地價總額未超過土地所…\n五、超過累進起點地價二十倍以上者，就其超過部分課徵千分之五十五。", "note": "累進稅率最高到千分之55（超過起點地價20倍以上的部分）。", "full": "【土地稅法 第16條】\n地價稅基本稅率為千分之十。土地所有權人之地價總額未超過土地所在地直轄市或縣（市）累進起點地價者，其地價稅按基本稅率徵收；超過累進起點地價者，依左列規定累進課徵：\n一、超過累進起點地價未達五倍者，就其超過部分課徵千分之十五。\n二、超過累進起點地價五倍至十倍者，就其超過部分課徵千分之二十五。\n三、超過累進起點地價十倍至十五倍者，就其超過部分課徵千分之三十五。\n四、超過累進起點地價十五倍至二十倍者，就其超過部分課徵千分之四十五。\n五、超過累進起點地價二十倍以上者，就其超過部分課徵千分之五十五。", "opts": ["", "萬分之55不對", "千分之45是第四級", "萬分之45不對"]}, "2-4-21": {"law": "【土地稅法 第17條】\n合於左列規定之自用住宅用地，其地價稅按千分之二計徵：", "note": "自用住宅用地優惠稅率：千分之2。", "opts": ["", "千分之5不對", "萬分之10就是千分之1，不對", "千分之10是基本稅率"]}, "2-4-22": {"law": "【土地稅法 第17條】\n合於左列規定之自用住宅用地，其地價稅按千分之二計徵：\n二、非都市土地面積未超過七公畝部分。", "note": "自用住宅優惠面積：都市3公畝、非都市7公畝（二選一，用「或」）。", "full": "【土地稅法 第17條】\n合於左列規定之自用住宅用地，其地價稅按千分之二計徵：\n一、都市土地面積未超過三公畝部分。\n二、非都市土地面積未超過七公畝部分。", "opts": ["不是「及」", "都市是3、非都市是7", "不是「以及」", ""]}, "2-4-23": {"law": "【土地稅法施行細則 第10條】\n本法第十七條第二項所稱企業或公營事業興建之勞工宿舍，指興建之目的專供勞工居住之用。", "note": "勞工宿舍：企業蓋的、「專供勞工住」。兼辦公、兼廠房、兼商業都不算。", "opts": ["兼商業不算", "兼辦公不算", "兼廠房不算", ""]}, "2-4-24": {"law": "【土地稅法 第17條】\n土地所有權人與其配偶及未成年之受扶養親屬，適用第一項自用住宅用地稅率繳納地價稅者，以一處為限。\n\n【土地稅法施行細則 第9條】\n土地所有權人在本法施行區域內申請之自用住宅用地面積超過本法第…\n一、土地所有權人與其配偶及未成年之受扶養親屬之戶籍所在地。", "note": "本人＋配偶＋未成年子女共用「一處」；父母戶、成年子女戶各有戶籍，可以再用。所以 1＋1＋1＝3戶。", "full": "【土地稅法 第17條】\n土地所有權人與其配偶及未成年之受扶養親屬，適用第一項自用住宅用地稅率繳納地價稅者，以一處為限。\n\n【土地稅法施行細則 第9條】\n土地所有權人在本法施行區域內申請之自用住宅用地面積超過本法第十七條第一項規定時，應依土地所有權人擇定之適用順序計算至該規定之面積限制為止；土地所有權人未擇定者，以申請當年之自用住宅用地地價稅額由高至低之適用順序計算之；其稅額相同者，適用順序如下：\n一、土地所有權人與其配偶及未成年之受扶養親屬之戶籍所在地。\n二、直系血親尊親屬之戶籍所在地。\n三、直系血親卑親屬之戶籍所在地。\n四、直系姻親之戶籍所在地。", "opts": ["不是只有1戶", "不是2戶", "", "本人家庭只算一處，共3戶"]}, "2-4-25": {"law": "【土地稅法施行細則 第8條】\n…土地所有權人未擇定者，以申請當年之自用住宅用地地價稅額最高者為準；…", "note": "申請超過一處：先看所有人選的戶籍；沒選，就看當年「地價稅最高」的那處。", "full": "【土地稅法施行細則 第8條】\n土地所有權人在本法施行區域內申請超過一處之自用住宅用地時，依本法第十七條第三項認定一處適用自用住宅用地稅率，以土地所有權人擇定之戶籍所在地為準；土地所有權人未擇定者，以申請當年之自用住宅用地地價稅額最高者為準；其稅額相同者，依土地所有權人、配偶、未成年受扶養親屬戶籍所在地之順序適用。", "opts": ["", "戶籍順序是算面積限制時用的", "不是看課稅面積", "不是看申報地價"]}, "2-4-26": {"law": "【土地稅法施行細則 第8條】\n土地所有權人與其配偶或未成年之受扶養親屬分別以所有土地申請自用住宅用地者，應以共同擇定之戶籍所在地為準；未擇定者，以土地所有權人與其配偶、未成年之受扶養親屬申請當年之自用住宅用地地價稅額最高者為準。", "note": "所有人和配偶、未成年子女各自申請，沒共同選定，就以當年「地價稅最高」的為準。", "opts": ["不是單看所有權人", "不是單看配偶", "不是單看未成年親屬", ""]}, "2-4-27": {"law": "【土地稅法 第9條】\n本法所稱自用住宅用地，指土地所有權人或其配偶、直系親屬於該地辦竣戶籍登記，且無出租或供營業用之住宅用地。", "note": "自用住宅一定要「設戶籍」。只有1戶設籍，其他沒設籍的不符合。", "opts": ["", "不是2戶", "不是3戶", "沒設籍的不符合"]}, "2-4-28": {"law": "【土地稅法 第6條】\n…其減免標準及程序，由行政院定之。", "note": "土地稅減免的標準和程序，由「行政院」訂。", "full": "【土地稅法 第6條】\n為發展經濟，促進土地利用，增進社會福利，對於國防、政府機關、公共設施、騎樓走廊、研究機構、教育、交通、水利、給水、鹽業、宗教、醫療、衛生、公私墓、慈善或公益事業及合理之自用住宅等所使用之土地，及重劃、墾荒、改良土地者，得予適當之減免；其減免標準及程序，由行政院定之。", "opts": ["不是縣市政府", "不是財政部", "不是內政部", ""]}, "2-4-29": {"law": "【土地稅法 第18條】\n供左列事業直接使用之土地，按千分之十計徵地價稅。但未按目的事…\n四、經主管機關核准設置之加油站及依都市計畫法規定設置之供公眾使用之停車場用地。", "note": "千分之10的固定稅率給：工業、私立公園、寺廟教堂、加油站這類事業用地。都市計畫行政區土地不是。", "full": "【土地稅法 第18條】\n供左列事業直接使用之土地，按千分之十計徵地價稅。但未按目的事業主管機關核定規劃使用者，不適用之：\n一、工業用地、礦業用地。\n二、私立公園、動物園、體育場所用地。\n三、寺廟、教堂用地、政府指定之名勝古蹟用地。\n四、經主管機關核准設置之加油站及依都市計畫法規定設置之供公眾使用之停車場用地。\n五、其他經行政院核定之土地。\n在依法劃定之工業區或工業用地公告前，已在非工業區或工業用地設立之工廠，經政府核准有案者，其直接供工廠使用之土地，準用前項規定。", "opts": ["私立動物園是千分之10", "寺廟教堂是千分之10", "", "加油站是千分之10"]}, "2-4-30": {"law": "【土地稅法 第19條】\n都市計畫公共設施保留地，在保留期間仍為建築使用者，除自用住宅用地依第十七條之規定外，統按千分之六計徵地價稅；其未作任何使用並與使用中之土地隔離者，免徵地價稅。", "note": "公設保留地，保留期間完全沒使用又和其他土地隔離：免徵地價稅。", "opts": ["千分之2是自用住宅", "千分之6是仍有建築使用", "不是減半", ""]}, "2-4-31": {"law": "【土地稅法 第18條】\n供左列事業直接使用之土地，按千分之十計徵地價稅。但未按目的事…\n三、寺廟、教堂用地、政府指定之名勝古蹟用地。", "note": "寺廟教堂用地千分之10。工業區也是千分之10（不是6）；私立公園也是千分之10（不是免稅）；公設保留地仍建築使用是千分之6。", "full": "【土地稅法 第18條】\n供左列事業直接使用之土地，按千分之十計徵地價稅。但未按目的事業主管機關核定規劃使用者，不適用之：\n三、寺廟、教堂用地、政府指定之名勝古蹟用地。", "opts": ["工業區是千分之10", "", "私立公園是千分之10，不免徵", "建築使用的保留地是千分之6"]}, "2-4-32": {"law": "（地價稅每期稅額 100 元以下免課，我在土地稅法條文裡沒有找到原文）", "note": "每期地價稅，每戶100元以下就不課。（來自稽徵實務，條文找不到。）", "flag": "土地稅法條文沒有這個數字，來自稽徵實務的規定。考試記題庫答案 100 元。", "opts": ["不是50元", "", "不是150元", "不是200元"]}, "2-4-33": {"law": "【土地稅法 第40條】\n地價稅以每年八月三十一日為納稅義務基準日，由直轄市或縣（市）主管稽徵機關按照地政機關編送之地價歸戶冊及地籍異動通知資料核定，於十一月一日起一個月內一次徵收當年地價稅。", "note": "地價稅1年只收1次，每年11/1起1個月內。", "opts": ["不是1年2期", "不是一季一期", "不是視公告", ""]}, "2-4-34": {"law": "【土地稅法 第40條】\n地價稅以每年八月三十一日為納稅義務基準日，由直轄市或縣（市）主管稽徵機關按照地政機關編送之地價歸戶冊及地籍異動通知資料核定，於十一月一日起一個月內一次徵收當年地價稅。", "note": "地價稅基準日是8/31。10/1才賣，基準日當天還是甲的，所以整年甲繳。", "opts": ["不是按月數分擔", "不是協議", "", "基準日8/31是甲所有"]}, "2-4-35": {"law": "【土地稅法 第41條】\n依第十七條及第十八條規定，得適用特別稅率之用地，土地所有權人應於每年地價稅開徵四十日前提出申請，逾期申請者，自申請之次年開始適用。前已核定而用途未變更者，以後免再申請。", "note": "要用自用住宅優惠稅率，得在地價稅開徵「40天前」申請。逾期要等到明年。", "opts": ["是40天前，不是60天", "", "要在開徵40天前", "逾期是次年適用，不是整年用一般稅率"]}, "2-4-36": {"law": "【土地稅法 第41條】\n依第十七條及第十八條規定，得適用特別稅率之用地，土地所有權人應於每年地價稅開徵四十日前提出申請，逾期申請者，自申請之次年開始適用。前已核定而用途未變更者，以後免再申請。", "note": "核定後用途沒變，就不用每年再申請。（但原因消失要主動申報。）", "opts": ["", "不用每3年", "不用每2年", "原因消失要申報"]}, "2-4-37": {"law": "【土地稅法 第42條】\n主管稽徵機關應於每年地價稅開徵六十日前，將第十七條及第十八條適用特別稅率課徵地價稅之有關規定及其申請手續公告週知。", "note": "稽徵機關要在開徵「60天前」公告特別稅率規定和申請方式。", "opts": ["不是15天", "不是30天", "", "不是90天"]}, "2-4-38": {"law": "【土地稅法 第54條】\n納稅義務人藉變更、隱匿地目等則或於適用特別稅率、減免地價稅或…\n一、逃稅或減輕稅賦者，除追補應納部分外，處短匿稅額或賦額三倍以下之罰鍰。", "note": "優惠原因消失（像自用改營業）卻沒申報：補稅，再罰「短匿稅額3倍以下」。", "full": "【土地稅法 第54條】\n納稅義務人藉變更、隱匿地目等則或於適用特別稅率、減免地價稅或田賦之原因、事實消滅時，未向主管稽徵機關申報者，依下列規定辦理：\n一、逃稅或減輕稅賦者，除追補應納部分外，處短匿稅額或賦額三倍以下之罰鍰。", "opts": ["不是10倍", "不是5倍", "不是2倍", ""]}, "2-5-01": {"law": "【所得稅法 第14條】\n四、將財產借與他人使用，除經查明確係無償且非供營業或執行業務者使用外，應參照當地一般租金情況，計算租賃收入，繳納所得稅。", "note": "財產無償借人：只有「查明確實無償、而且不是營業或執行業務用」才免。其他都要設算租金課稅。", "opts": ["無償且非營業可不課", "", "不是不能扣費用", "營業用無償仍要課稅"]}, "2-5-02": {"law": "【所得稅法 第14條】\n三、財產出租，收有押金或任何款項類似押金者，或以財產出典而取得典價者，均應就各該款項按當地銀行業通行之一年期存款利率，計算租賃收入。", "note": "收押金：按「當地銀行一年期存款利率」算租賃收入。", "opts": ["", "不是6個月存款", "不是貸款利率", "不是6個月貸款"]}, "2-5-03": {"law": "【所得稅法 第88條】\n納稅義務人有下列各類所得者，應由扣繳義務人於給付時，依規定之…\n二、機關、行政法人、團體、學校、事業、破產財團之破產管理人、執行業務者或信託行為之受託人因管理、處分信託財產所給付之薪資、利息、租金、佣金、權利金、競技、競賽或機會中獎之獎金或給與、退休金、資遣費、退職金、離職金、終身俸、非屬保險給付之養老金、告發或檢舉獎金、結構型商品交易之所得、執行業務者之報酬，及給付在中華民國境內無固定營業場所或營業代理人之國外營利事業之所得。", "note": "租金所得由「付錢的人（扣繳義務人）」付款時就先扣稅。", "full": "【所得稅法 第88條】\n納稅義務人有下列各類所得者，應由扣繳義務人於給付時，依規定之扣繳率或扣繳辦法，扣取稅款，並依第九十二條規定繳納之：\n二、機關、行政法人、團體、學校、事業、破產財團之破產管理人、執行業務者或信託行為之受託人因管理、處分信託財產所給付之薪資、利息、租金、佣金、權利金、競技、競賽或機會中獎之獎金或給與、退休金、資遣費、退職金、離職金、終身俸、非屬保險給付之養老金、告發或檢舉獎金、結構型商品交易之所得、執行業務者之報酬，及給付在中華民國境內無固定營業場所或營業代理人之國外營利事業之所得。", "opts": ["", "不是納稅人自己扣", "稅由納稅人負擔", "不是分離課稅"]}, "2-5-04": {"law": "【所得稅法 第89條】\n二、薪資、利息、租金、佣金、權利金、執行業務報酬、競技、競賽或機會中獎獎金或給與、退休金、資遣費、退職金、離職金、終身俸、非屬保險給付之養老金、告發或檢舉獎金、結構型商品交易之所得，及給付在中華民國境內無固定營業場所或營業代理人之國外營利事業之所得，其扣繳義務人為機關、行政法人、團體、學校、事業、破產財團之破產管理人、執行業務者或信託行為之受託人；…\n\n【所得稅法 第88條】\n二、機關、行政法人、團體、學校、事業、破產財團之破產管理人、執行業務者或信託行為之受託人因管理、處分信託財產所給付之薪資、利息、租金、佣金、權利金、競技、競賽或機會中獎之獎金或給與、退休金、資遣費、退職金、離職金、終身俸、非屬保險給付之養老金、告發或檢舉獎金、結構型商品交易之所得、執行業務者之報酬，及給付在中華民國境內無固定營業場所或營業代理人之國外營利事業之所得。", "note": "扣繳義務人是機關、公司、學校、執行業務者。房客是自然人就不用扣繳。房東隔年5月自己申報。", "full": "【所得稅法 第88條】\n二、機關、行政法人、團體、學校、事業、破產財團之破產管理人、執行業務者或信託行為之受託人因管理、處分信託財產所給付之薪資、利息、租金、佣金、權利金、競技、競賽或機會中獎之獎金或給與、退休金、資遣費、退職金、離職金、終身俸、非屬保險給付之養老金、告發或檢舉獎金、結構型商品交易之所得、執行業務者之報酬，及給付在中華民國境內無固定營業場所或營業代理人之國外營利事業之所得。\n\n【所得稅法 第89條】\n二、薪資、利息、租金、佣金、權利金、執行業務報酬、競技、競賽或機會中獎獎金或給與、退休金、資遣費、退職金、離職金、終身俸、非屬保險給付之養老金、告發或檢舉獎金、結構型商品交易之所得，及給付在中華民國境內無固定營業場所或營業代理人之國外營利事業之所得，其扣繳義務人為機關、行政法人、團體、學校、事業、破產財團之破產管理人、執行業務者或信託行為之受託人；納稅義務人為取得所得者。", "opts": ["不是房東自扣", "", "不是免稅", "自然人房客不是扣繳義務人"]}, "2-5-05": {"law": "【所得稅法 第89條】\n扣繳義務人未履行扣繳責任，而有他遷不明、行蹤不明或其他情事，致無從追究者，稽徵機關得逕向納稅義務人徵收之。", "note": "扣繳義務人跑掉了，稅局可以直接向納稅義務人收稅。", "opts": ["可以直接向納稅人收", "仍要納稅", "收的是稅款，不是罰鍰", ""]}, "2-5-06": {"law": "【各類所得扣繳率標準 第2條】\n納稅義務人如為中華民國境內居住之個人，或在中華民國境內有固定…\n五、租金按給付額扣取百分之十。", "note": "境內居住的個人，租金扣繳率10%。", "full": "【各類所得扣繳率標準 第2條】\n納稅義務人如為中華民國境內居住之個人，或在中華民國境內有固定營業場所之營利事業，按下列規定扣繳：\n五、租金按給付額扣取百分之十。", "opts": ["20%是非境內居住者", "15%不是", "5%不是", ""]}, "2-5-07": {"law": "【各類所得扣繳率標準 第3條】\n納稅義務人如為非中華民國境內居住之個人，或在中華民國境內無固…\n五、租金按給付額扣取百分之二十。", "note": "非境內居住的個人，租金扣繳率20%。", "full": "【各類所得扣繳率標準 第3條】\n納稅義務人如為非中華民國境內居住之個人，或在中華民國境內無固定營業場所之營利事業，按下列規定扣繳：\n五、租金按給付額扣取百分之二十。", "opts": ["", "15%不是", "5%不是", "10%是境內居住者"]}, "2-5-08": {"law": "【所得稅法施行細則 第88條】\n將財產無償借與他人使用者，應由雙方當事人訂立無償借用契約，經雙方當事人以外之二人證明確係無償借用，並依公證法之規定辦竣公證。\n\n【所得稅法 第14條】\n四、將財產借與他人使用，除經查明確係無償且非供營業或執行業務者使用外，應參照當地一般租金情況，計算租賃收入，繳納所得稅。", "note": "無償借用要證明：訂借用契約、2位當事人以外證人、並辦公證。", "full": "【所得稅法 第14條】\n四、將財產借與他人使用，除經查明確係無償且非供營業或執行業務者使用外，應參照當地一般租金情況，計算租賃收入，繳納所得稅。\n\n【所得稅法施行細則 第88條】\n將財產無償借與他人使用者，應由雙方當事人訂立無償借用契約，經雙方當事人以外之二人證明確係無償借用，並依公證法之規定辦竣公證。", "flag": "題庫的 A 沒提到公證；現行施行細則第 88 條還要求「依公證法規定辦竣公證」。題庫選 A，考試記題庫答案。", "opts": ["", "要先符合「訂無償借用契約＋2人證明（＋公證）」的條件，才不用設算租金收入；不是一律不用申報", "只有雙方訂約不夠，還要當事人以外2人證明", "沒有贈與申報這回事"]}, "2-5-09": {"law": "【各類所得扣繳率標準 第13條】\n中華民國境內居住之個人如有第二條規定之所得，扣繳義務人每次應扣繳稅額不超過新臺幣二千元者，免予扣繳。但下列依本法規定分離課稅之所得，仍應依規定扣繳：", "note": "每次應扣繳稅額不超過2,000元，免扣繳。", "opts": ["不是1,000元", "不是20,000元", "不是10,000元", ""]}, "2-5-10": {"law": "【全民健康保險扣取及繳納補充保險費辦法 第4條】\n扣費義務人給付本法第三十一條第一項各類所得時，其單次給付金額達新臺幣二萬元者，應按規定之補充保險費率扣取補充保險費，並於給付日之次月底前填具繳款書，向保險人繳納。…", "note": "租金收入單次給付達2萬元，要扣二代健保補充保費。", "full": "【全民健康保險扣取及繳納補充保險費辦法 第4條】\n扣費義務人給付本法第三十一條第一項各類所得時，其單次給付金額達新臺幣二萬元者，應按規定之補充保險費率扣取補充保險費，並於給付日之次月底前填具繳款書，向保險人繳納。但符合本法第三十一條第一項第一款逾當月投保金額四倍部分之獎金，應全數計收補充保險費。", "opts": ["", "2,000元是免扣繳稅額", "5,000元不是", "不是最低工資"]}, "2-5-11": {"law": "【所得稅法 第14條】\n一、財產租賃所得及權利金所得之計算，以全年租賃收入或權利金收入，減除必要損耗及費用後之餘額為所得額。", "note": "出租土地，費用只能減「當年繳的地價稅」，不能再用費用耗損率。（原文我沒抓到，依題庫。）", "full": "（財產租賃必要損耗及費用標準，我沒有抓到原文）\n\n【所得稅法 第14條】\n一、財產租賃所得及權利金所得之計算，以全年租賃收入或權利金收入，減除必要損耗及費用後之餘額為所得額。", "flag": "這題的出處是「財產租賃必要損耗及費用標準」，我沒有抓到原文，無法逐字貼法條，內容依題庫。", "opts": ["可以減地價稅", "不能用費用耗損率", "", "費用耗損率不能再減"]}, "2-5-12": {"law": "【所得稅法 第17條】\n8.房屋租金支出特別扣除：自中華民國一百十三年一月一日起，納稅義務人、配偶及受扶養直系親屬在中華民國境內租屋供自住且非供營業或執行業務使用者，其所支付之租金減除接受政府補助部分，每一申報戶每年扣除數額以十八萬元為限。…", "note": "租屋自住租金特別扣除：每戶每年18萬為限；在境內有房子的不能扣。", "full": "【所得稅法 第17條】\n8.房屋租金支出特別扣除：自中華民國一百十三年一月一日起，納稅義務人、配偶及受扶養直系親屬在中華民國境內租屋供自住且非供營業或執行業務使用者，其所支付之租金減除接受政府補助部分，每一申報戶每年扣除數額以十八萬元為限。但納稅義務人、配偶或受扶養直系親屬在中華民國境內有房屋者，不得扣除。", "flag": "題庫選項 C 後半「申報購屋借款利息者不得扣除」是舊法寫法；113年起條文改成「在境內有房屋者不得扣除」。上限 18 萬、每一申報戶沒變，考試選 C。", "opts": ["不是27萬，是18萬", "是每一申報戶", "", "是每一申報戶"]}, "2-5-13": {"law": "【所得稅法 第88條】\n納稅義務人有下列各類所得者，應由扣繳義務人於給付時，依規定之…\n二、機關、行政法人、團體、學校、事業、破產財團之破產管理人、執行業務者或信託行為之受託人因管理、處分信託財產所給付之薪資、利息、租金、佣金、權利金、競技、競賽或機會中獎之獎金或給與、退休金、資遣費、退職金、離職金、終身俸、非屬保險給付之養老金、告發或檢舉獎金、結構型商品交易之所得、執行業務者之報酬，及給付在中華民國境內無固定營業場所或營業代理人之國外營利事業之所得。", "note": "非境內居住者在台灣有租金：付錢的人付款時就先扣稅。不是免稅，也不是隔年自己報。", "full": "【所得稅法 第88條】\n納稅義務人有下列各類所得者，應由扣繳義務人於給付時，依規定之扣繳率或扣繳辦法，扣取稅款，並依第九十二條規定繳納之：\n二、機關、行政法人、團體、學校、事業、破產財團之破產管理人、執行業務者或信託行為之受託人因管理、處分信託財產所給付之薪資、利息、租金、佣金、權利金、競技、競賽或機會中獎之獎金或給與、退休金、資遣費、退職金、離職金、終身俸、非屬保險給付之養老金、告發或檢舉獎金、結構型商品交易之所得、執行業務者之報酬，及給付在中華民國境內無固定營業場所或營業代理人之國外營利事業之所得。", "opts": ["", "非居住者是扣繳，不是隔年申報", "不是依核定稅額", "租金所得要課稅"]}, "2-5-14": {"law": "【所得稅法 第71條】\n納稅義務人應於每年五月一日起至五月三十一日止，填具結算申報書，向該管稽徵機關，申報其上一年度內構成綜合所得總額或營利事業收入總額之項目及數額，以及有關減免、扣除之事實，並應依其全年應納稅額減除暫繳稅額、尚未抵繳之扣繳稅額及依第十五條第四項規定計算之可抵減稅額，計算其應納之結算稅額，於申報前自行繳納。…", "note": "個人綜合所得稅向「戶籍所在地」稅局申報。營利事業才是營運所在地。", "full": "【所得稅法 第71條】\n納稅義務人應於每年五月一日起至五月三十一日止，填具結算申報書，向該管稽徵機關，申報其上一年度內構成綜合所得總額或營利事業收入總額之項目及數額，以及有關減免、扣除之事實，並應依其全年應納稅額減除暫繳稅額、尚未抵繳之扣繳稅額及依第十五條第四項規定計算之可抵減稅額，計算其應納之結算稅額，於申報前自行繳納。但依法不併計課稅之所得之扣繳稅款，不得減除。", "flag": "「戶籍所在地」這個規定出自所得稅法施行細則，我沒有抓到對應條文。內容依題庫。", "opts": ["營利事業申報地點不同", "", "總機構合併申報規定不同", "營業代理人規定不同"]}, "3-1-01": {"law": "【消費者保護法 第45-2條】\n關於消費爭議之調解，當事人不能合意但已甚接近者，調解委員得斟酌一切情形，求兩造利益之平衡，於不違反兩造當事人之主要意思範圍內，依職權提出解決事件之方案，並送達於當事人。\n\n【消費者保護法 第45-3條】\n當事人對於前條所定之方案，得於送達後十日之不變期間內，提出異議。", "note": "調解談不攏但很接近，調解委員可以提出建議方案。收到後10天內沒反對，就當成立。", "full": "【消費者保護法 第45-2條】\n關於消費爭議之調解，當事人不能合意但已甚接近者，調解委員得斟酌一切情形，求兩造利益之平衡，於不違反兩造當事人之主要意思範圍內，依職權提出解決事件之方案，並送達於當事人。\n\n【消費者保護法 第45-3條】\n當事人對於前條所定之方案，得於送達後十日之不變期間內，提出異議。\n於前項期間內提出異議者，視為調解不成立；其未於前項期間內提出異議者，視為已依該方案成立調解。", "opts": ["", "15日改10日", "20日改10日", "30日改10日"]}, "3-1-02": {"law": "【消費者保護法 第11-1條】\n企業經營者與消費者訂立定型化契約前，應有三十日以內之合理期間，供消費者審閱全部條款內容。", "note": "簽定型化契約前，消費者可以先拿回家看，最多30天內的合理期間。", "opts": ["10日改30日以內", "15日改30日以內", "20日改30日以內", ""]}, "3-1-03": {"law": "【消費者保護法 第42條】\n直轄市、縣（市）政府應設消費者服務中心，辦理消費者之諮詢服務、教育宣導、申訴等事項。", "note": "縣市政府設「消費者服務中心」，管諮詢、宣導、申訴。調解委員會是管調解的，別搞混。", "opts": ["消保委員會是行政院那一層", "消保團體是民間法人", "", "調解委員會只管調解，不收申訴"]}, "3-1-04": {"law": "【消費者保護法 第52條】\n消費者保護團體以自己之名義提起第五十條訴訟，其標的價額超過新臺幣六十萬元者，超過部分免繳裁判費。", "note": "消保團體自己出面打第50條官司：標的超過60萬的部分，不用繳裁判費。", "opts": ["30萬改60萬", "50萬改60萬", "40萬改60萬", ""]}, "3-1-05": {"law": "【消費者保護法 第11條】\n定型化契約條款如有疑義時，應為有利於消費者之解釋。", "note": "契約寫不清楚時，要往「對消費者有利」的方向解釋。", "opts": ["這樣是偏向企業，反了", "", "不是自己協議，法律已經規定", "不用先調解"]}, "3-1-06": {"law": "【消費者保護法 第27條】\n消費者保護團體應以保護消費者權益、推行消費者教育為宗旨。", "note": "消保團體的宗旨：保護消費者權益、推廣消費者教育。", "full": "【消費者保護法 第27條】\n消費者保護團體以社團法人或財團法人為限。\n消費者保護團體應以保護消費者權益、推行消費者教育為宗旨。", "opts": ["", "這是團體的工作，不是宗旨", "這是政府的目標，不是團體宗旨", "這是團體的工作，不是宗旨"]}, "3-1-07": {"law": "【消費者保護法 第50條】\n消費者保護團體對於同一之原因事件，致使眾多消費者受害時，得受讓二十人以上消費者損害賠償請求權後，以自己名義，提起訴訟。消費者得於言詞辯論終結前，終止讓與損害賠償請求權，並通知法院。", "note": "消保團體要受讓「20人以上」消費者的賠償請求權，才能自己名義起訴。", "opts": ["10人改20人", "", "15人改20人", "5人改20人"]}, "3-1-08": {"law": "【消費者保護法 第45-3條】\n於前項期間內提出異議者，視為調解不成立；其未於前項期間內提出異議者，視為已依該方案成立調解。", "note": "調解方案收到後10天內沒異議，就當作依方案成立。", "full": "【消費者保護法 第45-3條】\n當事人對於前條所定之方案，得於送達後十日之不變期間內，提出異議。\n於前項期間內提出異議者，視為調解不成立；其未於前項期間內提出異議者，視為已依該方案成立調解。", "opts": ["", "15日改10日", "20日改10日", "3日改10日"]}, "3-1-09": {"law": "【消費者保護法 第45-4條】\n第一項小額消費爭議之額度，由行政院定之。", "note": "小額消費爭議的金額門檻，由行政院訂。", "opts": ["", "消保團體不訂", "消保官不訂", "調解委員會不訂"]}, "3-1-10": {"law": "【消費者保護法 第11條】\n定型化契約條款如有疑義時，應為有利於消費者之解釋。", "note": "契約條款有疑義，要有利於「消費者」。", "opts": ["偏向企業是反的", "不是偏向政府", "", "不是偏向消保團體"]}, "3-1-11": {"law": "【消費者保護法 第11-1條】\n違反第一項規定者，其條款不構成契約之內容。但消費者得主張該條款仍構成契約之內容。", "note": "企業沒給審閱期：這條款「不算數」，但消費者想主張它算數，還是可以。主導權在消費者。", "opts": ["要消費者主張才算，不是自動算", "消費者還是可以主張它算", "", "順序反了，是不算數但消費者可主張"]}, "3-1-12": {"law": "【消費者保護法 第15條】\n定型化契約中之定型化契約條款牴觸個別磋商條款之約定者，其牴觸部分無效。", "note": "定型化條款跟雙方特別談好的條款打架，定型化那條無效。談好的比較大。", "opts": ["", "被判無效的是定型化條款", "不是兩個都無效", "不是兩個都有效"]}, "3-1-13": {"law": "【消費者保護法 第45條】\n直轄市、縣（市）政府應設消費爭議調解委員會，置委員七名至二十一名。", "note": "消費爭議調解委員會，委員7到21人。", "opts": ["5至7人太少", "5至9人太少", "", "15至21人下限太高"]}, "3-1-14": {"law": "【消費者保護法 第49條】\n消費者保護團體許可設立二年以上，置有消費者保護專門人員，且申請行政院評定優良者，得以自己之名義，提起第五十條消費者損害賠償訴訟或第五十三條不作為訴訟。", "note": "消保團體要設立滿2年、有專門人員、經行政院評優良，才可用自己名義提訴。", "opts": ["5年改2年", "4年改2年", "3年改2年", ""]}, "3-1-15": {"law": "【消費者保護法 第51條】\n依本法所提之訴訟，因企業經營者之故意所致之損害，消費者得請求損害額五倍以下之懲罰性賠償金；但因重大過失所致之損害，得請求三倍以下之懲罰性賠償金，因過失所致之損害，得請求損害額一倍以下之懲罰性賠償金。", "note": "懲罰性賠償金口訣：故意5倍、重大過失3倍、一般過失1倍。", "opts": ["3倍是重大過失", "", "沒有7倍", "沒有10倍"]}, "3-1-16": {"law": "【消費者保護法 第17條】\n企業經營者使用定型化契約者，主管機關得隨時派員查核。\n\n【消費者保護法 第57條】\n企業經營者規避、妨礙或拒絕主管機關依第十七條第六項、第三十三條或第三十八條規定所為之調查者，處新臺幣三萬元以上三十萬元以下罰鍰，並得按次處罰。", "note": "擋主管機關查核：罰3萬～30萬，可以按次再罰。單次最高30萬。", "opts": ["10萬不是上限", "15萬不是上限", "20萬不是上限", ""]}, "3-1-17": {"law": "【消費者保護法 第2條】\n七、定型化契約條款：指企業經營者為與多數消費者訂立同類契約之用，所提出預先擬定之契約條款。定型化契約條款不限於書面，其以放映字幕、張貼、牌示、網際網路、或其他方法表示者，亦屬之。", "note": "企業為了跟很多消費者簽同類契約，預先寫好的條款，叫「定型化契約條款」。", "opts": ["個別磋商條款是雙方特別談的", "預擬契約條款不是法律名稱", "", "合意契約條款不是法律名稱"]}, "3-1-18": {"law": "【消費者保護法 第33條】\n直轄市或縣（市）政府認為企業經營者提供之商品或服務有損害消費者生命、身體、健康或財產之虞者，應即進行調查。於調查完成後，得公開其經過及結果。", "note": "覺得商品或服務可能傷害消費者，縣市政府「馬上要查」，查完可以公開結果。查的時候要出示證件。", "full": "【消費者保護法 第33條】\n直轄市或縣（市）政府認為企業經營者提供之商品或服務有損害消費者生命、身體、健康或財產之虞者，應即進行調查。於調查完成後，得公開其經過及結果。\n前項人員為調查時，應出示有關證件，其調查得依下列方式進行：", "opts": ["不用等通報，要馬上調查", "", "調查完可以公開", "調查要出示證件"]}, "3-1-19": {"law": "【消費者保護法 第7-1條】\n企業經營者主張其商品於流通進入市場，或其服務於提供時，符合當時科技或專業水準可合理期待之安全性者，就其主張之事實負舉證責任。\n\n【消費者保護法 第7條】\n企業經營者違反前二項規定，致生損害於消費者或第三人時，應負連帶賠償責任。但企業經營者能證明其無過失者，法院得減輕其賠償責任。", "note": "對的是A：製造商要自己證明商品符合當時科技水準能合理期待的安全，舉證責任在企業。B錯：一般過失是1倍，3倍是重大過失。C錯：媒體明知不實要連帶賠。D錯：輸入商品是無過失責任。", "full": "【消費者保護法 第7-1條】\n企業經營者主張其商品於流通進入市場，或其服務於提供時，符合當時科技或專業水準可合理期待之安全性者，就其主張之事實負舉證責任。\n\n【消費者保護法 第51條】\n依本法所提之訴訟，因企業經營者之故意所致之損害，消費者得請求損害額五倍以下之懲罰性賠償金；但因重大過失所致之損害，得請求三倍以下之懲罰性賠償金，因過失所致之損害，得請求損害額一倍以下之懲罰性賠償金。\n\n【消費者保護法 第23條】\n刊登或報導廣告之媒體經營者明知或可得而知廣告內容與事實不符者，就消費者因信賴該廣告所受之損害與企業經營者負連帶責任。\n\n【消費者保護法 第7條】\n企業經營者違反前二項規定，致生損害於消費者或第三人時，應負連帶賠償責任。但企業經營者能證明其無過失者，法院得減輕其賠償責任。", "opts": ["", "一般過失是1倍，不是3倍", "媒體明知不實要連帶賠", "輸入商品是無過失責任，不是過失責任"]}, "3-1-20": {"law": "【消費者保護法 第42條】\n直轄市、縣（市）政府應設消費者服務中心，辦理消費者之諮詢服務、教育宣導、申訴等事項。", "note": "縣市政府設的是「消費者服務中心」。", "opts": ["消保團體是民間法人", "調解委員會只管調解", "", "消保委員會是行政院那一層"]}, "3-1-21": {"law": "【消費者保護法 第45-4條】\n第一項小額消費爭議之額度，由行政院定之。", "note": "小額消費爭議的門檻由行政院定（不是100萬）。一方不到場，調解委員仍可提方案；方案送達不能公示送達。", "full": "【消費者保護法 第45-4條】\n關於小額消費爭議，當事人之一方無正當理由，不於調解期日到場者，調解委員得審酌情形，依到場當事人一造之請求或依職權提出解決方案，並送達於當事人。\n第一項之送達，不適用公示送達之規定。\n第一項小額消費爭議之額度，由行政院定之。", "opts": ["", "一方不到場，調解委員還是可以提方案", "方案送達不能用公示送達", "門檻由行政院定，不是100萬"]}, "3-1-22": {"law": "【消費者保護法 第43條】\n企業經營者對於消費者之申訴，應於申訴之日起十五日內妥適處理之。", "note": "消費者申訴，企業要在15天內妥善處理。", "opts": ["30日改15日", "25日改15日", "20日改15日", ""]}, "3-1-23": {"law": "【消費者保護法 第60條】\n企業經營者違反本法規定，生產商品或提供服務具有危害消費者生命、身體、健康之虞者，影響社會大眾經中央主管機關認定為情節重大，中央主管機關或行政院得立即命令其停止營業，並儘速協請消費者保護團體以其名義，提起消費者損害賠償訴訟。\n\n【消費者保護法 第36條】\n直轄市或縣（市）政府對於企業經營者提供之商品或服務，經第三十三條之調查，認為確有損害消費者生命、身體、健康或財產，或確有損害之虞者，應命其限期改善、回收或銷燬，必要時並得命企業經營者立即停止該商品之設計、生產、製造、加工、輸入、經銷或服務之提供，或採取其他必要措施。", "note": "錯的是A：拒絕、擋調查是罰3～30萬，不是直接命令停止營業。命令停業是第60條，要情節重大。", "full": "【消費者保護法 第33條】\n直轄市或縣（市）政府認為企業經營者提供之商品或服務有損害消費者生命、身體、健康或財產之虞者，應即進行調查。於調查完成後，得公開其經過及結果。\n\n【消費者保護法 第36條】\n直轄市或縣（市）政府對於企業經營者提供之商品或服務，經第三十三條之調查，認為確有損害消費者生命、身體、健康或財產，或確有損害之虞者，應命其限期改善、回收或銷燬，必要時並得命企業經營者立即停止該商品之設計、生產、製造、加工、輸入、經銷或服務之提供，或採取其他必要措施。\n\n【消費者保護法 第37條】\n直轄市或縣（市）政府於企業經營者提供之商品或服務，對消費者已發生重大損害或有發生重大損害之虞，而情況危急時，除為前條之處置外，應即在大眾傳播媒體公告企業經營者之名稱、地址、商品、服務、或為其他必要之處置。\n\n【消費者保護法 第57條】\n企業經營者規避、妨礙或拒絕主管機關依第十七條第六項、第三十三條或第三十八條規定所為之調查者，處新臺幣三萬元以上三十萬元以下罰鍰，並得按次處罰。\n\n【消費者保護法 第60條】\n企業經營者違反本法規定，生產商品或提供服務具有危害消費者生命、身體、健康之虞者，影響社會大眾經中央主管機關認定為情節重大，中央主管機關或行政院得立即命令其停止營業，並儘速協請消費者保護團體以其名義，提起消費者損害賠償訴訟。", "opts": ["", "這是縣市政府該做的措施", "這是縣市政府該做的措施", "這是縣市政府該做的措施"]}, "3-1-24": {"law": "【消費者保護法 第3條】\n政府為達成本法目的，應實施下列措施，並應就與下列事項有關之法…\n九、扶植、獎助消費者保護團體。", "note": "政府要檢討的事：品質安全、防止損害、標示、廣告、度量衡、價格、包裝、公平交易…。「幫企業維護品牌形象」不是政府的工作。", "full": "【消費者保護法 第3條】\n政府為達成本法目的，應實施下列措施，並應就與下列事項有關之法規及其執行情形，定期檢討、協調、改進之：\n一、維護商品或服務之品質與安全衛生。\n二、防止商品或服務損害消費者之生命、身體、健康、財產或其他權益。\n三、確保商品或服務之標示，符合法令規定。\n四、確保商品或服務之廣告，符合法令規定。\n五、確保商品或服務之度量衡，符合法令規定。\n六、促進商品或服務維持合理價格。\n七、促進商品之合理包裝。\n八、促進商品或服務之公平交易。\n九、扶植、獎助消費者保護團體。\n十、協調處理消費爭議。\n十一、推行消費者教育。\n十二、辦理消費者諮詢服務。\n十三、其他依消費生活之發展所必要之消費者保護措施。", "opts": ["品質安全是政府要檢討的", "防止損害是政府要檢討的", "標示是政府要檢討的", ""]}, "3-1-25": {"law": "【消費者保護法 第56條】\n違反第二十四條、第二十五條或第二十六條規定之一者，經主管機關通知改正而逾期不改正者，處新臺幣二萬元以上二十萬元以下罰鍰。", "note": "沒做必要包裝（第26條），通知改了還不改：罰2萬～20萬。", "opts": ["", "3萬～30萬是擋調查那檔", "沒有4萬～40萬", "沒有1萬～10萬"]}, "3-1-26": {"law": "【消費者保護法 第45條】\n前項委員以直轄市、縣（市）政府代表、消費者保護官、消費者保護團體代表、企業經營者所屬或相關職業團體代表、學者及專家充任之，以消費者保護官為主席，其組織另定之。", "note": "調解委員有：政府代表、消保官、消保團體、企業代表、學者專家。立法委員不在裡面。", "opts": ["政府代表是委員", "", "消保官是委員（還是主席）", "消保團體代表是委員"]}, "3-1-27": {"law": "【消費者保護法 第8條】\n從事經銷之企業經營者，就商品或服務所生之損害，與設計、生產、製造商品或提供服務之企業經營者連帶負賠償責任。但其對於損害之防免已盡相當之注意，或縱加以相當之注意而仍不免發生損害者，不在此限。", "note": "經銷商要跟製造者「連帶」賠，但如果已盡到注意（或注意了也沒用），就可免。", "opts": ["不能事先約定限制或免除", "輸入商品視為製造者，不是經銷商", "", "證明無過失只是「得減輕」，不是免除"]}, "3-1-28": {"law": "【消費者保護法 第49條】\n消費者保護團體依前項規定提起訴訟者，應委任律師代理訴訟。受委任之律師，就該訴訟，得請求預付或償還必要費用。", "note": "消保團體依第49條起訴，不用是被害人也能當原告。", "full": "【消費者保護法 第49條】\n消費者保護團體許可設立二年以上，置有消費者保護專門人員，且申請行政院評定優良者，得以自己之名義，提起第五十條消費者損害賠償訴訟或第五十三條不作為訴訟。\n消費者保護團體依前項規定提起訴訟者，應委任律師代理訴訟。受委任之律師，就該訴訟，得請求預付或償還必要費用。", "opts": ["不用基金會同意", "還是要委任律師", "律師可以請求預付必要費用", ""]}, "3-1-29": {"law": "【民事訴訟法 第41條】\n多數有共同利益之人，不合於前條第三項所定者，得由其中選定一人或數人，為選定人及被選定人全體起訴或被訴。", "note": "被大家選出來出面打官司的人叫「選定當事人」，其他人叫「選定人」。甲乙是被選的，所以選C。", "full": "【民事訴訟法 第41條】\n多數有共同利益之人，不合於前條第三項所定者，得由其中選定一人或數人，為選定人及被選定人全體起訴或被訴。\n訴訟繫屬後，經選定前項之訴訟當事人者，其他當事人脫離訴訟。", "opts": ["選定當事人是「任意」訴訟擔當，不是法定", "被選出來的甲、乙叫「選定當事人」；選他們的人才叫「選定人」", "", "其他被害人要併案，得依法院公告、在指定期間內提出，不是判決前都可以"]}, "3-1-30": {"law": "【消費者保護法 第48條】\n法院為企業經營者敗訴之判決時，得依職權宣告為減免擔保之假執行。", "note": "消費訴訟，企業敗訴，法院可以讓消費者「免擔保（或減擔保）先強制執行（假執行）」。方向是企業敗訴。", "opts": ["是企業敗訴才可免擔保，方向反了", "條文是假執行，不是假處分", "條文是假執行，不是假扣押", ""]}, "3-1-31": {"law": "【消費者保護法施行細則 第2條】\n本法第二條第二款所稱營業，不以營利為目的者為限。\n\n【消費者保護法 第2條】\n二、企業經營者：指以設計、生產、製造、輸入、經銷商品或提供服務為營業者。", "note": "企業經營者不一定要營利，只要「反覆做、當成事業」就算。慈善事業如果以此為業，也算。", "full": "【消費者保護法 第2條】\n二、企業經營者：指以設計、生產、製造、輸入、經銷商品或提供服務為營業者。\n\n【消費者保護法施行細則 第2條】\n本法第二條第二款所稱營業，不以營利為目的者為限。", "opts": ["不是不完全給付的問題", "", "營業不限營利", "人身損害也適用商品責任"]}, "3-1-32": {"law": "【消費者保護法 第50條】\n消費者保護團體對於同一之原因事件，致使眾多消費者受害時，得受讓二十人以上消費者損害賠償請求權後，以自己名義，提起訴訟。消費者得於言詞辯論終結前，終止讓與損害賠償請求權，並通知法院。", "note": "消保團體起訴後，部分消費者退出，人數不夠20人也沒關係，團體還是可以繼續打。", "full": "【消費者保護法 第50條】\n消費者保護團體對於同一之原因事件，致使眾多消費者受害時，得受讓二十人以上消費者損害賠償請求權後，以自己名義，提起訴訟。消費者得於言詞辯論終結前，終止讓與損害賠償請求權，並通知法院。\n前項訴訟，因部分消費者終止讓與損害賠償請求權，致人數不足二十人者，不影響其實施訴訟之權能。\n第一項讓與之損害賠償請求權，包括民法第一百九十四條、第一百九十五條第一項非財產上之損害。\n消費者保護團體受讓第三項所定請求權後，應將訴訟結果所得之賠償，扣除訴訟及依前條第二項規定支付予律師之必要費用後，交付該讓與請求權之消費者。", "opts": ["非財產上損害也可以讓與", "", "退出要在言詞辯論終結前，不是判決前任何時候", "可以扣訴訟費用及律師必要費用"]}, "3-1-33": {"law": "【消費者保護法 第46條】\n前項調解書之作成及效力，準用鄉鎮市調解條例第二十五條至第二十九條之規定。\n\n【消費者保護法 第45-2條】\n前項方案，應經參與調解委員過半數之同意，並記載第四十五條之三所定異議期間及未於法定期間提出異議之法律效果。", "note": "調解成立要寫調解書，效力準用鄉鎮市調解條例25～29條。A錯：主席是消保官。B錯：過半數同意就好。C錯：異議是10天。", "full": "【消費者保護法 第46條】\n調解成立者應作成調解書。\n前項調解書之作成及效力，準用鄉鎮市調解條例第二十五條至第二十九條之規定。\n\n【消費者保護法 第45條】\n前項委員以直轄市、縣（市）政府代表、消費者保護官、消費者保護團體代表、企業經營者所屬或相關職業團體代表、學者及專家充任之，以消費者保護官為主席，其組織另定之。\n\n【消費者保護法 第45-2條】\n前項方案，應經參與調解委員過半數之同意，並記載第四十五條之三所定異議期間及未於法定期間提出異議之法律效果。\n\n【消費者保護法 第45-3條】\n當事人對於前條所定之方案，得於送達後十日之不變期間內，提出異議。", "opts": ["主席是消保官，不是互推", "只要過半數同意", "異議期間是10日", ""]}, "3-1-34": {"law": "【消費者保護法 第23條】\n刊登或報導廣告之媒體經營者明知或可得而知廣告內容與事實不符者，就消費者因信賴該廣告所受之損害與企業經營者負連帶責任。\n\n【消費者保護法 第43條】\n消費者與企業經營者因商品或服務發生消費爭議時，消費者得向企業經營者、消費者保護團體或消費者服務中心或其分中心申訴。", "note": "不正確的是B：廣告主明知不實還刊登，要跟企業一起連帶負責。", "full": "【消費者保護法 第22條】\n企業經營者應確保廣告內容之真實，其對消費者所負之義務不得低於廣告之內容。\n\n【消費者保護法 第23條】\n刊登或報導廣告之媒體經營者明知或可得而知廣告內容與事實不符者，就消費者因信賴該廣告所受之損害與企業經營者負連帶責任。\n\n【消費者保護法 第43條】\n消費者與企業經營者因商品或服務發生消費爭議時，消費者得向企業經營者、消費者保護團體或消費者服務中心或其分中心申訴。\n\n【消費者保護法 第44條】\n消費者依前條申訴未能獲得妥適處理時，得向直轄市或縣（市）消費爭議調解委員會申請調解。", "opts": ["正確，要確保廣告真實", "", "正確，可向消保團體申訴", "正確，申訴沒獲處理可申請調解"]}, "3-1-35": {"law": "【消費者保護法 第43條】\n企業經營者對於消費者之申訴，應於申訴之日起十五日內妥適處理之。", "note": "租服業也是企業經營者，申訴後15天內要處理好。", "opts": ["5日改15日", "10日改15日", "", "20日改15日"]}, "3-1-36": {"law": "【消費者保護法 第50條】\n消費者保護團體對於同一之原因事件，致使眾多消費者受害時，得受讓二十人以上消費者損害賠償請求權後，以自己名義，提起訴訟。消費者得於言詞辯論終結前，終止讓與損害賠償請求權，並通知法院。", "note": "一件事害到很多房客，消保團體受讓20人以上請求權，可以自己名義起訴。", "opts": ["10人改20人", "", "30人改20人", "50人改20人"]}, "3-1-37": {"law": "【消費者保護法 第45-1條】\n調解程序，於直轄市、縣（市）政府或其他適當之處所行之，其程序得不公開。\n\n【消費者保護法 第43條】\n消費者與企業經營者因商品或服務發生消費爭議時，消費者得向企業經營者、消費者保護團體或消費者服務中心或其分中心申訴。", "note": "調解可以不公開。A錯：是消費者向企業申訴。B錯：要先申訴沒處理好，才能申請調解。D錯：調解內容要保密。", "full": "【消費者保護法 第45-1條】\n調解程序，於直轄市、縣（市）政府或其他適當之處所行之，其程序得不公開。\n\n【消費者保護法 第43條】\n消費者與企業經營者因商品或服務發生消費爭議時，消費者得向企業經營者、消費者保護團體或消費者服務中心或其分中心申訴。\n\n【消費者保護法 第44條】\n消費者依前條申訴未能獲得妥適處理時，得向直轄市或縣（市）消費爭議調解委員會申請調解。", "opts": ["是消費者向企業申訴，不是企業申訴", "要先申訴，沒處理好才能申請調解", "", "調解內容要保密，不是公開"]}, "3-1-38": {"law": "【消費者保護法 第11條】\n定型化契約條款如有疑義時，應為有利於消費者之解釋。\n\n【消費者保護法 第12條】\n定型化契約中之條款違反誠信原則，對消費者顯失公平者，無效。", "note": "錯的是C：條款有疑義要往「對消費者有利」解釋，不是平等互惠。", "full": "【消費者保護法 第11條】\n企業經營者在定型化契約中所用之條款，應本平等互惠之原則。\n定型化契約條款如有疑義時，應為有利於消費者之解釋。\n\n【消費者保護法 第12條】\n定型化契約中之條款違反誠信原則，對消費者顯失公平者，無效。\n\n【消費者保護法 第15條】\n定型化契約中之定型化契約條款牴觸個別磋商條款之約定者，其牴觸部分無效。", "opts": ["正確，牴觸部分無效", "正確，顯失公平者無效", "", "正確，沒寫進契約又預料不到的不算數"]}, "3-1-39": {"law": "【消費者保護法 第45-2條】\n關於消費爭議之調解，當事人不能合意但已甚接近者，調解委員得斟酌一切情形，求兩造利益之平衡，於不違反兩造當事人之主要意思範圍內，依職權提出解決事件之方案，並送達於當事人。\n\n【消費者保護法 第45條】\n直轄市、縣（市）政府應設消費爭議調解委員會，置委員七名至二十一名。", "note": "正確的是C：調解委員可以主動提方案。A錯：委員7～21人。B錯：可不公開。D錯：異議是10天。", "full": "【消費者保護法 第45條】\n直轄市、縣（市）政府應設消費爭議調解委員會，置委員七名至二十一名。\n\n【消費者保護法 第45-1條】\n調解程序，於直轄市、縣（市）政府或其他適當之處所行之，其程序得不公開。\n\n【消費者保護法 第45-2條】\n關於消費爭議之調解，當事人不能合意但已甚接近者，調解委員得斟酌一切情形，求兩造利益之平衡，於不違反兩造當事人之主要意思範圍內，依職權提出解決事件之方案，並送達於當事人。\n前項方案，應經參與調解委員過半數之同意，並記載第四十五條之三所定異議期間及未於法定期間提出異議之法律效果。\n\n【消費者保護法 第45-3條】\n當事人對於前條所定之方案，得於送達後十日之不變期間內，提出異議。", "opts": ["委員是7至21名", "程序可以不公開", "", "異議期間是10日"]}, "3-1-40": {"law": "【消費者保護法 第11-1條】\n違反第一項規定者，其條款不構成契約之內容。但消費者得主張該條款仍構成契約之內容。", "note": "違反審閱期：條款不算數，但消費者可主張它算數。B錯：是30天以內。C錯：拋棄審閱權是無效，不是可撤銷。A錯：那是解釋契約的原則。", "full": "【消費者保護法 第11-1條】\n企業經營者與消費者訂立定型化契約前，應有三十日以內之合理期間，供消費者審閱全部條款內容。\n企業經營者以定型化契約條款使消費者拋棄前項權利者，無效。\n違反第一項規定者，其條款不構成契約之內容。但消費者得主張該條款仍構成契約之內容。", "opts": ["有疑義是往有利消費者解釋，不是探求企業真意", "審閱期是30日以內", "拋棄審閱權是無效，不是可撤銷", ""]}, "3-1-41": {"law": "【消費者保護法 第8條】\n前項之企業經營者，改裝、分裝商品或變更服務內容者，視為第七條之企業經營者。\n\n【消費者保護法 第7條】\n企業經營者違反前二項規定，致生損害於消費者或第三人時，應負連帶賠償責任。但企業經營者能證明其無過失者，法院得減輕其賠償責任。", "note": "正確的是C：經銷商改裝、分裝或變更服務，就視為製造者。A錯：無過失只是可減輕。B錯：不能因為後來有更好的就說舊的不安全。D錯：不能預先限制或免除。", "full": "【消費者保護法 第8條】\n前項之企業經營者，改裝、分裝商品或變更服務內容者，視為第七條之企業經營者。\n\n【消費者保護法 第7條】\n商品或服務具有危害消費者生命、身體、健康、財產之可能者，應於明顯處為警告標示及緊急處理危險之方法。\n企業經營者違反前二項規定，致生損害於消費者或第三人時，應負連帶賠償責任。但企業經營者能證明其無過失者，法院得減輕其賠償責任。\n\n【消費者保護法 第7-1條】\n商品或服務不得僅因其後有較佳之商品或服務，而被視為不符合前條第一項之安全性。", "opts": ["證明無過失只是「得減輕」", "不能因後來有更好的就推定不安全", "", "不得預先約定限制或免除"]}, "3-1-42": {"law": "【消費者保護法 第49條】\n消費者保護團體依前項規定提起訴訟者，應委任律師代理訴訟。受委任之律師，就該訴訟，得請求預付或償還必要費用。\n\n【消費者保護法 第50條】\n消費者保護團體就第一項訴訟，不得向消費者請求報酬。", "note": "消保團體依第49條起訴，一定要委任律師。", "full": "【消費者保護法 第49條】\n消費者保護團體依前項規定提起訴訟者，應委任律師代理訴訟。受委任之律師，就該訴訟，得請求預付或償還必要費用。\n\n【消費者保護法 第50條】\n消費者保護團體對於同一之原因事件，致使眾多消費者受害時，得受讓二十人以上消費者損害賠償請求權後，以自己名義，提起訴訟。消費者得於言詞辯論終結前，終止讓與損害賠償請求權，並通知法院。\n消費者保護團體受讓第三項所定請求權後，應將訴訟結果所得之賠償，扣除訴訟及依前條第二項規定支付予律師之必要費用後，交付該讓與請求權之消費者。\n消費者保護團體就第一項訴訟，不得向消費者請求報酬。", "opts": ["要符合設立條件，不能立刻組成就起訴", "言詞辯論終結前，消費者可以退出", "", "不能向消費者收報酬"]}, "3-1-43": {"law": "【消費者保護法 第36條】\n直轄市或縣（市）政府對於企業經營者提供之商品或服務，經第三十三條之調查，認為確有損害消費者生命、身體、健康或財產，或確有損害之虞者，應命其限期改善、回收或銷燬，必要時並得命企業經營者立即停止該商品之設計、生產、製造、加工、輸入、經銷或服務之提供，或採取其他必要措施。\n\n【消費者保護法 第58條】\n企業經營者違反主管機關依第三十六條或第三十八條規定所為之命令者，處新臺幣六萬元以上一百五十萬元以下罰鍰，並得按次處罰。", "note": "罰最重的是A：不聽縣市政府的命令（限期回收等）：6萬～150萬。B、C是標示或保證書沒做（2萬～20萬）；D是擋查核（3萬～30萬）。", "full": "【消費者保護法 第36條】\n直轄市或縣（市）政府對於企業經營者提供之商品或服務，經第三十三條之調查，認為確有損害消費者生命、身體、健康或財產，或確有損害之虞者，應命其限期改善、回收或銷燬，必要時並得命企業經營者立即停止該商品之設計、生產、製造、加工、輸入、經銷或服務之提供，或採取其他必要措施。\n\n【消費者保護法 第57條】\n企業經營者規避、妨礙或拒絕主管機關依第十七條第六項、第三十三條或第三十八條規定所為之調查者，處新臺幣三萬元以上三十萬元以下罰鍰，並得按次處罰。\n\n【消費者保護法 第58條】\n企業經營者違反主管機關依第三十六條或第三十八條規定所為之命令者，處新臺幣六萬元以上一百五十萬元以下罰鍰，並得按次處罰。", "opts": ["", "標示違規是2萬～20萬", "沒給保證書是2萬～20萬", "擋查核是3萬～30萬"]}, "3-1-44": {"law": "【消費者保護法 第45-3條】\n當事人對於前條所定之方案，得於送達後十日之不變期間內，提出異議。", "note": "不服調解方案，最遲收到後10天內提異議。", "opts": ["7日改10日", "", "15日改10日", "20日改10日"]}, "3-1-45": {"law": "【消費者保護法 第12條】\n定型化契約中之條款有下列情形之一者，推定其顯失公平：\n三、契約之主要權利或義務，因受條款之限制，致契約之目的難以達成者。", "note": "推定「太不公平」的三種：違反平等互惠、跟任意規定的目的明顯衝突、權利義務被限制到「契約目的難以達成」。D寫成「可以達成」，是反的。", "full": "【消費者保護法 第12條】\n定型化契約中之條款有下列情形之一者，推定其顯失公平：\n一、違反平等互惠原則者。\n二、條款與其所排除不予適用之任意規定之立法意旨顯相矛盾者。\n三、契約之主要權利或義務，因受條款之限制，致契約之目的難以達成者。", "opts": ["這是推定顯失公平的情形", "這是推定顯失公平的情形", "這是推定顯失公平的情形", ""]}, "3-1-46": {"law": "【租賃住宅市場發展及管理條例 第5條】\n包租業與出租人間之住宅包租契約，其應約定及不得約定事項，由中央主管機關定之。\n\n【消費者保護法 第17條】\n中央主管機關為預防消費糾紛，保護消費者權益，促進定型化契約之公平化，得選擇特定行業，擬訂其定型化契約應記載或不得記載事項，報請行政院核定後公告之。", "note": "內政部依消保法公告的有三份：住宅租賃、住宅轉租、委託管理。「包租契約」是依租賃條例，叫「應約定／不得約定」，不是消保法那套。", "full": "【消費者保護法 第17條】\n中央主管機關為預防消費糾紛，保護消費者權益，促進定型化契約之公平化，得選擇特定行業，擬訂其定型化契約應記載或不得記載事項，報請行政院核定後公告之。\n\n【租賃住宅市場發展及管理條例 第5條】\n包租業與出租人間之住宅包租契約，其應約定及不得約定事項，由中央主管機關定之。", "opts": ["住宅轉租是消保法公告的", "委託管理是消保法公告的", "住宅租賃是消保法公告的", ""]}, "3-1-47": {"law": "【消費者保護法 第43條】\n企業經營者對於消費者之申訴，應於申訴之日起十五日內妥適處理之。", "note": "消費者申訴，15天內要處理。", "opts": ["3個月改15日", "30日改15日", "", "20日改15日"]}, "3-1-48": {"law": "【消費者保護法 第11-1條】\n違反第一項規定者，其條款不構成契約之內容。但消費者得主張該條款仍構成契約之內容。", "note": "錯的是C：違反審閱期，條款是「不算數」（消費者可主張算數），不是無效。拋棄審閱期的條款才是無效。", "full": "【消費者保護法 第11-1條】\n企業經營者與消費者訂立定型化契約前，應有三十日以內之合理期間，供消費者審閱全部條款內容。\n企業經營者以定型化契約條款使消費者拋棄前項權利者，無效。\n違反第一項規定者，其條款不構成契約之內容。但消費者得主張該條款仍構成契約之內容。\n中央主管機關得選擇特定行業，參酌定型化契約條款之重要性、涉及事項之多寡及複雜程度等事項，公告定型化契約之審閱期間。", "opts": ["正確，是30日以內", "正確，拋棄審閱權無效", "", "正確，主管機關可公告審閱期間"]}, "3-1-49": {"law": "【消費者保護法 第15條】\n定型化契約中之定型化契約條款牴觸個別磋商條款之約定者，其牴觸部分無效。", "note": "定型化條款跟雙方特別談的打架，定型化那條無效。", "opts": ["不是效力未定", "", "牴觸的部分不算契約內容", "無效不是「不得撤銷」"]}, "3-1-50": {"law": "【消費者保護法 第11條】\n定型化契約條款如有疑義時，應為有利於消費者之解釋。\n\n【消費者保護法 第12條】\n定型化契約中之條款違反誠信原則，對消費者顯失公平者，無效。", "note": "基本原則：平等互惠、有疑義有利消費者、賠償責任不得預先限制免除。「價格合理保證」不是。", "full": "【消費者保護法 第11條】\n企業經營者在定型化契約中所用之條款，應本平等互惠之原則。\n定型化契約條款如有疑義時，應為有利於消費者之解釋。\n\n【消費者保護法 第12條】\n定型化契約中之條款違反誠信原則，對消費者顯失公平者，無效。", "opts": ["是基本原則", "是基本原則", "", "是基本原則"]}, "3-1-51": {"law": "【消費者保護法 第15條】\n定型化契約中之定型化契約條款牴觸個別磋商條款之約定者，其牴觸部分無效。", "note": "牴觸的是「那一部分」無效。題庫選B，考試記題庫答案。", "flag": "條文第 15 條寫「其牴觸部分無效」；題庫選 B（定型化契約條款無效），與 3-1-49 的措辭不同。考試記題庫答案。", "opts": ["無效的是定型化條款，不是個別磋商條款", "", "題庫選B（條文是牴觸部分無效）", "不能有效，牴觸就無效"]}, "3-1-52": {"law": "【消費者保護法 第43條】\n企業經營者對於消費者之申訴，應於申訴之日起十五日內妥適處理之。", "note": "申訴處理期限15天。", "opts": ["7日改15日", "10日改15日", "", "20日改15日"]}, "3-1-53": {"law": "【消費者保護法 第6條】\n本法所稱主管機關：在中央為目的事業主管機關；在直轄市為直轄市政府；在縣（市）為縣（市）政府。", "note": "消保法的主管機關：中央是目的事業主管機關，直轄市是市政府，縣市是縣市政府。所以選臺中市政府。", "opts": ["行政院消保會不是縣市主管機關", "", "調解委員會不是主管機關", "服務中心不是主管機關"]}, "3-1-54": {"law": "【消費者保護法 第59條】\n企業經營者有第三十七條規定之情形者，主管機關除依該條及第三十六條之規定處置外，並得對其處新臺幣十五萬元以上一百五十萬元以下罰鍰。", "note": "情況重大、已發生重大損害（或可能發生）而危急：除原處置外，再罰15萬～150萬。", "opts": ["這是命令改善的情形，違反才罰6萬～150萬", "", "擋調查是3萬～30萬", "擋調查是3萬～30萬"]}, "3-1-55": {"law": "【消費者保護法 第58條】\n企業經營者違反主管機關依第三十六條或第三十八條規定所為之命令者，處新臺幣六萬元以上一百五十萬元以下罰鍰，並得按次處罰。\n\n【消費者保護法 第59條】\n企業經營者有第三十七條規定之情形者，主管機關除依該條及第三十六條之規定處置外，並得對其處新臺幣十五萬元以上一百五十萬元以下罰鍰。", "note": "罰最多的是B：15萬～150萬（下限最高）。A是違反命令6萬～150萬，C、D是3萬～30萬。", "full": "【消費者保護法 第59條】\n企業經營者有第三十七條規定之情形者，主管機關除依該條及第三十六條之規定處置外，並得對其處新臺幣十五萬元以上一百五十萬元以下罰鍰。\n\n【消費者保護法 第58條】\n企業經營者違反主管機關依第三十六條或第三十八條規定所為之命令者，處新臺幣六萬元以上一百五十萬元以下罰鍰，並得按次處罰。\n\n【消費者保護法 第57條】\n企業經營者規避、妨礙或拒絕主管機關依第十七條第六項、第三十三條或第三十八條規定所為之調查者，處新臺幣三萬元以上三十萬元以下罰鍰，並得按次處罰。", "opts": ["違反命令是6萬～150萬，下限較低", "", "3萬～30萬", "3萬～30萬"]}, "3-1-56": {"law": "【消費者保護法 第36條】\n直轄市或縣（市）政府對於企業經營者提供之商品或服務，經第三十三條之調查，認為確有損害消費者生命、身體、健康或財產，或確有損害之虞者，應命其限期改善、回收或銷燬，必要時並得命企業經營者立即停止該商品之設計、生產、製造、加工、輸入、經銷或服務之提供，或採取其他必要措施。\n\n【消費者保護法 第58條】\n企業經營者違反主管機關依第三十六條或第三十八條規定所為之命令者，處新臺幣六萬元以上一百五十萬元以下罰鍰，並得按次處罰。", "note": "6萬～150萬是「不聽縣市政府命令」（第58條）。A就是縣市政府會下命令的情形。", "opts": ["", "是15萬～150萬", "是3萬～30萬", "是5萬～50萬"]}, "3-1-57": {"law": "【消費者保護法 第57條】\n企業經營者規避、妨礙或拒絕主管機關依第十七條第六項、第三十三條或第三十八條規定所為之調查者，處新臺幣三萬元以上三十萬元以下罰鍰，並得按次處罰。", "note": "擋主管機關調查（第17、33、38條）：3萬～30萬，可按次罰。", "opts": ["是6萬～150萬（違反命令）", "是15萬～150萬", "", "是5萬～50萬"]}, "3-1-58": {"law": "【消費者保護法 第56-1條】\n企業經營者使用定型化契約，違反中央主管機關依第十七條第一項公告之應記載或不得記載事項者，除法律另有處罰規定外，經主管機關令其限期改正而屆期不改正者，處新臺幣三萬元以上三十萬元以下罰鍰；…", "note": "違反公告的應記載／不得記載事項：先令改，逾期不改3萬～30萬；再令改還不改，5萬～50萬。題目問的是第二次。", "full": "【消費者保護法 第56-1條】\n企業經營者使用定型化契約，違反中央主管機關依第十七條第一項公告之應記載或不得記載事項者，除法律另有處罰規定外，經主管機關令其限期改正而屆期不改正者，處新臺幣三萬元以上三十萬元以下罰鍰；經再次令其限期改正而屆期不改正者，處新臺幣五萬元以上五十萬元以下罰鍰，並得按次處罰。", "opts": ["是6萬～150萬", "是15萬～150萬", "是3萬～30萬", ""]}, "3-1-59": {"law": "【消費者保護法 第24條】\n輸入之商品或服務，應附中文標示及說明書，其內容不得較原產地之標示及說明書簡略。\n\n【消費者保護法 第56條】\n違反第二十四條、第二十五條或第二十六條規定之一者，經主管機關通知改正而逾期不改正者，處新臺幣二萬元以上二十萬元以下罰鍰。", "note": "進口商品的中文標示和說明書不能比原產地簡略，違反通知改正還不改：2萬～20萬。", "full": "【消費者保護法 第24條】\n企業經營者應依商品標示法等法令為商品或服務之標示。\n輸入之商品或服務，應附中文標示及說明書，其內容不得較原產地之標示及說明書簡略。\n\n【消費者保護法 第56條】\n違反第二十四條、第二十五條或第二十六條規定之一者，經主管機關通知改正而逾期不改正者，處新臺幣二萬元以上二十萬元以下罰鍰。", "opts": ["是6萬～150萬", "是15萬～150萬", "", "是5萬～50萬"]}, "3-1-60": {"law": "【消費者保護法 第52條】\n消費者保護團體以自己之名義提起第五十條訴訟，其標的價額超過新臺幣六十萬元者，超過部分免繳裁判費。\n\n【消費者保護法 第53條】\n消費者保護官或消費者保護團體，就企業經營者重大違反本法有關保護消費者規定之行為，得向法院訴請停止或禁止之。", "note": "消保團體打第50條官司，標的60萬「以下」要繳裁判費，超過部分才免。第53條不作為訴訟免繳。", "full": "【消費者保護法 第52條】\n消費者保護團體以自己之名義提起第五十條訴訟，其標的價額超過新臺幣六十萬元者，超過部分免繳裁判費。\n\n【消費者保護法 第53條】\n消費者保護官或消費者保護團體，就企業經營者重大違反本法有關保護消費者規定之行為，得向法院訴請停止或禁止之。\n前項訴訟免繳裁判費。", "opts": ["", "超過60萬的部分免繳", "消保官的不作為訴訟免繳", "消保團體的不作為訴訟免繳"]}, "3-1-61": {"law": "【消費者保護法 第51條】\n依本法所提之訴訟，因企業經營者之故意所致之損害，消費者得請求損害額五倍以下之懲罰性賠償金；但因重大過失所致之損害，得請求三倍以下之懲罰性賠償金，因過失所致之損害，得請求損害額一倍以下之懲罰性賠償金。", "note": "口訣：故意5倍、重大過失3倍、過失1倍。B寫成重大過失5倍，是錯的。", "opts": ["正確，故意5倍", "", "正確，重大過失3倍", "正確，過失1倍"]}, "3-1-62": {"law": "【消費者保護法 第51條】\n依本法所提之訴訟，因企業經營者之故意所致之損害，消費者得請求損害額五倍以下之懲罰性賠償金；但因重大過失所致之損害，得請求三倍以下之懲罰性賠償金，因過失所致之損害，得請求損害額一倍以下之懲罰性賠償金。", "note": "一般過失：損害額1倍以下。", "opts": ["5倍是故意", "3倍是重大過失", "沒有2倍", ""]}, "3-1-63": {"law": "【消費者保護法 第51條】\n依本法所提之訴訟，因企業經營者之故意所致之損害，消費者得請求損害額五倍以下之懲罰性賠償金；但因重大過失所致之損害，得請求三倍以下之懲罰性賠償金，因過失所致之損害，得請求損害額一倍以下之懲罰性賠償金。", "note": "重大過失：3倍以下。", "opts": ["故意是5倍，不是3倍", "重大過失是3倍，不是5倍", "", "過失是1倍，不是2倍"]}, "3-1-64": {"law": "【消費者保護法 第28條】\n消費者保護團體之任務如下：\n七、接受消費者申訴，調解消費爭議。\n\n【消費者保護法 第41條】\n行政院為推動消費者保護事務，辦理下列事項：\n四、國內外消費者保護趨勢及其與經濟社會建設有關問題之研究。", "note": "「接受申訴、調解消費爭議」是消保團體的事（第28條）。B、C、D是行政院的事（第41條）。", "full": "【消費者保護法 第28條】\n消費者保護團體之任務如下：\n七、接受消費者申訴，調解消費爭議。\n\n【消費者保護法 第41條】\n行政院為推動消費者保護事務，辦理下列事項：\n二、消費者保護計畫之研擬、修訂及執行成果檢討。\n三、消費者保護方案之審議及其執行之推動、連繫與考核。\n四、國內外消費者保護趨勢及其與經濟社會建設有關問題之研究。", "opts": ["", "這是行政院的工作", "這是行政院的工作", "這是行政院的工作"]}, "3-1-65": {"law": "【消費者保護法 第28條】\n消費者保護團體之任務如下：\n一、商品或服務價格之調查、比較、研究、發表。", "note": "價格的調查、比較、研究、發表：消保團體。", "opts": ["", "消保官不負責", "縣市政府不負責", "價格調查是團體任務，不是行政院"]}, "3-1-66": {"law": "【消費者保護法 第41條】\n消費者保護之執行結果及有關資料，由行政院定期公告。", "note": "定期公告消費者保護執行結果：行政院。", "full": "【消費者保護法 第41條】\n行政院為推動消費者保護事務，辦理下列事項：\n消費者保護之執行結果及有關資料，由行政院定期公告。", "opts": ["", "團體不公告執行結果", "消保官不公告", "縣市政府不公告"]}, "3-1-67": {"law": "【消費者保護法 第28條】\n消費者保護團體之任務如下：\n四、消費資訊之諮詢、介紹與報導。", "note": "消費資訊的諮詢、介紹與報導：消保團體。", "opts": ["", "消保官不負責", "縣市政府不負責", "消費資訊諮詢是團體任務"]}, "3-1-68": {"law": "【消費者保護法 第41條】\n行政院為推動消費者保護事務，辦理下列事項：\n五、消費者保護之教育宣導、消費資訊之蒐集及提供。", "note": "消費者保護的教育宣導、資訊蒐集與提供：行政院。小心別跟團體的「諮詢介紹報導」搞混。", "opts": ["縣市政府不是這項任務", "", "消保官不是這項", "團體的是「諮詢介紹報導」，教育宣導是行政院"]}, "3-1-69": {"law": "【消費者保護法 第28條】\n消費者保護團體之任務如下：\n五、消費者保護刊物之編印發行。", "note": "消保刊物的編印發行：消保團體。", "opts": ["", "消保官不負責", "企業不負責", "產業公會不負責"]}, "3-1-70": {"law": "【消費者保護法 第41條】\n行政院為推動消費者保護事務，辦理下列事項：\n四、國內外消費者保護趨勢及其與經濟社會建設有關問題之研究。", "note": "國內外消費者保護趨勢的研究：行政院。", "opts": ["縣市政府不是這項", "團體不是這項", "", "產業公會不是這項"]}, "3-1-71": {"law": "【消費者保護法 第28條】\n消費者保護團體之任務如下：\n六、消費者意見之調查、分析、歸納。", "note": "消費者意見的調查、分析、歸納：消保團體。", "opts": ["", "消保官不是這項", "產業公會不是這項", "目的事業主管機關不是這項"]}, "3-1-72": {"law": "【消費者保護法 第7-1條】\n企業經營者主張其商品於流通進入市場，或其服務於提供時，符合當時科技或專業水準可合理期待之安全性者，就其主張之事實負舉證責任。", "note": "企業主張自己的服務符合安全，要自己舉證，不是別人幫他證明。", "opts": ["企業自己舉證，不是學術機構", "", "不是主管機關舉證", "不是消保官舉證"]}, "3-1-73": {"law": "【消費者保護法 第28條】\n消費者保護團體之任務如下：\n九、建議政府採取適當之消費者保護立法或行政措施。", "note": "建議政府採取消費者保護立法或行政措施：消保團體。", "opts": ["", "這是團體的任務", "產業公會不是", "目的事業主管機關不是"]}, "3-1-74": {"law": "【消費者保護法 第7條】\n商品或服務具有危害消費者生命、身體、健康、財產之可能者，應於明顯處為警告標示及緊急處理危險之方法。", "note": "商品或服務可能危害人：要在明顯處警告，並寫上緊急處理方法。", "opts": ["", "條文沒要求投保意外險", "不用成立基金", "不能簽免責切結書"]}, "3-1-75": {"law": "【消費者保護法 第7條】\n從事設計、生產、製造商品或提供服務之企業經營者，於提供商品流通進入市場，或提供服務時，應確保該商品或服務，符合當時科技或專業水準可合理期待之安全性。", "note": "要確保商品或服務「符合當時科技或專業水準可合理期待的安全性」。", "opts": ["", "不是大眾通常認定", "不是價值感", "不是最新科技標準"]}, "4-1-01": {"law": "【公寓大廈管理條例 第3條】\n本條例用辭定義如下：\n三、專有部分：指公寓大廈之一部分，具有使用上之獨立性，且為區分所有之標的者。", "note": "專有部分＝能獨立使用、又是區分所有的標的。重點字是「使用上」獨立。", "opts": ["不是管理上的獨立", "不是維護上的獨立", "", "不是外觀上的獨立"]}, "4-1-02": {"law": "【公寓大廈管理條例 第3條】\n本條例用辭定義如下：\n八、住戶：指公寓大廈之區分所有權人、承租人或其他經區分所有權人同意而為專有部分之使用者或業經取得停車空間建築物所有權者。", "note": "「住戶」包含：區分所有權人、承租人、其他經同意使用的人、取得停車位所有權的人。", "opts": ["", "承辦人不是住戶", "沒有合法占有權的不算住戶", "是「取得停車位所有權的人」，不是承租人"]}, "4-1-03": {"law": "【公寓大廈管理條例 第6條】\n住戶應遵守下列事項：\n四、於維護、修繕專有部分、約定專用部分或設置管線，必須使用共用部分時，應經管理負責人或管理委員會之同意後為之。", "note": "維修自家要走過共用部分，要經「管理負責人或管委會」同意。管理服務人只是員工，不能決定。", "opts": ["管理服務人只是受僱人，不能決定", "專業技師無權同意", "沒有「維護修繕負責人」這種角色", ""]}, "4-1-04": {"law": "【公寓大廈管理條例 第8條】\n公寓大廈周圍上下、外牆面、樓頂平臺及不屬專有部分之防空避難設備，其變更構造、顏色、設置廣告物、鐵鋁窗或其他類似之行為，除應依法令規定辦理外，該公寓大廈規約另有規定或區分所有權人會議已有決議，經向直轄市、縣（市）主管機關完成報備有案者，應受該規約或區分所有權人會議決議之限制。", "note": "外牆掛招牌：要符合「規約或區權會決議」，還要向縣市政府報備。只報給管委會不夠。", "opts": ["", "只報備給主委不夠", "只報備給管委會不夠", "報給管委會或負責人都不夠，要報縣市主管機關"]}, "4-1-05": {"law": "【公寓大廈管理條例 第12條】\n專有部分之共同壁及樓地板或其內之管線，其維修費用由該共同壁雙方或樓地板上下方之區分所有權人共同負擔。但修繕費係因可歸責於區分所有權人之事由所致者，由該區分所有權人負擔。", "note": "兩戶之間的共同壁、樓板及裡面的管線，修理費由「共同壁雙方／樓上樓下」一起出。是誰弄壞的，就由誰出。", "opts": ["不用管委會協議認定", "", "不是只有需要維修的人出", "不是用公共基金支付"]}, "4-1-06": {"law": "【公寓大廈管理條例 第17條】\n住戶於公寓大廈內依法經營餐飲、瓦斯、電焊或其他危險營業或存放有爆炸性或易燃性物品者，應依中央主管機關所定保險金額投保公共意外責任保險。…", "note": "餐飲、瓦斯、電焊這類危險營業，要投保「公共意外責任保險」。日式料理是餐飲。", "full": "【公寓大廈管理條例 第17條】\n住戶於公寓大廈內依法經營餐飲、瓦斯、電焊或其他危險營業或存放有爆炸性或易燃性物品者，應依中央主管機關所定保險金額投保公共意外責任保險。其因此增加其他住戶投保火災保險之保險費者，並應就其差額負補償責任。其投保、補償辦法及保險費率由中央主管機關會同財政部定之。", "opts": ["寢具用品不是危險營業", "鐘錶眼鏡不是", "服飾用品不是", ""]}, "4-1-07": {"law": "【公寓大廈管理條例 第25條】\n有下列情形之一者，應召開臨時會議：\n二、經區分所有權人五分之一以上及其區分所有權比例合計五分之一以上，以書面載明召集之目的及理由請求召集者。", "note": "要開臨時會，需要1/5以上的區分所有權人（人數和比例都要），並用書面寫清楚目的與理由。", "full": "【公寓大廈管理條例 第25條】\n有下列情形之一者，應召開臨時會議：\n一、發生重大事故有及時處理之必要，經管理負責人或管理委員會請求者。\n二、經區分所有權人五分之一以上及其區分所有權比例合計五分之一以上，以書面載明召集之目的及理由請求召集者。", "opts": ["不用全體請求", "", "不是提理由就能開，要1/5以上", "不是依必要性判斷"]}, "4-1-08": {"law": "【公寓大廈管理條例 第27條】\n區分所有權人因故無法出席區分所有權人會議時，得以書面委託配偶、有行為能力之直系血親、其他區分所有權人或承租人代理出席；…", "note": "可以書面委託的人：配偶、有行為能力的直系血親、其他區分所有權人、承租人。「代管業者」不在內。", "full": "【公寓大廈管理條例 第27條】\n區分所有權人因故無法出席區分所有權人會議時，得以書面委託配偶、有行為能力之直系血親、其他區分所有權人或承租人代理出席；受託人於受託之區分所有權占全部區分所有權五分之一以上者，或以單一區分所有權計算之人數超過區分所有權人數五分之一者，其超過部分不予計算。", "opts": ["配偶可代理", "", "承租人可代理", "包租業是承租人，可代理"]}, "4-1-09": {"law": "【公寓大廈管理條例 第31條】\n區分所有權人會議之決議，除規約另有規定外，應有區分所有權人三分之二以上及其區分所有權比例合計三分之二以上出席，以出席人數四分之三以上及其區分所有權比例占出席人數區分所有權四分之三以上之同意行之。", "note": "決議口訣：出席要2/3、同意要3/4。出席小、同意大。", "opts": ["同意要3/4，不是2/3", "出席要2/3，不是3/4", "", "順序反了，出席2/3、同意3/4"]}, "4-1-10": {"law": "【公寓大廈管理條例 第29條】\n…但區分所有權人會議或規約未規定者，任期一年，主任委員、管理負責人、負責財務管理及監察業務之管理委員，連選得連任一次，其餘管理委員，連選得連任。", "note": "主任委員、管理負責人、財務與監察委員：最多連任1次。其他委員可以一直連任。任期1～2年。", "full": "【公寓大廈管理條例 第29條】\n管理委員、主任委員及管理負責人之任期，依區分所有權人會議或規約之規定，任期一至二年，主任委員、管理負責人、負責財務管理及監察業務之管理委員，連選得連任一次，其餘管理委員，連選得連任。但區分所有權人會議或規約未規定者，任期一年，主任委員、管理負責人、負責財務管理及監察業務之管理委員，連選得連任一次，其餘管理委員，連選得連任。", "opts": ["任期是1～2年，不是3年", "任期可以是1年或2年，重點是連任", "不是無限連任，只能1次", ""]}, "4-1-11": {"law": "【公寓大廈管理條例 第33條】\n區分所有權人會議之決議，未經依下列各款事項辦理者，不生效力：\n二、公寓大廈外牆面、樓頂平臺，設置廣告物、無線電台基地台等類似強波發射設備或其他類似之行為，設置於屋頂者，應經頂層區分所有權人同意；設置其他樓層者，應經該樓層區分所有權人同意。該層住戶，並得參加區分所有權人會議陳述意見。", "note": "屋頂平台掛廣告：要經「頂層區分所有權人」同意。", "opts": ["", "是頂層「區分所有權人」，不是住戶", "不是只要管委會同意", "不是管理負責人同意"]}, "4-1-12": {"law": "【公寓大廈管理條例 第33條】\n區分所有權人會議之決議，未經依下列各款事項辦理者，不生效力：\n二、公寓大廈外牆面、樓頂平臺，設置廣告物、無線電台基地台等類似強波發射設備或其他類似之行為，設置於屋頂者，應經頂層區分所有權人同意；設置其他樓層者，應經該樓層區分所有權人同意。該層住戶，並得參加區分所有權人會議陳述意見。", "note": "外牆（三樓）掛廣告：要經「該樓層區分所有權人」同意。", "opts": ["", "是區分所有權人，不是住戶", "不是管委會同意", "不是管理負責人同意"]}, "4-1-13": {"law": "【公寓大廈管理條例 第34條】\n區分所有權人會議應作成會議紀錄，載明開會經過及決議事項，由主席簽名，於會後十五日內送達各區分所有權人並公告之。", "note": "區權會議紀錄：「主席」簽名，會後15天內送給大家並公告。", "opts": ["是主席簽，不是主委；也是15日", "是15天，不是20天", "是主席簽，不是主委", ""]}, "4-1-14": {"law": "【公寓大廈管理條例 第36條】\n管理委員會之職務如下：\n九、管理服務人之委任、僱傭及監督。", "note": "管委會職務有一項是「管理服務人的委任、僱傭和監督」。", "opts": ["私有部分維修不是管委會職務", "是「建議」，不是權利", "共用部分是清潔維護修繕及一般改良，不是經營增收", ""]}, "4-1-15": {"law": "【公寓大廈管理條例 第39條】\n管理委員會應向區分所有權人會議負責，並向其報告會務。", "note": "管委會要向「區分所有權人會議」負責，並報告會務。", "opts": ["不是向主委負責", "不是向主管機關", "是向區權會負責", ""]}, "4-1-16": {"law": "【公寓大廈管理條例 第43條】\n公寓大廈管理維護公司，應依下列規定執行業務：\n三、應依業務執行規範執行業務。", "note": "管理維護公司要「依業務執行規範」做事。認可證是中央發的，不是地方。", "full": "【公寓大廈管理條例 第43條】\n公寓大廈管理維護公司，應依下列規定執行業務：\n一、應依規定類別，聘僱一定人數領有中央主管機關核發認可證之繼續性從業之管理服務人員，並負監督考核之責。\n二、應指派前款之管理服務人員辦理管理維護事務。\n三、應依業務執行規範執行業務。", "opts": ["認可證是中央主管機關發的，不是地方", "是監督考核，不含處分", "是辦理管理維護，不是包租代管", ""]}, "4-1-17": {"law": "【公寓大廈管理條例 第44條】\n受僱於公寓大廈管理維護公司之管理服務人員，應依下列規定執行業…\n四、應參加中央主管機關舉辦或委託之相關機構、團體辦理之訓練。", "note": "管理服務人員：不能把認可證借人、不能同時受聘2家以上、要參加中央辦的訓練。", "full": "【公寓大廈管理條例 第44條】\n受僱於公寓大廈管理維護公司之管理服務人員，應依下列規定執行業務：\n一、應依核准業務類別、項目執行管理維護事務。\n二、不得將管理服務人員認可證提供他人使用或使用他人之認可證執業。\n三、不得同時受聘於二家以上之管理維護公司。\n四、應參加中央主管機關舉辦或委託之相關機構、團體辦理之訓練。", "opts": ["不得借他人使用", "不得同時受聘2家以上", "", "要依核准業務類別執行，不能擴大"]}, "4-1-18": {"law": "【公寓大廈管理條例 第47條】\n有下列行為之一者，由直轄市、縣（市）主管機關處新臺幣三千元以…\n三、區分所有權人或住戶違反第六條規定，主管機關受理住戶、管理負責人或管理委員會之請求，經通知限期改善，屆期不改善者。", "note": "違反第6條住戶應遵守事項，通知改善仍不改：罰3,000～15,000元。", "full": "【公寓大廈管理條例 第47條】\n有下列行為之一者，由直轄市、縣（市）主管機關處新臺幣三千元以上一萬五千元以下罰鍰，並得令其限期改善或履行義務、職務；屆期不改善或不履行者，得連續處罰：\n三、區分所有權人或住戶違反第六條規定，主管機關受理住戶、管理負責人或管理委員會之請求，經通知限期改善，屆期不改善者。", "opts": ["1,000～5,000是第48條的罰款", "沒有這個級距", "沒有這個級距", ""]}, "4-1-19": {"law": "【公寓大廈管理條例 第49條】\n有下列行為之一者，由直轄市、縣（市）主管機關處新臺幣四萬元以上二十萬元以下罰鍰，並得令其限期改善或履行義務；屆期不改善或不履行者，得連續處罰：", "note": "私設路障、堆雜物、妨礙出入（違反第16條第2項）：罰4萬～20萬。", "full": "【公寓大廈管理條例 第49條】\n有下列行為之一者，由直轄市、縣（市）主管機關處新臺幣四萬元以上二十萬元以下罰鍰，並得令其限期改善或履行義務；屆期不改善或不履行者，得連續處罰：\n四、住戶違反第十六條第二項或第三項規定者。", "opts": ["沒有3萬～30萬這一檔", "", "沒有20萬～50萬這一檔", "50萬～250萬是罰金"]}, "4-1-20": {"law": "【公寓大廈管理條例 第49條】\n有供營業使用事實之住戶有前項第三款或第四款行為，因而致人於死者，處一年以上七年以下有期徒刑，得併科新臺幣一百萬元以上五百萬元以下罰金；致重傷者，處六個月以上五年以下有期徒刑，得併科新臺幣五十萬元以上二百五十萬元以下罰金。", "note": "有營業事實的住戶違規，致人重傷：6個月～5年；致人於死：1年～7年。", "opts": ["沒有這個刑度", "", "沒有這個刑度", "1年～7年是致死的刑度"]}, "4-1-21": {"law": "【公寓大廈管理條例 第8條】\n公寓大廈有十二歲以下兒童或六十五歲以上老人之住戶，外牆開口部或陽臺得設置不妨礙逃生且不突出外牆面之防墜設施。防墜設施設置後，設置理由消失且不符前項限制者，區分所有權人應予改善或回復原狀。", "note": "家裡有12歲以下小孩或65歲以上老人，可以加防墜設施（不妨礙逃生、不突出外牆），理由合乎規定。", "opts": ["有合規理由，不用制止", "有合規理由，不用制止", "", "這是條例規定，不是規約"]}, "4-1-22": {"law": "【公寓大廈管理條例 第59-1條】\n直轄市、縣（市）政府為處理有關公寓大廈爭議事件，得聘請資深之專家、學者及建築師、律師，並指定公寓大廈及建築管理主管人員，組設公寓大廈爭議事件調處委員會。", "note": "縣市政府可請資深專家、學者、建築師、律師，再加建管主管人員，組「爭議事件調處委員會」。", "opts": ["不是民意代表", "不是熱心人士", "不是管理公司主管", ""]}, "4-1-23": {"law": "【公寓大廈管理條例 第53條】\n多數各自獨立使用之建築物、公寓大廈，其共同設施之使用與管理具有整體不可分性之集居地區者，其管理及組織準用本條例之規定。\n\n【公寓大廈管理條例施行細則 第12條】\n本條例第五十三條所定其共同設施之使用與管理具有整體不可分性之…\n一、依建築法第十一條規定之一宗建築基地。", "note": "多棟獨立建築但共用設施（車道、中庭、保全室）的社區，管理與組織「準用公寓大廈管理條例」。", "full": "【公寓大廈管理條例 第53條】\n多數各自獨立使用之建築物、公寓大廈，其共同設施之使用與管理具有整體不可分性之集居地區者，其管理及組織準用本條例之規定。\n\n【公寓大廈管理條例施行細則 第12條】\n本條例第五十三條所定其共同設施之使用與管理具有整體不可分性之集居地區，指下列情形之一：\n一、依建築法第十一條規定之一宗建築基地。", "opts": ["", "是準用條例，不是準用規約", "條例第53條有規範", "不是準用會議規範"]}, "4-1-24": {"law": "【公寓大廈管理條例施行細則 第3條】\n本條例所定區分所有權人之人數，其計算方式如下：\n一、區分所有權已登記者，按其登記人數計算。但數人共有一專有部分者，以一人計。", "note": "幾個人共有一個專有部分，算「1人」。", "opts": ["不是每一專有部分算1人，是共有者共算1人", "", "共有者只算1人", "共有者只算1人"]}, "4-1-25": {"law": "【公寓大廈管理條例施行細則 第4條】\n本條例第七條第一款所稱公寓大廈本身所占之地面，指建築物外牆中心線或其代替柱中心線以內之最大水平投影範圍。", "note": "公寓大廈本身所占的地面＝外牆中心線以內的「最大水平投影範圍」。", "opts": ["漏了「投影」", "要「最大」水平投影範圍", "", "沒有「容許」兩字"]}, "4-1-26": {"law": "【公寓大廈管理條例 第22條】\n住戶有下列情形之一者，由管理負責人或管理委員會促請其改善，於三個月內仍未改善者，管理負責人或管理委員會得依區分所有權人會議之決議，訴請法院強制其遷離：", "note": "先促請改善，3個月內沒改，才能依決議告上法院強制遷離。拆分間牆屬違反法令或規約。", "full": "【公寓大廈管理條例 第22條】\n住戶有下列情形之一者，由管理負責人或管理委員會促請其改善，於三個月內仍未改善者，管理負責人或管理委員會得依區分所有權人會議之決議，訴請法院強制其遷離：\n一、積欠依本條例規定應分擔之費用，經強制執行後再度積欠金額達其區分所有權總價百分之一者。\n二、違反本條例規定經依第四十九條第一項第一款至第四款規定處以罰鍰後，仍不改善或續犯者。\n三、其他違反法令或規約情節重大者。", "opts": ["", "沒有3.5個月", "是3個月", "是3個月"]}, "4-1-27": {"law": "【公寓大廈管理條例 第49-1條】\n公寓大廈未依第二十九條之一第一項規定於期限內成立管理委員會或推選管理負責人並辦理報備者，由直轄市、縣（市）主管機關按每一專有部分處區分所有權人新臺幣四萬元以上二十萬元以下罰鍰，並令其限期辦理；屆期仍未辦理者，得按次處罰。", "note": "沒在期限內成立管委會或推負責人並報備：按「每一專有部分」罰區分所有權人4萬～20萬。", "opts": ["是按「專有部分」，不是約定專有部分", "", "不是按住戶", "不是按每一期"]}, "4-2-01": {"law": "【都市計畫法 第1條】\n為改善居民生活環境，並促進市、鎮、鄉街有計畫之均衡發展，特制定本法。", "note": "都市計畫法的目的：改善居民生活環境，促進市、鎮、鄉街有計畫的均衡發展。", "opts": ["公寓大廈管理條例管社區管理", "租賃條例管租賃", "", "非都規則管非都市土地"]}, "4-2-02": {"law": "【都市計畫法 第1條】\n為改善居民生活環境，並促進市、鎮、鄉街有計畫之均衡發展，特制定本法。", "note": "宗旨是「均衡發展」，不是「繁榮發展」。", "opts": ["不是不動產交易秩序", "不是產業升級", "", "是「均衡發展」，不是「繁榮發展」"]}, "4-2-03": {"law": "【都市計畫法 第7條】\n本法用語定義如左：\n一、主要計畫：係指依第十五條所定之主要計畫書及主要計畫圖，作為擬定細部計畫之準則。", "note": "主要計畫是擬定「細部計畫」的準則。", "full": "【都市計畫法 第7條】\n本法用語定義如左：\n一、主要計畫：係指依第十五條所定之主要計畫書及主要計畫圖，作為擬定細部計畫之準則。\n二、細部計畫：係指依第二十二條之規定所為之細部計畫書及細部計畫圖，作為實施都市計畫之依據。", "opts": ["主要計畫不是擬定市鎮計畫的準則", "不是鄉街計畫", "不是特定區計畫", ""]}, "4-2-04": {"law": "【都市計畫法 第7條】\n本法用語定義如左：\n三、都市計畫事業：係指依本法規定所舉辦之公共設施、新市區建設、舊市區更新等實質建設之事業。", "note": "蓋公共設施、新市區、舊市區更新這些實質建設的事業，叫「都市計畫事業」。", "opts": ["沒有「都市創新事業」", "", "沒有「都市發展事業」", "新市區建設只是其中一種"]}, "4-2-05": {"law": "【都市計畫法 第9條】\n都市計畫分為左列三種：\n三、特定區計畫。", "note": "都市計畫三種：市（鎮）計畫、鄉街計畫、特定區計畫。", "full": "【都市計畫法 第9條】\n都市計畫分為左列三種：\n一、市（鎮）計畫。\n二、鄉街計畫。\n三、特定區計畫。", "opts": ["沒有「特定事業計畫」", "", "沒有「更新區計畫」", "沒有「新市區計畫」"]}, "4-2-06": {"law": "【都市計畫法 第10條】\n下列各地方應擬定市（鎮）計畫：\n三、縣政府所在地及縣轄市。", "note": "縣政府所在地及縣轄市要擬市（鎮）計畫。鄉公所所在地是擬鄉街計畫。", "opts": ["鄉街及社區是鄉街計畫", "優先更新地區不是", "", "鄉公所所在地是鄉街計畫"]}, "4-2-07": {"law": "【都市計畫法 第15條】\n市鎮計畫應先擬定主要計畫書，並視其實際情形，就左列事項分別表…\n三、人口之成長、分布、組成、計畫年期內人口與經濟發展之推計。", "note": "市鎮計畫的主要計畫要寫「人口成長、分布、組成與推計」。", "full": "【都市計畫法 第15條】\n市鎮計畫應先擬定主要計畫書，並視其實際情形，就左列事項分別表明之：\n三、人口之成長、分布、組成、計畫年期內人口與經濟發展之推計。", "opts": ["不在條文所列", "是「行政區域及計畫地區範圍」才對", "", "不是主要計畫的表明事項"]}, "4-2-08": {"law": "【都市計畫法 第22條】\n細部計畫應以細部計畫書及細部計畫圖就左列事項表明之：\n三、土地使用分區管制。", "note": "細部計畫要寫「土地使用分區管制」。人口推計、產業結構是主要計畫的內容。", "opts": ["產業結構是主要計畫", "潛在移居人口不是", "重大專案開發不是", ""]}, "4-2-09": {"law": "【都市計畫法 第26條】\n都市計畫經發布實施後，不得隨時任意變更。但擬定計畫之機關每三年內或五年內至少應通盤檢討一次，依據發展情況，並參考人民建議作必要之變更。對於非必要之公共設施用地，應變更其使用。", "note": "都市計畫不能亂改，但每3年或5年要通盤檢討一次。", "opts": ["不是2年", "不是2~3年", "", "不是依人民建議"]}, "4-2-10": {"law": "【都市計畫法 第27條】\n都市計畫經發布實施後，遇有下列情事之一時，當地直轄市、縣（市…\n一、因戰爭、地震、水災、風災、火災或其他重大事變遭受損壞時。", "note": "該快速變更的：地震、水災、風災、火災等損壞、避免災害、國防或經濟發展需要、配合重大設施。「跨國公司來設廠」不在列。", "full": "【都市計畫法 第27條】\n都市計畫經發布實施後，遇有下列情事之一時，當地直轄市、縣（市）政府或鄉、鎮、縣轄市公所，應視實際情況迅行變更：\n一、因戰爭、地震、水災、風災、火災或其他重大事變遭受損壞時。\n二、為避免重大災害之發生時。\n三、為適應國防或經濟發展之需要時。\n四、為配合中央、直轄市或縣（市）興建之重大設施時。", "opts": ["地震是應迅行變更", "水災風災是應迅行變更", "火災是應迅行變更", ""]}, "4-2-11": {"law": "【都市計畫法 第34條】\n住宅區為保護居住環境而劃定，其土地及建築物之使用，不得有礙居住之寧靜、安全及衛生。", "note": "住宅區就是為了「保護居住環境」，不能妨礙居住的安寧、安全、衛生。", "opts": ["保護區是保留農業地區", "農業區是農用", "", "文教區是學校等"]}, "4-2-12": {"law": "【都市計畫法 第5條】\n都市計畫應依據現在及既往情況，並預計二十五年內之發展情形訂定之。", "note": "都市計畫要預估「25年」內的發展。", "opts": ["不是15年", "不是20年", "", "不是30年"]}, "4-2-13": {"law": "【都市計畫法 第7條】\n本法用語定義如左：\n四、優先發展區：係指預計在十年內必須優先規劃建設發展之都市計畫地區。", "note": "優先發展區：預計「10年」內必須優先規劃建設的地區。", "opts": ["不是3年", "不是5年", "", "不是15年"]}, "4-2-14": {"law": "【都市計畫法 第42條】\n都市計畫地區範圍內，應視實際情況，分別設置左列公共設施用地：\n二、學校、社教機構、社會福利設施、體育場所、市場、醫療衛生機構及機關用地。", "note": "公共設施用地有學校、社教機構、社福設施等。「社會住宅」不在條文列舉裡。", "full": "【都市計畫法 第42條】\n都市計畫地區範圍內，應視實際情況，分別設置左列公共設施用地：\n一、道路、公園、綠地、廣場、兒童遊樂場、民用航空站、停車場所、河道及港埠用地。\n二、學校、社教機構、社會福利設施、體育場所、市場、醫療衛生機構及機關用地。", "opts": ["學校是公共設施用地", "", "社教機構是公共設施用地", "社福設施是公共設施用地"]}, "4-2-15": {"law": "【都市計畫法 第42條】\n都市計畫地區範圍內，應視實際情況，分別設置左列公共設施用地：\n一、道路、公園、綠地、廣場、兒童遊樂場、民用航空站、停車場所、河道及港埠用地。", "note": "公共設施用地有公園、綠地、兒童遊樂場。「購物中心」不是。", "full": "【都市計畫法 第42條】\n都市計畫地區範圍內，應視實際情況，分別設置左列公共設施用地：\n一、道路、公園、綠地、廣場、兒童遊樂場、民用航空站、停車場所、河道及港埠用地。\n二、學校、社教機構、社會福利設施、體育場所、市場、醫療衛生機構及機關用地。", "opts": ["", "公園是公共設施用地", "綠地是公共設施用地", "兒童遊樂場是公共設施用地"]}, "4-2-16": {"law": "【都市計畫法 第64條】\n都市更新處理方式，分為下列三種：\n二、整建：強制區內建築物為改建、修建、維護或設備之充實，必要時，對部分指定之土地及建築物徵收、拆除及重建，改進區內公共設施。", "note": "都市更新三種做法：重建、整建、維護。", "full": "【都市計畫法 第64條】\n都市更新處理方式，分為下列三種：\n一、重建：係為全地區之徵收、拆除原有建築、重新建築、住戶安置，並得變更其土地使用性質或使用密度。\n二、整建：強制區內建築物為改建、修建、維護或設備之充實，必要時，對部分指定之土地及建築物徵收、拆除及重建，改進區內公共設施。\n三、維護：加強區內土地使用及建築管理，改進區內公共設施，以保持其良好狀況。", "opts": ["是「維護」，不是「修護」", "", "是「整建」，不是「增建」", "是「整建」，不是「修建」"]}, "4-2-17": {"law": "【都市計畫法 第48條】\n依本法指定之公共設施保留地供公用事業設施之用者，由各該事業機…\n二、區段徵收。", "note": "公共設施保留地的取得方式：徵收、區段徵收、市地重劃。", "full": "【都市計畫法 第48條】\n依本法指定之公共設施保留地供公用事業設施之用者，由各該事業機構依法予以徵收或購買；其餘由該管政府或鄉、鎮、縣轄市公所依左列方式取得之：\n一、徵收。\n二、區段徵收。\n三、市地重劃。", "opts": ["協議價購不是條文列舉方式", "聯合開發不是", "", "都市更新不是取得方式"]}, "4-2-18": {"law": "【都市計畫法 第18條】\n主要計畫擬定後，應先送由該管政府或鄉、鎮、縣轄市都市計畫委員會審議。其依第十三條、第十四條規定由內政部或縣（市）政府訂定或擬定之計畫，應先分別徵求有關縣（市）政府及鄉、鎮、縣轄市公所之意見，以供參考。", "note": "主要計畫要先送「都市計畫委員會」審議。", "opts": ["不是都市發展委員會", "", "不是區域發展委員會", "區域計畫委員會是區域計畫的"]}, "4-2-19": {"law": "【都市計畫法 第79條】\n都市計畫範圍內土地或建築物之使用，或從事建造、採取土石、變更地形，違反本法或內政部、直轄市、縣（市）政府依本法所發布之命令者，當地地方政府或鄉、鎮、縣轄市公所得處其土地或建築物所有權人、使用人或管理人新臺幣六萬元以上三十萬元以下罰鍰，並勒令拆除、改建、停止使用或恢復原狀。…", "note": "違法採土石、改地形：可以罰「所有人、使用人或管理人」。", "full": "【都市計畫法 第79條】\n都市計畫範圍內土地或建築物之使用，或從事建造、採取土石、變更地形，違反本法或內政部、直轄市、縣（市）政府依本法所發布之命令者，當地地方政府或鄉、鎮、縣轄市公所得處其土地或建築物所有權人、使用人或管理人新臺幣六萬元以上三十萬元以下罰鍰，並勒令拆除、改建、停止使用或恢復原狀。不拆除、改建、停止使用或恢復原狀者，得按次處罰，並停止供水、供電、封閉、強制拆除或採取其他恢復原狀之措施，其費用由土地或建築物所有權人、使用人或管理人負擔。", "opts": ["鄰地所有人與違規無關", "設備租用人不是處罰對象", "企業管理人不是處罰對象", ""]}, "4-2-20": {"law": "【都市計畫法 第79條】\n都市計畫範圍內土地或建築物之使用，或從事建造、採取土石、變更地形，違反本法或內政部、直轄市、縣（市）政府依本法所發布之命令者，當地地方政府或鄉、鎮、縣轄市公所得處其土地或建築物所有權人、使用人或管理人新臺幣六萬元以上三十萬元以下罰鍰，並勒令拆除、改建、停止使用或恢復原狀。…", "note": "違規使用、採土石等違反都計法：罰6萬～30萬。", "full": "【都市計畫法 第79條】\n都市計畫範圍內土地或建築物之使用，或從事建造、採取土石、變更地形，違反本法或內政部、直轄市、縣（市）政府依本法所發布之命令者，當地地方政府或鄉、鎮、縣轄市公所得處其土地或建築物所有權人、使用人或管理人新臺幣六萬元以上三十萬元以下罰鍰，並勒令拆除、改建、停止使用或恢復原狀。不拆除、改建、停止使用或恢復原狀者，得按次處罰，並停止供水、供電、封閉、強制拆除或採取其他恢復原狀之措施，其費用由土地或建築物所有權人、使用人或管理人負擔。", "opts": ["沒有2萬～10萬", "沒有3萬～10萬", "", "沒有6萬～50萬"]}, "4-2-21": {"law": "【非都市土地使用管制規則 第2條】\n非都市土地得劃定為特定農業、一般農業、工業、鄉村、森林、山坡地保育、風景、國家公園、河川、海域、特定專用等使用分區。", "note": "非都市土地的使用分區有：特定農業、一般農業、工業、鄉村、森林、山坡地保育、風景、國家公園、河川、海域、特定專用。所以選「風景區、國家公園區」。", "opts": ["城鄉發展區是國土計畫的分區", "工商綜合區不是分區", "", "國土保安區、特定事業區不是非都分區"]}, "4-2-22": {"law": "【非都市土地使用管制規則 第3條】\n非都市土地依其使用分區之性質，編定為甲種建築、乙種建築、丙種建築、丁種建築、農牧、林業、養殖、鹽業、礦業、窯業、交通、水利、遊憩、古蹟保存、生態保護、國土保安、殯葬、海域、特定目的事業等使用地。", "note": "用地類別有：甲乙丙丁種建築、農牧、林業、養殖、鹽業、礦業、窯業、交通、水利、遊憩、古蹟保存、生態保護、國土保安、殯葬、海域、特定目的事業。", "opts": ["沒有觀光工廠用地", "沒有光電廠用地", "", "國家公園是使用分區，不是用地類別"]}, "4-2-23": {"law": "【非都市土地使用管制規則 第9條】\n下列非都市土地建蔽率及容積率不得超過下列規定。但直轄市或縣（…\n三、丙種建築用地︰建蔽率百分之四十。容積率百分之一百二十。", "note": "建蔽率／容積率口訣：甲乙60/240、丙40/120、丁70/300。", "full": "【非都市土地使用管制規則 第9條】\n下列非都市土地建蔽率及容積率不得超過下列規定。但直轄市或縣（市）政府得視實際需要酌予調降，並報請中央主管機關備查︰\n三、丙種建築用地︰建蔽率百分之四十。容積率百分之一百二十。", "opts": ["", "容積率是120%，不是240%", "建蔽率是40%，不是60%", "甲乙種才是60/240"]}, "4-2-24": {"law": "【非都市土地使用管制規則 第30-2條】\n第三十條擬具之興辦事業計畫範圍內有夾雜第一級環境敏感地區之零…\n三、面積未超過基地開發面積之百分之十。", "note": "夾在計畫範圍內的第一級環境敏感零星土地，可納入的條件：整體開發需要、維持原分區（或改國土保安）、面積不超過基地10%、有管理維護措施。超過10%就不行。", "full": "【非都市土地使用管制規則 第30-2條】\n第三十條擬具之興辦事業計畫範圍內有夾雜第一級環境敏感地區之零星土地者，應符合下列各款情形，始得納入申請範圍：\n一、基於整體開發規劃之需要。\n二、夾雜地仍維持原使用分區及原使用地類別，或同意變更編定為國土保安用地。\n三、面積未超過基地開發面積之百分之十。\n四、擬定夾雜地之管理維護措施。", "opts": ["整體開發需要是納入條件", "維持或變更國土保安用地是條件", "", "維持原分區是條件"]}, "4-2-25": {"law": "【非都市土地使用管制規則 第30-2條】\n第三十條擬具之興辦事業計畫範圍內有夾雜第一級環境敏感地區之零…\n三、面積未超過基地開發面積之百分之十。", "note": "夾雜地面積不能超過基地開發面積的10%。", "full": "【非都市土地使用管制規則 第30-2條】\n第三十條擬具之興辦事業計畫範圍內有夾雜第一級環境敏感地區之零星土地者，應符合下列各款情形，始得納入申請範圍：\n三、面積未超過基地開發面積之百分之十。", "opts": ["不是20%", "不是15%", "", "不是12%"]}, "4-3-01": {"law": "【公寓大廈管理條例 第9條】\n各區分所有權人按其共有之應有部分比例，對建築物之共用部分及其基地有使用收益之權。但另有約定者從其約定。", "note": "共用部分劃機車位，要依「區分所有權人會議決議」。", "full": "【公寓大廈管理條例 第9條】\n各區分所有權人按其共有之應有部分比例，對建築物之共用部分及其基地有使用收益之權。但另有約定者從其約定。\n住戶對共用部分之使用應依其設置目的及通常使用方法為之。但另有約定者從其約定。\n前二項但書所約定事項，不得違反本條例、區域計畫法、都市計畫法及建築法令之規定。\n\n（內政部公告「公寓大廈規約範本」，不在全國法規資料庫，我沒有抓到原文）", "opts": ["", "不是依買賣契約", "不是依買賣契約及分管契約", "不是依管委會決議"]}, "4-3-02": {"law": "【公寓大廈管理條例 第11條】\n共用部分及其相關設施之拆除、重大修繕或改良，應依區分所有權人會議之決議為之。", "note": "共用部分重大修繕、改良：要經區權會決議。", "full": "【公寓大廈管理條例 第11條】\n共用部分及其相關設施之拆除、重大修繕或改良，應依區分所有權人會議之決議為之。\n\n（內政部公告「公寓大廈規約範本」，不在全國法規資料庫，我沒有抓到原文）", "opts": ["門禁維護是管委會事務", "", "機電維護是管委會事務", "安寧整潔是管委會事務"]}, "4-3-03": {"law": "【公寓大廈管理條例 第33條】\n區分所有權人會議之決議，未經依下列各款事項辦理者，不生效力：\n三、依第五十六條第一項規定成立之約定專用部分變更時，應經使用該約定專用部分之區分所有權人同意。但該約定專用顯已違反公共利益，經管理委員會或管理負責人訴請法院判決確定者，不在此限。", "note": "約定專用或約定共用的變更，要經區權會決議（還要用的人同意）。", "full": "【公寓大廈管理條例 第33條】\n區分所有權人會議之決議，未經依下列各款事項辦理者，不生效力：\n三、依第五十六條第一項規定成立之約定專用部分變更時，應經使用該約定專用部分之區分所有權人同意。但該約定專用顯已違反公共利益，經管理委員會或管理負責人訴請法院判決確定者，不在此限。\n\n（內政部公告「公寓大廈規約範本」，不在全國法規資料庫，我沒有抓到原文）", "opts": ["不是依管理負責人意見", "不是只看該區分所有權人", "", "不是依管委會決議"]}, "4-3-04": {"law": "（內政部公告「公寓大廈規約範本」，不在全國法規資料庫，我沒有抓到原文）", "note": "規約範本：管委會委員最多21人。", "flag": "這題依據的是內政部的規約範本，我沒有抓到原文，內容依題庫。", "opts": ["不是15人", "不是19人", "", "不是22人"]}, "4-3-05": {"law": "【公寓大廈管理條例 第36條】\n管理委員會之職務如下：\n八、規約、會議紀錄、使用執照謄本、竣工圖說、水電、消防、機械設施、管線圖說、會計憑證、會計帳簿、財務報表、公共安全檢查及消防安全設備檢修之申報文件、印鑑及有關文件之保管。", "note": "規約、會議紀錄、簽名簿、委託書：由「管委會」保管。", "opts": ["不是管理負責人保管", "不是管理公司保管", "", "不是主委個人保管"]}, "4-3-06": {"law": "【公寓大廈管理條例 第36條】\n管理委員會之職務如下：\n八、規約、會議紀錄、使用執照謄本、竣工圖說、水電、消防、機械設施、管線圖說、會計憑證、會計帳簿、財務報表、公共安全檢查及消防安全設備檢修之申報文件、印鑑及有關文件之保管。", "note": "使用執照謄本、竣工圖說、水電消防機械管線圖說：由「管委會」保管。", "opts": ["不是管理負責人保管", "不是管理公司保管", "", "不是主委個人保管"]}, "4-3-07": {"law": "【公寓大廈管理條例 第7條】\n公寓大廈共用部分不得獨立使用供做專有部分。其為下列各款者，並…\n二、連通數個專有部分之走廊或樓梯，及其通往室外之通路或門廳；社區內各巷道、防火巷弄。", "note": "不得約定專用：建築物所占地面、連通專有部分的走廊樓梯及通往外面的通路門廳、社區內巷道防火巷弄、承重結構等。題目說「有錯」的是D（條文寫的是「社區內」，不是「社區周邊」）。", "full": "【公寓大廈管理條例 第7條】\n公寓大廈共用部分不得獨立使用供做專有部分。其為下列各款者，並不得為約定專用部分：\n一、公寓大廈本身所占之地面。\n二、連通數個專有部分之走廊或樓梯，及其通往室外之通路或門廳；社區內各巷道、防火巷弄。\n三、公寓大廈基礎、主要樑柱、承重牆壁、樓地板及屋頂之構造。", "opts": ["建築物所占地面不得約定專用", "連通專有部分的走廊不得約定專用", "通往室外的通路門廳不得約定專用", ""]}, "4-3-08": {"law": "【公寓大廈管理條例 第56條】\n前項規約草約經承受人簽署同意後，於區分所有權人會議訂定規約前，視為規約。", "note": "起造人在申請建照時附的規約草約：承受人簽名同意後，在區權會訂規約前，視為規約。", "full": "【公寓大廈管理條例 第56條】\n公寓大廈之起造人於申請建造執照時，應檢附專有部分、共用部分、約定專用部分、約定共用部分標示之詳細圖說及規約草約。於設計變更時亦同。\n前項規約草約經承受人簽署同意後，於區分所有權人會議訂定規約前，視為規約。", "opts": ["要承受人簽署同意才視為規約", "不是僅供參考", "", "不是核發執照時就視為規約"]}, "4-4-01": {"law": "（這題屬公寓大廈行政管理實務教材的內容，沒有對應法條原文）", "note": "行政事務的職能：事實記錄、集體意思表達、訊息傳遞與文件整備。「住戶創意發想」不是。", "opts": ["", "集體意思表達是職能", "事實記錄是職能", "訊息傳遞與文件整備是職能"]}, "4-4-02": {"law": "（這題屬公寓大廈行政管理實務教材的內容，沒有對應法條原文）", "note": "行政作業順序：觀念認知 → 處理程序 → 執行方法 → 應用技巧。由大到小。", "opts": ["順序反了", "", "順序不對", "處理程序後面是執行方法"]}, "4-4-03": {"law": "（這題屬公寓大廈行政管理實務教材的內容，沒有對應法條原文）", "note": "會議紀錄、違規存證、財務報表都是把事情記下來，屬於「事實記錄」。", "opts": ["文件整備是整理保存", "意思表達是表達意見", "", "訊息傳遞是通知"]}, "4-4-04": {"law": "（這題屬公寓大廈行政管理實務教材的內容，沒有對應法條原文）", "note": "法規條文分條寫，條下面是「項、款、目」。口訣：條→項→款→目。", "opts": ["", "順序反了", "順序反了", "順序反了"]}, "4-4-05": {"law": "（這題屬公寓大廈行政管理實務教材的內容，沒有對應法條原文）", "note": "區分所有權人名冊有姓名、地址、電話、專有部分面積、區分所有權比例等。「身分證字號」不在內（個資）。", "opts": ["", "姓名或名稱是欄位", "通訊地址是欄位", "專有部分面積是欄位"]}, "4-4-06": {"law": "（這題屬公寓大廈行政管理實務教材的內容，沒有對應法條原文）", "note": "「催告」要有證據，用「書面」。簡訊、口頭、通訊軟體都不夠正式。", "opts": ["簡訊不夠正式", "口頭沒證據", "", "通訊軟體不夠正式"]}, "4-4-07": {"law": "（這題屬公寓大廈行政管理實務教材的內容，沒有對應法條原文）", "note": "文件保管方式是裝訂、分置、存放。「閱覽」是使用，不是保管。", "opts": ["裝訂是保管方式", "分置是保管方式", "存放是保管方式", ""]}, "4-4-08": {"law": "【公寓大廈管理條例 第27條】\n區分所有權人會議之出席人數與表決權之計算，於任一區分所有權人之區分所有權占全部區分所有權五分之一以上者，或任一區分所有權人所有之專有部分之個數超過全部專有部分個數總合之五分之一以上者，其超過部分不予計算。\n\n【公寓大廈管理條例施行細則 第2條】\n同一區分所有權人有數專有部分者，前項區分所有權比例，應予累計。但於計算區分所有權人會議之比例時，應受本條例第二十七條第二項規定之限制。", "note": "一個人的票有上限：超過全部戶數1/5的部分不算。100戶的1/5＝20。甲自有25只算20；受託丁25也只算20，合計40。分母兩人都扣5：100−5−5＝90。", "full": "【公寓大廈管理條例 第27條】\n各專有部分之區分所有權人有一表決權。數人共有一專有部分者，該表決權應推由一人行使。\n區分所有權人會議之出席人數與表決權之計算，於任一區分所有權人之區分所有權占全部區分所有權五分之一以上者，或任一區分所有權人所有之專有部分之個數超過全部專有部分個數總合之五分之一以上者，其超過部分不予計算。\n區分所有權人因故無法出席區分所有權人會議時，得以書面委託配偶、有行為能力之直系血親、其他區分所有權人或承租人代理出席；受託人於受託之區分所有權占全部區分所有權五分之一以上者，或以單一區分所有權計算之人數超過區分所有權人數五分之一者，其超過部分不予計算。\n\n【公寓大廈管理條例施行細則 第2條】\n同一區分所有權人有數專有部分者，前項區分所有權比例，應予累計。但於計算區分所有權人會議之比例時，應受本條例第二十七條第二項規定之限制。", "opts": ["", "分母要扣掉超過部分，不是100", "甲的表決權是40，不是50", "甲40、分母90，不是50和100"]}, "4-4-09": {"law": "（這題屬公寓大廈行政管理實務教材的內容，沒有對應法條原文）", "note": "社區規約管的是共同事務，不能規定承租戶的「職業和性別」，那是歧視。", "opts": ["禁養動物是規約事項", "違反義務處理是規約事項", "財務監督是規約事項", ""]}, "4-4-10": {"law": "【公寓大廈管理條例 第7條】\n公寓大廈共用部分不得獨立使用供做專有部分。其為下列各款者，並…\n四、約定專用有違法令使用限制之規定者。", "note": "約定專用如果違反法令的使用限制，就算寫進規約也沒效力。", "full": "【公寓大廈管理條例 第7條】\n公寓大廈共用部分不得獨立使用供做專有部分。其為下列各款者，並不得為約定專用部分：\n四、約定專用有違法令使用限制之規定者。", "opts": ["違反義務處理方式有效", "", "財務監督規定有效", "禁養動物規定有效"]}, "4-4-11": {"law": "（這題屬公寓大廈行政管理實務教材的內容，沒有對應法條原文）", "note": "文件分10類，合約書屬於「業務類」。", "opts": ["合約書不是文書類", "不是規約類", "", "不是設備類"]}, "4-4-12": {"law": "（這題屬公寓大廈行政管理實務教材的內容，沒有對應法條原文）", "note": "規約類的規約，保存年限是「永久」。", "opts": ["不是3年", "不是5年", "不是10年", ""]}, "4-4-13": {"law": "（這題屬公寓大廈行政管理實務教材的內容，沒有對應法條原文）", "note": "社區常用的管理辦法：裝潢、公共設施使用、財務收支。「下水道使用管理收費辦法」是政府訂的，不是社區的。", "opts": ["裝潢管理辦法常用", "公共設施使用辦法常用", "財務收支辦法常用", ""]}, "4-4-14": {"law": "（這題屬公寓大廈行政管理實務教材的內容，沒有對應法條原文）", "note": "裝潢管理規範：繳施工保證金、圖測審核、違建管制。不用繳「區分所有權人權狀影本」。", "opts": ["", "施工保證金是規範內容", "圖測審核是規範內容", "違建管制是規範內容"]}, "4-4-15": {"law": "（這題屬公寓大廈行政管理實務教材的內容，沒有對應法條原文）", "note": "管委會會議紀錄寫：開會時間、出席列席名單、討論事項概要。「列席人員之介紹」不用寫。", "opts": ["開會時間要記載", "", "出席列席名單要記載", "討論事項概要要記載"]}, "4-4-16": {"law": "（這題屬公寓大廈行政管理實務教材的內容，沒有對應法條原文）", "note": "文件保存年限有：永久、10年、5年、3年。沒有8年。", "opts": ["10年是保存年限", "", "5年是保存年限", "3年是保存年限"]}, "4-4-17": {"law": "（這題屬公寓大廈行政管理實務教材的內容，沒有對應法條原文）", "note": "擬稿人員要會：文字組織、文書處理、擬稿要點。「廣告行銷」用不到。", "opts": ["文字組織是基本能力", "文書處理是基本能力", "擬稿要點是基本能力", ""]}, "4-4-18": {"law": "【公寓大廈管理條例 第34條】\n區分所有權人會議應作成會議紀錄，載明開會經過及決議事項，由主席簽名，於會後十五日內送達各區分所有權人並公告之。", "note": "區權會議紀錄由「主席」簽名。", "opts": ["", "管理委員不是簽名者", "總幹事不是", "租賃管理人員不是"]}, "4-4-19": {"law": "（這題屬公寓大廈行政管理實務教材的內容，沒有對應法條原文）", "note": "管理辦法草案要寫：主題、構成項目、作業程序與表單。「廠商名單」不是。", "opts": ["管理事項主題是內容", "", "構成項目是內容", "作業程序及表單是內容"]}, "4-4-20": {"law": "（這題屬公寓大廈行政管理實務教材的內容，沒有對應法條原文）", "note": "社區只代收「掛號信件」。拆封郵件、兵役通知、信用卡函涉及隱私，不代收。", "opts": ["", "拆封郵件不代收", "兵役通知涉及個資", "信用卡函涉及個資"]}, "4-4-21": {"law": "【公寓大廈管理條例 第36條】\n管理委員會之職務如下：\n九、管理服務人之委任、僱傭及監督。", "note": "管委會對管理服務人的職務是「委任、僱傭、監督」。", "opts": ["", "升職不是管委會職務", "進薪不是管委會職務", "兼任不是管委會職務"]}, "4-4-22": {"law": "（這題屬公寓大廈行政管理實務教材的內容，沒有對應法條原文）", "note": "安全防災類：安全管理流程、安全維護流程、緊急事件處理流程。「公共設施清潔維護」是環境維護類。", "opts": ["安全管理流程屬安全防災", "", "安全維護流程屬安全防災", "緊急事件流程屬安全防災"]}, "4-4-23": {"law": "（這題屬公寓大廈行政管理實務教材的內容，沒有對應法條原文）", "note": "第1類圖冊：竣工圖、水電圖說、管線圖說。「消防安全設備檢修單」是檢修紀錄，不是圖。", "opts": ["竣工圖是圖冊", "水電圖說是圖冊", "", "管線圖說是圖冊"]}, "4-4-24": {"law": "【公寓大廈管理條例 第35條】\n利害關係人於
