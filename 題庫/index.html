<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>租賃住宅管理人員 模擬測驗</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#222;--sub:#6b6b6b;--line:#e4e0d6;--pri:#2f6f5e;--pri2:#e3f1ec;--bad:#c0392b;--bad2:#fdecea;--ok:#1e8449;--ok2:#e6f4ea;--warn:#b7791f;--warn2:#fff6e0;--law:#eef2fb;--lawb:#3b5bb5}
@media (prefers-color-scheme:dark){:root{--bg:#16181a;--card:#202325;--ink:#eee;--sub:#a0a0a0;--line:#34383b;--pri:#5cc2a6;--pri2:#1f3a33;--bad:#ff7b6b;--bad2:#3b2220;--ok:#5fd68a;--ok2:#1d3326;--warn:#f0b955;--warn2:#3a3118;--law:#212a40;--lawb:#8fa8ff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 "Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:8px 0 2px}h2{font-size:18px;margin:20px 0 8px}
.sub{color:var(--sub);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 16px}
button:hover{border-color:var(--pri)}
button.pri{background:var(--pri);color:#fff;border-color:var(--pri);font-weight:700}
button.big{width:100%;padding:16px;font-size:18px}
button:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px;line-height:1.5}
.opt.sel{border-color:var(--pri);background:var(--pri2);font-weight:700}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--pri)}
.stem{font-size:18px;font-weight:600;margin:6px 0 10px}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--pri2);color:var(--pri);margin-right:4px}
.orow{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:6px 0}.orow.r{background:var(--ok2);border-color:var(--ok)}.orow.p{background:var(--bad2);border-color:var(--bad)}.orow .why{font-size:14px;color:var(--sub);margin:2px 0 0 26px}.orow .mk{display:inline-block;width:26px}.tag.bad{background:var(--bad2);color:var(--bad)}.tag.ok{background:var(--ok2);color:var(--ok)}.tag.warn{background:var(--warn2);color:var(--warn)}
.score{font-size:56px;font-weight:800;line-height:1.1}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right}th:first-child,td:first-child{text-align:left}
.mine{background:var(--bad2);border-left:4px solid var(--bad);padding:8px 12px;border-radius:8px;margin:6px 0}
.right{background:var(--ok2);border-left:4px solid var(--ok);padding:8px 12px;border-radius:8px;margin:6px 0}
.law{background:var(--law);border-left:4px solid var(--lawb);padding:8px 12px;border-radius:8px;margin:6px 0;white-space:pre-wrap;font-size:15px}
.note{background:var(--warn2);border-left:4px solid var(--warn);padding:8px 12px;border-radius:8px;margin:6px 0;white-space:pre-wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.grid button{padding:6px 0;font-size:13px}.grid .done{background:var(--pri2);border-color:var(--pri)}.grid .cur{outline:2px solid var(--pri)}
.sticky{position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:5}
select{font:inherit;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.lbl{font-size:13px;color:var(--sub)}
details summary{cursor:pointer;color:var(--sub)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const BANK={"chaps": {"1": "租賃住宅市場發展及管理條例相關法規", "2": "不動產租賃及租稅相關法規", "3": "消費者保護法相關法規", "4": "公寓大廈管理相關法規", "5": "各式住宅租賃契約與委託管理契約應記載及不得記載事項", "6": "租賃關係管理及糾紛處理實務", "7": "屋況設備點交及故障排除實務", "8": "建築物設備管理維護實務", "9": "室內裝修相關法規", "10": "專業倫理規範"}, "secs": {"1-1": "租賃住宅市場發展及管理條例及其施行細則(含執業資格、業務責任)", "1-2": "租賃住宅服務業資訊提供辦法", "2-1": "民法有關房屋租用之相關規定", "2-2": "所得稅法相關規定", "2-3": "房屋稅條例相關規定", "2-4": "土地稅法相關規定", "2-5": "租賃所得及費用申報知識與應用", "3-1": "消費者保護法及其施行細則", "4-1": "公寓大廈管理條例及施行細則", "4-2": "都市計畫法及非都市土地使用管制規則", "4-3": "公寓大廈規約範本", "4-4": "公寓大廈行政管理實務", "4-5": "多戶共同委託管理之生活公約研訂", "5-1": "涵蓋住宅包租契約應約定及不得約定事項", "5-2": "住宅轉租定型化契約應記載及不得記載事項", "5-3": "租賃住宅委託管理定型化契約應記載及不得記載事項", "5-4": "住宅租賃定型化契約應記載及不得記載事項", "6-1": "租賃糾紛處理管道及資源與保護措施", "6-2": "租賃爭議處理-申訴、調解(調處)、消費訴訟", "6-3": "租賃關係管理(一)設備補充及功能提升項目之造冊列管", "6-4": "租賃關係管理(二)高風險租戶之關懷措施", "6-5": "租賃關係管理(三)配合氣象警報協助租戶防災措施、避難規劃", "6-6": "舉證及證據保全實務", "6-7": "假扣押及假處分概要", "6-8": "民事訴訟實務概要", "6-9": "租賃住宅契約履行與服務糾紛處理實務", "6-10": "租賃住宅居住使用糾紛處理實務", "7-1": "概論", "7-2": "各類設備點交實務", "7-3": "各類設備故障排除實務", "7-4": "各類設備管理維護實務", "7-5": "設備補充及功能提升評估", "8-1": "概論", "8-2": "建築物管理維護技術及企劃", "8-3": "集合住宅住戶使用維護手冊範本", "8-4": "建築物防火避難設施及消防設備維護", "8-5": "建築物設備設置標準及維護", "9-1": "建築物室內裝修管理辦法", "9-2": "建築物技術規則建築設計施工編", "9-3": "公寓大廈管理條例社區規約條款", "10-1": "專業倫理規範"}, "qs": [{"id": "1-1-01", "c": 1, "s": 1, "n": "01", "p": 4, "q": "依租賃住宅市場發展及管理條例之規定，租賃住宅係指以出租供下列何者使用之建築物？", "o": ["居住使用", "辦公使用", "餐廳使用", "店鋪使用"], "a": 0}, {"id": "1-1-02", "c": 1, "s": 1, "n": "02", "p": 4, "q": "依租賃住宅市場發展及管理條例之規定，下列何者屬租賃住宅服務業？", "o": ["公寓大廈管理維護公司", "租賃住宅代管業", "不動產經紀業", "不動產代銷業"], "a": 1}, {"id": "1-1-03", "c": 1, "s": 1, "n": "03", "p": 4, "q": "依租賃住宅市場發展及管理條例之規定，下列何者屬租賃住宅服務業？", "o": ["不動產經紀業", "不動產代銷業", "租賃住宅包租業", "公寓大廈管理維護公司"], "a": 2}, {"id": "1-1-04", "c": 1, "s": 1, "n": "04", "p": 4, "q": "依租賃住宅市場發展及管理條例之規定，受出租人之委託，經營租賃住宅管理業務之公司，下列何者正確？", "o": ["不動產經紀業", "不動產代銷業", "租賃住宅包租業", "租賃住宅代管業"], "a": 3}, {"id": "1-1-05", "c": 1, "s": 1, "n": "05", "p": 4, "q": "依租賃住宅市場發展及管理條例之規定，承租租賃住宅並轉租，及經營該租賃住宅管理業務之公司，下列何者正確？", "o": ["租賃住宅包租業", "租賃住宅代管業", "不動產經紀業", "不動產代銷業"], "a": 0}, {"id": "1-1-06", "c": 1, "s": 1, "n": "06", "p": 5, "q": "依租賃住宅市場發展及管理條例之規定，租賃住宅服務業依法設置從事代管業務或包租業務之人員，下列何者正確？", "o": ["租賃住宅經紀人員", "租賃住宅仲介人員", "租賃住宅管理人員", "租賃住宅管理公司"], "a": 2}, {"id": "1-1-07", "c": 1, "s": 1, "n": "07", "p": 5, "q": "依租賃住宅市場發展及管理條例之規定，承租租賃住宅，以其全部或一部租與他人居住使用，他人支付租金之租賃行為，下列何者正確？", "o": ["包租", "代租", "承租", "轉租"], "a": 3}, {"id": "1-1-08", "c": 1, "s": 1, "n": "08", "p": 5, "q": "依租賃住宅市場發展及管理條例之規定，以其租用之住宅全部或一部租與他人居住者，下列何者正確？", "o": ["轉租人", "包租人", "代租人", "承租人"], "a": 0}, {"id": "1-1-09", "c": 1, "s": 1, "n": "09", "p": 5, "q": "依租賃住宅市場發展及管理條例之規定，支付租金租用他人承租之租賃住宅供居住使用者，下列何者正確？", "o": ["次代租人", "次承租人", "次轉租人", "次包租人"], "a": 1}, {"id": "1-1-10", "c": 1, "s": 1, "n": "10", "p": 5, "q": "依租賃住宅市場發展及管理條例之規定，承租人為擔保租賃住宅之損害賠償行為及處理遺留物責任，預為支付之金錢，其名稱下列何者正確？", "o": ["保證金", "訂金", "租金", "押金"], "a": 3}, {"id": "1-1-11", "c": 1, "s": 1, "n": "11", "p": 5, "q": "不適用租賃住宅市場發展及管理條例規定之租賃住宅，下列何者正確？", "o": ["供休閒或旅遊為目的之住宅", "由出租人自行經營管理之住宅", "供居住使用之住宅", "租賃期間超過30日之住宅"], "a": 0}, {"id": "1-1-12", "c": 1, "s": 1, "n": "12", "p": 6, "q": "某甲將其住宅出租予某乙，其租賃期間至少幾日，始適用租賃住宅市場發展及管理條例之規定？", "o": ["60日", "30日", "20日", "10日"], "a": 1}, {"id": "1-1-13", "c": 1, "s": 1, "n": "13", "p": 6, "q": "依租賃住宅市場發展及管理條例之規定，某甲將其住宅出租予某乙，該住宅租賃契約條款，違反住宅租賃契約應記載及不記載事項之法律效果，下列何者正確？", "o": ["無效", "得撤銷", "不成立", "效力未定"], "a": 0}, {"id": "1-1-14", "c": 1, "s": 1, "n": "14", "p": 6, "q": "依租賃住宅市場發展及管理條例之規定租賃契約條款，應記載事項而未記載於契約者，下列何者正確？", "o": ["未構成契約之內容", "仍構成契約之內容", "不生效力", "無效"], "a": 1}, {"id": "1-1-15", "c": 1, "s": 1, "n": "15", "p": 6, "q": "依租賃住宅市場發展及管理條例之規定，某甲將其住宅出租予某乙，其應記載事項僅以口頭約定，未記載於契約，其法律效果，下列何者正確？", "o": ["不生效力", "無效", "仍構成契約之內容", "未構成契約之內容"], "a": 2}, {"id": "1-1-16", "c": 1, "s": 1, "n": "16", "p": 6, "q": "依租賃住宅市場發展及管理條例之規定，租賃契約條款，一部無效或不構成契約內容之一部，除去該部分，契約亦可成立者，該契約其他部分之法律效力，下列何者正確？", "o": ["部分無效", "全部無效", "部分有效", "仍為有效"], "a": 3}, {"id": "1-1-17", "c": 1, "s": 1, "n": "17", "p": 6, "q": "依租賃住宅市場發展及管理條例之規定，某甲將其住宅出租予某乙，每月租金10,000元，某甲得向某乙收取之押金總額，下列何者正確？", "o": ["不得逾10,000元", "不得逾20,000元", "不得逾30,000元", "不得逾40,000元"], "a": 1}, {"id": "1-1-18", "c": 1, "s": 1, "n": "18", "p": 7, "q": "依租賃住宅市場發展及管理條例之規定，出租人將租賃住宅交付承租人後，於租賃期間對於租賃住宅品質，下列何者正確？", "o": ["保持室內空氣新鮮", "保持室內溼度適宜", "保持室內溫度適宜", "保持合於居住使用之狀態"], "a": 3}, {"id": "1-1-19", "c": 1, "s": 1, "n": "19", "p": 7, "q": "依租賃住宅市場發展及管理條例之規定，租賃住宅應由出租人負責修繕之項目，如出租人未於承租人所定適當期限內修繕，下列何者正確？", "o": ["承租人僅得自行自費雇工修繕", "承租人得自行修繕，並請求出租人償還其費用", "承租人應自行修繕", "承租人不得自行修繕"], "a": 1}, {"id": "1-1-20", "c": 1, "s": 1, "n": "20", "p": 7, "q": "依租賃住宅市場發展及管理條例之規定，出租人對於修繕租賃住宅所為之必要行為，下列何者正確？", "o": ["承租人得有條件拒絕", "承租人得有條件接受", "承租人不得拒絕", "承租人得拒絕"], "a": 2}, {"id": "1-1-21", "c": 1, "s": 1, "n": "21", "p": 7, "q": "依租賃住宅市場發展及管理條例之規定，轉租人簽訂轉租契約時，應向次承租人提供之文件，下列何者正確？", "o": ["同意轉租書面文件", "建物所有權狀影本", "使用執照影本", "建物測量成果圖影本"], "a": 0}, {"id": "1-1-22", "c": 1, "s": 1, "n": "22", "p": 7, "q": "依租賃住宅市場發展及管理條例之規定，轉租人應於簽訂轉租契約後幾日內，以書面通知出租人?", "o": ["至多10日內", "至多20日內", "至多30日內", "至多60日內"], "a": 2}, {"id": "1-1-23", "c": 1, "s": 1, "n": "23", "p": 8, "q": "依租賃住宅市場發展及管理條例之規定，承租人未經出租人書面同意，將租賃住宅轉租於他人，出租人提前終止租賃契約，應依規定期限，檢附相關事證，以書面通知承租人，下列何者正確？", "o": ["終止契約前至少30日", "終止契約前至少7日", "終止契約前至少半個月", "終止契約前至少2個月"], "a": 0}, {"id": "1-1-24", "c": 1, "s": 1, "n": "24", "p": 8, "q": "依租賃住宅市場發展及管理條例之規定，承租人死亡，繼承人得主張終止租賃契約。繼承人依規定提前終止租賃契約者，且出租人不得要求任何賠償，應依規定期限，檢附相關事證，以書面通知出租人，下列何者正確？", "o": ["終止契約前至少7日", "終止契約前至少20日", "終止契約前至少30日", "終止契約前至少2個月"], "a": 2}, {"id": "1-1-25", "c": 1, "s": 1, "n": "25", "p": 8, "q": "依租賃住宅市場發展及管理條例之規定，住宅承租人因病，有長期療養之需要時。欲在出租人不得要求任何賠償條件下，提前終止租賃契約，其診斷證明之療養時程，下列何者正確？", "o": ["至少1個月以上", "至少2個月以上", "至少3個月以上", "至少6個月以上"], "a": 3}, {"id": "1-1-26", "c": 1, "s": 1, "n": "26", "p": 8, "q": "依租賃住宅市場發展及管理條例之規定，住宅租賃契約消滅時，租賃住宅之返還點交後尚有遺留物，除租賃當事人另有約定外，經出租人定相當期限催告，承租人仍不取回時，下列何者正確？", "o": ["仍擁有其所有權", "視為拋棄其所有權", "其所有權歸屬未定", "其所有權視為滅失"], "a": 1}, {"id": "1-1-27", "c": 1, "s": 1, "n": "27", "p": 8, "q": "依租賃住宅市場發展及管理條例之規定，住宅租賃契約消滅時，租賃住宅之返還點交後尚有遺留物，除租賃當事人另有約定外，經出租人定相當期限催告，承租人仍不取回時，遺留物所需處理費用，下列何者正確？", "o": ["出租人自行負擔", "不得由押金扣除", "得由押金扣除", "不得請求承租人給付"], "a": 2}, {"id": "1-1-28", "c": 1, "s": 1, "n": "28", "p": 9, "q": "依租賃住宅市場發展及管理條例之規定，出租人提供之租賃住宅廣告內容，下列何者正確？", "o": ["正確性由受託刊登媒體經營者負責", "正確性由出租人負責，與他人無關", "得約定僅供參考", "應與事實相符"], "a": 3}, {"id": "1-1-29", "c": 1, "s": 1, "n": "29", "p": 9, "q": "依租賃住宅市場發展及管理條例之規定，受託刊登租賃住宅廣告之媒體經營者明知或可得而知廣告之租賃住宅面積、屋齡、樓層別及法定用途與事實不符者，就承租人因信賴該廣告所受之損害，下列何者正確？", "o": ["與出租人負連帶賠償責任", "與出租人各負責一半賠償責任", "與出租人均無關", "出租人負責全部賠償責任"], "a": 0}, {"id": "1-1-30", "c": 1, "s": 1, "n": "30", "p": 9, "q": "依租賃住宅市場發展及管理條例之規定，受託刊登租賃住宅廣告之媒體經營者明知或可得而知廣告之租賃住宅面積、屋齡、樓層別及法定用途與事實不符者，就承租人因信賴該廣告所受之損害與出租人負連帶賠償責任；其損害賠償責任，下列何者正確？", "o": ["基於契約自由原則，得自行約定", "不得預先約定限制或拋棄", "得約定限由出租人負擔", "得約定限由刊登者負擔"], "a": 1}, {"id": "1-1-31", "c": 1, "s": 1, "n": "31", "p": 9, "q": "依租賃住宅市場發展及管理條例之規定，承租人向直轄市或縣（市）政府申請住宅租賃爭議調處，其調處費用，下列何者正確？", "o": ["繳交3成調處費用", "免繳調處費用", "繳交全額調處費用", "繳交一半調處費用"], "a": 1}, {"id": "1-1-32", "c": 1, "s": 1, "n": "32", "p": 9, "q": "依租賃住宅市場發展及管理條例之規定，個人住宅所有權人將住宅出租予包租業轉租，契約約定供居住使用多少期間，始得減徵租金所得稅，下列何者正確？", "o": ["至少3年以上", "至少2年以上", "至少1年以上", "至少半年以上"], "a": 2}, {"id": "1-1-33", "c": 1, "s": 1, "n": "33", "p": 10, "q": "依租賃住宅市場發展及管理條例之規定，住宅出租期間，每屋每月租金收入得免納綜合所得稅之金額，下列何者正確？", "o": ["不超過新臺幣2,000元", "不超過新臺幣3,000元", "不超過新臺幣5,000元", "不超過新臺幣6,000元"], "a": 3}, {"id": "1-1-34", "c": 1, "s": 1, "n": "34", "p": 10, "q": "適用租賃住宅市場發展及管理條例租金所得減徵規定之租賃住宅，每屋每月租金收入超過新臺幣6,000元至20,000元部分，其租金所得必要損耗及費用之減除標準如何認列？", "o": ["依該部分租金53%計算", "依該部分租金47%計算", "依該部分租金43%計算", "依該部分租金57%計算"], "a": 0}, {"id": "1-1-35", "c": 1, "s": 1, "n": "35", "p": 10, "q": "依租賃住宅市場發展及管理條例之規定，某人有一住宅出租3年，其每月租金收入新臺幣10,000元整，期間委託租代管業管理，某人1年應列認租金申報綜合所得稅金額，下列何者正確？", "o": ["(10,000-6,000)*53%*12＝25,440元", "(10,000-6,000)*47%*12＝22,560元", "10,000*47%*12＝56,400元", "10,000*53%*12＝63,600元"], "a": 1}, {"id": "1-1-36", "c": 1, "s": 1, "n": "36", "p": 10, "q": "適用租賃住宅市場發展及管理條例租金所得減徵規定之租賃住宅，每屋每月租金收入超過新臺幣20,000元部分，其租金所得必要損耗及費用之減除標準如何認列？", "o": ["免納綜合所得稅", "依該部分租金收入53%計算", "按所得稅法相關法令規定", "依該部分租金收入47%計算"], "a": 2}, {"id": "1-1-37", "c": 1, "s": 1, "n": "37", "p": 10, "q": "依租賃住宅市場發展及管理條例之規定，某人有一住宅出租3年，每月租金收入新臺幣20,000元整，期間委託包租代管業管理，某人1年應申報綜合所得稅金額，下列何者正確？", "o": ["20,000*53%*12＝127,200元", "20,000*47%*12＝112,800元", "(20,000-6,000)*53%*12＝89,040元", "(20,000-6,000)*47%*12＝78,960元"], "a": 3}, {"id": "1-1-38", "c": 1, "s": 1, "n": "38", "p": 11, "q": "依租賃住宅市場發展及管理條例施行細則之規定，個人住宅所有權人將住宅出租予包租業轉租，得減徵租金所得稅，其租賃契約書約定之租賃期間，下列何者正確？", "o": ["應達1年以上", "應達9個月以上", "應達6個月以上", "應達3個月以上"], "a": 0}, {"id": "1-1-39", "c": 1, "s": 1, "n": "39", "p": 11, "q": "依租賃住宅市場發展及管理條例之規定，租賃住宅服務業者向直轄市、縣（市）主管機關申請許可後，多久期間內應辦妥公司登記；屆期未辦妥公司登記者，由直轄市、縣（市）主管機關廢止其許可，下列何者正確？", "o": ["至多9個月內", "至多6個月內", "至多3個月內", "至多1個月內"], "a": 2}, {"id": "1-1-40", "c": 1, "s": 1, "n": "40", "p": 11, "q": "依租賃住宅市場發展及管理條例之規定，租賃住宅服務業應於完成公司登記後，多久期間內繳存營業保證金、置租賃住宅管理人員及加入登記所在地之同業公會，檢附有關證明文件向直轄市、縣（市）主管機關申請租賃住宅服務業登記並領得登記證後，始得營業，下列何者正確？", "o": ["至多1個月內", "至多2個月內", "至多3個月內", "至多6個月內"], "a": 3}, {"id": "1-1-41", "c": 1, "s": 1, "n": "41", "p": 11, "q": "依租賃住宅市場發展及管理條例之規定，租賃住宅服務業領得登記證後多久期間未開始營業，直轄市、縣（市）主管機關得註銷其登記證，下列何者正確？", "o": ["逾1個月", "逾3個月", "逾6個月", "逾9個月"], "a": 2}, {"id": "1-1-42", "c": 1, "s": 1, "n": "42", "p": 11, "q": "依租賃住宅市場發展及管理條例之規定，代管業及包租業組織商業團體之業別，下列何者正確？", "o": ["以租賃住宅代管商業為之", "以租賃住宅包租商業為之", "以租賃房屋服務商業為之", "以租賃住宅服務商業為之"], "a": 3}, {"id": "1-1-43", "c": 1, "s": 1, "n": "43", "p": 12, "q": "依租賃住宅市場發展及管理條例之規定，租賃住宅服務業營業後，所置租賃住宅管理人員異動時，應於異動之日起多少期間內，造具名冊報請直轄市、縣（市）主管機關備查，下列何者正確？", "o": ["不得逾60日", "不得逾30日", "不得逾20日", "不得逾10日"], "a": 1}, {"id": "1-1-44", "c": 1, "s": 1, "n": "44", "p": 12, "q": "依租賃住宅市場發展及管理條例施行細則之規定，租賃住宅服務業或其分設營業處所經直轄市、縣（市）主管機關准予停業登記者，於登記停業期間內，下列何者正確？", "o": ["非重新辦理商業登記，不得有營業行為", "非經註銷停業登記，不得有營業行為", "辦理復業登記與營業行為，可同時進行", "非經辦妥復業登記，不得有營業行為"], "a": 3}, {"id": "1-1-45", "c": 1, "s": 1, "n": "45", "p": 12, "q": "依租賃住宅市場發展及管理條例之規定，租賃住宅服務業擔任營業保證基金管理委員會委員之人數比例上限，下列何者正確？", "o": ["2/5", "1/5", "1/4", "1/3"], "a": 0}, {"id": "1-1-46", "c": 1, "s": 1, "n": "46", "p": 12, "q": "依租賃住宅市場發展及管理條例之規定，租賃住宅服務業繳存之營業保證金不足時，全國聯合會應通知租賃住宅服務業者應於幾月內補足，下列何者正確？", "o": ["半個月", "1個月", "2個月", "3個月"], "a": 1} 租賃住宅服務業負責人簽章", "應指派租賃住宅會計人員簽章", "應指派租賃住宅業務人員簽章", "應指派專任租賃住宅管理人員簽章"], "a": 3}, {"id": "1-1-103", "c": 1, "s": 1, "n": "103", "p": 24, "q": "依租賃住宅市場發展及管理條例之規定，出租人委託代管業時，其住宅租賃契約，下列何者正確？", "o": ["代管業應指派租賃住宅會計人員簽章", "免經代管業簽章", "代管業應指派租賃住宅業務人員簽章", "代管業應指派專任租賃住宅管理人員簽章"], "a": 1}, {"id": "1-1-104", "c": 1, "s": 1, "n": "104", "p": 24, "q": "依租賃住宅市場發展及管理條例之規定，出租人委託代管業時，其住宅租賃標的現況確認書，下列何者正確？", "o": ["代管業應指派租賃住宅會計人員簽章", "代管業應指派租賃住宅業務人員簽章", "免經代管業簽章", "代管業應指派專任租賃住宅管理人員簽章"], "a": 2}, {"id": "1-1-105", "c": 1, "s": 1, "n": "105", "p": 24, "q": "保全業經營代管業務，依租賃住宅市場發展及管理條例之規定，直轄市、縣（市）主管機關得處公司負責人罰鍰新台幣金額，下列何者正確？", "o": ["10,000元以上30,000元以下", "20,000元以上50,000元以下", "30,000元以上100,000元以下", "40,000元以上200,000元以下"], "a": 3}, {"id": "1-1-106", "c": 1, "s": 1, "n": "106", "p": 24, "q": "不動產經紀業未具代管業資格者，經營代管業務，依租賃住宅市場發展及管理條例之規定，直轄市、縣（市）主管機關得處公司負責人罰鍰新台幣金額，下列何者正確？", "o": ["40,000元以上200,000元以下", "30,000元以上100,000元以下", "20,000元以上50,000元以下", "10,000元以上30,000元以下"], "a": 0}, {"id": "1-1-107", "c": 1, "s": 1, "n": "107", "p": 24, "q": "中華民國107年6月27日前已經營代管業務或包租業務之公司，依租賃住宅市場發展及管理條例之規定，得繼續營業期間，下列何者正確？", "o": ["至多半年", "至多1年", "至多2年", "至多3年"], "a": 2}, {"id": "1-2-01", "c": 1, "s": 2, "n": "01", "p": 25, "q": "依租賃住宅服務業資訊提供辦法，租賃住宅代管業與委託人提前終止委託管理契約，應提供直轄市、縣（市）主管機關之資訊，下列何者正確？", "o": ["提前終止委管契約之違約金", "提前終止委管契約書", "提前終止委管契約之日期及原因", "提前終止委管契約之關係人"], "a": 2}, {"id": "1-2-02", "c": 1, "s": 2, "n": "02", "p": 25, "q": "依租賃住宅服務業資訊提供辦法，包租業與出租人提前終止包租契約，應提供直轄市、縣（市）主管機關之資訊，下列何者正確？", "o": ["提前終止包租契約之違約金", "提前終止包租契約之日期及原因", "提前終止包租契約書", "提前終止包租契約之關係人"], "a": 1}, {"id": "1-2-03", "c": 1, "s": 2, "n": "03", "p": 25, "q": "租賃住宅代管業應提供之租賃住宅相關資訊，下列何者錯誤?", "o": ["承租人", "租賃層次", "租金總額", "土地地號"], "a": 3}, {"id": "1-2-04", "c": 1, "s": 2, "n": "04", "p": 25, "q": "租賃住宅服務業應於訂定契約之日起幾日內，將應提供之租賃住宅相關資訊，使用電子憑證以網際網路方式提供直轄市、縣（市）主管機關?", "o": ["30日", "5日", "3日", "7日"], "a": 0}, {"id": "1-2-05", "c": 1, "s": 2, "n": "05", "p": 25, "q": "租賃住宅服務業未於期限內提供相關資訊或提供不實資訊，應依本條例規定，於接獲裁處書及限期改正通知書後幾日內改正?", "o": ["5日", "10日", "15日", "20日"], "a": 2}, {"id": "1-2-06", "c": 1, "s": 2, "n": "06", "p": 26, "q": "租賃住宅服務業未於期限內提供相關資訊或提供不實資訊，經命屆期改正通知書，若仍屆期未改正，直轄市、縣（市）主管機關應按次處罰並限期於幾日內改正，至完成改正為止。", "o": ["5日", "10日", "15日", "20日"], "a": 2}, {"id": "2-1-1", "c": 2, "s": 1, "n": "1", "p": 27, "q": "依民法之規定，租賃契約之成立的時點為何？", "o": ["雙方意思表示一致時", "出租人將租賃物交付時", "辦理公證時", "辦理登記時"], "a": 0}, {"id": "2-1-2", "c": 2, "s": 1, "n": "2", "p": 27, "q": "依民法之規定，租賃契約之性質，屬於何者?", "o": ["要物契約", "要式契約", "非典型契約", "諾成契約"], "a": 3}, {"id": "2-1-3", "c": 2, "s": 1, "n": "3", "p": 27, "q": "某甲將房屋出租與某乙，但未約定租金應付多少，依民法之規定，該租賃契約的效力為何?", "o": ["成立且生效", "成立未生效", "不成立", "效力未定"], "a": 2}, {"id": "2-1-4", "c": 2, "s": 1, "n": "4", "p": 27, "q": "某甲口頭約定將房屋出租與某乙，並經雙方合意，但某乙卻遲遲未支付租金與擔保金，依民法之規定，該租賃契約的效力為何?", "o": ["成立且生效", "成立未生效", "不成立", "效力未定"], "a": 0}, {"id": "2-1-5", "c": 2, "s": 1, "n": "5", "p": 27, "q": "依民法之規定，某乙向某甲表達承租房屋之要約，經數次書信往返的洽商，某甲認為已經達到可以簽約的程度，但在發出承諾簽約之通知前，卻收到某乙已先發函向某甲表達不租的意思表示，試問，該租賃契約有無成立?", "o": ["成立", "未生效", "因要約撤回先時到達而失效", "效力未定"], "a": 2}, {"id": "2-1-6", "c": 2, "s": 1, "n": "6", "p": 28, "q": "依民法之規定，某甲之妻某乙擬將某甲的房屋委託代管業代為管理，但某甲疑似有精神障礙或其他心智缺陷，致不能為意思表示或受意思表示已經法院為監護之宣告，試問，應該由誰與代管業簽訂契約？", "o": ["由監護人代為簽約", "由某甲簽約，應經輔助人同意", "由某甲簽約", "由某乙簽約"], "a": 0}, {"id": "2-1-7", "c": 2, "s": 1, "n": "7", "p": 28, "q": "依民法之規定，某甲家人擬將某甲的房屋委託代管業代為管理，但某甲疑似有精神障礙或其他心智缺陷，致不能為意思表示或受意思表示之虞，但法院僅裁定為輔助之宣告，試問，應該由誰與代管業簽訂契約？", "o": ["甲之父母", "某甲簽約，應經輔助人同意", "某甲簽約即可", "某甲的配偶"], "a": 1}, {"id": "2-1-8", "c": 2, "s": 1, "n": "8", "p": 28, "q": "依民法之規定，某甲是經法院裁定為監護宣告或輔助之宣告之人，試問，某甲擬將房屋出租，簽訂契約時應檢附甚麼證件，下列之敘述何者為正確？", "o": ["監護宣告或輔助宣告裁定書", "判決確定證明", "印鑑證明與印鑑章相符即可", "經法院公證即可"], "a": 0}, {"id": "2-1-9", "c": 2, "s": 1, "n": "9", "p": 28, "q": "依民法之規定，某甲是所有權人，授權某乙為代理人，委託仲介公司某丙居間媒合，將房屋出租與丁，依民法之規定，應該以誰的名義為出租人?", "o": ["甲", "乙", "丙", "視授權契約而定"], "a": 0}, {"id": "2-1-10", "c": 2, "s": 1, "n": "10", "p": 28, "q": "依民法之規定，某甲想承租房屋，對方不是房屋所有權人，卻自稱已獲得授權之代理人，試問，某甲要簽租賃契約前，最好要求該代理人檢附何種證明文件以證實其代理權?", "o": ["口頭即為有效", "一般授權書", "授權書經公證", "檢附印鑑證明"], "a": 2}, {"id": "2-1-11", "c": 2, "s": 1, "n": "11", "p": 29, "q": "依民法之規定，代管業者之代管期間屆滿未即時返還租賃房屋，構成無因管理，且違反本人明示或可得推知之意思時，如對於委託人發生損害，是否應負賠償責任?", "o": ["有過失，即應負責賠償", "有重大過失，應負責賠償", "有故意，才要賠償", "雖無過失，亦應負責賠償"], "a": 3}, {"id": "2-1-12", "c": 2, "s": 1, "n": "12", "p": 29, "q": "依民法規定，租賃契約簽訂前支付定金，與租賃契約有何關聯?", "o": ["推定其契約成立", "視為其契約成立", "確定其契約成立", "推定其契約生效"], "a": 0}, {"id": "2-1-13", "c": 2, "s": 1, "n": "13", "p": 29, "q": "依民法之規定，某甲擬將整棟房屋租給專業的的包租業者某乙，竟刻意隱匿該屋曾經發生火災致死事件，雖然某乙在簽約前獲知此事，導致簽約不成，試問，某乙為準備事前調查及商議訂約，並預為準備進行包租作業等損害，可否向甲請求賠償?", "o": ["不可，契約未成立", "可以，甲應負責", "非消費關係，甲不需負責", "包租業自應負調查責任，甲不需負責"], "a": 1}, {"id": "2-1-14", "c": 2, "s": 1, "n": "14", "p": 29, "q": "依民法之規定，從事租賃管理服務的代管業某甲，於簽訂受託代管契約之前，出租人特別交代，將來的租金全部作為支付小三作生活費，並要求某甲保密，嗣後因條件談不攏無法簽約，但因某甲僱員不慎洩漏上述秘密，試問，某乙可否向甲請求賠償?", "o": ["不可，契約未成立", "屬準備或商議訂約致所受損害，甲應該負責", "非消費關係，甲不需負責", "需經妨礙秘密罪判決確定，甲才需負責"], "a": 1}, {"id": "2-1-15", "c": 2, "s": 1, "n": "15", "p": 29, "q": "依民法之規定，包租業為訂定包租契約而預先擬訂之契約條款，有以下何種情形，該部分約定，仍為有效?", "o": ["免除或減輕包租業責任者", "使拋棄權利或限制其行使權利者", "加重出租人之責任者", "租賃期間不得任意終止"], "a": 3}, {"id": "2-1-16", "c": 2, "s": 1, "n": "16", "p": 30, "q": "依民法之規定，某甲簽訂租賃契約後，發現所租的房屋有嚴重瑕疵，想要向出租人表達不租該房屋的意思，該用什麼方式，才可以使該租賃契約溯及簽訂時失其效力?", "o": ["終止契約", "撤銷契約", "解除契約", "撤回契約"], "a": 2}, {"id": "2-1-17", "c": 2, "s": 1, "n": "17", "p": 30, "q": "依民法之規定，某甲以口頭約定向某乙承租房屋，除言明每月租金多寡外，並為約定租金應如何支付，試問，某甲應付之租金，應以何地為清償地?", "o": ["租賃房屋所在地", "承租人之承租前之住所地", "出租人營業處所", "出租人之住所地"], "a": 0}, {"id": "2-1-18", "c": 2, "s": 1, "n": "18", "p": 30, "q": "依民法之規定，未訂立字據的不動產租賃契約，其約定租賃期限，只要超過多久以上者，即依法視為不定期限之租賃？", "o": ["逾10年", "逾5年", "逾3年", "逾1年"], "a": 3}, {"id": "2-1-19", "c": 2, "s": 1, "n": "19", "p": 30, "q": "依民法之規定，出租人以違章建築並違規隔間後經承租人合意訂定租賃契約，該租賃契約是否合法?", "o": ["不合法", "須經主管機關許可使用", "合法", "須具有適居性，才合法"], "a": 2}, {"id": "2-1-20", "c": 2, "s": 1, "n": "20", "p": 30, "q": "依民法之規定，承租人於租賃期間發現該租賃物屬於俗稱的輻射屋，出租人雖於訂約時已告知該瑕疵，但承租人嗣後恐危及自己或家人之安全或健康時，試問，承租人可以作何主張？", "o": ["請求降低租金", "解除契約", "請求違約金及損害賠償", "終止契約"], "a": 3}, {"id": "2-1-21", "c": 2, "s": 1, "n": "21", "p": 30, "q": "依民法之規定，出租人將不動產出租於承租人，且期間未逾五年，不動產交付後，出租人卻將其所有權讓與第三人，對承租人之影響如何？", "o": ["租賃契約同時終止", "承租人可主張優先購權", "租賃契約對於受讓人仍繼續存在", "經受讓人同意始可繼續存在"], "a": 2}, {"id": "2-1-22", "c": 2, "s": 1, "n": "22", "p": 31, "q": "依民法之規定，出租人與承租人訂定五年以上或未定期限租賃契約，將其所有權讓與第三人，該租賃契約在何種情形下，不得適用買賣不破租賃之規定？", "o": ["未經公證", "未經認證", "未經律師見證", "未經地政士簽證"], "a": 0}, {"id": "2-1-23", "c": 2, "s": 1, "n": "23", "p": 31, "q": "依民法之規定，下列何種情形，在租賃關係存續中，承租人不得以「買賣不破租賃」主張該租賃契約仍繼續存在?", "o": ["租賃房屋未交付前出租人已移轉房屋所有權", "未經公證超過5年的定期租賃契約", "不定期租賃契約", "承租房屋交付後，出租人移轉房屋所有權"], "a": 0}, {"id": "2-1-24", "c": 2, "s": 1, "n": "24", "p": 31, "q": "某甲擬將房屋出租，擔心租期屆滿後，房屋返還發生糾紛，簽訂租賃契約時應尋求甚麼保障，較實惠又安全?", "o": ["辦理履約保證", "投保履約保險", "得逕付強制執行的公證", "要求增加保證人"], "a": 2}, {"id": "2-1-25", "c": 2, "s": 1, "n": "25", "p": 31, "q": "依民法之規定，租賃期間內的相關稅費負擔規定，下列敘述何者正確？", "o": ["房屋稅、地價稅由出租人負擔", "一切稅捐，由承租人負擔", "修繕義務由承租人負擔", "出租人必要之保存行為，費用由承租人負擔"], "a": 0}, {"id": "2-1-26", "c": 2, "s": 1, "n": "26", "p": 31, "q": "依民法之規定，租賃房屋之修繕義務，原則上由何者負擔?", "o": ["承租人修繕", "出租人負擔", "雙方共同負擔", "自然耗損，由出租人負擔"], "a": 1}, {"id": "2-1-27", "c": 2, "s": 1, "n": "27", "p": 32, "q": "承租人於租賃房屋中增設隔間並裝設空調設備，出租人知情且不反對，租期屆滿時，出租人應該如何償還？", "o": ["無需償還", "以增設時之價額償還", "以現存之價額償還", "要求取回，並回復原狀"], "a": 2}, {"id": "2-1-28", "c": 2, "s": 1, "n": "28", "p": 32, "q": "依民法規定，承租人在租賃期間使用租賃房屋時，應負有何種程度的注意義務？", "o": ["應盡普通人之注意", "應盡與處理自己事務為同一之注意", "應盡善良管理人之注意", "應盡企業經營者之注意"], "a": 2}, {"id": "2-1-29", "c": 2, "s": 1, "n": "29", "p": 32, "q": "某甲承租房屋，包括電視機一台，租賃期間因其兄的小孩在客廳嬉戲，不慎打破電視機的螢幕，誰應負損害賠償責任？", "o": ["出租人", "承租人之兄", "承租人", "承租人之兄的小孩"], "a": 2}, {"id": "2-1-30", "c": 2, "s": 1, "n": "30", "p": 32, "q": "承租人承租房屋，於租賃期間因使用不慎導致失火而毀損，試問，依民法規定承租人在何種情況下，應對於出租人負損害賠償責任？", "o": ["有過失，就要負責", "需有故意才應負責", "無過失，也要負責", "重大過失，才要負責"], "a": 3}, {"id": "2-1-31", "c": 2, "s": 1, "n": "31", "p": 32, "q": "依民法規定，承租人於租賃期間內遲延或拒付租金，出租人得主張終止租賃契約的條件，下列敘述何者正確？", "o": ["限期催告，承租人逾期不付，得終止契約", "遲付租金之總額，未達2個月之租額，仍得終止契約", "約定於每期開始時支付租金者，並應於遲延給付逾2個月時，始得終止契約", "遲付租金達2個月之租額，無須限期催告，即得終止租賃契約"], "a": 2}, {"id": "2-1-32", "c": 2, "s": 1, "n": "32", "p": 32, "q": "依民法之規定，房屋租賃契約簽訂後，因其價值之昇降，當事人得聲請法院增減其租金，此種情形只適用何種契約？", "o": ["定期租賃契約", "不定期租賃", "5年以上之租賃契約", "租地建屋"], "a": 1}, {"id": "2-1-33", "c": 2, "s": 1, "n": "33", "p": 33, "q": "依民法之規定，承租人於租賃期間內將房屋轉租他人，下列敘述，何者為正確？", "o": ["非經出租人承諾，不得轉租", "除有反對之約定外，可以轉租", "違反禁止轉租之契約，無效", "可向次承租人請求返還"], "a": 1}, {"id": "2-1-34", "c": 2, "s": 1, "n": "34", "p": 33, "q": "依民法之規定，承租人於租賃期間內將房屋轉租他人，如因次承租人之故意或過失損壞相關設施，出租人向誰請求賠償?", "o": ["次承租人與承租人負連帶賠償責任", "次承租人", "由法院判定", "承租人。"], "a": 3}, {"id": "2-1-35", "c": 2, "s": 1, "n": "35", "p": 33, "q": "依民法之規定，某甲將房屋出租予某乙，某乙又將房屋轉租某丙，租期未屆滿前某乙因積欠房租，經某甲主張終止租賃契約後，某丙仍繼續使用房屋，試問，某甲得以何種理由向某丙請求返還房屋？", "o": ["無權占有", "轉租賃契約同時終止", "竊占", "侵權行為"], "a": 0}, {"id": "2-1-36", "c": 2, "s": 1, "n": "36", "p": 33, "q": "依民法之規定，出租人就租賃契約所生之債權，對於承租人之物置於該租賃房屋內者，有留置權，但承租人擬取去時，出租人如何救濟？下列敘述何者為正確?", "o": ["聲請法院處理", "向警察局報案", "向地政機關申請為必要之處置", "可以不聲請法院逕行阻止其取去"], "a": 3}, {"id": "2-1-37", "c": 2, "s": 1, "n": "37", "p": 33, "q": "依民法關於租賃契約的期限，最長不得超過幾年？", "o": ["10年", "15年", "20年", "30年"], "a": 2}, {"id": "2-1-38", "c": 2, "s": 1, "n": "38", "p": 33, "q": "依民法之規定，租賃契約定有期限者，該租賃契約於何時，租賃關係即歸消滅?", "o": ["房屋點交時", "期限屆滿時", "房屋搬遷時", "押金返還時"], "a": 1}, {"id": "2-1-39", "c": 2, "s": 1, "n": "39", "p": 34, "q": "依民法之規定(不考慮特別法規定)，未定有期限的租賃契約，除有有利於承租人之習慣者外，何時可以終止租賃契約?", "o": ["承租人他遷時", "承租人另有住宅時", "隨時終止契約", "積欠1個月租金時"], "a": 2}, {"id": "2-1-40", "c": 2, "s": 1, "n": "40", "p": 34, "q": "依民法之規定(應一併考慮土地法規定)，未定有期限的租賃契約，除有有利於承租人之習慣者外，何時可以終止租賃契約?", "o": ["承租人他遷時", "應符合土地法有特別規定", "隨時終止契約", "積欠1個月租金時"], "a": 1}, {"id": "2-1-41", "c": 2, "s": 1, "n": "41", "p": 34, "q": "某甲與某乙有未定有期限的租賃契約，每3個月付租金一次，出租人想要終止租賃契約時，至少應在多久前先期通知?", "o": ["1個月前", "2個月前", "3個月前", "6個月前"], "a": 2}, {"id": "2-1-42", "c": 2, "s": 1, "n": "42", "p": 34, "q": "依民法規定，下列何者非屬不定期限之租賃?", "o": ["租期超過5年，未辦理公證", "租期屆滿後，承租人仍繼續居住，出租人不即表示反對", "租期逾1年，未訂立字據", "租賃契約並未訂定期限"], "a": 0}, {"id": "2-1-43", "c": 2, "s": 1, "n": "43", "p": 34, "q": "依民法規定，原定有租賃期限之契約，下列何者不會變成「視為以不定期限繼續契約」?", "o": ["租期屆滿後承租人仍繼續居住房屋", "出租人不即表示反對", "雙方並未另訂有期限之租賃契約", "雙方租期屆滿後另訂租賃契約"], "a": 3}, {"id": "2-1-44", "c": 2, "s": 1, "n": "44", "p": 34, "q": "依民法之規定，某甲向某乙房租房屋，租期屆滿後，承租人仍為租賃物之使用收益，而出租人不即表示反對之意思者，而依法視為以不定期限繼續契約。某乙後悔拒不按月收取租金，試問，某甲應如何處理?", "o": ["可以不付", "寄存於警察局", "提存於法院", "為某為受益人信託於金融機構"], "a": 2}, {"id": "2-1-45", "c": 2, "s": 1, "n": "45", "p": 35, "q": "依民法之規定，某甲向某乙承租房屋，租期屆滿後，某甲他遷不知去向。導致某乙無法將押金返還某甲，試問，下列敘述何者正確?", "o": ["可以沒收", "提存於警察局", "提存於法院提存所", "提存於法院公證處"], "a": 2}, {"id": "2-1-46", "c": 2, "s": 1, "n": "46", "p": 35, "q": "某甲向某乙承租房屋，以一年為期並按月付租，但租賃契約約定如某乙兒子回國時，雙方同意提前終止租約，試問，某甲要提前終止租約時，至少應在多久前通知某乙?", "o": ["1星期前", "半個月前", "由某甲自行決定", "1個月前"], "a": 3}, {"id": "2-1-47", "c": 2, "s": 1, "n": "47", "p": 35, "q": "某甲與某乙有定有一年為期限的租賃契約，租賃期間發生下列不得已的事由，依民法規定，下列何者可以主張提前終止租賃契約?", "o": ["承租人死亡", "承租人長期住院", "承租人因公司調職到他縣市", "承租人家中變故"], "a": 0}, {"id": "2-1-48", "c": 2, "s": 1, "n": "48", "p": 35, "q": "依約定或法律規定可提前終止租賃契約者，承租人依規定終止時，倘出租人收取之租金，尚有終止後始到期部分，是否應予返還?", "o": ["抵充違約金", "予以沒收", "應返還", "加倍返還"], "a": 2}, {"id": "2-1-49", "c": 2, "s": 1, "n": "49", "p": 35, "q": "依民法規定，出租人就租賃物所受損害對於承租人之賠償請求權，其請求權時效為幾年？", "o": ["1年", "2年", "5年", "15年"], "a": 1}, {"id": "2-1-50", "c": 2, "s": 1, "n": "50", "p": 35, "q": "依民法之規定，承租人之償還費用請求權及工作物取回權之請求權時效為幾年？", "o": ["1年", "2年", "5年", "15年"], "a": 1}, {"id": "2-1-51", "c": 2, "s": 1, "n": "51", "p": 36, "q": "依民法規定，出租人就租賃物所受損害對於承租人之賠償請求權時效，從何時起算？", "o": ["自租賃關係終止時起算", "自受損害時起算", "自受租賃物返還時起算", "自受受損害時起算30日起算"], "a": 2}, {"id": "2-1-52", "c": 2, "s": 1, "n": "52", "p": 36, "q": "依民法規定，承租人之償還費用請求權及工作物取回權之請求權時效，從何時起算？", "o": ["自租賃關係終止時起算", "自請求之日起算", "自租賃物返還時起算", "自請求日後30日起算"], "a": 0}, {"id": "2-1-53", "c": 2, "s": 1, "n": "53", "p": 36, "q": "依民法規定，下列何者非屬承租人可以終止租賃契約?", "o": ["危及安全或健康之瑕疵", "出租人逾期不修繕", "第三人主張權利，但不影響承租人使用", "房屋部分滅失，存餘部分不能達租賃之目的"], "a": 2}, {"id": "2-1-54", "c": 2, "s": 1, "n": "54", "p": 36, "q": "依民法規定，下列何者出租人不得終止租賃契約?", "o": ["承租人違反使用、收益之規定", "承租人酗酒鬧事", "承租人遲付租金", "承租人違反轉租規定"], "a": 1}, {"id": "2-1-55", "c": 2, "s": 1, "n": "55", "p": 36, "q": "依民法關於租賃契約的期限，最長不得超過20年，下列何種情形，可不受此限制？", "o": ["以押租金取代租金", "依租賃住宅市場發展及管理條例之包租契約", "法院判決", "房地同屬一人所有，僅將土地或房屋所有權讓與他人"], "a": 3}, {"id": "2-1-56", "c": 2, "s": 1, "n": "56", "p": 37, "q": "依民法規定，租用基地建築房屋者，承租人於契約成立後，可向出租人作何請求？", "o": ["租賃權之登記", "地上權之登記", "典權之登記", "抵押權之登記"], "a": 1}, {"id": "2-1-57", "c": 2, "s": 1, "n": "57", "p": 37, "q": "依民法之規定，租用基地建築房屋者，承租人得於契約成立後，向出租人請求為何種權利之登記?", "o": ["典權", "租賃權", "不動產役權", "地上權"], "a": 3}, {"id": "2-1-58", "c": 2, "s": 1, "n": "58", "p": 37, "q": "依民法規定，租用基地建築房屋者，承租人將房屋出售後，房屋承受人，對於基地有何權源?", "o": ["無權占有", "有地上權", "基地租賃", "使用借貸"], "a": 2}, {"id": "2-1-59", "c": 2, "s": 1, "n": "59", "p": 37, "q": "依民法規定，在租用基地建築房屋的關係下，出租人之下列何種行為，承租人有優先承買之權?", "o": ["出賣基地", "基地設定抵押", "基地設定不動產役權", "與毗鄰土地合併"], "a": 0}, {"id": "2-1-60", "c": 2, "s": 1, "n": "60", "p": 37, "q": "依民法規定，在租用基地建築房屋的關係下，承租人之下列何種行為，出租人有優先承買之權?", "o": ["將房屋出租時", "以房屋擔保設定抵押時", "出賣房屋時", "房屋增建時"], "a": 2}, {"id": "2-1-61", "c": 2, "s": 1, "n": "61", "p": 37, "q": "依民法規定，在租用基地建築房屋的關係下，房屋出賣時，下列何者有優先承買之權?", "o": ["房屋出典之典權人", "以房屋設定之抵押權人", "房屋承租人", "基地所有權人"], "a": 3}, {"id": "2-1-62", "c": 2, "s": 1, "n": "62", "p": 38, "q": "依民法規定(不考慮特別法規定)，在租用基地建築房屋的關係下，基地出賣時，下列何者有優先承買之權?", "o": ["基地之典權人", "土地抵押權人", "基地承租人", "地上權人"], "a": 2}, {"id": "2-1-63", "c": 2, "s": 1, "n": "63", "p": 38, "q": "依民法規定，在租用基地建築房屋的關係下，房屋或基地單獨出售，依法通知優先承買權人，優先承買權人於通知達到後至少多少日內未以書面表示承買者，視為放棄?", "o": ["5日", "7日", "15日", "10日"], "a": 3}, {"id": "2-1-64", "c": 2, "s": 1, "n": "64", "p": 38, "q": "依民法規定，在租用基地建築房屋的關係下，房屋或基地單獨出售，未依法通知優先承買權人時，所有權完成已登記完畢，優先承買權人如何主張?", "o": ["訴請法院判決塗銷所有權移轉登記", "向出賣人請求損害賠償", "向買受人請求損害賠償", "已完成登記，無法做任何主張"], "a": 0}, {"id": "2-2-01", "c": 2, "s": 2, "n": "01", "p": 39, "q": "依所得稅法規定，個人於中華民國境內之財產因租賃而取得之租金，係屬來源所得的一種，應課徵何種類型的所得稅?", "o": ["營利事業所得稅", "綜合所得稅", "房地合一所得稅", "租金所得稅"], "a": 1}, {"id": "2-2-02", "c": 2, "s": 2, "n": "02", "p": 39, "q": "某甲在我國境內無住所，依所得稅法規定，其課稅年度內在我國境內居留合計滿幾天，始得認定為境內居住之個人?", "o": ["200天", "163天", "183天", "240天"], "a": 2}, {"id": "2-2-03", "c": 2, "s": 2, "n": "03", "p": 39, "q": "依所得稅法規定，我國境內房屋出租而取得之租金，屬於何種所得?", "o": ["來源所得", "營利所得", "就源所得", "扣繳所得"], "a": 0}, {"id": "2-2-04", "c": 2, "s": 2, "n": "04", "p": 39, "q": "依租賃住宅市場發展及管理條例規定，個人住宅所有權人將住宅委託代管業或出租予包租業轉租，契約約定供居住使用1年以上者，其每戶每月租金收入，按何者規定課徵所得稅?", "o": ["新臺幣1萬元以下免徵", "新臺幣6千元以下免徵", "依所得稅法規定", "一律免徵"], "a": 1}, {"id": "2-2-05", "c": 2, "s": 2, "n": "05", "p": 39, "q": "依租賃住宅市場發展及管理條例規定，出租人將住宅出租委託代管業或出租予包租業轉租1年以上，其租金在一定金額以下免徵，其超過部分，其必要損耗及費用之減除未能提具確實證據者，如何計算其租金收入，下列敘述何者正確?", "o": ["超過新臺幣6千元至2萬元部分按43%計算", "超過新臺幣6千元至2萬元部分按53%計算", "超過新臺幣6千元至2萬元部分減半", "超過新臺幣2萬元部分按60%計算"], "a": 1}, {"id": "2-2-06", "c": 2, "s": 2, "n": "06", "p": 40, "q": "依所得稅法第14條第1項第5類規定，下列何種收入非租賃所得?", "o": ["財產出租之租金所得", "財產出典典價經運用之所得", "土地設定地上權取得之權利金", "著作權之版權收入"], "a": 3}, {"id": "2-2-07", "c": 2, "s": 2, "n": "07", "p": 40, "q": "依所得稅法規定，財產租賃所得之計算，以全年租賃收入減除何者之餘額為所得額?", "o": ["40%", "50%", "實際必要損耗及費用", "60%"], "a": 2}, {"id": "2-2-08", "c": 2, "s": 2, "n": "08", "p": 40, "q": "依所得稅法規定，設定定期之地上權取得之各種所得，視為下列那一類所得？", "o": ["利息所得", "財產交易所得", "租賃所得", "營利所得"], "a": 2}, {"id": "2-2-09", "c": 2, "s": 2, "n": "09", "p": 40, "q": "依所得稅法規定，於下列何種情形，稽徵機關不得參照當地一般租金調整設算租賃收入？", "o": ["未申報房屋出典之典價", "約定之租金顯較當地一般租金為低", "房屋無償借與二親等親屬經營餐廳", "房屋無償借與他人供住宅使用且已提出法院公證書"], "a": 3}, {"id": "2-2-10", "c": 2, "s": 2, "n": "10", "p": 40, "q": "依所得稅法規定，某甲將房屋無償出借於好友某乙供營業使用，應否課徵所得稅，下列敘述何者正確?", "o": ["照當地一般租金情況計算租賃收入繳納所得稅", "無償使用，免納所得稅", "照當地一般營業狀況計算租賃收入繳納所得稅", "經查明確係無償者，免徵"], "a": 0}, {"id": "2-2-11", "c": 2, "s": 2, "n": "11", "p": 40, "q": "依所得稅法規定，某甲經營長生養生村，乙一次性支付數百萬押租金，入住期間免按月支付租金，並約定入住者死亡或一定期間屆滿終止契約後無息返還押租金，試問，應以何者設算租賃收入?", "o": ["按郵政儲金匯業局之1年期存款利率", "按當地銀行業通行之1年期存款利率", "照郵政儲金2年期定期儲金固定利率", "依法定利率"], "a": 1}, {"id": "2-2-12", "c": 2, "s": 2, "n": "12", "p": 41, "q": "出租房屋而收取之押金或任何款項類似押金者，應依規定設算其租賃收入，於每年辦理結算申報時，應由誰辦理申報?", "o": ["代管業代為扣繳", "銀行代為扣繳", "承租人自行計算申報", "出租人自行計算申報"], "a": 3}, {"id": "2-2-13", "c": 2, "s": 2, "n": "13", "p": 41, "q": "依所得稅法規定，納稅義務人、配偶及受扶養直系親屬在中華民國境內租屋供自住且非供營業或執行業務使用者，其所支付之租金，每一申報戶每年之特別列舉扣除額上限是多少?", "o": ["12萬元", "18萬元", "24萬元", "36萬元"], "a": 1}, {"id": "2-2-14", "c": 2, "s": 2, "n": "14", "p": 41, "q": "依所得稅法規定，納稅義務人、配偶及受扶養直系親屬在中華民國境內租屋，需具備何種條件，其所支付之租金，得採列舉扣除額申報?", "o": ["供自住且執行業務使用者", "供自住兼供營業者", "供自住且非供營業或執行業務使用者，", "供營業或執行業務使用者"], "a": 2}, {"id": "2-3-01", "c": 2, "s": 3, "n": "01", "p": 42, "q": "房屋稅之課徵，依據何種法律？", "o": ["土地法", "房屋稅條例", "土地稅法", "平均地權條例"], "a": 1}, {"id": "2-3-02", "c": 2, "s": 3, "n": "02", "p": 42, "q": "房屋稅，屬於何種層級政府的財源", "o": ["中央政府", "省市政府", "直轄市或縣(市)政府", "鄉鎮市區公所"], "a": 2}, {"id": "2-3-03", "c": 2, "s": 3, "n": "03", "p": 42, "q": "依房屋稅條例規定，房屋稅課徵之對象所指為何，下列敘述何者正確?", "o": ["房屋及增加房屋使用價值之建築物", "建築改良物", "建築改良物及增加房屋使用價值之建築改良物", "房屋"], "a": 0}, {"id": "2-3-04", "c": 2, "s": 3, "n": "04", "p": 42, "q": "依房屋稅條例規定，房屋稅由部分共有人或承租人代繳時，下列敘述何者正確？", "o": ["管理人繳納，對所有人有求償權", "部分共有人代繳，對他共有人有求償權", "現住人繳納，對所有人有求償權", "承租人代繳，對出租人有求償權"], "a": 2}, {"id": "2-3-05", "c": 2, "s": 3, "n": "05", "p": 42, "q": "依房屋稅條例規定，房屋為信託財產者，於信託關係存續中，以何者為房屋稅納稅義務人?", "o": ["自益信託之委託人", "受託人", "他益信託之受益人", "受益人2人以上者，準用共有房屋之規定"], "a": 1}, {"id": "2-3-06", "c": 2, "s": 3, "n": "06", "p": 42, "q": "依房屋稅條例之規定，房屋供自住或公益出租人出租使用者，房屋稅的稅率是多少？", "o": ["1%", "1.2%", "1.5%", "3%"], "a": 1}, {"id": "2-3-07", "c": 2, "s": 3, "n": "07", "p": 43, "q": "依房屋稅條例之規定，有關俗稱囤房稅稅率之敘述，下列何者最為正確?", "o": ["最低不得少於其房屋現值百分之一點五，最高不得超過百分之二點四", "最低不得少於其房屋現值百分之二，最高不得超過百分之三點六", "最低不得少於其房屋現值百分之二，最高不得超過百分之四點八", "最低不少於其房屋現值百分之一點五，最高不超過百分之四點八"], "a": 3}, {"id": "2-3-08", "c": 2, "s": 3, "n": "08", "p": 43, "q": "依房屋稅條例之規定，非供自住或公益出租人出租使用之房屋，其訂定差別稅率(俗稱囤房稅)之基準為何?", "o": ["持有房屋棟數", "持有房屋面積", "持有房屋戶數", "持有房屋樓層數"], "a": 2}, {"id": "2-3-09", "c": 2, "s": 3, "n": "09", "p": 43, "q": "依房屋稅條例規定，有關房屋稅之稅率，下列敘述何者錯誤？", "o": ["全國單一自住且房屋現值在一定金額以下者為1%", "以土地設定地上權之使用權房屋並供該使用權人自住使用者，為其房屋現值1.2%", "出租房屋最低不得少於其房屋現值1.5%，最高不得超過2.4%", "房屋供地政士事務所使用者，最低不得少於其房屋現值3%，最高不得超過5%"], "a": 2}, {"id": "2-3-10", "c": 2, "s": 3, "n": "10", "p": 43, "q": "依房屋稅條例規定，下列有關自住使用之住家用房屋適用1%計徵房屋稅之要件，何者錯誤?", "o": ["無出租或供營業情形", "房屋所有人本人、配偶或直系親屬於該屋辦竣戶籍登記", "房屋所有人本人、配偶及未成年子女於全國僅持有一戶房屋且房屋現值在一定金額以下", "房屋所有人本人、配偶或直系親屬實際居住使用"], "a": 2}, {"id": "2-3-11", "c": 2, "s": 3, "n": "11", "p": 43, "q": "依房屋稅條例規定，起造人持有使用執照所載用途為住家用之待銷售房屋，於起課房屋稅二年內，其房屋稅之稅率為何?", "o": ["最低不得少於其房屋現值百分之一點二，最高不得超過百分之二點四", "最低不得少於其房屋現值百分之二，最高不得超過百分之三點六", "最低不得少於其房屋現值百分之二，最高不得超過百分之四點八", "最低不得少於其房屋現值百分之三，最高不得超過百分之五"], "a": 1}, {"id": "2-3-12", "c": 2, "s": 3, "n": "12", "p": 44, "q": "李先生擁有面積300平方公尺的房屋1幢，同時供住家及非住家使用。依現行房屋稅條例之規定，其適用非住家用稅率課徵房屋稅之面積，最低不得少於多少平方公尺？", "o": ["30平方公尺", "50平方公尺", "60平方公尺", "150平方公尺"], "a": 1}, {"id": "2-3-13", "c": 2, "s": 3, "n": "13", "p": 44, "q": "依房屋稅條例規定，各直轄市、縣(市)主管稽徵機關辦理房屋標準價格評定之組織名稱為何？", "o": ["地價評議委員會", "不動產評價委員會", "不動產仲裁委員會", "不動產糾紛調處委員會"], "a": 1}, {"id": "2-3-14", "c": 2, "s": 3, "n": "14", "p": 44, "q": "依房屋稅條例規定，不動產評價委員會之組成，其中專家學者及民間團體代表，不得少於委員總數多少？任一性別委員，不得少於委員總數多少？", "o": ["1/3,1/2", "1/2,1/3", "1/2,1/2", "2/3,2/5"], "a": 1}, {"id": "2-3-15", "c": 2, "s": 3, "n": "15", "p": 44, "q": "依房屋稅條例之規定，房屋稅納稅義務人應於房屋移轉完成之日起多少日內檢附有關文件，向當地主管稽徵機關申報房屋稅籍有關事項及使用情形？", "o": ["10日", "15日", "30日", "60日"], "a": 2}, {"id": "2-3-16", "c": 2, "s": 3, "n": "16", "p": 45, "q": "房屋使用情形變更，致其應納房屋稅額有增減者，下列敘述何者錯誤？", "o": ["變更致稅額增加者，納稅義務人應於變更之次期房屋稅開徵四十日以前向當地主管稽徵機關申報", "變更致稅額減少者，應於每期開徵四十日以前申報", "房屋使用情形變更致稅額增加者，自變更之次期開始適用", "使用情形變更致稅額增減者，應自變更之日起30日內申報，並於當期適用變更後之相應稅率"], "a": 3}, {"id": "2-3-17", "c": 2, "s": 3, "n": "17", "p": 45, "q": "下列何者非屬房屋標準價格之評定事項？", "o": ["房屋建造材料", "房屋耐用年數", "房屋使用面積", "房屋供需概況"], "a": 2}, {"id": "2-3-18", "c": 2, "s": 3, "n": "18", "p": 45, "q": "房屋標準價格多久重行評定一次？", "o": ["一年", "二年", "三年", "隨申報地價之日期"], "a": 2}, {"id": "2-3-19", "c": 2, "s": 3, "n": "19", "p": 45, "q": "依房屋稅條例規定，納稅義務人對於主管稽徵機關評定之房屋現值如有異議，得於接到通知書之日起幾日內，檢附證件，申請重行核計？", "o": ["10日", "15日", "30日", "60日"], "a": 2}, {"id": "2-3-20", "c": 2, "s": 3, "n": "20", "p": 45, "q": "房屋稅之納稅義務基準日為何？", "o": ["八月三十一日", "二月之末日", "四月三十日", "七月一日"], "a": 1}, {"id": "2-3-21", "c": 2, "s": 3, "n": "21", "p": 45, "q": "有關房屋稅之稽徵，下列何者錯誤？", "o": ["徵收期間為每年五月一日起至五月三十一日止", "課稅所屬期間為上一年七月一日起至當年六月三十日止", "課稅所屬期間為當年一月一日起至當年十二月三十一日止", "納稅義務基準日為每年二月之末日"], "a": 2}, {"id": "2-3-22", "c": 2, "s": 3, "n": "22", "p": 46, "q": "房屋新建、增建、改建或拆除，其房屋稅應如何稽徵?", "o": ["每年三月一日起至六月三十日止新建、增建或改建完成之房屋，該期間之房屋稅併入次期課徵", "上一年七月一日起至當年二月末日止拆除之房屋，其當期房屋稅免予課徵", "新建房屋，於當期建造完成者，按月比例計課，未滿六個月者不計", "改建房屋所核計之房屋現值，納稅義務人如有異議，得於接到通知書之日起十日內，檢附證件，申請重行核計"], "a": 0}, {"id": "2-3-23", "c": 2, "s": 3, "n": "23", "p": 46, "q": "有關房屋稅減免之規定，下列敘述何者正確？", "o": ["住家用房屋現值在新臺幣十萬元以下者免徵", "免稅之房屋，全國合計以三戶為限", "受重大災害，毀損面積占整棟面積五成以上，必須修復始能使用之房屋免徵", "受重大災害，毀損面積占整棟面積三成以上不及七成之房屋減半徵收"], "a": 2}, {"id": "2-3-24", "c": 2, "s": 3, "n": "24", "p": 46, "q": "依房屋稅條例規定，下列公有房屋，何者仍應課徵房屋稅？", "o": ["政府機關辦公房屋及其員工宿舍", "遭他人占用之房舍", "農林試驗所所用之房屋", "救濟機構之房屋及其員工宿舍"], "a": 1}, {"id": "2-3-25", "c": 2, "s": 3, "n": "25", "p": 46, "q": "依房屋稅條例規定，下列房屋，何者免徵房屋稅？", "o": ["政府平價配售之平民住宅", "合法登記之工廠供直接生產使用之自有房屋", "受重大災害，毀損面積佔整棟面積5成以上，必須修復始能使用之房屋", "受重大災害，毀損面積佔整棟面積3成以上不及5成之房屋"], "a": 2}, {"id": "2-3-26", "c": 2, "s": 3, "n": "26", "p": 46, "q": "依房屋稅條例規定，私有房屋有下列何種情形，免徵房屋稅？", "o": ["司法保護事業所有之房屋", "農會所有之自用倉庫及檢驗場，經主管機關證明者", "合法登記之工廠供直接生產使用之自有房屋", "受重大災害，毀損面積佔整棟面積3成以上不及5成之房屋"], "a": 0}, {"id": "2-3-27", "c": 2, "s": 3, "n": "27", "p": 46, "q": "依房屋稅條例規定，私有房屋有下列何種情形，其房屋稅減半徵收？", "o": ["政府出售之國民住宅", "政府出售之合宜住宅", "政府配供貧民居住之房屋", "政府平價配售之平民住宅"], "a": 3}, {"id": "2-3-28", "c": 2, "s": 3, "n": "28", "p": 47, "q": "依房屋稅條例規定，私有房屋有下列情形之一者，其房屋稅減半徵收？", "o": ["完成財團法人登記且經立案之私立學校辦公使用之自有房屋", "無償供政府機關公用或供軍用之房屋", "受重大災害，毀損面積佔整棟面積3成以上不及5成之房屋", "農會所有之倉庫，專供糧政機關儲存公糧，經主管機關證明者"], "a": 2}, {"id": "2-3-29", "c": 2, "s": 3, "n": "29", "p": 47, "q": "依房屋稅條例規定，納稅義務人未依規定期限申報，因而發生漏稅者，下列述何者正確？", "o": ["責令補繳並按所漏稅額處以3倍罰鍰", "責令補繳並按所漏稅額處以2倍以下罰鍰", "按所漏稅額處以2倍以下罰鍰", "按所漏稅額處以1倍以下罰鍰"], "a": 1}, {"id": "2-3-30", "c": 2, "s": 3, "n": "30", "p": 47, "q": "依房屋稅條例條規定，房屋稅徵收細則之擬訂，應循何種程序?", "o": ["各直轄市及縣(市)政府訂定，報各縣市議會備查", "各直轄市及縣(市)政府訂定，報財政部備查", "財政部訂定報行政院備查", "各直轄市及縣(市)政府訂定，報內政部備查"], "a": 1}, {"id": "2-4-01", "c": 2, "s": 4, "n": "01", "p": 48, "q": "依土地稅法規定，以土地為信託財產，信託關係存續中，以何者為地價稅之納稅義務人？", "o": ["受託人", "委託人", "受益人", "由受託人與受益人推派一人"], "a": 0}, {"id": "2-4-02", "c": 2, "s": 4, "n": "02", "p": 48, "q": "依土地稅法規定，以土地為信託財產，信託利益之受益人為委託人者，其地價稅之計算，該土地應與何者在同一直轄市或縣（市）轄區內所有之土地合併計算地價總額？", "o": ["受託人", "委託人", "受益人", "由受託人與受益人推派一人"], "a": 1}, {"id": "2-4-03", "c": 2, "s": 4, "n": "03", "p": 48, "q": "依土地稅法規定，以土地為信託財產，信託利益之受益人為委託人以外之第三人，且該受益人已確定並享有全部信託利益者，其地價稅之計算，該土地應與何者在同一直轄市或縣（市）轄區內所有之土地合併計算地價總額？", "o": ["受託人", "委託人", "受益人", "由受託人與受益人推派一人"], "a": 2}, {"id": "2-4-04", "c": 2, "s": 4, "n": "04", "p": 48, "q": "下列何者非屬得指定土地使用人負責代繳其使用部分地價稅之情形?", "o": ["納稅義務人戶籍不在所在地", "權屬不明", "無人管理", "土地所有權人申請由占有人代繳"], "a": 0}, {"id": "2-4-05", "c": 2, "s": 4, "n": "05", "p": 48, "q": "下列相關人設立戶籍於該地，何者不符自用住宅用地之條件?", "o": ["配偶", "岳父", "土地所有權人", "兄弟"], "a": 3}, {"id": "2-4-06", "c": 2, "s": 4, "n": "06", "p": 49, "q": "下列何者不符自用住宅用地之條件?", "o": ["違章建築供住宅使用的土地", "工業區違規作住宅使用的土地", "尚未建築的住宅區土地", "商業區作住宅使用的土地"], "a": 2}, {"id": "2-4-07", "c": 2, "s": 4, "n": "07", "p": 49, "q": "下列何者符合自用住宅用地「無出租或供營業用」之條件?", "o": ["有收租金，未訂書面租約", "禁止承租人設立戶籍", "訂定借貸使用契約，定期收取使用償金", "將外牆出租作廣告使用"], "a": 3}, {"id": "2-4-08", "c": 2, "s": 4, "n": "08", "p": 49, "q": "某戶房屋除土地所有權人或其配偶、直系親屬外，尚有他人設有戶籍，試問，下列何種情形，會被推定有「出租」?", "o": ["親友因學區關係而設籍", "前屋主出售後戶籍未遷離", "親友無償借住，未經公證", "二親等旁系血親無償居住使用"], "a": 2}, {"id": "2-4-09", "c": 2, "s": 4, "n": "09", "p": 49, "q": "依土地稅法規定，下列土地何者不課徵地價稅?", "o": ["農舍用地", "一般農業區甲種建築用地", "山坡地保育區丙種建築用地", "都市計畫住宅區"], "a": 0}, {"id": "2-4-10", "c": 2, "s": 4, "n": "10", "p": 49, "q": "依土地稅法規定，所稱之「規定地價」，係依據下列何種法律規定辦理？", "o": ["土地法", "平均地權條例", "土地稅法", "不動產估價師法"], "a": 1}, {"id": "2-4-11", "c": 2, "s": 4, "n": "11", "p": 49, "q": "依土地稅法規定，應以何者為課徵地價稅的稅基?", "o": ["土地市價總額", "公告土地現值總額", "歸戶之申報地價總額", "按土地市價之一定比例計算"], "a": 2}, {"id": "2-4-12", "c": 2, "s": 4, "n": "12", "p": 49, "q": "依土地稅法規定，下列土地未依法建築使用，何者非被認定為空地所衡量的要素?", "o": ["道路設施", "電力設施", "排水設施", "瓦斯系統"], "a": 3}, {"id": "2-4-13", "c": 2, "s": 4, "n": "13", "p": 50, "q": "依土地稅法規定，土地雖已依法建築使用仍被認定應予增建、改建或重建而視為空地，下列敘述何者正確?", "o": ["建物價值不及所占基地申報地價10%者", "建物之評定現值不及所占基地公告土地現值10%者", "建築工程完成未滿1年以上者", "經認定危險建築未重建者"], "a": 0}, {"id": "2-4-14", "c": 2, "s": 4, "n": "14", "p": 50, "q": "依土地稅法規定，凡經直轄市或縣(市)政府核定應徵空地稅之土地，按該宗土地應納空地稅以何種標準課徵?", "o": ["基本稅額加徵3至5倍", "基本稅額加徵2至5倍", "基本稅額加徵5至15倍", "基本稅額加徵5至10倍"], "a": 1}, {"id": "2-4-15", "c": 2, "s": 4, "n": "15", "p": 50, "q": "依土地稅法規定，直轄市或縣(市)主管機關如擬加徵空地稅，其加徵倍數之決定，下列敘述何者正確?", "o": ["由直轄市或縣(市)主管機關逕行決定", "視都市發展情形擬訂，報議會同意", "視都市發展情形擬訂，報財政部同意", "視都市發展情形擬訂，報行政院核定"], "a": 3}, {"id": "2-4-16", "c": 2, "s": 4, "n": "16", "p": 50, "q": "某甲於台北市有3筆空地、1筆自用住宅用地；於台中市有1筆自用住宅用地、1筆公共設施保留地；於台南市有2筆商業用地。請問某甲於全國共有幾張地價稅單?", "o": ["8張", "5張", "4張", "3張"], "a": 3}, {"id": "2-4-17", "c": 2, "s": 4, "n": "17", "p": 50, "q": "依土地稅法規定，個人之地價總額未超過累進起點地價者，地價稅是按基本稅率徵收。試問，基本稅率是多少?", "o": ["千分之2", "千分之5", "萬分之10", "千分之10"], "a": 3}, {"id": "2-4-18", "c": 2, "s": 4, "n": "18", "p": 50, "q": "依土地稅法規定，累進起點地價，是以各該直轄市或縣(市)土地多少面積之平均地價為準?", "o": ["3公畝", "5公畝", "7公畝", "10公畝"], "a": 2}, {"id": "2-4-19", "c": 2, "s": 4, "n": "19", "p": 51, "q": "依土地稅法規定，累進起點地價，以各該直轄市或縣(市)土地7公畝之平均地價為準，但不包括部分用地，下列敘述何種用地應計算在內?", "o": ["工業用地", "礦業用地", "未使用之公共設施保留地", "蓋違建的農業用地"], "a": 3}, {"id": "2-4-20", "c": 2, "s": 4, "n": "20", "p": 51, "q": "依土地稅法規定，地價總額超過累進起點地價，其最高邊際稅率是多少?", "o": ["千分之55", "萬分之55", "千分之45", "萬分之45"], "a": 0}, {"id": "2-4-21", "c": 2, "s": 4, "n": "21", "p": 51, "q": "依土地稅法規定，某甲土地符合自用住宅用地，在一定面積以內，其優惠稅率是多少?", "o": ["千分之2", "千分之5", "萬分之10", "千分之10"], "a": 0}, {"id": "2-4-22", "c": 2, "s": 4, "n": "22", "p": 51, "q": "依土地稅法規定，某甲土地符合自用住宅用地，在多少面積以內，可以按優惠稅率徵收，下列敘述何者為正確?", "o": ["都市土地3公畝及非都市土地7公畝以內", "都市土地7公畝或非都市土地3公畝以內", "都市土地3公畝以及非都市土地7公畝以內", "都市土地3公畝或非都市土地7公畝以內"], "a": 3}, {"id": "2-4-23", "c": 2, "s": 4, "n": "23", "p": 51, "q": "依土地稅法規定，下列何者是勞工宿舍?", "o": ["興建商業設施兼供勞工居住之用", "興建辦公室兼供勞工居住之用", "興建廠房兼供勞工居住之用", "興建之目的專供勞工居住之用"], "a": 3}, {"id": "2-4-24", "c": 2, "s": 4, "n": "24", "p": 51, "q": "依土地稅法規定，某甲有4處自用住宅用地均無出租或營業。1戶供父母居住，1戶供成年子女居住；另2戶供自己與配偶及未成年小孩一起居住。在不考慮其他條件下，某甲有幾處可以適用自用住宅用地優惠稅率?", "o": ["1戶", "2戶", "3戶", "4戶"], "a": 2}, {"id": "2-4-25", "c": 2, "s": 4, "n": "25", "p": 52, "q": "依土地稅法規定，土地所有權人申請地價稅之自用住宅用地優惠稅率超過一處時，原則應以以土地所有權人擇定之戶籍所在地為準，但土地所有權人未擇定者，應如何擇定?", "o": ["地價稅額最高者", "按土地所有權人、配偶、未成年受扶養親屬戶籍之順序認定", "課稅面積最大者", "每平方公尺申報地價最高者"], "a": 0}, {"id": "2-4-26", "c": 2, "s": 4, "n": "26", "p": 52, "q": "依土地稅法規定，土地所有權人與其配偶或未成年之受扶養親屬分別以其所有土地申請自用住宅用地者，如未共同擇定適用之戶籍所在地，稽徵機關將如何擇定?", "o": ["土地所有權人", "配偶", "未成年受扶養親屬", "以三者申請當年度之自用住宅用地地價稅最高者為準"], "a": 3}, {"id": "2-4-27", "c": 2, "s": 4, "n": "27", "p": 52, "q": "依土地稅法規定，某乙有4戶(不同地點)均無出租或營業，1戶在鄉下老家，偶而回去住但未設籍，另3戶供自己與配偶及未成年的小孩一起居住但僅設籍於1戶，其他2戶也未設籍，試問，某甲可以適用自用住宅用地優惠稅率有幾戶?", "o": ["1戶", "2戶", "3戶", "4戶"], "a": 0}, {"id": "2-4-28", "c": 2, "s": 4, "n": "28", "p": 52, "q": "依土地稅法規定，為發展經濟，促進土地利用，增進社會福利，對於某種條件之土地得予適當之減免；其減免標準及程序，授權何種機關定之？", "o": ["直轄市或縣(市)政府", "財政部", "內政部", "行政院"], "a": 3}, {"id": "2-4-29", "c": 2, "s": 4, "n": "29", "p": 52, "q": "依土地稅法規定，下列何種用地不得適用以基本稅率為固定稅率課徵地價稅？", "o": ["私立動物園用地", "寺廟、教堂用地", "都市計畫行政區土地", "經主管機關核准設置之加油站"], "a": 2}, {"id": "2-4-30", "c": 2, "s": 4, "n": "30", "p": 53, "q": "都市計畫公共設施保留地，在保留期間未作任何使用並與使用中之土地隔離者，如何課徵地價稅？", "o": ["千分之2", "千分之6", "減半", "免徵"], "a": 3}, {"id": "2-4-31", "c": 2, "s": 4, "n": "31", "p": 53, "q": "依土地稅法規定，關於各種用地的適用優惠稅率或免徵地價稅，下列敘述何者正確？", "o": ["依法核定之工業區土地按千分之6計徵", "已辦妥寺廟登記之寺廟，按千分之10計徵", "經核准設立之私立公園，免徵", "都市計畫公共設施保留地仍為建築使用者，按千分之2"], "a": 1}, {"id": "2-4-32", "c": 2, "s": 4, "n": "32", "p": 53, "q": "依土地稅法規定，每期地價稅，每戶稅額在新台幣多少元以下免予課徵?", "o": ["50元", "100元", "150元", "200元"], "a": 1}, {"id": "2-4-33", "c": 2, "s": 4, "n": "33", "p": 53, "q": "依土地稅法規定，地價稅多久徵收一次?", "o": ["1年2期", "1季1期", "視政府公告為準", "1年1期"], "a": 3}, {"id": "2-4-34", "c": 2, "s": 4, "n": "34", "p": 53, "q": "甲之土地於114年10月1日出售並移轉登記予乙。試問，依土地稅法之規定，114年期的地價稅之納稅義務人為何？", "o": ["依各自持有月數分別負擔", "甲乙協議", "甲", "乙"], "a": 2}, {"id": "2-4-35", "c": 2, "s": 4, "n": "35", "p": 53, "q": "某甲購買房地供作自用住宅用地使用，但在取得產權同時並未申請適用優惠稅率，試問，下列敘述何者正確?", "o": ["地價稅開徵60日前申請，即可適用", "地價稅開徵40日前申請，即可適用", "地價稅開徵日前申請，即可適用", "逾期申請者，即以一般稅率課徵"], "a": 1}, {"id": "2-4-36", "c": 2, "s": 4, "n": "36", "p": 54, "q": "自用住宅用地，是否每年均需申請適用優惠稅率，試問，下列敘述何者正確?", "o": ["已核定而用途未變更，以後免再申請", "每3年申請1次", "每2年申請1次", "原因事實消滅，仍免申報"], "a": 0}, {"id": "2-4-37", "c": 2, "s": 4, "n": "37", "p": 54, "q": "依土地稅法規定，主管稽徵機關應於每年地價稅開徵前多少日，將適用特別稅率之有關規定及其申請手續公告週知?", "o": ["15日前", "30日前", "60日前", "90日前"], "a": 2}, {"id": "2-4-38", "c": 2, "s": 4, "n": "38", "p": 54, "q": "依土地稅法規定，某甲的土地原適用自用住宅用地之優惠稅率，但經過1年之後，改為營業使用，未向主管機關主動申報，主管機關除會追補稅款外，並得處多少倍以下之罰鍰?", "o": ["10倍", "5倍", "2倍", "3倍"], "a": 3}, {"id": "2-5-01", "c": 2, "s": 5, "n": "01", "p": 55, "q": "依所得稅法之規定，財產無償借與他人使用時，下列說明何者為所得稅法之規定?", "o": ["皆應參照當地一般租金情況，計算租賃收入，繳納所得稅。", "除經查明確係無償供營業或執行業務者使用外，皆應參照當地一般租金情況，計算租賃收入，繳納所得稅。", "皆應參照當地一般租金情況，計算租賃收入，且不得扣除必要耗損及費用。", "無需申報租賃所得及繳納所得稅。"], "a": 1}, {"id": "2-5-02", "c": 2, "s": 5, "n": "02", "p": 55, "q": "所得稅法有關押金之規定，下列何者正確?", "o": ["財產出租，收有押金或任何款項類似押金者，均應就各該款項按當地銀行業通行之1年期存款利率，計算租賃收入", "財產出租，收有押金或任何款項類似押金者，均應就各該款項按當地銀行業通行之6個月存款利率，計算租賃收入", "財產出租，收有押金或任何款項類似押金者，均應就各該款項按當地銀行業通行之1年貸款利率，計算租賃收入", "財產出租，收有押金或任何款項類似押金者，均應就各該款項按當地銀行業通行之6個月貸款利率，計算租賃收入"], "a": 0}, {"id": "2-5-03", "c": 2, "s": 5, "n": "03", "p": 55, "q": "所得稅法有關租金所得之規定，下列何者正確？", "o": ["租金所得應由扣繳義務人於給付時，依規定之扣繳率或扣繳辦法，扣取稅款", "租金所得應由納稅義務人於收取時，依規定之扣繳率或扣繳辦法，扣取稅款繳至稅局", "租金所得稅金應由扣繳義務人負擔並自行扣繳稅款繳至稅局", "租金所得應由納稅義務人分離課稅申報租金收入"], "a": 0}, {"id": "2-5-04", "c": 2, "s": 5, "n": "04", "p": 55, "q": "依所得稅法之規定，承租人如自然人且為中華民國居住者，請問租金所得之稅額扣繳及申報，下列說明何者較為正確?", "o": ["由出租方納稅義務人自行扣繳稅款並繳於國庫", "自然人承租方非扣繳義務人，無須代出租方扣繳稅款，納稅義務人於所得隔年5月1日至5月31日依租約自行申報租金所得及納稅", "納稅義務人該筆所得免稅", "自然人承租方依法為扣繳義務人，應依規定期間及扣繳率進行扣繳義務"], "a": 1}, {"id": "2-5-05", "c": 2, "s": 5, "n": "05", "p": 56, "q": "依所得稅法之規定，扣繳義務人行蹤不明，下列說明何者為所得稅法之規定?", "o": ["扣繳義務人未履行扣繳責任，稽徵機關不得逕向納稅義務人徵收稅款之", "扣繳義務人未履行扣繳責任，納稅義務人無需納稅", "扣繳義務人未履行扣繳責任，稽徵機關得逕向納稅義務人徵收收取罰鍰", "扣繳義務人未履行扣繳責任，而有行蹤不明或其他情事，致無從追究者，稽徵機關得逕向納稅義務人徵收之"], "a": 3}, {"id": "2-5-06", "c": 2, "s": 5, "n": "06", "p": 56, "q": "依各類所得扣繳率標準之規定，納稅義務人為中華民國境內居住之個人，有關租金之所得扣繳率下列何者正確?", "o": ["20%", "15%", "5%", "10%"], "a": 3}, {"id": "2-5-07", "c": 2, "s": 5, "n": "07", "p": 56, "q": "依各類所得扣繳率標準之規定，納稅義務人為非中華民國境內居住之個人，有關租金之所得扣繳率下列何者正確?", "o": ["20%", "15%", "5%", "10%"], "a": 0}, {"id": "2-5-08", "c": 2, "s": 5, "n": "08", "p": 56, "q": "依所得稅法及施行細則規定，將財產無償借與他人使用者時，下列說明何者最正確?", "o": ["應由雙方當事人訂立無償借用契約，經雙方當事人以外之2人證明確係無償借用", "無須申報租金收入", "只需由雙方當事人訂立無償借用契約以資證明", "無需申報租金收入，但出借人需申報贈與"], "a": 0}, {"id": "2-5-09", "c": 2, "s": 5, "n": "09", "p": 56, "q": "依各類所得扣繳率標準規定，中華民國境內居住之個人，其每次應扣繳稅額多少者，扣繳義務人得免辦理扣繳？", "o": ["每次應扣繳稅額不超過新臺幣1,000元者，免予扣繳", "每次應扣繳稅額不超過新臺幣20,000元者，免予扣繳", "每次應扣繳稅額不超過新臺幣10,000元者，免予扣繳", "每次應扣繳稅額不超過新臺幣2,000元者，免予扣繳"], "a": 3}, {"id": "2-5-10", "c": 2, "s": 5, "n": "10", "p": 57, "q": "依全民健康保險法及相關解釋，租金所得單次給付達多少需扣繳二代健保，下列何者正確?", "o": ["新臺幣20,000元", "新臺幣2,000元", "新臺幣5,000元", "最低工資"], "a": 0}, {"id": "2-5-11", "c": 2, "s": 5, "n": "11", "p": 57, "q": "依財產租賃必要損耗及費用標準相關規定，中華民國境內居住之個人僅出租土地之收入，必要損耗及費用之規定，下列規定何者較正確?", "o": ["不得減除該土地當年度繳納之地價稅及當年標準所訂之費用耗損率", "得減除當年標準所訂之費用耗損率但不得減除該土地當年度繳納之地價稅", "只得減除該土地當年度繳納之地價稅，不得減除當年標準所訂之費用耗損率", "得減除該土地當年度繳納之地價稅及當年標準所訂之費用耗損率"], "a": 2}, {"id": "2-5-12", "c": 2, "s": 5, "n": "12", "p": 57, "q": "依所得稅法及其施行細則相關規定，納稅義務人、配偶及受扶養直系親屬在中華民國境內租屋供自住且非供營業或執行業務使用者，其所支付之租金特別扣除額之規定，下列規定何者較正確?", "o": ["每一申報戶每年特別扣除額以270,000元為限。但申報有購屋借款利息者，不得扣除", "每一個人每年特別扣除額以270,000元為限", "每一申報戶每年特別扣除額以180,000元為限。但申報有購屋借款利息者，不得扣除", "每一個人每年特別扣除額以120,000元為限"], "a": 2}, {"id": "2-5-13", "c": 2, "s": 5, "n": "13", "p": 57, "q": "依所得稅法規定，非中華民國境內居住者之所得申報敘述，下列何者較正確?", "o": ["在中華民國境內有租賃所得者，其應納所得稅應由扣繳義務人於給付時，依規定之扣繳率扣繳之", "於所得年度次年5月1日至5月31日申報租賃所得", "依稅局核定稅額繳納之", "非中華民國境內居住者，故其所得免稅"], "a": 0}, {"id": "2-5-14", "c": 2, "s": 5, "n": "14", "p": 58, "q": "依所得稅法及施行細則規定，納稅義務人申報機關之說明，下列何者較正確?", "o": ["營利事業應向其申報時營運所在地之稽徵機關辦理申報", "綜合所得稅納稅義務人應向其申報時戶籍所在地稽徵機關辦理申報", "營利事業之總機構在中華民國境內，並設有其他固定營業場所者，應由該營利事業之總機構向其申報時營運地之稽徵機關合併辦理申報", "國外營利事業在中華民國境內無固定營業場所而有營業代理人者，營業代理人應向其申報時營運地之稽徵機關辦理申報"], "a": 1}, {"id": "3-1-01", "c": 3, "s": 1, "n": "01", "p": 59, "q": "依照消費者保護法及其相關規定，關於消費爭議之調解，當事人不能合意但已甚接近者，調解委員得斟酌一切情形，求兩造利益之平衡，於不違反兩造當事人之主要意思範圍內，依職權提出解決事件之方案，並送達於當事人。當事人若有異議，得於通知送達後幾日之不變期間內提出異議，否則，視為該方案已調解成立？", "o": ["10日", "15日", "20日", "30日"], "a": 0}, {"id": "3-1-02", "c": 3, "s": 1, "n": "02", "p": 59, "q": "依照消費者保護法及其相關規定，企業經營者與消費者訂立定型化契約前，應有多少日內之合理期間，供消費者審閱全部條款內容？", "o": ["10日", "15日", "20日", "30日"], "a": 3}, {"id": "3-1-03", "c": 3, "s": 1, "n": "03", "p": 59, "q": "依照消費者保護法及其相關規定，直轄市、縣（市）政府應設置何單位，辦理消費者之諮詢服務、教育宣導及申訴事項？", "o": ["消費者保護委員會", "消費者保護團體", "消費者服務中心", "消費爭議調解委員會"], "a": 2}, {"id": "3-1-04", "c": 3, "s": 1, "n": "04", "p": 59, "q": "依照消費者保護法及其相關規定，消費者保護團體以自己名義提起消費者保護法第50條之訴訟，其標的價額超過新台幣多少者，超過部分免繳裁判費？", "o": ["30萬元", "50萬元", "40萬元", "60萬元"], "a": 3}, {"id": "3-1-05", "c": 3, "s": 1, "n": "05", "p": 60, "q": "依照消費者保護法及其相關規定，定型化契約條款如有疑義時，應如何處理？", "o": ["應為有利於企業經營者之解釋", "應為有利於消費者之解釋", "應由當事人雙方自行協議", "應提起消費者爭議調解"], "a": 1}, {"id": "3-1-06", "c": 3, "s": 1, "n": "06", "p": 60, "q": "依照消費者保護法及其相關規定，消費者保護團體之設立宗旨為何？", "o": ["保護消費者權益，推行消費者教育", "接受消費者申訴，調解消費爭議", "提昇國民消費生活品質", "提供消費者資訊諮詢，檢驗商品、服務品質"], "a": 0}, {"id": "3-1-07", "c": 3, "s": 1, "n": "07", "p": 60, "q": "依照消費者保護法及其相關規定，建商銷售房屋致使眾多購屋者受害時，得受讓多少人以上之購屋者的損害賠償請求權後，消費者保護團體得以自己名義提起訴訟？", "o": ["10人", "20人", "15人", "5人"], "a": 1}, {"id": "3-1-08", "c": 3, "s": 1, "n": "08", "p": 60, "q": "依照消費者保護法及其相關規定，當事者接獲消費爭議之調解事件解決方案書時，若未能在送達後幾日內之不變期間提出異議者，則視為已依該方案成立調解？", "o": ["10日", "15日", "20日", "3日"], "a": 0}, {"id": "3-1-09", "c": 3, "s": 1, "n": "09", "p": 60, "q": "依照消費者保護法及其相關規定，關於小額消費爭議之額度，是由何者訂之？", "o": ["行政院", "消費者保護團體", "消保官", "消費爭議調解委員會"], "a": 0}, {"id": "3-1-10", "c": 3, "s": 1, "n": "10", "p": 60, "q": "依消費者保護法之規定，定型化契約條款如有疑義時，應為有利於何人之解釋？", "o": ["企業經營者", "政府", "消費者", "消費者保護團體"], "a": 2}, {"id": "3-1-11", "c": 3, "s": 1, "n": "11", "p": 61, "q": "依照消費者保護法及其相關規定，企業經營者與消費者訂立定型化契約前，如未能提供合理期間供消費者審閱全部條款內容時，下列何者正確？", "o": ["其條款無需經消費者之主張，仍構成契約之內容", "其條款不構成契約之內容，且消費者亦不得主張該條款構成契約之內容", "其條款不構成契約之內容，但消費者得主張該條款仍構成契約之內容", "其條款構成契約之內容，但消費者得主張該條款不構成契約之內容"], "a": 2}, {"id": "3-1-12", "c": 3, "s": 1, "n": "12", "p": 61, "q": "依照消費者保護法及其相關規定，定型化契約中之定型化契約條款牴觸個別磋商條款之約定時，下列何者正確？", "o": ["定型化契約中之定型化契約條款牴觸個別磋商條款部分無效", "個別磋商條款牴觸定型化契約中之定型化契約條款部分無效", "定型化契約中之定型化契約條款牴觸個別磋商條款時，兩者皆無效", "定型化契約中之定型化契約條款牴觸個別磋商條款時，兩者皆有效，以有利消費者之條款為主"], "a": 0}, {"id": "3-1-13", "c": 3, "s": 1, "n": "13", "p": 61, "q": "依消費者保護法第45條之規定，直轄市、縣（市）政府應設消費爭議調解委員會，並置委員幾名？", "o": ["5至7名", "5至9名", "7至21名", "15至21名"], "a": 2}, {"id": "3-1-14", "c": 3, "s": 1, "n": "14", "p": 61, "q": "依照消費者保護法及其相關規定，由消費者保護官同意後，得以自己之名義，依消費者保護法提起第50條消費者損害賠償訴訟或第53條不作為訴訟之消費者保護團體，須經許可設立多少年以上？", "o": ["5年", "4年", "3年", "2年"], "a": 3}, {"id": "3-1-15", "c": 3, "s": 1, "n": "15", "p": 61, "q": "依消費者保護法所提之訴訟，因企業經營者之故意所致之損害，消費者得請求損害額多少倍以下之懲罰性賠償金？", "o": ["3倍", "5倍", "7倍", "10倍"], "a": 1}, {"id": "3-1-16", "c": 3, "s": 1, "n": "16", "p": 62, "q": "依消費者保護法規定，企業經營者使用定型化契約者，主管機關得隨時派員查核，倘阻撓調查，依法單次最高將處新臺幣多少萬元以下罰鍰？", "o": ["10萬元", "15萬元", "20萬元", "30萬元"], "a": 3}, {"id": "3-1-17", "c": 3, "s": 1, "n": "17", "p": 62, "q": "依照消費者保護法及其相關規定，所謂「企業經營者為與多數消費者訂立同類契約之用，所提出預先擬定之契約條款」，依消費者保護法規定，係指下列何者？", "o": ["個別磋商條款", "預擬契約條款", "定型化契約條款", "合意契約條款"], "a": 2}, {"id": "3-1-18", "c": 3, "s": 1, "n": "18", "p": 62, "q": "依照消費者保護法及其相關規定，若認為企業經營者提供商品或服務有損害消費者生命、健康之虞者，下列何者為直轄市或縣(市)政府應有的作為？", "o": ["等有通報再對企業經營者進行調查", "應立即進行調查", "因檢查結果涉及企業經營者，所以不必公開調查結果", "派員秘密調查，因此檢查員不必出示證件"], "a": 1}, {"id": "3-1-19", "c": 3, "s": 1, "n": "19", "p": 62, "q": "依消費者保護法之規定，下列敘述何者正確？", "o": ["從事製造商品之企業經營者，就其市場商品符合當時科技水準合理期待的安全性之事實，負擔舉證責任", "消費者因企業經營者過失所致之損害，依本法向法院提起訴訟者，得請求損害額3倍以下之懲罰性賠償金", "企業經營者對於消費者因信賴媒體所刊明知或可得而知之不實廣告內容所致之損害，不須負擔損害賠償責任", "輸入商品之企業經營者，對於因其所輸入之商品而致消費者的健康受有損害時，其應負之責任為過失責任"], "a": 0}, {"id": "3-1-20", "c": 3, "s": 1, "n": "20", "p": 62, "q": "依照消費者保護法及其相關規定，直轄市、縣（市）政府應設何單位辦理消費者之諮詢服務、教育宣導、申訴等事項？", "o": ["消費者保護團體", "消費爭議調解委員會", "消費者服務中心", "消費者保護委員會"], "a": 2}, {"id": "3-1-21", "c": 3, "s": 1, "n": "21", "p": 63, "q": "消費者保護法針對小額消費爭議，請問下列何者正確？", "o": ["小額消費爭議額度，由行政院定之", "當事人一方無正當理由，未到調解者，則調解委員不得進行調解", "有關解決方案之送達，可適用公示送達之規定", "小額消費爭議額度為100萬元"], "a": 0}, {"id": "3-1-22", "c": 3, "s": 1, "n": "22", "p": 63, "q": "依照消費者保護法及其相關規定，企業經營者對於消費者之申訴，應於申訴之日起幾日內妥適處理之？", "o": ["30日", "25日", "20日", "15日"], "a": 3}, {"id": "3-1-23", "c": 3, "s": 1, "n": "23", "p": 63, "q": "依照消費者保護法及其相關規定，依消費者保護法規定，有關主管機關對於企業經營者提供租賃住宅商品出租予消費者所為之行政監督的敘述，下列何者錯誤？", "o": ["建商拒絕、規避主管機關之調查，經直轄市政府、縣（市）政府核准者，得命停止營業", "主管機關認為確有損害消費者財產之虞者，應命其限期改善或採取其他必要措施", "主管機關對消費者有發生重大損害之虞而情況危急時，應即在大眾傳播媒體公告企業經營者之名稱", "主管機關認為有損害消費者財產之虞者，應即進行調查並得公開其經過與結果"], "a": 0}, {"id": "3-1-24", "c": 3, "s": 1, "n": "24", "p": 63, "q": "依照消費者保護法及其相關規定，政府為達成制定消費者保護法之目的，應就某些事項有關之法規及其執行情形，定期檢討、協調、改進之，下列何者不屬之？", "o": ["維護商品或服務之品質與安全衛生", "防止商品或服務損害消費者之生命、身體、健康、財產或其他權益", "確保商品或服務之標示，符合法令規定", "促進事業品牌形象或商譽維護"], "a": 3}, {"id": "3-1-25", "c": 3, "s": 1, "n": "25", "p": 63, "q": "依照消費者保護法及其相關規定，企業經營者違反本法第26條規定，未提供必要之包裝，經主管機關通知改正而逾期不改正者，處多少金額罰鍰？", "o": ["處新臺幣2萬元以上20萬元以下罰鍰", "處新臺幣3萬元以上30萬元以下罰鍰", "處新臺幣4萬元以上40萬元以下罰鍰", "處新臺幣1萬元以上10萬元以下罰鍰"], "a": 0}, {"id": "3-1-26", "c": 3, "s": 1, "n": "26", "p": 64, "q": "依消費者保護法規定，下列何者不可能為消費爭議調解委員會之委員？", "o": ["直轄市、縣(市)政府代表", "立法委員", "消費者保護官", "消費者保護團體代表"], "a": 1}, {"id": "3-1-27", "c": 3, "s": 1, "n": "27", "p": 64, "q": "依消費者保護法規定，下列有關企業經營者之敘述何者正確？", "o": ["企業經營者對消費者或第三人之損害賠償責任，經與消費者個別磋商，得預先約定限制或免除", "輸入商品或服務之企業經營者，視為從事經銷之企業經營者", "從事經銷之企業經營者，就商品所生之損害，與商品製造者連帶負賠償責任。但對於損害之防免已盡相當之注意，或縱加以相當之注意而仍不免發生損害者，不在此限", "從事設計、生產、製造商品或提供服務之企業經營者，違反消費者保護法規定致生損害於消費者，若企業經營者能證明其無過失者，法院得免除其賠償責任"], "a": 2}, {"id": "3-1-28", "c": 3, "s": 1, "n": "28", "p": 64, "q": "依照消費者保護法及其相關規定，消費者保護團體依消費者保護法第49條規定提起訴訟。下列敘述何者正確？", "o": ["應經消費者保護基金會的同意，始得提起該訴訟", "如已置有消費者保護專門人員，則可不委任律師代理訴訟", "如委任律師代理訴訟，該律師不得請求預付必要費用", "消費者保護團體非被害人，但仍得為該訴訟原告"], "a": 3}, {"id": "3-1-29", "c": 3, "s": 1, "n": "29", "p": 64, "q": "依照消費者保護法及其相關規定，因同一消費關係而被害之甲、乙、丙，依民事訴訟法之規定，選定甲與乙起訴請求損害賠償，以下敘述何者正確？", "o": ["此為法定訴訟擔當", "甲與乙稱為選定人", "甲與乙稱為選定當事人", "該訴訟係屬中，同一消費關係之其他被害人丁與戊在法院判決前，均得併案請求賠償"], "a": 2}, {"id": "3-1-30", "c": 3, "s": 1, "n": "30", "p": 64, "q": "依照消費者保護法及其相關規定，消費者甲向企業經營者乙提起消費訴訟，下列敘述何者正確？", "o": ["法院為甲敗訴之判決時，得依職權宣告為減少擔保之假執行。果爾，乙得在判決確定前，聲請法院強制執行甲的財產", "法院為乙敗訴之判決時，得依職權宣告為免除擔保之假處分", "法院為乙敗訴之判決時，得依職權宣告為減少擔保之假扣押", "法院為乙敗訴之判決時，得依職權宣告為免除擔保之假執行。果爾，甲得在判決確定前，聲請法院強制執行乙的財產"], "a": 3}, {"id": "3-1-31", "c": 3, "s": 1, "n": "31", "p": 65, "q": "依照消費者保護法及其相關規定，甲慈善事業的慈善經營方式是以一般價格購買商品後，將其便宜賣給貧困者。貧困者乙向甲便宜購買商品，如因而受有身體上的損害，請問乙主張甲就此應負商品責任，有無理由？", "o": ["有理由，因為甲應負不完全給付的商品責任", "有理由，因為甲反覆為此行為並以此為業", "無理由，因為甲的行為並非以營利為目的", "無理由，因為人身損害並非商品責任所規範"], "a": 1}, {"id": "3-1-32", "c": 3, "s": 1, "n": "32", "p": 65, "q": "依照消費者保護法及其相關規定，設若消費者保護基金會對於同一之原因事件，致使眾多消費者受害時，受讓甲、乙、丙等20位消費者損害賠償請求權後，以自己名義，提起消費訴訟。以下敘述何者正確？", "o": ["如甲僅有非財產上損害賠償請求權，因該權利具一身專屬性，故不得讓與給消費者保護基金會", "該訴訟中，如乙終止讓與損害賠償請求權，消費者保護基金會仍具當事人適格", "在該訴訟判決前，丙均得終止讓與損害賠償請求權，並通知法院", "消費者保護基金會應將該訴訟結果所得賠償，交付甲、乙、丙等20位消費者，不得扣除訴訟費用"], "a": 1}, {"id": "3-1-33", "c": 3, "s": 1, "n": "33", "p": 65, "q": "依消費者保護法規定，下列有關調解之敘述何者正確？", "o": ["消費爭議調解委員會，由委員互推主席", "依消費者保護法第45條之2，有關一般消費爭議經委員會依職權調解提出之解決方案，應經全體調解委員全體同意", "當事人對委員會依職權調解之方案，得於送達後15日之不變期間內，提出異議", "調解成立者應作成調解書。調解書之作成及效力，準用鄉鎮市調解條例第25條至第29條之規定"], "a": 3}, {"id": "3-1-34", "c": 3, "s": 1, "n": "34", "p": 65, "q": "依照消費者保護法及其相關規定，甲為廣告主，乙為企業經營者，乙委託甲刊登有關於自家商品的廣告，甲知情乙家商品卻與廣告內容事實不符卻依然刊登其廣告，導致消費者丙因信賴廣告所受損失，以下敘述何者不正確？", "o": ["乙應確保廣告內容之真實，對消費者所負之義務不得低於廣告之內容", "甲只是受乙的委託刊登廣告，因此不必負任何責任", "丙因商品而受之損害可向消費者保護團體申訴", "若丙向消費者保護團體申訴未受妥適處理時，可向消費爭議調解委員會申請調解"], "a": 1}, {"id": "3-1-35", "c": 3, "s": 1, "n": "35", "p": 66, "q": "依照消費者保護法及其相關規定，發生消費爭議時，租賃住宅服務業對於消費者之申訴，依消費者保護法之規定，應於申訴之日起幾日內妥適處理之？", "o": ["5日", "10日", "15日", "20日"], "a": 2}, {"id": "3-1-36", "c": 3, "s": 1, "n": "36", "p": 66, "q": "依照消費者保護法及其相關規定，租賃住宅管理公司因同一原因事件，致使眾多租屋者受害時，依消費者保護法規定，消費者保護團體得受讓多少人以上之購屋者的損害賠償請求權後，以自己名義提起訴訟？", "o": ["10人", "20人", "30人", "50人"], "a": 1}, {"id": "3-1-37", "c": 3, "s": 1, "n": "37", "p": 66, "q": "消費者與租賃住宅管理經營者因商品或服務發生消費爭議時，依消費者保護法之規定，關於爭議的解決方式，下列敘述何者正確？", "o": ["企業經營者得向租賃住宅管理業經營者、消費者保護團體或消費者服務中心或其分中心申訴", "消費者得逕向直轄市或縣（市）消費爭議調解委員會申請調解", "調解程序，於直轄市、縣（市）政府或其他適當之處所行之，其程序得不公開", "調解委員、列席協同調解人及其他經辦調解事務之人，對於調解事件之內容，應予公開"], "a": 2}, {"id": "3-1-38", "c": 3, "s": 1, "n": "38", "p": 66, "q": "依消費者保護法之規定，下列有關定型化契約條款之敘述，何者錯誤？", "o": ["定型化契約中之定型化契約條款牴觸個別磋商條款之約定者，其牴觸部分無效", "定型化契約中之條款違反誠信原則，對消費者顯失公平者，無效", "定型化契約條款如有疑義時，應本平等互惠之原則解釋", "定型化契約條款未經記載於定型化契約中而依正常情形顯非消費者所得預見者，該條款不構成契約之內容"], "a": 2}, {"id": "3-1-39", "c": 3, "s": 1, "n": "39", "p": 67, "q": "依照消費者保護法及其相關規定，關於消費爭議調解委員會的敘述，下列何者正確？", "o": ["直轄市、縣（市）政府應設消費爭議調解委員會，置委員5至11名", "調解程序，於直轄市、縣（市）政府或其他適當之處所行之，其程序應公開", "關於消費爭議之調解，當事人不能合意但已甚接近者，調解委員得斟酌一切情形，求兩造利益之平衡，於不違反兩造當事人之主要意思範圍內，依職權提出解決事件之方案，並送達於當事人", "當事人對於經參與調解委員過半數同意提出解決事件之方案，得於送達後20日之不變期間內，提出異議"], "a": 2}, {"id": "3-1-40", "c": 3, "s": 1, "n": "40", "p": 67, "q": "依照消費者保護法及其相關規定，關於定型化契約審閱期的敘述，下列何者正確？", "o": ["定型化契約條款審閱期如有疑義時，應探求企業經營者之真意，不得拘泥於所用之文字", "企業經營者與消費者訂立定型化契約前，應有10日以內之合理期間，供消費者審閱全部條款內容", "企業經營者以定型化契約條款使消費者拋棄審閱權利者，雖非無效，但消費者得撤銷其意思表示", "違反審閱期規定者，其條款不構成契約之內容。但消費者得主張該條款仍構成契約之內容"], "a": 3}, {"id": "3-1-41", "c": 3, "s": 1, "n": "41", "p": 67, "q": "依消費者保護法規定，下列敘述何者正確？", "o": ["企業經營者於商品或服務具有危害消費者生命、身體、健康、財產之可能者，未於明顯處為警告標示及緊急處理危險之方法者應負賠償責任。但企業經營者能證明其無過失者，法院得減輕或免除其賠償責任", "商品或服務因其後有較佳之商品或服務，得被推定不符合當時科技或專業水準可合理期待之安全性", "從事經銷之企業經營者，改裝、分裝商品或變更服務內容者，視為從事設計、生產、製造商品或提供服務之企業經營者", "企業經營者對消費者或第三人之損害賠償責任，得預先約定限制但不得約定免除"], "a": 2}, {"id": "3-1-42", "c": 3, "s": 1, "n": "42", "p": 68, "q": "依照消費者保護法及其相關規定，針對臺灣社會發生食品安全問題（如黑心油），消費者得依消費者保護法第50條所定消費者保護團體訴訟（以下簡稱「消保團體訴訟」）尋求救濟。下列敘述何者正確？", "o": ["多數受害之消費者得申請組成消保團體之組織，以便立即以團體自己名義，逕向法院提起消費者團體損害訴訟", "消保團體於受讓20人以上消費者損害賠償請求權，得以自己名義提起訴訟。消費者於言詞辯論終結前，不得終止讓與該損害賠償請求權", "消保團體依法提出消保團體訴訟者，應委任律師代理訴訟", "消保團體就消費者團體損害賠償訴訟，於扣除訴訟、支付予律師之必要費用以及得向消費者請求之報酬後，將訴訟結果所得之賠償交付該讓與請求權之消費者"], "a": 2}, {"id": "3-1-43", "c": 3, "s": 1, "n": "43", "p": 68, "q": "依照消費者保護法及其相關規定，企業經營者於下列違反消費者保護法之情形，何者所適用罰則所定之法定罰鍰額度為最高？", "o": ["地方政府針對企業經營者提供之商品或服務，經調查認為確有損害消費者身體健康者，命其為限期回收或其他必要處置，而企業經營者拒不遵從者", "企業經營者未依商品標示法等法令為商品或服務之標示", "企業經營者對消費者保證商品或服務之品質時，未主動出具書面保證書", "企業經營者使用定型化契約時，拒絕、規避或阻撓主管機關之派員查核"], "a": 0}, {"id": "3-1-44", "c": 3, "s": 1, "n": "44", "p": 68, "q": "依消費者保護法規定，關於消費爭議之處理，當事人對於調解委員依職權提出之解決方案若有異議，最遲得於送達後幾日內提出？", "o": ["7日", "10日", "15日", "20日"], "a": 1}, {"id": "3-1-45", "c": 3, "s": 1, "n": "45", "p": 68, "q": "下列何者不是消費者保護法第12條所規定推定定型化契約條款顯失公平之情形？", "o": ["契約之主要權利或義務，因受條款之限制，致契約之目的難以達成者", "條款與其所排除不予適用之任意規定之立法意旨顯相矛盾者", "違反平等互惠原則者", "契約之主要權利或義務，因受條款之限制，致契約之目的可以達成者"], "a": 3}, {"id": "3-1-46", "c": 3, "s": 1, "n": "46", "p": 69, "q": "下列何者非屬於內政部依消費者保護法之規定所訂定之定型化契約應記載不得記載事項類型？", "o": ["住宅轉租定型化契約應記載及不得記載事項", "租賃住宅委託管理定型化契約應記載及不得記載事項", "住宅屋租賃定型化契約應記載及不得記載事項", "住宅包租契約應約定及不得約定事項"], "a": 3}, {"id": "3-1-47", "c": 3, "s": 1, "n": "47", "p": 69, "q": "某甲廠商對於某乙消費者之申訴，依消費者保護法規定，應於申訴之日起幾日內妥適處理？", "o": ["3個月", "30日", "15日", "20日"], "a": 2}, {"id": "3-1-48", "c": 3, "s": 1, "n": "48", "p": 69, "q": "依消費者保護法規定，關於定型化契約之審閱期間，下列敘述何者錯誤？", "o": ["應有30日以內之合理審閱期間", "企業經營者以定型化契約條款使消費者拋棄合理審閱期權利者，無效", "違反合理審閱期規定者，該條款無效", "中央主管機關得選擇特定行業，參酌定型化契約條款之重要性等事項，公告定型化契約之審閱期間"], "a": 2}, {"id": "3-1-49", "c": 3, "s": 1, "n": "49", "p": 69, "q": "依照消費者保護法及其相關規定，定型化契約中之定型化契約條款牴觸個別磋商條款之約定者，其牴觸部分？", "o": ["效力未定", "無效", "構成契約之內容", "不得撤銷"], "a": 1}, {"id": "3-1-50", "c": 3, "s": 1, "n": "50", "p": 69, "q": "下列何項原則不屬於消費者保護法中有關定型化契約的基本原則規定？", "o": ["契約中所用之條款，應本平等互惠之原則", "契約條款如有疑義時，應為有利於消費者之解釋原則", "契約條款應有價格合理之保證原則", "對消費者之損害賠償責任，不得預先約定限制或免除"], "a": 2}, {"id": "3-1-51", "c": 3, "s": 1, "n": "51", "p": 69, "q": "依照消費者保護法及其相關規定，定型化契約中之定型化契約條款牴觸個別磋商條款之約定者，下列何者正確？", "o": ["個別磋商條款之約定者無效", "定型化契約條款無效", "定型化契約條款部分無效", "定型化契約條款有效"], "a": 1}, {"id": "3-1-52", "c": 3, "s": 1, "n": "52", "p": 70, "q": "依照消費者保護法及其相關規定，企業經營者對於消費者之申訴，其法定之處理期限為多久？", "o": ["7日", "10日", "15日", "20日"], "a": 2}, {"id": "3-1-53", "c": 3, "s": 1, "n": "53", "p": 70, "q": "有關消費者保護法所稱主管機關，下列何者正確?", "o": ["行政院消費者保護會", "臺中市政府", "高雄市消費爭議調解委員會", "彰化縣消費者服務中心"], "a": 1}, {"id": "3-1-54", "c": 3, "s": 1, "n": "54", "p": 70, "q": "依照消費者保護法及其相關規定，企業經營者有下列何者情形，處新臺幣15萬元以上150萬元以下罰鍰?", "o": ["企業經營者提供之商品或服務，經調查認有損害消費者生命、身體、健康或財產，或確有損害之虞", "企業經營者提供之商品或服務，對消費者已發生重大損害或有發生重大損害之虞", "企業經營者規避、妨礙或拒絕主管機關依第33條規定所為之調查者", "企業經營者規避、妨礙或拒絕主管機關依第17條第6項規定所為之調查者"], "a": 1}, {"id": "3-1-55", "c": 3, "s": 1, "n": "55", "p": 70, "q": "依照消費者保護法及其相關規定，企業經營者有下列何者情形，所處罰鍰額度最高?", "o": ["企業經營者提供之商品或服務，經調查認有損害消費者生命、身體、健康或財產，或確有損害之虞", "企業經營者提供之商品或服務，對消費者已發生重大損害或有發生重大損害之虞", "企業經營者規避、妨礙或拒絕主管機關依第33條規定所為之調查者", "企業經營者規避、妨礙或拒絕主管機關依第十七條第六項規定所為之調查者"], "a": 1}, {"id": "3-1-56", "c": 3, "s": 1, "n": "56", "p": 71, "q": "依照消費者保護法及其相關規定，企業經營者有下列何者情
